 frag grenade\" per the framework's own description - roughly double the blast and fragmentation dice of a standard hand grenade (3d[3d]) to reflect a much larger warhead, giving 6d cr ex [6d]; it has no armor divisor and is not intended to threaten anything on the vehicle AV table, only infantry and light cover, so it is not rescaled alongside Krak. Flakk: the frag warhead's dice with a proximity fuze instead of impact/frag optimisation, at one die less since more of the casing goes into the fuze and less into the frag liner; it is not rated against ground DR at all. Acc/range/RoF/Bulk are shared across usages since they describe the launcher, not the warhead, and are built as a shoulder-fired tube (lower ST and Bulk penalty than the tripod weapons above, since one Guardsman carries and fires it solo).","weapons":[{"melee":false,"usage":"Frag missile","damage":"6d cr ex [6d cut]","skill":"Gunner (Rockets)","notes":"","accuracy":"10","range":"100/1800","rate_of_fire":"1","shots":"1(4)","strength":"9","bulk":"-7","recoil":"1"},{"melee":false,"usage":"Krak missile","damage":"6dx6(3) cr","skill":"Gunner (Rockets)","notes":"","accuracy":"10","range":"100/1800","rate_of_fire":"1","shots":"1(4)","strength":"9","bulk":"-7","recoil":"1"},{"melee":false,"usage":"Flakk missile (vs. aircraft, proximity-fused)","damage":"5d cr ex [5d cut]","skill":"Gunner (Rockets)","notes":"","accuracy":"10","range":"100/1800","rate_of_fire":"1","shots":"1(4)","strength":"9","bulk":"-7","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Frag Missile","tl":"8","lc":"2","cost":"300","weight":"9 lb","qty":1,"tags":["Imperium","Astra Militarum","Ammunition"],"ref":null,"notes":"One shot for the missile launcher's frag usage.","lore":"Standard load for clearing infantry and soft cover.","design":"Ammunition line for the frag usage above; damage and derivation are given there.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Krak Missile","tl":"8","lc":"2","cost":"500","weight":"10 lb","qty":1,"tags":["Imperium","Astra Militarum","Ammunition"],"ref":null,"notes":"One shot for the missile launcher's krak usage.","lore":"The squad's answer to light and medium armour.","design":"Ammunition line for the krak usage above; damage and derivation are given there.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Flakk Missile","tl":"8","lc":"2","cost":"600","weight":"10 lb","qty":1,"tags":["Imperium","Astra Militarum","Ammunition"],"ref":null,"notes":"One shot for the missile launcher's flakk usage; useless against ground targets.","lore":"A rarer load issued when air cover is expected, first widely catalogued in later Guard background material.","design":"Ammunition line for the flakk usage above; damage and derivation are given there.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Assault Cannon (Soulreaper Pattern)","tl":"10","lc":"1","cost":"20000","weight":"55 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"Arm- or hip-socket mounted on Terminator armour, or carried and fired one-handed by an Astartes on a stabilising harness; ST 15 assumes Astartes-grade strength rather than a tripod.","lore":"Devastator squads and Terminators use the multi-barrelled assault cannon (also fielded by Chaos as the Soulreaper cannon) as a close-to-mid-range storm of solid shot for shredding infantry, light vehicles and swarms; it is fired solid rounds rather than bolts, which is why it sits outside the bolt-weapon family, and fiction almost always pairs it with a melee specialist (power fist, thunder hammer) on the same Terminator rather than relying on it against tanks.","design":"No framework anchor, so it's built parallel to the heavy bolter anchor (7dx2(2) pi++, follow-up 8d cr ex) rather than copied from it: the assault cannon fires solid rotary-autocannon-style rounds with no explosive follow-up and a lower pi+ wound multiplier (dense solid shot, not a mass-reactive bolt), so it drops the follow-up term and scales the base damage down two dice (5d instead of 7d) in exchange for a much higher RoF (10 vs. the heavy bolter's typical squad-support RoF), matching its fluff role as a horde-clearing hail of fire rather than a hard-hitting single line of shots. Checked with the exact dice distribution (5dx2(2) pi+, avg 35) against the vehicle AV table: even at RoF 10, no single round reliably clears AV10's effective DR 50 (only 1.6% per shot), so it cannot reliably beat any vehicle on the table - consistent with Astartes fiction, where the assault cannon is a horde/infantry weapon and its wielder relies on a paired melee weapon (power fist, thunder hammer) or a squadmate's lascannon/missile launcher against real armour. LC1 follows the framework's Astartes-gear bracket (alongside bolters and plasma) rather than the Guard's LC2 heavy-weapon bracket.","weapons":[{"melee":false,"usage":"Sustained fire","damage":"5dx2(2) pi+","skill":"Gunner (Machine Gun)","notes":"","accuracy":"5","range":"500/1500","rate_of_fire":"10","shots":"200(20)","strength":"15","bulk":"-6","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Assault Cannon Ammunition Hopper (200)","tl":"10","lc":"1","cost":"400","weight":"18 lb","qty":1,"tags":["Imperium","Adeptus Astartes","Ammunition"],"ref":null,"notes":"One full hopper load per the assault cannon's shots rating.","lore":"Fed from a drum or backpack hopper rather than a magazine, matching depictions of sustained rotary fire.","design":"Generic ammunition line; not separately anchored.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Mortar","tl":"6","lc":"2","cost":"2000","weight":"40 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"Baseplate, bipod and tube break down for a three-man crew to carry; minimum range reflects the bomb's arming distance, not a targeting limit. Uses the indirect-fire rules under Artillery, not a direct line of sight.","lore":"The mortar is the Guard's simplest and most ubiquitous indirect-fire support weapon, issued down to platoon level in Guard fiction for exactly the reason real-world mortars are: cheap, rugged, easy to manufacture on almost any forge world, and effective against dug-in infantry and soft targets beyond line of sight.","design":"No framework anchor, so it's placed at the bottom of the TL table deliberately - mortar tube technology is older and simpler than lasguns, stubbers or rockets, which is exactly why every regiment from a hive world to a feral-world levy can field one. Damage is built the same way as the missile launcher's frag warhead (B414 fragmentation, \"big frag grenade\" scaling) but roughly doubled again, since a mortar bomb is not weight-constrained by a rocket motor and can devote more of its mass to filler and casing, giving 6dx2 cr ex [6d]. It carries no armor divisor and is not intended to be checked against the vehicle AV table at all - its role in the fiction is area denial and infantry suppression, not armour-killing, so unlike the autocannon, krak missile or lascannon above it has no reliably/ sometimes/cannot-beat line against AV10-14.","weapons":[{"melee":false,"usage":"Indirect fire, HE bomb","damage":"6dx2 cr ex [6d cut]","skill":"Artillery (Mortar)","notes":"","accuracy":"3","range":"100/3600","rate_of_fire":"1","shots":"1(4)","strength":"8","bulk":"-6","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Mortar Bomb, HE (1)","tl":"6","lc":"2","cost":"60","weight":"8 lb","qty":1,"tags":["Imperium","Astra Militarum","Ammunition"],"ref":null,"notes":"One round for the mortar.","lore":"Carried in padded satchels by the mortar team's loader/ammo carrier.","design":"Ammunition line for the mortar's HE usage above; damage and derivation are given there.","weapons":[],"feat":{"dr":[],"other":[]}}],"count":14},{"id":"imperium--weapons--las-weapons","title":"Las Weapons","section":"Imperium/Weapons","kind":"equipment","path":"Imperium/Weapons/Las Weapons.eqp","items":[{"name":"Laspistol, Common Pattern","tl":"10","lc":"3","cost":"150","weight":"2.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"The commonest sidearm in the Imperium: issued to Guard officers, Munitorum staff, hive militia and anyone who rates a weapon above a stub pistol. Depicted constantly across Black Library Guard fiction (Gaunt's Ghosts, the Ciaphas Cain novels) as the backup weapon of choice once a soldier's lasgun runs dry or their hands are full.","design":"Damage is the fixed laspistol anchor (3d(2) burn). Average roll 10.5 already kills an unarmoured man (HP 10) in 1-2 hits per framework.md; the (2) divisor is carried by every las weapon in the post-Rescale lineup so a laspistol still means something against flak (DR 12): 3d(2) penetrates 90.7% of hits there, but never against carapace (DR 45, effective 22.5) — 0% of hits get through. Acc, range, RoF and shot count are not anchored, so they're built from scratch for a hand-held energy pistol: a smaller accumulator than a lasgun's gives roughly half the lasgun's shot count (30 vs. 60), and the short emitter keeps Bulk and ST modest. RoF 3 represents the selector's rapid-pulse setting rather than a sustained full-auto mode.","weapons":[{"melee":false,"usage":"Standard","damage":"3d(2) burn","skill":"Beam Weapons (Pistol)","notes":"","accuracy":"2","range":"120/360","rate_of_fire":"3","shots":"30(3)","strength":"5","bulk":"-2","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Laspistol, Compact \"Hostile Environment\" Pattern","tl":"10","lc":"3","cost":"180","weight":"2 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"A shortened laspistol favoured by commissars and naval officers who need a weapon that won't print under a greatcoat; several Commissar characters across Guard fiction are shown carrying a compact sidearm distinct from a trooper's full-size laspistol, though no single novel gives it a formal designation, so \"Hostile Environment Pattern\" here is a descriptive label rather than an attested in-universe name.","design":"Damage stays at the fixed laspistol anchor (3d(2) burn) — shrinking the emitter doesn't change the lasing chemistry or the focusing coil that gives it the (2) divisor, only its housing. A smaller cell drops the shot count to 20 and shortens effective range; the shorter barrel worsens Acc by 1 but improves Bulk to -1, which is the standard GURPS trade a concealable pistol makes against a full-size one.","weapons":[{"melee":false,"usage":"Standard","damage":"3d(2) burn","skill":"Beam Weapons (Pistol)","notes":"","accuracy":"1","range":"80/240","rate_of_fire":"3","shots":"20(3)","strength":"5","bulk":"-1","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Lasgun, Kantrael Pattern","tl":"10","lc":"3","cost":"500","weight":"8 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"The most widely issued lasgun in the Astra Militarum, standard Departmento Munitorum pattern and the rifle carried by the Cadian shock troops in codex background and countless Black Library novels. Some Munitorum logistics texts refer to the same basic mass-production design as \"M-Galaxy pattern\"; this entry treats the two names as the same underlying weapon rather than asserting they're formally distinct.","design":"Damage is the fixed lasgun anchor (5d(2) burn). Range/RoF/shots are not anchored and are built to match the lasgun's lore signature: a 60-shot accumulator that recharges off almost any power source, and a fire selector giving single, burst and full-auto settings (abstracted here as RoF 10 for full-auto; treat single fire as RoF 1 at the GM's discretion). Required lasgun-vs-armour check (framework.md, exact dice distribution): 5d(2) averages 17.5 and penetrates flak (DR 12, effective 6) on 99.9% of hits, matching \"punches flak\"; against carapace (DR 45, effective 22.5) it penetrates only 9.8% of hits, matching \"penetrates carapace about one hit in ten\"; against Astartes power armour (DR 100, effective 50) it penetrates 0% of hits, matching \"useless against power armour.\" No departure from the anchor was needed — the numbers check out as written. The Hot-shot pack usage reuses the hellgun anchor (6d(3) burn) exactly, since a hot-shot pack is explicitly the same overcharge trick as a hellgun's power cell, just dropped into an ordinary lasgun for one shot. The Overcharge usage is a milder, non-hellgun field expedient stepped up from the lasgun anchor: +1 die (6d burn, average 21), no armour divisor, limited shots — it still only clears flak (98.0% of hits) and fails against carapace (0% of hits), because the whole point of the divisor is what an overcharge pack doesn't add.","weapons":[{"melee":false,"usage":"Standard","damage":"5d(2) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"6","range":"300/900","rate_of_fire":"10","shots":"60(3)","strength":"6","bulk":"-4","recoil":"1"},{"melee":false,"usage":"Hot-shot pack","damage":"6d(3) burn","skill":"Beam Weapons (Rifle)","notes":"Fired with a Hot-Shot Power Pack loaded in place of the standard charge pack. The cell is spent after this one shot, and firing a second hot-shot round without replacing the pack risks cooking off or fusing the lasing chamber (GM's call).","accuracy":"6","range":"300/900","rate_of_fire":"1","shots":"1(3)","strength":"6","bulk":"-4","recoil":"1"},{"melee":false,"usage":"Overcharge shot","damage":"6d burn","skill":"Beam Weapons (Rifle)","notes":"Fired from an Overcharge Power Pack: one extra die of damage over the standard shot, but no armour divisor, and the deliberately overloaded cell only lasts for 10 such shots and increases the odds of a jam or a scorched barrel on any given shot (GM's call).","accuracy":"6","range":"300/900","rate_of_fire":"1","shots":"10(3)","strength":"6","bulk":"-4","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Lasgun, Mars Pattern","tl":"10","lc":"3","cost":"650","weight":"9.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Mechanicus"],"ref":null,"lore":"Forge-produced to exacting Mechanicus ritual-specification, the Mars pattern is prized for durability and is common among Skitarii auxilia and Mechanicus-aligned regiments; codex and Forge World background repeatedly single it out as the most rugged of the mass-production lasgun patterns.","design":"Same fixed lasgun anchor (5d(2) burn) as every pattern in this family — the difference is build quality, not lasing power. Extra shielding and a reinforced housing add roughly 1.5 lb and 1 ST over the Kantrael baseline and justify the higher cost. GCS has no reliability/ malfunction stat, so the pattern's noted ruggedness is left as lore flavour rather than a mechanical bonus.","weapons":[{"melee":false,"usage":"Standard","damage":"5d(2) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"6","range":"300/900","rate_of_fire":"10","shots":"60(3)","strength":"7","bulk":"-4","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Lasgun, Accatran Pattern","tl":"10","lc":"3","cost":"520","weight":"8.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"Sealed-housing pattern associated with the Death Korps of Krieg, built for trench warfare, gas attack and sustained exposure to mud and ash — a design emphasis that recurs throughout Krieg background art and Forge World material.","design":"Damage fixed at the lasgun anchor (5d(2) burn); the sealed barrel shroud that keeps mud and gas out marginally shortens the beam path, modelled as a small range reduction (280/840 vs. the Kantrael's 300/900) rather than any change to the fixed damage figure.","weapons":[{"melee":false,"usage":"Standard","damage":"5d(2) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"6","range":"280/840","rate_of_fire":"10","shots":"60(3)","strength":"6","bulk":"-4","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Lasgun, Lucius Pattern","tl":"10","lc":"3","cost":"550","weight":"6.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"A lighter, sleeker lasgun pattern; Gaunt's Ghosts establishes the Tanith First's lasguns as this pattern, and the novels note it as reliable but less tolerant of mud and rough handling than the heavier Munitorum-standard patterns.","design":"Damage fixed at the lasgun anchor (5d(2) burn) — a slimmer frame doesn't change the lasing chamber's output. The lighter build lowers ST requirement and improves Bulk to -3 (vs. -4 for the Kantrael/Mars/ Accatran patterns), reflecting the more compact, less rugged design. Its documented fragility in mud has no GCS reliability stat to hang on, so it's recorded here as flavour only.","weapons":[{"melee":false,"usage":"Standard","damage":"5d(2) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"6","range":"300/900","rate_of_fire":"10","shots":"60(3)","strength":"5","bulk":"-3","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Lasgun, Triplex Pattern","tl":"10","lc":"3","cost":"560","weight":"8.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"Named for its three-position fire selector, the Triplex pattern adds a mechanical 3-round burst mode on top of the usual single/full-auto options found across the standard lasgun family.","design":"Damage fixed at the lasgun anchor (5d(2) burn) for both modes — the selector changes how the shots are grouped, not the lasing output. The controlled 3-round burst gets a +1 Acc bump over the full-auto line (7 vs. 6) to represent the tighter grouping a mechanical burst limiter gives compared to unrestrained full-auto fire.","weapons":[{"melee":false,"usage":"Burst (3-round)","damage":"5d(2) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"7","range":"300/900","rate_of_fire":"3","shots":"60(3)","strength":"6","bulk":"-4","recoil":"1"},{"melee":false,"usage":"Full Auto","damage":"5d(2) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"6","range":"300/900","rate_of_fire":"10","shots":"60(3)","strength":"6","bulk":"-4","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Lascarbine","tl":"10","lc":"3","cost":"480","weight":"6 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"A cut-down lasgun issued to vehicle crew, tank riders and scouts who need something more compact than a full-length rifle; short-barrelled lasguns of this kind appear throughout Guard fiction as tank-crew and support-trooper sidearms.","design":"Damage fixed at the lasgun anchor (5d(2) burn); the lasing chemistry that produces that figure doesn't depend on barrel length the way a slugthrower's velocity does, so the carbine's shorter emitter only costs Acc and effective range (5/200-600 vs. the full lasgun's 6/300-900) while buying a much better Bulk (-2) for cramped vehicle interiors.","weapons":[{"melee":false,"usage":"Standard","damage":"5d(2) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"5","range":"200/600","rate_of_fire":"10","shots":"60(3)","strength":"5","bulk":"-2","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Long-Las","tl":"10","lc":"2","cost":"1200","weight":"11 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"A sniper-modified lasgun with an added focusing lens and a stabilised barrel; Gaunt's Ghosts' marksman Mad Larkin's long-las is the best known example, and the weapon recurs as the Guard's standard sniper tool across Black Library fiction.","design":"Damage is the fixed long-las anchor (6d(2) burn), one die over the standard lasgun — an extra focusing chamber concentrates more energy per shot at the cost of rate of fire, and keeps the same (2) divisor family-wide. Average roll 21 makes flak (DR 12) meaningless (100% of hits penetrate) and gets through carapace (DR 45, effective 22.5) on 36.3% of hits, comfortably better than the lasgun's 9.8% and matching the long-las's role as the harder-hitting sniper pattern; it still fails outright against Astartes power armour (0% of hits). RoF drops to 1 (no autofire mechanism survives the rebuild) and the custom cell holds fewer shots than a stock lasgun. Acc rises to 9 for the integral scope, and Bulk worsens to -6 for the longer, heavier weapon, following the usual GURPS convention for a dedicated sniper rifle.","weapons":[{"melee":false,"usage":"Standard","damage":"6d(2) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"9","range":"600/1800","rate_of_fire":"1","shots":"20(3)","strength":"7","bulk":"-6","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Hellpistol","tl":"11","lc":"2","cost":"700","weight":"3 lb","qty":1,"tags":["Missile Weapon","Imperium","Militarum Tempestus"],"ref":null,"lore":"A compact hot-shot sidearm issued alongside the hellgun to Militarum Tempestus officers and Inquisitorial agents who need a backup weapon that can still trouble carapace armour.","design":"Scaled from the hellgun anchor (6d(3) burn) the same way the laspistol steps down one die from the lasgun: -1d, armour divisor unchanged. The (3) divisor is what lets it beat carapace at all — that's the entire point of the hot-shot family, so it carries over unmodified. Average roll 17.5 against carapace (DR 45, effective 15) penetrates 69.5% of hits: a real threat, if less reliable than the full-size hellgun's 90.4%. Shot count is lower than an ordinary laspistol's because a hot-shot cell packs more energy per shot into the same volume, so it burns out faster.","weapons":[{"melee":false,"usage":"Standard","damage":"5d(3) burn","skill":"Beam Weapons (Pistol)","notes":"","accuracy":"2","range":"100/300","rate_of_fire":"3","shots":"16(3)","strength":"6","bulk":"-2","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Hellgun","tl":"11","lc":"2","cost":"1600","weight":"9 lb","qty":1,"tags":["Missile Weapon","Imperium","Militarum Tempestus"],"ref":null,"lore":"The signature weapon of the Militarum Tempestus Scions, an overcharged lasgun-pattern rifle purpose-built to beat armour a standard lasgun can't; its role as the carapace-killer of Imperial small arms is consistent background across Scion-focused fiction and codex material.","design":"Damage is the fixed hellgun anchor (6d(3) burn) exactly. Sanity check against the framework's stated purpose, computed by exact dice distribution: average roll 21, armour divisor 3 cuts carapace's DR 45 to an effective 15, so 6d(3) penetrates carapace on 90.4% of hits — it reliably beats carapace, confirming \"built to beat carapace\" with no adjustment needed. Against Sororitas power armour (DR 70, effective 23.3) it still gets through 27.9% of the time; against Astartes power armour (DR 100, effective 33.3) that drops to 0.1%, essentially none, matching hellgun's place below the boltgun as an infantry-scale weapon. Shot count (40) is lower than a standard lasgun's 60 to reflect the hungrier, hotter cell; ST is bumped to 7 for the heavier housing needed to safely contain the higher-energy discharge.","weapons":[{"melee":false,"usage":"Standard","damage":"6d(3) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"6","range":"280/840","rate_of_fire":"10","shots":"40(3)","strength":"7","bulk":"-4","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Hot-Shot Volley Gun","tl":"11","lc":"2","cost":"4200","weight":"30 lb","qty":1,"tags":["Missile Weapon","Imperium","Militarum Tempestus"],"ref":null,"lore":"A rare, high-maintenance support weapon fielded by elite Tempestus heavy-weapon teams, firing a rapid volley of hot-shot bolts for suppressive anti-armour and anti-elite infantry work; referenced in Militarum Tempestus background material as scarce and Munitorum- restricted compared to the standard hellgun.","design":"Per-bolt damage is the hellgun anchor (6d(3) burn) unchanged, since the volley gun is simply several hellgun-grade lasing chambers fired in quick succession rather than one bigger blast. RoF 6 represents that volley of near-simultaneous pulses. It's mounted (ST 10B on a tripod or pintle) and uses Gunner (Beams) per framework.md's rule that braced/mounted heavies use the Gunner skill family rather than Beam Weapons.","weapons":[{"melee":false,"usage":"Standard","damage":"6d(3) burn","skill":"Gunner (Beams)","notes":"","accuracy":"4","range":"280/840","rate_of_fire":"6","shots":"60(5)","strength":"10B","bulk":"-6","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Charge Pack, Laspistol","tl":"10","lc":"3","cost":"10","weight":"0.5 lb","qty":1,"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"The standard rechargeable accumulator cell for a laspistol; widely depicted as rechargeable from almost any generator, or slowly by a hand-crank in the field when nothing else is available.","design":"Pure ammunition item, no weapon stats of its own — it's what \"30(3)\" on the laspistol's shot line refers to. Capacity matches the common pattern laspistol's shot count.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Charge Pack, Lasgun","tl":"10","lc":"3","cost":"15","weight":"1 lb","qty":1,"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"The standard 60-shot accumulator cell shared by every lasgun pattern in Munitorum service; its 60-round capacity is one of the most consistently repeated facts about the lasgun across Imperial Guard background material.","design":"Pure ammunition item matching the \"60(3)\" shot line common to every lasgun pattern above.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Charge Pack, Long-Las","tl":"10","lc":"2","cost":"40","weight":"1.5 lb","qty":1,"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"A higher-capacity, tighter-tolerance cell built for the long-las's focusing chamber; sniper teams are consistently shown carrying extra packs rather than relying on field recharge, since a spoiled cell ruins the rifle's accuracy.","design":"Pure ammunition item matching the long-las's \"20(3)\" shot line. Restricted to LC 2 in line with the rifle's own sniper-issue legality.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hot-Shot Power Pack","tl":"11","lc":"2","cost":"60","weight":"1 lb","qty":1,"tags":["Imperium","Militarum Tempestus"],"ref":null,"lore":"The superheated power cell standard to the hellgun and hellpistol, and the same item Guardsmen famously slot into an ordinary lasgun to turn it into a one-shot hellgun in a pinch — a trick referenced repeatedly in Guard-focused fiction and RPG background alike.","design":"Pure ammunition item; it's what unlocks the \"Hot-shot pack\" usage line on the Kantrael lasgun above (and, at the GM's discretion, on any other lasgun pattern) as well as powering the hellgun/hellpistol's standard fire. The overheat risk after use is a roleplaying consequence noted on those weapons' usage lines rather than a GCS stat, since the schema has no malfunction field (the plasma gun anchor has the same limitation).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Overcharge Power Pack","tl":"10","lc":"3","cost":"40","weight":"1 lb","qty":1,"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"A lasgun accumulator cell deliberately overloaded for extra punch per shot — a field-expedient trick short of a true hot-shot conversion, well short of hellgun performance but easier to come by.","design":"Pure ammunition item backing the \"Overcharge shot\" usage line on the Kantrael lasgun above: +1 die of damage, no armour divisor, and a short 10-shot life before the cell is spent.","weapons":[],"feat":{"dr":[],"other":[]}}],"count":17},{"id":"imperium--weapons--melee-weapons","title":"Melee Weapons","section":"Imperium/Weapons","kind":"equipment","path":"Imperium/Weapons/Melee Weapons.eqp","items":[{"name":"Combat Knife, Munitorum Pattern","tl":"2","lc":"4","cost":"40","weight":"1 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"Standard sidearm/tool for every Guardsman; also the unmounted profile for the bayonet below.","lore":"Every Imperial Guard regiment issues a plain steel fighting knife alongside the lasgun, seen constantly in the background as a last-resort weapon and general tool; Black Library fiction (Gaunt's Ghosts and others) treats it as unremarkable field kit rather than a named piece of wargear.","design":"Built from Basic Set knife-family design logic, not anchored by framework.md (no dedicated anchor exists below the chainsword): a short single-edged blade gives thr-1 imp / sw-2 cut, reach C,1, parry 0, min ST 6. TL2 reflects that a simple knife is primitive-tech regardless of the TL10 industry that stamps it out by the million; LC4 matches \"cheap civilian stubbers, knives\" in the framework's legality table.","weapons":[{"melee":true,"usage":"Thrust","damage":"thr-1 imp","skill":"Knife","notes":"","reach":"C,1","parry":"0","strength":"6"},{"melee":true,"usage":"Swing","damage":"sw-2 cut","skill":"Knife","notes":"","reach":"C,1","parry":"0","strength":"6"}],"feat":{"dr":[],"other":[]}},{"name":"Bayonet, Lug-Mounted","tl":"2","lc":"4","cost":"30","weight":"1 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"Fits the standard-issue lasgun's bayonet lug (and most stub-pattern long arms of similar profile); mounting or removing it takes a Ready maneuver. Mounted, treat it as an improvised short spear rather than a knife for reach and defaults.","lore":"Depicted throughout Guard fiction as the last line of defence when a firefight closes to melee and a Guardsman's lasgun runs dry or jams - \"fix bayonets\" is a recurring line in Astra Militarum combat scenes, most famously associated with charge orders in Gaunt's Ghosts-style trench and siege fighting.","design":"Same blade and knife-mode profile as the Munitorum combat knife above; the mounted profile follows Basic Set convention for a bayonet fixed to a long arm (treated as a short thrusting spear once fixed, reach 1,2, +1 to thrust damage for the leverage of the gun's length behind the point) rather than inventing new mechanics. TL/LC as the knife it's built from.","weapons":[{"melee":true,"usage":"Fixed to lasgun","damage":"thr+1 imp","skill":"Spear","notes":"","reach":"1,2","parry":"0","strength":"6"},{"melee":true,"usage":"Unmounted (as knife)","damage":"thr-1 imp","skill":"Knife","notes":"","reach":"C,1","parry":"0","strength":"6"},{"melee":true,"usage":"Unmounted, swing","damage":"sw-2 cut","skill":"Knife","notes":"","reach":"C,1","parry":"0","strength":"6"}],"feat":{"dr":[],"other":[]}},{"name":"Combat Knife, Astartes Pattern","tl":"2","lc":"1","cost":"200","weight":"4 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"Sized for a gauntleted Astartes hand; scaled to a human's shortsword rather than a human's knife.","lore":"Space Marines carry a sidearm blade proportioned to their size and strength - visually a long fighting knife on a Marine's belt reads as a shortsword in a human's hand; consistently shown as a backup when a chainsword or bolt pistol isn't drawn, in Black Library Space Marine fiction from the Horus Heresy series onward.","design":"Not a bigger version of the human combat knife's stat block (that would just be the same knife with a higher min ST, understating how much blade an Astartes-scale grip actually carries) - instead it is built on the human Shortsword profile (thr+1 imp/sw+1 cut) scaled up in weight and min ST for an Astartes fist, per the framework's rule that Astartes- and human-scale versions of the same weapon type need different stats, not just a relabelling. LC1 (Astartes-issue gear) rather than the LC4 civilian knife bracket.","weapons":[{"melee":true,"usage":"Thrust","damage":"thr+1 imp","skill":"Shortsword","notes":"","reach":"C,1","parry":"0","strength":"11"},{"melee":true,"usage":"Swing","damage":"sw+1 cut","skill":"Shortsword","notes":"","reach":"C,1","parry":"0","strength":"11"}],"feat":{"dr":[],"other":[]}},{"name":"Entrenching Tool, Folding","tl":"5","lc":"4","cost":"30","weight":"5 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"Doubles as a digging tool; treat as an improvised weapon (already priced and statted as one, no further penalty needed when it's used as intended).","lore":"Standard Guard field-engineering kit, folded and slung on webbing; depicted in trench-warfare-flavoured Guard fiction being swung in desperate close combat as often as it's used to dig in, in the tradition of real-world entrenching-tool improvised weapons.","design":"Not anchored; built as a short, heavy-headed improvised axe/mace per Basic Set logic - a folding steel spade has enough mass to crush but a poor edge and balance, giving sw+1 cr, reach 1, parry -1 (awkward compared to a purpose-built club), min ST 8. TL5 reflects the folding steel tool itself (an industrial product), not the Imperium's overall manufacturing TL.","weapons":[{"melee":true,"usage":"Spade edge","damage":"sw+1 cr","skill":"Axe/Mace","notes":"","reach":"1","parry":"-1","strength":"8"}],"feat":{"dr":[],"other":[]}},{"name":"Maul, Guardsman's Club","tl":"0","lc":"4","cost":"20","weight":"3 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"Riot batons, Arbites-issue billy clubs and improvised trench clubs all use this profile.","lore":"The plainest possible melee weapon: a weighted length of wood, plas or scavenged pipe, seen everywhere from hive underworld gangs to penal-legion improvisation in Guard-adjacent fiction; no source treats it as anything but a crude, universally available last resort.","design":"Straight Basic Set club design (sw+2 cr, reach 1, parry 0, min ST 9); not anchored by framework.md since it sits well below the chainsword tier, TL0 because a club needs no technology at all.","weapons":[{"melee":true,"usage":"Swing","damage":"sw+2 cr","skill":"Axe/Mace","notes":"","reach":"1","parry":"0","strength":"9"}],"feat":{"dr":[],"other":[]}},{"name":"Catachan Fang","tl":"2","lc":"4","cost":"60","weight":"2.5 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"Doubles as a survival/jungle tool as well as a sidearm; several Catachan-pattern variants exist, all statted the same.","lore":"The heavy-bladed survival knife/machete carried by Catachan Jungle Fighters and often imitated by other jungle- and feral-world regiments; depicted in Astra Militarum background material as a point of regimental pride and a genuinely effective close-combat weapon rather than a mere tool, distinguishing it from the standard Munitorum knife.","design":"Built one step up from the Munitorum combat knife on the machete/ large-knife-to-shortsword continuum: a blade long and heavy enough to be genuinely dangerous in melee (matching its lore reputation as a combat weapon, not just a tool) gets the Shortsword profile (thr+1 imp/sw+1 cut) rather than the plain Knife profile, at a correspondingly higher min ST (9) and weight. Not a framework anchor; calibrated relative to the knife anchor above it and the chainsword anchor above that.","weapons":[{"melee":true,"usage":"Thrust","damage":"thr+1 imp","skill":"Shortsword","notes":"","reach":"1","parry":"0","strength":"9"},{"melee":true,"usage":"Swing","damage":"sw+1 cut","skill":"Shortsword","notes":"","reach":"1","parry":"0","strength":"9"}],"feat":{"dr":[],"other":[]}},{"name":"Commissar's Sabre","tl":"4","lc":"2","cost":"600","weight":"3 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"A badge of office as much as a weapon; carrying one marks the bearer as a commissar or officer to friend and foe alike.","lore":"The curved sabre is near-universal Commissariat and senior-officer iconography in Astra Militarum art and fiction, frequently drawn during summary executions or to lead a charge (Ciaphas Cain and Gaunt's Ghosts both use this image repeatedly); it is functional, not purely ceremonial, and commissars are shown killing with it.","design":"Same underlying profile as the Catachan Fang (a well-made one-handed cutting/thrusting blade, thr+1 imp/sw+1 cut, min ST 9) since nothing in the fiction suggests a sabre out-cuts a war-knife in a Guardsman's hands - the difference is entirely in cost, finish and legal status: LC2 and a high cost reflect that carrying one signals officer/ commissar rank rather than reflecting a mechanical edge in a fight.","weapons":[{"melee":true,"usage":"Thrust","damage":"thr+1 imp","skill":"Shortsword","notes":"","reach":"1","parry":"0","strength":"9"},{"melee":true,"usage":"Swing","damage":"sw+1 cut","skill":"Shortsword","notes":"","reach":"1","parry":"0","strength":"9"}],"feat":{"dr":[],"other":[]}},{"name":"Chainsword","tl":"10","lc":"2","cost":"600","weight":"6 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"The motor and chain-teeth tear rather than cleanly cut, hence the Armor Divisor (2) rather than a clean-edged blade's no-divisor cut; the framework anchor notes it \"skids off power armour\" - against DR 70+ targets it essentially never penetrates, at the table's discretion the GM may rule the chain simply fails to bite rather than dealing a grazing wound. A jammed or fouled chain (tangled cloth, bone, or a lucky parry) may stall the motor until cleared with a Ready maneuver.","lore":"The archetypal Imperial melee weapon: sergeants, veterans and officers across the Astra Militarum, plus most Chaos and Imperial cultist/human forces, carry a motorised chainblade; consistently shown butchering unarmoured infantry but failing to trouble power armour, matching the framework anchor's own description.","design":"Fixed anchor (Rescale): sw+2d(2) cut, reach 1, parry 0, min ST 10. The Rescale raised the chainsword from a flat sw+1d cut with no divisor to sw+2d(2): against carapace (DR 45) a Guardsman-strength swing (roughly 3d+1 total) essentially never gets through (eff. DR 22 well above the average roll), matching \"bites carapace\" only in an Astartes' hands, while it still guts an unarmoured man or a flak vest (DR 12, eff. 6) on nearly every hit and skids off power armour (eff. DR 50+) outright - exactly the framework's \"tears flesh and flak; bites carapace; skids off power armour.\" Weight (6 lb, heavier than a plain sword for the motor housing and chain loop) and min ST 10 (higher than a mundane broadsword's ST 9-10 band, again for the added mass) are the only free parameters. TL10 and LC2 per the framework's own worked example (\"Standard Imperial manufacture: TL10 ... chainsword\").","weapons":[{"melee":true,"usage":"Swing","damage":"sw+2d(2) cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"10"}],"feat":{"dr":[],"other":[]}},{"name":"Chainsword, Astartes Pattern","tl":"10","lc":"1","cost":"1500","weight":"14 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"Same rules as the human chainsword above (chain-vs-armour, jamming); scaled to a Marine's grip and strength.","lore":"The Adeptus Astartes issue a larger, heavier-toothed chainsword built to Astartes proportions - a recurring sidearm for Tactical and Assault Marines throughout Black Library fiction, distinct from (and more common than) power swords, which are reserved for veterans and officers.","design":"The sw+2d(2) cut formula is unchanged from the human-scale anchor - GCS resolves \"sw\" from the wielder's own ST, so an Astartes swinging this weapon already rolls more dice than a human swinging the human-scale version (a Marine's sw is 5d vs. a Guardsman's 3d+1, before the +2d chain bonus) without changing the weapon's damage line. This is exactly why an Astartes chainsword bites carapace (DR 45) roughly one swing in ten while a Guardsman's essentially never does, and still skids off power armour either way. What must change, per the framework's instruction that human- and Astartes- scale versions need different min ST and weight, is the housing itself: heavier chain loop and motor (14 lb vs. 6 lb) and a min ST (15) far above what an unaugmented human can bring to bear one-handed, so a human could not wield this pattern even though the damage formula looks identical on paper. LC1 (Astartes-issue), not LC0, since the framework's LC1 bracket explicitly covers Astartes-carried war-gear one tier below power-armour-integrated items.","weapons":[{"melee":true,"usage":"Swing","damage":"sw+2d(2) cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"15"}],"feat":{"dr":[],"other":[]}},{"name":"Chainaxe","tl":"10","lc":"1","cost":"1400","weight":"15 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"Chain-vs-armour and jamming rules as the chainsword; the single heavy blade makes it even more prone to sticking in a solid hit than a chainsword's finer teeth.","lore":"A heavier chain weapon favoured by close-combat specialists and several Chapters and warband traditions (most infamously World Eaters iconography, though Loyalist Astartes and some Guard veteran/ penal formations field it too); depicted as hitting harder but handling clumsier than a chainsword.","design":"Scaled from the chainsword anchor the way Basic Set/Low-Tech scale a one-handed axe over a one-handed sword of the same era: a single heavy, chain-driven axe-head carries more mass into the swing than a chainsword's full-length blade, for +2 damage over the chainsword's sw+2d, keeping the same Armor Divisor (2) since it's the same grinding chain-teeth mechanic; axes are traditionally worse for defense, hence parry -1 instead of 0. At Astartes ST an axe swing (5d+2(2)) bites carapace (DR 45) noticeably harder than a plain chainsword (about 1 hit in 5 vs. 1 in 10) but still skids off power armour, matching its \"hits harder but handles clumsier\" reputation. Min ST 13 sits above the human chainsword's ST 10 and below the Astartes chainsword's ST 15, reflecting that it is normally an Astartes weapon but (per its fiction) occasionally wielded one-handed by an unusually strong or augmented human at a stiff strength penalty.","weapons":[{"melee":true,"usage":"Swing","damage":"sw+2d+2(2) cut","skill":"Axe/Mace","notes":"","reach":"1","parry":"-1","strength":"13"}],"feat":{"dr":[],"other":[]}},{"name":"Eviscerator","tl":"10","lc":"1","cost":"1000","weight":"25 lb","qty":1,"tags":["Melee Weapon","Imperium","Adepta Sororitas"],"ref":null,"notes":"Always wielded two-handed; treat as unready after a solid parry (the chain bucks in the user's grip) at the GM's discretion. Sisters Repentia below the listed min ST take the normal reduced-ST penalties to skill rather than being unable to lift it - their fervour, not raw strength, is what the fiction credits.","lore":"An oversized, double-handed chain weapon issued to Adepta Sororitas Repentia squads doing penance in battle; consistently drawn and described as a huge, brutal chainblade too large and heavy for ordinary one-handed use, swung by zealots who accept the personal risk of wielding something this unwieldy.","design":"One further step up the chain-weapon family from the chainaxe: a two-handed weapon gets Basic Set's two-handed bonus over a one-handed weapon of the same family (roughly +1 die over the one-handed chainaxe's sw+2d+2, rounded to a clean sw+3d cut), keeping the shared chain-family Armor Divisor (2), with reach extended to 1,2 and parry penalised further (-1) for its bulk. At a Sororitas-typical ST this still only scratches carapace occasionally and does nothing to power armour - fitting its role as an anti-personnel penance weapon, not an anti-Astartes one. Min ST 13 is kept in the human range rather than pushed to Astartes levels, per its lore as human (if enhanced-by-faith) Sororitas wargear, not Astartes equipment - hence the notes on using it below min ST rather than simply barring human use outright.","weapons":[{"melee":true,"usage":"Swing, two-handed","damage":"sw+3d(2) cut","skill":"Two-Handed Sword","notes":"","reach":"1,2","parry":"-1","strength":"13"}],"feat":{"dr":[],"other":[]}},{"name":"Chainfist","tl":"11","lc":"1","cost":"5000","weight":"45 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"Shares the power fist's servo-driven punch (see Power Fist below) but replaces the smooth crushing plates with a ring of high-speed chain teeth for gnawing through bulkheads, void-ship hulls and vehicle armour rather than just crushing flesh and ceramite; a hit that penetrates a vehicle's DR may be ruled to lodge the fist in the material, costing a Ready maneuver to wrench free (GM's discretion). Like the power fist, it is slow and clumsy in a defensive sense: -2 to parry, and it cannot be used to Feint.","lore":"A rarer, heavier variant of the power fist mounting a chainblade ring instead of a plain gauntlet, issued to Astartes and Imperial Knight pilots for boarding actions and siege-breaching where cutting through armour plate or a bulkhead matters as much as punching through a body; consistently shown as slower and more specialised than a plain power fist.","design":"Same servo-fist chassis and damage logic as the Power Fist entry below (thr plus a large flat die bonus from the hydraulic mechanism, not a multiplier on the wielder's own thrust - see that entry's design note for why), with the same (10) disruption-field divisor every Imperial power weapon shares (framework.md, power-field rule), and the die count is one step down (+7d vs. the power fist's +8d) because chain teeth trade some raw hitting power for penetration and add their own moving parts' weight and drag. At Astartes ST (thr+7d averaging around 30) it still penetrates Terminator plate (eff. DR 20) the large majority of the time, keeping it a credible boarding/ breaching weapon even though it hits slightly softer than a plain power fist. TL11 (advanced Imperial/rare, shares the power-field- adjacent servo technology) and LC1 (Astartes power-weapon-tier legality per the framework).","weapons":[{"melee":true,"usage":"Punch","damage":"thr+7d(10) cut","skill":"Brawling","notes":"","reach":"C","parry":"-2","strength":"17"}],"feat":{"dr":[],"other":[]}},{"name":"Shock Maul","tl":"10","lc":"2","cost":"150","weight":"3 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Arbites"],"ref":null,"notes":"Draws from a small power cell; good for many dozens of charged strikes before a recharge is needed.","lore":"The standard Adeptus Arbites and hive-enforcer riot weapon: a shock-charged baton meant to subdue rather than kill, ubiquitous in Arbites background material and Necromunda-adjacent underhive fiction as the tool of choice for crowd control and arrests.","design":"Built as a plain club (sw+1 cr, matching the Guardsman's maul one step up for its denser Arbites-grade construction) plus a Basic Set electrical-stun effect layered on top as a secondary rules note (HT-3 or stunned) rather than a new damage type, since GURPS models \"shocked and dazed but not much hurt\" through the Stun rule, not through raw damage. Rescale note: this weapon's raw damage is left unchanged, since it was never anchored to any armour DR figure - it's plain ST-scaled club damage, and its entire purpose (subduing a target, not penetrating armour) is carried by the Stun rule rather than by beating DR, so the armour-anchor rescale doesn't touch it. TL10 for the power cell and stun generator; LC2 (enforcer/Arbites- issue, not general military) per the framework's \"military-issue heavy weapons, carapace, hellguns\" LC2 bracket.","weapons":[{"melee":true,"usage":"Swing","damage":"sw+1 cr","skill":"Axe/Mace","notes":"A hit that does any HP of damage forces the target to roll HT-3 or be stunned (treat as the standard Stun rule, B420) from the charge.","reach":"1","parry":"0","strength":"8"}],"feat":{"dr":[],"other":[]}},{"name":"Electro-flail","tl":"10","lc":"2","cost":"250","weight":"6 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Arbites"],"ref":null,"notes":"Flails cannot parry (Basic Set flail rule) and the head's momentum makes them awkward around allies at close range.","lore":"A heavier, multi-headed shock weapon seen in Ecclesiarchy penitent and some Arbites riot-control contexts, its swinging heads and crackling charge making it as much an instrument of intimidation as of subjugation; less common than the shock maul and depicted as harder to control.","design":"Standard Basic Set flail design logic (extra reach when extended, cannot parry, more damage than a rigid weapon of similar weight for the whipping strike) applied one step above the shock maul (sw+2 cr vs. sw+1 cr) since a multi-headed flail carries more striking mass, plus the same HT-3 stun note. As with the shock maul, raw damage is unaffected by the armour-DR rescale: this is a subdual weapon whose job is done by the Stun rule, not by beating DR. TL/LC match the shock maul's bracket.","weapons":[{"melee":true,"usage":"Swing","damage":"sw+2 cr","skill":"Flail","notes":"A hit that does any HP of damage forces the target to roll HT-3 or be stunned (B420), as the shock maul.","reach":"1,2*","parry":"No","strength":"10"}],"feat":{"dr":[],"other":[]}},{"name":"Shock Staff","tl":"10","lc":"2","cost":"200","weight":"4 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Arbites"],"ref":null,"notes":"The Staff skill's own active-defense bonus (see Basic Set) applies as normal; this entry adds no extra parry bonus beyond that.","lore":"A two-handed shock weapon issued where reach and crowd control matter more than portability - riot lines, cell-block patrols, and some Ecclesiarchy or penal-world guards; less iconic than the shock maul but built on the same principle.","design":"A quarterstaff profile (sw+1 cr/thr+1 cr, reach 1,2) carrying the same electro-stun note as the shock maul and electro-flail rather than a new mechanic; the two-handed reach trades the flail's extra damage for the Staff skill's superior defensive profile. Raw damage is left unchanged by the Rescale for the same reason as the rest of the shock-weapon family (it's a mundane, Stun-rule weapon, not one derived from any armour DR anchor). TL/LC match the rest of the shock-weapon family.","weapons":[{"melee":true,"usage":"Swing","damage":"sw+1 cr","skill":"Staff","notes":"A hit that does any HP of damage forces the target to roll HT-3 or be stunned (B420), as the shock maul.","reach":"1,2","parry":"0","strength":"8"},{"melee":true,"usage":"Thrust","damage":"thr+1 cr","skill":"Staff","notes":"As the swing usage above.","reach":"1,2","parry":"0","strength":"8"}],"feat":{"dr":[],"other":[]}},{"name":"Power Maul, Arbites Pattern","tl":"11","lc":"1","cost":"2200","weight":"5 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Arbites"],"ref":null,"notes":"Toggling between settings is a free action; Arbitrators are trained and expected to keep the weapon on suppression setting for routine enforcement and switch to lethal only against a genuine threat.","lore":"A dual-mode maul issued to senior Arbites Judges and Marshals: an Adeptus Arbites badge of office as much as the shock maul is a street enforcer's tool, and background material is explicit that it can be dialled from a stunning baton up to a lethal power weapon.","design":"Suppression setting is the same maul-plus-stun-note logic as the shock maul family above, one step heavier (sw+2 cr) for the denser Arbites-issue head; its damage is unaffected by the Rescale for the same reason as the mundane shock weapons. Lethal setting applies this file's general power-field rule (framework.md: field-on = mundane baseline +3d, Armor Divisor (10)): sw+2 cr (field off) becomes sw+3d+2(10) cr (field on) - the same +3d/(10) step used to build every other field-on/field-off pair in this file, keeping the Arbites maul consistent with the Chapter- and Sororitas-issue power weapons below it despite its different institutional owner.","weapons":[{"melee":true,"usage":"Suppression setting (field off)","damage":"sw+2 cr","skill":"Axe/Mace","notes":"A hit that does any HP of damage forces the target to roll HT-3 or be stunned (B420), as the shock maul.","reach":"1","parry":"0","strength":"10"},{"melee":true,"usage":"Lethal setting (field on)","damage":"sw+3d+2(10) cr","skill":"Axe/Mace","notes":"","reach":"1","parry":"0","strength":"10"}],"feat":{"dr":[],"other":[]}},{"name":"Power Sword","tl":"11","lc":"1","cost":"6000","weight":"4 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"notes":"The disruption field is a toggle (free action); with the field off, this is an unremarkable, if beautifully made, one-handed sword. A depleted or damaged power cell disables the field the same way.","lore":"The classic officer's and veteran's duelling and battle blade of the Imperium, from Guard colonels to Astartes veteran sergeants and Inquisitors; consistently shown shearing through flak, flesh and even power armour where a plain sword or chainsword would just bounce or skid, matching the framework anchor's own description.","design":"Fixed anchor (Rescale): sw+3d+1(10) cut, reach 1, parry 0, min ST 10. This entry also establishes the general \"power field\" rule every other powered edged/blunt weapon in this file is built from (framework.md, power-field rule): comparing the anchor to a plain one-handed sword's Basic Set baseline (sw+1 cut for a broadsword- class blade) shows the field itself contributes exactly +3d damage and Armor Divisor (10) over the same weapon with the field off - the \"field off\" line above is that same sw+1 cut baseline, unchanged by the Rescale (a plain sword's mundane edge doesn't care what DR anchors moved). This is why the field-off usage is included explicitly: the framework says power field on/off must be modelled as separate weapon lines, and this file applies the same +3d/(10) delta to every bladed/mace power weapon below (thunder hammers get +6d and power fists thr+8d instead, per the framework's own breakdown), scaled from each weapon's own mundane baseline rather than re-deriving the anchor each time. Checked against the new armour anchors: a Guardsman-strength blow (sw=1d+1, so field-on totals 4d+1) penetrates carapace (DR 45, eff. 4) essentially always, Astartes power armour (DR 100, eff. 10) about 90% of the time, and Terminator plate (DR 200, eff. 20) about 5% of the time; an Astartes-strength blow (sw=3d, field-on 6d) penetrates Astartes power armour better than 99% of the time and Terminator plate more than half the time. This matches the framework's \"the disruption field shears power armour whoever holds it\" - even a human's power sword reliably beats another human's power armour. TL11 and LC1 per the framework's \"Advanced Imperial/rare\" and \"power weapons\" brackets.","weapons":[{"melee":true,"usage":"Field on","damage":"sw+3d+1(10) cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"10"},{"melee":true,"usage":"Field off (as plain blade)","damage":"sw+1 cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"10"}],"feat":{"dr":[],"other":[]}},{"name":"Power Axe","tl":"11","lc":"1","cost":"6000","weight":"6 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"notes":"Field toggle and depleted-cell rules as the power sword.","lore":"A heavier power weapon favoured where a wielder wants more raw hitting power than a power sword at the cost of some finesse - recurring wargear for Astartes veterans and Guard officers with a taste for a bigger blade.","design":"Applies the power-field rule established under Power Sword (+3d damage, Armor Divisor (10), field on vs. off) to a plain axe's Basic Set baseline (sw+2 cut, parry -1, per the same broadsword-vs-axe relationship used for the mundane weapons above) rather than to the power sword's own base line, since an axe and a sword are not the same mundane weapon with a field bolted on.","weapons":[{"melee":true,"usage":"Field on","damage":"sw+3d+2(10) cut","skill":"Axe/Mace","notes":"","reach":"1","parry":"-1","strength":"12"},{"melee":true,"usage":"Field off (as plain blade)","damage":"sw+2 cut","skill":"Axe/Mace","notes":"","reach":"1","parry":"-1","strength":"12"}],"feat":{"dr":[],"other":[]}},{"name":"Power Maul","tl":"11","lc":"1","cost":"5500","weight":"5 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum","Adeptus Astartes","Adepta Sororitas"],"ref":null,"notes":"Field toggle and depleted-cell rules as the power sword; this is the general-issue pattern the Arbites power maul above is built from.","lore":"A power weapon built around a blunt head rather than an edge, issued to some Ministorum, Sororitas and Guard-officer wielders who favour crushing force; background material treats it as functionally equivalent to a power sword or axe, just blunt rather than edged.","design":"Same power-field rule as Power Sword and Power Axe (+3d, field on vs. off), applied to a plain mace's Basic Set baseline (sw+2 cr); the field still applies Armor Divisor (10) and damage type stays crushing rather than switching to cut, since the field disrupts and shears at the point of impact regardless of whether the striking surface is an edge or a flat head - the wound is still blunt trauma amplified by the field, matching 40k depictions of power mauls caving in what they hit rather than slicing it.","weapons":[{"melee":true,"usage":"Field on","damage":"sw+3d+2(10) cr","skill":"Axe/Mace","notes":"","reach":"1","parry":"0","strength":"11"},{"melee":true,"usage":"Field off (as plain blade)","damage":"sw+2 cr","skill":"Axe/Mace","notes":"","reach":"1","parry":"0","strength":"11"}],"feat":{"dr":[],"other":[]}},{"name":"Power Lance","tl":"11","lc":"1","cost":"7000","weight":"15 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"The full mounted-charge bonus (marked *) requires a mount at a gallop per the lance rules a GM is already using for cavalry combat; used from the ground it only reaches the braced profile.","lore":"Carried by Rough Rider-type Guard cavalry and some Sororitas Seraphim or mounted formations as an upgrade over a mundane hunting lance; depicted as punching through infantry and light vehicles alike on a charge.","design":"Baseline mundane lance follows Basic Set cavalry lance logic (thr+3 imp mounted at a charge, extra reach only while mounted and moving); the power-field rule adds its usual +3d and Armor Divisor (10) on top. The braced (dismounted) line drops one point of charge momentum but keeps the field's own +3d bonus, since the field itself doesn't care whether the wielder is moving.","weapons":[{"melee":true,"usage":"Field on, mounted charge","damage":"thr+3d+3(10) imp","skill":"Spear","notes":"","reach":"1,2*,3*","parry":"-1","strength":"11"},{"melee":true,"usage":"Field on, braced (dismounted)","damage":"thr+3d+2(10) imp","skill":"Spear","notes":"","reach":"1,2","parry":"-1","strength":"11"},{"melee":true,"usage":"Field off, mounted charge","damage":"thr+3 imp","skill":"Spear","notes":"","reach":"1,2*,3*","parry":"-1","strength":"11"}],"feat":{"dr":[],"other":[]}},{"name":"Power Stave","tl":"11","lc":"1","cost":"5000","weight":"5 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"This is a mundane-but-powered stave (a two-handed power maul built long, for reach and the Staff skill's defensive bonus), not a psyker's force stave - a force weapon draws on the wielder's own Warp-touched abilities and is covered separately.","lore":"Issued to some Inquisitorial acolytes, tech-adepts and Ministorum enforcers who want a power weapon's bite with a quarterstaff's reach and two-handed control rather than a one-handed blade.","design":"Same power-field rule as Power Maul (+3d, field on vs. off), applied to a two-handed quarterstaff's Basic Set baseline (sw+2 cr/thr+2 cr, reach 1,2) instead of a one-handed mace. Explicitly not the same item as a force stave (a Warp-powered weapon keyed to a psyker's own ability, per framework.md's psychic-power rules) - that variant belongs to the psyker-equipment file, not here.","weapons":[{"melee":true,"usage":"Field on, swing","damage":"sw+3d+2(10) cr","skill":"Staff","notes":"","reach":"1,2","parry":"0","strength":"10"},{"melee":true,"usage":"Field on, thrust","damage":"thr+3d+2(10) cr","skill":"Staff","notes":"","reach":"1,2","parry":"0","strength":"10"},{"melee":true,"usage":"Field off","damage":"sw+2 cr","skill":"Staff","notes":"","reach":"1,2","parry":"0","strength":"10"}],"feat":{"dr":[],"other":[]}},{"name":"Power Fist","tl":"11","lc":"1","cost":"8000","weight":"40 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"Cannot be used to Feint, and the -2 parry reflects how slow and clumsy the servo-driven gauntlet is to reposition defensively; a GM may rule it takes a Ready maneuver to recover after a solid punch against a very hard surface (a wall, a vehicle hull). It is not a precision weapon: no combination of skill or luck lets it target a called shot at a meaningful bonus (GM's call).","lore":"One of the signature Astartes and Terminator melee weapons: a reinforced gauntlet with an internal power field and myo-fibre actuators, consistently shown punching clean through Astartes power armour, vehicle hulls and monstrous xenos alike - the framework's Tactical Dreadnought (DR 200) armour table entry explicitly lists the power fist as one of the few things that still kills a Terminator.","design":"Fixed anchor (Rescale, framework.md): thr+8d(10) cr. It is built from first principles rather than borrowed from a catalogue \"power glove\": because the internal actuators (not the wielder's own swing) generate most of the force, its bonus is a large flat die addition to the wielder's own thrust (thr+8d) rather than a multiplier on that thrust (a \"thr x3\"-style multiplier was considered and rejected, since it would make the weapon nearly unusable in a human's hands and absurdly swingy in an Astartes', whereas a flat die bonus keeps it dangerous regardless of wielder and matches the fiction that the fist itself, not the arm behind it, is doing the killing). Armor Divisor (10) is the shared disruption-field divisor (framework.md, power-field rule). At Astartes ST 18, thr+8d (thr 1d+2, so 9d+2, avg ~33.5) against Terminator plate (DR 200, eff. DR 20) penetrates about 99.5% of the time and against Astartes power armour (DR 100, eff. 10) essentially always, matching \"power fist ... kills Terminators in Astartes hands\" cleanly. Reach C, parry -2 and the no-Feint/no-called-shot notes encode the framework's \"power fist ... unwieldy (hard to parry, slow)\" instruction without needing a bespoke game mechanic beyond existing GURPS defense penalties.","weapons":[{"melee":true,"usage":"Punch","damage":"thr+8d(10) cr","skill":"Brawling","notes":"","reach":"C","parry":"-2","strength":"15"}],"feat":{"dr":[],"other":[]}},{"name":"Relic Blade","tl":"11","lc":"1","cost":"15000","weight":"8 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"Always a unique, named heirloom weapon in the fiction; a given relic blade may carry additional individual traits or a name-specific ability a GM adds on top of this baseline profile.","lore":"Ancient, master-crafted power swords carried by Chapter Masters and other Astartes heroes, oversized compared to a standard power sword and wielded one-handed only by Astartes-grade strength; a recurring \"hero weapon\" across Black Library Space Marine fiction (e.g. named blades carried by Chapter Masters and First Company veterans).","design":"Applies the power-field rule (+3d, field on vs. off) to a two-handed greatsword's Basic Set baseline (sw+3 cut) rather than the one-handed broadsword baseline used for the standard power sword, reflecting a longer, heavier blade; min ST 16 keeps it a firmly Astartes-only weapon (a human could not meet the strength requirement even one-handed), matching the fiction that ordinary humans do not wield relic blades. At Astartes ST (sw=3d, field-on 6d+3, avg ~24) it penetrates Astartes power armour (DR 100, eff. 10) essentially always and Terminator plate (DR 200, eff. 20) about 4 times in 5, a step above the standard power sword's own Astartes-hands figures, fitting its \"hero weapon\" status.","weapons":[{"melee":true,"usage":"Field on","damage":"sw+3d+3(10) cut","skill":"Broadsword","notes":"","reach":"1,2","parry":"0","strength":"16"},{"melee":true,"usage":"Field off (as plain blade)","damage":"sw+3 cut","skill":"Broadsword","notes":"","reach":"1,2","parry":"0","strength":"16"}],"feat":{"dr":[],"other":[]}},{"name":"Thunder Hammer","tl":"11","lc":"1","cost":"9000","weight":"35 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"Any hit that penetrates the target's DR also inflicts Knockback (B378) using the raw crushing damage rolled, even against a target too armoured to actually be wounded much - representing Astartes, Terminators and even light vehicles being physically hurled by the blow, per the weapon's fiction reputation.","lore":"A massive two-handed maul carrying a huge capacitor coil, issued to Astartes Terminator assault squads and veteran sergeants; consistently shown caving in Terminator armour and knocking opponents flying rather than cutting them, distinct in style from the disruption-field swords and axes above.","design":"Fixed anchor (Rescale, framework.md): sw+6d(10) cr. A two-handed great maul's Basic Set baseline is sw+3 cr (unchanged, field off); the field's bonus is scaled up well past the standard +3d used for the sword/axe/maul family (framework.md: \"thunder hammers +6d\") since a thunder hammer's coil is built into a much larger head than a sword's blade, with the shared (10) disruption-field divisor. An earlier draft used (3) on the theory that a hammer beats armour by concussion, but that left a Marine's average blow unable to clear Terminator armour, contradicting the hammer's role as the Terminator-killer. At Astartes ST 18 (sw=3d, so 9d, avg ~31.5) against the Rescale's Terminator anchor (DR 200, eff. 20/10) it penetrates about 98-99% of the time and adds knockback. The knockback note captures the anchor-adjacent \"thunder hammer\" lore detail (send Marines and even light vehicles flying) using the existing Basic Set B378 knockback rule rather than a new mechanic, per this project's preference for built, not borrowed, but standard-rules design.","weapons":[{"melee":true,"usage":"Field on, two-handed swing","damage":"sw+6d(10) cr","skill":"Two-Handed Axe/Mace","notes":"","reach":"1","parry":"-1","strength":"15"},{"melee":true,"usage":"Field off (as plain maul)","damage":"sw+3 cr","skill":"Two-Handed Axe/Mace","notes":"","reach":"1","parry":"-1","strength":"15"}],"feat":{"dr":[],"other":[]}},{"name":"Lightning Claw","tl":"11","lc":"1","cost":"6500","weight":"3 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"Worn as a gauntlet rather than swung as a separate object; treat attacks as unarmed strikes enhanced by the claw for skill purposes (Brawling or Karate per framework.md's weapon skill table). See Lightning Claws, Paired below for the two-claw fighting set.","lore":"A gauntlet mounting several short power-field blades, worn by specialist Astartes assault troops (Raven Guard and other Chapters with an assault-focused iconography feature prominently); individual claw strikes are lighter than a power sword's but the weapon is built around speed and repeated attacks rather than one heavy blow.","design":"Applies the power-field rule (+3d, field on vs. off) to a set of short knuckle-blades rather than a full sword: the mundane baseline is a light claw weapon (built one step below the plain knife's sw-2 cut on weight/reach grounds, since the blades are short and fixed to a glove rather than a full hilt), giving sw+3d-2(10) cut with the field on. Even at its low min ST (9), a claw strike (sw+1d-1, so field-on totals 4d-1) beats carapace (DR 45, eff. 4) almost every time and Astartes power armour (DR 100, eff. 10) about three hits in four, though it drops off sharply against Terminator plate (DR 200, eff. 20, under 2%) - in an Astartes' hands (sw=3d, field-on 6d-2) it clears power armour almost always and Terminator plate better than a third of the time, reflecting a fast weapon built around repeated attacks rather than one heavy blow. Min ST (9) and weight (3 lb per claw) are deliberately lower than the power sword's, reflecting a lighter weapon meant to be worn in pairs rather than a single two-handed-capable blade.","weapons":[{"melee":true,"usage":"Field on","damage":"sw+3d-2(10) cut","skill":"Brawling","notes":"","reach":"C,1","parry":"-1","strength":"9"},{"melee":true,"usage":"Field off (as claw gauntlet)","damage":"sw-2 cut","skill":"Brawling","notes":"","reach":"C,1","parry":"-1","strength":"9"}],"feat":{"dr":[],"other":[]}},{"name":"Lightning Claws, Paired","tl":"11","lc":"1","cost":"13000","weight":"6 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"One claw worn per hand; each claw is identical to the single Lightning Claw above. A wielder trained in two-weapon fighting may attack with both in the same turn using the standard Basic Set rules for fighting with two weapons (dual-weapon attack/off-hand weapon training), rather than any bespoke \"paired claws\" rule - this file adds no new mechanic for the pairing, only the matched equipment set. Losing the ability to parry with a shield or second weapon is the normal cost of fighting with a claw in each hand.","lore":"The more iconic configuration: a claw on each hand rather than one claw and a bolt pistol or shield, a signature look for several assault-specialist Chapters in Black Library fiction and codex background, prized for the speed of a flurry of cuts over any single blow's power.","design":"Identical per-claw profile to the single Lightning Claw entry (paired weapons are the same item worn twice, not a mechanically different weapon), priced as two claws with only a small discount for buying the matched set. Making it a separate equipment entry (rather than a quantity of 2 on the single-claw entry) lets a character sheet show \"wielding a matched pair\" distinctly and lets the GM apply two-weapon fighting rules cleanly.","weapons":[{"melee":true,"usage":"Field on (either claw)","damage":"sw+3d-2(10) cut","skill":"Brawling","notes":"","reach":"C,1","parry":"-1","strength":"9"},{"melee":true,"usage":"Field off (either claw)","damage":"sw-2 cut","skill":"Brawling","notes":"","reach":"C,1","parry":"-1","strength":"9"}],"feat":{"dr":[],"other":[]}},{"name":"Blessed Blade, Sororitas Pattern","tl":"11","lc":"1","cost":"7000","weight":"4 lb","qty":1,"tags":["Melee Weapon","Imperium","Adepta Sororitas"],"ref":null,"notes":"Mechanically an ordinary power sword; any anti-daemon or faith-linked combat bonus a specific consecrated blade carries in play is a character/relic trait, not a property of the weapon itself, and belongs in a traits file rather than here.","lore":"Adepta Sororitas power swords are frequently shown consecrated by an Order's chaplain before battle and treated as holy relics in their own right, especially those carried by Celestians, Palatines and Canonesses; the fiction does not suggest the blessing changes what the blade physically does to a target, only what it means to the wielder and her Order.","design":"Identical stat block to the Power Sword anchor entry (this is the framework's own instruction: a bolter built for the Astartes armoury and one carried by a Sister of Battle are the same weapon with the same numbers) at a higher cost reflecting the rarity and ceremony of a named, consecrated blade rather than any mechanical difference. Any distinct blessing/relic effect is deliberately left out of this equipment entry and left for a traits file to add on top, per the separation of concerns in data-format.md.","weapons":[{"melee":true,"usage":"Field on","damage":"sw+3d+1(10) cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"10"},{"melee":true,"usage":"Field off (as plain blade)","damage":"sw+1 cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"10"}],"feat":{"dr":[],"other":[]}},{"name":"Combat Shield","tl":"2","lc":"3","cost":"40","weight":"8 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum","Adeptus Arbites"],"ref":null,"notes":"Riot and line-infantry shield issued to Arbites squads and some Guard formations for close-quarters and crowd-control work; the block bonus above uses the Shield skill as normal.","lore":"A round or kite-shaped physical shield seen in Arbites riot-control and some Guard trench-fighting depictions; a mundane defensive tool with no energy field, unlike Astartes storm shields.","design":"Basic Set Medium Shield stats (DB 2, modelled here as a +2 attribute bonus to Block per data-format.md's supported attribute list) plus the standard shield-bash attack (sw-2 cr); not anchored by framework.md, built from first principles as ordinary Low-Tech gear.","weapons":[{"melee":true,"usage":"Shield bash","damage":"sw-2 cr","skill":"Shield","notes":"","reach":"C,1","parry":"0","strength":"8"}],"feat":{"dr":[],"other":["Block +2"]}},{"name":"Boarding Shield","tl":"2","lc":"2","cost":"150","weight":"15 lb","qty":1,"tags":["Melee Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"Larger and heavier than a combat shield, meant to cover a boarder advancing down a corridor or breach rather than a static line.","lore":"A large, heavy void-ship boarding shield used by Naval boarding parties and some Guard siege/storm-trooper formations clearing confined spaces where a bolter or lasgun can't easily be brought to bear at close range; background material treats it as a specialist, situational item rather than universal-issue.","design":"Basic Set Large Shield stats (DB 3, +3 Block attribute bonus) with a correspondingly higher min ST and weight than the Combat Shield; not anchored, built from Low-Tech shield-scaling logic.","weapons":[{"melee":true,"usage":"Shield bash","damage":"sw-1 cr","skill":"Shield","notes":"","reach":"C,1","parry":"0","strength":"11"}],"feat":{"dr":[],"other":["Block +3"]}},{"name":"Storm Shield","tl":"10","lc":"1","cost":"9000","weight":"20 lb","qty":1,"tags":["Melee Weapon","Imperium","Adeptus Astartes"],"ref":null,"notes":"This entry is the physical shield only: the ceramite/adamantium plate, its bash attack, and its Block bonus. The storm shield's signature void/energy dispersion field - the part of its reputation that lets it stop power weapons, chainblades and even a bolt round outright - is a separate force-field feature layered on top and belongs in the personal armour file alongside other Astartes energy shielding, not here; treat this shield as \"just\" a very large, well-made Astartes plate until that feature is added from that file.","lore":"Carried by Astartes Terminators and some veteran assault troops (paired with a thunder hammer as the classic \"hammer and shield\" Terminator loadout); consistently shown stopping blows that would shear through lesser shields or armour, which the fiction attributes to an active energy field rather than the metal plate alone.","design":"Physical component built as an Astartes-scale large shield (Basic Set Large Shield DB 3, +3 Block) at Astartes weight and min ST (20 lb, ST 14, both above the human Boarding Shield's figures the way the Astartes chainsword sits above the human one); the bash attack scales up accordingly (sw+1 cr, heavier plate than a boarding shield). The force-field component that does the real work in the fiction (per the framework's instruction that the force field is the armour agent's responsibility, referenced here only in notes) is deliberately left out of this equipment entry's damage/DR fields so the two files don't duplicate or contradict each other's numbers.","weapons":[{"melee":true,"usage":"Shield bash","damage":"sw+1 cr","skill":"Shield","notes":"","reach":"C,1","parry":"0","strength":"14"}],"feat":{"dr":[],"other":["Block +3"]}}],"count":30},{"id":"imperium--weapons--melta-weapons","title":"Melta Weapons","section":"Imperium/Weapons","kind":"equipment","path":"Imperium/Weapons/Melta Weapons.eqp","items":[{"name":"Inferno Pistol","tl":"11","lc":"1","cost":"2600","weight":"6 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes","Inquisition"],"ref":null,"lore":"A pistol-format melta weapon carried by Astartes command squads, Inquisitors and Tempestus officers wanting a point-blank answer to armour without a full meltagun's bulk; background consistently frames it as devastating at arm's length and near-useless at any real distance.","design":"Scaled down two dice from the meltagun anchor (8dx6(10) burn) to 6dx6(10) burn for a pistol- sized fuel cell, on a very short 5/25 range band matching the anchor's \"vehicle-killer at short range, much less beyond\" description. At short range 6dx6 averages 126, which - like the full meltagun - penetrates every vehicle on the AV table and any personal armour outright (effective DR under the (10) divisor never exceeds 35, even against AV14's DR 350). See the Meltagun entry for the beyond-½D check; the pistol's beyond-½D line is one die lower than the meltagun's (3d vs 4d), the same one-die-down relationship as the old scale.","weapons":[{"melee":false,"usage":"Short range (up to ½D)","damage":"6dx6(10) burn","skill":"Beam Weapons (Pistol)","notes":"","accuracy":"1","range":"5/25","rate_of_fire":"1","shots":"3(5)","strength":"9","bulk":"-2","recoil":"1"},{"melee":false,"usage":"Beyond ½D","damage":"3dx6(3) burn","skill":"Beam Weapons (Pistol)","notes":"Half damage past ½D (the usual GURPS rule) and the armour divisor falls from (10) to (3) as the fusion beam loses cohesion. Still dangerous to light and medium vehicles (avg 63 vs AV10 DR 100/3 = eff. 33, 95% penetration), tails off hard against a Leman Russ or Land Raider's frontal glacis.\n","accuracy":"1","range":"5/25","rate_of_fire":"1","shots":"3(5)","strength":"9","bulk":"-2","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Meltagun","tl":"11","lc":"1","cost":"4200","weight":"17 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"lore":"The Imperium's dedicated close-range anti-armour infantry weapon, flash-vaporising the target's outer surface with a superheated fusion reaction; fiction across every era treats it as able to gut a tank at point-blank range and as nearly worthless at any distance, in sharp contrast to a lascannon's much longer reach.","design":"This is the project's fixed melta anchor: 8dx6(10) burn at ½D, \"much less beyond\" 4dx6(3). Checked against the vehicle armour table with the exact dice distribution: AV14 (DR 350, a Leman Russ or Land Raider's front) has effective DR 35 against the (10) armour divisor; 8dx6 averages 168, always penetrating, so it easily beats even the heaviest armour in the framework's table at ½D range, as the assignment requires - the same holds at every lower AV on the table. The sharp drop-off is modelled as a second weapon line rather than a formula: beyond ½D the round keeps only half its dice (4d instead of 8d, the usual GURPS halving for range) but keeps a x6 multiplier and a much weaker (3) armour divisor instead of (10), representing the fusion reaction losing coherence and cohesion in open air before it reaches the target. Checked against the AV table: beyond ½D it averages 84 and still wrecks AV12 (DR 200, effective DR 66) 76% of the time and AV10-11 (DR 100/150) 94-100% of the time, but drops to 34% against AV13 (DR 275) and just 5% against AV14 (DR 350) - \"almost never beats\" the heaviest tanks, exactly as the framework specifies. ST 10 and a very short 10/50 range band (versus a boltgun's 200/1000) capture the weapon's role as a close-assault specialist, not a rifle.","weapons":[{"melee":false,"usage":"Short range (up to ½D)","damage":"8dx6(10) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"2","range":"10/50","rate_
