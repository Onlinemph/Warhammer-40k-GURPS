oints":20,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Secretes a waxy, oily film that can be triggered to seal pores and orifices against vacuum, toxic atmosphere, and radiation, and that also insulates against extreme heat and cold.","design":"Sealed (B82, 15 points) covers vacuum/toxin/radiation sealing; Temperature Tolerance 5 (B93, 1/level, 5 points) covers the thermal insulation. 20 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Sealed","points":15,"tags":[],"ref":"B82","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Temperature Tolerance","points":5,"tags":[],"ref":"B93","weapons":[],"feat":{"dr":[],"other":[]},"levels":5}]},{"name":"Betcher's Gland","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Produces a corrosive, mildly toxic saliva. Fiction plays this as a minor, opportunistic weapon and a way to shrug off ingested poisons and diseased food in the mouth — not a primary attack for a Marine who has a bolter.","design":"Innate Attack (Corrosion) at a token 1d, melee reach C only (B61, roughly 3 points after the reach/range restriction) for the spit; 1-point Perk for the minor oral antitoxin effect (overlaps in concept with Preomnor, so kept nominal). 4 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Corrosive Spit","points":3,"tags":[],"ref":null,"weapons":[{"melee":true,"usage":"Spit","damage":"1d cor","skill":"Brawling","notes":"","reach":"C","parry":"No"}],"feat":{"dr":[],"other":[]}},{"name":"Oral Poison Filter","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Progenoid Glands","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Two glands that mature over years into a bank of \"zygotes\" — genetic material an Apothecary harvests from the fallen to seed new recruits. Central to how a Chapter perpetuates and safeguards its gene-seed line, but they confer no combat benefit on the Marine who carries them; their value is entirely to the Chapter after death.","design":"1-point Perk (B21): a narrative/plot-hook organ (its condition can matter for Apothecary rolls or a Chapter's gene-seed politics) with no combat mechanic of its own.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hypno-Indoctrination (Neophyte)","points":-16,"tags":[],"ref":null,"design":"Fearlessness 2 (4) + High Pain Threshold (10) + Single-Minded (5) = 19, minus the same Duty/Sense of Duty/Code of Honor a Scout already swears (-35) = -16. Combat Reflexes is left out — it represents thousands of hours of live-fire drilling a Scout hasn't logged yet.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Fearlessness","points":4,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"High Pain Threshold","points":10,"tags":[],"ref":"B59","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Single-Minded","points":5,"tags":[],"ref":"B85","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Chapter and Imperium)","points":-15,"tags":[],"ref":"B133","notes":"Almost all the time, Extremely Hazardous.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Battle-Brothers)","points":-10,"tags":[],"ref":"B153","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Code of Honor (Codex Astartes)","points":-10,"tags":[],"ref":"B127","weapons":[],"feat":{"dr":[],"other":[]}}]}]},{"name":"Primaris Astartes","points":46,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Primaris"],"ref":null,"lore":"Cawl's Primaris strain adds three further organs on top of the standard nineteen, developed to make a Marine somewhat larger, tougher, and more enduring without changing what made the original gene-seed work. This trait is added on top of the Astartes ancestry trait above, not used in place of it.","design":"25 (Sinew Coils) + 11 (Magnificat) + 10 (Belisarian Furnace) = 46 points, added to the base Astartes package's 443 for 489 points of physiology before skills. See the Primaris Battle-Brother template.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Sinew Coils","points":25,"tags":["Physical"],"ref":null,"lore":"Reinforces muscle fibre and tendon with denser, faster-cycling tissue, giving Primaris Marines their somewhat greater size and quicker reactions relative to Firstborn Astartes.","design":"Increased ST +2 (B14, 10/level, 20) plus Increased Basic Speed +0.25 (B17, 5) = 25 points, stacking with the base Astartes Attribute Modifiers.","weapons":[],"feat":{"dr":[],"other":["ST +2","Basic Speed +0.25"]}},{"name":"Magnificat","points":11,"tags":[],"ref":null,"lore":"Boosts the endocrine system that governs growth and wound repair, so a Primaris Marine's tissue knits measurably faster between battles than a Firstborn Astartes' already-quick healing.","design":"Regeneration (Slow) (B80, 10 points) for the passive extra healing, plus a 1-point Perk for general hormonal stability. 11 points.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Accelerated Recovery","points":10,"tags":[],"ref":"B80","notes":"Regeneration (Slow): recover 1 HP per 12 hours even without rest or first aid.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hormonal Regulation","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Belisarian Furnace","points":10,"tags":[],"ref":null,"lore":"An additional organ, unique to the Primaris strain, that burns fuel far more efficiently than a Firstborn Astartes' already formidable metabolism, giving noticeably greater stamina on extended campaigns.","design":"Extra Fatigue Points +3 (B16, 3/level, 9 points) plus a 1-point Perk for the general metabolic efficiency. 10 points.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Metabolic Reserve","points":9,"tags":[],"ref":"B16","notes":"Extra Fatigue Points +3.","weapons":[],"feat":{"dr":[],"other":[]},"levels":3},{"name":"Efficient Metabolism","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]}]},{"name":"Chapter Gene-Seed: Blood Angels","points":-10,"tags":["Disadvantage","Mental","Imperium","Adeptus Astartes","Chapter Variant"],"ref":null,"lore":"Every Blood Angel carries the Red Thirst, a battle-hunger for blood inherited from Sanguinius's flawed gene-seed, usually kept in check by discipline and ritual. A minority of Marines, generally older or more battle-worn ones, eventually lose that check entirely and fall to the Black Rage, refighting Sanguinius's death over and over — a one-way, GM-adjudicated fate rather than a disadvantage a player buys onto a character, so it isn't priced here.","design":"Red Thirst as Bloodlust (B125, -10 points, self-control 12): a craving that has to be managed, not a full berserker disadvantage. Black Rage is deliberately left unmodelled as a purchasable trait — it's a narrative endpoint, not a chargen option.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Red Thirst","points":-10,"tags":[],"ref":"B125","notes":"As Bloodlust, but specifically a craving to draw blood in battle.","weapons":[],"feat":{"dr":[],"other":[]},"cr":12}]},{"name":"Chapter Gene-Seed: Space Wolves","points":0,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Chapter Variant"],"ref":null,"lore":"The Canis Helix marks Space Wolves and their Successors with wolflike traits — keen senses, yellow eyes, sometimes fangs — and a fiercer, more feral temperament than most Chapters tolerate. In a minority of Marines the same instability that produces those traits can, under enough strain, tip into the Wulfen mutation: a violent, lupine transformation described across Space Wolves background and the Curse of the Wulfen material. As with the Blood Angels' Black Rage, actually becoming Wulfen is a plot-level fate, not something bought at chargen.","design":"Canis Helix Instincts as a 1-point Perk (flavor, no fixed mechanic). Latent Wulfen Curse as a -1 Quirk (B22) flagging the underlying instability without pricing the mutation itself, which the GM should run as a narrative consequence rather than a trait a character buys.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Canis Helix Instincts","points":1,"tags":["Perk"],"ref":null,"notes":"Keener aggression and pack-loyalty; flavor only.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Latent Wulfen Curse","points":-1,"tags":["Quirk"],"ref":null,"notes":"Occasionally must resist a minor feral urge (snarling at insults, refusing to back down from a challenge) under GM discretion. Represents gene-seed instability, not the Wulfen mutation itself.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Chapter Gene-Seed: Imperial Fists Line","points":-13,"tags":["Disadvantage","Physical","Imperium","Adeptus Astartes","Chapter Variant"],"ref":null,"notes":"Apply alongside the Astartes trait for Imperial Fists and their Successors (Black Templars, Crimson Fists, and others descended from the same line). Represents removing the Sus-an Membrane (9 points) and Betcher's Gland (4 points) from the base package rather than editing those entries directly.","lore":"Long-documented in Codex and background material: the Imperial Fists gene-seed line does not express a working Sus-an Membrane or Betcher's Gland. Marines of this line can't enter the hibernation trance and lack the corrosive-spit/oral-antitoxin function, with no compensating quirk described for it.","design":"-9 (Sus-an Membrane) + -4 (Betcher's Gland) = -13 points, applied as a flat deduction since this schema has no way to remove specific children from another container.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Chapter Gene-Seed: Dark Angels","points":0,"tags":["Imperium","Adeptus Astartes","Chapter Variant"],"ref":null,"notes":"0-point lore flag; see design for the optional disabled child.","lore":"No physical gene-seed quirk is described for the Dark Angels — their defining trait is organizational secrecy, not physiology: the Chapter (and its Successors) conceal the Order of the Fallen and the millennia-long hunt for Lion El'Jonson's traitor Knights from outsiders, including their own rank-and-file.","design":"Kept at 0 points at the physiology level, matching the lore claim that there's nothing biologically unusual here. The Secret trait (B152) is included but disabled, for building an Inner Circle member specifically rather than an ordinary Dark Angel.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Secret (Order of the Fallen / Inner Circle)","points":0,"tags":[],"ref":"B152","notes":"Disabled by default. Enable only for a character initiated into the Inner Circle and its hunt for the Fallen.","weapons":[],"feat":{"dr":[],"other":[]},"disabled":true}]},{"name":"Chapter Gene-Seed: Ultramarines","points":0,"tags":["Imperium","Adeptus Astartes","Chapter Variant"],"ref":null,"lore":"Widely described as the most stable and \"pure\" gene-seed line in the Imperium, free of the flaws that mark other Chapters — a large part of why so many Successor Chapters from the Second Founding were seeded from Ultramarines stock.","design":"0-point lore flag: nothing to add or remove mechanically, since the claim is precisely that this line has no quirks.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Chapter Gene-Seed: Salamanders","points":-1,"tags":["Imperium","Adeptus Astartes","Chapter Variant"],"ref":null,"lore":"A Salamander's Melanchromic Organ runs at far higher output than other Chapters', darkening the skin to near-black or bronze and giving the eyes a distinctive glow — described consistently across Black Library's Salamanders novels and Codex background. It's a badge of the line, not a flaw.","design":"The organ's shielding effect is already covered by the base Melanchromic Organ entry; this lens only adds the visible side-effect, as Distinctive Features (B165, -1 point) since it's purely a recognizability cost, not a combat disadvantage.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Overactive Melanchromic Organ","points":-1,"tags":[],"ref":"B165","notes":"Distinctive Features: soot-black to bronze skin and glowing red or orange eyes, immediately marking the bearer as a Salamander (or successor) to anyone who knows the signs.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Chapter Gene-Seed: Raven Guard","points":-25,"tags":["Disadvantage","Physical","Imperium","Adeptus Astartes","Chapter Variant"],"ref":null,"notes":"Apply alongside the Astartes trait. Removes Mucranoid (20 points) and Betcher's Gland (4 points), and adds a 1-point Distinctive Features-adjacent note for unusually pale skin.","lore":"Chapter background describes the Raven Guard gene-seed line as missing full function in the Mucranoid and Betcher's Gland, which (among other things) leaves its Marines noticeably paler and leaner than other Chapters' — fitting a line already prized for stealth over brute durability. This project cites that as widely repeated Chapter background rather than a specific, page-verified source.","design":"-20 (Mucranoid) + -4 (Betcher's Gland) + -1 (Distinctive Features, B165: unusually pale) = -25 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Chapter Gene-Seed: White Scars","points":0,"tags":["Imperium","Adeptus Astartes","Chapter Variant"],"ref":null,"lore":"No physiological gene-seed quirk is described for the White Scars; what sets them apart is doctrine and culture — a steppe-nomad identity built around speed, bike- and mounted-warfare, and hit-and- run tactics rather than any known difference in the gene-seed itself.","design":"0-point lore flag. Their speed-focused fighting style belongs on equipment and skill choices (bikes, Riding, etc.), not on a physiology file.","weapons":[],"feat":{"dr":[],"other":[]}}],"count":31},{"id":"imperium--traits--imperial-traits","title":"Imperial Traits","section":"Imperium/Traits","kind":"traits","path":"Imperium/Traits/Imperial Traits.adq","items":[{"name":"Fanaticism (The God-Emperor)","points":-15,"tags":["Disadvantage","Mental","Imperium"],"ref":"B136","lore":"Unshakeable belief that the Emperor is a god and that His will justifies anything done in His name — the baseline psychology Black Library gives almost every loyal Imperial citizen and soldier, from a Cadian trooper's last prayer to a Sororitas' battle-hymn. Distinct from mere piety (Theology skill, Sense of Duty): this is doctrinal certainty strong enough to override self-preservation.","design":"Basic Set Fanaticism (B136), flat -15, taken for \"the Emperor/the Imperial Creed\" as the group/ideal. Not leveled in Basic Set.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Xenos)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"\"The alien is the enemy\" as baseline Imperial doctrine — not personal bigotry but state religion. Universal across Black Library fiction; only a minority of xenos-sympathetic characters (some Rogue Traders, Ordo Xenos radicals) lack it.","design":"Basic Set Intolerance (B140). Costed at -10, the \"very broad category\" end of the range the book allows, since \"all non-human sapient species\" is about as broad a target as Intolerance can name.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Mutants)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"\"The mutant is the enemy\": Imperial law treats unsanctioned mutation as heresy, and ordinary citizens are shown reporting or lynching mutants on sight (Ciaphas Cain, Gaunt's Ghosts, Necromunda material).","design":"Basic Set Intolerance (B140), broad-category cost as above.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Psykers)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"\"The witch is the enemy\": fear of untrained or unsanctioned psykers runs through Imperial culture (mobs burning suspected witches before the Black Ships arrive is a recurring Black Library beat).","design":"Basic Set Intolerance (B140), broad-category cost.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Heretics)","points":-5,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"Hostility toward the openly faithless or Chaos-tainted specifically, as opposed to xenos or mutants generally — a narrower target (a behaviour/allegiance, not a whole species), so cheaper under B140's guidance for a less sweeping category.","design":"Basic Set Intolerance (B140), narrow-category cost (-5).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fearlessness","points":10,"tags":["Advantage","Mental","Imperium"],"ref":"B55","lore":"The iron nerve drilled (or chemically/surgically reinforced) into Commissars, veteran Guard NCOs, and Astartes alike; Ciaphas Cain's narration repeatedly contrasts genuine Fearlessness against his own merely well-hidden terror.","design":"Basic Set Fearlessness (B55), 2/level, max 5 levels as usual; buy the level that fits the character.","weapons":[],"feat":{"dr":[],"other":[]},"levels":5},{"name":"Unfazeable","points":15,"tags":["Advantage","Mental","Imperium"],"ref":"B95","lore":"Nothing shocks or horrifies this character: the mark of a Commissar or veteran Inquisitor who has seen enough warp-touched horror that a daemon incursion barely raises an eyebrow.","design":"Basic Set Unfazeable (B95), flat 15 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Astra Militarum)","points":-15,"tags":["Disadvantage","Social","Imperium","Astra Militarum"],"ref":"B133","lore":"Guardsmen do not resign; the Munitorum owns their service until death, discharge, or reassignment. Extremely hazardous, almost always active — front-line Guard regiments are shown fighting until they are no longer regiments.","design":"Basic Set Duty (B133): almost-always-on-duty, hazardous, involuntary military service, at the top of the disadvantage's standard cost range.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Inquisition)","points":-15,"tags":["Disadvantage","Social","Imperium","Inquisition"],"ref":"B133","lore":"An acolyte or Interrogator serves at an Inquisitor's word, and an Inquisitor answers to their Ordo and (nominally) the wider Inquisition; refusal is itself grounds for suspicion of heresy.","design":"Basic Set Duty (B133), hazardous and frequent, as above.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Ecclesiarchy)","points":-10,"tags":["Disadvantage","Social","Imperium","Ecclesiarchy"],"ref":"B133","lore":"A Battle Sister's or priest's obligation to the Ministorum's chain of command — frequent and binding, but less constantly lethal than Guard or Inquisition service on average (a Sororitas' hazard comes from her *mission*, not baseline garrison duty).","design":"Basic Set Duty (B133), one tier below the fully hazardous, always-on entries above.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Squadmates)","points":-5,"tags":["Disadvantage","Mental","Imperium"],"ref":"B153","lore":"Small combat units live and die by cohesion; abandoning a wounded comrade is the one thing that reliably gets a soldier shunned by their own side, per how Guard squads and Sororitas/Militarum Tempestus kill-teams are consistently written in Black Library fiction.","design":"Basic Set Sense of Duty (B153), small-group scope, -5.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Overconfidence","points":-5,"tags":["Disadvantage","Mental","Imperium"],"ref":"B148","lore":"A common trait of the Imperium's acknowledged elites (Scions, rising Inquisitorial stars), who are written as knowing exactly how good they are relative to line troops.","design":"Basic Set Overconfidence (B148), -5.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Callous","points":-5,"tags":["Disadvantage","Mental","Imperium"],"ref":"B125","lore":"Willingness to spend subordinates', bystanders', or entire populations' lives against the mission — a recurring trait of Commissars and Inquisitors alike in Black Library fiction (played straight in most Inquisitor protagonists, deliberately subverted by Ciaphas Cain).","design":"Basic Set Callous (B125), -5.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Legal Enforcement Powers (Adeptus Arbites)","points":10,"tags":["Advantage","Social","Imperium"],"ref":"B65","lore":"Full Arbites police powers: arrest, search, and use of lethal force under the Lex Imperialis, backed by a precinct-house and Arbites armoury. Depicted throughout Black Library (Necromunda's Arbites, the Eisenhorn books' encounters with precinct Arbitrators) as \"the law\" on any Imperial world they're posted to.","design":"Basic Set Legal Enforcement Powers (B65), 5/level; costed at level 2 (10 points) for a working Arbitrator with real jurisdiction, below the maximum the trait allows.","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Legal Enforcement Powers (Inquisitorial Rosette)","points":20,"tags":["Advantage","Social","Imperium","Inquisition"],"ref":"B65","lore":"\"I have the authority of the Emperor Himself\" — an Inquisitor can commandeer Imperial Guard regiments, override a planetary governor's orders, or execute an Astartes Chapter Master's aide without trial, per repeated scenes across Eisenhorn, Ravenor, and countless codex vignettes.","design":"Basic Set Legal Enforcement Powers (B65) at its maximum, 4 levels (20 points): the right to arrest, search, requisition and execute. LEP covers what an Inquisitor may do to people; their authority over other Imperial institutions (commandeering a regiment, overruling a governor) is Inquisitorial Rank, and their standing in Imperial society is Status. Take all three.","weapons":[],"feat":{"dr":[],"other":[]},"levels":4},{"name":"Inquisitorial Rank","points":60,"tags":["Advantage","Social","Imperium","Inquisition"],"ref":"B29","notes":"Levels: 1 Acolyte in formal service, 3 Interrogator, 6 Inquisitor, 7 senior/renowned Inquisitor, 8 Lord Inquisitor, 9 Grand Master of an Ordo or Inquisitorial Representative to the High Lords.","lore":"The Inquisition answers to no Imperial body but itself. A single Inquisitor can requisition Guard regiments and Navy vessels, declare Exterminatus, and relieve a governor, as shown repeatedly in the Eisenhorn and Ravenor novels and codex background. In practice that authority is limited by what the Inquisitor can enforce and by rival Inquisitors.","design":"Basic Set Rank (B29), 5/level, with a custom +100% enhancement because the Rank reaches across every Imperial institution instead of one. Inquisitor at level 6: 30 x 2 = 60 points. Kept separate from Status per GURPS convention: Rank is authority within (here, over) organisations; Status is social standing.","weapons":[],"feat":{"dr":[],"other":[]},"levels":6,"mods":[{"name":"Overrides all Imperial hierarchies","cost":"+100%","notes":"Every Imperial organisation (Astra Militarum, Administratum, Ecclesiarchy, Navy, planetary governments) treats this as a Rank higher than any of its own at the same or lower level. The Adeptus Astartes and Mechanicus are sovereign allies rather than subordinates: they are not bound by it, but in practice rarely defy it openly.\n"}]},{"name":"Status (Inquisitor)","points":25,"tags":["Advantage","Social","Imperium","Inquisition"],"ref":"B28","lore":"Nobles and planetary rulers defer to an Inquisitor who reveals themselves; most Imperial citizens will never meet anyone higher. Many Inquisitors hide their Status behind a cover identity until it is needed.","design":"Basic Set Status (B28) level 5 (25 points): just below a planetary governor (Status 6) socially, while Inquisitorial Rank lets them overrule one. Interrogators typically have Status 2-3.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Secret (Works for the Inquisition)","points":-10,"tags":["Disadvantage","Social","Imperium","Inquisition"],"ref":"B152","lore":"Inquisitorial agents routinely operate under cover identities; being identified as Inquisition staff can get an agent killed by exactly the people they are investigating, or by a hostile Imperial official who resents being investigated at all.","design":"Basic Set Secret (B152), moderate exposure risk, -10.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Legal Enforcement Powers (Commissariat)","points":15,"tags":["Advantage","Social","Imperium","Astra Militarum"],"ref":"B65","lore":"A Commissar's authority to enforce discipline within their attached regiment up to and including summary execution for cowardice, desertion, or heresy — a narrower grant than an Inquisitorial rosette (it stops at the regiment's edge) but exercised far more routinely; Ciaphas Cain's narration treats a drawn bolt pistol and the words \"for the Emperor\" as a Commissar's standard response to a wavering line.","design":"Basic Set Legal Enforcement Powers (B65), 5/level, at 3 levels (15 points) — one tier below an Inquisitorial rosette's maximum, reflecting authority that is real and lethal but scoped to a single command rather than the whole Imperium.","weapons":[],"feat":{"dr":[],"other":[]},"levels":3},{"name":"Military Rank","points":30,"tags":["Advantage","Social","Imperium","Astra Militarum"],"ref":"B29","lore":"Astra Militarum officer rank, from a newly-brevetted Lieutenant up through a Lord General commanding an army group. Levels are a rough fit, not a lore-exact rank chart: use as many levels as the character's actual seniority needs.","design":"Basic Set Rank (B29), 5/level, generic \"Military Rank\" naming per that trait's own convention.","weapons":[],"feat":{"dr":[],"other":[]},"levels":6},{"name":"Religious Rank","points":30,"tags":["Advantage","Social","Imperium","Ecclesiarchy"],"ref":"B29","lore":"Ecclesiarchy hierarchy from parish preacher to Cardinal, or Adepta Sororitas rank from Sister to Canoness/Palatine; both use the same generic Rank trait per Basic Set's own convention of one Rank trait per hierarchy a character belongs to.","design":"Basic Set Rank (B29), 5/level.","weapons":[],"feat":{"dr":[],"other":[]},"levels":6},{"name":"Status (Underhive Scum)","points":-10,"tags":["Advantage","Social","Imperium"],"ref":"B28","lore":"Hab-block ganger, underhive scavenger, or unregistered menial — below even the baseline hive worker in the Imperium's brutal social order.","design":"Basic Set Status (B28) fixed at level -2 (5 pts/level x -2 = -10).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Status (Hab-Worker)","points":-5,"tags":["Advantage","Social","Imperium"],"ref":"B28","lore":"Registered menial or hive worker — the Imperium's baseline \"someone,\" barely.","design":"Basic Set Status (B28) fixed at level -1.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Status (Guard Officer / Senior Adept)","points":10,"tags":["Advantage","Social","Imperium"],"ref":"B28","lore":"A commissioned officer, senior tech-adept, or comparable — enough standing to give orders and be obeyed without question by the rank and file.","design":"Basic Set Status (B28) fixed at level 2.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Status (Planetary Noble / Cardinal)","points":20,"tags":["Advantage","Social","Imperium"],"ref":"B28","lore":"Hive-noble house scion, planetary governor's court, or a Ministorum Cardinal — power that reaches across a world.","design":"Basic Set Status (B28) fixed at level 4.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Status (Planetary Governor)","points":30,"tags":["Advantage","Social","Imperium"],"ref":"B28","lore":"Absolute (if Administratum-supervised) ruler of an Imperial world.","design":"Basic Set Status (B28) fixed at level 6.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Status (High Lord of Terra)","points":40,"tags":["Advantage","Social","Imperium"],"ref":"B28","lore":"One of the handful of officials who govern the Imperium in the Emperor's silent name from the Senatorum Imperialis — as high as unaugmented Imperial status goes without stepping into \"beyond play\" territory (a Primarch, a Living Saint).","design":"Basic Set Status (B28) fixed at level 8, a high but not absurd value befitting a human administrator rather than a demigod.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Social Regard (Ecclesiarchy)","points":4,"tags":["Advantage","Social","Imperium","Ecclesiarchy"],"ref":null,"lore":"Being visibly favoured within Ecclesiarchy circles specifically — preachers and the faithful defer, but it means nothing to a Munitorum quartermaster or an ork.","design":"Not a Basic Set trait (no certain GURPS page reference is known for \"Social Regard\" as such; some supplements use the name for a reaction bonus narrower than Reputation). Built here from first principles as a scaled-down Reputation: a flat reaction bonus valid with one specific group only, so it is priced below Good Reputation's 5/level (which applies to a whole class of people who might recognise you on sight) — 2/level, 2 levels max, reaction_bonus feature scoped to the Ecclesiarchy.","weapons":[],"feat":{"dr":[],"other":["+1 from the Ecclesiarchy and the devout"]},"levels":2},{"name":"Act of Faith","points":18,"tags":["Advantage","Imperium","Adepta Sororitas"],"ref":null,"notes":"Suggested use: once per session per level, the player declares an Act of Faith and the GM narrates a small miracle appropriate to the moment (see lore). Not a substitute for a psychic power; do not stack with psyker abilities from the psyker power library.","lore":"A Sister of Battle's prayer answered at the worst possible moment for her enemies: wounds that don't drop her, a bolter that never jams when it matters, a miraculous shrug-off of a wound that should have killed her. Black Library (the Sisters of Battle novels, Dan Abnett's and others' Sororitas fiction) treats these as real and faith-triggered, not psychic — the Orders explicitly reject psychic power as unclean.","design":"Built, not borrowed, per framework.md: based on Serendipity's shape (B83, \"something goes providentially right when you need it\") but priced down and given an activation cost, because the fictional trigger is \"spend Faith in a moment of crisis,\" which is a real restriction a GM can enforce (limited uses per session/scene, GM's call on the specific effect) rather than Serendipity's unlimited, GM-adjudicated free use. 6 points/level (40% of Serendipity's 15) reflects that Restricted Use / limited-frequency limitation; buy multiple levels for a Sister who can call on this more than once a session. Does not touch the psyker power library — Sororitas Faith is explicitly not psychic power in the fiction, and this trait is built independently of it.","weapons":[],"feat":{"dr":[],"other":[]},"levels":3},{"name":"Hive World Origin","points":0,"tags":["Imperium"],"ref":null,"lore":"Born and raised inside a hive's vertical city-machine: gang territories, recycled air, and a horizon that is always a wall. Calibrated against Only War's Hive World home-world package (bonus to Fellowship/streetwise-type skills, poor grasp of open terrain) and against Necromunda's depiction throughout Black Library.","design":"A small optional container (net 0 points) rather than a full racial template: two Basic Set perks/quirks bought as a set, per framework.md's instruction to keep origin lenses lore-flavoured rather than mechanically heavy. Disabled by default in templates; the GM/player enables the one that fits.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Hive-Bred","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"A lifetime spent reading crowds, gangs, and hab-block politics.","design":"Perk (B9), +1 to Streetwise.","weapons":[],"feat":{"dr":[],"other":["Streetwise +1"]}},{"name":"Never Seen an Open Sky","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Hivers are famously unsettled by true horizons and weather.","design":"Quirk (B9), roleplaying flag only, no mechanical effect.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Death World Origin","points":0,"tags":["Imperium"],"ref":null,"lore":"Raised on a world that actively tries to kill its population — the Catachan/Krieg-adjacent archetype. Only War's Death World package (bonus to combat/survival skills, penalty to Fellowship from a lifetime of mistrust) is the calibration source.","design":"Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Death World Instincts","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"A childhood spent not being eaten teaches attentiveness other worlds don't.","design":"Perk (B9), +1 to Survival.","weapons":[],"feat":{"dr":[],"other":["Survival +1"]}},{"name":"Contempt for Soft Living","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Hive worlds and their comforts look like weakness from a death world's perspective.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Feral World Origin","points":0,"tags":["Imperium"],"ref":null,"lore":"A pre-industrial or tribal Imperial world (the kind that furnishes the Imperium with superstitious but ferocious Guard regiments and occasional Space Marine recruits, as with Fenris or Chogoris in Astartes lore). Only War's Feral World package (combat/melee bonus, Tech-Use penalty) is the calibration source.","design":"Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Warrior's Upbringing","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"Trained from childhood to fight with whatever the tribe carries.","design":"Perk (B9), +1 to Survival.","weapons":[],"feat":{"dr":[],"other":["Survival +1"]}},{"name":"Machine-Spirits Are Sorcery","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Reflexive unease around advanced technology, treated as witchcraft by tribal custom.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Forge World Origin","points":0,"tags":["Imperium","Adepta Mechanicus"],"ref":null,"lore":"Raised in a Mechanicus-dominated manufactorum world, among servitors and the liturgies of the Cult Mechanicus from birth, whether or not the character ever takes vows to the Priesthood.","design":"Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Forge-Born","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"Grew up around machines and the rites that keep them running.","design":"Perk (B9), +1 to Mechanic (any).","weapons":[],"feat":{"dr":[],"other":["Mechanic +1"]}},{"name":"Uneasy Far From the Machine-God's Halls","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Forge-world natives find purely organic, unindustrialised places subtly wrong.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Agri World Origin","points":0,"tags":["Imperium"],"ref":null,"lore":"Raised on one of the vast farming worlds that feed the hives — wide horizons, hard physical labour, and a much smaller population than a hive world's.","design":"Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Agri-Born","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"A working knowledge of land, weather, and beasts of burden.","design":"Perk (B9), +1 to Survival (Plains) or the local terrain equivalent.","weapons":[],"feat":{"dr":[],"other":["Survival (Plains) +1"]}},{"name":"City Naif","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Hive-city customs and crowds are alien and overwhelming at first.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Shrine World Origin","points":0,"tags":["Imperium","Ecclesiarchy"],"ref":null,"lore":"Raised on a world that exists to host a major Imperial shrine or relic — a childhood steeped in pilgrimage traffic and daily liturgy.","design":"Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Shrine-Born","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"Liturgy absorbed since infancy from the endless pilgrim traffic.","design":"Perk (B9), +1 to Theology (Imperial Creed).","weapons":[],"feat":{"dr":[],"other":["Theology (Imperial Creed) +1"]}},{"name":"Scandalised by Impiety","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Open blasphemy or casual disregard for ritual visibly unsettles a shrine-world native.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Void-Born Origin","points":0,"tags":["Imperium"],"ref":null,"lore":"Born aboard a voidship, space station, or Rogue Trader vessel and never planetside until adulthood, if ever — a background Rogue Trader-line fiction and Only War's Void Born package both use, with the same trade-off: comfortable in zero-g and cramped spaces, unsettled by open planetary horizons.","design":"Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Void-Born","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"A lifetime in zero-g and vacuum-rated corridors.","design":"Perk (B9), +1 to Free Fall.","weapons":[],"feat":{"dr":[],"other":["Free Fall +1"]}},{"name":"Planetsick","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Open sky and true gravity wells feel wrong after a life spent in the void.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}}]}],"count":36},{"id":"imperium--traits--psykers-and-the-warp","title":"Psykers and the Warp","section":"Imperium/Traits","kind":"traits","path":"Imperium/Traits/Psykers and the Warp.adq","items":[{"name":"Unusual Background (Latent Psychic Potential)","points":10,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Psychic ability is a random, rare mutation of the human genome that lets its bearer perceive and touch the immaterium (the warp). Sources disagree on exact frequency — Imperial administrative texts and Dark Heresy-line background both describe it as \"rare but not vanishingly so,\" on the order of a handful of latent potentials per hive-sized population, with usably strong psykers far rarer still. Treat any precise ratio as flavour, not census data.","design":"Required to take Psyker (Talent), Warp Empowerment, or any trait carrying the Warp Sorcery power modifier below. Basic Set B261 leaves Unusual Background costs to the GM; 10 points reflects that the ability itself is not learned but grants access to an entire framework of further abilities, roughly the going rate other published settings use for \"you may buy from this power list at all.\"","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Warp Empowerment","points":20,"tags":["Advantage","Mental","Talent","Psyker","Imperium"],"ref":"TSOR4","notes":"A direct reskin of Sorcerous Empowerment (Thaumatology: Sorcery, TSOR4):\nthe psyker's raw, trained capacity to draw on and shape the warp, as\ndistinct from Psyker (Talent, TSOR5's Sorcery Talent analogue, below)\nwhich only sharpens related skills. Requires Unusual Background (Latent\nPsychic Potential). It is the prerequisite for every Warp Sorcery-tagged\nability in this file (see Witch-sight and each discipline below); the\nNavigator's Third Eye and the Pariah/Untouchable genes carry no Warp\nSorcery modifier and so need no Warp Empowerment.\n\nCap, cast per Thaumatology: Sorcery (TSOR): a psyker may only know a\npower whose full, modified point cost is no greater than the point cost\nof their own Warp Empowerment (10 + 10/level). A power bought at a\nhigher level (more dice, more range, etc.) costs proportionally more and\nmay outgrow a psyker's Empowerment even after they first learned it at a\ncheaper level — raising the level, and cost, of Warp Empowerment is how\na psyker \"grows into\" costlier or higher-level workings.\n\nImperial Assignment scale (Adeptus Astra Telepathica / Black Ships)\nmapped to Warp Empowerment level and the point cap that gives, worked\nout from this file's actual (Warp Sorcery -20% + Perils of the Warp)\nmodified costs:\n\nGrade      | Empowerment level | Cap (10+10/lvl) | What the cap reaches\n  Iota       | 1                  | 20              | cheapest powers only: e.g. Smite (3), Endurance (2), Iron Arm (4), Fire Bolt (4), Assail (4), Mind Probe (14), Foresight (18) — register but rarely learn more than one or two\n  Zeta       | 1                  | 20              | as Iota; low Psyker Talent limits skill use, not what they can know\n  Eta        | 1                  | 20              | as Zeta\n  Theta      | 2                  | 30              | adds Molten Beam (9), Crush (11), Psychic Scream (12), Sanctuary (13), Null Zone (23), Terrify (28)\n  Epsilon    | 2                  | 30              | as Theta (typical Wyrdvane conscript)\n  Delta      | 3                  | 40              | adds Scrier's Gaze (35), Dominate (35), Gate of Infinity (40) — the full non-Great-Power roster (typical Sanctioned Primaris Psyker)\n  Gamma      | 3                  | 40              | as Delta, better skills from a higher Psyker Talent\n  Beta       | 4                  | 50              | full roster, with headroom to push a known leveled power to a higher level/more dice (many Astropaths)\n  Alpha      | 5                  | 60              | full roster, generous headroom for high-level workings (Astartes Librarians, Black Ship candidates)\n  Alpha-Plus | 7+ (GM only)       | 80+             | approaching Great Power territory; Vortex of Doom (280+ as usually bought) is still normally out of reach even here\n\nA character need not buy Warp Empowerment up to their grade's full\nceiling: templates in this project buy only the level their actually-\nknown powers need, and note the grade's theoretical ceiling separately.","lore":"The Iota-to-Alpha-Plus assignment scale is drawn from the Adeptus Astra Telepathica's own grading of psychic potential as depicted across Dark Heresy-line material and repeated in Codex/Imperial Armour background; Black Library uses the same grades in passing (e.g. Eisenhorn-cycle and Ciaphas Cain references to Alpha-class talents). \"Alpha-Plus\" specifically denotes the rarest, most dangerous talents the Black Ships process.","design":"Sorcerous Empowerment (TSOR4) costs 10 base + 10/level (level 1 = 20 points, each further level +10) in the GCS master Thaumatology data; reused verbatim here under a 40k-appropriate name, since the underlying mechanic — \"how much warp-power you can channel at all, gating which spells/powers you may know by their modified cost\" — is exactly what an Imperial Assignment grade represents. The level-to-grade mapping above is derived, not asserted: it walks every power in this file's actual modified cost (recomputed under the new Warp Sorcery -20% modifier, see below) and finds the cheapest Empowerment level whose cap clears it, so \"Iota can only cast minor powers\" and \"Alpha can cast the biggest non-Great-Power ability\" are literally true of the numbers, not just flavour text.","weapons":[],"feat":{"dr":[],"other":[]},"levels":1},{"name":"Warp Sorcery (Power Modifier)","points":0,"tags":["Reference","Psyker","Imperium"],"ref":null,"notes":"Not purchased on its own. Apply \"Warp Sorcery, -20%\" as a modifier to every advantage built as a psychic ability in this file (Innate Attack, Affliction, Mind Control, Mind Probe, Mind Reading, Telekinesis-based traits, Terror, etc.), cast per Thaumatology: Sorcery (TSOR) — casting any such power costs 1 FP, exactly as a Sorcery spell does. It does not apply to the Blank/Pariah gene or the Navigator's third eye, which are inborn mutations, not channelled acts.","lore":"Every psychic act in the fiction shares three traits: it can be shut down by a null field (Culexus Assassins, Officio Assassinorum \"blanks,\" null rods, hexagrammic wards, a ship's Geller field extending into a room), it can be sensed by other warp-touched minds (daemons home in on strong psykers; astropaths and Inquisitors can feel a working; the Black Ships find latent talents this way), and using it always risks the warp answering back (see Perils of the Warp, below). Black Library depictions (Eisenhorn, Ravenor, Ahriman, the Horus Heresy Librarius material) and Dark Heresy/Rogue Trader's psychic-power rules agree on all three points.","design":"Sorcery (-15%, Thaumatology: Sorcery, TSOR) is Basic's own Mana Sensitive-weight power modifier for spells cast from the caster's own inner power rather than ambient mana: it fails against blanks/pariahs, null rods, hexagrammic and psychic wards, and inside a Geller field, as appropriate to the scene — the mechanical equivalent of Sorcery's own \"no mana, no spell\" clause re-read for the 40k setting's specific null sources. Stacked with Detectable, -5% (kept from this project's own original design): other warp-sensitive beings (psykers, daemons, the Astronomican-attuned) can sense the use, roughly the mirror of Basic's No Signature enhancement (+20%, B111) which buys detectability away entirely; here only a narrow audience can detect it, so removing that audience's free ability to sense you is worth a smaller -5%. Net: -20%, applied identically to every Warp Sorcery-tagged ability so their relative costs stay comparable. This replaces the project's earlier bespoke -15% \"Warp\" modifier now that the whole framework is rebuilt on Thaumatology: Sorcery's chassis; Perils of the Warp (below) still stacks on top as the setting-specific risk Sorcery itself doesn't model.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Perils of the Warp (Limitation)","points":0,"tags":["Reference","Psyker","Imperium"],"ref":null,"notes":"Not purchased on its own. Apply \"Perils of the Warp, -10%\" (or the Severe\nvariant, -20%, for rituals, Great Powers, and interstellar workings called\nout below) to every Warp-tagged advantage.\n\nWhenever a character uses an ability carrying this limitation, roll vs\nWill (modified by any Pushing, see below, and by GM-set warp conditions:\n-1 to -5 near a Chaos icon, inside a warp storm, on a ship whose Geller\nfield is failing, etc.). Success: the power works with no ill effect.\nFailure, consult the margin:\n  - Failed by 1-2 (Minor Perils): lose 1 FP; migraine or nosebleed; -1 to\n    the next IQ-based roll this scene.\n  - Failed by 3-5 (Moderate Perils): 1d damage, ignores DR (warp-shock);\n    the power still fizzles; anyone adjacent makes a Fright Check.\n  - Failed by 6-9 (Major Perils): 2d damage, ignores DR; the psyker is\n    stunned (roll vs HT each turn to recover); a minor manifestation\n    appears nearby (cold spot, whispering, flickering shadow) and\n    witnesses roll Fright Check at -2.\n  - Failed by 10+, or an unmodified 18: Catastrophic. A warp rift may\n    open, or a daemon attempts possession: Quick Contest of Will against\n    the daemon (GM sets 12-16 for a minor one) or the psyker is possessed,\n    killed, or reduced to a Chaos Spawn, GM's call. The triggering power\n    still goes off, at full or worse effect, entirely out of its user's\n    control.\n\nPushing: before rolling, a psyker may declare up to 3 pushes. Each push\ngrants +1 to the ability's effective level (an extra die, +1 to an\nAffliction, one more yard of Move, etc., GM's call for the specific power)\nbut applies a cumulative -2 to this Perils roll. Pushing represents\ndrawing more of the warp than the caster's mind and body can safely carry.","lore":"Calibrated against Dark Heresy's Psychic Phenomena/Perils of the Warp tables, the best worked example of \"using your gift can doom you,\" and against countless Black Library scenes of psykers burning out, exploding, or being possessed the instant they overreach (Ahriman's own Rubric; Quixos in Eisenhorn; any Chaos-touched sorcerer's Perils rolls in the Black Library Horus Heresy Librarius stories).","design":"Standard, -10%: comparable in total weight to Basic's Costs Fatigue (-5%, B112, a guaranteed minor cost) stacked with a low-frequency chance of a serious complication similar in spirit to Unreliable (-5% to -10%, B113) — bundled here as one flat roll-and-consult-a-table limitation instead of tracked as separate costs, since the system assumes a single check per activation rather than a metered resource. Severe, -20%: used on rituals, Great Powers, and interstellar workings (Gate of Infinity, Astrotelepathy, Vortex of Doom, Sanctic Daemonology's Banishment and Sanctuary, Librarius's Null Zone) where any serious failure can open a rift regardless of scale — double the standard weight, echoing how Basic's Always On climbs from -10% to -40% (B113) as an effect becomes harder to control.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Psyker","points":10,"tags":["Advantage","Mental","Talent","Psyker","Imperium"],"ref":"TSOR5","notes":"This project's Sorcery Talent (Thaumatology: Sorcery, TSOR5) analogue:\napplies as Sorcery Talent applies to a sorcerer's skills in TSOR, just\nto a 40k-specific list — Psyniscience, Meditation, Hidden Lore (the\nWarp), and the Will roll to resist Perils of the Warp (see above) — a\nhouse extension of Talent's normal \"add to listed skills\" rule,\nprecedented by Magery's and Sorcery Talent's own habit of aiding\nrelated rolls beyond pure spellcasting. Reaction bonus: +1/level from\nother sanctioned psykers and the Astra Telepathica.\n\nPsyker (Talent) and Warp Empowerment are separate purchases on separate\naxes, exactly as Sorcery Talent and Sorcerous Empowerment are in TSOR:\nthis trait only sharpens related skills and Perils resistance, while\nWarp Empowerment (above) is what actually gates which powers a psyker\nmay know. A high-Talent, low-Empowerment psyker is a sharp, well-drilled\nmind who simply hasn't learned much yet; the reverse is a raw prodigy\nwho is clumsy with the skills around their gift.\n\nImperial Assignment scale (Adeptus Astra Telepathica / Black Ships),\nweakest to strongest, mapped to Talent level. See Warp Empowerment above\nfor the matching Empowerment level/point-cap column, which is the real\ngate on ability selection:\n  Iota    — Talent 0 (latent; register but rarely take Psyker traits at all)\n  Zeta    — Talent 1\n  Eta     — Talent 1\n  Theta   — Talent 2\n  Epsilon — Talent 2  (typical Wyrdvane conscript)\n  Delta   — Talent 3  (typical Sanctioned Primaris Psyker)\n  Gamma   — Talent 4\n  Beta    — Talent 4  (many Astropaths)\n  Alpha   — Talent 5  (Astartes Librarians, Black Ship candidates)\n  Alpha-Plus — Talent 6+ (beyond-play tier: Primarchs,\n    the most powerful Inquisitors, the worst Chaos sorcerers)","lore":"The Iota-to-Alpha-Plus assignment scale is drawn from the Adeptus Astra Telepathica's own grading of psychic potential as depicted across Dark Heresy-line material and repeated in Codex/Imperial Armour background; Black Library uses the same grades in passing (e.g. Eisenhorn-cycle and Ciaphas Cain references to Alpha-class talents). \"Alpha-Plus\" specifically denotes the rarest, most dangerous talents the Black Ships process.","design":"Talent affecting four things (three skills plus the Perils resistance roll) sits at Basic's \"Medium Talent\" rate of 10 points/level (B90, three-to-five-skill bracket) rather than 5 (one-two skills) or 15 (six-nine skills) — the same rate Sorcery Talent itself uses (TSOR5, 10/level). Capped at level 6 for player characters; higher grades are GM-reference only, per the framework's \"Beyond play\" tier.","weapons":[],"feat":{"dr":[],"other":[]},"levels":1},{"name":"Witch-sight","points":8,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The first, mildest sign of the gift: an unlearned, passive prickling sense of daemonic taint, psychic activity, and warp corruption — how unsanctioned psykers are so often found, and how veteran Inquisitors and Space Marines notice a place has gone wrong before anything visible happens. Widely depicted; no single canonical source, consistent across Black Library and Dark Heresy-line material alike.","design":"Built as Detect (Psychic Activity & Daemonic Taint), an uncommon but not vanishingly rare category, base 10 per Basic's Detect cost table (B47-48). No Perils of the Warp: it is involuntary background sense, not a deliberate act of channelling. Full modified cost: 10 x 0.8 = 8 points; needs only Warp Empowerment level 1 (cap 20) — even an Iota-grade latent can have it, matching how often unsanctioned psykers are found by exactly this unlearned sense.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""}]},{"name":"Unsanctioned Psyker","points":-20,"tags":["Disadvantage","Mental","Social","Psyker","Imperium"],"ref":null,"lore":"Discovery of an unregistered psyker is, at best, summary transport to a Black Ship and Soul-binding or the Scholastia Psykana; at worst, on-the- spot execution by any Adepta Sororitas, Inquisitor, or panicking mob with a lasgun. This is one of the most consistent beats in Black Library's Imperium (Eisenhorn's witch-hunts; the fate of countless minor characters across the Gaunt's Ghosts and Ciaphas Cain series) and Dark Heresy's default assumption for any PC psyker who hasn't been Sanctioned.","design":"A single Secret (Basic B94-95) covers it: discovery is not rare (any strong emotional moment or unlucky witness can trigger it) and its consequences are severe and often fatal, so it sits at -20 points, toward the harsh end of Secret's usual range.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Secret (Unsanctioned Psyker)","points":-20,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":"B94","notes":"Exposure means the Black Ships, summary execution, or worse.","lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Sanctioned Psyker","points":-15,"tags":["Disadvantage","Mental","Social","Psyker","Imperium"],"ref":null,"lore":"A Sanctioned psyker has passed through the Scholastia Psykana or an equivalent rite, is legally registered, and typically serves the Astra Militarum, an Inquisitor, or their Chapter's Librarius. They are watched, bound by oath and duty, and — even legally protected — are still called \"witch\" behind their back by the citizens they defend. Consistent across Dark Heresy/Only War's Sanctioned-psyker rules and Black Library's depiction of Primaris Psykers and Astartes Librarians alike.","design":"Duty to the Astra Telepathica/Inquisition (Basic B133 Duty table, hazardous, 12 or less) at -10, plus a mild, legally-protected Social Stigma (\"sanctioned witch,\" -5, lighter than Basic's Minority Group tier because the law is nominally on their side). Net -15.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Duty (Astra Telepathica/Inquisition, 12 or less)","points":-10,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Social Stigma (Sanctioned Psyker)","points":-5,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Soulbinding (Astropathic Choir)","points":-55,"tags":["Disadvantage","Physical","Mental","Psyker","Imperium"],"ref":null,"lore":"To become an Astropath, a Sanctioned psyker undergoes the soul-binding ritual: their eyes are burned out and their mind is bound, in a small part, to the Emperor's own psychic light on the Astronomican, so that their thoughts can be found and carried across interstellar distances. They are permanently blind and permanently, irrevocably in the Emperor's and the Imperium's service from that day on. This is standard background across Dark Heresy/Rogue Trader's Astropath material and referenced throughout Black Library whenever an Astropathic Choir appears (e.g. the Horus Heresy's Astropaths aboard Legion flagships).","design":"Blindness (Basic B140, -50) is the dominant cost; it is not mitigated mechanically here (their remaining \"sight\" is represented by Witch-sight and their Telepathy powers, not a vision substitute). Mindlink to the Astronomican/the Emperor's light (Basic Mindlink, a specific \"person,\" 5 points) is a genuine benefit — it is how they are found and relayed across the void. Sense of Duty to the Imperium of Man (a very-large-group Sense of Duty, -10, Basic's tier below \"entire race\") completes the package. Net -55.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Blindness","points":-50,"tags":["Disadvantage","Physical","Psyker","Imperium"],"ref":"B140","lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Mindlink (the Astronomican)","points":5,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Imperium of Man)","points":-10,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Pariah Gene (Blank)","points":9,"tags":["Advantage","Disadvantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A blank is born, not made: a rare genetic absence that leaves a person's soul all but invisible in the warp, and makes the warp itself recoil from them. Psykers, daemons, and even animals find blanks instinctively unsettling to be near — a \"hole\" where a presence should be. Depicted consistently across Black Library (the Culexus Temple's \"Untouchables,\" Cain-series and Eisenhorn-cycle blanks) and Dark Heresy/Only War's Untouchable career.","design":"Deliberately carries no Warp Sorcery or Perils of the Warp modifier, and needs no Warp Empowerment: a Pariah's field is the *absence* of the warp, not a channelled act, so none of the framework's activation risk or spell-cost cap applies. See each child trait for its own derivation. Net for the package: +12 (Null Aura) +10 (Immunity) -3 (Unnerving Void) -10 (Social Stigma) = +9.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Null Aura","points":12,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The blank's presence itself smothers nearby psychic workings — the basis for why the Inquisition uses blanks to hunt witches and why daemons fear and hate them.","design":"Built on Affliction (Basic B35): base 10, the delivered \"Warp- Choked\" disadvantage is valued at -30 points for the enhancement math (+30%), stacked with Area Effect (+50%, B102, 2-yard radius), Always On (-40%, B113, it can't be switched off or aimed), and Emanation (-20%, B111, no ranged attack roll, just proximity).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Disadvantage Delivered (Warp-Choked","cost":"+30%","notes":"Any Warp-tagged ability used in the area must be rolled again as if failed; already-running continuous Warp effects go inert while inside it."},{"name":"Area Effect, 2 yards","cost":"+50%","notes":""},{"name":"Always On","cost":"-40%","notes":""},{"name":"Emanation","cost":"-20%","notes":""}]},{"name":"Immunity to Warp-Based Effects","points":10,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Warp-based Affliction, Mind Control, Mind Probe, and Fear simply do not work on a Pariah.","design":"Resistant, Immunity tier (Basic B80: base rarity value x5). Warp- based attacks are treated as an \"occasional\" specific hazard (base 2) for a Pariah, since it is their entire defining trait, giving 2 x 5 = 10.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Unnatural Features (Unnerving Void)","points":-3,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"People and animals find a Pariah's presence quietly, deeply wrong.","design":"Basic's Unnatural Features (per-level reaction penalty), 3 levels of -1 each.","weapons":[],"feat":{"dr":[],"other":[]},"levels":3},{"name":"Social Stigma (Feared Blank)","points":-10,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"Feared and, in many sectors, watched or conscripted by the Inquisition and the Officio Assassinorum.","design":"Basic's Social Stigma (Minority Group), -10 (B155).","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Pariah Gene (Untouchable)","points":17,"tags":["Advantage","Disadvantage","Mental","Psyker","Imperium"],"ref":null,"lore":"An Untouchable is a blank whose gene runs stronger still — the raw material from which the Officio Assassinorum's Culexus Temple recruits. Their null field is wider, their touch is actively harmful to warp- spawned things, and ordinary people find them nearly impossible to be near for long. This trait models the degree only, not a full Culexus Assassin (animus speculum, etc. belong to that unit's own writeup).","design":"Same components as Pariah Gene, scaled up: wider Null Aura, a new Soul-Static Discharge that actively harms warp-touched creatures in contact, deeper social cost. Net: +22 (Null Aura) +5 (Soul-Static Discharge) +10 (Immunity) -5 (Unnerving Void) -15 (Social Stigma) = +17.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Null Aura (Wide)","points":22,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"See Pariah Gene's Null Aura; the field simply reaches further.","design":"As Pariah Gene's Null Aura, but Area Effect scaled to the 8-yard tier (+150%, B102) instead of 2 yards.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Disadvantage Delivered (Warp-Choked","cost":"+30%","notes":""},{"name":"Area Effect, 8 yards","cost":"+150%","notes":""},{"name":"Always On","cost":"-40%","notes":""},{"name":"Emanation","cost":"-20%","notes":""}]},{"name":"Soul-Static Discharge","points":5,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Warp-spawned creatures — daemons, Chaos Spawn, warp-touched beasts — burn where an Untouchable's field touches them.","design":"Innate Attack (Toxic, 4/die, B61) with Aura (+80%, B111, automatic contact damage), Always On (-40%), and Accessibility limiting it to warp-touched targets only (-20%).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Aura","cost":"+80%","notes":""},{"name":"Always On","cost":"-40%","notes":""},{"name":"Accessibility (only vs. Warp-touched/daemonic creatures)","cost":"-20%","notes":""}]},{"name":"Immunity to Warp-Based Effects","points":10,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"As Pariah Gene.","design":"As Pariah Gene's Immunity to Warp-Based Effects.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Unnatural Features (Unnerving Void, Deep)","points":-5,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"Few can stand to be near an Untouchable for long.","design":"As Pariah Gene, at 5 levels instead of 3.","weapons":[],"feat":{"dr":[],"other":[]},"levels":5},{"name":"Social Stigma (Monster)","points":-15,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"Treated by most Imperial citizens as barely human — when not simply recruited and vanished by the Officio Assassinorum.","design":"Basic's Social Stigma (Monster), -15 (B155).","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Navigator's Third Eye","points":22,"tags":["Advantage","Disadvantage","Mental","Psyker","Imperium","Navis Nobilite"],"ref":null,"lore":"House Navigators carry a third eye, fused shut beneath the brow, that perceives the Astronomican's light and the safe currents of the warp well enough to steer a ship through it — and that kills or maddens anyone it meets uncovered. Navigators keep the eye bound at all times except when navigating from a shielded bridge. The clearest published detail on this comes from the Rogue Trader corebook's Navigator background rather than Black Library, which mostly gestures at the Navis Nobilite and the \"third eye\" in passing (e.g. Horus Heresy-era references); treat the RPG-tier material as the calibration source here per the framework's source-priority rule. Over centuries of psychic strain, aged Navigators are widely depicted as growing increasingly strange or deformed (a GM-invoked cosmetic/social disadvantage for very old Navigators — e.g. escalating Unnatural Features — rather than a fixed cost baked into this trait).","design":"Deliberately carries no Warp Sorcery or Perils of the Warp modifier, and needs no Warp Empowerment: the third eye is an always-on inherited mutation, not a deliberately channelled act — though a GM is free to call for a one-off Perils-style check during an extreme event like flying blind through a warp storm. Net for the package: 12 (Warp Sight) + 6 (Lethal Gaze) = 18.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Warp Sight","points":13,"tags":["Advantage","Mental","Psyker","Imperium","Navis Nobilite"],"ref":null,"lore":"What lets a Navigator see the Astronomican's beacon and the warp's safer currents across a voyage, letting a ship cross the immaterium without being lost or devoured.","design":"Detect (Basic B47-48), base 5 for an uncommon, specific thing; Precise doubles that (expressed here as +100%, equivalent to Basic's x2 multiplier); Increased Range at the highest tabled step (+60%, the \"100x\" tier) reflects effectively unlimited range while the eye is open in transit; Accessibility (-10%) reflects that it only works, and is only tolerable, while uncovered.","weapons":[],"feat":{"dr":[],"other":["Navigation (Warp) +4"]},"mods":[{"name":"Precise","cost":"+100%","notes":""},{"name":"Increased Range x100","cost":"+60%","notes":""},{"name":"Accessibility (only while the third eye is uncovered)","cost":"-10%","notes":""}]},{"name":"Lethal Gaze","points":9,"tags":["Disadvantage","Advantage","Mental","Psyker","Imperium","Navis Nobilite"],"ref":null,"lore":"This is why the eye stays bound: anyone who meets it directly, with no warding, risks death or madness. It is a narrative hazard for the people around a Navigator far more than a usable weapon for the player.","design":"Affliction (Basic B35), base 10, delivering a -50 point \"Mind-Sundering\" disadvantage (+50%); Sense-Based (Vision) (-20%, B112, only affects those who can see the eye); Uncontrollable (-30%, B113, the Navigator cannot pick and choose who is struck); Accessibility limiting it to moments the eye is uncovered (-10%).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Disadvantage Delivered (Mind-Sundering","cost":"+50%","notes":"An unshielded mortal who meets the open eye is killed, driven mad, or worse, GM's call; only other Navigators and comparably warp-touched beings routinely survive it."},{"name":"Sense-Based (Vision)","cost":"-20%","notes":""},{"name":"Uncontrollable","cost":"-30%","notes":""},{"name":"Accessibility (only when the third eye is uncovered)","cost":"-10%","notes":""}]}]},{"name":"Biomancy","points":33,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The discipline of the flesh: hardening it, mending it, driving it faster than it should go, or unmaking an enemy's body from the inside. Calibrated against Dark Heresy's Biomancy power list (Smite, Iron Arm, Warp Speed, Haemorrhage all appear there under close-to-these names) and Black Library depictions of Biomancer-Librarians and Chaos \"physicians.\"","design":"Talent-linked group; see each child for build math. All children take Warp Sorcery (-20%) and Perils of the Warp (-10%) unless noted.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Smite","points":3,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A short-ranged bolt of biomantic force that ruptures vessels and boils blood.","design":"Innate Attack (Toxic, 4/die, B61) with the standard Warp Sorcery/ Perils pair, net -30%. Full modified cost: 4 x 0.7 = ~3 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Endurance","points":3,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Wards off fatigue and pain in battle by forcing the body past its limits.","design":"Extra Fatigue Points (3/level, B ~power-ups table) with Warp Sorcery/Perils, net -30%. Full modified cost: ~2 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Warp Speed","points":4,"tags":["Advantage","Physical","Psyker","Imperium"],"ref":null,"lore":"Quickens the caster's own nervous system and reflexes to a blur.","design":"Increased Basic Speed (5 points per +0.25, B) with Warp Sorcery/ Perils, net -30%; the resulting Dodge increase comes free from Basic's normal Speed-to-Dodge derivation, no separate purchase needed. Full modified cost: ~4 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Iron Arm","points":4,"tags":["Advantage","Physical","Psyker","Imperium"],"ref":null,"lore":"Hardens flesh and bone into something closer to ceramite for a few seconds.","design":"Damage Resistance (5/level, B) with Warp Sorcery/Perils, net -30%. Full modified cost: ~4 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Haemorrhage","points":19,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Ruptures blood vessels inside a target from a distance, with no visible attack to dodge.","design":"Affliction (10/level, B35) delivering a -20 point bleeding/nauseated disadvantage (+20%), Malediction (+100%, B36, resisted by HT instead of dodged), plus Warp Sorcery/Perils, net +90%. Full modified cost: 10 x 1.9 = 19 points/level; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Disadvantage Delivered (Bleeding/Nauseated","cost":"+20%","notes":""},{"name":"Malediction 1","cost":"+100%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]},{"name":"Divination","points":82,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Sight beyond the present moment: warnings, glimpses of the future, remote viewing, and turning fortune against an enemy. Calibrated against Dark Heresy's Divination list (Foreboding, Machinate, Fate's Hand, Scrier's Gaze all map closely) and Black Library's recurring \"the Emperor's seers dream of what is to come\" beats.","design":"Talent-linked group; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Foresight","points":18,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A flash of true precognition — a moment's warning of what is about to happen.","design":"Precognition, Basic's core advantage, flat 25, with Warp Sorcery/ Perils, net -30%. Full modified cost: 25 x 0.7 = ~18 points; needs Warp Empowerment level 1 (cap 20). Notably cheap for how strong the fiction makes true precognition sound — a case where a flat Basic advantage's cost doesn't scale with narrative weight the way the leveled Innate Attack-style powers do; see the file-level report.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Forewarning","points":11,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"An unbidden sense that danger is close, before it strikes.","design":"Danger Sense, Basic's core advantage, flat 15, with Warp Sorcery/ Perils, net -30%. Full modified cost: 15 x 0.7 = ~11 points; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Misfortune","points":18,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Turns an enemy's own luck against them — the misfire, the missed step, the wrong turn.","design":"Affliction (10/level) delivering Unluckiness (-10 points, +10%, matching Basic's own Unluckiness cost), Malediction (+100%), Warp Sorcery/Perils, net +80%. Full modified cost: 10 x 1.8 = 18 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Disadvantage Delivered (Unluckiness","cost":"+10%","notes":""},{"name":"Malediction 1","cost":"+100%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Scrier's Gaze","points":35,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Projects the caster's sight to a distant or hidden place.","design":"Clairsentience, Basic's core advantage, flat 50, with Warp Sorcery/ Perils, net -30%. Full modified cost: 50 x 0.7 = 35 points; needs Warp Empowerment level 3 (cap 40) — one of the pricier single-flat Divination powers.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]},{"name":"Pyromancy","points":21,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Fire called from nothing, or matter itself set alight and melted. Calibrated against Dark Heresy's Pyromancy list (Fire Bolt, Fire Storm, Molten Beam all appear near-verbatim) and the recurring Black Library image of a pyromancer's target simply combusting.","design":"Talent-linked group; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Fire Bolt","points":4,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A thrown bolt of raw fire, the pyromancer's most basic attack.","design":"Innate Attack (Burning, 5/die, B61) with Warp Sorcery/Perils, net -30%. Full modified cost: 5 x 0.7 = ~4 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Inferno/Molten Beam","points":11,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Two faces of the same power over fire and molten matter: a bursting fireball for a crowd, or a focused, armour-melting beam for a single hard target. A pyromancer trains both together and switches between them freely, never both at once.","design":"Built as GCS's alternative_abilities container: full price for the costlier child (Molten Beam) plus a fifth the cost of the cheaper one (Inferno), per Basic's Alternate Abilities rule.","weapons":[],"feat":{"dr":[],"other":[]},"container":"alternative_abilities","children":[{"name":"Inferno","points":6,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A bursting fireball that engulfs a small area.","design":"Innate Attack (Burning, 5/die) with Explosion (+50%, B106, 2-yard burst) plus Warp Sorcery/Perils, net +20%. Full modified cost: 5 x 1.2 = 6 points/level (discounted to a fifth as the cheaper alternative ability); needs Warp Empowerment level 1 (cap 20) at its full-price rate.","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Explosion","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Molten Beam","points":9,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A focused beam of molten matter that burns straight through armour.","design":"Innate Attack (Burning, 5/die) with Armor Divisor (3) (+100%, B103) plus Warp Sorcery/Perils, net +70%. Full modified cost: 5 x 1.7 = ~9 points/level (the costlier child, so it sets the alternative_abilities container's cap requirement); needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Armor Divisor (3)","cost":"+100%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]},{"name":"Flame Breath","points":6,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A gout of fire breathed out in a cone in front of the caster.","design":"Innate Attack (Burning, 5/die) with Cone (+50%, B103) plus Warp Sorcery/Perils, net +20%. Full modified cost: 5 x 1.2 = 6 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Cone","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]},{"name":"Telekinesis","points":62,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Force of will made physical: hurled objects, barriers of solid air, crushing grips, and — at its rarest and most dangerous — stepping instantly from one place to another. Calibrated against Dark Heresy's Telekinesis list (Assail, Kinetic Barrier/Shield, Crush, Warp Conduit/Gate of Infinity all map closely).","design":"Talent-linked group; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Assail","points":4,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Hurls the nearest loose object, or the target themselves, with bruising force.","design":"Innate Attack (Crushing, 5/die, B61) with Warp Sorcery/Perils, net -30%. Full modified cost: 5 x 0.7 = ~4 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Force Dome/Kinetic Shield","points":7,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The same telekinetic barrier, bought as one power: held tight around the caster alone, or opened out to cover the whole squad.","design":"Alternative_abilities container; full price for the costlier Force Dome plus a fifth of Kinetic Shield.","weapons":[],"feat":{"dr":[],"other":[]},"container":"alternative_abilities","children":[{"name":"Kinetic Shield","points":4,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A tight telekinetic skin around the caster alone.","design":"Damage Resistance (5/level, B), self only, with Warp Sorcery/ Perils, net -30%. Full modified cost: 5 x 0.7 = ~4 points/level (discounted to a fifth as the cheaper alternative ability); needs Warp Empowerment level 1 (cap 20) at its full-p
