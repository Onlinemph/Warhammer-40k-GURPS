 shrugging off blinding light that would stagger a human.","design":"Acute Vision 2 (B35, 2/level, 4 points) for the raw acuity; Protected Sense (Vision) (B78, 5 points) so flash/glare can't blind the organ outright. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Vision","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Vision)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Lyman's Ear","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Reinforces the inner ear against the constant concussion of bolter fire and explosions while sharpening hearing and balance, so an Astartes can still track sound and stay upright through the kind of noise that would deafen and disorient an unaugmented soldier.","design":"Acute Hearing 2 (B35, 2/level, 4 points) plus Protected Sense (Hearing) (B78, 5 points) against deafening/concussive noise. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Hearing","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Hearing)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Sus-an Membrane","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Lets an Astartes drop, on command, into a deep hibernation that slows metabolism to near nothing — used for long void crossings in a survival capsule, or to ride out wounds that would otherwise be fatal by shutting down everything but core function. Depicted as something that takes real time to enter and leave, not an instant reflex.","design":"Custom build shown for transparency rather than a straight RAW pull: Doesn't Eat or Drink (B50, 10) + Doesn't Breathe (B49, 20) = 30 points of effect, but only while deliberately entering the trance, which takes about a minute either way — an Accessibility-style limitation worth roughly -70% (comparable to \"Trance Only\" in scope and severity). 30 x 0.3 = 9 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Melanchromic Organ","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Radiation Tolerance (PF 5) plus a 1-point Perk for voluntary pigment control.","lore":"Controls skin pigmentation and shields the body against radiation and hard UV, letting Astartes operate on irradiated battlefields and hostile worlds. Its baseline output varies by Chapter gene-seed — most notably the Salamanders, whose Melanchromic Organ runs permanently at full output (see the Chapter lens below).","design":"Radiation Tolerance (B79), PF 5 (10 points) for the shielding effect, plus a 1-point Perk for voluntary control over pigmentation (camouflage/recognition flavor, no fixed numeric benefit). 11 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Oolitic Kidney","points":15,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A backup kidney that aggressively filters toxins circulating in the blood — venoms, industrial poisons, battlefield chemical agents — rather than the ones Preomnor already caught at the gut.","design":"Resistant (B81), Common: Poison, Immunity — base 15, x1 for Immunity = 15 points. Priced above Preomnor because it covers poison from any route of entry, not just food.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Neuroglottis","points":21,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Pushes taste and smell to a level that lets an Astartes identify an individual, a poison, or a chemical trace by scent alone, and track a quarry across terrain a hound couldn't follow.","design":"Discriminatory Smell (B49, 15 points, identify/track individuals and substances by scent) plus Acute Taste & Smell 3 (B35, 2/level, 6 points) for raw sensitivity. 21 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Discriminatory Smell","points":15,"tags":[],"ref":"B49","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Acute Taste & Smell","points":6,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Mucranoid","points":20,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Secretes a waxy, oily film that can be triggered to seal pores and orifices against vacuum, toxic atmosphere, and radiation, and that also insulates against extreme heat and cold.","design":"Sealed (B82, 15 points) covers vacuum/toxin/radiation sealing; Temperature Tolerance 5 (B93, 1/level, 5 points) covers the thermal insulation. 20 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Sealed","points":15,"tags":[],"ref":"B82","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Temperature Tolerance","points":5,"tags":[],"ref":"B93","weapons":[],"feat":{"dr":[],"other":[]},"levels":5}]},{"name":"Betcher's Gland","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Produces a corrosive, mildly toxic saliva. Fiction plays this as a minor, opportunistic weapon and a way to shrug off ingested poisons and diseased food in the mouth — not a primary attack for a Marine who has a bolter.","design":"Innate Attack (Corrosion) at a token 1d, melee reach C only (B61, roughly 3 points after the reach/range restriction) for the spit; 1-point Perk for the minor oral antitoxin effect (overlaps in concept with Preomnor, so kept nominal). 4 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Corrosive Spit","points":3,"tags":[],"ref":null,"weapons":[{"melee":true,"usage":"Spit","damage":"1d cor","skill":"Brawling","notes":"","reach":"C","parry":"No"}],"feat":{"dr":[],"other":[]}},{"name":"Oral Poison Filter","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Progenoid Glands","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Two glands that mature over years into a bank of \"zygotes\" — genetic material an Apothecary harvests from the fallen to seed new recruits. Central to how a Chapter perpetuates and safeguards its gene-seed line, but they confer no combat benefit on the Marine who carries them; their value is entirely to the Chapter after death.","design":"1-point Perk (B21): a narrative/plot-hook organ (its condition can matter for Apothecary rolls or a Chapter's gene-seed politics) with no combat mechanic of its own.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Black Carapace","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"A synthetic interface grafted under the skin across the torso and spine and wired into the nervous system, grown last, only after a Scout has proven himself and is elevated to full Battle-Brother. It lets a suit of power armour read a Marine's nervous impulses directly, so the armour moves as an extension of the body rather than a piloted shell.","design":"The mechanical payoff (full reflexes, no bulk/encumbrance penalty, no clumsy manual controls) is a property of Astartes power armour equipment and belongs on that equipment's entry, not duplicated here, since a Marine without a suit to plug into gets nothing from it in play. Kept as a 1-point Perk marking that the interface exists and is a hard prerequisite for wearing power armour as intended.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hypno-Indoctrination / Psycho-Conditioning","points":3,"tags":["Advantage","Mental","Imperium","Adeptus Astartes"],"ref":null,"lore":"Years of hypnotherapy, drugs, and ritualized indoctrination laid over the biological changes, meant to produce a soldier who doesn't break under fire and who puts Chapter and Emperor before self. Consistently shown as psychological conditioning, not just training — Astartes keep fighting past the point a merely well-trained human would rout, and are bound by oaths to their Chapter that they do not question.","design":"Combat Reflexes (B43, 15) + Fearlessness 4 (B55, 2/level, 8) + High Pain Threshold (B59, 10) + Single-Minded (B85, 5) = 38 points of advantage, offset by Duty (B133, -15), Sense of Duty to the Chapter (B153, -10), and Code of Honor (B127, -10) = -35. Net +3 points. Intolerance is deliberately left out of the universal package — lore doesn't support a blanket xenophobia disadvantage across every Chapter; where a specific Chapter's fiction supports it, add it as part of that Chapter's lens instead.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Combat Reflexes","points":15,"tags":[],"ref":"B43","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fearlessness","points":8,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]},"levels":4},{"name":"High Pain Threshold","points":10,"tags":[],"ref":"B59","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Single-Minded","points":5,"tags":[],"ref":"B85","notes":"Represents relentless mission focus drilled in from the day of recruitment.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Chapter and Imperium)","points":-15,"tags":[],"ref":"B133","notes":"Almost all the time, Extremely Hazardous.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Battle-Brothers)","points":-10,"tags":[],"ref":"B153","notes":"Large group — the whole Chapter, not just one squad.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Code of Honor (Codex Astartes)","points":-10,"tags":[],"ref":"B127","notes":"As Code of Honor (Soldier's): never abandon a Battle-Brother, never retreat without orders, uphold the Chapter's word.","weapons":[],"feat":{"dr":[],"other":[]}}]}]},{"name":"Primaris Astartes","points":46,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Primaris"],"ref":null,"lore":"Cawl's Primaris strain adds three further organs on top of the standard nineteen, developed to make a Marine somewhat larger, tougher, and more enduring without changing what made the original gene-seed work. This trait is added on top of the Astartes ancestry trait above, not used in place of it.","design":"25 (Sinew Coils) + 11 (Magnificat) + 10 (Belisarian Furnace) = 46 points, added to the base Astartes package's 443 for 489 points of physiology before skills. See the Primaris Battle-Brother template.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Sinew Coils","points":25,"tags":["Physical"],"ref":null,"lore":"Reinforces muscle fibre and tendon with denser, faster-cycling tissue, giving Primaris Marines their somewhat greater size and quicker reactions relative to Firstborn Astartes.","design":"Increased ST +2 (B14, 10/level, 20) plus Increased Basic Speed +0.25 (B17, 5) = 25 points, stacking with the base Astartes Attribute Modifiers.","weapons":[],"feat":{"dr":[],"other":["ST +2","Basic Speed +0.25"]}},{"name":"Magnificat","points":11,"tags":[],"ref":null,"lore":"Boosts the endocrine system that governs growth and wound repair, so a Primaris Marine's tissue knits measurably faster between battles than a Firstborn Astartes' already-quick healing.","design":"Regeneration (Slow) (B80, 10 points) for the passive extra healing, plus a 1-point Perk for general hormonal stability. 11 points.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Accelerated Recovery","points":10,"tags":[],"ref":"B80","notes":"Regeneration (Slow): recover 1 HP per 12 hours even without rest or first aid.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hormonal Regulation","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Belisarian Furnace","points":10,"tags":[],"ref":null,"lore":"An additional organ, unique to the Primaris strain, that burns fuel far more efficiently than a Firstborn Astartes' already formidable metabolism, giving noticeably greater stamina on extended campaigns.","design":"Extra Fatigue Points +3 (B16, 3/level, 9 points) plus a 1-point Perk for the general metabolic efficiency. 10 points.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Metabolic Reserve","points":9,"tags":[],"ref":"B16","notes":"Extra Fatigue Points +3.","weapons":[],"feat":{"dr":[],"other":[]},"levels":3},{"name":"Efficient Metabolism","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]}]},{"name":"Personal Advancement","points":60,"tags":["Physical","Mental"],"ref":null,"lore":"Individual variation applies to Primaris Marines the same as Firstborn: the same augmentation regime, run through Cawl's expanded gene-seed, still produces a range of outcomes rather than identical copies.","design":"DX+1 (20) + IQ+1 (20) + HT+1 (10) + Will+1 (5) + Per+1 (5) = 60, matching the Firstborn Battle-Brother's Personal Advancement package.","weapons":[],"feat":{"dr":[],"other":["DX +1","IQ +1","HT +1","Will +1","PER +1"]}},{"name":"Rank 2 (Battle-Brother, Primaris Strike Force)","points":10,"tags":[],"ref":"B29","lore":"Standing within his squad and company, built up over a shorter career than a Firstborn veteran's but still marking him as a proven, trusted Battle-Brother.","design":"Rank (B29), 5 points/level, 2 levels = 10 points.","weapons":[],"feat":{"dr":[],"other":[]}}],"skills":[{"name":"Guns (Rifle)","diff":"DX/E","points":24,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Mk X pattern bolt rifle.","feat":{"dr":[],"other":[]}},{"name":"Guns (Pistol)","diff":"DX/E","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Bolt pistol.","feat":{"dr":[],"other":[]}},{"name":"Broadsword","diff":"DX/A","points":24,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Chainsword.","feat":{"dr":[],"other":[]}},{"name":"Brawling","diff":"DX/E","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Knife","diff":"DX/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Fast-Draw (Ammo)","diff":"DX/E","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Throwing","diff":"DX/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Frag/krak grenades.","feat":{"dr":[],"other":[]}},{"name":"Free Fall","diff":"DX/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Drop-pod insertion.","feat":{"dr":[],"other":[]}},{"name":"Climbing","diff":"DX/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Stealth","diff":"DX/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Tactics","diff":"IQ/H","points":20,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Soldier","diff":"IQ/A","points":12,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Leadership","diff":"IQ/A","points":12,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Theology (Imperial Creed)","diff":"IQ/H","points":16,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Xenos)","diff":"IQ/A","points":6,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Armoury (Body Armor)","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Armoury (Small Arms)","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"First Aid","diff":"IQ/E","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Camouflage","diff":"IQ/E","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Intimidation","diff":"Will/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Survival (Any)","diff":"Per/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Observation","diff":"Per/A","points":12,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Running","diff":"HT/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Hiking","diff":"HT/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}}],"equipment":[]},"count":1},{"id":"imperium--templates--sanctioned-psyker","title":"Sanctioned Psyker","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Sanctioned Psyker.gct","template":{"name":"Sanctioned Psyker","notes":"A Sanctioned Astra Militarum Primaris Psyker: Delta-grade on the Adeptus Astra Telepathica's Assignment scale (Psyker Talent 3), issued a force staff and trained in Pyromancy as a battlefield specialty. Built on the Thaumatology: Sorcery model (see framework.md and Imperium/Traits/Psykers and the Warp.adq): Psyker (Talent, the Sorcery Talent analogue) sharpens skills, while Warp Empowerment (Sorcerous Empowerment analogue) gates which powers can be known. This loadout's costliest known power is Molten Beam (full modified cost 9), so it only needs Warp Empowerment level 1 (cap 20, points 20) — well under Delta's theoretical ceiling of level 3 (cap 40); a GM growing this psyker into costlier Pyromancy or a different discipline should raise Warp Empowerment's level (and points) to match whatever they buy next, up to Delta's cap.\nPoint math: 80 (attributes) + 10 (Unusual Background) + 30 (Psyker 3) + 20 (Warp Empowerment 1) - 15 (Sanctioned Psyker) + 8 (Witch-sight, 10 base x 0.8 Warp Sorcery) + 20 (Pyromancy discipline at each power's default starting level: Fire Bolt 4 + Inferno/Molten Beam alt 9+1 + Flame Breath 6) + 15 (skills) = 168 points, landing in framework.md's \"Elite human (200-350)\" tier's lower half once personal equipment is added — well above a plain Guardsman, matching how rare and valuable a Sanctioned Psyker is to a regiment, and comfortably inside the 150-250 range expected of a Guard Primaris psyker. For a weaker Wyrdvane conscript-psyker (Epsilon grade), drop Psyker to level 2 and Warp Empowerment stays at level 1 (Epsilon's cap of 30 isn't needed by this discipline either), remove the discipline's higher-level purchases (keep each power at its base/level-1 cost), and add a Reputation or Social Stigma reflecting how nervously line troopers treat them. Swap the Pyromancy include for any other discipline in Imperium/ Traits/Psykers and the Warp.adq for a different specialty — remember to re-check Warp Empowerment's level against the new discipline's costliest power.\n","traitPoints":164,"skillPoints":15,"points":179,"traits":[{"name":"ST","points":0,"tags":["Attribute"],"ref":null,"lore":"A Sanctioned Psyker is an ordinary, unaugmented human body — the gift is mental, not physical.","design":"ST 10 (human baseline), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"DX","points":20,"tags":["Attribute"],"ref":null,"lore":"Basic training and battlefield survival instincts, roughly on par with a line Guardsman.","design":"DX 11 (+1 from baseline), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"IQ","points":40,"tags":["Attribute"],"ref":null,"lore":"Psychic potential correlates loosely with a sharp mind in Astra Telepathica selection; candidates are picked from the more capable conscripts and hive-scholam washouts alike.","design":"IQ 12 (+2 from baseline), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"HT","points":10,"tags":["Attribute"],"ref":null,"lore":"Average endurance; the gift, not the body, is what marks a Sanctioned Psyker.","design":"HT 11 (+1 from baseline), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Will","points":20,"tags":["Attribute"],"ref":null,"lore":"A strong will is what lets a psyker resist Perils of the Warp and hold a working steady under fire.","design":"Will+2 (Basic's Increased Will, 5 pts/level, B15).","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Unusual Background (Latent Psychic Potential)","points":10,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Psychic ability is a random, rare mutation of the human genome that lets its bearer perceive and touch the immaterium (the warp). Sources disagree on exact frequency — Imperial administrative texts and Dark Heresy-line background both describe it as \"rare but not vanishingly so,\" on the order of a handful of latent potentials per hive-sized population, with usably strong psykers far rarer still. Treat any precise ratio as flavour, not census data.","design":"Required to take Psyker (Talent), Warp Empowerment, or any trait carrying the Warp Sorcery power modifier below. Basic Set B261 leaves Unusual Background costs to the GM; 10 points reflects that the ability itself is not learned but grants access to an entire framework of further abilities, roughly the going rate other published settings use for \"you may buy from this power list at all.\"","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Psyker","points":30,"tags":["Advantage","Mental","Talent","Psyker","Imperium"],"ref":"TSOR5","notes":"This project's Sorcery Talent (Thaumatology: Sorcery, TSOR5) analogue:\napplies as Sorcery Talent applies to a sorcerer's skills in TSOR, just\nto a 40k-specific list — Psyniscience, Meditation, Hidden Lore (the\nWarp), and the Will roll to resist Perils of the Warp (see above) — a\nhouse extension of Talent's normal \"add to listed skills\" rule,\nprecedented by Magery's and Sorcery Talent's own habit of aiding\nrelated rolls beyond pure spellcasting. Reaction bonus: +1/level from\nother sanctioned psykers and the Astra Telepathica.\n\nPsyker (Talent) and Warp Empowerment are separate purchases on separate\naxes, exactly as Sorcery Talent and Sorcerous Empowerment are in TSOR:\nthis trait only sharpens related skills and Perils resistance, while\nWarp Empowerment (above) is what actually gates which powers a psyker\nmay know. A high-Talent, low-Empowerment psyker is a sharp, well-drilled\nmind who simply hasn't learned much yet; the reverse is a raw prodigy\nwho is clumsy with the skills around their gift.\n\nImperial Assignment scale (Adeptus Astra Telepathica / Black Ships),\nweakest to strongest, mapped to Talent level. See Warp Empowerment above\nfor the matching Empowerment level/point-cap column, which is the real\ngate on ability selection:\n  Iota    — Talent 0 (latent; register but rarely take Psyker traits at all)\n  Zeta    — Talent 1\n  Eta     — Talent 1\n  Theta   — Talent 2\n  Epsilon — Talent 2  (typical Wyrdvane conscript)\n  Delta   — Talent 3  (typical Sanctioned Primaris Psyker)\n  Gamma   — Talent 4\n  Beta    — Talent 4  (many Astropaths)\n  Alpha   — Talent 5  (Astartes Librarians, Black Ship candidates)\n  Alpha-Plus — Talent 6+ (beyond-play tier: Primarchs,\n    the most powerful Inquisitors, the worst Chaos sorcerers)","lore":"The Iota-to-Alpha-Plus assignment scale is drawn from the Adeptus Astra Telepathica's own grading of psychic potential as depicted across Dark Heresy-line material and repeated in Codex/Imperial Armour background; Black Library uses the same grades in passing (e.g. Eisenhorn-cycle and Ciaphas Cain references to Alpha-class talents). \"Alpha-Plus\" specifically denotes the rarest, most dangerous talents the Black Ships process.","design":"Talent affecting four things (three skills plus the Perils resistance roll) sits at Basic's \"Medium Talent\" rate of 10 points/level (B90, three-to-five-skill bracket) rather than 5 (one-two skills) or 15 (six-nine skills) — the same rate Sorcery Talent itself uses (TSOR5, 10/level). Capped at level 6 for player characters; higher grades are GM-reference only, per the framework's \"Beyond play\" tier.","weapons":[],"feat":{"dr":[],"other":[]},"levels":3},{"name":"Warp Empowerment","points":20,"tags":["Advantage","Mental","Talent","Psyker","Imperium"],"ref":"TSOR4","notes":"A direct reskin of Sorcerous Empowerment (Thaumatology: Sorcery, TSOR4):\nthe psyker's raw, trained capacity to draw on and shape the warp, as\ndistinct from Psyker (Talent, TSOR5's Sorcery Talent analogue, below)\nwhich only sharpens related skills. Requires Unusual Background (Latent\nPsychic Potential). It is the prerequisite for every Warp Sorcery-tagged\nability in this file (see Witch-sight and each discipline below); the\nNavigator's Third Eye and the Pariah/Untouchable genes carry no Warp\nSorcery modifier and so need no Warp Empowerment.\n\nCap, cast per Thaumatology: Sorcery (TSOR): a psyker may only know a\npower whose full, modified point cost is no greater than the point cost\nof their own Warp Empowerment (10 + 10/level). A power bought at a\nhigher level (more dice, more range, etc.) costs proportionally more and\nmay outgrow a psyker's Empowerment even after they first learned it at a\ncheaper level — raising the level, and cost, of Warp Empowerment is how\na psyker \"grows into\" costlier or higher-level workings.\n\nImperial Assignment scale (Adeptus Astra Telepathica / Black Ships)\nmapped to Warp Empowerment level and the point cap that gives, worked\nout from this file's actual (Warp Sorcery -20% + Perils of the Warp)\nmodified costs:\n\nGrade      | Empowerment level | Cap (10+10/lvl) | What the cap reaches\n  Iota       | 1                  | 20              | cheapest powers only: e.g. Smite (3), Endurance (2), Iron Arm (4), Fire Bolt (4), Assail (4), Mind Probe (14), Foresight (18) — register but rarely learn more than one or two\n  Zeta       | 1                  | 20              | as Iota; low Psyker Talent limits skill use, not what they can know\n  Eta        | 1                  | 20              | as Zeta\n  Theta      | 2                  | 30              | adds Molten Beam (9), Crush (11), Psychic Scream (12), Sanctuary (13), Null Zone (23), Terrify (28)\n  Epsilon    | 2                  | 30              | as Theta (typical Wyrdvane conscript)\n  Delta      | 3                  | 40              | adds Scrier's Gaze (35), Dominate (35), Gate of Infinity (40) — the full non-Great-Power roster (typical Sanctioned Primaris Psyker)\n  Gamma      | 3                  | 40              | as Delta, better skills from a higher Psyker Talent\n  Beta       | 4                  | 50              | full roster, with headroom to push a known leveled power to a higher level/more dice (many Astropaths)\n  Alpha      | 5                  | 60              | full roster, generous headroom for high-level workings (Astartes Librarians, Black Ship candidates)\n  Alpha-Plus | 7+ (GM only)       | 80+             | approaching Great Power territory; Vortex of Doom (280+ as usually bought) is still normally out of reach even here\n\nA character need not buy Warp Empowerment up to their grade's full\nceiling: templates in this project buy only the level their actually-\nknown powers need, and note the grade's theoretical ceiling separately.","lore":"The Iota-to-Alpha-Plus assignment scale is drawn from the Adeptus Astra Telepathica's own grading of psychic potential as depicted across Dark Heresy-line material and repeated in Codex/Imperial Armour background; Black Library uses the same grades in passing (e.g. Eisenhorn-cycle and Ciaphas Cain references to Alpha-class talents). \"Alpha-Plus\" specifically denotes the rarest, most dangerous talents the Black Ships process.","design":"Sorcerous Empowerment (TSOR4) costs 10 base + 10/level (level 1 = 20 points, each further level +10) in the GCS master Thaumatology data; reused verbatim here under a 40k-appropriate name, since the underlying mechanic — \"how much warp-power you can channel at all, gating which spells/powers you may know by their modified cost\" — is exactly what an Imperial Assignment grade represents. The level-to-grade mapping above is derived, not asserted: it walks every power in this file's actual modified cost (recomputed under the new Warp Sorcery -20% modifier, see below) and finds the cheapest Empowerment level whose cap clears it, so \"Iota can only cast minor powers\" and \"Alpha can cast the biggest non-Great-Power ability\" are literally true of the numbers, not just flavour text.","weapons":[],"feat":{"dr":[],"other":[]},"levels":1},{"name":"Sanctioned Psyker","points":-15,"tags":["Disadvantage","Mental","Social","Psyker","Imperium"],"ref":null,"lore":"A Sanctioned psyker has passed through the Scholastia Psykana or an equivalent rite, is legally registered, and typically serves the Astra Militarum, an Inquisitor, or their Chapter's Librarius. They are watched, bound by oath and duty, and — even legally protected — are still called \"witch\" behind their back by the citizens they defend. Consistent across Dark Heresy/Only War's Sanctioned-psyker rules and Black Library's depiction of Primaris Psykers and Astartes Librarians alike.","design":"Duty to the Astra Telepathica/Inquisition (Basic B133 Duty table, hazardous, 12 or less) at -10, plus a mild, legally-protected Social Stigma (\"sanctioned witch,\" -5, lighter than Basic's Minority Group tier because the law is nominally on their side). Net -15.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Duty (Astra Telepathica/Inquisition, 12 or less)","points":-10,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Social Stigma (Sanctioned Psyker)","points":-5,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Witch-sight","points":8,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The first, mildest sign of the gift: an unlearned, passive prickling sense of daemonic taint, psychic activity, and warp corruption — how unsanctioned psykers are so often found, and how veteran Inquisitors and Space Marines notice a place has gone wrong before anything visible happens. Widely depicted; no single canonical source, consistent across Black Library and Dark Heresy-line material alike.","design":"Built as Detect (Psychic Activity & Daemonic Taint), an uncommon but not vanishingly rare category, base 10 per Basic's Detect cost table (B47-48). No Perils of the Warp: it is involuntary background sense, not a deliberate act of channelling. Full modified cost: 10 x 0.8 = 8 points; needs only Warp Empowerment level 1 (cap 20) — even an Iota-grade latent can have it, matching how often unsanctioned psykers are found by exactly this unlearned sense.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""}]},{"name":"Pyromancy","points":21,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Fire called from nothing, or matter itself set alight and melted. Calibrated against Dark Heresy's Pyromancy list (Fire Bolt, Fire Storm, Molten Beam all appear near-verbatim) and the recurring Black Library image of a pyromancer's target simply combusting.","design":"Talent-linked group; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Fire Bolt","points":4,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A thrown bolt of raw fire, the pyromancer's most basic attack.","design":"Innate Attack (Burning, 5/die, B61) with Warp Sorcery/Perils, net -30%. Full modified cost: 5 x 0.7 = ~4 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Inferno/Molten Beam","points":11,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Two faces of the same power over fire and molten matter: a bursting fireball for a crowd, or a focused, armour-melting beam for a single hard target. A pyromancer trains both together and switches between them freely, never both at once.","design":"Built as GCS's alternative_abilities container: full price for the costlier child (Molten Beam) plus a fifth the cost of the cheaper one (Inferno), per Basic's Alternate Abilities rule.","weapons":[],"feat":{"dr":[],"other":[]},"container":"alternative_abilities","children":[{"name":"Inferno","points":6,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A bursting fireball that engulfs a small area.","design":"Innate Attack (Burning, 5/die) with Explosion (+50%, B106, 2-yard burst) plus Warp Sorcery/Perils, net +20%. Full modified cost: 5 x 1.2 = 6 points/level (discounted to a fifth as the cheaper alternative ability); needs Warp Empowerment level 1 (cap 20) at its full-price rate.","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Explosion","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Molten Beam","points":9,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A focused beam of molten matter that burns straight through armour.","design":"Innate Attack (Burning, 5/die) with Armor Divisor (3) (+100%, B103) plus Warp Sorcery/Perils, net +70%. Full modified cost: 5 x 1.7 = ~9 points/level (the costlier child, so it sets the alternative_abilities container's cap requirement); needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Armor Divisor (3)","cost":"+100%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]},{"name":"Flame Breath","points":6,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A gout of fire breathed out in a cone in front of the caster.","design":"Innate Attack (Burning, 5/die) with Cone (+50%, B103) plus Warp Sorcery/Perils, net +20%. Full modified cost: 5 x 1.2 = 6 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Cone","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]}],"skills":[{"name":"Psyniscience","diff":"Per/H","points":4,"tl":null,"defaults":[],"tags":["Mental","Imperium","Psionic"],"ref":null,"lore":"The trained (or instinctive) sense of \"something wrong\" in a presence, place, or object touched by the warp — a chill in a corridor, a servitor's dead eyes going wrong. Named for the Dark Heresy/Only War skill of the same purpose (Psyniscience), used here for calibration only; the GURPS build is original.","design":"New skill per framework.md (\"New skills only when nothing fits\"). Per/H, Talent-affected: characters with a Psyker Talent (see the psyker power library — not part of this file) get it at a discount per that trait's rules and may default it from Per at a penalty; an unaugmented human without any psychic Talent cannot default into it at all (there is nothing latent to sense with) and must buy it as an unusual background purchase, if a GM allows it at all — most unaugmented Imperial citizens simply never take this skill.","feat":{"dr":[],"other":[]}},{"name":"Meditation","diff":"IQ/H","points":2,"tl":null,"defaults":[],"tags":["Imperium","Psyker"],"ref":null,"lore":"How a psyker learns to control, rather than merely survive, the gift.","design":"IQ-2 (10) for 2 points, Hard (B ability skill list).","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (the Warp)","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":["Imperium","Psyker"],"ref":null,"lore":"Doctrinal and practical knowledge of the immaterium taught at the Scholastia Psykana.","design":"IQ-1 (11) for 2 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Soldier","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"Enough general military knowledge to operate attached to a Guard unit.","design":"IQ-1 (11) for 2 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Theology (Imperial Creed)","diff":"IQ/H","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"The same basic catechisms drilled into every Imperial soldier, doubly important for a psyker who must prove their faith.","design":"IQ-2 (10) for 1 point, Hard.","feat":{"dr":[],"other":[]}},{"name":"Staff","diff":"DX/A","points":4,"tl":null,"defaults":[],"tags":["Imperium","Psyker"],"ref":null,"lore":"Basic proficiency with the issued force staff.","design":"DX+0 (11) for 4 points, Average.","feat":{"dr":[],"other":[]}}],"equipment":[{"name":"Force Staff","tl":"10^","lc":"1","cost":"7000","weight":"4 lb","qty":1,"tags":["Melee Weapon","Imperium","Psyker"],"ref":null,"lore":"Many psykers prefer a staff to a blade: easier to carry openly as a badge of office, and a familiar focus for channelling telekinetic and biomantic workings. Common across Dark Heresy/Rogue Trader's force-weapon options and depicted for Inquisitorial and Adeptus Astra Telepathica psykers throughout Black Library.","design":"Same rescaled power-field math as the Force Sword (field on adds +3d and armour divisor (10) over the field-off mundane baseline), applied to a plain hardwood-and-metal quarterstaff (sw+1 cr) instead of an edged blade — a crushing rather than cutting power weapon, with the same charged Force Strike option and scaling note.","weapons":[{"melee":true,"usage":"Field off","damage":"sw+1 cr","skill":"Staff","notes":"","reach":"1,2","parry":"0","strength":"9"},{"melee":true,"usage":"Field on","damage":"sw+3d(10) cr","skill":"Staff","notes":"","reach":"1,2","parry":"0","strength":"9"},{"melee":true,"usage":"Force Strike (charged, vs. Warp-touched)","damage":"sw+3d cr (ignores DR)","skill":"Staff","notes":"As Force Sword's Force Strike; +1d per level of Psyker Talent, requires field on and a Perils of the Warp check.","reach":"1,2","parry":"0","strength":"9"}],"feat":{"dr":[],"other":[]}}]},"count":1},{"id":"imperium--traits--astartes-gene-seed","title":"Astartes Gene-Seed","section":"Imperium/Traits","kind":"traits","path":"Imperium/Traits/Astartes Gene-Seed.adq","items":[{"name":"Secondary Heart","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B58","notes":"+2 to HT rolls made solely to avoid death (Hard to Kill 2).","lore":"A backup heart grown alongside the original, wired into the same circulatory system so the body keeps pumping blood even if the primary heart is destroyed or stops. Widely depicted in Black Library fiction as one reason Astartes shrug off wounds that would drop a normal man dead of shock or blood loss.","design":"Modelled as Hard to Kill 2 (B58): +2 to HT rolls to avoid death only, not a general toughness bonus, since the second heart is a redundancy against cardiac failure specifically. 2 x 2 = 4 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Ossmodula","points":14,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B46","notes":"DR 3 on torso and vitals only (fused, armoured ribcage). Stacks with worn armour.","lore":"Triggers a second, controlled growth spurt: the skeleton is re-knitted around a denser mineral lattice, ribs fuse into an armoured cage, and the whole frame roughly doubles in mass over the following implantation. The fused ribcage is one of the most consistently described Astartes traits: a solid plate of bone over the chest that turns blades and slugs that would reach a normal man's heart.","design":"The ST/HT/HP payoff of the growth process is bought once in the Astartes Attribute Modifiers, not here. What the organ adds on its own is the fused ribcage: Damage Resistance 3 (B46, 5/level, 15) with the Partial (torso and vitals) limitation, -10%, = 13.5, rounded up to 14. An earlier draft priced this as a 1-point perk with no mechanical effect, which left the most-cited Astartes toughness feature out of play.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":3,"locs":["torso","vitals"]}]}],"other":[]}},{"name":"Biscopea","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Works alongside the Ossmodula to pack the newly-grown frame with dense, fast-twitch muscle, giving Astartes their characteristic bulk.","design":"Same reasoning as Ossmodula: the muscle mass is paid for once as part of the racial ST bonus, so this is a 1-point Perk marking the organ's presence rather than a second helping of ST.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Haemastamen","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Regulates the chemistry of Astartes blood and produces the genetically-tagged compounds an Apothecary tests for to confirm a Marine's gene-seed lineage and general biochemical stability. Its output is also the substrate Larraman's Organ acts on.","design":"Pure physiology/plot-hook organ — no combat effect of its own. 1-point Perk (B21) so it stays a listed, removable trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Larraman's Organ","points":5,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Wounds scab and scar over within seconds rather than minutes; treat as Rapid Healing for recovery rolls (B424), and the GM should waive ongoing blood-loss effects from an untreated wound after the first turn.","lore":"Floods the bloodstream with \"Larraman's cells\" that clot almost instantly on exposure to air, so an open wound scabs over in seconds. This is the single most commonly cited reason Astartes soldier on through injuries that would leave a Guardsman bleeding out; it is described across Black Library fiction from minor cuts up to serious battlefield trauma.","design":"Reflavoured Rapid Healing (B79, 5 points): the RAW effect (double effective HT for recovery rolls) undersells \"seals in seconds,\" so the design also folds in automatic stabilization against ongoing blood loss for the first turn after a wound, at no extra point cost — it's the same underlying \"clots fast\" phenomenon at two timescales.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Catalepsean Node","points":6,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B65","lore":"A brainstem structure that lets the two cerebral hemispheres rest in alternation, so an Astartes only needs a couple of hours of true sleep where a human needs eight, and can go without any for days at a stretch on campaign. Distinct from the Sus-an Membrane, which is a full metabolic shutdown rather than efficient rest.","design":"Less Sleep 3 (B65, 2 points/level): reduces sleep need from 8 hours to about 2. 3 x 2 = 6 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Preomnor","points":10,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A supplementary \"pre-stomach\" that chemically breaks down and neutralizes toxins and spoiled matter in food before it reaches the true stomach, letting Astartes eat things — rotten rations, raw feral-world game, toxic fungus — that would sicken or kill an unaugmented human.","design":"Resistant (B81), Occasional: Ingested Poison, Immunity — base 10, x1 for Immunity = 10 points. Deliberately narrower than Oolitic Kidney below: this organ only ever sees toxins that arrive through the gut.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Omophagea","points":1,"tags":["Advantage","Mental","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Lets an Astartes extract genetic and biochemical information by consuming a portion of a creature's flesh or blood, surfacing it as hazy instinctive knowledge — described in the fiction as ritual consumption of a slain xenos to \"know\" something of it, rather than a controllable database query.","design":"No reliable, repeatable mechanical payoff to hang a point cost on — the fiction treats it as evocative, not a reliable Analyze/Detect power. Kept as a 1-point Perk (B21); a GM can hand out a one-off Hidden Lore or skill bonus after an appropriate scene at their discretion, with no fixed rule for it here.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Multi-lung","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"A supplementary lung that scrubs smoke, gas, and thin or tainted atmospheres, and banks extra oxygen for holding the breath through vacuum exposure, drowning, or a gas attack.","design":"Filter Lungs (B55, 5 points) for the \"breathe filthy air safely\" half; Breath-Holding 3 (B41, 2/level, 6 points) for the \"hold it a long time\" half. Container sums to 11 points.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Filter Lungs","points":5,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Breath-Holding","points":6,"tags":[],"ref":"B41","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Occulobe","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Rewires the optic nerve and visual cortex for much sharper acuity and low-light performance, and hardens the eye against flash and glare — Astartes are consistently shown spotting targets and reading terrain at ranges no unaugmented eye could manage, and shrugging off blinding light that would stagger a human.","design":"Acute Vision 2 (B35, 2/level, 4 points) for the raw acuity; Protected Sense (Vision) (B78, 5 points) so flash/glare can't blind the organ outright. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Vision","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Vision)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Lyman's Ear","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Reinforces the inner ear against the constant concussion of bolter fire and explosions while sharpening hearing and balance, so an Astartes can still track sound and stay upright through the kind of noise that would deafen and disorient an unaugmented soldier.","design":"Acute Hearing 2 (B35, 2/level, 4 points) plus Protected Sense (Hearing) (B78, 5 points) against deafening/concussive noise. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Hearing","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Hearing)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Sus-an Membrane","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Lets an Astartes drop, on command, into a deep hibernation that slows metabolism to near nothing — used for long void crossings in a survival capsule, or to ride out wounds that would otherwise be fatal by shutting down everything but core function. Depicted as something that takes real time to enter and leave, not an instant reflex.","design":"Custom build shown for transparency rather than a straight RAW pull: Doesn't Eat or Drink (B50, 10) + Doesn't Breathe (B49, 20) = 30 points of effect, but only while deliberately entering the trance, which takes about a minute either way — an Accessibility-style limitation worth roughly -70% (comparable to \"Trance Only\" in scope and severity). 30 x 0.3 = 9 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Melanchromic Organ","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Radiation Tolerance (PF 5) plus a 1-point Perk for voluntary pigment control.","lore":"Controls skin pigmentation and shields the body against radiation and hard UV, letting Astartes operate on irradiated battlefields and hostile worlds. Its baseline output varies by Chapter gene-seed — most notably the Salamanders, whose Melanchromic Organ runs permanently at full output (see the Chapter lens below).","design":"Radiation Tolerance (B79), PF 5 (10 points) for the shielding effect, plus a 1-point Perk for voluntary control over pigmentation (camouflage/recognition flavor, no fixed numeric benefit). 11 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Oolitic Kidney","points":15,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A backup kidney that aggressively filters toxins circulating in the blood — venoms, industrial poisons, battlefield chemical agents — rather than the ones Preomnor already caught at the gut.","design":"Resistant (B81), Common: Poison, Immunity — base 15, x1 for Immunity = 15 points. Priced above Preomnor because it covers poison from any route of entry, not just food.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Neuroglottis","points":21,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Pushes taste and smell to a level that lets an Astartes identify an individual, a poison, or a chemical trace by scent alone, and track a quarry across terrain a hound couldn't follow.","design":"Discriminatory Smell (B49, 15 points, identify/track individuals and substances by scent) plus Acute Taste & Smell 3 (B35, 2/level, 6 points) for raw sensitivity. 21 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Discriminatory Smell","points":15,"tags":[],"ref":"B49","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Acute Taste & Smell","points":6,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Mucranoid","points":20,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Secretes a waxy, oily film that can be triggered to seal pores and orifices against vacuum, toxic atmosphere, and radiation, and that also insulates against extreme heat and cold.","design":"Sealed (B82, 15 points) covers vacuum/toxin/radiation sealing; Temperature Tolerance 5 (B93, 1/level, 5 points) covers the thermal insulation. 20 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Sealed","points":15,"tags":[],"ref":"B82","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Temperature Tolerance","points":5,"tags":[],"ref":"B93","weapons":[],"feat":{"dr":[],"other":[]},"levels":5}]},{"name":"Betcher's Gland","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Produces a corrosive, mildly toxic saliva. Fiction plays this as a minor, opportunistic weapon and a way to shrug off ingested poisons and diseased food in the mouth — not a primary attack for a Marine who has a bolter.","design":"Innate Attack (Corrosion) at a token 1d, melee reach C only (B61, roughly 3 points after the reach/range restriction) for the spit; 1-point Perk for the minor oral antitoxin effect (overlaps in concept with Preomnor, so kept nominal). 4 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Corrosive Spit","points":3,"tags":[],"ref":null,"weapons":[{"melee":true,"usage":"Spit","damage":"1d cor","skill":"Brawling","notes":"","reach":"C","parry":"No"}],"feat":{"dr":[],"other":[]}},{"name":"Oral Poison Filter","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Progenoid Glands","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Two glands that mature over years into a bank of \"zygotes\" — genetic material an Apothecary harvests from the fallen to seed new recruits. Central to how a Chapter perpetuates and safeguards its gene-seed line, but they confer no combat benefit on the Marine who carries them; their value is entirely to the Chapter after death.","design":"1-point Perk (B21): a narrative/plot-hook organ (its condition can matter for Apothecary rolls or a Chapter's gene-seed politics) with no combat mechanic of its own.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Black Carapace","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"A synthetic interface grafted under the skin across the torso and spine and wired into the nervous system, grown last, only after a Scout has proven himself and is elevated to full Battle-Brother. It lets a suit of power armour read a Marine's nervous impulses directly, so the armour moves as an extension of the body rather than a piloted shell.","design":"The mechanical payoff (full reflexes, no bulk/encumbrance penalty, no clumsy manual controls) is a property of Astartes power armour equipment and belongs on that equipment's entry, not duplicated here, since a Marine without a suit to plug into gets nothing from it in play. Kept as a 1-point Perk marking that the interface exists and is a hard prerequisite for wearing power armour as intended.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hypno-Indoctrination / Psycho-Conditioning","points":3,"tags":["Advantage","Mental","Imperium","Adeptus Astartes"],"ref":null,"lore":"Years of hypnotherapy, drugs, and ritualized indoctrination laid over the biological changes, meant to produce a soldier who doesn't break under fire and who puts Chapter and Emperor before self. Consistently shown as psychological conditioning, not just training — Astartes keep fighting past the point a merely well-trained human would rout, and are bound by oaths to their Chapter that they do not question.","design":"Combat Reflexes (B43, 15) + Fearlessness 4 (B55, 2/level, 8) + High Pain Threshold (B59, 10) + Single-Minded (B85, 5) = 38 points of advantage, offset by Duty (B133, -15), Sense of Duty to the Chapter (B153, -10), and Code of Honor (B127, -10) = -35. Net +3 points. Intolerance is deliberately left out of the universal package — lore doesn't support a blanket xenophobia disadvantage across every Chapter; where a specific Chapter's fiction supports it, add it as part of that Chapter's lens instead.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Combat Reflexes","points":15,"tags":[],"ref":"B43","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fearlessness","points":8,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]},"levels":4},{"name":"High Pain Threshold","points":10,"tags":[],"ref":"B59","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Single-Minded","points":5,"tags":[],"ref":"B85","notes":"Represents relentless mission focus drilled in from the day of recruitment.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Chapter and Imperium)","points":-15,"tags":[],"ref":"B133","notes":"Almost all the time, Extremely Hazardous.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Battle-Brothers)","points":-10,"tags":[],"ref":"B153","notes":"Large group — the whole Chapter, not just one squad.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Code of Honor (Codex Astartes)","points":-10,"tags":[],"ref":"B127","notes":"As Code of Honor (Soldier's): never abandon a Battle-Brother, never retreat without orders, uphold the Chapter's word.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Astartes","points":443,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"The Adeptus Astartes: a superhuman created by grafting nineteen engineered organs onto a chosen human recruit and finishing the process with years of training and psycho-indoctrination. This trait is the baseline shared by every Chapter's gene-seed; Chapter lenses below add or remove pieces where the fiction says a specific lineage differs.","design":"287 (Attribute Modifiers) + 153 (nineteen organs: 4+14+1+1+5+6+10+1 +11+9+9+9+11+15+21+20+4+1+1) + 3 (Hypno-Indoctrination) = 443 points. This is the physiology alone, before any skills; see the Battle-Brother, Scout, and Primaris templates for full characters built on top of it.","weapons":[],"feat":{"dr":[],"other":[]},"container":"ancestry","children":[{"name":"Attribute Modifiers","points":287,"tags":["Physical"],"ref":null,"design":"Increased ST +20 (B14, 10/level, 200) for ST 30 (user's figure), which also raises base HP to 30. Raised from ST 18 when weapon damage was rescaled: at ST 30 a Marine lifts nine times what a baseline human can (Basic Lift 180 lb), matching fiction of Astartes tearing open hatches and lifting men one-handed, and a single bolt that gets through the armour (avg ~40 with its follow-up) leaves him fighting rather than dead. Increased HT +4 (B15, 10/level, 40) for HT 14. Increased Basic Speed +1.00 (B17, 5 points per 0.25, 20) for \"faster reflexes than baseline humans\" without inflating every DX-based skill the way a straight DX buy would. Increased Will +2 (B16, 5/level, 10) for the iron discipline the fiction shows even before the Hypno-Indoctrination package below. Extra Hit Points +4 (B16, 2/level, 8) for HP 34: Astartes survive wounds that would kill several men, beyond what ST alone gives. Extra Fatigue Points +3 (B16, 3/level, 9) for FP 17, matching fiction of Marines fighting for days without rest. 200+40+20+10+8+9 = 287. Height runs 2.1-2.4 m per the framework; SM stays 0 unarmoured.","weapons":[],"feat":{"dr":[],"other":["ST +20","HT +4","Basic Speed +1","Will +2","HP +4","FP +3"]}},{"name":"Secondary Heart","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B58","notes":"+2 to HT rolls made solely to avoid death (Hard to Kill 2).","lore":"A backup heart grown alongside the original, wired into the same circulatory system so the body keeps pumping blood even if the primary heart is destroyed or stops. Widely depicted in Black Library fiction as one reason Astartes shrug off wounds that would drop a normal man dead of shock or blood loss.","design":"Modelled as Hard to Kill 2 (B58): +2 to HT rolls to avoid death only, not a general toughness bonus, since the second heart is a redundancy against cardiac failure specifically. 2 x 2 = 4 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Ossmodula","points":14,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B46","notes":"DR 3 on torso and vitals only (fused, armoured ribcage). Stacks with worn armour.","lore":"Triggers a second, controlled growth spurt: the skeleton is re-knitted around a denser mineral lattice, ribs fuse into an armoured cage, and the whole frame roughly doubles in mass over the following implantation. The fused ribcage is one of the most consistently described Astartes traits: a solid plate of bone over the chest that turns blades and slugs that would reach a normal man's heart.","design":"The ST/HT/HP payoff of the growth process is bought once in the Astartes Attribute Modifiers, not here. What the organ adds on its own is the fused ribcage: Damage Resistance 3 (B46, 5/level, 15) with the Partial (torso and vitals) limitation, -10%, = 13.5, rounded up to 14. An earlier draft priced this as a 1-point perk with no mechanical effect, which left the most-cited Astartes toughness feature out of play.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":3,"locs":["torso","vitals"]}]}],"other":[]}},{"name":"Biscopea","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Works alongside the Ossmodula to pack the newly-grown frame with dense, fast-twitch muscle, giving Astartes their characteristic bulk.","design":"Same reasoning as Ossmodula: the muscle mass is paid for once as part of the racial ST bonus, so this is a 1-point Perk marking the organ's presence rather than a second helping of ST.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Haemastamen","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Regulates the chemistry of Astartes blood and produces the genetically-tagged compounds an Apothecary tests for to confirm a Marine's gene-seed lineage and general biochemical stability. Its output is also the substrate Larraman's Organ acts on.","design":"Pure physiology/plot-hook organ — no combat effect of its own. 1-point Perk (B21) so it stays a listed, removable trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Larraman's Organ","points":5,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Wounds scab and scar over within seconds rather than minutes; treat as Rapid Healing for recovery rolls (B424), and the GM should waive ongoing blood-loss effects from an untreated wound after the first turn.","lore":"Floods the bloodstream with \"Larraman's cells\" that clot almost instantly on exposure to air, so an open wound scabs over in seconds. This is the single most commonly cited reason Astartes soldier on through injuries that would leave a Guardsman bleeding out; it is described across Black Library fiction from minor cuts up to serious battlefield trauma.","design":"Reflavoured Rapid Healing (B79, 5 points): the RAW effect (double effective HT for recovery rolls) undersells \"seals in seconds,\" so the design also folds in automatic stabilization against ongoing blood loss for the first turn after a wound, at no extra point cost — it's the same underlying \"clots fast\" phenomenon at two timescales.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Catalepsean Node","points":6,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B65","lore":"A brainstem structure that lets the two cerebral hemispheres rest in alternation, so an Astartes only needs a couple of hours of true sleep where a human needs eight, and can go without any for days at a stretch on campaign. Distinct from the Sus-an Membrane, which is a full metabolic shutdown rather than efficient rest.","design":"Less Sleep 3 (B65, 2 points/level): reduces sleep need from 8 hours to about 2. 3 x 2 = 6 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Preomnor","points":10,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A supplementary \"pre-stomach\" that chemically breaks down and neutralizes toxins and spoiled matter in food before it reaches the true stomach, letting Astartes eat things — rotten rations, raw feral-world game, toxic fungus — that would sicken or kill an unaugmented human.","design":"Resistant (B81), Occasional: Ingested Poison, Immunity — base 10, x1 for Immunity = 10 points. Deliberately narrower than Oolitic Kidney below: this organ only ever sees toxins that arrive through the gut.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Omophagea","points":1,"tags":["Advantage","Mental","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Lets an Astartes extract genetic and biochemical information by consuming a portion of a creature's flesh or blood, surfacing it as hazy instinctive knowledge — described in the fiction as ritual consumption of a slain xenos to \"know\" something of it, rather than a controllable database query.","design":"No reliable, repeatable mechanical payoff to hang a point cost on — the fiction treats it as evocative, not a reliable Analyze/Detect power. Kept as a 1-point Perk (B21); a GM can hand out a one-off Hidden Lore or skill bonus after an appropriate scene at their discretion, with no fixed rule for it here.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Multi-lung","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"A supplementary lung that scrubs smoke, gas, and thin or tainted atmospheres, and banks extra oxygen for holding the breath through vacuum exposure, drowning, or a gas attack.","design":"Filter Lungs (B55, 5 points) for the \"breathe filthy air safely\" half; Breath-Holding 3 (B41, 2/level, 6 points) for the \"hold it a long time\" half. Container sums to 11 points.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Filter Lungs","points":5,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Breath-Holding","points":6,"tags":[],"ref":"B41","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Occulobe","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Rewires the optic nerve and visual cortex for much sharper acuity and low-light performance, and hardens the eye against flash and glare — Astartes are consistently shown spotting targets and reading terrain at ranges no unaugmented eye could manage, and shrugging off blinding light that would stagger a human.","design":"Acute Vision 2 (B35, 2/level, 4 points) for the raw acuity; Protected Sense (Vision) (B78, 5 points) so flash/glare can't blind the organ outright. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Vision","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Vision)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Lyman's Ear","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Reinforces the inner ear against the constant concussion of bolter fire and explosions while sharpening hearing and balance, so an Astartes can still track sound and stay upright through the kind of noise that would deafen and disorient an unaugmented soldier.","design":"Acute Hearing 2 (B35, 2/level, 4 points) plus Protected Sense (Hearing) (B78, 5 points) against deafening/concussive noise. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Hearing","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Hearing)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Sus-an Membrane","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Lets an Astartes drop, on command, into a deep hibernation that slows metabolism to near nothing — used for long void crossings in a survival capsule, or to ride out wounds that would otherwise be fatal by shutting down everything but core function. Depicted as something that takes real time to enter and leave, not an instant reflex.","design":"Custom build shown for transparency rather than a straight RAW pull: Doesn't Eat or Drink (B50, 10) + Doesn't Breathe (B49, 20) = 30 points of effect, but only while deliberately entering the trance, which takes about a minute either way — an Accessibility-style limitation worth roughly -70% (comparable to \"Trance Only\" in scope and severity). 30 x 0.3 = 9 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Melanchromic Organ","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Radiation Tolerance (PF 5) plus a 1-point Perk for voluntary pigment control.","lore":"Controls skin pigmentation and shields the body against radiation and hard UV, letting Astartes operate on irradiated battlefields and hostile worlds. Its baseline output varies by Chapter gene-seed — most notably the Salamanders, whose Melanchromic Organ runs permanently at full output (see the Chapter lens below).","design":"Radiation Tolerance (B79), PF 5 (10 points) for the shielding effect, plus a 1-point Perk for voluntary control over pigmentation (camouflage/recognition flavor, no fixed numeric benefit). 11 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Oolitic Kidney","points":15,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A backup kidney that aggressively filters toxins circulating in the blood — venoms, industrial poisons, battlefield chemical agents — rather than the ones Preomnor already caught at the gut.","design":"Resistant (B81), Common: Poison, Immunity — base 15, x1 for Immunity = 15 points. Priced above Preomnor because it covers poison from any route of entry, not just food.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Neuroglottis","points":21,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Pushes taste and smell to a level that lets an Astartes identify an individual, a poison, or a chemical trace by scent alone, and track a quarry across terrain a hound couldn't follow.","design":"Discriminatory Smell (B49, 15 points, identify/track individuals and substances by scent) plus Acute Taste & Smell 3 (B35, 2/level, 6 points) for raw sensitivity. 21 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Discriminatory Smell","points":15,"tags":[],"ref":"B49","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Acute Taste & Smell","points":6,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Mucranoid","points":20,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Secretes a waxy, oily film that can be triggered to seal pores and orifices against vacuum, toxic atmosphere, and radiation, and that also insulates against extreme heat and cold.","design":"Sealed (B82, 15 points) covers vacuum/toxin/radiation sealing; Temperature Tolerance 5 (B93, 1/level, 5 points) covers the thermal insulation. 20 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Sealed","points":15,"tags":[],"ref":"B82","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Temperature Tolerance","points":5,"tags":[],"ref":"B93","weapons":[],"feat":{"dr":[],"other":[]},"levels":5}]},{"name":"Betcher's Gland","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Produces a corrosive, mildly toxic saliva. Fiction plays this as a minor, opportunistic weapon and a way to shrug off ingested poisons and diseased food in the mouth — not a primary attack for a Marine who has a bolter.","design":"Innate Attack (Corrosion) at a token 1d, melee reach C only (B61, roughly 3 points after the reach/range restriction) for the spit; 1-point Perk for the minor oral antitoxin effect (overlaps in concept with Preomnor, so kept nominal). 4 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Corrosive Spit","points":3,"tags":[],"ref":null,"weapons":[{"melee":true,"usage":"Spit","damage":"1d cor","skill":"Brawling","notes":"","reach":"C","parry":"No"}],"feat":{"dr":[],"other":[]}},{"name":"Oral Poison Filter","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Progenoid Glands","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Two glands that mature over years into a bank of \"zygotes\" — genetic material an Apothecary harvests from the fallen to seed new recruits. Central to how a Chapter perpetuates and safeguards its gene-seed line, but they confer no combat benefit on the Marine who carries them; their value is entirely to the Chapter after death.","design":"1-point Perk (B21): a narrative/plot-hook organ (its condition can matter for Apothecary rolls or a Chapter's gene-seed politics) with no combat mechanic of its own.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Black Carapace","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"A synthetic interface grafted under the skin across the torso and spine and wired into the nervous system, grown last, only after a Scout has proven himself and is elevated to full Battle-Brother. It lets a suit of power armour read a Marine's nervous impulses directly, so the armour moves as an extension of the body rather than a piloted shell.","design":"The mechanical payoff (full reflexes, no bulk/encumbrance penalty, no clumsy manual controls) is a property of Astartes power armour equipment and belongs on that equipment's entry, not duplicated here, since a Marine without a suit to plug into gets nothing from it in play. Kept as a 1-point Perk marking that the interface exists and is a hard prerequisite for wearing power armour as intended.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hypno-Indoctrination / Psycho-Conditioning","points":3,"tags":["Advantage","Mental","Imperium","Adeptus Astartes"],"ref":null,"lore":"Years of hypnotherapy, drugs, and ritualized indoctrination laid over the biological changes, meant to produce a soldier who doesn't break under fire and who puts Chapter and Emperor before self. Consistently shown as psychological conditioning, not just training — Astartes keep fighting past the point a merely well-trained human would rout, and are bound by oaths to their Chapter that they do not question.","design":"Combat Reflexes (B43, 15) + Fearlessness 4 (B55, 2/level, 8) + High Pain Threshold (B59, 10) + Single-Minded (B85, 5) = 38 points of advantage, offset by Duty (B133, -15), Sense of Duty to the Chapter (B153, -10), and Code of Honor (B127, -10) = -35. Net +3 points. Intolerance is deliberately left out of the universal package — lore doesn't support a blanket xenophobia disadvantage across every Chapter; where a specific Chapter's fiction supports it, add it as part of that Chapter's lens instead.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Combat Reflexes","points":15,"tags":[],"ref":"B43","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fearlessness","points":8,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]},"levels":4},{"name":"High Pain Threshold","points":10,"tags":[],"ref":"B59","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Single-Minded","points":5,"tags":[],"ref":"B85","notes":"Represents relentless mission focus drilled in from the day of recruitment.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Chapter and Imperium)","points":-15,"tags":[],"ref":"B133","notes":"Almost all the time, Extremely Hazardous.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Battle-Brothers)","points":-10,"tags":[],"ref":"B153","notes":"Large group — the whole Chapter, not just one squad.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Code of Honor (Codex Astartes)","points":-10,"tags":[],"ref":"B127","notes":"As Code of Honor (Soldier's): never abandon a Battle-Brother, never retreat without orders, uphold the Chapter's word.","weapons":[],"feat":{"dr":[],"other":[]}}]}]},{"name":"Astartes Neophyte (Scout-Rank)","points":306,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"The gene-seed organs are implanted well before a recruit is judged ready for power armour and full Battle-Brother status; only the Black Carapace is consistently described across sources as the final implant, grafted at the end of a Scout's training. This project treats that as the one organ safe to say every Scout lacks; exactly how far along the other implants and the growth process are at any given point in a Scout's years-long training varies between sources, so the Attribute Modifiers and Hypno-Indoctrination here are a reasoned midpoint rather than a claim about a fixed timetable.","design":"80 (Attribute Modifiers) + 139 (eighteen organs, all but Black Carapace: 140 - 1) + (-16) (reduced Hypno-Indoctrination) = 203 points. See the Scout template for the full character.","weapons":[],"feat":{"dr":[],"other":[]},"container":"ancestry","children":[{"name":"Attribute Modifiers (Neophyte)","points":170,"tags":["Physical"],"ref":null,"design":"Reduced version of the full package: Increased ST +14 (140, ST 24) and Increased HT +2 (20) reflect a Scout who has been through most, but not the final, growth-triggering implantations, so he's well above human norm but hasn't finished bulking out to a full Battle-Brother's mass; Increased Basic Speed +0.50 (10) reflects reflexes that are quick but not yet honed to a veteran's combat tempo. 140+20+10 = 170. Scaled up with the full package's ST 30.","weapons":[],"feat":{"dr":[],"other":["ST +14","HT +2","Basic Speed +0.5"]}},{"name":"Secondary Heart","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B58","notes":"+2 to HT rolls made solely to avoid death (Hard to Kill 2).","lore":"A backup heart grown alongside the original, wired into the same circulatory system so the body keeps pumping blood even if the primary heart is destroyed or stops. Widely depicted in Black Library fiction as one reason Astartes shrug off wounds that would drop a normal man dead of shock or blood loss.","design":"Modelled as Hard to Kill 2 (B58): +2 to HT rolls to avoid death only, not a general toughness bonus, since the second heart is a redundancy against cardiac failure specifically. 2 x 2 = 4 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Ossmodula","points":14,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B46","notes":"DR 3 on torso and vitals only (fused, armoured ribcage). Stacks with worn armour.","lore":"Triggers a second, controlled growth spurt: the skeleton is re-knitted around a denser mineral lattice, ribs fuse into an armoured cage, and the whole frame roughly doubles in mass over the following implantation. The fused ribcage is one of the most consistently described Astartes traits: a solid plate of bone over the chest that turns blades and slugs that would reach a normal man's heart.","design":"The ST/HT/HP payoff of the growth process is bought once in the Astartes Attribute Modifiers, not here. What the organ adds on its own is the fused ribcage: Damage Resistance 3 (B46, 5/level, 15) with the Partial (torso and vitals) limitation, -10%, = 13.5, rounded up to 14. An earlier draft priced this as a 1-point perk with no mechanical effect, which left the most-cited Astartes toughness feature out of play.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":3,"locs":["torso","vitals"]}]}],"other":[]}},{"name":"Biscopea","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Works alongside the Ossmodula to pack the newly-grown frame with dense, fast-twitch muscle, giving Astartes their characteristic bulk.","design":"Same reasoning as Ossmodula: the muscle mass is paid for once as part of the racial ST bonus, so this is a 1-point Perk marking the organ's presence rather than a second helping of ST.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Haemastamen","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Regulates the chemistry of Astartes blood and produces the genetically-tagged compounds an Apothecary tests for to confirm a Marine's gene-seed lineage and general biochemical stability. Its output is also the substrate Larraman's Organ acts on.","design":"Pure physiology/plot-hook organ — no combat effect of its own. 1-point Perk (B21) so it stays a listed, removable trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Larraman's Organ","points":5,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Wounds scab and scar over within seconds rather than minutes; treat as Rapid Healing for recovery rolls (B424), and the GM should waive ongoing blood-loss effects from an untreated wound after the first turn.","lore":"Floods the bloodstream with \"Larraman's cells\" that clot almost instantly on exposure to air, so an open wound scabs over in seconds. This is the single most commonly cited reason Astartes soldier on through injuries that would leave a Guardsman bleeding out; it is described ac
