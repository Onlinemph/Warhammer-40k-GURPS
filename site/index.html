tion only; the GURPS build is original.","design":"New skill per framework.md (\"New skills only when nothing fits\"). Per/H, Talent-affected: characters with a Psyker Talent (see the psyker power library — not part of this file) get it at a discount per that trait's rules and may default it from Per at a penalty; an unaugmented human without any psychic Talent cannot default into it at all (there is nothing latent to sense with) and must buy it as an unusual background purchase, if a GM allows it at all — most unaugmented Imperial citizens simply never take this skill.","feat":{"dr":[],"other":[]}},{"name":"Research","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-5"],"tags":["Mental","Imperium"],"ref":"B217","lore":"Digging through cogitator archives, dusty manuscript-cells and Administratum record-stacks — the Inquisitorial acolyte's and Mechanicus adept's basic scholarship skill, unglamorous and constant.","design":"Basic Set Research (B217), used as-is; no Imperial-specific rules needed.","feat":{"dr":[],"other":[]}},{"name":"Cryptography (Inquisitorial Ciphers)","diff":"IQ/H","points":1,"tl":null,"defaults":[],"tags":["Mental","Imperium","Inquisition"],"ref":"B186","lore":"Breaking (or setting) the rotating cant-ciphers Inquisitorial cells use to keep acolyte reports and warrant chains secret from each other as much as from heretics — Inquisitors are famously as suspicious of their own kind as of their prey (Eisenhorn, Ravenor).","design":"Basic Set Cryptography (B186), specialised; defaults from Mathematics (Cryptology) as normal, so no explicit default is listed here (it depends on whether the character has that skill at all).","feat":{"dr":[],"other":[]}},{"name":"Forced Entry","diff":"DX/E","points":1,"tl":null,"defaults":[],"tags":["Physical","Imperium"],"ref":"B196","lore":"Breaking down a heretic's door, a xenos hab-block hatch, or a barricaded cell — standard fieldcraft for Arbites, Militarum Tempestus breach teams and Inquisitorial storm squads alike.","design":"Basic Set Forced Entry (B196), no default per the Basic Set entry.","feat":{"dr":[],"other":[]}}],"count":24},{"id":"imperium--templates--adepta-sororitas-battle-sister","title":"Adepta Sororitas Battle Sister","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Adepta Sororitas Battle Sister.gct","template":{"name":"Adepta Sororitas Battle Sister","notes":"A Sister of Battle of the Adepta Sororitas: an unaugmented but rigorously trained and utterly devout human warrior-nun, wearing power armour but carrying none of the Astartes' gene-seed enhancements. Point math: ST 12 (+20), DX 13 (+60), IQ 11 (+20), HT 12 (+20) = 120, plus Will +1 (+5) = 125; advantages +42; disadvantages -62; skills +95. Total 200 points, the low end of framework.md's \"Elite human (200-350)\" tier. No psychic abilities here: Sororitas Faith is explicitly not psychic power in Black Library fiction and this template does not touch the separate psyker power library. Add Military/Religious Rank levels for a Sister Superior or Canoness built from this base.\n","traitPoints":100,"skillPoints":95,"points":195,"traits":[{"name":"ST","points":20,"tags":["Attribute"],"ref":null,"lore":"Sororitas training is physically demanding, producing soldiers a step above an ordinary Guardsman.","design":"ST 12 (+2), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"DX","points":60,"tags":["Attribute"],"ref":null,"lore":"Extensive combat drill from a young age in the Order's schola.","design":"DX 13 (+3), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"IQ","points":20,"tags":["Attribute"],"ref":null,"lore":"Sororitas education is thorough but doctrinally narrow compared to, say, an Inquisitorial acolyte's.","design":"IQ 11 (+1), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"HT","points":20,"tags":["Attribute"],"ref":null,"lore":"Conditioned for endurance in power armour and prolonged campaigns.","design":"HT 12 (+2), 10 pts/level (B14).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Will","points":5,"tags":["Attribute"],"ref":null,"lore":"Faith translates mechanically into exceptional force of will as much as raw intellect.","design":"Will 12 (+1 above the IQ-derived default of 11), 5 pts/level (B16).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Combat Reflexes","points":15,"tags":["Advantage","Mental","Imperium"],"ref":"B43","lore":"Drilled reactions under fire.","design":"Basic Set Combat Reflexes (B43), 15 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"High Pain Threshold","points":10,"tags":["Advantage","Physical","Imperium"],"ref":"B59","lore":"Sororitas are consistently written as fighting on through wounds that would stop lesser soldiers.","design":"Basic Set High Pain Threshold (B59), 10 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Act of Faith","points":12,"tags":["Advantage","Imperium","Adepta Sororitas"],"ref":null,"notes":"Suggested use: once per session per level, the player declares an Act of Faith and the GM narrates a small miracle appropriate to the moment (see lore). Not a substitute for a psychic power; do not stack with psyker abilities from the psyker power library.","lore":"A Sister of Battle's prayer answered at the worst possible moment for her enemies: wounds that don't drop her, a bolter that never jams when it matters, a miraculous shrug-off of a wound that should have killed her. Black Library (the Sisters of Battle novels, Dan Abnett's and others' Sororitas fiction) treats these as real and faith-triggered, not psychic — the Orders explicitly reject psychic power as unclean.","design":"Built, not borrowed, per framework.md: based on Serendipity's shape (B83, \"something goes providentially right when you need it\") but priced down and given an activation cost, because the fictional trigger is \"spend Faith in a moment of crisis,\" which is a real restriction a GM can enforce (limited uses per session/scene, GM's call on the specific effect) rather than Serendipity's unlimited, GM-adjudicated free use. 6 points/level (40% of Serendipity's 15) reflects that Restricted Use / limited-frequency limitation; buy multiple levels for a Sister who can call on this more than once a session. Does not touch the psyker power library — Sororitas Faith is explicitly not psychic power in the fiction, and this trait is built independently of it.","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Religious Rank","points":5,"tags":["Advantage","Social","Imperium","Ecclesiarchy"],"ref":"B29","lore":"A Sister of Battle holds rank within her Order's hierarchy from the day she takes vows.","design":"Basic Set Rank (B29), 5/level.","weapons":[],"feat":{"dr":[],"other":[]},"levels":1},{"name":"Fanaticism (The God-Emperor)","points":-15,"tags":["Disadvantage","Mental","Imperium"],"ref":"B136","lore":"Sororitas devotion is, if anything, the most absolute in the Imperium — the Orders are the Ecclesiarchy's own military arm and recruit specifically for unshakeable faith.","design":"Basic Set Fanaticism (B136), flat -15, taken for \"the Emperor/the Imperial Creed\" as the group/ideal. Not leveled in Basic Set.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Ecclesiarchy)","points":-10,"tags":["Disadvantage","Social","Imperium","Ecclesiarchy"],"ref":"B133","lore":"A Battle Sister's or priest's obligation to the Ministorum's chain of command — frequent and binding, but less constantly lethal than Guard or Inquisition service on average (a Sororitas' hazard comes from her *mission*, not baseline garrison duty).","design":"Basic Set Duty (B133), one tier below the fully hazardous, always-on entries above.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Vow (Chastity and Poverty)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B160","lore":"Adepta Sororitas Orders are explicitly convents as much as regiments; Sisters take vows on joining, consistently depicted across Black Library's Sisters of Battle fiction.","design":"Basic Set Vow (B160/B162's table), a moderate lifestyle-restricting vow, -10.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Xenos)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"\"The alien is the enemy\" as baseline Imperial doctrine — not personal bigotry but state religion. Universal across Black Library fiction; only a minority of xenos-sympathetic characters (some Rogue Traders, Ordo Xenos radicals) lack it.","design":"Basic Set Intolerance (B140). Costed at -10, the \"very broad category\" end of the range the book allows, since \"all non-human sapient species\" is about as broad a target as Intolerance can name.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Mutants)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"\"The mutant is the enemy\": Imperial law treats unsanctioned mutation as heresy, and ordinary citizens are shown reporting or lynching mutants on sight (Ciaphas Cain, Gaunt's Ghosts, Necromunda material).","design":"Basic Set Intolerance (B140), broad-category cost as above.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Heretics and Psykers)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"Sororitas doctrine is openly hostile to unsanctioned psychic power as well as heresy — the Orders reject psychic gifts as a temptation to corruption, per their consistent portrayal in Black Library fiction.","design":"Basic Set Intolerance (B140), a combined broad category, -10.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Marked by the Order's Habit","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"A Sororitas is recognisable on sight by her Order's habit and iconography, wherever she goes.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Never Backs Down From a Fight Against the Unclean","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Retreat from daemons, xenos or heretics is not a Sororitas instinct.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}}],"skills":[{"name":"Guns (Rifle)","diff":"DX/E","points":16,"tl":null,"defaults":[],"tags":["Imperium","Adepta Sororitas"],"ref":null,"lore":"The bolter is the Order Militant's standard weapon, per framework.md's weapon-skill table.","design":"DX+5 (18) for 16 points, Easy (B170).","feat":{"dr":[],"other":[]}},{"name":"Broadsword","diff":"DX/A","points":12,"tl":null,"defaults":[],"tags":["Imperium","Adepta Sororitas"],"ref":null,"lore":"Many Sisters carry a power sword or combat blade for close-quarters work.","design":"DX+3 (16) for 12 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Theology (Imperial Creed)","diff":"IQ/H","points":12,"tl":null,"defaults":[],"tags":["Imperium","Adepta Sororitas"],"ref":null,"lore":"A Sister of Battle is a warrior-cleric first; deep command of the Creed is expected, not optional.","design":"IQ+2 (13) for 12 points, Hard.","feat":{"dr":[],"other":[]}},{"name":"Savoir-Faire (Ecclesiarchy)","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":["Imperium","Ecclesiarchy"],"ref":null,"lore":"Order and Ecclesiarchy protocol; see Imperium/Skills/Imperial Skills.skl.","design":"IQ+0 (11) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Intimidation","diff":"Will/A","points":8,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"A visor-faced, bolter-carrying Sister of Battle in power armour is a genuinely frightening sight.","design":"Will+2 (14) for 8 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Leadership","diff":"IQ/A","points":8,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Squad-level command within a Sororitas Battle Sister Squad.","design":"IQ+2 (13) for 8 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Soldier","diff":"IQ/A","points":8,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"General military competence.","design":"IQ+2 (13) for 8 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Tactics","diff":"IQ/H","points":8,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Squad and detachment tactics.","design":"IQ+1 (12) for 8 points, Hard.","feat":{"dr":[],"other":[]}},{"name":"Interrogation","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Sororitas field units frequently secure and question suspected heretics and cultists directly.","design":"IQ+1 (12) for 4 points, Average.","feat":{"dr":[],"other":[]}},{"name":"First Aid","diff":"IQ/E","points":2,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Combat first aid.","design":"IQ+1 (12) for 2 points, Easy.","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Daemons)","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"See Imperium/Skills/Imperial Skills.skl; Sororitas doctrine takes daemonic threats extremely seriously.","design":"IQ+1 (12) for 4 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Heresy)","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"See Imperium/Skills/Imperial Skills.skl.","design":"IQ+1 (12) for 4 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Stealth","diff":"DX/A","points":2,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Basic fieldcraft, secondary to a Sororitas' preference for direct confrontation.","design":"DX+0 (13) for 2 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Climbing","diff":"DX/A","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Assault and boarding-action fitness.","design":"DX-1 (12) for 1 point, Average.","feat":{"dr":[],"other":[]}},{"name":"Jumping","diff":"DX/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Obstacle and assault fitness.","design":"DX+0 (13) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Running","diff":"HT/A","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Conditioning for prolonged combat in heavy armour.","design":"HT-1 (11) for 1 point, Average.","feat":{"dr":[],"other":[]}},{"name":"Area Knowledge ((home Convent / Order's chapter house))","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Knowledge of the character's home Convent or Order chapter house.","design":"IQ+0 (11) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Current Affairs (Imperium)","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Awareness of Imperium-wide news relevant to the Order's missions.","design":"IQ+0 (11) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Brawling","diff":"DX/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Unarmed and gauntlet fighting.","design":"DX+0 (13) for 1 point, Easy.","feat":{"dr":[],"other":[]}}],"equipment":[]},"count":1},{"id":"imperium--templates--astartes-battle-brother","title":"Astartes Battle-Brother","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Astartes Battle-Brother.gct","template":{"name":"Astartes Battle-Brother","notes":"A Tactical Marine with some decades of service to his Chapter: fully implanted, trained, and combat-proven, but not yet a squad Sergeant or Chapter specialist. Point total (physiology + skills, no gear) sits comfortably inside the framework's 550-800 Astartes tier -- a veteran with more time in service, a command role, or a Chapter specialty (Apothecary, Techmarine, Chaplain, Librarian) should cost more on top of this. Equipment (bolter, power armour, chainsword) is defined in the armoury files, not here; add the relevant Chapter Gene-Seed lens from Astartes Gene-Seed.adq for a specific Chapter.","traitPoints":523,"skillPoints":228,"points":751,"traits":[{"name":"Astartes","points":443,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"The Adeptus Astartes: a superhuman created by grafting nineteen engineered organs onto a chosen human recruit and finishing the process with years of training and psycho-indoctrination. This trait is the baseline shared by every Chapter's gene-seed; Chapter lenses below add or remove pieces where the fiction says a specific lineage differs.","design":"287 (Attribute Modifiers) + 153 (nineteen organs: 4+14+1+1+5+6+10+1 +11+9+9+9+11+15+21+20+4+1+1) + 3 (Hypno-Indoctrination) = 443 points. This is the physiology alone, before any skills; see the Battle-Brother, Scout, and Primaris templates for full characters built on top of it.","weapons":[],"feat":{"dr":[],"other":[]},"container":"ancestry","children":[{"name":"Attribute Modifiers","points":287,"tags":["Physical"],"ref":null,"design":"Increased ST +20 (B14, 10/level, 200) for ST 30 (user's figure), which also raises base HP to 30. Raised from ST 18 when weapon damage was rescaled: at ST 30 a Marine lifts nine times what a baseline human can (Basic Lift 180 lb), matching fiction of Astartes tearing open hatches and lifting men one-handed, and a single bolt that gets through the armour (avg ~40 with its follow-up) leaves him fighting rather than dead. Increased HT +4 (B15, 10/level, 40) for HT 14. Increased Basic Speed +1.00 (B17, 5 points per 0.25, 20) for \"faster reflexes than baseline humans\" without inflating every DX-based skill the way a straight DX buy would. Increased Will +2 (B16, 5/level, 10) for the iron discipline the fiction shows even before the Hypno-Indoctrination package below. Extra Hit Points +4 (B16, 2/level, 8) for HP 34: Astartes survive wounds that would kill several men, beyond what ST alone gives. Extra Fatigue Points +3 (B16, 3/level, 9) for FP 17, matching fiction of Marines fighting for days without rest. 200+40+20+10+8+9 = 287. Height runs 2.1-2.4 m per the framework; SM stays 0 unarmoured.","weapons":[],"feat":{"dr":[],"other":["ST +20","HT +4","Basic Speed +1","Will +2","HP +4","FP +3"]}},{"name":"Secondary Heart","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B58","notes":"+2 to HT rolls made solely to avoid death (Hard to Kill 2).","lore":"A backup heart grown alongside the original, wired into the same circulatory system so the body keeps pumping blood even if the primary heart is destroyed or stops. Widely depicted in Black Library fiction as one reason Astartes shrug off wounds that would drop a normal man dead of shock or blood loss.","design":"Modelled as Hard to Kill 2 (B58): +2 to HT rolls to avoid death only, not a general toughness bonus, since the second heart is a redundancy against cardiac failure specifically. 2 x 2 = 4 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Ossmodula","points":14,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B46","notes":"DR 3 on torso and vitals only (fused, armoured ribcage). Stacks with worn armour.","lore":"Triggers a second, controlled growth spurt: the skeleton is re-knitted around a denser mineral lattice, ribs fuse into an armoured cage, and the whole frame roughly doubles in mass over the following implantation. The fused ribcage is one of the most consistently described Astartes traits: a solid plate of bone over the chest that turns blades and slugs that would reach a normal man's heart.","design":"The ST/HT/HP payoff of the growth process is bought once in the Astartes Attribute Modifiers, not here. What the organ adds on its own is the fused ribcage: Damage Resistance 3 (B46, 5/level, 15) with the Partial (torso and vitals) limitation, -10%, = 13.5, rounded up to 14. An earlier draft priced this as a 1-point perk with no mechanical effect, which left the most-cited Astartes toughness feature out of play.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":3,"locs":["torso","vitals"]}]}],"other":[]}},{"name":"Biscopea","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Works alongside the Ossmodula to pack the newly-grown frame with dense, fast-twitch muscle, giving Astartes their characteristic bulk.","design":"Same reasoning as Ossmodula: the muscle mass is paid for once as part of the racial ST bonus, so this is a 1-point Perk marking the organ's presence rather than a second helping of ST.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Haemastamen","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Regulates the chemistry of Astartes blood and produces the genetically-tagged compounds an Apothecary tests for to confirm a Marine's gene-seed lineage and general biochemical stability. Its output is also the substrate Larraman's Organ acts on.","design":"Pure physiology/plot-hook organ — no combat effect of its own. 1-point Perk (B21) so it stays a listed, removable trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Larraman's Organ","points":5,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Wounds scab and scar over within seconds rather than minutes; treat as Rapid Healing for recovery rolls (B424), and the GM should waive ongoing blood-loss effects from an untreated wound after the first turn.","lore":"Floods the bloodstream with \"Larraman's cells\" that clot almost instantly on exposure to air, so an open wound scabs over in seconds. This is the single most commonly cited reason Astartes soldier on through injuries that would leave a Guardsman bleeding out; it is described across Black Library fiction from minor cuts up to serious battlefield trauma.","design":"Reflavoured Rapid Healing (B79, 5 points): the RAW effect (double effective HT for recovery rolls) undersells \"seals in seconds,\" so the design also folds in automatic stabilization against ongoing blood loss for the first turn after a wound, at no extra point cost — it's the same underlying \"clots fast\" phenomenon at two timescales.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Catalepsean Node","points":6,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B65","lore":"A brainstem structure that lets the two cerebral hemispheres rest in alternation, so an Astartes only needs a couple of hours of true sleep where a human needs eight, and can go without any for days at a stretch on campaign. Distinct from the Sus-an Membrane, which is a full metabolic shutdown rather than efficient rest.","design":"Less Sleep 3 (B65, 2 points/level): reduces sleep need from 8 hours to about 2. 3 x 2 = 6 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Preomnor","points":10,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A supplementary \"pre-stomach\" that chemically breaks down and neutralizes toxins and spoiled matter in food before it reaches the true stomach, letting Astartes eat things — rotten rations, raw feral-world game, toxic fungus — that would sicken or kill an unaugmented human.","design":"Resistant (B81), Occasional: Ingested Poison, Immunity — base 10, x1 for Immunity = 10 points. Deliberately narrower than Oolitic Kidney below: this organ only ever sees toxins that arrive through the gut.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Omophagea","points":1,"tags":["Advantage","Mental","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Lets an Astartes extract genetic and biochemical information by consuming a portion of a creature's flesh or blood, surfacing it as hazy instinctive knowledge — described in the fiction as ritual consumption of a slain xenos to \"know\" something of it, rather than a controllable database query.","design":"No reliable, repeatable mechanical payoff to hang a point cost on — the fiction treats it as evocative, not a reliable Analyze/Detect power. Kept as a 1-point Perk (B21); a GM can hand out a one-off Hidden Lore or skill bonus after an appropriate scene at their discretion, with no fixed rule for it here.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Multi-lung","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"A supplementary lung that scrubs smoke, gas, and thin or tainted atmospheres, and banks extra oxygen for holding the breath through vacuum exposure, drowning, or a gas attack.","design":"Filter Lungs (B55, 5 points) for the \"breathe filthy air safely\" half; Breath-Holding 3 (B41, 2/level, 6 points) for the \"hold it a long time\" half. Container sums to 11 points.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Filter Lungs","points":5,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Breath-Holding","points":6,"tags":[],"ref":"B41","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Occulobe","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Rewires the optic nerve and visual cortex for much sharper acuity and low-light performance, and hardens the eye against flash and glare — Astartes are consistently shown spotting targets and reading terrain at ranges no unaugmented eye could manage, and shrugging off blinding light that would stagger a human.","design":"Acute Vision 2 (B35, 2/level, 4 points) for the raw acuity; Protected Sense (Vision) (B78, 5 points) so flash/glare can't blind the organ outright. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Vision","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Vision)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Lyman's Ear","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Reinforces the inner ear against the constant concussion of bolter fire and explosions while sharpening hearing and balance, so an Astartes can still track sound and stay upright through the kind of noise that would deafen and disorient an unaugmented soldier.","design":"Acute Hearing 2 (B35, 2/level, 4 points) plus Protected Sense (Hearing) (B78, 5 points) against deafening/concussive noise. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Hearing","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Hearing)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Sus-an Membrane","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Lets an Astartes drop, on command, into a deep hibernation that slows metabolism to near nothing — used for long void crossings in a survival capsule, or to ride out wounds that would otherwise be fatal by shutting down everything but core function. Depicted as something that takes real time to enter and leave, not an instant reflex.","design":"Custom build shown for transparency rather than a straight RAW pull: Doesn't Eat or Drink (B50, 10) + Doesn't Breathe (B49, 20) = 30 points of effect, but only while deliberately entering the trance, which takes about a minute either way — an Accessibility-style limitation worth roughly -70% (comparable to \"Trance Only\" in scope and severity). 30 x 0.3 = 9 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Melanchromic Organ","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Radiation Tolerance (PF 5) plus a 1-point Perk for voluntary pigment control.","lore":"Controls skin pigmentation and shields the body against radiation and hard UV, letting Astartes operate on irradiated battlefields and hostile worlds. Its baseline output varies by Chapter gene-seed — most notably the Salamanders, whose Melanchromic Organ runs permanently at full output (see the Chapter lens below).","design":"Radiation Tolerance (B79), PF 5 (10 points) for the shielding effect, plus a 1-point Perk for voluntary control over pigmentation (camouflage/recognition flavor, no fixed numeric benefit). 11 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Oolitic Kidney","points":15,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A backup kidney that aggressively filters toxins circulating in the blood — venoms, industrial poisons, battlefield chemical agents — rather than the ones Preomnor already caught at the gut.","design":"Resistant (B81), Common: Poison, Immunity — base 15, x1 for Immunity = 15 points. Priced above Preomnor because it covers poison from any route of entry, not just food.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Neuroglottis","points":21,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Pushes taste and smell to a level that lets an Astartes identify an individual, a poison, or a chemical trace by scent alone, and track a quarry across terrain a hound couldn't follow.","design":"Discriminatory Smell (B49, 15 points, identify/track individuals and substances by scent) plus Acute Taste & Smell 3 (B35, 2/level, 6 points) for raw sensitivity. 21 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Discriminatory Smell","points":15,"tags":[],"ref":"B49","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Acute Taste & Smell","points":6,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Mucranoid","points":20,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Secretes a waxy, oily film that can be triggered to seal pores and orifices against vacuum, toxic atmosphere, and radiation, and that also insulates against extreme heat and cold.","design":"Sealed (B82, 15 points) covers vacuum/toxin/radiation sealing; Temperature Tolerance 5 (B93, 1/level, 5 points) covers the thermal insulation. 20 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Sealed","points":15,"tags":[],"ref":"B82","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Temperature Tolerance","points":5,"tags":[],"ref":"B93","weapons":[],"feat":{"dr":[],"other":[]},"levels":5}]},{"name":"Betcher's Gland","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Produces a corrosive, mildly toxic saliva. Fiction plays this as a minor, opportunistic weapon and a way to shrug off ingested poisons and diseased food in the mouth — not a primary attack for a Marine who has a bolter.","design":"Innate Attack (Corrosion) at a token 1d, melee reach C only (B61, roughly 3 points after the reach/range restriction) for the spit; 1-point Perk for the minor oral antitoxin effect (overlaps in concept with Preomnor, so kept nominal). 4 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Corrosive Spit","points":3,"tags":[],"ref":null,"weapons":[{"melee":true,"usage":"Spit","damage":"1d cor","skill":"Brawling","notes":"","reach":"C","parry":"No"}],"feat":{"dr":[],"other":[]}},{"name":"Oral Poison Filter","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Progenoid Glands","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Two glands that mature over years into a bank of \"zygotes\" — genetic material an Apothecary harvests from the fallen to seed new recruits. Central to how a Chapter perpetuates and safeguards its gene-seed line, but they confer no combat benefit on the Marine who carries them; their value is entirely to the Chapter after death.","design":"1-point Perk (B21): a narrative/plot-hook organ (its condition can matter for Apothecary rolls or a Chapter's gene-seed politics) with no combat mechanic of its own.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Black Carapace","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"A synthetic interface grafted under the skin across the torso and spine and wired into the nervous system, grown last, only after a Scout has proven himself and is elevated to full Battle-Brother. It lets a suit of power armour read a Marine's nervous impulses directly, so the armour moves as an extension of the body rather than a piloted shell.","design":"The mechanical payoff (full reflexes, no bulk/encumbrance penalty, no clumsy manual controls) is a property of Astartes power armour equipment and belongs on that equipment's entry, not duplicated here, since a Marine without a suit to plug into gets nothing from it in play. Kept as a 1-point Perk marking that the interface exists and is a hard prerequisite for wearing power armour as intended.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hypno-Indoctrination / Psycho-Conditioning","points":3,"tags":["Advantage","Mental","Imperium","Adeptus Astartes"],"ref":null,"lore":"Years of hypnotherapy, drugs, and ritualized indoctrination laid over the biological changes, meant to produce a soldier who doesn't break under fire and who puts Chapter and Emperor before self. Consistently shown as psychological conditioning, not just training — Astartes keep fighting past the point a merely well-trained human would rout, and are bound by oaths to their Chapter that they do not question.","design":"Combat Reflexes (B43, 15) + Fearlessness 4 (B55, 2/level, 8) + High Pain Threshold (B59, 10) + Single-Minded (B85, 5) = 38 points of advantage, offset by Duty (B133, -15), Sense of Duty to the Chapter (B153, -10), and Code of Honor (B127, -10) = -35. Net +3 points. Intolerance is deliberately left out of the universal package — lore doesn't support a blanket xenophobia disadvantage across every Chapter; where a specific Chapter's fiction supports it, add it as part of that Chapter's lens instead.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Combat Reflexes","points":15,"tags":[],"ref":"B43","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fearlessness","points":8,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]},"levels":4},{"name":"High Pain Threshold","points":10,"tags":[],"ref":"B59","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Single-Minded","points":5,"tags":[],"ref":"B85","notes":"Represents relentless mission focus drilled in from the day of recruitment.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Chapter and Imperium)","points":-15,"tags":[],"ref":"B133","notes":"Almost all the time, Extremely Hazardous.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Battle-Brothers)","points":-10,"tags":[],"ref":"B153","notes":"Large group — the whole Chapter, not just one squad.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Code of Honor (Codex Astartes)","points":-10,"tags":[],"ref":"B127","notes":"As Code of Honor (Soldier's): never abandon a Battle-Brother, never retreat without orders, uphold the Chapter's word.","weapons":[],"feat":{"dr":[],"other":[]}}]}]},{"name":"Personal Advancement","points":60,"tags":["Physical","Mental"],"ref":null,"lore":"No two Battle-Brothers are physiologically identical even off the same gene-seed template, and what decades of live combat does to a body and mind that heal and learn far faster than baseline is depicted throughout Black Library fiction as making veterans noticeably sharper and tougher than newly-raised Battle-Brothers.","design":"DX+1 (20) + IQ+1 (20) + HT+1 (10) + Will+1 (5) + Per+1 (5) = 60 points of personal growth bought on top of the racial baseline.","weapons":[],"feat":{"dr":[],"other":["DX +1","IQ +1","HT +1","Will +1","PER +1"]}},{"name":"Rank 3 (Battle-Brother, Veteran)","points":15,"tags":[],"ref":"B29","lore":"Recognized standing within the squad and Chapter hierarchy built up over decades: enough seniority to be trusted with a fireteam or combat squad in his Sergeant's absence, short of holding a command role himself.","design":"Rank (B29), 5 points/level, 3 levels = 15 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Reputation (Angel of Death)","points":5,"tags":[],"ref":"B27","lore":"An Astartes in his Chapter's heraldry is instantly recognized by Imperial citizens and soldiery, who react with awe, hope, or fear -- a constant, near-universal reaction shown wherever Marines appear in the fiction.","design":"Small, reliably-recognized reaction bonus (+2), priced as a minor Reputation (B27): 5 points.","weapons":[],"feat":{"dr":[],"other":["+2 from Imperial citizens and Guard who recognize the Chapter's colors"]}}],"skills":[{"name":"Guns (Rifle)","diff":"DX/E","points":24,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Bolter.","feat":{"dr":[],"other":[]}},{"name":"Guns (Pistol)","diff":"DX/E","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Bolt pistol.","feat":{"dr":[],"other":[]}},{"name":"Broadsword","diff":"DX/A","points":24,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Chainsword.","feat":{"dr":[],"other":[]}},{"name":"Brawling","diff":"DX/E","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Wrestling","diff":"DX/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Knife","diff":"DX/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Combat knife.","feat":{"dr":[],"other":[]}},{"name":"Axe/Mace","diff":"DX/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Chainaxe familiarity.","feat":{"dr":[],"other":[]}},{"name":"Fast-Draw (Ammo)","diff":"DX/E","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Throwing","diff":"DX/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Frag/krak grenades.","feat":{"dr":[],"other":[]}},{"name":"Free Fall","diff":"DX/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Drop-pod insertion.","feat":{"dr":[],"other":[]}},{"name":"Climbing","diff":"DX/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Stealth","diff":"DX/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Tactics","diff":"IQ/H","points":24,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Strategy","diff":"IQ/H","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Soldier","diff":"IQ/A","points":12,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Leadership","diff":"IQ/A","points":12,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Commanding a fireteam or combat squad.","feat":{"dr":[],"other":[]}},{"name":"Theology (Imperial Creed)","diff":"IQ/H","points":20,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Xenos)","diff":"IQ/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Heresy)","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Armoury (Body Armor)","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Field maintenance of power armour.","feat":{"dr":[],"other":[]}},{"name":"Armoury (Small Arms)","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Bolt weapons.","feat":{"dr":[],"other":[]}},{"name":"Mechanic (Bolt Weapons)","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"First Aid","diff":"IQ/E","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Navigation (Land)","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Gesture","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Chapter battle-sign.","feat":{"dr":[],"other":[]}},{"name":"Savoir-Faire (Military)","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Camouflage","diff":"IQ/E","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Intimidation","diff":"Will/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Survival (Any)","diff":"Per/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Observation","diff":"Per/A","points":12,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Tracking","diff":"Per/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Running","diff":"HT/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Hiking","diff":"HT/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}}],"equipment":[]},"count":1},{"id":"imperium--templates--astartes-librarian-add-on","title":"Astartes Librarian Add-On","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Astartes Librarian Add-On.gct","template":{"name":"Astartes Librarian Add-On","notes":"An add-on, not a full character: layer this over Imperium/Templates/ Astartes Battle-Brother.gct (plus a Chapter Gene-Seed lens) to build a Librarian. It does not repeat the Battle-Brother's attributes, physiology, Rank, or Reputation — only what a Librarian has beyond a Tactical Marine. Built on the Thaumatology: Sorcery model (see framework.md and Imperium/ Traits/Psykers and the Warp.adq). Bumped from a Gamma-equivalent Psyker Talent 4 to full Alpha-grade (Psyker Talent 5) to match the Assignment table's own note that Astartes Librarians are Alpha-tier, fixing a mismatch in this project's earlier draft.\nThe Telekinesis include pulls in the whole discipline, including Gate of Infinity (full modified cost 40) — the single most expensive non-Great- Power ability in the file. That forces Warp Empowerment up to level 3 (cap 40) even though the rest of this loadout (Assail, Force Dome/Kinetic Shield, Crush, Null Zone, Might of Heroes) only needs level 2 (cap 30). A GM building a leaner, younger Librarian who hasn't earned Gate of Infinity yet should disable that one child trait on the character sheet after copying it in and drop Warp Empowerment to level 2, saving 10+10=20 points between the two changes. Vortex of Doom (Imperium/Traits/Psykers and the Warp.adq) is deliberately not included here at all: it is a Great Power, priced in the framework's \"Beyond play\" tier and explicitly exempt from the Warp Empowerment cap, meant only for a Chief Librarian/Epistolary a GM is building as a named, high-tier NPC — add it separately if so.\nPoint math for this add-on alone: 10 (Unusual Background) + 50 (Psyker 5) + 40 (Warp Empowerment 3) - 15 (Sanctioned Psyker) + 8 (Witch-sight, 10 base x 0.8 Warp Sorcery) + 40 (Librarius: Null Zone 23 + Heroic Feats of Strength 12 + Fearlessness x2 ~5, at default starting levels) + 62 (Telekinesis: Assail 4 + Force Dome/Kinetic Shield alt 6+1 + Crush 11 + Gate of Infinity 40) + 16 (skills) = 211 points on top of the Battle-Brother's own 550-800, matching Codex/Black Library depictions of Librarians as notably more expensive and capable than a line Battle- Brother, comfortably inside the framework's \"Heroes and legends\" range once a senior Librarian's Rank and Reputation are added on top.\n","traitPoints":195,"skillPoints":16,"points":211,"traits":[{"name":"Unusual Background (Latent Psychic Potential)","points":10,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Psychic ability is a random, rare mutation of the human genome that lets its bearer perceive and touch the immaterium (the warp). Sources disagree on exact frequency — Imperial administrative texts and Dark Heresy-line background both describe it as \"rare but not vanishingly so,\" on the order of a handful of latent potentials per hive-sized population, with usably strong psykers far rarer still. Treat any precise ratio as flavour, not census data.","design":"Required to take Psyker (Talent), Warp Empowerment, or any trait carrying the Warp Sorcery power modifier below. Basic Set B261 leaves Unusual Background costs to the GM; 10 points reflects that the ability itself is not learned but grants access to an entire framework of further abilities, roughly the going rate other published settings use for \"you may buy from this power list at all.\"","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Psyker","points":50,"tags":["Advantage","Mental","Talent","Psyker","Imperium"],"ref":"TSOR5","notes":"This project's Sorcery Talent (Thaumatology: Sorcery, TSOR5) analogue:\napplies as Sorcery Talent applies to a sorcerer's skills in TSOR, just\nto a 40k-specific list — Psyniscience, Meditation, Hidden Lore (the\nWarp), and the Will roll to resist Perils of the Warp (see above) — a\nhouse extension of Talent's normal \"add to listed skills\" rule,\nprecedented by Magery's and Sorcery Talent's own habit of aiding\nrelated rolls beyond pure spellcasting. Reaction bonus: +1/level from\nother sanctioned psykers and the Astra Telepathica.\n\nPsyker (Talent) and Warp Empowerment are separate purchases on separate\naxes, exactly as Sorcery Talent and Sorcerous Empowerment are in TSOR:\nthis trait only sharpens related skills and Perils resistance, while\nWarp Empowerment (above) is what actually gates which powers a psyker\nmay know. A high-Talent, low-Empowerment psyker is a sharp, well-drilled\nmind who simply hasn't learned much yet; the reverse is a raw prodigy\nwho is clumsy with the skills around their gift.\n\nImperial Assignment scale (Adeptus Astra Telepathica / Black Ships),\nweakest to strongest, mapped to Talent level. See Warp Empowerment above\nfor the matching Empowerment level/point-cap column, which is the real\ngate on ability selection:\n  Iota    — Talent 0 (latent; register but rarely take Psyker traits at all)\n  Zeta    — Talent 1\n  Eta     — Talent 1\n  Theta   — Talent 2\n  Epsilon — Talent 2  (typical Wyrdvane conscript)\n  Delta   — Talent 3  (typical Sanctioned Primaris Psyker)\n  Gamma   — Talent 4\n  Beta    — Talent 4  (many Astropaths)\n  Alpha   — Talent 5  (Astartes Librarians, Black Ship candidates)\n  Alpha-Plus — Talent 6+ (beyond-play tier: Primarchs,\n    the most powerful Inquisitors, the worst Chaos sorcerers)","lore":"The Iota-to-Alpha-Plus assignment scale is drawn from the Adeptus Astra Telepathica's own grading of psychic potential as depicted across Dark Heresy-line material and repeated in Codex/Imperial Armour background; Black Library uses the same grades in passing (e.g. Eisenhorn-cycle and Ciaphas Cain references to Alpha-class talents). \"Alpha-Plus\" specifically denotes the rarest, most dangerous talents the Black Ships process.","design":"Talent affecting four things (three skills plus the Perils resistance roll) sits at Basic's \"Medium Talent\" rate of 10 points/level (B90, three-to-five-skill bracket) rather than 5 (one-two skills) or 15 (six-nine skills) — the same rate Sorcery Talent itself uses (TSOR5, 10/level). Capped at level 6 for player characters; higher grades are GM-reference only, per the framework's \"Beyond play\" tier.","weapons":[],"feat":{"dr":[],"other":[]},"levels":5},{"name":"Warp Empowerment","points":40,"tags":["Advantage","Mental","Talent","Psyker","Imperium"],"ref":"TSOR4","notes":"A direct reskin of Sorcerous Empowerment (Thaumatology: Sorcery, TSOR4):\nthe psyker's raw, trained capacity to draw on and shape the warp, as\ndistinct from Psyker (Talent, TSOR5's Sorcery Talent analogue, below)\nwhich only sharpens related skills. Requires Unusual Background (Latent\nPsychic Potential). It is the prerequisite for every Warp Sorcery-tagged\nability in this file (see Witch-sight and each discipline below); the\nNavigator's Third Eye and the Pariah/Untouchable genes carry no Warp\nSorcery modifier and so need no Warp Empowerment.\n\nCap, cast per Thaumatology: Sorcery (TSOR): a psyker may only know a\npower whose full, modified point cost is no greater than the point cost\nof their own Warp Empowerment (10 + 10/level). A power bought at a\nhigher level (more dice, more range, etc.) costs proportionally more and\nmay outgrow a psyker's Empowerment even after they first learned it at a\ncheaper level — raising the level, and cost, of Warp Empowerment is how\na psyker \"grows into\" costlier or higher-level workings.\n\nImperial Assignment scale (Adeptus Astra Telepathica / Black Ships)\nmapped to Warp Empowerment level and the point cap that gives, worked\nout from this file's actual (Warp Sorcery -20% + Perils of the Warp)\nmodified costs:\n\nGrade      | Empowerment level | Cap (10+10/lvl) | What the cap reaches\n  Iota       | 1                  | 20              | cheapest powers only: e.g. Smite (3), Endurance (2), Iron Arm (4), Fire Bolt (4), Assail (4), Mind Probe (14), Foresight (18) — register but rarely learn more than one or two\n  Zeta       | 1                  | 20              | as Iota; low Psyker Talent limits skill use, not what they can know\n  Eta        | 1                  | 20              | as Zeta\n  Theta      | 2                  | 30              | adds Molten Beam (9), Crush (11), Psychic Scream (12), Sanctuary (13), Null Zone (23), Terrify (28)\n  Epsilon    | 2                  | 30              | as Theta (typical Wyrdvane conscript)\n  Delta      | 3                  | 40              | adds Scrier's Gaze (35), Dominate (35), Gate of Infinity (40) — the full non-Great-Power roster (typical Sanctioned Primaris Psyker)\n  Gamma      | 3                  | 40              | as Delta, better skills from a higher Psyker Talent\n  Beta       | 4                  | 50              | full roster, with headroom to push a known leveled power to a higher level/more dice (many Astropaths)\n  Alpha      | 5                  | 60              | full roster, generous headroom for high-level workings (Astartes Librarians, Black Ship candidates)\n  Alpha-Plus | 7+ (GM only)       | 80+             | approaching Great Power territory; Vortex of Doom (280+ as usually bought) is still normally out of reach even here\n\nA character need not buy Warp Empowerment up to their grade's full\nceiling: templates in this project buy only the level their actually-\nknown powers need, and note the grade's theoretical ceiling separately.","lore":"The Iota-to-Alpha-Plus assignment scale is drawn from the Adeptus Astra Telepathica's own grading of psychic potential as depicted across Dark Heresy-line material and repeated in Codex/Imperial Armour background; Black Library uses the same grades in passing (e.g. Eisenhorn-cycle and Ciaphas Cain references to Alpha-class talents). \"Alpha-Plus\" specifically denotes the rarest, most dangerous talents the Black Ships process.","design":"Sorcerous Empowerment (TSOR4) costs 10 base + 10/level (level 1 = 20 points, each further level +10) in the GCS master Thaumatology data; reused verbatim here under a 40k-appropriate name, since the underlying mechanic — \"how much warp-power you can channel at all, gating which spells/powers you may know by their modified cost\" — is exactly what an Imperial Assignment grade represents. The level-to-grade mapping above is derived, not asserted: it walks every power in this file's actual modified cost (recomputed under the new Warp Sorcery -20% modifier, see below) and finds the cheapest Empowerment level whose cap clears it, so \"Iota can only cast minor powers\" and \"Alpha can cast the biggest non-Great-Power ability\" are literally true of the numbers, not just flavour text.","weapons":[],"feat":{"dr":[],"other":[]},"levels":3},{"name":"Sanctioned Psyker","points":-15,"tags":["Disadvantage","Mental","Social","Psyker","Imperium"],"ref":null,"lore":"A Sanctioned psyker has passed through the Scholastia Psykana or an equivalent rite, is legally registered, and typically serves the Astra Militarum, an Inquisitor, or their Chapter's Librarius. They are watched, bound by oath and duty, and — even legally protected — are still called \"witch\" behind their back by the citizens they defend. Consistent across Dark Heresy/Only War's Sanctioned-psyker rules and Black Library's depiction of Primaris Psykers and Astartes Librarians alike.","design":"Duty to the Astra Telepathica/Inquisition (Basic B133 Duty table, hazardous, 12 or less) at -10, plus a mild, legally-protected Social Stigma (\"sanctioned witch,\" -5, lighter than Basic's Minority Group tier because the law is nominally on their side). Net -15.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Duty (Astra Telepathica/Inquisition, 12 or less)","points":-10,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Social Stigma (Sanctioned Psyker)","points":-5,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Witch-sight","points":8,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The first, mildest sign of the gift: an unlearned, passive prickling sense of daemonic taint, psychic activity, and warp corruption — how unsanctioned psykers are so often found, and how veteran Inquisitors and Space Marines notice a place has gone wrong before anything visible happens. Widely depicted; no single canonical source, consistent across Black Library and Dark Heresy-line material alike.","design":"Built as Detect (Psychic Activity & Daemonic Taint), an uncommon but not vanishingly rare category, base 10 per Basic's Detect cost table (B47-48). No Perils of the Warp: it is involuntary background sense, not a deliberate act of channelling. Full modified cost: 10 x 0.8 = 8 points; needs only Warp Empowerment level 1 (cap 20) — even an Iota-grade latent can have it, matching how often unsanctioned psykers are found by exactly this unlearned sense.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""}]},{"name":"Librarius","points":40,"tags":["Advantage","Mental","Psyker","Imperium","Adeptus Astartes"],"ref":null,"lore":"The general Chapter Librarius discipline used across most non-Grey- Knights Space Marine chapters, drawn from Codex: Space Marines background and its recurring Black Library depictions of Librarians in the Horus Heresy and modern-day novels alike.","design":"Talent-linked group; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Null Zone","points":23,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Strips the warp's protection from everything nearby — invulnerable saves falter, toughened hides thin.","design":"Affliction (10/level) delivering a Vulnerability-style disadvantage valued (by this project, not a cited RAW table entry) at roughly -20 points, +100% Malediction, +50% Area Effect, then Warp Sorcery and Severe Perils, net +130% — the setting's single most dangerous debuff, priced to match. Full modified cost: 10 x 2.3 = 23 points/level; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Disadvantage Delivered (Vulnerability","cost":"+20%","notes":""},{"name":"Malediction 1","cost":"+100%","notes":""},{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp (Severe)","cost":"-20%","notes":""}]},{"name":"Might of Heroes","points":17,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A Librarian's traditional pre-charge blessing, filling a squad with unnatural strength and courage.","design":"Grouped Basic advantages, each carrying Area Effect (squad-wide) plus Warp Sorcery/Perils; GCS sums the children.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Heroic Feats of Strength","points":12,"tags":["Advantage","Physical","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"Basic's Heroic Feats of Strength (flat 10) with Area Effect plus Warp Sorcery/Perils, net +20%. Full modified cost: 10 x 1.2 = 12 points; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Fearlessness","points":5,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"Basic's Fearlessness (2/level) with Area Effect plus Warp Sorcery/Perils, net +20%. Full modified cost: 2 x 1.2 = ~2 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":2,"mods":[{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]}]},{"name":"Telekinesis","points":62,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Force of will made physical: hurled objects, barriers of solid air, crushing grips, and — at its rarest and most dangerous — stepping instantly from one place to another. Calibrated against Dark Heresy's Telekinesis list (Assail, Kinetic Barrier/Shield, Crush, Warp Conduit/Gate of Infinity all map closely).","design":"Talent-linked group; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Assail","points":4,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Hurls the nearest loose object, or the target themselves, with bruising force.","design":"Innate Attack (Crushing, 5/die, B61) with Warp Sorcery/Perils, net -30%. Full modified cost: 5 x 0.7 = ~4 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Force Dome/Kinetic Shield","points":7,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The same telekinetic barrier, bought as one power: held tight around the caster alone, or opened out to cover the whole squad.","design":"Alternative_abilities container; full price for the costlier Force Dome plus a fifth of Kinetic Shield.","weapons":[],"feat":{"dr":[],"other":[]},"container":"alternative_abilities","children":[{"name":"Kinetic Shield","points":4,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A tight telekinetic skin around the caster alone.","design":"Damage Resistance (5/level, B), self only, with Warp Sorcery/ Perils, net -30%. Full modified cost: 5 x 0.7 = ~4 points/level (discounted to a fifth as the cheaper alternative ability); needs Warp Empowerment level 1 (cap 20) at its full-price rate.","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Force Dome","points":6,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A dome of solid force wide enough to cover the caster's whole fireteam.","design":"Damage Resistance (5/level) with Area Effect (+50%, B102, 2-yard radius) plus Warp Sorcery/Perils, net +20%. Full modified cost: 5 x 1.2 = 6 points/level (the costlier child, so it sets the container's cap requirement); needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]},{"name":"Crush","points":11,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"An invisible telekinetic grip that closes on a target's throat or chest, ignoring armour and impossible to dodge.","design":"Innate Attack (Crushing, 5/die) with Malediction (+100%, B36) and Armor Divisor (2) (+50%, B103), plus Warp Sorcery/Perils, net +120%. Full modified cost: 5 x 2.2 = 11 points/level; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Malediction 1","cost":"+100%","notes":""},{"name":"Armor Divisor (2)","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Gate of Infinity","points":40,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Tears a hole between two points in real space and steps through — the rarest and most feared telekinetic feat, since a botched Gate can open into the warp itself instead.","design":"Built on Basic's own Warp advantage (B99, instant travel to any place you have seen/visualized, flat 100), with Preparation Required (-20%, B113, a few seconds' concentration) and the Severe Perils tier, reflecting the setting's specific fear of a failed Gate opening into the immaterium. Net -60%. Full modified cost: 100 x 0.4 = 40 points — the single most expensive non-Great-Power ability in this file; needs Warp Empowerment level 3 (cap 40), the minimum at which \"Delta and up\" can cast the full non-Great-Power roster, exactly on the cap with no headroom to spare.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Preparation Required","cost":"-20%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp (Severe)","cost":"-20%","notes":""}]}]}],"skills":[{"name":"Psyniscience","diff":"Per/H","points":4,"tl":null,"defaults":[],"tags":["Mental","Imperium","Psionic"],"ref":null,"lore":"The trained (or instinctive) sense of \"something wrong\" in a presence, place, or object touched by the warp — a chill in a corridor, a servitor's dead eyes going wrong. Named for the Dark Heresy/Only War skill of the same purpose (Psyniscience), used here for calibration only; the GURPS build is original.","design":"New skill per framework.md (\"New skills only when nothing fits\"). Per/H, Talent-affected: characters with a Psyker Talent (see the psyker power library — not part of this file) get it at a discount per that trait's rules and may default it from Per at a penalty; an unaugmented human without any psychic Talent cannot default into it at all (there is nothing latent to sense with) and must buy it as an unusual background purchase, if a GM allows it at all — most unaugmented Imperial citizens simply never take this skill.","feat":{"dr":[],"other":[]}},{"name":"Meditation","diff":"IQ/H","points":4,"tl":null,"defaults":[],"tags":["Imperium","Psyker"],"ref":null,"lore":"The discipline every Librarian drills to hold their gift steady under fire.","design":"Hard skill, a Librarian's IQ+0 or better; points left generic since this add-on does not know the base template's final IQ.","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (the Warp)","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":["Imperium","Psyker"],"ref":null,"lore":"A Librarian's formal training in the Chapter's Librarius doctrine on the immaterium.","design":"Average skill; points as above.","feat":{"dr":[],"other":[]}},{"name":"Broadsword","diff":"DX/A","points":4,"tl":null,"defaults":[],"tags":["Imperium","Psyker"],"ref":null,"lore":"Many Librarians favour a force weapon over a chainsword once raised to the Librarius.","design":"Force swords use Broadsword (framework weapon-skill table), which the Battle-Brother template already has. These 4 points are added on top of it; merge the two Broadsword entries on the sheet.","feat":{"dr":[],"other":[]}}],"equipment":[{"name":"Force Sword","tl":"10^","lc":"1","cost":"8000","weight":"3 lb","qty":1,"tags":["Melee Weapon","Imperium","Psyker"],"ref":null,"lore":"A disruption-field blade further warded and psychically attuned so a trained mind can channel force directly through it — standard wargear for Inquisitors, Sisters of the Ordo Hereticus with psychic gifts, and any Astartes Librarian who favours a blade over a staff. Depicted throughout Black Library (Eisenhorn's own force sword; Grey Knights' force weapons) and Dark Heresy/Rogue Trader's force-weapon rules.","design":"Built directly on the framework's rescaled power-field rule: field off is the mundane fine blade (sw+1 cut), field on adds +3d and armour divisor (10) per the updated rule (\"Bladed/mace power weapons add +3d over the mundane weapon\"), landing exactly on the rescaled power sword anchor (sw+3d(10) cut) — a force sword is mechanically a power sword that a trained mind can also channel psychic force through. The Force Strike line shows that channelling: same dice as field-on minus the armour divisor, but its ignores-DR component only applies against Warp-touched targets, so it never trivialises ordinary armour. Its damage scales narratively with the wielder's Psyker Talent level (+1d per Psyker Talent level on top of the base 3d, GM's call above level 2) rather than as a fixed number, since the build tool's damage syntax cannot encode a variable.","weapons":[{"melee":true,"usage":"Field off","damage":"sw+1 cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"10"},{"melee":true,"usage":"Field on","damage":"sw+3d(10) cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"10"},{"melee":true,"usage":"Force Strike (charged, vs. Warp-touched)","damage":"sw+3d cut (ignores DR)","skill":"Broadsword","notes":"Add +1d per level of Psyker Talent to this line (GCS can't scale it automatically; edit the damage on the sheet). Usable only by a psyker (Psyker Talent 1+), field on. Requires a Perils of the Warp check (see \"Psykers and the Warp\") as it is channelled through the wielder's own gift; the ignores-DR component only applies against daemons, Chaos Spawn, and other Warp-touched creatures, representing a strike at the target's soul rather than its body — an ordinary flak-armoured guardsman still only takes the field-on line's armour divisor (10).\n","reach":"1","parry":"0","strength":"10"}],"feat":{"dr":[],"other":[]}},{"name":"Psychic Hood","tl":"10^","lc":"1","cost":"4000","weight":"3 lb","qty":1,"tags":["Imperium","Psyker"],"ref":null,"lore":"A warded circlet built around a tiny, heavily sanctioned psychic node (sometimes a bound, lobotomised psyker's brain-stem), worn by Astra Militarum officers and Inquisitorial staff to blunt enemy sorcery directed at their command. Consistent with Dark Heresy/Rogue Trader's psychic hood/psy-focus items and Codex background on Imperial command-squad wargear.","design":"Modelled as a flat +2 conditional bonus (Basic's conditional_modifier feature) to resist Warp Sorcery-tagged mental attacks — comparable in size to Basic's own Power Defense-type items, cheap enough to matter but never a substitute for a trained anti-psyker.","weapons":[],"feat":{"dr":[],"other":["+2 to resist Warp Sorcery-tagged Affliction, Mind Control, Mind Probe, and Fear effects directed at the wearer or their unit"]}}]},"count":1},{"id":"imperium--templates--astartes-scout","title":"Astartes Scout","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Astartes Scout.gct","template":{"name":"Astartes Scout","notes":"A neophyte in scout armour, still short of the final implantation and trials that make a full Battle-Brother: built on Astartes Neophyte (Scout-Rank) rather than the full Astartes trait. That deliberately lands this template in the 200-350 'Elite human' band rather than the 550-800 Astartes tier -- a Scout is meant to read as a cut above a Guardsman or Stormtrooper, not yet a Space Marine. He lacks the Black Carapace outright (see the Gene-Seed file for why that's the one implant this project treats as definitely missing), and his attribute boost and conditioning are toned down to reflect a recruit who hasn't finished growing into a Battle-Brother's frame or logged a veteran's years of drilling. Equipment (scout/sniper rifle, camo cloak, combat blade) lives in the armoury files, not here.","traitPoints":311,"skillPoints":86,"points":397,"traits":[{"name":"Astartes Neophyte (Scout-Rank)","points":306,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"The gene-seed organs are implanted well before a recruit is judged ready for power armour and full Battle-Brother status; only the Black Carapace is consistently described across sources as the final implant, grafted at the end of a Scout's training. This project treats that as the one organ safe to say every Scout lacks; exactly how far along the other implants and the growth process are at any given point in a Scout's years-long training varies between sources, so the Attribute Modifiers and Hypno-Indoctrination here are a reasoned midpoint rather than a claim about a fixed timetable.","design":"80 (Attribute Modifiers) + 139 (eighteen organs, all but Black Carapace: 140 - 1) + (-16) (reduced Hypno-Indoctrination) = 203 points. See the Scout template for the full character.","weapons":[],"feat":{"dr":[],"other":[]},"container":"ancestry","children":[{"name":"Attribute Modifiers (Neophyte)","points":170,"tags":["Physical"],"ref":null,"design":"Reduced version of the full package: Increased ST +14 (140, ST 24) and Increased HT +2 (20) reflect a Scout who has been through most, but not the final, growth-triggering implantations, so he's well above human norm but hasn't finished bulking out to a full Battle-Brother's mass; Increased Basic Speed +0.50 (10) reflects reflexes that are quick but not yet honed to a veteran's combat tempo. 140+20+10 = 170. Scaled up with the full package's ST 30.","weapons":[],"feat":{"dr":[],"other":["ST +14","HT +2","Basic Speed +0.5"]}},{"name":"Secondary Heart","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B58","notes":"+2 to HT rolls made solely to avoid death (Hard to Kill 2).","lore":"A backup heart grown alongside the original, wired into the same circulatory system so the body keeps pumping blood even if the primary heart is destroyed or stops. Widely depicted in Black Library fiction as one reason Astartes shrug off wounds that would drop a normal man dead of shock or blood loss.","design":"Modelled as Hard to Kill 2 (B58): +2 to HT rolls to avoid death only, not a general toughness bonus, since the second heart is a redundancy against cardiac failure specifically. 2 x 2 = 4 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Ossmodula","points":14,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B46","notes":"DR 3 on torso and vitals only (fused, armoured ribcage). Stacks with worn armour.","lore":"Triggers a second, controlled growth spurt: the skeleton is re-knitted around a denser mineral lattice, ribs fuse into an armoured cage, and the whole frame roughly doubles in mass over the following implantation. The fused ribcage is one of the most consistently described Astartes traits: a solid plate of bone over the chest that turns blades and slugs that would reach a normal man's heart.","design":"The ST/HT/HP payoff of the growth process is bought once in the Astartes Attribute Modifiers, not here. What the organ adds on its own is the fused ribcage: Damage Resistance 3 (B46, 5/level, 15) with the Partial (torso and vitals) limitation, -10%, = 13.5, rounded up to 14. An earlier draft priced this as a 1-point perk with no mechanical effect, which left the most-cited Astartes toughness feature out of play.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":3,"locs":["torso","vitals"]}]}],"other":[]}},{"name":"Biscopea","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Works alongside the Ossmodula to pack the newly-grown frame with dense, fast-twitch muscle, giving Astartes their characteristic bulk.","design":"Same reasoning as Ossmodula: the muscle mass is paid for once as part of the racial ST bonus, so this is a 1-point Perk marking the organ's presence rather than a second helping of ST.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Haemastamen","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Regulates the chemistry of Astartes blood and produces the genetically-tagged compounds an Apothecary tests for to confirm a Marine's gene-seed lineage and general biochemical stability. Its output is also the substrate Larraman's Organ acts on.","design":"Pure physiology/plot-hook organ — no combat effect of its own. 1-point Perk (B21) so it stays a listed, removable trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Larraman's Organ","points":5,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Wounds scab and scar over within seconds rather than minutes; treat as Rapid Healing for recovery rolls (B424), and the GM should waive ongoing blood-loss effects from an untreated wound after the first turn.","lore":"Floods the bloodstream with \"Larraman's cells\" that clot almost instantly on exposure to air, so an open wound scabs over in seconds. This is the single most commonly cited reason Astartes soldier on through injuries that would leave a Guardsman bleeding out; it is described across Black Library fiction from minor cuts up to serious battlefield trauma.","design":"Reflavoured Rapid Healing (B79, 5 points): the RAW effect (double effective HT for recovery rolls) undersells \"seals in seconds,\" so the design also folds in automatic stabilization against ongoing blood loss for the first turn after a wound, at no extra point cost — it's the same underlying \"clots fast\" phenomenon at two timescales.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Catalepsean Node","points":6,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B65","lore":"A brainstem structure that lets the two cerebral hemispheres rest in alternation, so an Astartes only needs a couple of hours of true sleep where a human needs eight, and can go without any for days at a stretch on campaign. Distinct from the Sus-an Membrane, which is a full metabolic shutdown rather than efficient rest.","design":"Less Sleep 3 (B65, 2 points/level): reduces sleep need from 8 hours to about 2. 3 x 2 = 6 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Preomnor","points":10,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A supplementary \"pre-stomach\" that chemically breaks down and neutralizes toxins and spoiled matter in food before it reaches the true stomach, letting Astartes eat things — rotten rations, raw feral-world game, toxic fungus — that would sicken or kill an unaugmented human.","design":"Resistant (B81), Occasional: Ingested Poison, Immunity — base 10, x1 for Immunity = 10 points. Deliberately narrower than Oolitic Kidney below: this organ only ever sees toxins that arrive through the gut.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Omophagea","points":1,"tags":["Advantage","Mental","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Lets an Astartes extract genetic and biochemical information by consuming a portion of a creature's flesh or blood, surfacing it as hazy instinctive knowledge — described in the fiction as ritual consumption of a slain xenos to \"know\" something of it, rather than a controllable database query.","design":"No reliable, repeatable mechanical payoff to hang a point cost on — the fiction treats it as evocative, not a reliable Analyze/Detect power. Kept as a 1-point Perk (B21); a GM can hand out a one-off Hidden Lore or skill bonus after an appropriate scene at their discretion, with no fixed rule for it here.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Multi-lung","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"A supplementary lung that scrubs smoke, gas, and thin or tainted atmospheres, and banks extra oxygen for holding the breath through vacuum exposure, drowning, or a gas attack.","design":"Filter Lungs (B55, 5 points) for the \"breathe filthy air safely\" half; Breath-Holding 3 (B41, 2/level, 6 points) for the \"hold it a long time\" half. Container sums to 11 points.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Filter Lungs","points":5,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Breath-Holding","points":6,"tags":[],"ref":"B41","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Occulobe","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Rewires the optic nerve and visual cortex for much sharper acuity and low-light performance, and hardens the eye against flash and glare — Astartes are consistently shown spotting targets and reading terrain at ranges no unaugmented eye could manage, and shrugging off blinding light that would stagger a human.","design":"Acute Vision 2 (B35, 2/level, 4 points) for the raw acuity; Protected Sense (Vision) (B78, 5 points) so flash/glare can't blind the organ outright. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Vision","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Vision)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Lyman's Ear","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Reinforces the inner ear against the constant concussion of bolter fire and explosions while sharpening hearing and balance, so an Astartes can still track sound and stay upright through the kind of noise that would deafen and disorient an unaugmented soldier.","design":"Acute Hearing 2 (B35, 2/level, 4 points) plus Protected Sense (Hearing) (B78, 5 points) against deafening/concussive noise. 9 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Acute Hearing","points":4,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Protected Sense (Hearing)","points":5,"tags":[],"ref":"B78","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Sus-an Membrane","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Lets an Astartes drop, on command, into a deep hibernation that slows metabolism to near nothing — used for long void crossings in a survival capsule, or to ride out wounds that would otherwise be fatal by shutting down everything but core function. Depicted as something that takes real time to enter and leave, not an instant reflex.","design":"Custom build shown for transparency rather than a straight RAW pull: Doesn't Eat or Drink (B50, 10) + Doesn't Breathe (B49, 20) = 30 points of effect, but only while deliberately entering the trance, which takes about a minute either way — an Accessibility-style limitation worth roughly -70% (comparable to \"Trance Only\" in scope and severity). 30 x 0.3 = 9 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Melanchromic Organ","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Radiation Tolerance (PF 5) plus a 1-point Perk for voluntary pigment control.","lore":"Controls skin pigmentation and shields the body against radiation and hard UV, letting Astartes operate on irradiated battlefields and hostile worlds. Its baseline output varies by Chapter gene-seed — most notably the Salamanders, whose Melanchromic Organ runs permanently at full output (see the C
