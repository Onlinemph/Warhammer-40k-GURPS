of_fire":"1","shots":"4(5)","strength":"10","bulk":"-4","recoil":"1"},{"melee":false,"usage":"Beyond ½D","damage":"4dx6(3) burn","skill":"Beam Weapons (Rifle)","notes":"Half the dice past ½D (the usual GURPS rule) and the armour divisor falls from (10) to (3) as the fusion beam loses cohesion. Still wrecks light and medium vehicles (avg 84 vs AV12 DR 200/3 = eff. 66, 76% penetration), but rarely beats a Leman Russ or Land Raider's frontal glacis (AV14, 5%).\n","accuracy":"2","range":"10/50","rate_of_fire":"1","shots":"4(5)","strength":"10","bulk":"-4","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Multi-Melta","tl":"11","lc":"1","cost":"8000","weight":"55 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"lore":"A tripod- or vehicle-mounted heavy melta weapon fielded by heavy weapon teams and as a common tank sponson/hull weapon; background treats it exactly as a bigger meltagun, killing the heaviest vehicles at short range and rapidly losing effect beyond it.","design":"Two dice over the meltagun anchor (10dx6(10) vs 8dx6(10) short, 5dx6(3) vs 4dx6(3) beyond), matching this project's standard heavy-weapon progression, on a slightly longer 15/75 range band appropriate to a crew-served weapon with a bigger reactor. At short range it averages 210 and penetrates every vehicle and personal armour on the tables without exception, same as the meltagun; beyond ½D the extra die keeps it meaningfully ahead of the meltagun against the heaviest tanks (31% vs AV14, versus the meltagun's 5%) while still tailing off, matching the fiction's \"bigger meltagun\" framing rather than a full return to short-range lethality. ST 13 and Gunner (Beams) reflect a support weapon needing a mount or a very strong user rather than a shoulder-fired arm.","weapons":[{"melee":false,"usage":"Short range (up to ½D)","damage":"10dx6(10) burn","skill":"Gunner (Beams)","notes":"","accuracy":"3","range":"15/75","rate_of_fire":"1","shots":"6(5)","strength":"13","bulk":"-6","recoil":"1"},{"melee":false,"usage":"Beyond ½D","damage":"5dx6(3) burn","skill":"Gunner (Beams)","notes":"Half the dice past ½D (the usual GURPS rule) and the armour divisor falls from (10) to (3) as the fusion beam loses cohesion. Unlike the shoulder-fired meltagun, this still wrecks AV13 (avg 105 vs DR 275/3 = eff. 91, 70%) and has a real chance against AV14 (31%), reflecting the bigger reactor's reserve of power.\n","accuracy":"3","range":"15/75","rate_of_fire":"1","shots":"6(5)","strength":"13","bulk":"-6","recoil":"1"}],"feat":{"dr":[],"other":[]}}],"count":3},{"id":"imperium--weapons--plasma-weapons","title":"Plasma Weapons","section":"Imperium/Weapons","kind":"equipment","path":"Imperium/Weapons/Plasma Weapons.eqp","items":[{"name":"Plasma Pistol","tl":"11","lc":"1","cost":"2200","weight":"5 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes","Inquisition"],"ref":null,"lore":"Widely carried by Inquisitors, veteran officers and Astartes as a compact answer to armour a bolt pistol cannot beat; Black Library and Codex background repeatedly show plasma pistols overheating and injuring or killing careless users, a trait long associated with older, unstable patterns especially.","design":"Scaled down two dice from the plasma gun anchor (6dx4(3) burn ex) to 4dx4(3) burn ex for the standard, safe firing mode, keeping the same x4 standard / x5 supercharged multiplier pair used across every weapon in this file; the ×5 supercharged mode trades a Malf 14 risk for another 25% of damage. Checked with the exact dice distribution: standard mode averages 56 damage and penetrates Astartes power armour (DR 100, effective DR 33) 95% of the time and a Terminator (DR 200, effective DR 66) 24% of the time; supercharged raises Terminator penetration to 99%. A pistol-class charge clears flak and carapace with no meaningful chance of failure either way.","weapons":[{"melee":false,"usage":"Standard","damage":"4dx4(3) burn ex","skill":"Beam Weapons (Pistol)","notes":"","accuracy":"2","range":"100/300","rate_of_fire":"3","shots":"6(20)","strength":"10†","bulk":"-2","recoil":"2"},{"melee":false,"usage":"Supercharged","damage":"4dx5(3) burn ex","skill":"Beam Weapons (Pistol)","notes":"Malf 14. On a malfunction the containment coil fails: the firer immediately takes 2d(5) burn ex and the weapon is disabled until a Tech-Priest or Armoury roll repairs it.\n","accuracy":"2","range":"100/300","rate_of_fire":"3","shots":"6(20)","strength":"10†","bulk":"-2","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Plasma Gun","tl":"11","lc":"1","cost":"3200","weight":"14 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"lore":"The plasma gun is the Guard's and the Astartes' standard answer to power armour and light vehicles alike; fiction from Gaunt's Ghosts to Space Marine Battles depicts it killing power-armoured targets outright while carrying a real chance of cooking its own wielder, especially on older, less stable patterns - the origin of the tabletop and RPG \"gets hot\"/ overheat mechanic this entry represents mechanically as Malf 14 on the supercharged line.","design":"This is the project's fixed plasma anchor: 6dx4(3) burn ex, treated as the weapon's safe standard mode (no Malf risk) since it is already stated in the framework to kill Marines through power armour without needing to invoke overheating. Checked with the exact dice distribution, not just the average: Astartes power armour is torso DR 100; armour divisor (3) drops effective DR to 33, and 6dx4 averages 84, penetrating essentially every hit (99.9%), so it kills reliably as required. Against a Terminator's DR 200 (effective DR 66) it still penetrates 86% of hits, matching the framework's explicit statement that plasma \"penetrates Terminators more often than not.\" The supercharged mode (6dx5(3), Malf 14) bumps the multiplier one step further for harder targets (Mk X Gravis, multiple Terminators, light vehicles) at the cost of a real chance of the coil failing and burning the firer, matching the fiction's running theme of plasma weapons being feared by their own side almost as much as by the enemy.","weapons":[{"melee":false,"usage":"Standard","damage":"6dx4(3) burn ex","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"3","range":"150/450","rate_of_fire":"3","shots":"8(20)","strength":"12","bulk":"-4","recoil":"2"},{"melee":false,"usage":"Supercharged","damage":"6dx5(3) burn ex","skill":"Beam Weapons (Rifle)","notes":"Malf 14. On a malfunction the containment coil fails: the firer immediately takes 2d(5) burn ex and the weapon is disabled until a Tech-Priest or Armoury roll repairs it.\n","accuracy":"3","range":"150/450","rate_of_fire":"3","shots":"8(20)","strength":"12","bulk":"-4","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Plasma Cannon","tl":"11","lc":"1","cost":"6500","weight":"45 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"lore":"A tripod- or vehicle-mounted heavy weapon fielded by Astra Militarum heavy weapon teams and Devastator squads, background consistently treats it as a slow-firing but devastating answer to Astartes-scale infantry and light vehicles at range, at the price of a low rate of fire while the reactor cycles.","design":"Two dice over the plasma gun anchor (8dx4(3) vs 6dx4(3), supercharged 8dx5(3)), matching the standard progression used for the bolt and melta families in this project. Checked against the vehicle table: standard mode averages 112 and, even against AV12 (DR 200, effective DR 66), penetrates 99% of hits, comfortably beating the light and medium vehicles the fiction shows it killing. Low RoF 1 and ST 15 (tripod or a very strong user) capture the \"slow-firing but devastating\" character the fiction gives it; Malf 15 rather than 14 for the standard/overcharge pair reflects a crew-served weapon's better cooling and shielding, at correspondingly higher stakes for the crew when it does fail.","weapons":[{"melee":false,"usage":"Standard","damage":"8dx4(3) burn ex","skill":"Gunner (Beams)","notes":"","accuracy":"4","range":"250/750","rate_of_fire":"1","shots":"5(20)","strength":"15","bulk":"-7","recoil":"3"},{"melee":false,"usage":"Supercharged","damage":"8dx5(3) burn ex","skill":"Gunner (Beams)","notes":"Malf 15. Heavier cooling and shielding on a support weapon make the coil somewhat more forgiving than a man-portable plasma weapon's, but a failure is correspondingly larger: the crew take 3d(5) burn ex and the weapon is disabled until repaired.\n","accuracy":"4","range":"250/750","rate_of_fire":"1","shots":"5(20)","strength":"15","bulk":"-7","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Plasma Incinerator, Primaris Pattern","tl":"11","lc":"1","cost":"3400","weight":"13 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"Standard-issue Primaris plasma weapon (Hellblaster squads and others), Codex background describes it as an improved, more reliable containment design over the legacy plasma gun rather than a fundamentally different weapon.","design":"One pip over the plasma gun anchor (6d+1x4(3) vs 6dx4(3), supercharged 6d+1x5(3)) for the \"improved\" cartridge, on a lighter, easier-handling ST 11 frame with better range (200/600) for the improved optics. Against a Terminator (DR 200, effective DR 66) the extra pip nudges standard-mode penetration from the plasma gun's 86% to 90%; the higher Malf 15 on its supercharged mode reflects the claimed better containment without pretending overheating risk is eliminated.","weapons":[{"melee":false,"usage":"Standard","damage":"6d+1x4(3) burn ex","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"4","range":"200/600","rate_of_fire":"3","shots":"10(20)","strength":"11","bulk":"-4","recoil":"2"},{"melee":false,"usage":"Supercharged","damage":"6d+1x5(3) burn ex","skill":"Beam Weapons (Rifle)","notes":"Malf 15. Codex background credits Primaris-pattern containment coils with being safer than legacy plasma weapons; on a malfunction the firer takes 2d(5) burn ex and the weapon is disabled until repaired.\n","accuracy":"4","range":"200/600","rate_of_fire":"3","shots":"10(20)","strength":"11","bulk":"-4","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Heavy Plasma Incinerator, Primaris Pattern","tl":"11","lc":"1","cost":"4200","weight":"20 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"The two-handed, un-mounted heavy weapon carried by Primaris Hellblaster squads' heavy-weapon troopers, background treats it as a genuine step up in output over the standard plasma incinerator, manageable only because of a Primaris Marine's greater strength, not because the weapon itself is lighter.","design":"Matches the Plasma Cannon's damage (8dx4(3)/8dx5(3)) since both fire a cannon-class charge, but keeps RoF 3 rather than the cannon's RoF 1 and drops the tripod requirement, reflecting that this is a man-portable weapon for a superhuman user rather than a crew-served support gun; ST 13 is set below the Plasma Cannon's ST 15 for the same reason.","weapons":[{"melee":false,"usage":"Standard","damage":"8dx4(3) burn ex","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"4","range":"250/700","rate_of_fire":"3","shots":"8(20)","strength":"13","bulk":"-5","recoil":"2"},{"melee":false,"usage":"Supercharged","damage":"8dx5(3) burn ex","skill":"Beam Weapons (Rifle)","notes":"Malf 15. On a malfunction the firer takes 3d(5) burn ex and the weapon is disabled until repaired.\n","accuracy":"4","range":"250/700","rate_of_fire":"3","shots":"8(20)","strength":"13","bulk":"-5","recoil":"2"}],"feat":{"dr":[],"other":[]}}],"count":5},{"id":"imperium--weapons--solid-projectile-weapons","title":"Solid Projectile Weapons","section":"Imperium/Weapons","kind":"equipment","path":"Imperium/Weapons/Solid Projectile Weapons.eqp","items":[{"name":"Autopistol","tl":"7","lc":"4","cost":"80","weight":"2 lb","qty":1,"tags":["Missile Weapon","Imperium"],"ref":null,"lore":"A cheap, mass-produced sidearm found across a billion hive worlds: gang muscle, PDF conscripts and Guard officers who don't rate a laspistol all carry one. Consistently portrayed in Guard and Arbites fiction as the low-status \"poor man's laspistol.\"","design":"No framework anchor covers stub weapons directly, but they must stay consistent with the autogun anchor (5d+1 pi) they're built alongside. GURPS's own real-world pistol-calibre baseline (a modern 9mm Parabellum ball round, roughly 2d+2 pi) already sits at almost exactly the same fraction of the new autogun that the old 2d pi- sat below the old autogun (avg 9 / avg 18.5 = 49%, versus the old 7 / 15 = 47%), so the autopistol is set to that real 9mm figure rather than derived by pure arithmetic scaling: full pi wounding (not pi-) reflects a modern jacketed round rather than the crude ball ammo the earlier pass assumed. Against flak (DR 12) it penetrates just 8.3% of hits — a real but unimpressive threat, matching the autopistol's reputation as a backup weapon rather than a main-line arm. The Manstopper usage keeps the same pi+/divisor(0.5) shape as before, bumped by the same +2 average as the ball round (2d+3, avg 10): it never penetrates flak or better (0% of hits, effective DR doubled by the divisor) but hits unarmoured flesh harder, the standard GURPS way to model an expanding round — more damage to flesh, worse against any DR.","weapons":[{"melee":false,"usage":"Standard (ball)","damage":"2d+2 pi","skill":"Guns (Pistol)","notes":"","accuracy":"2","range":"80/180","rate_of_fire":"3","shots":"16+1(3)","strength":"7","bulk":"-2","recoil":"2"},{"melee":false,"usage":"Manstopper rounds","damage":"2d+3(0.5) pi+","skill":"Guns (Pistol)","notes":"Soft-nosed rounds that flatten on impact for a bigger wound channel but poor penetration.","accuracy":"2","range":"80/180","rate_of_fire":"3","shots":"16+1(3)","strength":"7","bulk":"-2","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Autogun","tl":"7","lc":"3","cost":"150","weight":"8 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"The standard-issue solid-slug battle rifle of regiments and militias that lack a lasgun allocation — a recoil-operated intermediate-calibre rifle that recurs across Astra Militarum background material as the \"poor cousin\" of the lasgun, more common on low-priority garrison and PDF postings.","design":"Fixed autogun anchor (5d+1 pi): calibrated to lasgun parity rather than to flak. In the fiction autoguns kill as readily as lasguns, and Only War gives both the same damage, so the autogun is set for the same practical lethality as the lasgun anchor (5d(2) burn, avg 17.5) without copying its armour divisor — a solid slug has no focusing trick to help it through DR. Average roll 18.5 gets through flak (DR 12) on 94.1% of hits and mesh (DR 15) on 77.9%, both comparable to the lasgun's own flak/mesh numbers; against carapace (DR 45) it penetrates 0% of hits, even worse than the lasgun's rare 9.8% since it has no armour divisor to help it — confirming \"stopped by carapace.\" An earlier draft used 2d+2 pi to make flak \"stop stub rounds\"; that framework wording was about pistol calibres and has been corrected. Range 500/2000 fits an intermediate-calibre rifle. RoF 10, 30(3) follow selective-fire rifle conventions. The Dum-Dum usage applies the same expanding-round logic as the autopistol's Manstopper, bumped the same +1 die as the ball round.","weapons":[{"melee":false,"usage":"Standard ball","damage":"5d+1 pi","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"500/2000","rate_of_fire":"10","shots":"30(3)","strength":"8","bulk":"-4","recoil":"2"},{"melee":false,"usage":"Dum-Dum rounds","damage":"5d+1(0.5) pi+","skill":"Guns (Rifle)","notes":"Expanding rounds: bigger wound channel against flesh, much worse against armour.","accuracy":"4","range":"500/2000","rate_of_fire":"10","shots":"30(3)","strength":"8","bulk":"-4","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Stub Revolver","tl":"7","lc":"4","cost":"140","weight":"2.5 lb","qty":1,"tags":["Missile Weapon","Imperium"],"ref":null,"lore":"A well-made, reliable break-top or swing-cylinder handgun favoured by Inquisitorial acolytes, enforcers and anyone who prizes reliability over firepower or rate of fire; FFG-line background (used here only for relative calibration, per framework.md's source order) singles the stub revolver out as the higher-quality, slower-firing counterpart to the stub automatic.","design":"Single-action cycling caps RoF at 1 — there's no autofire mechanism. A heavier, hand-loaded magnum-class round (GURPS real-world baseline: a .44 Magnum runs about 3d pi) sits above the autopistol's 9mm-class 2d+2 pi, reflecting a larger-calibre, better-machined round fired from a tighter, hand-fitted barrel — and stays well under the autogun's 5d+1 pi rifle round, the same gap the old 2d+1 kept below the old 4d+1 autogun. Average roll 10.5 penetrates flak (DR 12) on 25.9% of hits (better than the autopistol's 8.3%), mesh (DR 15) on 4.6%, and never beats carapace (DR 45: 0%). Low Rcl (1) follows from GURPS convention for a heavier, well-balanced revolver.","weapons":[{"melee":false,"usage":"Standard","damage":"3d pi","skill":"Guns (Pistol)","notes":"","accuracy":"2","range":"100/250","rate_of_fire":"1","shots":"6(3)","strength":"7","bulk":"-2","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Stub Automatic","tl":"7","lc":"4","cost":"90","weight":"2 lb","qty":1,"tags":["Missile Weapon","Imperium"],"ref":null,"lore":"The cheaper, select-fire cousin of the autopistol and stub revolver, common as a backup piece among gangers, cultists and low-tier militia; distinguished in FFG-line background primarily by cost and magazine capacity rather than raw power.","design":"Same round as the autopistol's standard ball ammunition (2d+2 pi), since both fire generic mass-produced pistol-calibre cartridges — the difference is a smaller magazine (10+1 vs. 16+1) and cheaper construction, reflected here in cost and weight rather than a duplicate damage figure, since GCS has no separate build-quality stat.","weapons":[{"melee":false,"usage":"Standard (ball)","damage":"2d+2 pi","skill":"Guns (Pistol)","notes":"","accuracy":"2","range":"80/180","rate_of_fire":"3","shots":"10+1(3)","strength":"7","bulk":"-2","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Heavy Stubber","tl":"7","lc":"2","cost":"900","weight":"40 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"The Imperium's standard heavy machine gun: a deliberately archaic solid-slug design valued precisely because a forge world with almost no infrastructure can still manufacture it. A mainstay on Chimera pintles, Sentinel weapon mounts and heavy-weapon squads across Guard background art and fiction, and never once shown killing a tank.","design":"Scaled up from the autogun's pi rating to a true heavy-calibre weapon (pi+, the GURPS x1.5 wounding multiplier), landing close to GURPS's own real-world .50-calibre benchmark (roughly 6d+2 pi+) rather than any 40k catalogue entry. Deliberately pitched well below the heavy bolter anchor (7d×2(2) pi++, which \"chews light vehicles\" at AV10): 6d+2 pi+ averages 23 with no armour divisor, penetrating 0% of hits against AV10 (DR 100). That failure is intentional and total — the fiction never shows a heavy stubber meaningfully hurting a vehicle, only infantry, and this stat block reproduces that gap explicitly and by a wider margin than the old DR 50 threshold did. Mounted per framework.md's braced/mounted-heavies rule, hence Gunner (Machine Gun) rather than Guns.","weapons":[{"melee":false,"usage":"Standard","damage":"6d+2 pi+","skill":"Gunner (Machine Gun)","notes":"","accuracy":"4","range":"500/2000","rate_of_fire":"10","shots":"250(20)","strength":"12B","bulk":"-6","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Combat Shotgun","tl":"7","lc":"2","cost":"350","weight":"9 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Arbites"],"ref":null,"lore":"A full-auto-capable military scattergun issued to void-ship boarding parties, PDF close-quarters units and Adeptus Arbites riot squads. \"Executioner\" shells are referenced in FFG-line background (relative calibration only, per framework.md) as a specialist close-range, armour-beating round issued to elite units rather than line troops.","design":"Buckshot and slug follow the usual GURPS shotgun split — short-ranged and hard-hitting versus long-ranged and precise — but are given single flat damage figures rather than the Basic Set's full range-banded pellet-spread rules, a deliberate simplification noted here for transparency. Both are scaled up in proportion to the autogun's own 1.27x jump (old 4d+1 avg 15 to new 5d+1 avg 18.5): buckshot averages 16 and penetrates flak (DR 12) on 84.1% of hits at point-blank range; slug averages 21 and still can't beat carapace (DR 45: 0% of hits), matching a shotgun's real-world reputation against rigid plate. The Executioner shell keeps the buckshot's short range but adds an armour divisor of (2), modelling a penetrator flechette payload that trades general usefulness for beating armour at point-blank range: average 17.5, penetrating carapace (DR 45, effective 22.5) on 9.8% of hits, the same figure as a standard lasgun.","weapons":[{"melee":false,"usage":"Buckshot","damage":"4d+2 pi+","skill":"Guns (Shotgun)","notes":"","accuracy":"2","range":"20/70","rate_of_fire":"3","shots":"8(3)","strength":"9","bulk":"-4","recoil":"1"},{"melee":false,"usage":"Slug","damage":"6d pi+","skill":"Guns (Shotgun)","notes":"","accuracy":"3","range":"150/500","rate_of_fire":"3","shots":"8(3)","strength":"9","bulk":"-4","recoil":"2"},{"melee":false,"usage":"Executioner shell","damage":"5d(2) pi+","skill":"Guns (Shotgun)","notes":"Rare flechette/APDS-style shell, usually restricted to Inquisition or Arbites armouries.","accuracy":"2","range":"20/70","rate_of_fire":"3","shots":"8(3)","strength":"9","bulk":"-4","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Pump Shotgun","tl":"7","lc":"4","cost":"150","weight":"7 lb","qty":1,"tags":["Missile Weapon","Imperium"],"ref":null,"lore":"A civilian and militia pump-action scattergun common on agri and feral worlds and among hive gangers — a step down from the military combat shotgun, and the more commonly depicted shotgun among non-military characters in Imperial fiction.","design":"Same buckshot/slug split as the Combat Shotgun, toned down roughly half a die (matching the Combat Shotgun's own new figures) and locked to RoF 1 (manual pump cycling, no autofire) to reflect civilian manufacture rather than a military select-fire action: buckshot averages 14 (66.4% through flak at point-blank range), slug averages 19.5 and still fails against carapace (0% of hits).","weapons":[{"melee":false,"usage":"Buckshot","damage":"4d pi+","skill":"Guns (Shotgun)","notes":"","accuracy":"2","range":"15/60","rate_of_fire":"1","shots":"5+1(3)","strength":"9","bulk":"-4","recoil":"1"},{"melee":false,"usage":"Slug","damage":"5d+2 pi+","skill":"Guns (Shotgun)","notes":"","accuracy":"3","range":"120/400","rate_of_fire":"1","shots":"5+1(3)","strength":"9","bulk":"-4","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Hunting Rifle","tl":"7","lc":"4","cost":"300","weight":"9 lb","qty":1,"tags":["Missile Weapon","Imperium"],"ref":null,"lore":"A bolt-action precision rifle common on agri, feral and frontier worlds, pressed into service as a stopgap sniper weapon by Guard marksmen and PDF units where a long-las isn't issued.","design":"Modelled as a realistic TL7 bolt-action big-game rifle (a real-world analogue, not a renamed catalogue item), scaled up in the same proportion as the other stub-tech weapons in this file: a large single round for maximum penetration (average 24.5), RoF 1 for manual bolt cycling between shots. Kept below the long-las (6d(2) burn) in practical terms — full pi wounding and no armour divisor mean it's comparably lethal to an unarmoured target (99.7% through flak, DR 12) but does nothing against carapace-or-better armour (0% of hits at DR 45), in contrast to the long-las which at least keeps pace with a standard lasgun there.","weapons":[{"melee":false,"usage":"Standard","damage":"7d pi","skill":"Guns (Rifle)","notes":"","accuracy":"7","range":"600/2000","rate_of_fire":"1","shots":"5(3)","strength":"10","bulk":"-6","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Autopistol Magazine, Standard Ball (spare, x3)","tl":"7","lc":"4","cost":"8","weight":"1 lb","qty":1,"tags":["Imperium"],"ref":null,"lore":"Spare magazines for an autopistol or stub automatic, sold and issued in bundles.","design":"Pure ammunition item; matches the \"16+1(3)\" and \"10+1(3)\" shot lines on the Autopistol and Stub Automatic above.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Manstopper Rounds, box of 20","tl":"7","lc":"3","cost":"25","weight":"1 lb","qty":1,"tags":["Imperium"],"ref":null,"lore":"Boxed soft-point ammunition for autopistols; restricted above plain ball ammunition since it's a purpose-made anti-personnel round rather than general-issue stock.","design":"Pure ammunition item backing the Autopistol's \"Manstopper rounds\" usage line.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Autogun Magazine, Standard Ball (spare, x2)","tl":"7","lc":"3","cost":"12","weight":"2 lb","qty":1,"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"Standard-issue spare magazines for the autogun, carried by the case on any world where lasguns and their charge packs aren't the standard allocation.","design":"Pure ammunition item; matches the Autogun's \"30(3)\" shot line.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Dum-Dum Rounds, box of 20","tl":"7","lc":"2","cost":"35","weight":"2 lb","qty":1,"tags":["Imperium"],"ref":null,"lore":"Illegal-in-many-jurisdictions expanding ammunition for the autogun, more restricted than standard ball rounds precisely because of the wound it leaves.","design":"Pure ammunition item backing the Autogun's \"Dum-Dum rounds\" usage line.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Heavy Stubber Ammo Belt, 250 rounds","tl":"7","lc":"2","cost":"60","weight":"14 lb","qty":1,"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"A standard belt of heavy-calibre ammunition for the heavy stubber, typically carried in a drum or box feed by the weapon's second crewer.","design":"Pure ammunition item; matches the Heavy Stubber's \"250(20)\" shot line.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Shotgun Shells, box of 20 (buckshot/slug)","tl":"7","lc":"3","cost":"15","weight":"3 lb","qty":1,"tags":["Imperium"],"ref":null,"lore":"A mixed box of standard shotgun shells, issued or bought for either the combat shotgun or pump shotgun.","design":"Pure ammunition item backing the Buckshot and Slug usage lines on both shotguns above.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Executioner Shells, box of 10","tl":"7","lc":"2","cost":"80","weight":"2 lb","qty":1,"tags":["Imperium","Adeptus Arbites"],"ref":null,"lore":"Restricted flechette shells for the combat shotgun, typically drawn only from Arbites or Inquisitorial armouries rather than general Munitorum stock.","design":"Pure ammunition item backing the Combat Shotgun's \"Executioner shell\" usage line.","weapons":[],"feat":{"dr":[],"other":[]}}],"count":15}]};
const LIBS = DATA.libraries;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KINDNAME = {equipment:"Equipment", traits:"Traits", skills:"Skills", template:"Template"};
let current = null;

function fmtPts(p){ const n = Number(p)||0; return `<span class="pts${n<0?" neg":""}">[${n}]</span>`; }
function money(v){ if(v==null||v==="") return ""; const n=Number(v); return isNaN(n)?v:"$"+n.toLocaleString("en-US"); }

function drBlock(feat){
  if(!feat) return "";
  let h = "";
  for(const row of feat.dr||[]){
    h += `<div class="dr">${row.vs?`<span class="chip">vs ${esc(row.vs)}</span>`:""}` +
      row.groups.map(g=>`<span><b>DR ${g.dr}</b>${esc(g.locs.join(", "))}</span>`).join("") + `</div>`;
  }
  if(feat.other && feat.other.length) h += `<div class="feat">${feat.other.map(esc).join(" · ")}</div>`;
  return h;
}

function weaponTables(ws){
  if(!ws || !ws.length) return "";
  const ranged = ws.filter(w=>!w.melee), melee = ws.filter(w=>w.melee);
  let h = "";
  const row = (w, cols) => {
    const note = w.notes ? `<tr class="wnote"><td colspan="${cols.length+3}">${esc(w.notes)}</td></tr>` : "";
    return `<tr${w.notes?' class="hasnote"':""}><td>${esc(w.usage)}</td><td class="dmg">${esc(w.damage)}</td>` +
      cols.map(c=>`<td class="n">${esc(w[c]??"")}</td>`).join("") + `<td>${esc(w.skill)}</td></tr>` + note;
  };
  if(ranged.length){
    const cols=["accuracy","range","rate_of_fire","shots","strength","bulk","recoil"];
    h += `<div class="tablewrap"><table><thead><tr><th>Mode</th><th>Damage</th><th>Acc</th><th>Range</th><th>RoF</th><th>Shots</th><th>ST</th><th>Bulk</th><th>Rcl</th><th>Skill</th></tr></thead><tbody>` +
      ranged.map(w=>row(w,cols)).join("") + `</tbody></table></div>`;
  }
  if(melee.length){
    const cols=["reach","parry","strength"];
    h += `<div class="tablewrap"><table><thead><tr><th>Mode</th><th>Damage</th><th>Reach</th><th>Parry</th><th>ST</th><th>Skill</th></tr></thead><tbody>` +
      melee.map(w=>row(w,cols)).join("") + `</tbody></table></div>`;
  }
  return h;
}

function mods(ms){
  if(!ms || !ms.length) return "";
  return `<ul class="mods">${ms.map(m=>`<li>${esc(m.name)}<span class="c">${esc(m.cost)}</span>${m.notes?` <span class="mn">— ${esc(m.notes)}</span>`:""}</li>`).join("")}</ul>`;
}

function more(e){
  if(!e.lore && !e.design) return "";
  return `<details class="more"><summary>Lore &amp; design</summary>` +
    (e.lore?`<h4>Lore</h4><p>${esc(e.lore)}</p>`:"") + (e.design?`<h4>Design</h4><p>${esc(e.design)}</p>`:"") + `</details>`;
}

function tagChips(tags){ return (tags||[]).map(t=>`<span class="chip tag">${esc(t)}</span>`).join(""); }

function eqCard(e, child){
  const chips = [e.tl?`TL${e.tl}`:"", e.lc!=null&&e.lc!==undefined?`LC${e.lc}`:"", money(e.cost), e.weight||"",
    e.qty>1?`×${e.qty}`:"", e.uses!=null?`${e.uses} SP / uses`:"", e.ref||""].filter(Boolean);
  return `<article class="entry${child?" child":""}"><div class="ehead"><h3 class="ename">${esc(e.name)}</h3></div>
    <div class="meta">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${child?"":tagChips(e.tags)}</div>
    ${e.notes?`<p class="notes">${esc(e.notes)}</p>`:""}
    ${weaponTables(e.weapons)}${drBlock(e.feat)}${mods(e.mods)}${more(e)}
    ${(e.children||[]).map(c=>eqCard(c,true)).join("")}</article>`;
}

function traitCard(t, child){
  const chips = [t.levels!=null?`Level ${t.levels}`:"", t.cr?`CR ${t.cr}`:"", t.container&&t.container!=="group"?t.container.replace("_"," "):"", t.ref||""].filter(Boolean);
  return `<article class="entry${child?" child":""}"><div class="ehead"><h3 class="ename">${esc(t.name)}</h3>${fmtPts(t.points)}</div>
    <div class="meta">${t.disabled?`<span class="chip off">optional · off by default</span>`:""}${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${child?"":tagChips(t.tags)}</div>
    ${t.notes?`<p class="notes">${esc(t.notes)}</p>`:""}
    ${mods(t.mods)}${weaponTables(t.weapons)}${drBlock(t.feat)}${more(t)}
    ${(t.children||[]).map(c=>traitCard(c,true)).join("")}</article>`;
}

function skillCard(s){
  if(s.children) return `<article class="entry"><div class="ehead"><h3 class="ename">${esc(s.name)}</h3></div>${s.children.map(skillCard).join("")}</article>`;
  const chips=[s.diff, s.tl?`TL${s.tl}`:"", s.ref||""].filter(Boolean);
  return `<article class="entry"><div class="ehead"><h3 class="ename">${esc(s.name)}</h3></div>
    <div class="meta">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${tagChips(s.tags)}</div>
    ${s.defaults&&s.defaults.length?`<div class="feat">Defaults: ${esc(s.defaults.join(", "))}</div>`:`<div class="feat">No default</div>`}
    ${s.notes?`<p class="notes">${esc(s.notes)}</p>`:""}${drBlock(s.feat)}${more(s)}</article>`;
}

function treeNode(t){
  const pts = `<span class="tp${t.points<0?" neg":""}">${t.points}</span>`;
  const label = `<span class="tn">${esc(t.name)}${t.levels!=null?`<small>level ${t.levels}</small>`:""}${t.disabled?"<small>optional, off</small>":""}</span>${pts}`;
  const detail = (t.notes||t.mods||(t.feat&&(t.feat.dr.length||t.feat.other.length))||t.lore||t.design)
    ? `<div class="detail">${t.notes?`<p class="notes">${esc(t.notes)}</p>`:""}${mods(t.mods)}${drBlock(t.feat)}${more(t)}</div>` : "";
  if(t.children){
    return `<details class="${t.disabled?"off":""}"><summary>${label}</summary>${detail}<div class="kids">${t.children.map(treeNode).join("")}</div></details>`;
  }
  return detail
    ? `<details class="${t.disabled?"off":""}"><summary>${label}</summary>${detail}</details>`
    : `<div class="leaf${t.disabled?" off":""}">${label}</div>`;
}

function templateView(t){
  const sk = t.skills.flatMap(s=>s.children?s.children:[s]);
  return `<div class="tsum"><div>Total<b>${t.points}</b></div><div>Traits<b>${t.traitPoints}</b></div><div>Skills<b>${t.skillPoints}</b></div></div>
    ${t.notes?`<p class="tnotes">${esc(t.notes)}</p>`:""}
    <h2>Traits</h2><div class="tree">${t.traits.map(treeNode).join("")}</div>
    ${sk.length?`<h2>Skills</h2><div class="tablewrap" style="max-width:1100px"><table><thead><tr><th>Skill</th><th>Difficulty</th><th>Points</th></tr></thead><tbody>${
      sk.map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${esc(s.diff||"")}</td><td class="n">${s.points}</td></tr>`).join("")}</tbody></table></div>`:""}
    ${t.equipment.length?`<h2>Equipment</h2><div class="entries">${t.equipment.map(e=>eqCard(e)).join("")}</div>`:""}`;
}

function card(lib, e){ return lib.kind==="equipment"?eqCard(e):lib.kind==="traits"?traitCard(e):skillCard(e); }

function showLib(id){
  const lib = LIBS.find(l=>l.id===id) || LIBS[0];
  current = lib.id;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.id===lib.id));
  const head = `<header class="libhead"><div class="eyebrow">${esc(lib.section.replace(/\//g," › "))} · ${KINDNAME[lib.kind]}</div>
    <h1>${esc(lib.title)}</h1><p>${lib.kind==="template"?"Character template":`${lib.count} entries`} · GCS file <code>Library/${esc(lib.path)}</code></p></header>`;
  const body = lib.kind==="template" ? templateView(lib.template) : `<div class="entries">${lib.items.map(e=>card(lib,e)).join("")}</div>`;
  $("#main").innerHTML = head + body;
  $("#main").scrollTop = 0;
  try{ history.replaceState(null,"","#"+lib.id); }catch(_){}
  $("#side").classList.remove("open"); $("#menubtn").setAttribute("aria-expanded","false");
}

function flat(e){ return [e, ...(e.children||[]).flatMap(flat)]; }
function text(e){ return [e.name,(e.tags||[]).join(" "),e.notes,e.lore].join(" ").toLowerCase(); }

function search(q){
  q = q.trim().toLowerCase();
  if(!q){ showLib(current); return; }
  const terms = q.split(/\s+/);
  let out = "", total = 0;
  for(const lib of LIBS){
    const pool = lib.kind==="template" ? [{...lib.template, tags:[]}] : lib.items;
    const hits = pool.filter(e=>{ const t = flat(e).map(text).join(" ") + " " + lib.title.toLowerCase(); return terms.every(x=>t.includes(x)); });
    if(!hits.length) continue;
    total += hits.length;
    out += `<h2>${esc(lib.title)} <button class="chip tag" style="cursor:pointer;font:inherit;font-size:.72rem" data-open="${lib.id}">open library</button></h2>`;
    out += lib.kind==="template"
      ? `<div class="entries"><article class="entry"><div class="ehead"><h3 class="ename">${esc(lib.title)}</h3>${fmtPts(lib.template.points)}</div><p class="notes">${esc((lib.template.notes||"").slice(0,300))}…</p></article></div>`
      : `<div class="entries">${hits.slice(0,40).map(e=>card(lib,e)).join("")}</div>`;
  }
  $("#main").innerHTML = `<header class="libhead"><div class="eyebrow">Search</div><h1>“${esc(q)}”</h1><p>${total} matching entr${total===1?"y":"ies"}</p></header>` + (out || `<p class="empty">Nothing matches. Try a weapon, trait or faction name.</p>`);
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ $("#q").value=""; showLib(b.dataset.open); });
}

function buildNav(){
  const groups = {};
  for(const l of LIBS) (groups[l.section] ||= []).push(l);
  $("#nav").innerHTML = Object.entries(groups).map(([sec,ls]) =>
    `<h3>${esc(sec.split("/").slice(-1)[0] || sec)}<span style="color:var(--muted);letter-spacing:.06em"> · ${esc(sec.split("/")[0])}</span></h3>` +
    ls.map(l=>`<button data-id="${l.id}">${esc(l.title)}<span>${l.kind==="template"?fmtPtsPlain(l.template.points):l.count}</span></button>`).join("")).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ $("#q").value=""; showLib(b.dataset.id); });
  const entries = LIBS.reduce((n,l)=>n+(l.kind==="template"?0:l.count),0);
  const tmpl = LIBS.filter(l=>l.kind==="template").length;
  $("#stats").textContent = `${LIBS.length} libraries · ${entries} entries · ${tmpl} templates`;
}
function fmtPtsPlain(p){ return p+" pts"; }

buildNav();
let tmr; $("#q").addEventListener("input", e=>{ clearTimeout(tmr); tmr=setTimeout(()=>search(e.target.value),150); });
$("#menubtn").onclick = ()=>{ const s=$("#side"); s.classList.toggle("open"); $("#menubtn").setAttribute("aria-expanded", s.classList.contains("open")); };
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(h && h!==current && LIBS.some(l=>l.id===h)) showLib(h); });
const start = (location.hash||"").slice(1);
showLib(LIBS.some(l=>l.id===start) ? start : (LIBS.find(l=>l.id.includes("las-weapons"))||LIBS[0]).id);
</script>
