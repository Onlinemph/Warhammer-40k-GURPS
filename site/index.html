hapter lens below).","design":"Radiation Tolerance (B79), PF 5 (10 points) for the shielding effect, plus a 1-point Perk for voluntary control over pigmentation (camouflage/recognition flavor, no fixed numeric benefit). 11 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Oolitic Kidney","points":15,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A backup kidney that aggressively filters toxins circulating in the blood — venoms, industrial poisons, battlefield chemical agents — rather than the ones Preomnor already caught at the gut.","design":"Resistant (B81), Common: Poison, Immunity — base 15, x1 for Immunity = 15 points. Priced above Preomnor because it covers poison from any route of entry, not just food.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Neuroglottis","points":21,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Pushes taste and smell to a level that lets an Astartes identify an individual, a poison, or a chemical trace by scent alone, and track a quarry across terrain a hound couldn't follow.","design":"Discriminatory Smell (B49, 15 points, identify/track individuals and substances by scent) plus Acute Taste & Smell 3 (B35, 2/level, 6 points) for raw sensitivity. 21 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Discriminatory Smell","points":15,"tags":[],"ref":"B49","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Acute Taste & Smell","points":6,"tags":[],"ref":"B35","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Mucranoid","points":20,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Secretes a waxy, oily film that can be triggered to seal pores and orifices against vacuum, toxic atmosphere, and radiation, and that also insulates against extreme heat and cold.","design":"Sealed (B82, 15 points) covers vacuum/toxin/radiation sealing; Temperature Tolerance 5 (B93, 1/level, 5 points) covers the thermal insulation. 20 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Sealed","points":15,"tags":[],"ref":"B82","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Temperature Tolerance","points":5,"tags":[],"ref":"B93","weapons":[],"feat":{"dr":[],"other":[]},"levels":5}]},{"name":"Betcher's Gland","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Produces a corrosive, mildly toxic saliva. Fiction plays this as a minor, opportunistic weapon and a way to shrug off ingested poisons and diseased food in the mouth — not a primary attack for a Marine who has a bolter.","design":"Innate Attack (Corrosion) at a token 1d, melee reach C only (B61, roughly 3 points after the reach/range restriction) for the spit; 1-point Perk for the minor oral antitoxin effect (overlaps in concept with Preomnor, so kept nominal). 4 points total.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Corrosive Spit","points":3,"tags":[],"ref":null,"weapons":[{"melee":true,"usage":"Spit","damage":"1d cor","skill":"Brawling","notes":"","reach":"C","parry":"No"}],"feat":{"dr":[],"other":[]}},{"name":"Oral Poison Filter","points":1,"tags":[],"ref":null,"weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Progenoid Glands","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Two glands that mature over years into a bank of \"zygotes\" — genetic material an Apothecary harvests from the fallen to seed new recruits. Central to how a Chapter perpetuates and safeguards its gene-seed line, but they confer no combat benefit on the Marine who carries them; their value is entirely to the Chapter after death.","design":"1-point Perk (B21): a narrative/plot-hook organ (its condition can matter for Apothecary rolls or a Chapter's gene-seed politics) with no combat mechanic of its own.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hypno-Indoctrination (Neophyte)","points":-16,"tags":[],"ref":null,"design":"Fearlessness 2 (4) + High Pain Threshold (10) + Single-Minded (5) = 19, minus the same Duty/Sense of Duty/Code of Honor a Scout already swears (-35) = -16. Combat Reflexes is left out — it represents thousands of hours of live-fire drilling a Scout hasn't logged yet.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Fearlessness","points":4,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"High Pain Threshold","points":10,"tags":[],"ref":"B59","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Single-Minded","points":5,"tags":[],"ref":"B85","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Chapter and Imperium)","points":-15,"tags":[],"ref":"B133","notes":"Almost all the time, Extremely Hazardous.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Battle-Brothers)","points":-10,"tags":[],"ref":"B153","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Code of Honor (Codex Astartes)","points":-10,"tags":[],"ref":"B127","weapons":[],"feat":{"dr":[],"other":[]}}]}]},{"name":"Sniper's Eye","points":5,"tags":[],"ref":"B51","notes":"A trained Acute Vision +1, kept separate from Occulobe's own bonus since this represents marksmanship training rather than physiology.","lore":"Scouts serve as a Chapter's snipers and infiltrators long before they're trusted with a Tactical squad's firepower, and that role is trained hard from day one.","design":"A small trained visual-acuity bonus (B35-style pricing) representing marksmanship training rather than another organ. 5 points.","weapons":[],"feat":{"dr":[],"other":[]}}],"skills":[{"name":"Guns (Rifle)","diff":"DX/E","points":12,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Scout/sniper rifle.","feat":{"dr":[],"other":[]}},{"name":"Guns (Pistol)","diff":"DX/E","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Bolt pistol.","feat":{"dr":[],"other":[]}},{"name":"Broadsword","diff":"DX/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Combat knife-sized blades and chainswords.","feat":{"dr":[],"other":[]}},{"name":"Brawling","diff":"DX/E","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Knife","diff":"DX/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Throwing","diff":"DX/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Frag grenades.","feat":{"dr":[],"other":[]}},{"name":"Climbing","diff":"DX/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Stealth","diff":"DX/A","points":12,"tl":null,"defaults":[],"tags":[],"ref":null,"notes":"Scouts are the Chapter's infiltrators.","feat":{"dr":[],"other":[]}},{"name":"Camouflage","diff":"IQ/E","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Survival (Any)","diff":"Per/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Observation","diff":"Per/A","points":8,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Tracking","diff":"Per/A","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Soldier","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Tactics","diff":"IQ/H","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Theology (Imperial Creed)","diff":"IQ/H","points":4,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Xenos)","diff":"IQ/A","points":1,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"First Aid","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Navigation (Land)","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Running","diff":"HT/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}},{"name":"Hiking","diff":"HT/A","points":2,"tl":null,"defaults":[],"tags":[],"ref":null,"feat":{"dr":[],"other":[]}}],"equipment":[]},"count":1},{"id":"imperium--templates--astra-militarum-guardsman","title":"Astra Militarum Guardsman","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Astra Militarum Guardsman.gct","template":{"name":"Astra Militarum Guardsman","notes":"Baseline Astra Militarum trooper: an unaugmented human, drilled and issued a lasgun, not a superhuman. Point math (see each entry's `design` field for the derivation): ST 11 (+10), DX 13 (+60), IQ 10 (+0), HT 12 (+20) = 90; advantages +20; disadvantages -47; skills +39. Total 102 points, the low end of framework.md's \"Trained soldier (100-175)\" tier — a rank-and-file conscript-veteran, not a sergeant or storm trooper. Raise DX/HT and buy more skill levels to build a veteran or NCO from this base; add Military Rank (Imperium/Traits/ Imperial Traits.adq) for an officer or sergeant. No psychic abilities here — a Guardsman almost never has them, and if a GM wants a battlefield psyker attached to a squad, add traits from the separate psyker power library, not this file. Enable exactly one regimental lens and, optionally, one world-of-origin lens (all disabled by default) to flavor a specific regiment/background; they are small, net-zero-point packages, not full racial templates, per framework.md's \"lore accuracy over mechanical weight\" for background flavor. Shared traits (Fanaticism, Duty, Intolerance, the origin lenses) are pulled in with `include` from Imperium/Traits/Imperial Traits.adq rather than copied, per docs/data-format.md's \"Reusing entries across files\".\n","traitPoints":63,"skillPoints":39,"points":102,"traits":[{"name":"ST","points":10,"tags":["Attribute"],"ref":null,"lore":"A Guardsman is an ordinary, healthy adult human — no augmetic or gene-therapy enhancement.","design":"ST 11 (+1 from the human baseline of 10), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"DX","points":60,"tags":["Attribute"],"ref":null,"lore":"Basic training drills reflexes and weapon-handling hard; Imperial Guard doctrine (per Only War's calibration and countless Gaunt's Ghosts firefights) assumes competent, not exceptional, marksmanship from line infantry.","design":"DX 13 (+3 from baseline), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"IQ","points":0,"tags":["Attribute"],"ref":null,"lore":"Average intelligence; the Munitorum trains doctrine and obedience, not independent thought.","design":"IQ 10 (baseline), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"HT","points":20,"tags":["Attribute"],"ref":null,"lore":"Guard training and campaign life select for endurance; survivors of basic training are hardier than the hive-worker average.","design":"HT 12 (+2 from baseline), 10 pts/level (B14).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fit","points":5,"tags":["Advantage","Physical","Imperium"],"ref":"B55","lore":"Route marches and drill leave most Guardsmen in decent physical condition.","design":"Basic Set Fit (B55), 5 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Combat Reflexes","points":15,"tags":["Advantage","Mental","Imperium"],"ref":"B43","lore":"Drilled reactions under fire: Guard doctrine relies on soldiers who don't freeze at their first firefight, since most won't survive a second chance to learn.","design":"Basic Set Combat Reflexes (B43), 15 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fanaticism (The God-Emperor)","points":-15,"tags":["Disadvantage","Mental","Imperium"],"ref":"B136","lore":"Unshakeable belief that the Emperor is a god and that His will justifies anything done in His name — the baseline psychology Black Library gives almost every loyal Imperial citizen and soldier, from a Cadian trooper's last prayer to a Sororitas' battle-hymn. Distinct from mere piety (Theology skill, Sense of Duty): this is doctrinal certainty strong enough to override self-preservation.","design":"Basic Set Fanaticism (B136), flat -15, taken for \"the Emperor/the Imperial Creed\" as the group/ideal. Not leveled in Basic Set.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Astra Militarum)","points":-15,"tags":["Disadvantage","Social","Imperium","Astra Militarum"],"ref":"B133","lore":"Guardsmen do not resign; the Munitorum owns their service until death, discharge, or reassignment. Extremely hazardous, almost always active — front-line Guard regiments are shown fighting until they are no longer regiments.","design":"Basic Set Duty (B133): almost-always-on-duty, hazardous, involuntary military service, at the top of the disadvantage's standard cost range.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Squadmates)","points":-5,"tags":["Disadvantage","Mental","Imperium"],"ref":"B153","lore":"Small combat units live and die by cohesion; abandoning a wounded comrade is the one thing that reliably gets a soldier shunned by their own side, per how Guard squads and Sororitas/Militarum Tempestus kill-teams are consistently written in Black Library fiction.","design":"Basic Set Sense of Duty (B153), small-group scope, -5.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Xenos)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"\"The alien is the enemy\" as baseline Imperial doctrine — not personal bigotry but state religion. Universal across Black Library fiction; only a minority of xenos-sympathetic characters (some Rogue Traders, Ordo Xenos radicals) lack it.","design":"Basic Set Intolerance (B140). Costed at -10, the \"very broad category\" end of the range the book allows, since \"all non-human sapient species\" is about as broad a target as Intolerance can name.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fatalistic About the Front","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"\"You're already dead, trooper, you just haven't stopped moving yet\" — Guard humour about their own life expectancy.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Griped About the Munitorum","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Universal soldier's grumbling about rations, kit, and paperwork — never about the Emperor.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Hive World Origin","points":0,"tags":["Imperium"],"ref":null,"lore":"Born and raised inside a hive's vertical city-machine: gang territories, recycled air, and a horizon that is always a wall. Calibrated against Only War's Hive World home-world package (bonus to Fellowship/streetwise-type skills, poor grasp of open terrain) and against Necromunda's depiction throughout Black Library.","design":"A small optional container (net 0 points) rather than a full racial template: two Basic Set perks/quirks bought as a set, per framework.md's instruction to keep origin lenses lore-flavoured rather than mechanically heavy. Disabled by default in templates; the GM/player enables the one that fits.","weapons":[],"feat":{"dr":[],"other":[]},"disabled":true,"container":"group","children":[{"name":"Hive-Bred","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"A lifetime spent reading crowds, gangs, and hab-block politics.","design":"Perk (B9), +1 to Streetwise.","weapons":[],"feat":{"dr":[],"other":["Streetwise +1"]}},{"name":"Never Seen an Open Sky","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Hivers are famously unsettled by true horizons and weather.","design":"Quirk (B9), roleplaying flag only, no mechanical effect.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Death World Origin","points":0,"tags":["Imperium"],"ref":null,"lore":"Raised on a world that actively tries to kill its population — the Catachan/Krieg-adjacent archetype. Only War's Death World package (bonus to combat/survival skills, penalty to Fellowship from a lifetime of mistrust) is the calibration source.","design":"Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.","weapons":[],"feat":{"dr":[],"other":[]},"disabled":true,"container":"group","children":[{"name":"Death World Instincts","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"A childhood spent not being eaten teaches attentiveness other worlds don't.","design":"Perk (B9), +1 to Survival.","weapons":[],"feat":{"dr":[],"other":["Survival +1"]}},{"name":"Contempt for Soft Living","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Hive worlds and their comforts look like weakness from a death world's perspective.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Feral World Origin","points":0,"tags":["Imperium"],"ref":null,"lore":"A pre-industrial or tribal Imperial world (the kind that furnishes the Imperium with superstitious but ferocious Guard regiments and occasional Space Marine recruits, as with Fenris or Chogoris in Astartes lore). Only War's Feral World package (combat/melee bonus, Tech-Use penalty) is the calibration source.","design":"Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.","weapons":[],"feat":{"dr":[],"other":[]},"disabled":true,"container":"group","children":[{"name":"Warrior's Upbringing","points":1,"tags":["Perk","Imperium"],"ref":null,"lore":"Trained from childhood to fight with whatever the tribe carries.","design":"Perk (B9), +1 to Survival.","weapons":[],"feat":{"dr":[],"other":["Survival +1"]}},{"name":"Machine-Spirits Are Sorcery","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Reflexive unease around advanced technology, treated as witchcraft by trib 2 (8) for 1 point, Hard.","feat":{"dr":[],"other":[]}},{"name":"Jumping","diff":"DX/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Basic obstacle-course fitness.","design":"DX+0 (13) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Climbing","diff":"DX/A","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Basic obstacle-course and urban-assault fitness.","design":"DX-1 (12) for 1 point, Average.","feat":{"dr":[],"other":[]}},{"name":"Running","diff":"HT/A","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Route-march conditioning.","design":"HT-1 (11) for 1 point, Average.","feat":{"dr":[],"other":[]}},{"name":"Hiking","diff":"HT/A","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Route-march conditioning.","design":"HT-1 (11) for 1 point, Average.","feat":{"dr":[],"other":[]}}],"equipment":[]},"count":1},{"id":"imperium--templates--astropath","title":"Astropath","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Astropath.gct","template":{"name":"Astropath","notes":"A full Astropath of the Adeptus Astra Telepathica: Beta-grade (Psyker Talent 4), soul-bound to the Emperor's light and blinded in the binding ritual, trained in Telepathy as their core discipline (which includes Astrotelepathy, their signature interstellar-relay power). Built on the Thaumatology: Sorcery model (see framework.md and Imperium/Traits/Psykers and the Warp.adq): Psyker (Talent) sharpens skills; Warp Empowerment gates which powers can be known. This loadout's costliest known power is Dominate (full modified cost 35), so it needs Warp Empowerment level 3 (cap 40) — one level short of Beta's own official ceiling of level 4 (cap 50); the spare headroom at level 4 is there for a GM who wants this Astropath to later push a leveled Telepathy power (Psychic Scream, Terrify) higher, matching Beta's \"many Astropaths\" note in the Assignment table.\nPoint math: 90 (attributes) + 10 (Unusual Background) + 40 (Psyker 4) + 40 (Warp Empowerment 3) - 15 (Sanctioned Psyker) - 55 (Soulbinding) + 8 (Witch-sight, 10 base x 0.8 Warp Sorcery) + 119 (Telepathy discipline at default starting levels: Mind Probe/Dominate alt 35+3, Psychic Scream 12, Terrify 28, Mental Interrogation 21, Astrotelepathy 20) + 19 (skills) = 256 points. The Blindness and Soulbinding costs pull the raw total down hard, which is intentional — an Astropath trades an enormous amount for their gift, offset here by strong mental attributes and a powerful, wide-ranging Telepathy list; total lands at the top of framework.md's \"Elite human (200-350)\" tier once personal equipment is added. GCS will compute the exact final total from the included traits' own modifiers; treat the figures above as this template's design-time estimate, not a promise of GCS's rounding.\n","traitPoints":227,"skillPoints":19,"points":246,"traits":[{"name":"ST","points":0,"tags":["Attribute"],"ref":null,"lore":"An Astropath's body is unremarkable; their mind and soul are what the Choir selects for.","design":"ST 10 (human baseline), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"DX","points":0,"tags":["Attribute"],"ref":null,"lore":"Astropaths are not soldiers, and rarely fight.","design":"DX 10 (human baseline), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"IQ","points":40,"tags":["Attribute"],"ref":null,"lore":"The Choir draws its strongest telepaths from unusually sharp, focused minds.","design":"IQ 12 (+2 from baseline), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"HT","points":0,"tags":["Attribute"],"ref":null,"lore":"Average endurance; the ritual that makes an Astropath costs the eyes, not the body's toughness.","design":"HT 10 (human baseline), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Will","points":40,"tags":["Attribute"],"ref":null,"lore":"An Astropath's entire function depends on an exceptionally strong will — to hold an interstellar link open, and to survive doing so.","design":"Will+4 (Basic's Increased Will, 5 pts/level, B15).","weapons":[],"feat":{"dr":[],"other":[]},"levels":4},{"name":"Unusual Background (Latent Psychic Potential)","points":10,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Psychic ability is a random, rare mutation of the human genome that lets its bearer perceive and touch the immaterium (the warp). Sources disagree on exact frequency — Imperial administrative texts and Dark Heresy-line background both describe it as \"rare but not vanishingly so,\" on the order of a handful of latent potentials per hive-sized population, with usably strong psykers far rarer still. Treat any precise ratio as flavour, not census data.","design":"Required to take Psyker (Talent), Warp Empowerment, or any trait carrying the Warp Sorcery power modifier below. Basic Set B261 leaves Unusual Background costs to the GM; 10 points reflects that the ability itself is not learned but grants access to an entire framework of further abilities, roughly the going rate other published settings use for \"you may buy from this power list at all.\"","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Psyker","points":40,"tags":["Advantage","Mental","Talent","Psyker","Imperium"],"ref":"TSOR5","notes":"This project's Sorcery Talent (Thaumatology: Sorcery, TSOR5) analogue:\napplies as Sorcery Talent applies to a sorcerer's skills in TSOR, just\nto a 40k-specific list — Psyniscience, Meditation, Hidden Lore (the\nWarp), and the Will roll to resist Perils of the Warp (see above) — a\nhouse extension of Talent's normal \"add to listed skills\" rule,\nprecedented by Magery's and Sorcery Talent's own habit of aiding\nrelated rolls beyond pure spellcasting. Reaction bonus: +1/level from\nother sanctioned psykers and the Astra Telepathica.\n\nPsyker (Talent) and Warp Empowerment are separate purchases on separate\naxes, exactly as Sorcery Talent and Sorcerous Empowerment are in TSOR:\nthis trait only sharpens related skills and Perils resistance, while\nWarp Empowerment (above) is what actually gates which powers a psyker\nmay know. A high-Talent, low-Empowerment psyker is a sharp, well-drilled\nmind who simply hasn't learned much yet; the reverse is a raw prodigy\nwho is clumsy with the skills around their gift.\n\nImperial Assignment scale (Adeptus Astra Telepathica / Black Ships),\nweakest to strongest, mapped to Talent level. See Warp Empowerment above\nfor the matching Empowerment level/point-cap column, which is the real\ngate on ability selection:\n  Iota    — Talent 0 (latent; register but rarely take Psyker traits at all)\n  Zeta    — Talent 1\n  Eta     — Talent 1\n  Theta   — Talent 2\n  Epsilon — Talent 2  (typical Wyrdvane conscript)\n  Delta   — Talent 3  (typical Sanctioned Primaris Psyker)\n  Gamma   — Talent 4\n  Beta    — Talent 4  (many Astropaths)\n  Alpha   — Talent 5  (Astartes Librarians, Black Ship candidates)\n  Alpha-Plus — Talent 6+ (beyond-play tier: Primarchs,\n    the most powerful Inquisitors, the worst Chaos sorcerers)","lore":"The Iota-to-Alpha-Plus assignment scale is drawn from the Adeptus Astra Telepathica's own grading of psychic potential as depicted across Dark Heresy-line material and repeated in Codex/Imperial Armour background; Black Library uses the same grades in passing (e.g. Eisenhorn-cycle and Ciaphas Cain references to Alpha-class talents). \"Alpha-Plus\" specifically denotes the rarest, most dangerous talents the Black Ships process.","design":"Talent affecting four things (three skills plus the Perils resistance roll) sits at Basic's \"Medium Talent\" rate of 10 points/level (B90, three-to-five-skill bracket) rather than 5 (one-two skills) or 15 (six-nine skills) — the same rate Sorcery Talent itself uses (TSOR5, 10/level). Capped at level 6 for player characters; higher grades are GM-reference only, per the framework's \"Beyond play\" tier.","weapons":[],"feat":{"dr":[],"other":[]},"levels":4},{"name":"Warp Empowerment","points":40,"tags":["Advantage","Mental","Talent","Psyker","Imperium"],"ref":"TSOR4","notes":"A direct reskin of Sorcerous Empowerment (Thaumatology: Sorcery, TSOR4):\nthe psyker's raw, trained capacity to draw on and shape the warp, as\ndistinct from Psyker (Talent, TSOR5's Sorcery Talent analogue, below)\nwhich only sharpens related skills. Requires Unusual Background (Latent\nPsychic Potential). It is the prerequisite for every Warp Sorcery-tagged\nability in this file (see Witch-sight and each discipline below); the\nNavigator's Third Eye and the Pariah/Untouchable genes carry no Warp\nSorcery modifier and so need no Warp Empowerment.\n\nCap, cast per Thaumatology: Sorcery (TSOR): a psyker may only know a\npower whose full, modified point cost is no greater than the point cost\nof their own Warp Empowerment (10 + 10/level). A power bought at a\nhigher level (more dice, more range, etc.) costs proportionally more and\nmay outgrow a psyker's Empowerment even after they first learned it at a\ncheaper level — raising the level, and cost, of Warp Empowerment is how\na psyker \"grows into\" costlier or higher-level workings.\n\nImperial Assignment scale (Adeptus Astra Telepathica / Black Ships)\nmapped to Warp Empowerment level and the point cap that gives, worked\nout from this file's actual (Warp Sorcery -20% + Perils of the Warp)\nmodified costs:\n\nGrade      | Empowerment level | Cap (10+10/lvl) | What the cap reaches\n  Iota       | 1                  | 20              | cheapest powers only: e.g. Smite (3), Endurance (2), Iron Arm (4), Fire Bolt (4), Assail (4), Mind Probe (14), Foresight (18) — register but rarely learn more than one or two\n  Zeta       | 1                  | 20              | as Iota; low Psyker Talent limits skill use, not what they can know\n  Eta        | 1                  | 20              | as Zeta\n  Theta      | 2                  | 30              | adds Molten Beam (9), Crush (11), Psychic Scream (12), Sanctuary (13), Null Zone (23), Terrify (28)\n  Epsilon    | 2                  | 30              | as Theta (typical Wyrdvane conscript)\n  Delta      | 3                  | 40              | adds Scrier's Gaze (35), Dominate (35), Gate of Infinity (40) — the full non-Great-Power roster (typical Sanctioned Primaris Psyker)\n  Gamma      | 3                  | 40              | as Delta, better skills from a higher Psyker Talent\n  Beta       | 4                  | 50              | full roster, with headroom to push a known leveled power to a higher level/more dice (many Astropaths)\n  Alpha      | 5                  | 60              | full roster, generous headroom for high-level workings (Astartes Librarians, Black Ship candidates)\n  Alpha-Plus | 7+ (GM only)       | 80+             | approaching Great Power territory; Vortex of Doom (280+ as usually bought) is still normally out of reach even here\n\nA character need not buy Warp Empowerment up to their grade's full\nceiling: templates in this project buy only the level their actually-\nknown powers need, and note the grade's theoretical ceiling separately.","lore":"The Iota-to-Alpha-Plus assignment scale is drawn from the Adeptus Astra Telepathica's own grading of psychic potential as depicted across Dark Heresy-line material and repeated in Codex/Imperial Armour background; Black Library uses the same grades in passing (e.g. Eisenhorn-cycle and Ciaphas Cain references to Alpha-class talents). \"Alpha-Plus\" specifically denotes the rarest, most dangerous talents the Black Ships process.","design":"Sorcerous Empowerment (TSOR4) costs 10 base + 10/level (level 1 = 20 points, each further level +10) in the GCS master Thaumatology data; reused verbatim here under a 40k-appropriate name, since the underlying mechanic — \"how much warp-power you can channel at all, gating which spells/powers you may know by their modified cost\" — is exactly what an Imperial Assignment grade represents. The level-to-grade mapping above is derived, not asserted: it walks every power in this file's actual modified cost (recomputed under the new Warp Sorcery -20% modifier, see below) and finds the cheapest Empowerment level whose cap clears it, so \"Iota can only cast minor powers\" and \"Alpha can cast the biggest non-Great-Power ability\" are literally true of the numbers, not just flavour text.","weapons":[],"feat":{"dr":[],"other":[]},"levels":3},{"name":"Sanctioned Psyker","points":-15,"tags":["Disadvantage","Mental","Social","Psyker","Imperium"],"ref":null,"lore":"A Sanctioned psyker has passed through the Scholastia Psykana or an equivalent rite, is legally registered, and typically serves the Astra Militarum, an Inquisitor, or their Chapter's Librarius. They are watched, bound by oath and duty, and — even legally protected — are still called \"witch\" behind their back by the citizens they defend. Consistent across Dark Heresy/Only War's Sanctioned-psyker rules and Black Library's depiction of Primaris Psykers and Astartes Librarians alike.","design":"Duty to the Astra Telepathica/Inquisition (Basic B133 Duty table, hazardous, 12 or less) at -10, plus a mild, legally-protected Social Stigma (\"sanctioned witch,\" -5, lighter than Basic's Minority Group tier because the law is nominally on their side). Net -15.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Duty (Astra Telepathica/Inquisition, 12 or less)","points":-10,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Social Stigma (Sanctioned Psyker)","points":-5,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Soulbinding (Astropathic Choir)","points":-55,"tags":["Disadvantage","Physical","Mental","Psyker","Imperium"],"ref":null,"lore":"To become an Astropath, a Sanctioned psyker undergoes the soul-binding ritual: their eyes are burned out and their mind is bound, in a small part, to the Emperor's own psychic light on the Astronomican, so that their thoughts can be found and carried across interstellar distances. They are permanently blind and permanently, irrevocably in the Emperor's and the Imperium's service from that day on. This is standard background across Dark Heresy/Rogue Trader's Astropath material and referenced throughout Black Library whenever an Astropathic Choir appears (e.g. the Horus Heresy's Astropaths aboard Legion flagships).","design":"Blindness (Basic B140, -50) is the dominant cost; it is not mitigated mechanically here (their remaining \"sight\" is represented by Witch-sight and their Telepathy powers, not a vision substitute). Mindlink to the Astronomican/the Emperor's light (Basic Mindlink, a specific \"person,\" 5 points) is a genuine benefit — it is how they are found and relayed across the void. Sense of Duty to the Imperium of Man (a very-large-group Sense of Duty, -10, Basic's tier below \"entire race\") completes the package. Net -55.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Blindness","points":-50,"tags":["Disadvantage","Physical","Psyker","Imperium"],"ref":"B140","lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Mindlink (the Astronomican)","points":5,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (Imperium of Man)","points":-10,"tags":["Disadvantage","Social","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"See parent trait.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Witch-sight","points":8,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The first, mildest sign of the gift: an unlearned, passive prickling sense of daemonic taint, psychic activity, and warp corruption — how unsanctioned psykers are so often found, and how veteran Inquisitors and Space Marines notice a place has gone wrong before anything visible happens. Widely depicted; no single canonical source, consistent across Black Library and Dark Heresy-line material alike.","design":"Built as Detect (Psychic Activity & Daemonic Taint), an uncommon but not vanishingly rare category, base 10 per Basic's Detect cost table (B47-48). No Perils of the Warp: it is involuntary background sense, not a deliberate act of channelling. Full modified cost: 10 x 0.8 = 8 points; needs only Warp Empowerment level 1 (cap 20) — even an Iota-grade latent can have it, matching how often unsanctioned psykers are found by exactly this unlearned sense.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""}]},{"name":"Telepathy","points":119,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Reading, sending, and overwhelming minds. Calibrated against Dark Heresy's Telepathy list (Mind Probe, Dominate, Psychic Scream, Terrify, Invisibility-adjacent Mental Interrogation) and the astropathic relay seen throughout Black Library whenever a ship needs to send word home.","design":"Talent-linked group; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Mind Probe/Dominate","points":38,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The same intrusion into another mind, bought at two intensities: a forced reading of buried memory, or outright control of the body.","design":"Alternative_abilities container; full price for the costlier Dominate plus a fifth of Mind Probe.","weapons":[],"feat":{"dr":[],"other":[]},"container":"alternative_abilities","children":[{"name":"Mind Probe","points":14,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Tears buried memories and secrets from an unwilling subject.","design":"Mind Probe, Basic's core advantage, flat 20, with Warp Sorcery/ Perils, net -30%. Full modified cost: 20 x 0.7 = 14 points (discounted to a fifth as the cheaper alternative ability); needs Warp Empowerment level 1 (cap 20) at its full-price rate.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Dominate","points":35,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Seizes outright control of a target's body and actions.","design":"Mind Control, Basic's core advantage, flat 50, with Warp Sorcery/Perils, net -30%. Full modified cost: 50 x 0.7 = 35 points (the costlier child, so it sets the container's cap requirement); needs Warp Empowerment level 3 (cap 40).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]},{"name":"Psychic Scream","points":12,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A silent, mind-shattering shout that stuns everyone nearby.","design":"Affliction (10/level, delivering the default Stun effect) with Area Effect (+50%) plus Warp Sorcery/Perils, net +20%. Full modified cost: 10 x 1.2 = 12 points/level; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Terrify","points":28,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Projects raw, focused fear straight into a target's mind.","design":"Terror, Basic's core advantage (flat 30 + 10/level for extra range), with Warp Sorcery/Perils, net -30%. Full modified cost: (30+10) x 0.7 = 28 points at its default first extra-range level; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Mental Interrogation","points":21,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Reads surface thoughts, willing or not — an Inquisitorial interrogator's favourite tool.","design":"Mind Reading, Basic's core advantage, flat 30, with Warp Sorcery/ Perils, net -30%. Full modified cost: 30 x 0.7 = 21 points; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Astrotelepathy","points":20,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The astropath's signature act: sending and receiving thought across interstellar distances, relayed choir to choir and, ultimately, through the Astronomican itself. Astropaths who fail badly during a transmission are a recurring Black Library beat (burned out, driven mad, or lost with the ship's Geller field).","design":"Base 20 points for a mental send-and-receive package is this project's own baseline (Basic's exact per-range-step Telecommunication costs are not confidently recalled, so this figure is fixed for internal consistency rather than cited to a page); Increased Range at the highest tabled step (+60%) for interstellar reach, Preparation Required (-20%, a ritual trance), and the Severe Perils tier for the real danger of transmitting through the warp. Net +60-20-20-20=0%. Full modified cost: 20 x 1.0 = 20 points; needs only Warp Empowerment level 1 (cap 20) — cheap in raw points despite the interstellar range, since Increased Range's +60% roughly cancels the Preparation Required/Warp Sorcery/Severe Perils discounts; the real cost of Astrotelepathy is the Severe Perils roll, not the point price.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Increased Range x100","cost":"+60%","notes":""},{"name":"Preparation Required","cost":"-20%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp (Severe)","cost":"-20%","notes":""}]}]}],"skills":[{"name":"Psyniscience","diff":"Per/H","points":8,"tl":null,"defaults":[],"tags":["Mental","Imperium","Psionic"],"ref":null,"lore":"The trained (or instinctive) sense of \"something wrong\" in a presence, place, or object touched by the warp — a chill in a corridor, a servitor's dead eyes going wrong. Named for the Dark Heresy/Only War skill of the same purpose (Psyniscience), used here for calibration only; the GURPS build is original.","design":"New skill per framework.md (\"New skills only when nothing fits\"). Per/H, Talent-affected: characters with a Psyker Talent (see the psyker power library — not part of this file) get it at a discount per that trait's rules and may default it from Per at a penalty; an unaugmented human without any psychic Talent cannot default into it at all (there is nothing latent to sense with) and must buy it as an unusual background purchase, if a GM allows it at all — most unaugmented Imperial citizens simply never take this skill.","feat":{"dr":[],"other":[]}},{"name":"Meditation","diff":"IQ/H","points":4,"tl":null,"defaults":[],"tags":["Imperium","Psyker"],"ref":null,"lore":"The trance discipline an Astropath uses to hold an interstellar link open for hours.","design":"IQ+0 (12) for 4 points, Hard.","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (the Warp)","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":["Imperium","Psyker"],"ref":null,"lore":"Deep doctrinal knowledge of the immaterium, taught to every soul-bound Astropath.","design":"IQ+1 (13) for 4 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Theology (Imperial Creed)","diff":"IQ/H","points":2,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"An Astropath's faith in the Emperor is, quite literally, load-bearing.","design":"IQ-1 (11) for 2 points, Hard.","feat":{"dr":[],"other":[]}},{"name":"Savoir-Faire (Military)","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Enough protocol to operate aboard a warship or at a command post.","design":"IQ+0 (12) for 1 point, Easy.","feat":{"dr":[],"other":[]}}],"equipment":[]},"count":1},{"id":"imperium--templates--commissar","title":"Commissar","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Commissar.gct","template":{"name":"Commissar","notes":"A veteran Commissar of the Officio Prefectus: political officer, battlefield disciplinarian, and (per Ciaphas Cain's narration of his own reputation, which he insists is undeserved) supposed to lead from the front and be the last man standing. Point math: ST 11 (+10), DX 12 (+40), IQ 12 (+40), HT 12 (+20) = 110, plus Will +2 (+10) = 120; advantages +55; disadvantages -52; skills +78. Total 201 points, the low end of framework.md's \"Elite human (200-350)\" tier — a senior, experienced Commissar with a long record runs noticeably higher via more Rank and skill points. No psychic abilities here.\n","traitPoints":123,"skillPoints":78,"points":201,"traits":[{"name":"ST","points":10,"tags":["Attribute"],"ref":null,"lore":"A Commissar is expected to be physically capable, not exceptional.","design":"ST 11 (+1), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"DX","points":40,"tags":["Attribute"],"ref":null,"lore":"Trained to a good military standard with both bolt pistol and blade.","design":"DX 12 (+2), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"IQ","points":40,"tags":["Attribute"],"ref":null,"lore":"Commissars are Schola Progenium or equivalent-trained political officers, not mere disciplinarians.","design":"IQ 12 (+2), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"HT","points":20,"tags":["Attribute"],"ref":null,"lore":"A Commissar who leads from the front needs the endurance to survive it.","design":"HT 12 (+2), 10 pts/level (B14).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Will","points":10,"tags":["Attribute"],"ref":null,"lore":"A Commissar's job is to be the one person on the line who does not break — Ciaphas Cain repeatedly notes that whatever else is true of him, his nerve under fire is genuine.","design":"Will 14 (+2 above IQ-derived default of 12), 5 pts/level (B16).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Unfazeable","points":15,"tags":["Advantage","Mental","Imperium"],"ref":"B95","lore":"Little left to shock a Commissar who has already ordered executions and watched daemons take a trench line.","design":"Basic Set Unfazeable (B95), flat 15 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Combat Reflexes","points":15,"tags":["Advantage","Mental","Imperium"],"ref":"B43","lore":"A Commissar cannot afford to freeze; the regiment is watching.","design":"Basic Set Combat Reflexes (B43), 15 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Legal Enforcement Powers (Commissariat)","points":15,"tags":["Advantage","Social","Imperium","Astra Militarum"],"ref":"B65","lore":"A Commissar's authority to enforce discipline within their attached regiment up to and including summary execution for cowardice, desertion, or heresy — a narrower grant than an Inquisitorial rosette (it stops at the regiment's edge) but exercised far more routinely; Ciaphas Cain's narration treats a drawn bolt pistol and the words \"for the Emperor\" as a Commissar's standard response to a wavering line.","design":"Basic Set Legal Enforcement Powers (B65), 5/level, at 3 levels (15 points) — one tier below an Inquisitorial rosette's maximum, reflecting authority that is real and lethal but scoped to a single command rather than the whole Imperium.","weapons":[],"feat":{"dr":[],"other":[]},"levels":3},{"name":"Military Rank","points":10,"tags":["Advantage","Social","Imperium","Astra Militarum"],"ref":"B29","lore":"Commissars hold an officer-equivalent rank within the Officio Prefectus chain, separate from the regiment's own command structure.","design":"Basic Set Rank (B29), 5/level, generic \"Military Rank\" naming per that trait's own convention.","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Fanaticism (The God-Emperor)","points":-15,"tags":["Disadvantage","Mental","Imperium"],"ref":"B136","lore":"A Commissar's authority rests entirely on this belief being genuine, not performed.","design":"Basic Set Fanaticism (B136), flat -15, taken for \"the Emperor/the Imperial Creed\" as the group/ideal. Not leveled in Basic Set.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Duty (Astra Militarum)","points":-15,"tags":["Disadvantage","Social","Imperium","Astra Militarum"],"ref":"B133","lore":"Commissars are themselves Munitorum-bound, answerable to the Officio Prefectus for their conduct.","design":"Basic Set Duty (B133): almost-always-on-duty, hazardous, involuntary military service, at the top of the disadvantage's standard cost range.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Heretics)","points":-5,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"The Commissariat exists specifically to root out heresy, cowardice and defeatism in the ranks.","design":"Basic Set Intolerance (B140), narrow-category cost (-5).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Xenos)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"\"The alien is the enemy\" as baseline Imperial doctrine — not personal bigotry but state religion. Universal across Black Library fiction; only a minority of xenos-sympathetic characters (some Rogue Traders, Ordo Xenos radicals) lack it.","design":"Basic Set Intolerance (B140). Costed at -10, the \"very broad category\" end of the range the book allows, since \"all non-human sapient species\" is about as broad a target as Intolerance can name.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Callous","points":-5,"tags":["Disadvantage","Mental","Imperium"],"ref":"B125","lore":"The Commissariat's reputation (which Ciaphas Cain's novels explicitly play against, making him an exception) is one of willingness to execute one's own troops without much hesitation.","design":"Basic Set Callous (B125), -5.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Feared, Not Loved","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Troopers obey a Commissar; they rarely relax around one.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Immaculate Uniform","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"Commissarial dress is a deliberate, unmissable symbol of authority and is maintained accordingly, mud and blood permitting.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}}],"skills":[{"name":"Guns (Pistol)","diff":"DX/E","points":12,"tl":null,"defaults":[],"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"The bolt pistol is the Commissariat's signature sidearm.","design":"DX+4 (16) for 12 points, Easy (B170).","feat":{"dr":[],"other":[]}},{"name":"Broadsword","diff":"DX/A","points":12,"tl":null,"defaults":[],"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"A Commissar's chainsword or power sword, per framework.md's weapon-skill table.","design":"DX+3 (15) for 12 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Leadership","diff":"IQ/A","points":8,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Rallying broken troops is a Commissar's central battlefield function.","design":"IQ+2 (14) for 8 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Intimidation","diff":"Will/A","points":8,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"A Commissar's authority is enforced as much by presence and reputation as by the bolt pistol itself.","design":"Will+2 (16) for 8 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Tactics","diff":"IQ/H","points":8,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Enough grasp of tactics to judge an officer's competence, not merely follow orders.","design":"IQ+1 (13) for 8 points, Hard.","feat":{"dr":[],"other":[]}},{"name":"Strategy","diff":"IQ/H","points":4,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Broader campaign awareness expected of an officer who reports on a regiment's conduct.","design":"IQ+0 (12) for 4 points, Hard.","feat":{"dr":[],"other":[]}},{"name":"Public Speaking","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Addressing a regiment before battle, or reading a sentence of execution, are both public performances.","design":"IQ+1 (13) for 4 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Law (Imperial)","diff":"IQ/H","points":4,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"A Commissar's summary judgments still draw on the Lex Imperialis' framework, however abbreviated the process.","design":"IQ+0 (12) for 4 points, Hard.","feat":{"dr":[],"other":[]}},{"name":"Savoir-Faire (Military)","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Officer-level military etiquette.","design":"IQ+0 (12) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Soldier","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"General military competence.","design":"IQ+1 (13) for 4 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Interrogation","diff":"IQ/A","points":4,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Rooting out defeatism and cowardice often starts with questioning.","design":"IQ+1 (13) for 4 points, Average.","feat":{"dr":[],"other":[]}},{"name":"First Aid","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Basic combat first aid.","design":"IQ+0 (12) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Area Knowledge ((current front / regiment's theatre))","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Knowledge of the current campaign's area of operations.","design":"IQ+0 (12) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Current Affairs (Imperium)","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Awareness of Imperium-wide news, expected of an Officio Prefectus officer.","design":"IQ+0 (12) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Heraldry (Regimental)","diff":"IQ/A","points":2,"tl":null,"defaults":[],"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"A Commissar is typically attached to a regiment not their own and must learn its customs quickly.","design":"IQ+0 (12) for 2 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Theology (Imperial Creed)","diff":"IQ/H","points":2,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"A working command of the Imperial Creed, since a Commissar is also a lay authority on Imperial orthodoxy in the field.","design":"IQ-1 (11) for 2 points, Hard.","feat":{"dr":[],"other":[]}},{"name":"Brawling","diff":"DX/E","points":2,"tl":null,"defaults":[],"tags":["Imperium"],"ref":null,"lore":"Close-quarters fighting.","design":"DX+1 (13) for 2 points, Easy.","feat":{"dr":[],"other":[]}}],"equipment":[]},"count":1},{"id":"imperium--templates--inquisitor","title":"Inquisitor","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Inquisitor.gct","template":{"name":"Inquisitor","notes":"A working field Inquisitor — Eisenhorn or Ravenor in their prime, not a centuries-old Lord Inquisitor running whole sub-sectors (that belongs in framework.md's \"Heroes and legends\" tier, well above this template). Point math: ST 11 (+10), DX 14 (+80), IQ 15 (+100), HT 12 (+20) = 210, plus Will +2 (+10) = 220; advantages +40 plus Inquisitorial Rank 6 (+60) and Status 5 (+25); disadvantages -37; skills +251. Total 559 points, top of framework.md's \"Senior agents\" tier. Authority comes from three traits together: the Rosette (Legal Enforcement Powers: arrest, search, execute), Inquisitorial Rank (overrides every Imperial hierarchy) and Status (social standing).\nPuritan vs. Radical: this template is written Puritan-neutral. A strict Puritan build should add Intolerance (Xenos) (-10, Imperium/ Traits/Imperial Traits.adq) and lean on the Ordo Hereticus/Malleus lenses; a Radical build (xenotech users, daemonhosts, etc.) should drop or reinterpret Intolerance (Heretics) and is otherwise unrestricted by this template — Radicalism is a stance on methods and sanctioned lore, not a separate stat block, per how Eisenhorn's own arc treats it.\nNo psychic abilities here; many Inquisitors are sanctioned psykers, but that is a separate purchase from the psyker power library, not part of this baseline.\nEnable at most one Ordo lens (all disabled by default); an Inquisitor belongs to exactly one Ordo. They are small flavor packages, not full specialisations — a real Ordo Malleus Inquisitor's daemon-hunting expertise should mostly show up as bought-up Hidden Lore (Daemons) and Hidden Lore (The Warp) levels, not a lens.\n","traitPoints":308,"skillPoints":251,"points":559,"traits":[{"name":"ST","points":10,"tags":["Attribute"],"ref":null,"lore":"Inquisitors survive long enough to reach this rank partly through personal fitness.","design":"ST 11 (+1), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"DX","points":80,"tags":["Attribute"],"ref":null,"lore":"A veteran of countless personal confrontations, armed and otherwise.","design":"DX 14 (+4), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"IQ","points":100,"tags":["Attribute"],"ref":null,"lore":"Eisenhorn and Ravenor are both written as formidably intelligent, solving cases that defeat entire Arbites precincts and Ordo cells.","design":"IQ 15 (+5), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"HT","points":20,"tags":["Attribute"],"ref":null,"lore":"Decades of fieldwork, often ending in violence, demand real endurance.","design":"HT 12 (+2), 10 pts/level (B14).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Will","points":10,"tags":["Attribute"],"ref":null,"lore":"An Inquisitor's will has to outlast interrogation, daemonic influence, and their own doubts.","design":"Will 17 (+2 above the IQ-derived default of 15), 5 pts/level (B16).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fit","points":5,"tags":["Advantage","Physical","Imperium"],"ref":"B55","lore":"Kept sharp by a career that regularly turns violent.","design":"Basic Set Fit (B55), 5 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Combat Reflexes","points":15,"tags":["Advantage","Mental","Imperium"],"ref":"B43","lore":"A survivor of more ambushes and firefights than almost anyone outside the Astartes.","design":"Basic Set Combat Reflexes (B43), 15 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Legal Enforcement Powers (Inquisitorial Rosette)","points":20,"tags":["Advantage","Social","Imperium","Inquisition"],"ref":"B65","lore":"\"I have the authority of the Emperor Himself\" — an Inquisitor can commandeer Imperial Guard regiments, override a planetary governor's orders, or execute an Astartes Chapter Master's aide without trial, per repeated scenes across Eisenhorn, Ravenor, and countless codex vignettes.","design":"Basic Set Legal Enforcement Powers (B65) at its maximum, 4 levels (20 points): the right to arrest, search, requisition and execute. LEP covers what an Inquisitor may do to people; their authority over other Imperial institutions (commandeering a regiment, overruling a governor) is Inquisitorial Rank, and their standing in Imperial society is Status. Take all three.","weapons":[],"feat":{"dr":[],"other":[]},"levels":4},{"name":"Inquisitorial Rank","points":60,"tags":["Advantage","Social","Imperium","Inquisition"],"ref":"B29","notes":"Levels: 1 Acolyte in formal service, 3 Interrogator, 6 Inquisitor, 7 senior/renowned Inquisitor, 8 Lord Inquisitor, 9 Grand Master of an Ordo or Inquisitorial Representative to the High Lords.","lore":"The Inquisition answers to no Imperial body but itself. A single Inquisitor can requisition Guard regiments and Navy vessels, declare Exterminatus, and relieve a governor, as shown repeatedly in the Eisenhorn and Ravenor novels and codex background. In practice that authority is limited by what the Inquisitor can enforce and by rival Inquisitors.","design":"Basic Set Rank (B29), 5/level, with a custom +100% enhancement because the Rank reaches across every Imperial institution instead of one. Inquisitor at level 6: 30 x 2 = 60 points. Kept separate from Status per GURPS convention: Rank is authority within (here, over) organisations; Status is social standing.","weapons":[],"feat":{"dr":[],"other":[]},"levels":6,"mods":[{"name":"Overrides all Imperial hierarchies","cost":"+100%","notes":"Every Imperial organisation (Astra Militarum, Administratum, Ecclesiarchy, Navy, planetary governments) treats this as a Rank higher than any of its own at the same or lower level. The Adeptus Astartes and Mechanicus are sovereign allies rather than subordinates: they are not bound by it, but in practice rarely defy it openly.\n"}]},{"name":"Status (Inquisitor)","points":25,"tags":["Advantage","Social","Imperium","Inquisition"],"ref":"B28","lore":"Nobles and planetary rulers defer to an Inquisitor who reveals themselves; most Imperial citizens will never meet anyone higher. Many Inquisitors hide their Status behind a cover identity until it is needed.","design":"Basic Set Status (B28) level 5 (25 points): just below a planetary governor (Status 6) socially, while Inquisitorial Rank lets them overrule one. Interrogators typically have Status 2-3.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Sense of Duty (The Imperium)","points":-10,"tags":["Disadvantage","Mental","Imperium"],"ref":"B153","lore":"Unlike an acolyte's enforced Duty, an Inquisitor answers mostly to their own conscience and their Ordo's mandate — but that mandate (\"protect humanity, whatever it costs\") is still a real, large-scope obligation, per how both Eisenhorn and Ravenor are written as unable to simply walk away from a case.","design":"Basic Set Sense of Duty (B153), very large scope (humanity/the Imperium), -10.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Fanaticism (The God-Emperor)","points":-15,"tags":["Disadvantage","Mental","Imperium"],"ref":"B136","lore":"The default assumption for a loyalist Inquisitor. A Radical build that has drifted from orthodox faith (rare, but present in the fiction) may drop this with GM agreement — see the Puritan/Radical note above.","design":"Basic Set Fanaticism (B136), flat -15, taken for \"the Emperor/the Imperial Creed\" as the group/ideal. Not leveled in Basic Set.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Intolerance (Heretics)","points":-5,"tags":["Disadvantage","Mental","Imperium"],"ref":"B140","lore":"Even a Radical Inquisitor is still, definitionally, opposed to Chaos.","design":"Basic Set Intolerance (B140), narrow-category cost (-5).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Callous","points":-5,"tags":["Disadvantage","Mental","Imperium"],"ref":"B125","lore":"\"The Emperor Protects\" is frequently shown, in Eisenhorn especially, to mean acolytes, bystanders, and whole populations are expendable against the mission.","design":"Basic Set Callous (B125), -5.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Trusts No One Completely, Including Their Own Retinue","points":-1,"tags":["Quirk","Imperium"],"ref":null,"lore":"A recurring Eisenhorn/Ravenor beat — even loyal acolytes get investigated eventually.","design":"Quirk (B9), roleplaying flag only.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Carries the Weight of Every Call Made Alone fitting comfortably under framework.md's \"Elite human (200-350)\" tier. A GM running a Navigator across centuries of service should add escalating Unnatural Features levels as the character's own mutation-with-age (see the parent trait's lore note); this template leaves that as an open dial rather than a fixed cost.\n","traitPoints":147,"skillPoints":24,"points":171,"traits":[{"name":"ST","points":0,"tags":["Attribute"],"ref":null,"lore":"Navigators are physically unremarkable outside the third eye.","design":"ST 10 (human baseline), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"DX","points":0,"tags":["Attribute"],"ref":null,"lore":"Navigators are not trained fighters.","design":"DX 10 (human baseline), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"IQ","points":40,"tags":["Attribute"],"ref":null,"lore":"Centuries of selective breeding for the strength and control the third eye demands also selects for sharp, disciplined minds.","design":"IQ 12 (+2 from baseline), 20 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"HT","points":10,"tags":["Attribute"],"ref":null,"lore":"A Navigator must survive years of continuous warp exposure; House bloodlines select for endurance.","design":"HT 11 (+1 from baseline), 10 pts/level (B15).","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Will","points":40,"tags":["Attribute"],"ref":null,"lore":"The will needed to hold a ship's course through the immaterium without being lost or consumed by it.","design":"Will+4 (Basic's Increased Will, 5 pts/level, B15).","weapons":[],"feat":{"dr":[],"other":[]},"levels":4},{"name":"Navigator's Third Eye","points":22,"tags":["Advantage","Disadvantage","Mental","Psyker","Imperium","Navis Nobilite"],"ref":null,"lore":"House Navigators carry a third eye, fused shut beneath the brow, that perceives the Astronomican's light and the safe currents of the warp well enough to steer a ship through it — and that kills or maddens anyone it meets uncovered. Navigators keep the eye bound at all times except when navigating from a shielded bridge. The clearest published detail on this comes from the Rogue Trader corebook's Navigator background rather than Black Library, which mostly gestures at the Navis Nobilite and the \"third eye\" in passing (e.g. Horus Heresy-era references); treat the RPG-tier material as the calibration source here per the framework's source-priority rule. Over centuries of psychic strain, aged Navigators are widely depicted as growing increasingly strange or deformed (a GM-invoked cosmetic/social disadvantage for very old Navigators — e.g. escalating Unnatural Features — rather than a fixed cost baked into this trait).","design":"Deliberately carries no Warp Sorcery or Perils of the Warp modifier, and needs no Warp Empowerment: the third eye is an always-on inherited mutation, not a deliberately channelled act — though a GM is free to call for a one-off Perils-style check during an extreme event like flying blind through a warp storm. Net for the package: 12 (Warp Sight) + 6 (Lethal Gaze) = 18.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Warp Sight","points":13,"tags":["Advantage","Mental","Psyker","Imperium","Navis Nobilite"],"ref":null,"lore":"What lets a Navigator see the Astronomican's beacon and the warp's safer currents across a voyage, letting a ship cross the immaterium without being lost or devoured.","design":"Detect (Basic B47-48), base 5 for an uncommon, specific thing; Precise doubles that (expressed here as +100%, equivalent to Basic's x2 multiplier); Increased Range at the highest tabled step (+60%, the \"100x\" tier) reflects effectively unlimited range while the eye is open in transit; Accessibility (-10%) reflects that it only works, and is only tolerable, while uncovered.","weapons":[],"feat":{"dr":[],"other":["Navigation (Warp) +4"]},"mods":[{"name":"Precise","cost":"+100%","notes":""},{"name":"Increased Range x100","cost":"+60%","notes":""},{"name":"Accessibility (only while the third eye is uncovered)","cost":"-10%","notes":""}]},{"name":"Lethal Gaze","points":9,"tags":["Disadvantage","Advantage","Mental","Psyker","Imperium","Navis Nobilite"],"ref":null,"lore":"This is why the eye stays bound: anyone who meets it directly, with no warding, risks death or madness. It is a narrative hazard for the people around a Navigator far more than a usable weapon for the player.","design":"Affliction (Basic B35), base 10, delivering a -50 point \"Mind-Sundering\" disadvantage (+50%); Sense-Based (Vision) (-20%, B112, only affects those who can see the eye); Uncontrollable (-30%, B113, the Navigator cannot pick and choose who is struck); Accessibility limiting it to moments the eye is uncovered (-10%).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Disadvantage Delivered (Mind-Sundering","cost":"+50%","notes":"An unshielded mortal who meets the open eye is killed, driven mad, or worse, GM's call; only other Navigators and comparably warp-touched beings routinely survive it."},{"name":"Sense-Based (Vision)","cost":"-20%","notes":""},{"name":"Uncontrollable","cost":"-30%","notes":""},{"name":"Accessibility (only when the third eye is uncovered)","cost":"-10%","notes":""}]}]},{"name":"Status","points":20,"tags":["Advantage","Social","Imperium","Navis Nobilite"],"ref":"B28","lore":"A Navigator House is minor interstellar nobility in its own right, courted by Rogue Traders and Imperial Navy captains alike.","design":"Status 2, Basic's standard 5 points/level (B28).","weapons":[],"feat":{"dr":[],"other":[]},"levels":2},{"name":"Wealthy","points":20,"tags":["Advantage","Social","Imperium","Navis Nobilite"],"ref":"B25","lore":"House Navigator income from trade-route monopolies and shipping contracts.","design":"Basic Set Wealthy (B25), 20 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Distinctive Features (Third Eye)","points":-5,"tags":["Disadvantage","Physical","Imperium","Navis Nobilite"],"ref":null,"lore":"Even bound shut, the brow ridge and scar tissue of the third eye mark a Navigator as visibly inhuman to anyone who looks closely.","design":"Basic's Distinctive Features (a fixed, minor -5 for a feature that is unusual but easily hidden under a wrap or hood).","weapons":[],"feat":{"dr":[],"other":[]}}],"skills":[{"name":"Navigation (Warp)","diff":"IQ/H","points":20,"tl":null,"defaults":[],"tags":["Imperium","Psyker","Navis Nobilite"],"ref":null,"lore":"Navigation (Hyperspace) renamed and restricted per framework.md — the specific, trained skill of reading the third eye's sight into a safe course through the immaterium.","design":"20 points in a Hard skill is IQ+4 before the Third Eye's bonus. A Navigator trains from childhood for this one job; a ship-rated Navigator should be the best in the galaxy at it, so this is weighted well above the template's other skills.","feat":{"dr":[],"other":[]}},{"name":"Piloting (High-Performance Spacecraft)","diff":"DX/A","points":2,"tl":null,"defaults":[],"tags":["Imperium","Navis Nobilite"],"ref":null,"lore":"A working knowledge of the bridge a Navigator serves on, even though astropathic and helm crews handle most direct piloting.","design":"DX+0 (10) for 2 points, Average.","feat":{"dr":[],"other":[]}},{"name":"Savoir-Faire (High Society)","diff":"IQ/E","points":1,"tl":null,"defaults":[],"tags":["Imperium","Navis Nobilite"],"ref":null,"lore":"A House Navigator is raised to court manners as much as to the eye's discipline.","design":"IQ+0 (12) for 1 point, Easy.","feat":{"dr":[],"other":[]}},{"name":"Merchant","diff":"IQ/A","points":1,"tl":null,"defaults":[],"tags":["Imperium","Navis Nobilite"],"ref":null,"lore":"Basic grounding in the trade politics a Navigator House lives on.","design":"IQ-1 (11) for 1 point, Average.","feat":{"dr":[],"other":[]}}],"equipment":[]},"count":1},{"id":"imperium--templates--primaris-battle-brother","title":"Primaris Battle-Brother","section":"Imperium/Templates","kind":"template","path":"Imperium/Templates/Primaris Battle-Brother.gct","template":{"name":"Primaris Battle-Brother","notes":"A Primaris Marine of Cawl's design: the full Astartes gene-seed package plus the three Primaris-only organs (Sinew Coils, Magnificat, Belisarian Furnace). Skill investment matches the Firstborn Battle-Brother template rather than sitting below it -- Primaris training is compressed but thorough, and the strain's own combat record backs treating a rank-and-file Primaris Battle-Brother as roughly on par with, not junior to, a veteran of the old pattern. Equipment (Mk X bolt rifle, Mk X power armour) lives in the armoury files, not here.","traitPoints":559,"skillPoints":206,"points":765,"traits":[{"name":"Astartes","points":443,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"The Adeptus Astartes: a superhuman created by grafting nineteen engineered organs onto a chosen human recruit and finishing the process with years of training and psycho-indoctrination. This trait is the baseline shared by every Chapter's gene-seed; Chapter lenses below add or remove pieces where the fiction says a specific lineage differs.","design":"287 (Attribute Modifiers) + 153 (nineteen organs: 4+14+1+1+5+6+10+1 +11+9+9+9+11+15+21+20+4+1+1) + 3 (Hypno-Indoctrination) = 443 points. This is the physiology alone, before any skills; see the Battle-Brother, Scout, and Primaris templates for full characters built on top of it.","weapons":[],"feat":{"dr":[],"other":[]},"container":"ancestry","children":[{"name":"Attribute Modifiers","points":287,"tags":["Physical"],"ref":null,"design":"Increased ST +20 (B14, 10/level, 200) for ST 30 (user's figure), which also raises base HP to 30. Raised from ST 18 when weapon damage was rescaled: at ST 30 a Marine lifts nine times what a baseline human can (Basic Lift 180 lb), matching fiction of Astartes tearing open hatches and lifting men one-handed, and a single bolt that gets through the armour (avg ~40 with its follow-up) leaves him fighting rather than dead. Increased HT +4 (B15, 10/level, 40) for HT 14. Increased Basic Speed +1.00 (B17, 5 points per 0.25, 20) for \"faster reflexes than baseline humans\" without inflating every DX-based skill the way a straight DX buy would. Increased Will +2 (B16, 5/level, 10) for the iron discipline the fiction shows even before the Hypno-Indoctrination package below. Extra Hit Points +4 (B16, 2/level, 8) for HP 34: Astartes survive wounds that would kill several men, beyond what ST alone gives. Extra Fatigue Points +3 (B16, 3/level, 9) for FP 17, matching fiction of Marines fighting for days without rest. 200+40+20+10+8+9 = 287. Height runs 2.1-2.4 m per the framework; SM stays 0 unarmoured.","weapons":[],"feat":{"dr":[],"other":["ST +20","HT +4","Basic Speed +1","Will +2","HP +4","FP +3"]}},{"name":"Secondary Heart","points":4,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B58","notes":"+2 to HT rolls made solely to avoid death (Hard to Kill 2).","lore":"A backup heart grown alongside the original, wired into the same circulatory system so the body keeps pumping blood even if the primary heart is destroyed or stops. Widely depicted in Black Library fiction as one reason Astartes shrug off wounds that would drop a normal man dead of shock or blood loss.","design":"Modelled as Hard to Kill 2 (B58): +2 to HT rolls to avoid death only, not a general toughness bonus, since the second heart is a redundancy against cardiac failure specifically. 2 x 2 = 4 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Ossmodula","points":14,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B46","notes":"DR 3 on torso and vitals only (fused, armoured ribcage). Stacks with worn armour.","lore":"Triggers a second, controlled growth spurt: the skeleton is re-knitted around a denser mineral lattice, ribs fuse into an armoured cage, and the whole frame roughly doubles in mass over the following implantation. The fused ribcage is one of the most consistently described Astartes traits: a solid plate of bone over the chest that turns blades and slugs that would reach a normal man's heart.","design":"The ST/HT/HP payoff of the growth process is bought once in the Astartes Attribute Modifiers, not here. What the organ adds on its own is the fused ribcage: Damage Resistance 3 (B46, 5/level, 15) with the Partial (torso and vitals) limitation, -10%, = 13.5, rounded up to 14. An earlier draft priced this as a 1-point perk with no mechanical effect, which left the most-cited Astartes toughness feature out of play.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":3,"locs":["torso","vitals"]}]}],"other":[]}},{"name":"Biscopea","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Works alongside the Ossmodula to pack the newly-grown frame with dense, fast-twitch muscle, giving Astartes their characteristic bulk.","design":"Same reasoning as Ossmodula: the muscle mass is paid for once as part of the racial ST bonus, so this is a 1-point Perk marking the organ's presence rather than a second helping of ST.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Haemastamen","points":1,"tags":["Advantage","Physical","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Regulates the chemistry of Astartes blood and produces the genetically-tagged compounds an Apothecary tests for to confirm a Marine's gene-seed lineage and general biochemical stability. Its output is also the substrate Larraman's Organ acts on.","design":"Pure physiology/plot-hook organ — no combat effect of its own. 1-point Perk (B21) so it stays a listed, removable trait.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Larraman's Organ","points":5,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B79","notes":"Wounds scab and scar over within seconds rather than minutes; treat as Rapid Healing for recovery rolls (B424), and the GM should waive ongoing blood-loss effects from an untreated wound after the first turn.","lore":"Floods the bloodstream with \"Larraman's cells\" that clot almost instantly on exposure to air, so an open wound scabs over in seconds. This is the single most commonly cited reason Astartes soldier on through injuries that would leave a Guardsman bleeding out; it is described across Black Library fiction from minor cuts up to serious battlefield trauma.","design":"Reflavoured Rapid Healing (B79, 5 points): the RAW effect (double effective HT for recovery rolls) undersells \"seals in seconds,\" so the design also folds in automatic stabilization against ongoing blood loss for the first turn after a wound, at no extra point cost — it's the same underlying \"clots fast\" phenomenon at two timescales.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Catalepsean Node","points":6,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B65","lore":"A brainstem structure that lets the two cerebral hemispheres rest in alternation, so an Astartes only needs a couple of hours of true sleep where a human needs eight, and can go without any for days at a stretch on campaign. Distinct from the Sus-an Membrane, which is a full metabolic shutdown rather than efficient rest.","design":"Less Sleep 3 (B65, 2 points/level): reduces sleep need from 8 hours to about 2. 3 x 2 = 6 points.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Preomnor","points":10,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":"B81","lore":"A supplementary \"pre-stomach\" that chemically breaks down and neutralizes toxins and spoiled matter in food before it reaches the true stomach, letting Astartes eat things — rotten rations, raw feral-world game, toxic fungus — that would sicken or kill an unaugmented human.","design":"Resistant (B81), Occasional: Ingested Poison, Immunity — base 10, x1 for Immunity = 10 points. Deliberately narrower than Oolitic Kidney below: this organ only ever sees toxins that arrive through the gut.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Omophagea","points":1,"tags":["Advantage","Mental","Imperium","Adeptus Astartes","Perk"],"ref":null,"lore":"Lets an Astartes extract genetic and biochemical information by consuming a portion of a creature's flesh or blood, surfacing it as hazy instinctive knowledge — described in the fiction as ritual consumption of a slain xenos to \"know\" something of it, rather than a controllable database query.","design":"No reliable, repeatable mechanical payoff to hang a point cost on — the fiction treats it as evocative, not a reliable Analyze/Detect power. Kept as a 1-point Perk (B21); a GM can hand out a one-off Hidden Lore or skill bonus after an appropriate scene at their discretion, with no fixed rule for it here.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Multi-lung","points":11,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"A supplementary lung that scrubs smoke, gas, and thin or tainted atmospheres, and banks extra oxygen for holding the breath through vacuum exposure, drowning, or a gas attack.","design":"Filter Lungs (B55, 5 points) for the \"breathe filthy air safely\" half; Breath-Holding 3 (B41, 2/level, 6 points) for the \"hold it a long time\" half. Container sums to 11 points.","weapons":[],"feat":{"dr":[],"other":[]},"container":"meta_trait","children":[{"name":"Filter Lungs","points":5,"tags":[],"ref":"B55","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Breath-Holding","points":6,"tags":[],"ref":"B41","weapons":[],"feat":{"dr":[],"other":[]},"levels":3}]},{"name":"Occulobe","points":9,"tags":["Advantage","Physical","Imperium","Adeptus Astartes"],"ref":null,"lore":"Rewires the optic nerve and visual cortex for much sharper acuity and low-light performance, and hardens the eye against flash and glare — Astartes are consistently shown spotting targets and reading terrain at ranges no unaugmented eye could manage, and
