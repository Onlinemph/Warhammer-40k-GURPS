<title>40K GURPS Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#e9e8e3; --panel:#f5f4f0; --ink:#1c1a21; --muted:#5f5b66; --line:#cfccc4;
  --accent:#8e1b1b; --accent-soft:#8e1b1b14; --brass:#8a6a22; --brass-soft:#8a6a2218;
  --row:#efeee9; --chip:#e0ded7; --neg:#6b3fa0;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141318; --panel:#1c1b21; --ink:#e7e2d7; --muted:#a39daa; --line:#34313b;
  --accent:#e0574b; --accent-soft:#e0574b1c; --brass:#d1ad5d; --brass-soft:#d1ad5d1c;
  --row:#211f26; --chip:#2b2931; --neg:#b692e6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141318; --panel:#1c1b21; --ink:#e7e2d7; --muted:#a39daa; --line:#34313b;
  --accent:#e0574b; --accent-soft:#e0574b1c; --brass:#d1ad5d; --brass-soft:#d1ad5d1c;
  --row:#211f26; --chip:#2b2931; --neg:#b692e6; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 16px 40px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:1.15rem;line-height:1.2;margin:0 0 2px}
.brand small{display:block;font-family:var(--body);font-weight:400;letter-spacing:0;font-size:.82rem;color:var(--muted);margin-top:4px}
.search{width:100%;margin:16px 0 8px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.stats{font-size:.8rem;color:var(--muted);margin-bottom:14px;font-variant-numeric:tabular-nums}
nav h3{font-family:var(--display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:18px 0 6px;font-weight:700}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:.95rem;padding:5px 8px;border-radius:5px;cursor:pointer}
nav button:hover{background:var(--row)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
nav button span{white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:.75rem;padding-top:3px}
main{overflow-y:auto;padding-block:28px 80px;padding-inline:clamp(16px,4vw,48px)}
.libhead{max-width:1100px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:.03em;margin:4px 0 0;text-wrap:balance;line-height:1.15}
.libhead p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.libhead code{font-family:var(--mono);font-size:.8rem}
.entries{display:grid;gap:18px;max-width:1100px}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.entry.child{background:none;border:0;border-left:2px solid var(--line);border-radius:0;padding:4px 0 4px 14px;margin-top:12px}
.ehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.ename{font-weight:700;font-size:1.12rem;margin:0}
.child .ename{font-size:1rem}
.pts{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--brass);font-size:.95rem;white-space:nowrap}
.pts.neg{color:var(--neg)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--mono);font-size:.74rem;background:var(--chip);padding:1px 7px;border-radius:3px;white-space:nowrap}
.chip.tag{font-family:var(--body);font-size:.76rem;background:none;border:1px solid var(--line)}
.chip.off{background:var(--accent-soft);color:var(--accent)}
.notes{margin:10px 0 0;white-space:pre-line;max-width:75ch}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;font-size:.88rem;width:100%}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
td.dmg{font-family:var(--mono);font-size:.84rem;font-weight:600;color:var(--accent);white-space:nowrap}
tr.wnote td{border-bottom:1px solid var(--line);color:var(--muted);font-size:.82rem;padding-top:0}
tr.hasnote td{border-bottom:0}
.dr{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.9rem}
.dr b{font-family:var(--mono);color:var(--accent);font-weight:600;margin-right:4px}
.feat{margin-top:8px;font-size:.9rem;color:var(--muted)}
.mods{margin:10px 0 0;padding:0;list-style:none;font-size:.88rem}
.mods li{padding:2px 0}
.mods .c{font-family:var(--mono);font-size:.8rem;color:var(--brass);margin-left:6px}
.mods .mn{color:var(--muted)}
details.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
details.more summary{cursor:pointer;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);list-style:none;display:inline-block}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";font-family:var(--mono)}
details.more[open] summary::before{content:"− "}
.more h4{font-family:var(--display);font-size:.8rem;letter-spacing:.1em;margin:10px 0 2px;color:var(--brass)}
.more p{margin:0;white-space:pre-line;max-width:75ch;font-size:.93rem}
.tsum{display:flex;flex-wrap:wrap;gap:10px 28px;margin:4px 0 20px;max-width:1100px}
.tsum div{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tsum b{display:block;font-family:var(--mono);font-size:1.6rem;color:var(--ink);letter-spacing:0;text-transform:none}
.tnotes{max-width:75ch;white-space:pre-line;margin:0 0 22px}
h2{font-family:var(--display);font-size:1.05rem;letter-spacing:.08em;margin:28px 0 10px;max-width:1100px;border-bottom:1px solid var(--line);padding-bottom:4px}
.tree{max-width:1100px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 0}
.tree details>summary,.tree .leaf{display:flex;gap:10px;align-items:baseline;padding:5px 14px;cursor:pointer;list-style:none}
.tree .leaf{cursor:default}
.tree summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:"▸";color:var(--muted);font-size:.8rem;width:10px}
.tree details[open]>summary::before{content:"▾"}
.tree .leaf::before{content:"";width:10px}
.tree .kids{padding-left:18px;border-left:1px solid var(--line);margin-left:19px}
.tree .tn{flex:1}
.tree .tn small{color:var(--muted);margin-left:6px}
.tree .tp{font-family:var(--mono);font-size:.85rem;color:var(--brass);font-variant-numeric:tabular-nums}
.tree .tp.neg{color:var(--neg)}
.tree .off{opacity:.55}
.tree .detail{padding:0 14px 8px 34px;font-size:.88rem;color:var(--muted)}
.tree .detail .notes{margin-top:0}
.empty{color:var(--muted);font-style:italic}
.hit{background:var(--brass-soft);border-radius:2px}
.menubtn{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;max-height:none;overflow:visible}
  aside nav{display:none}
  aside.open nav{display:block}
  .menubtn{display:inline-block;margin-top:4px;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:.85rem;padding:5px 10px;border-radius:5px;cursor:pointer}
  .search{margin-top:10px}
  main{padding-block:20px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside id="side">
    <p class="brand">40K GURPS Codex<small>Warhammer 40,000 for GURPS 4e</small></p>
    <input id="q" class="search" type="search" placeholder="Search names, tags, lore…" aria-label="Search the codex">
    <div class="stats" id="stats"></div>
    <button class="menubtn" id="menubtn" aria-expanded="false">Libraries</button>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>

<script>
const DATA = {"libraries":[{"id":"imperium--armour--force-fields","title":"Force Fields","section":"Imperium/Armour","kind":"equipment","path":"Imperium/Armour/Force Fields.eqp","items":[{"name":"Refractor Field","tl":"11","lc":"1","cost":"8000","weight":"2 lb","qty":1,"tags":["Force Field","Energy Shield","Imperium","Inquisition"],"ref":null,"notes":"Shield 40 SP. Recharge: after 2 seconds without taking damage, regains 10 SP per second. Ranged attacks only: melee blows and thrown objects pass through at walking speed. A faint shimmer surrounds the wearer while active (-1 to Holdout, Stealth in darkness -1).","lore":"The personal field most associated with Inquisitors, Rogue Traders and senior Imperial agents in Black Library fiction (Eisenhorn and Ravenor among others) and the Dark Heresy and Rogue Trader lines: a shimmering field that scatters incoming fire. Shown as good against a stream of small-arms fire and poor against one heavy hit.","design":"Small pool, fastest recharge of the Imperial fields, which reproduces the lore: it eats two lasgun hits (avg 17.5 each) and is back to full a few seconds after the shooting pauses, but one bolt (avg 42, plus its 6d follow-up detonating on the field) breaks it. Ranged-only follows the fiction of fields that stop fast projectiles but not slow objects.","weapons":[],"feat":{"dr":[],"other":[]},"uses":40},{"name":"Rosarius","tl":"12","lc":"2","cost":"6000","weight":"1 lb","qty":1,"tags":["Force Field","Energy Shield","Imperium","Ecclesiarchy"],"ref":null,"notes":"Shield 60 SP. Recharge: after 3 seconds without taking damage, regains 10 SP per second. Blocks ranged and melee attacks. Worn as an amulet; the field is invisible until struck.","lore":"Protection for Ministorum priests, Confessors and Canonesses who fight without full Sororitas plate. Ecclesiarchy background presents it as a blessed relic as much as a device: the faithful credit the Emperor's favour when it holds.","design":"Three lasgun hits are absorbed; one bolt (avg 42 plus ~21 follow-up) about breaks it, and plasma (avg 84) goes through. Ranked below the conversion field and iron halo, matching its role as the field for mortal clergy rather than Astartes officers.","weapons":[],"feat":{"dr":[],"other":[]},"uses":60},{"name":"Conversion Field","tl":"12","lc":"1","cost":"25000","weight":"3 lb","qty":1,"tags":["Force Field","Energy Shield","Imperium","Inquisition"],"ref":null,"notes":"Shield 80 SP. Recharge: after 3 seconds without taking damage, regains 10 SP per second. Blocks ranged and melee attacks. Flash: any single hit that removes 20+ SP converts into a burst of light; everyone within 5 yards facing the wearer (not the wearer) rolls HT or is blinded for 1d seconds. Photo-visors and auto-senses negate the flash.","lore":"Signature protection of high-ranking Inquisitors and Rogue Traders in Black Library fiction: it turns a chainsword stroke or a point-blank shot into a blinding flare. A rare relic rather than standard Imperial manufacture.","design":"Absorbs a bolt with room to spare, a plasma bolt (6dx4, avg 84) a bit under half the time, and nearly any hand weapon wielded by an unaugmented human. The flash is its defining lore trait and makes heavy hits on the wearer dangerous to bystanders.","weapons":[],"feat":{"dr":[],"other":[]},"uses":80},{"name":"Iron Halo","tl":"12","lc":"0","cost":"20000","weight":"2 lb","qty":1,"tags":["Force Field","Energy Shield","Imperium","Adeptus Astartes"],"ref":null,"notes":"Shield 120 SP. Recharge: after 3 seconds without taking damage, regains 20 SP per second. Blocks ranged and melee attacks. Mounted on the backpack of Astartes power armour; needs the armour's power supply.","lore":"A relic field worn by Chaplains, Captains and Chapter Masters, per Codex: Space Marines background and Black Library fiction. An honour as well as protection: a Marine is granted one, not issued it.","design":"Holds against a plasma bolt (avg 84) and a power-fist blow (thr+8d(10), ~34 in Astartes hands) and recovers quickly, so an Astartes hero can walk through small-arms fire as in the fiction. A lascannon (8dx8, avg 224) still breaks it and continues into the armour.","weapons":[],"feat":{"dr":[],"other":[]},"uses":120},{"name":"Storm Shield (Field Component)","tl":"11","lc":"0","cost":"15000","weight":"4 lb","qty":1,"tags":["Force Field","Energy Shield","Imperium","Adeptus Astartes"],"ref":null,"notes":"Shield 160 SP. Recharge: after 2 seconds without taking damage, regains 20 SP per second. Covers only attacks from the front and the shield-arm side (the arcs a shield covers); attacks from behind or the off side bypass it. The physical shield's Defense Bonus and melee stats are on the Storm Shield entry in Melee Weapons.","lore":"Astartes and Terminator storm shields pair a solid shield with a kinetic dispersion field, shown in Codex: Space Marines background and Black Library fiction shrugging off blows that would kill a Marine, including the occasional lascannon or plasma hit.","design":"Largest pool of any personal field, limited to its arc. Plasma (avg 84) is stopped outright; a lascannon (8dx8, avg 224) is stopped only when it rolls 160 or less (8d of 20 or less, about 6% of shots), matching \"occasionally\" in the fiction.","weapons":[],"feat":{"dr":[],"other":[]},"uses":160},{"name":"Displacer Field","tl":"12","lc":"1","cost":"35000","weight":"3 lb","qty":1,"tags":["Force Field","Imperium","Inquisition"],"ref":null,"notes":"Not a shield: it has no Shield Points. When the wearer would take damage that penetrates their worn armour, the GM may rule that the field instead teleports them 2d yards in a random direction (as the Teleport advantage, B90), taking no damage from that attack — treat this as usable a limited number of times before the field needs to recharge (recommended: once per few seconds of combat, i.e. about once per turn at most), and note the risk of teleporting into solid matter, off a ledge, or into a worse position is a real one the GM should apply per the Teleport rules.","lore":"Displacer fields are archeotech/xenos-derived teleportation wards, most associated in the fiction with Aeldari (Eldar) Farseers and Autarchs, but occasionally captured, reverse- engineered, or gifted relics carried by high-ranking Inquisitors or Rogue Traders in Black Library fiction and Rogue Trader-line background — rather than blocking a killing blow, the wearer simply isn't where the blow lands anymore.","design":"Deliberately not modelled as DR at all, since the lore mechanic is avoidance rather than resistance: this uses GURPS's existing Teleport advantage (B90) as its design basis rather than any force-field or armour catalogue entry, triggered defensively instead of at will. Marked as TL12^-equivalent xenotech in spirit (warp-adjacent teleportation, per framework.md's \"Warp-dependent\" category) even though it's issued as an Imperial-held relic rather than built by the Imperium; cost and LC reflect extreme rarity and the Inquisition's wariness of xenotech in mortal hands.","weapons":[],"feat":{"dr":[],"other":[]}}],"count":6},{"id":"imperium--armour--imperial-armour","title":"Imperial Armour","section":"Imperium/Armour","kind":"equipment","path":"Imperium/Armour/Imperial Armour.eqp","items":[{"name":"Flak Vest","tl":"10","lc":"3","cost":"200","weight":"8 lb","qty":1,"tags":["Body Armor","Imperium","Astra Militarum"],"ref":null,"notes":"Covers torso only. Worn over fatigues; does not interfere with Stealth the way rigid plate does.","lore":"The standard-issue ballistic vest of the Astra Militarum: overlapping plasteel or ceramic plates sewn into a fabric carrier. Depicted throughout Guard-focused Black Library fiction (e.g. the Gaunt's Ghosts and Ciaphas Cain series) as adequate against shrapnel and stubber fire but routinely shrugged past by las-weapons at range and always by bolt weapons.","design":"Torso DR set to the fixed Flak anchor (framework.md, Rescale: \"Flak (vest/jacket) | 12\"). No coverage elsewhere: a vest by definition stops at the shoulders and waist. Cost and weight are reasoned estimates (no anchor given) scaled below Mesh and well below Carapace.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":12,"locs":["torso","vitals","groin"]}]}],"other":[]}},{"name":"Flak Jacket","tl":"10","lc":"3","cost":"250","weight":"10 lb","qty":1,"tags":["Body Armor","Imperium","Astra Militarum"],"ref":null,"notes":"Sleeved version of the flak vest; partial arm coverage from the short armoured sleeves.","lore":"A sleeved variant of the vest, common where regiments expect close-quarters or urban combat and want some forearm protection against shrapnel and blades. Seen in Imperial Guard art and background across multiple Codex Astra Militarum editions.","design":"Torso DR unchanged from the Flak anchor (12). Arm coverage is new territory with no anchor, so it is set a few points below torso (9), following framework.md's guidance that \"limbs are usually a few DR below torso.\"","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":12,"locs":["torso","vitals","groin"]},{"dr":9,"locs":["arm"]}]}],"other":[]}},{"name":"Flak Coat, Death Korps Pattern","tl":"10","lc":"3","cost":"320","weight":"15 lb","qty":1,"tags":["Body Armor","Imperium","Astra Militarum"],"ref":null,"notes":"Ankle-length greatcoat with a quilted flak liner; often worn with a Death Korps gas-hood (see Respirator, Imperial Field Gear) rather than a separate helmet.","lore":"The Death Korps of Krieg's iconic heavy greatcoat is depicted in Forge World's Imperial Armour background and in Black Library's Krieg-focused fiction as a full-length, gas-sealed coat rather than a vest, reflecting the regiment's siege-warfare and toxic-battlefield doctrine.","design":"Same torso DR as the Flak anchor (12); the coat's greater bulk buys leg coverage that the vest and jacket lack, not extra torso DR (flak plate is flak plate regardless of cut). Leg and arm DR set at the same \"a few below torso\" offset (9) as the Flak Jacket for consistency across the family.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":12,"locs":["torso","vitals","groin"]},{"dr":9,"locs":["arm","leg"]}]}],"other":[]}},{"name":"Flak Armour, Full Suit (Cadian Pattern)","tl":"10","lc":"3","cost":"420","weight":"18 lb","qty":1,"tags":["Body Armor","Imperium","Astra Militarum"],"ref":null,"notes":"Vest, pauldrons and leggings worn as a matched set; pairs with the Flak Helmet below for full coverage. The Cadian pattern (moulded breastplate over a grey bodyglove) is the Munitorum's most widely issued flak set and the visual template most Guard regiments are equipped from.","lore":"Cadian Shock Troops are the Munitorum's default visual and doctrinal template for Guard infantry across Codex Astra Militarum background and Black Library fiction (Cadian-focused novels, the Ciaphas Cain books' 597th). Other regiments field their own cut of the same flak principle: Mordian dress-pattern jackets, Vostroyan quilted coats, Tallarn wraps, Catachan shirtless carapace-less troopers who often forgo the torso plate altogether for heat and mobility.","design":"Identical DR profile to the Flak Jacket/Coat family: the anchor fixes torso at 12 regardless of cut, so \"full suit\" buys completeness (a matched, better-fitted kit issued as one line item) rather than a higher number. Regimental variation is a lore/flavour note, not a stat change, per framework.md's instruction that tabletop/background colour orders things but doesn't set absolute values.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":12,"locs":["torso","vitals","groin"]},{"dr":9,"locs":["arm","leg"]}]}],"other":[]}},{"name":"Flak Helmet, Cadian Pattern","tl":"10","lc":"3","cost":"60","weight":"3 lb","qty":1,"tags":["Body Armor","Imperium","Astra Militarum"],"ref":null,"notes":"Open-faced; no eye or face protection. Some patterns (Mordian, Death Korps) add a neck flap worth a point or two of DR at the GM's discretion.","lore":"The classic Guard helmet: a domed plasteel/ceramite shell with a chinstrap and no visor, seen across nearly every piece of Astra Militarum art and background from the Uplifting Primer excerpts onward.","design":"Skull DR taken directly from the anchor (\"Flak helmet DR 10\", framework.md). Open face is a lore call (Guard helmets are consistently drawn without a visor) rather than a numeric derivation.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":10,"locs":["skull"]}]}],"other":[]}},{"name":"Mesh Armour","tl":"10","lc":"2","cost":"1600","weight":"6 lb","qty":1,"tags":["Body Armor","Imperium","Imperium"],"ref":null,"notes":"Flexible armour: treat blunt/crushing damage that fails to penetrate as normal per the flexible-armour rule (blunt trauma still applies even when DR stops the attack).","lore":"Fine metal-weave armour worn under fashionable clothing by hive nobility, Officio Assassinorum operatives, and Inquisitorial agents who need protection without looking armoured. Described across Dark Heresy/Rogue Trader-line background and hive-noble scenes in Black Library fiction (e.g. Ravenor, Eisenhorn) as concealable and comfortable but not rigid.","design":"Torso DR taken directly from the anchor (\"Mesh | 15, flexible\", framework.md). Flexible armour uses GURPS's standard flexible-armour interaction (Basic Set): it stops penetration but not blunt trauma, called out explicitly in `notes` since GCS doesn't encode that rule automatically. Limb/neck DR follow the \"a few below torso\" convention; hands, feet, and head are uncovered because this is a bodysuit worn under clothes, not a suit of plate.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":15,"locs":["torso","vitals","groin"]},{"dr":12,"locs":["arm","leg"]},{"dr":9,"locs":["neck"]}]}],"other":[]}},{"name":"Carapace Armour, Guard Pattern","tl":"10","lc":"2","cost":"1800","weight":"30 lb","qty":1,"tags":["Body Armor","Imperium","Astra Militarum"],"ref":null,"notes":"Rigid plate over a padded underlayer; imposes the usual GURPS bulky-armour DX/Stealth penalties for rigid heavy armour.","lore":"Moulded plasteel plate issued to elite Guard formations (storm troopers historically, tank crew, and veteran squads) and worn as a full body shell with integral or paired helmet. Only War and Dark Heresy background consistently place carapace a clear step above flak and a clear step below power armour, which the anchor table encodes directly.","design":"Torso DR taken from the fixed Carapace anchor (45, \"stops stub rounds; stops most lasgun hits; a hellgun or bolter goes through\"). Head/neck/limb DR scaled down from that anchor (×2.25 over the pre-Rescale figures) using the \"few DR below torso\" rule, with the helmet close to torso (rigid full-coverage helms are typically as thick as the torso plate) and hands left uncovered (gauntlets are a separate, optional piece not modelled here).","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":45,"locs":["torso","vitals","groin"]},{"dr":41,"locs":["skull"]},{"dr":34,"locs":["neck","arm","leg"]},{"dr":23,"locs":["face","foot"]},{"dr":18,"locs":["eye"]}]}],"other":[]}},{"name":"Carapace Armour, Tempestus Pattern","tl":"10","lc":"1","cost":"2600","weight":"32 lb","qty":1,"tags":["Body Armor","Imperium","Astra Militarum"],"ref":null,"notes":"Void-sealed; can be worn in vacuum or toxic atmosphere for short periods without a separate rebreather. Rigid heavy armour DX/Stealth penalties apply.","lore":"The maroon-and-grey carapace of the Tempestus Scions (and their forerunners, Storm Troopers) is depicted across Codex Astra Militarum, Only War and Black Library fiction (the Yarrick and Cain novels) as better-fitted and more complete than line-Guard carapace, closing the gaps at the hands, feet and joints that standard-issue kit leaves open, and rated for drop-pod and high-altitude insertion.","design":"Torso DR held at the same fixed Carapace anchor (45) — the anchor is a category value, not a unit-quality slider, so elite carapace doesn't simply get a bigger number. Instead it h a distinctive high, armoured collar guard and improved external cabling/power-routing meant to better survive void and jump-pack operations; current Codex Space Marines background places it as a slightly later, incremental pattern rather than a wholesale redesign.","design":"Torso DR set 5 above the Mark VII baseline (105), within the framework's ±10–15 spread. The pattern's signature feature — its reinforced collar — is modelled as a large jump in neck DR specifically (93, matching the arm DR rather than the usual lower neck figure, versus 63 on Mark VII) rather than a torso change, since that's exactly where the lore says the improvement lives. Eye lenses fixed at 50 as with every mark.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":105,"locs":["skull","torso","vitals","groin"]},{"dr":93,"locs":["neck","arm","leg"]},{"dr":80,"locs":["face","foot"]},{"dr":68,"locs":["hand"]},{"dr":50,"locs":["eye"]}]}],"other":["Lifting St +9","Striking St +5"]}},{"name":"Power Armour, Mark X (Tacticus Pattern)","tl":"11","lc":"0","cost":"50000","weight":"150 lb","qty":1,"tags":["Body Armor","Imperium","Adeptus Astartes"],"ref":null,"notes":"Requires the black carapace interface; Primaris Space Marines receive an enhanced black carapace as part of their creation, per current background, but the interface requirement and its penalties for an unaugmented wearer are unchanged.","lore":"Mark X \"Tacticus Armour\" is the standard-issue plate of the Primaris Space Marines introduced in current-edition Codex Space Marines background and the Dark Imperium/Guilliman-era Black Library novels: a modern synthesis of earlier design principles built for a taller, more heavily muscled Primaris physiology.","design":"Torso DR set 8 above the Mark VII baseline (108), reflecting current background's framing of Tacticus plate as an incremental, modern refinement rather than a radical departure — still within the framework's ±10–15 spread. Slightly higher servo ST than Mark VII reflects the larger Primaris frame the suit is built around, though this project keeps Primaris ST as a trait-file matter, not an armour one; the bonus here is the suit's own contribution only.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":108,"locs":["skull","torso","vitals","groin"]},{"dr":95,"locs":["arm","leg"]},{"dr":83,"locs":["face","foot"]},{"dr":70,"locs":["neck","hand"]},{"dr":50,"locs":["eye"]}]}],"other":["Lifting St +10","Striking St +5"]}},{"name":"Power Armour, Mark X (Phobos Pattern)","tl":"11","lc":"0","cost":"48000","weight":"110 lb","qty":1,"tags":["Body Armor","Imperium","Adeptus Astartes"],"ref":null,"notes":"Requires the black carapace interface. Lighter and quieter than baseline Tacticus plate; the reduced bulk lessens (but does not remove) the usual rigid heavy armour Stealth penalty, represented as the Stealth bonus above.","lore":"Mark X \"Phobos Armour\" equips Primaris infiltrators, reivers and incursors: current Codex Space Marines background describes it as deliberately stripped down for stealth insertion and reconnaissance, sacrificing plate thickness for silence, sensor equipment and low signature.","design":"Torso DR set at the bottom of the framework's spread (88), matching Mark VI's lightweight reasoning for the same trade-off (speed and stealth over raw protection). Eye-lens DR is nudged slightly below the shared 50 (to 45, the same 90% ratio used pre-Rescale) since the pattern's sensor visor is optimised for passive detection rather than ballistic resistance, a deliberate, called-out departure from the \"same component reused\" assumption used elsewhere, justified by Phobos gear's explicit stealth-first design brief. The Stealth skill bonus has no anchor and is a reasoned estimate for \"lighter and quieter than the baseline suit.\"","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":88,"locs":["skull","torso","vitals","groin"]},{"dr":70,"locs":["arm","leg"]},{"dr":63,"locs":["face"]},{"dr":60,"locs":["foot"]},{"dr":50,"locs":["neck"]},{"dr":45,"locs":["eye","hand"]}]}],"other":["Lifting St +6","Striking St +3","Stealth +2"]}},{"name":"Power Armour, Mark X (Gravis Pattern)","tl":"11","lc":"0","cost":"58000","weight":"220 lb","qty":1,"tags":["Body Armor","Imperium","Adeptus Astartes"],"ref":null,"notes":"Heavier and slower than standard plate; the wearer suffers an extra -1 Basic Move from bulk (already applied above) on top of the usual rigid heavy armour penalties. Requires the black carapace interface.","lore":"Mark X \"Gravis Armour\" is described in current Codex Space Marines background as heavy-assault plate for Primaris Aggressors, Eradicators, and similar close-support roles: thicker than any other power-armour pattern short of Terminator plate, explicitly a step between standard power armour and Tactical Dreadnought armour.","design":"Torso DR is its own fixed anchor (130, framework.md: \"Between power armour and Terminator plate\"), deliberately breaking the ±10–15 spread that governs every other power-armour Mark in this file, because the lore explicitly places Gravis between the Mark VII baseline (100) and the Tactical Dreadnought anchor (200): 130 sits roughly a third of the way up that gap, reflecting \"heavier than standard plate, well short of Terminator plate.\" Limb/head DR scale ×2.3636 from the pre-Rescale figures (130/55, the anchor's own move), landing eye-lens DR (59) sensibly between the Mark VII (50) and Terminator (75) values. Servo ST bonus is raised well above every other power-armour Mark for the same reason, and a small Basic Move penalty is added since the suit trades mobility for that extra plate.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":130,"locs":["skull","torso","vitals","groin"]},{"dr":113,"locs":["arm","leg"]},{"dr":106,"locs":["face"]},{"dr":99,"locs":["foot"]},{"dr":95,"locs":["neck"]},{"dr":83,"locs":["hand"]},{"dr":59,"locs":["eye"]}]}],"other":["Lifting St +14","Striking St +8","SM +0","Basic Move -1"]}},{"name":"Scout Armour","tl":"10","lc":"1","cost":"8000","weight":"40 lb","qty":1,"tags":["Body Armor","Imperium","Adeptus Astartes"],"ref":null,"notes":"Unpowered partial plate: chestpiece, backplate and a groin/thigh guard worn over fatigues, with no helmet, gauntlets or servo-motors. Does not require the black carapace interface, since most Chapters implant it later in a Scout's development (widely depicted; the exact order of implantation varies by Chapter).","lore":"Scout Marines — Astartes neophytes who have not yet completed the full gene-seed implantation and elevation to the battle-brotherhood — fight in simpler, partial plate over fatigues rather than full power armour, consistent with their depiction across Black Library's Scout-focused fiction (the Raven Guard and Space Wolves Scout novels among others) and current Codex Space Marines background.","design":"No power-armour anchor applies here since this is explicitly not full plate; torso DR scales from Carapace (the anchor's 45, ×2.25 over the pre-Rescale figure) plus the same small premium for Astartes-grade materials as before, at 50. Coverage is deliberately incomplete (no head, arm, hand or foot protection, partial leg only) to reflect the \"half-armoured, half-fatigues\" silhouette Scouts are consistently drawn with, and there is no servo-motor ST bonus because the suit carries no powered assistance.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":50,"locs":["torso","vitals","groin"]},{"dr":23,"locs":["leg"]}]}],"other":[]}},{"name":"Tactical Dreadnought Armour, Indomitus Pattern","tl":"11","lc":"0","cost":"120000","weight":"300 lb","qty":1,"tags":["Body Armor","Imperium","Adeptus Astartes"],"ref":null,"notes":"Effective SM +1 while worn (bigger target, but also greater reach and a larger surface for called shots); on top of the usual rigid heavy armour penalties, treat DX-based fine work as at an extra -2 due to the suit's thick, servo-assisted gauntlets. Life support allows unaided teleportation and short vacuum/void operations. Requires the black carapace interface.","lore":"\"Terminator\" plate — modern Indomitus-pattern Tactical Dreadnought Armour — is the heaviest power armour a Space Marine can wear and fight in, reserved for a Chapter's most veteran warriors and for the most desperate close-quarters actions (teleport assaults into enemy strongholds, boarding actions). Current Codex Space Marines background and countless Black Library depictions describe it as effectively a one-Astartes tank: it shrugs off small-arms and bolter fire and is brought down only by heavy weapons, power fists, or comparable threats.","design":"Torso DR taken directly from the fixed anchor (\"Tactical Dreadnought (Terminator) | 200, Ignores bolters. Plasma, lascannon, power fist and thunder hammer still kill.\", framework.md). Limb/head DR use the same proportional offsets as the rest of the Astartes power-armour family (×2.5 over the pre-Rescale figures, matching the anchor's own move), scaled up from this heavier base. SM +1 is taken directly from framework.md's \"a Terminator can be SM +1\" note; the Basic Move penalty and extra DX note represent the suit's bulk in mechanical terms the anchor doesn't itself specify.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":200,"locs":["skull","torso","vitals","groin"]},{"dr":175,"locs":["arm","leg"]},{"dr":150,"locs":["face","foot"]},{"dr":138,"locs":["neck"]},{"dr":125,"locs":["hand"]},{"dr":75,"locs":["eye"]}]}],"other":["Lifting St +20","Striking St +10","SM +1","Basic Move -1"]},"children":[{"name":"Auto-senses Suite (Terminator Pattern)","tl":null,"lc":null,"cost":"10000","weight":"6 lb","qty":1,"tags":[],"ref":null,"notes":"Enhanced sensor package feeding a wider helm display; functionally similar to the Mark VII suite but built into a much larger helm.","lore":"Terminator squads are consistently shown operating with excellent situational awareness despite the suit's bulk.","design":"Same bonus as the Mark VII Auto-senses Suite; no lore basis for a numeric difference, only a cosmetic one (bigger helm, same sensor doctrine).","weapons":[],"feat":{"dr":[],"other":["Observation +2"]}},{"name":"Vox-Link (Integrated)","tl":null,"lc":null,"cost":"3000","weight":"3 lb","qty":1,"tags":[],"ref":null,"notes":"Long-range, high-power vox suited to boarding actions and teleport strikes where a squad may be cut off from wider support.","lore":"Teleport assault doctrine (Codex background, Black Library boarding-action fiction) depends on reliable vox once a squad is deep inside enemy territory.","design":"Flavour/utility subsystem; no DR or attribute effect.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Storm Bolter Mag-Lock Mount","tl":null,"lc":null,"cost":"5000","weight":"10 lb","qty":1,"tags":[],"ref":null,"notes":"Combined weapon-mount and ammunition feed hardware for the suit's signature storm bolter/power fist loadout; the weapons themselves are not part of this file.","lore":"Terminators are almost always depicted armed with a storm bolter and power fist or matched pair of lightning claws, integrated into the suit's forearms.","design":"Flavour/mounting-hardware subsystem, priced separately from the weapons it carries.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Respirator & Full Void Seal","tl":null,"lc":null,"cost":"6000","weight":"10 lb","qty":1,"tags":[],"ref":null,"notes":"Complete atmospheric independence, including extended vacuum survival for teleport strikes directly into voidborne hulks and enemy ships.","lore":"A staple of boarding-action fiction across the setting.","design":"Heavier/more thorough version of the Mark VII equivalent, priced up accordingly; no separate anchor.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Recyclers (Extended)","tl":null,"lc":null,"cost":"4000","weight":"8 lb","qty":1,"tags":[],"ref":null,"notes":"Extended-endurance air and water reclamation for long teleport-strike or void-war deployments.","lore":"Consistent with Astartes endurance background.","design":"Flavour subsystem, no mechanical bonus.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Servo-Motor Actuators (Terminator Pattern)","tl":null,"lc":null,"cost":"62000","weight":"143 lb","qty":1,"tags":[],"ref":null,"notes":"The largest and most powerful servo package in this file; the bulk of the suit's weight and cost.","lore":"Terminators are depicted punching through bulkheads and grappling with things no unarmoured human could touch, consistent with a major step up in raw powered strength over standard plate.","design":"ST bonus set well above every standard power-armour Mark, reflecting both the heavier plate the motors need to move and the suit's role fighting things far tougher than the standard's baseline.","weapons":[],"feat":{"dr":[],"other":["Lifting St +20","Striking St +10"]}}]},{"name":"Tactical Dreadnought Armour, Cataphractii Pattern","tl":"11","lc":"0","cost":"130000","weight":"340 lb","qty":1,"tags":["Body Armor","Imperium","Adeptus Astartes"],"ref":null,"notes":"Effective SM +1 while worn, as Indomitus pattern, but heavier still: an extra -1 Basic Move (net -2 total) and treat DX-based fine work at an extra -2, as Indomitus. Requires the black carapace interface.","lore":"Cataphractii is the older, Horus Heresy-era Terminator pattern: even more heavily armoured and correspondingly slower than the later Indomitus pattern that superseded it, per Forge World's Horus Heresy background and Black Library's Horus Heresy series, where Cataphractii- armoured Terminators are repeatedly described as nigh-unstoppable but ponderous.","design":"Torso DR set above the Tactical Dreadnought anchor (220 vs. the anchor's 200, a 10% premium carried over from the pre-Rescale ratio of 88/80), justified by the lore's explicit framing of Cataphractii as heavier than modern Terminator plate — the anchor value is treated as the Indomitus/modern baseline, with this older pattern scaled up the same way individual power-armour Marks are scaled around the Mark VII baseline. Limb/head DR carry over the same per-location premium the pre-Rescale suit held over Indomitus (roughly 7–10%), except the eye lens, held equal to Indomitus (75) under the same shared-component assumption used across the whole Astartes power-armour family. An extra point of Basic Move penalty (net -2) represents the pattern's greater ponderousness relative to Indomitus plate.","weapons":[],"feat":{"dr":[{"vs":"","groups":[{"dr":220,"locs":["skull","torso","vitals","groin"]},{"dr":188,"locs":["arm","leg"]},{"dr":163,"locs":["face","foot"]},{"dr":151,"locs":["neck"]},{"dr":138,"locs":["hand"]},{"dr":75,"locs":["eye"]}]}],"other":["Lifting St +22","Striking St +11","SM +1","Basic Move -2"]}}],"count":23},{"id":"imperium--gear--imperial-field-gear","title":"Imperial Field Gear","section":"Imperium/Gear","kind":"equipment","path":"Imperium/Gear/Imperial Field Gear.eqp","items":[{"name":"Rebreather","tl":"8","lc":"3","cost":"60","weight":"1 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"A light filter mask covering nose and mouth; grants a bonus to HT rolls to resist inhaled toxins, smoke and dust, but is not a full atmospheric seal.","lore":"Basic breathing protection issued wherever the Munitorum expects toxic atmospheres, ash storms or gas warfare short of a full hazmat environment — seen throughout Astra Militarum background art and Black Library fiction set on hive or forge worlds.","design":"No armour/damage anchor applies; built as a simple GURPS filter mask (a HT-roll bonus vs. inhaled hazards) at a TL appropriate to \"stub tech\"-era mass production, since a rebreather is mechanically simple and produced across the Imperium regardless of a world's exact tech base.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Respirator","tl":"10","lc":"3","cost":"220","weight":"3 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"A full sealed mask with filter canisters, worn as a hood or integrated into a helmet; grants full protection from inhaled toxins and gas (not just a resistance bonus) while canisters last, and is the standard companion piece to the Death Korps Flak Coat.","lore":"Full-face gas-sealed respirators, most iconically the Death Korps of Krieg's ubiquitous gas-hoods, are depicted in Forge World's Imperial Armour background and Krieg-focused Black Library fiction as standard kit for regiments that expect chemical, biological or simply toxic battlefield conditions as a matter of course.","design":"Sits a clear step above the Rebreather: full immunity rather than a resistance bonus, priced and weighted higher to reflect the canister filtration system, at the same \"standard Imperial manufacture\" TL as flak and carapace per framework.md's TL table.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Photo-Visor / Photo-Contacts","tl":"10","lc":"3","cost":"150","weight":"1 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"Low-light image intensification, worn as a visor/goggle unit or, in the surgically-fitted \"photo-contacts\" variant, as lenses with no external bulk (same effect, -1 Holdout only for the visor version, none for contacts). Treat as granting Night Vision for game purposes while worn/active; does not help in absolute darkness.","lore":"Photo-visors (and their subtler photo-contact lens equivalent) are common-issue night-fighting gear across Astra Militarum and Inquisitorial-agent background, letting the wearer fight effectively in low light without a powered searchlight giving away their position.","design":"No anchor; modelled narratively as the GURPS Night Vision effect (Basic Set) for the GM to apply, since equipment-level features in this schema don't have a direct \"grant an advantage\" hook. Priced as inexpensive, widely issued optics rather than a rare relic.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Magnoculars","tl":"10","lc":"3","cost":"300","weight":"2 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"Long-range magnifying optics with image stabilisation and, on most patterns, a basic infrared overlay for spotting heat sources at range.","lore":"Standard-issue field optics for officers, snipers and scouts across Astra Militarum background, functionally binoculars with a targeting and threat-marking overlay fed to a user's other gear (vox, auspex) where available.","design":"No anchor; treated as GURPS binoculars (Basic Set) with an infrared spotting note added for setting flavour, at Imperial-standard TL10 manufacture.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Auspex","tl":"10","lc":"2","cost":"900","weight":"4 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"Handheld multi-sensor unit reading motion, heat, atmosphere and (on some patterns) psychic disturbance; the bonus above applies specifically to actively scanning an area, not passive Perception.","lore":"The auspex is the Imperium's ubiquitous field scanner, seen in nearly every piece of Inquisitorial, Astra Militarum and Adeptus Mechanicus fiction and background as the standard tool for detecting hidden enemies, structural hazards, or (in Inquisitorial hands) warp taint.","design":"No damage/armour anchor applies; modelled as a flat Search skill bonus (Basic Set's \"instruments help\" convention) rather than lifted from any Ultra-Tech scanner entry, priced as valuable, restricted military-grade kit (LC2) consistent with its usefulness and relative scarcity outside the Guard and Inquisition.","weapons":[],"feat":{"dr":[],"other":["Search +3"]}},{"name":"Vox-Caster","tl":"10","lc":"3","cost":"400","weight":"12 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"Backpack-mounted long-range radio, typically crewed by a dedicated vox-operator; range measured in miles rather than the short range of a micro-bead.","lore":"The vox-caster is the standard heavy communications set of Astra Militarum platoons and companies, a recurring detail in Guard-focused Black Library fiction (a vox-operator is a near-universal squad role) and Codex Astra Militarum background.","design":"No anchor; built as a straightforward GURPS long-range radio (Basic Set), weighted and priced to reflect a dedicated backpack set rather than a personal comm-bead.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Micro-bead","tl":"10","lc":"3","cost":"80","weight":"0.25 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"Short-range personal earpiece/throat-mic comm unit for squad-level chatter; does not reach vox-caster range.","lore":"The micro-bead is standard personal-issue comms for individual Guardsmen and many other Imperial servants, referenced constantly in Black Library fiction as the earpiece through which squad orders and chatter travel.","design":"Short-range GURPS radio (Basic Set) at minimal weight and cost, deliberately much cheaper and shorter-ranged than the Vox-Caster to reflect the personal-vs-squad-support distinction the lore consistently draws between the two.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Preysense Goggles","tl":"10","lc":"3","cost":"350","weight":"2 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"Combined thermal/motion overlay goggles, worn under a gas-hood visor; grants the same narrative Night Vision benefit as a photo-visor, plus motion-detection against concealed or camouflaged targets at the GM's discretion.","lore":"Preysense goggles are a signature piece of Death Korps of Krieg kit in Forge World's Imperial Armour background, combining thermal imaging with motion sensing to let Krieg troopers fight effectively through the toxic smoke and fog typical of their siege warfare.","design":"Built as an upgraded Photo-Visor (adds motion detection on top of low-light vision) rather than copied from any catalogue scanner; priced and weighted similarly to the Photo-Visor with a modest premium for the added sensor mode.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Grapnel Launcher","tl":"10","lc":"3","cost":"250","weight":"5 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"Compressed-gas or micro-charge grapnel and line, used for scaling walls, boarding actions and rapid descent; treat as a GURPS grapnel-gun/pneumatic harpoon under Climbing rules.","lore":"Grapnel lines and launchers appear throughout Imperial special-operations depictions — Scions and other elite Guard, Sisters of Battle strike teams and Inquisitorial agents alike are shown using them for boarding actions and rapid vertical assault.","design":"No anchor; modelled as a standard GURPS grapnel tool (Basic Set climbing gear) rather than any catalogue \"descent device,\" priced and weighted for a compact personal-issue unit.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Jump Pack (Astartes)","tl":"11","lc":"0","cost":"45000","weight":"60 lb","qty":1,"tags":["Gear","Imperium","Adeptus Astartes"],"ref":null,"notes":"Rocket-propelled flight/leap pack used for short powered jumps and controlled descents in combat (the tabletop \"Assault\"/deep-strike leap); treat mechanically as a short-burst Flight capability the GM adjudicates per scene rather than sustained flight, with a real risk of burn damage to anyone caught in the exhaust wash on landing. Sized and rigged for the Astartes frame and its power-armour interface; an unaugmented human cannot use one safely.","lore":"Jump packs equip Assault Marines and Vanguard veterans across Codex Space Marines background and Black Library fiction, covering the ground between a standard Astartes's leap and true flight in short, thunderous bursts, at the cost of a very conspicuous, fuel-limited profile.","design":"No damage/armour anchor applies; the jump pack is deliberately left as a narrative/maneuver capability (short powered leaps, GM-adjudicated) rather than an automated GCS Flight bonus, since GURPS models tactical jump-pack flight as a maneuver, not a passive trait, and this schema has no clean equipment-level hook for that. Weight and cost scaled to sit well above mundane Guard equipment, in line with other Astartes-exclusive wargear in this file.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Grav-chute","tl":"10","lc":"2","cost":"500","weight":"8 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"Anti-grav-assisted parachute harness used for high-altitude insertion; converts what would otherwise be a lethal fall into a controlled descent.","lore":"Grav-chutes equip Guard airborne/drop formations (Elysian and similar regiments in Codex and Black Library background) for high-altitude, low-opening insertions from Valkyrie and Aquila lander drops.","design":"No anchor; modelled as a GURPS parachute/descent device (Basic Set) with a \"grav-assisted\" label for setting flavour, priced and weighted as specialist rather than universal Guard kit, hence the more restrictive LC2.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Medi-kit","tl":"10","lc":"3","cost":"180","weight":"4 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"Standard combat first-aid kit; the bonus above applies to First Aid rolls made using it, per its contents (counter-septic, sealant foam, stimm shots, basic surgical tools).","lore":"Combat medi-kits are standard issue to Guard medicae and squad \"doc\" characters throughout Astra Militarum background and fiction, from field dressings to combat stimms.","design":"Direct translation of GURPS's standard first-aid kit bonus (Basic Set) rather than a Chirurgeon's full surgery kit, since this is field-carried personal gear rather than a hospital set.","weapons":[],"feat":{"dr":[],"other":["First Aid +2"]}},{"name":"Guardsman's Kit","tl":"10","lc":"4","cost":"60","weight":"20 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"The standard web-gear/pack loadout carried by an Astra Militarum trooper on campaign.","lore":"The contents below are drawn from how Guard kit is consistently depicted across Black Library fiction (the Gaunt's Ghosts and Ciaphas Cain series in particular) and Astra Militarum background: unglamorous, faith-adjacent, and built around long marches and worse rations.","design":"A container grouping the small items below into one carried loadout, rather than tracking each separately; total weight/cost is the sum of the parts.","weapons":[],"feat":{"dr":[],"other":[]},"children":[{"name":"Uplifting Primer","tl":null,"lc":null,"cost":"5","weight":"1 lb","qty":1,"tags":[],"ref":null,"notes":"The Munitorum-issue catechism and basic-literacy primer given to every Guardsman; also a minor icon of faith.","lore":"A recurring, near-universal detail of Guard life in Black Library fiction — often quoted, occasionally mocked by veterans, carried by nearly everyone regardless.","design":"Flavour item; no mechanical effect.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Lho-sticks (pack)","tl":null,"lc":null,"cost":"10","weight":"0.25 lb","qty":1,"tags":[],"ref":null,"notes":"A pack of rolled lho-leaf cigarettes, the Guard's ubiquitous off-duty vice.","lore":"Referenced constantly in Guard-focused fiction as shared currency, a nerve-settler before battle, and a habit officers alternately tolerate and ban.","design":"Flavour item; no mechanical effect.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Ration Packs (week's supply)","tl":null,"lc":null,"cost":"15","weight":"10 lb","qty":1,"tags":[],"ref":null,"notes":"Preserved, nutritionally complete but famously unpleasant field rations.","lore":"A running joke and occasional plot point across Guard fiction, where rations are barely tolerable and traded for anything better.","design":"Standard GURPS travel rations (Basic Set) by another name, priced accordingly.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Bedroll","tl":null,"lc":null,"cost":"15","weight":"4 lb","qty":1,"tags":[],"ref":null,"notes":"Standard-issue sleeping roll.","lore":"Unremarkable but universal Guard kit.","design":"Flavour item; no mechanical effect.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Mess Kit & Canteen","tl":null,"lc":null,"cost":"10","weight":"2 lb","qty":1,"tags":[],"ref":null,"notes":"Collapsible mess tin, utensils and a water canteen.","lore":"Standard Guard kit, occasionally a plot detail when water runs short.","design":"Flavour item; no mechanical effect.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Entrenching Tool","tl":null,"lc":null,"cost":"10","weight":"2.5 lb","qty":1,"tags":[],"ref":null,"notes":"Folding spade for digging in; usable in a pinch as an improvised weapon (treat as a small axe/shovel, sw-1 cut or thr cr).","lore":"A staple of trench-warfare-flavoured Guard depictions.","design":"Standard GURPS entrenching tool (Basic Set); the improvised-weapon note is a reasoned estimate, not a formal weapon anchor.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Aquila Icon","tl":null,"lc":null,"cost":"5","weight":"0.25 lb","qty":1,"tags":[],"ref":null,"notes":"A small icon of the Imperial faith worn or carried by most Guardsmen.","lore":"Nearly universal across Imperial citizenry, referenced throughout Black Library fiction regardless of a character's actual devoutness.","design":"Flavour item; no mechanical effect.","weapons":[],"feat":{"dr":[],"other":[]}}]},{"name":"Chrono","tl":"8","lc":"4","cost":"40","weight":"0.25 lb","qty":1,"tags":["Gear","Imperium","Imperium"],"ref":null,"notes":"A rugged wrist or pocket chronometer.","lore":"Unremarkable but near-universal personal timekeeping across the Imperium, mentioned in passing across Black Library fiction rather than dwelt on.","design":"No anchor; a plain GURPS wristwatch (Basic Set) equivalent, at a low TL since timekeeping is mechanically trivial regardless of setting.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Glow-globe / Stablight","tl":"8","lc":"4","cost":"25","weight":"1 lb","qty":1,"tags":["Gear","Imperium","Imperium"],"ref":null,"notes":"Handheld or hung electric light; the glow-globe is a softer, room-lighting sphere, the stablight a focused beam torch.","lore":"Standard Imperial lighting, mentioned throughout Black Library fiction wherever characters move through unlit corridors, hab-blocks or underhive tunnels.","design":"No anchor; a plain GURPS flashlight/lantern (Basic Set) under Imperial naming, at a low TL since it's mechanically simple household/field tech.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Cameleoline Cloak","tl":"8","lc":"2","cost":"600","weight":"3 lb","qty":1,"tags":["Gear","Imperium","Astra Militarum"],"ref":null,"notes":"A light-bending, pattern-disrupting cloak fabric; the bonuses above apply while the cloak is worn and the wearer is stationary or moving slowly enough to keep it effective (GM's call on faster movement).","lore":"Cameleoline cloaks are the signature camouflage gear of Imperial snipers and scout troops (Catachan and Tanith patterns both appear in Black Library fiction, most notably the Tanith First-and-Only's scouts in the Gaunt's Ghosts series) — a fabric that bends light and breaks up a wearer's outline rather than simple colour-matched cloth.","design":"No anchor; modelled as flat Stealth/Camouflage skill bonuses (a common GURPS convention for camouflage gear in Basic Set/Ultra-Tech-style items, applied here as an independently-reasoned value rather than copied from a specific catalogue entry) with no DR, since the cloak's whole function is concealment rather than protection. Restricted to LC2 to reflect its status as specialist rather than universal-issue kit.","weapons":[],"feat":{"dr":[],"other":["Stealth +2","Camouflage +3"]}}],"count":16},{"id":"imperium--gear--psychic-gear","title":"Psychic Gear","section":"Imperium/Gear","kind":"equipment","path":"Imperium/Gear/Psychic Gear.eqp","items":[{"name":"Psychic Hood","tl":"10^","lc":"1","cost":"4000","weight":"3 lb","qty":1,"tags":["Imperium","Psyker"],"ref":null,"lore":"A warded circlet built around a tiny, heavily sanctioned psychic node (sometimes a bound, lobotomised psyker's brain-stem), worn by Astra Militarum officers and Inquisitorial staff to blunt enemy sorcery directed at their command. Consistent with Dark Heresy/Rogue Trader's psychic hood/psy-focus items and Codex background on Imperial command-squad wargear.","design":"Modelled as a flat +2 conditional bonus (Basic's conditional_modifier feature) to resist Warp Sorcery-tagged mental attacks — comparable in size to Basic's own Power Defense-type items, cheap enough to matter but never a substitute for a trained anti-psyker.","weapons":[],"feat":{"dr":[],"other":["+2 to resist Warp Sorcery-tagged Affliction, Mind Control, Mind Probe, and Fear effects directed at the wearer or their unit"]}},{"name":"Force Sword","tl":"10^","lc":"1","cost":"8000","weight":"3 lb","qty":1,"tags":["Melee Weapon","Imperium","Psyker"],"ref":null,"lore":"A disruption-field blade further warded and psychically attuned so a trained mind can channel force directly through it — standard wargear for Inquisitors, Sisters of the Ordo Hereticus with psychic gifts, and any Astartes Librarian who favours a blade over a staff. Depicted throughout Black Library (Eisenhorn's own force sword; Grey Knights' force weapons) and Dark Heresy/Rogue Trader's force-weapon rules.","design":"Built directly on the framework's rescaled power-field rule: field off is the mundane fine blade (sw+1 cut), field on adds +3d and armour divisor (10) per the updated rule (\"Bladed/mace power weapons add +3d over the mundane weapon\"), landing exactly on the rescaled power sword anchor (sw+3d(10) cut) — a force sword is mechanically a power sword that a trained mind can also channel psychic force through. The Force Strike line shows that channelling: same dice as field-on minus the armour divisor, but its ignores-DR component only applies against Warp-touched targets, so it never trivialises ordinary armour. Its damage scales narratively with the wielder's Psyker Talent level (+1d per Psyker Talent level on top of the base 3d, GM's call above level 2) rather than as a fixed number, since the build tool's damage syntax cannot encode a variable.","weapons":[{"melee":true,"usage":"Field off","damage":"sw+1 cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"10"},{"melee":true,"usage":"Field on","damage":"sw+3d(10) cut","skill":"Broadsword","notes":"","reach":"1","parry":"0","strength":"10"},{"melee":true,"usage":"Force Strike (charged, vs. Warp-touched)","damage":"sw+3d cut (ignores DR)","skill":"Broadsword","notes":"Add +1d per level of Psyker Talent to this line (GCS can't scale it automatically; edit the damage on the sheet). Usable only by a psyker (Psyker Talent 1+), field on. Requires a Perils of the Warp check (see \"Psykers and the Warp\") as it is channelled through the wielder's own gift; the ignores-DR component only applies against daemons, Chaos Spawn, and other Warp-touched creatures, representing a strike at the target's soul rather than its body — an ordinary flak-armoured guardsman still only takes the field-on line's armour divisor (10).\n","reach":"1","parry":"0","strength":"10"}],"feat":{"dr":[],"other":[]}},{"name":"Force Staff","tl":"10^","lc":"1","cost":"7000","weight":"4 lb","qty":1,"tags":["Melee Weapon","Imperium","Psyker"],"ref":null,"lore":"Many psykers prefer a staff to a blade: easier to carry openly as a badge of office, and a familiar focus for channelling telekinetic and biomantic workings. Common across Dark Heresy/Rogue Trader's force-weapon options and depicted for Inquisitorial and Adeptus Astra Telepathica psykers throughout Black Library.","design":"Same rescaled power-field math as the Force Sword (field on adds +3d and armour divisor (10) over the field-off mundane baseline), applied to a plain hardwood-and-metal quarterstaff (sw+1 cr) instead of an edged blade — a crushing rather than cutting power weapon, with the same charged Force Strike option and scaling note.","weapons":[{"melee":true,"usage":"Field off","damage":"sw+1 cr","skill":"Staff","notes":"","reach":"1,2","parry":"0","strength":"9"},{"melee":true,"usage":"Field on","damage":"sw+3d(10) cr","skill":"Staff","notes":"","reach":"1,2","parry":"0","strength":"9"},{"melee":true,"usage":"Force Strike (charged, vs. Warp-touched)","damage":"sw+3d cr (ignores DR)","skill":"Staff","notes":"As Force Sword's Force Strike; +1d per level of Psyker Talent, requires field on and a Perils of the Warp check.","reach":"1,2","parry":"0","strength":"9"}],"feat":{"dr":[],"other":[]}},{"name":"Force Axe","tl":"10^","lc":"1","cost":"8000","weight":"5 lb","qty":1,"tags":["Melee Weapon","Imperium","Psyker"],"ref":null,"lore":"A heavier disruption weapon, favoured by psykers who fight as heavily as they cast — seen among Black Templars chaplaincy-adjacent Librarians and some Ordo Malleus interrogators in Black Library material, and offered as a standard force-weapon option in Dark Heresy/Rogue Trader.","design":"Scaled up from the Force Sword the same way the framework scales chainaxes from chainswords: heavier mundane baseline (sw+2 cut), the same rescaled +3d/armour divisor (10) power-field math (\"+3d over the mundane weapon\"), and a parry penalty for the unbalanced swing.","weapons":[{"melee":true,"usage":"Field off","damage":"sw+2 cut","skill":"Axe/Mace","notes":"","reach":"1","parry":"-1","strength":"11"},{"melee":true,"usage":"Field on","damage":"sw+3d+2(10) cut","skill":"Axe/Mace","notes":"","reach":"1","parry":"-1","strength":"11"},{"melee":true,"usage":"Force Strike (charged, vs. Warp-touched)","damage":"sw+3d+2 cut (ignores DR)","skill":"Axe/Mace","notes":"As Force Sword's Force Strike; +1d per level of Psyker Talent, requires field on and a Perils of the Warp check.","reach":"1","parry":"-1","strength":"11"}],"feat":{"dr":[],"other":[]}},{"name":"Nemesis Force Halberd","tl":"10^","lc":"0","cost":"20000","weight":"8 lb","qty":1,"tags":["Melee Weapon","Imperium","Psyker","Grey Knights"],"ref":null,"lore":"The signature weapon of the Grey Knights: a psychically-attuned halberd that is, to a daemon, as lethal as a bolt round is to a man — Codex: Grey Knights and its Black Library tie-ins (Ben Counter's Grey Knights novels) are consistent on this. Nemesis weapons are built and sanctified specifically to hurt things from the warp.","design":"Same mundane baseline and rescaled power-field math (+3d, armour divisor (10)) as the Force Axe, reach 1-2 like other polearms, priced and LC0'd as unique Chapter-restricted wargear per the framework's LC table (Astartes/Inquisition-only warp-touched gear). Its Force Strike line waives the normal Perils check as a narrative nod to how routinely and safely Grey Knights use it against their signature enemy, unlike a general-purpose force weapon.","weapons":[{"melee":true,"usage":"Field off","damage":"sw+2 cut","skill":"Polearm","notes":"","reach":"1,2","parry":"0","strength":"12"},{"melee":true,"usage":"Field on","damage":"sw+3d+2(10) cut","skill":"Polearm","notes":"","reach":"1,2","parry":"0","strength":"12"},{"melee":true,"usage":"Force Strike (charged, vs. daemons)","damage":"sw+3d+2 cut (ignores DR)","skill":"Polearm","notes":"Every Nemesis weapon is permanently attuned for anti-daemon work; Grey Knights need no Perils of the Warp check to use this line against a Warp-touched target, field on (their Sanctic training and armour wards absorb the backlash), though the GM may still call for one against anything else it is used on.\n","reach":"1,2","parry":"0","strength":"12"}],"feat":{"dr":[],"other":[]}},{"name":"Null Rod","tl":"10^","lc":"0","cost":"6000","weight":"4 lb","qty":1,"tags":["Melee Weapon","Imperium","Psyker"],"ref":null,"notes":"A carried or worn Null Rod projects a small, personal anti-psychic field: any Warp Sorcery-tagged ability used, or whose effect would pass, within a yard of the rod must reroll a success as a failure (treat as an automatic Perils of the Warp trigger at -5 to the roll); a psyker touched by the rod itself has their active Warp Sorcery-tagged abilities immediately shut off for as long as contact is maintained.","lore":"A grimly plain iron-bound rod, warded and often set with a captive soul-shard, that is anathema to psykers — Inquisitorial and Ecclesiarchy arming-chests keep them for exactly this reason. Widely and consistently depicted across Black Library (interrogators' kit, witch-hunter equipment) and Dark Heresy/Only War's Null Rod rules.","design":"Modelled as a rules-text effect (the build tool has no \"disable an enemy trait\" feature) rather than a coded bonus, since what it does is binary and narrative: it does not merely penalise a psychic act, it threatens to unmake it. Its own melee stats are a plain, slightly underweight blunt weapon — it is carried as a ward and a badge of office, not a proper weapon, hence sw-1 rather than a full sw+0 mace.","weapons":[{"melee":true,"usage":"Swung","damage":"sw-1 cr","skill":"Axe/Mace","notes":"","reach":"1","parry":"0","strength":"9"}],"feat":{"dr":[],"other":[]}},{"name":"Hexagrammic Ward Charm","tl":"10^","lc":"1","cost":"500","weight":"0.5 lb","qty":1,"tags":["Imperium","Psyker"],"ref":null,"lore":"A small charm inscribed with hexagrammic wards, worn by Imperial soldiers and priests operating anywhere a warp-taint might be encountered — a cheaper, weaker cousin of the wards painted across whole ship-hulls and chapels to keep daemons at bay. Standard Imperial Creed practice, referenced throughout Black Library and codified in Dark Heresy/Only War's cheap ward-item rules.","design":"A minor +1 conditional bonus, priced and weighted as a trinket rather than real equipment — protection at the margin, not a substitute for a Null Rod or a trained anti-psyker.","weapons":[],"feat":{"dr":[],"other":["+1 to resist possession and Warp-based Affliction directed at the wearer"]}},{"name":"Psyocculum (Psy-Track)","tl":"10^","lc":"2","cost":"3000","weight":"4 lb","qty":1,"tags":["Imperium","Psyker"],"ref":null,"notes":"A worn ocular rig that lets a non-psyker see psychic residue and warp-taint the naked eye cannot: roll vs Optics/Electronics Operation or a relevant Hidden Lore specialisation to spot a hidden psyker, daemon, or recently-used Warp Sorcery-tagged ability's afterglow within 20 yards. Functions as a wearable, skill-based substitute for the Witch- sight advantage, usable by anyone trained on it, not only psykers.","lore":"Inquisitorial witch-hunters and Officio Assassinorum operatives use devices exactly like this to track psykers who have no wish to be found — the \"psyocculum\" name and function are best known from Rogue Trader/Dark Heresy-line Inquisitorial wargear lists; Black Library depictions of witch-hunting technology (Eisenhorn's own gadgetry) are consistent with the concept without naming the device.","design":"Left as a skill-roll rules note rather than a coded feature, since it grants a new use of an existing skill (a sensory check) rather than a numeric bonus — the same approach the build tool's `notes` field is meant for.","weapons":[],"feat":{"dr":[],"other":[]}}],"count":8},{"id":"imperium--skills--imperial-skills","title":"Imperial Skills","section":"Imperium/Skills","kind":"skills","path":"Imperium/Skills/Imperial Skills.skl","items":[{"name":"Theology (Imperial Creed)","diff":"IQ/H","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium"],"ref":"B226","lore":"The Ecclesiarchy's dogma, liturgy, saint-cults and the countless local rites of Imperial Cult worship, from a hab-block shrine's litanies to a Cardinal-Astra's sermons. Depicted throughout Black Library fiction (Ciaphas Cain, Gaunt's Ghosts, the Eisenhorn/Ravenor books) as the working theology every Imperial citizen absorbs in some form.","design":"Basic Set Theology (B226), specialised as it already allows.","feat":{"dr":[],"other":[]}},{"name":"Theology (Cult Mechanicus)","diff":"IQ/H","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium","Adeptus Mechanicus"],"ref":"B226","lore":"The Cult of the Machine God: the Motive Force catechisms, the binary liturgies, the theology that says a machine's spirit must be placated, not merely fixed. Framework note: this is the Mechanicus's *faith*, distinct from the technical skill of maintaining machines (Engineer / Mechanic / Armoury), matching how Black Library depicts Tech-Priests as both engineers and priests of a religion.","design":"Basic Set Theology (B226) as a separate specialisation from Theology (Imperial Creed); the two cults' dogmas do not cross-default.","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Daemons)","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium"],"ref":"B199","lore":"What the Inquisition and the more paranoid chaplains know of daemonic nature, names, and countermeasures: pict-evidence, interrogation transcripts and forbidden grimoires rather than fieldcraft. Widely depicted as dangerous knowledge in the Eisenhorn/Ravenor and Gaunt's Ghosts novels; Dark Heresy/Only War use an equivalent Forbidden Lore (Daemonology) skill for calibration.","design":"Basic Set Hidden Lore (B199), specialisation per framework.md.","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Xenos)","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium"],"ref":"B199","lore":"Cross-referenced xenology from an Inquisitorial or Departmento Munitorum angle: what a given alien species is, not how to fight it (that's Expert Skill (Xenology) or Tactics). Covers everything from ork biology to eldar craftworld politics as known to Imperial intelligence, which is often wrong or incomplete by design.","design":"Basic Set Hidden Lore (B199).","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Heresy)","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium"],"ref":"B199","lore":"Recognising the signs of Chaos corruption, forbidden cults, and heretical doctrine before it is too late — or, for an Inquisitor, knowing enough heresy to hunt it. Central to Eisenhorn and the Ravenor trilogy.","design":"Basic Set Hidden Lore (B199).","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (The Warp)","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium"],"ref":"B199","lore":"Scholarly (not psychic) knowledge of the Immaterium: what the Astronomican is, why Navigators need a Geller field, what a warp storm does to a fleet. This is book-learning available to non-psykers; actual perception of the warp is Psyniscience or a psychic power.","design":"Basic Set Hidden Lore (B199).","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Inquisition)","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium","Inquisition"],"ref":"B199","lore":"What is known, or safely rumoured, about the Inquisition itself: its ordos, its methods, which rosettes mean what. Most citizens who have this at all have it because they survived an interrogation.","design":"Basic Set Hidden Lore (B199).","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Adeptus Astartes)","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium"],"ref":"B199","lore":"Chapter markings, organisation, and the fragments of Chapter lore that leak to outsiders (a Guardsman recognising a Chapter's colours, an Inquisitor's grasp of Chapter politics). Full gene-seed and Chapter cult secrets go well beyond this skill.","design":"Basic Set Hidden Lore (B199).","feat":{"dr":[],"other":[]}},{"name":"Hidden Lore (Archeotech)","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium","Adeptus Mechanicus"],"ref":"B199","lore":"Recognising and cataloguing STC fragments and Dark Age relics without necessarily being able to use or repair them (that's Engineer/TL12^). A staple of rogue trader and explorator fiction, and of Only War's Forbidden Lore (Archeotech) for calibration.","design":"Basic Set Hidden Lore (B199).","feat":{"dr":[],"other":[]}},{"name":"Area Knowledge (Segmentum Obscurus)","diff":"IQ/E","points":1,"tl":null,"defaults":["IQ-4"],"tags":["Mental","Knowledge","Imperium"],"ref":"B176","lore":"One of the Imperium's five segmenta; used generically for any of them (Solar, Obscurus, Pacificus, Tempestus, Ultima) or for a specific sub-sector, hive, or home world when that is more relevant to a character's background.","design":"Basic Set Area Knowledge (B176); pick the specialisation the character actually knows.","feat":{"dr":[],"other":[]}},{"name":"Area Knowledge (Segmentum Solar)","diff":"IQ/E","points":1,"tl":null,"defaults":["IQ-4"],"tags":["Mental","Knowledge","Imperium"],"ref":"B176","lore":"The Throneworld's own segmentum; Terra, Mars, and the Imperium's administrative core.","design":"Basic Set Area Knowledge (B176).","feat":{"dr":[],"other":[]}},{"name":"Current Affairs (Imperium)","diff":"IQ/E","points":1,"tl":null,"defaults":["IQ-4"],"tags":["Mental","Knowledge","Imperium"],"ref":"B186","lore":"What passes for Imperium-wide news: Munitorum bulletins, Ecclesiarchy pronouncements, and whatever rumours of war and heresy filter down through a thousand relay stations, usually months stale and already propaganda by the time they arrive.","design":"Basic Set Current Affairs (B186).","feat":{"dr":[],"other":[]}},{"name":"Law (Imperial)","diff":"IQ/H","points":1,"tl":null,"defaults":["IQ-6"],"tags":["Mental","Knowledge","Imperium"],"ref":"B204","lore":"The Lex Imperialis and its planetary variations as enforced by the Adeptus Arbites: due process is whatever an Arbitrator, Inquisitor, or Commissar with the authority to act says it is.","design":"Basic Set Law (B204).","feat":{"dr":[],"other":[]}},{"name":"Navigation (Warp)","diff":"IQ/A","points":1,"tl":null,"defaults":[],"tags":["Mental","Knowledge","Imperium","Restricted"],"ref":"B211","lore":"Charting a course through the Immaterium by the light of the Astronomican, correcting for warp storms and translation drift. In practice this is inseparable from the Navigator Houses' mutant third eye; without it the skill cannot be used at all (see framework.md, \"Skills\"). A ship's Navigator plots by this skill; the Warp-jump itself is the Navigator's psychic gift, not the roll.","design":"Basic Set Navigation (Hyperspace) (B211) renamed per framework.md. No default given: unlike terrestrial navigation, nothing else sensibly defaults into it, and GMs should restrict purchase to characters with the Navigator racial trait (handled elsewhere).","feat":{"dr":[],"other":[]}},{"name":"Savoir-Faire (Military)","diff":"IQ/E","points":1,"tl":null,"defaults":["IQ-4"],"tags":["Mental","Imperium"],"ref":"B218","lore":"Knowing how to behave, address superiors, and not get shot for insubordination in an Imperial military hierarchy.","design":"Basic Set Savoir-Faire (B218).","feat":{"dr":[],"other":[]}},{"name":"Savoir-Faire (High Society)","diff":"IQ/E","points":1,"tl":null,"defaults":["IQ-4"],"tags":["Mental","Imperium"],"ref":"B218","lore":"Hive noble and rogue trader dynasty etiquette; who outranks whom, and which insults are duel-worthy.","design":"Basic Set Savoir-Faire (B218).","feat":{"dr":[],"other":[]}},{"name":"Savoir-Faire (Ecclesiarchy)","diff":"IQ/E","points":1,"tl":null,"defaults":["IQ-4"],"tags":["Mental","Imperium"],"ref":null,"lore":"Ecclesiarchy protocol: forms of address for Cardinals, Confessors and Canonesses, precedence between Orders of the Adepta Sororitas, and the rites of a shrine world's court. Not attested in fiction as a named \"skill\", but the Ecclesiarchy is repeatedly shown (Sisters of Battle novels, Black Library's Sabbat Worlds material) to have as rigid a court culture as any noble house or general staff.","design":"New specialisation of Basic Set Savoir-Faire (B218), by direct analogy with the existing Military and High Society specialisations — same skill, same difficulty, applied to a third hierarchy the game needs and the catalogue doesn't name.","feat":{"dr":[],"other":[]}},{"name":"Expert Skill (Xenology)","diff":"IQ/H","points":1,"tl":null,"defaults":[],"tags":["Mental","Knowledge","Imperium"],"ref":"B193","lore":"The rigorous, empirical study of xenos biology, technology and society — Explorator and Ordo Xenos work, not folk rumour (that's Hidden Lore (Xenos)). No default, as Basic Set's Expert Skill never has one: this is specialist training only.","design":"Basic Set Expert Skill (B193).","feat":{"dr":[],"other":[]}},{"name":"Heraldry (Adeptus Astartes)","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-5","Savoir-Faire (Military)-3"],"tags":["Mental","Imperium"],"ref":"B199","lore":"Chapter badges, squad markings, and honours worn on power armour; a skill Guard liaison officers and Inquisitors alike need to not give offence.","design":"Basic Set Heraldry (B199); Savoir-Faire (Military) default in place of the Basic Set's High Society default, matching how this heraldry is actually learned.","feat":{"dr":[],"other":[]}},{"name":"Heraldry (Regimental)","diff":"IQ/A","points":1,"tl":null,"defaults":["IQ-5","Savoir-Faire (Military)-3"],"tags":["Mental","Imperium","Astra Militarum"],"ref":"B199","lore":"Astra Militarum regimental colours, honorifics and campaign battle-honours — a Cadian's shoulder flash, a Krieg death mask, a Catachan's tattoos, all legible to someone who knows what they're looking at.","design":"Basic Set Heraldry (B199).","feat":{"dr":[],"other":[]}},{"name":"Psyniscience","diff":"Per/H","points":1,"tl":null,"defaults":[],"tags":["Mental","Imperium","Psionic"],"ref":null,"lore":"The trained (or instinctive) sense of \"something wrong\" in a presence, place, or object touched by the warp — a chill in a corridor, a servitor's dead eyes going wrong. Named for the Dark Heresy/Only War skill of the same purpose (Psyniscience), used here for calibra
