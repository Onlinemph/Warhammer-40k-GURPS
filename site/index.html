rice rate.","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Force Dome","points":6,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A dome of solid force wide enough to cover the caster's whole fireteam.","design":"Damage Resistance (5/level) with Area Effect (+50%, B102, 2-yard radius) plus Warp Sorcery/Perils, net +20%. Full modified cost: 5 x 1.2 = 6 points/level (the costlier child, so it sets the container's cap requirement); needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]},{"name":"Crush","points":11,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"An invisible telekinetic grip that closes on a target's throat or chest, ignoring armour and impossible to dodge.","design":"Innate Attack (Crushing, 5/die) with Malediction (+100%, B36) and Armor Divisor (2) (+50%, B103), plus Warp Sorcery/Perils, net +120%. Full modified cost: 5 x 2.2 = 11 points/level; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Malediction 1","cost":"+100%","notes":""},{"name":"Armor Divisor (2)","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Gate of Infinity","points":40,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Tears a hole between two points in real space and steps through — the rarest and most feared telekinetic feat, since a botched Gate can open into the warp itself instead.","design":"Built on Basic's own Warp advantage (B99, instant travel to any place you have seen/visualized, flat 100), with Preparation Required (-20%, B113, a few seconds' concentration) and the Severe Perils tier, reflecting the setting's specific fear of a failed Gate opening into the immaterium. Net -60%. Full modified cost: 100 x 0.4 = 40 points — the single most expensive non-Great-Power ability in this file; needs Warp Empowerment level 3 (cap 40), the minimum at which \"Delta and up\" can cast the full non-Great-Power roster, exactly on the cap with no headroom to spare.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Preparation Required","cost":"-20%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp (Severe)","cost":"-20%","notes":""}]}]},{"name":"Telepathy","points":119,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Reading, sending, and overwhelming minds. Calibrated against Dark Heresy's Telepathy list (Mind Probe, Dominate, Psychic Scream, Terrify, Invisibility-adjacent Mental Interrogation) and the astropathic relay seen throughout Black Library whenever a ship needs to send word home.","design":"Talent-linked group; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Mind Probe/Dominate","points":38,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The same intrusion into another mind, bought at two intensities: a forced reading of buried memory, or outright control of the body.","design":"Alternative_abilities container; full price for the costlier Dominate plus a fifth of Mind Probe.","weapons":[],"feat":{"dr":[],"other":[]},"container":"alternative_abilities","children":[{"name":"Mind Probe","points":14,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Tears buried memories and secrets from an unwilling subject.","design":"Mind Probe, Basic's core advantage, flat 20, with Warp Sorcery/ Perils, net -30%. Full modified cost: 20 x 0.7 = 14 points (discounted to a fifth as the cheaper alternative ability); needs Warp Empowerment level 1 (cap 20) at its full-price rate.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Dominate","points":35,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Seizes outright control of a target's body and actions.","design":"Mind Control, Basic's core advantage, flat 50, with Warp Sorcery/Perils, net -30%. Full modified cost: 50 x 0.7 = 35 points (the costlier child, so it sets the container's cap requirement); needs Warp Empowerment level 3 (cap 40).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]},{"name":"Psychic Scream","points":12,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A silent, mind-shattering shout that stuns everyone nearby.","design":"Affliction (10/level, delivering the default Stun effect) with Area Effect (+50%) plus Warp Sorcery/Perils, net +20%. Full modified cost: 10 x 1.2 = 12 points/level; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Terrify","points":28,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Projects raw, focused fear straight into a target's mind.","design":"Terror, Basic's core advantage (flat 30 + 10/level for extra range), with Warp Sorcery/Perils, net -30%. Full modified cost: (30+10) x 0.7 = 28 points at its default first extra-range level; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Mental Interrogation","points":21,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Reads surface thoughts, willing or not — an Inquisitorial interrogator's favourite tool.","design":"Mind Reading, Basic's core advantage, flat 30, with Warp Sorcery/ Perils, net -30%. Full modified cost: 30 x 0.7 = 21 points; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Astrotelepathy","points":20,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"The astropath's signature act: sending and receiving thought across interstellar distances, relayed choir to choir and, ultimately, through the Astronomican itself. Astropaths who fail badly during a transmission are a recurring Black Library beat (burned out, driven mad, or lost with the ship's Geller field).","design":"Base 20 points for a mental send-and-receive package is this project's own baseline (Basic's exact per-range-step Telecommunication costs are not confidently recalled, so this figure is fixed for internal consistency rather than cited to a page); Increased Range at the highest tabled step (+60%) for interstellar reach, Preparation Required (-20%, a ritual trance), and the Severe Perils tier for the real danger of transmitting through the warp. Net +60-20-20-20=0%. Full modified cost: 20 x 1.0 = 20 points; needs only Warp Empowerment level 1 (cap 20) — cheap in raw points despite the interstellar range, since Increased Range's +60% roughly cancels the Preparation Required/Warp Sorcery/Severe Perils discounts; the real cost of Astrotelepathy is the Severe Perils roll, not the point price.","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Increased Range x100","cost":"+60%","notes":""},{"name":"Preparation Required","cost":"-20%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp (Severe)","cost":"-20%","notes":""}]}]},{"name":"Sanctic Daemonology","points":21,"tags":["Advantage","Mental","Psyker","Imperium","Adeptus Astartes","Grey Knights"],"ref":null,"lore":"The Grey Knights' own discipline: powers built and sanctified specifically to fight the warp's own creatures, drawn from Codex: Grey Knights background and its Black Library tie-ins (Ben Counter's Grey Knights novels).","design":"Talent-linked group, Grey Knights only; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Banishment","points":4,"tags":["Advantage","Mental","Psyker","Imperium","Grey Knights"],"ref":null,"lore":"A bolt of purifying anti-warp force that tears a daemon's physical anchor apart.","design":"Innate Attack (Impaling, 8/die, B61) restricted to warp-touched targets (Accessibility -10%, kept small since daemons are this unit's routine enemy, not a rare case) plus Warp Sorcery and the Severe Perils tier, net -50%. Full modified cost: 8 x 0.5 = 4 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Accessibility (only vs. Warp-touched/daemonic creatures)","cost":"-10%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp (Severe)","cost":"-20%","notes":""}]},{"name":"Hammerhand","points":4,"tags":["Advantage","Physical","Psyker","Imperium","Grey Knights"],"ref":null,"lore":"Channels psychic force into a Grey Knight's blow, letting even blunt strikes crack a daemon's hide.","design":"Striking ST (5/level, B) with Warp Sorcery/Perils, net -30%. Full modified cost: 5 x 0.7 = ~4 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Sanctuary","points":13,"tags":["Advantage","Mental","Psyker","Imperium","Grey Knights"],"ref":null,"lore":"Wards a Grey Knight kill-team against fear, corruption, and possession during a purge.","design":"Affliction (10, delivering a +15-point protective advantage to willing allies rather than a disadvantage to a foe — Basic B35 allows either) with Area Effect (+50%), Warp Sorcery, and Severe Perils, net +25%. Full modified cost: 10 x 1.25 = ~13 points; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Advantage Delivered (+2 vs. Fright Checks","cost":"+15%","notes":""},{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp (Severe)","cost":"-20%","notes":""}]}]},{"name":"Librarius","points":40,"tags":["Advantage","Mental","Psyker","Imperium","Adeptus Astartes"],"ref":null,"lore":"The general Chapter Librarius discipline used across most non-Grey- Knights Space Marine chapters, drawn from Codex: Space Marines background and its recurring Black Library depictions of Librarians in the Horus Heresy and modern-day novels alike.","design":"Talent-linked group; see each child.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Null Zone","points":23,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"Strips the warp's protection from everything nearby — invulnerable saves falter, toughened hides thin.","design":"Affliction (10/level) delivering a Vulnerability-style disadvantage valued (by this project, not a cited RAW table entry) at roughly -20 points, +100% Malediction, +50% Area Effect, then Warp Sorcery and Severe Perils, net +130% — the setting's single most dangerous debuff, priced to match. Full modified cost: 10 x 2.3 = 23 points/level; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"levels":1,"mods":[{"name":"Disadvantage Delivered (Vulnerability","cost":"+20%","notes":""},{"name":"Malediction 1","cost":"+100%","notes":""},{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp (Severe)","cost":"-20%","notes":""}]},{"name":"Might of Heroes","points":17,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"A Librarian's traditional pre-charge blessing, filling a squad with unnatural strength and courage.","design":"Grouped Basic advantages, each carrying Area Effect (squad-wide) plus Warp Sorcery/Perils; GCS sums the children.","weapons":[],"feat":{"dr":[],"other":[]},"container":"group","children":[{"name":"Heroic Feats of Strength","points":12,"tags":["Advantage","Physical","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"Basic's Heroic Feats of Strength (flat 10) with Area Effect plus Warp Sorcery/Perils, net +20%. Full modified cost: 10 x 1.2 = 12 points; needs Warp Empowerment level 2 (cap 30).","weapons":[],"feat":{"dr":[],"other":[]},"mods":[{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]},{"name":"Fearlessness","points":5,"tags":["Advantage","Mental","Psyker","Imperium"],"ref":null,"lore":"See parent trait.","design":"Basic's Fearlessness (2/level) with Area Effect plus Warp Sorcery/Perils, net +20%. Full modified cost: 2 x 1.2 = ~2 points/level; needs Warp Empowerment level 1 (cap 20).","weapons":[],"feat":{"dr":[],"other":[]},"levels":2,"mods":[{"name":"Area Effect","cost":"+50%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp","cost":"-10%","notes":""}]}]}]},{"name":"Vortex of Doom (Great Power)","points":280,"tags":["Advantage","Mental","Psyker","Imperium","Great Power"],"ref":null,"lore":"A Librarius Great Power: a tearing vortex of raw warp-force that can gut a building or a company of tanks, at genuine risk to everything and everyone nearby, caster included. Kept as its own top-level entry (rather than nested inside Librarius) so it can be added, or left out, independently of a Librarian's two ordinary signature powers — it is GM-reference only, in the same \"Beyond play\" bracket the framework reserves for Primarchs and Greater Daemons, not meant for ordinary Librarian play.","design":"Innate Attack (Crushing, 5/die), 20d starting suggestion, with Explosion at the 16-yard tier (+200%, B106), Armor Divisor (2) (+50%), Preparation Required (-30%, a full turn's channelling), Warp Sorcery, and Severe Perils, net +180%. Full modified cost: 5 x 2.8 = 14 points/level, and this Great Power's minimum purchase is 20 levels (280 points) — deliberately priced in the framework's \"Beyond play\" tier. Even Alpha-Plus's GM-only Warp Empowerment ceiling (cap ~80+) falls well short of 280: per the framework, Great Powers may exceed any PC's (or ordinary NPC's) Warp Empowerment outright. A GM allowing a named NPC to cast it at all should treat the cap rule as waived for this entry specifically, exactly as Thaumatology: Sorcery's own greater rituals routinely exceed an individual sorcerer's own Empowerment and require a working circle instead.","weapons":[],"feat":{"dr":[],"other":[]},"levels":20,"mods":[{"name":"Explosion","cost":"+200%","notes":""},{"name":"Armor Divisor (2)","cost":"+50%","notes":""},{"name":"Preparation Required","cost":"-30%","notes":""},{"name":"Warp Sorcery","cost":"-20%","notes":""},{"name":"Perils of the Warp (Severe)","cost":"-20%","notes":""}]}],"count":20},{"id":"imperium--weapons--bolt-weapons","title":"Bolt Weapons","section":"Imperium/Weapons","kind":"equipment","path":"Imperium/Weapons/Bolt Weapons.eqp","items":[{"name":"Bolt Pistol, Godwyn-De'az Pattern","tl":"10","lc":"1","cost":"500","weight":"4 lb","qty":1,"tags":["Missile Weapon","Imperium","Inquisition","Astra Militarum"],"ref":null,"lore":"The human-portable bolt pistol, most commonly the Godwyn-De'az pattern that shares its mass-reactive .75-calibre round with the standard Godwyn boltgun, is issued to Inquisitorial acolytes, commissars, veteran officers and other elite humans rather than to rank-and-file Guardsmen, who are more usually equipped with an autopistol or laspistol if they carry a sidearm at all. Dark Heresy and Rogue Trader both depict it as a prized, LC1 weapon whose recoil is punishing for an unaugmented shooter.","design":"Scaled down one die from the Godwyn boltgun anchor (6dx2(2) pi++, see the standard Boltgun, Godwyn Pattern entry) to 5dx2(2) pi++: the bolt's rocket motor ignites a few metres clear of the muzzle and does most of the accelerating, so a shorter pistol barrel costs less damage than a conventional gunpowder round would lose, but it still loses something to the reduced initial propellant charge and shorter sighting radius. The follow-up scales the same way, one die down from the boltgun's 6d cr ex anchor to 5d cr ex. ST 10† and Rcl 3 are both unusually high for a service pistol (compare a normal GURPS pistol's ST 8-9, Rcl 2): this is the \"hard for unaugmented humans to handle\" property the fiction keeps returning to. The † lets it be fired two-handed at the listed ST; fired one-handed by anyone under ST 10 it takes the standard extra recoil and reduced accuracy for shooting under minimum ST. Special ammunition (Kraken, Hellfire, etc.) is not repeated here; see the Boltgun, Godwyn Pattern entry for full stats, all of which are loaded in .75-calibre pistol form as well as rifle form per Deathwatch's Special Issue Ammunition rules.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"5dx2(2) pi++","skill":"Guns (Pistol)","notes":"","accuracy":"2","range":"120/400","rate_of_fire":"3","shots":"8(3)","strength":"10†","bulk":"-2","recoil":"3"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"5d cr ex","skill":"Guns (Pistol)","notes":"","accuracy":"2","range":"120/400","rate_of_fire":"3","shots":"8(3)","strength":"10†","bulk":"-2","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Bolt Pistol, Mk II Phobos-Pattern","tl":"10","lc":"0","cost":"650","weight":"4.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"The Phobos-pattern bolt pistol is a common Astartes sidearm, its grip and slide machined to mag-lock against a suit of power armour's thigh or chest plate when holstered. Codex background across many Chapters shows it as the Techmarine-serviced companion to the chainsword for close-quarters work once a boltgun's magazine runs dry.","design":"Same .75-calibre round and therefore the same damage line (5dx2(2) pi++ / 5d cr ex follow-up) as the Godwyn-De'az pattern above; only the frame differs. ST is raised to 12† to reflect the more robust, Astartes-proportioned grip: a Space Marine (ST 18-20 per the framework's Astartes physiology target) uses it one-handed with no penalty, while an unaugmented human struggles even two-handed. LC0 because, per the framework's legality table, Astartes-marked wargear is heresy for the unauthorised to possess even though the ammunition and mechanism are identical to a human-issue bolt pistol.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"5dx2(2) pi++","skill":"Guns (Pistol)","notes":"","accuracy":"2","range":"120/400","rate_of_fire":"3","shots":"8(3)","strength":"12†","bulk":"-2","recoil":"3"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"5d cr ex","skill":"Guns (Pistol)","notes":"","accuracy":"2","range":"120/400","rate_of_fire":"3","shots":"8(3)","strength":"12†","bulk":"-2","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Heavy Bolt Pistol","tl":"10","lc":"1","cost":"900","weight":"6 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"Fielded by Primaris Space Marines (Bladeguard Veterans, Inceptors and others), current Codex background is explicit that the heavy bolt pistol fires a larger case than the legacy bolt pistol, closing most of the gap with a full boltgun in a sidearm's frame.","design":"\"Heavy\" is taken literally: it is given the full Godwyn boltgun anchor damage (6dx2(2) pi++ / 6d cr ex follow-up) rather than the reduced pistol line above, on a bigger, ST 11† frame with a magazine (14 rounds) between the standard pistol's 8 and the boltgun's 24. Range and Acc sit above the lighter bolt pistol because the larger case gives a flatter trajectory and better sight radius.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"6dx2(2) pi++","skill":"Guns (Pistol)","notes":"","accuracy":"3","range":"150/500","rate_of_fire":"3","shots":"14(3)","strength":"11†","bulk":"-3","recoil":"3"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Pistol)","notes":"","accuracy":"3","range":"150/500","rate_of_fire":"3","shots":"14(3)","strength":"11†","bulk":"-3","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Boltgun, Umbra Pattern","tl":"10","lc":"1","cost":"1100","weight":"15 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"One of the older mass-produced boltgun patterns, predating Godwyn-De'az manufacture in several Chapter armouries and Forge World background as a heavier, more conservatively built weapon kept in service out of reliability and reverence rather than performance.","design":"Fires the same standard .75-calibre mass-reactive bolt as every other weapon on this page, so the damage line is identical to the Godwyn-pattern anchor (6dx2(2) pi++, follow-up 6d cr ex); the pattern difference is manufacture and furniture, not ballistics. Modelled as 1 lb heavier than Godwyn with no other stat change, per the framework's rule that lore differences not tied to an anchor stay cosmetic.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Boltgun, Phobos Pattern","tl":"10","lc":"1","cost":"1300","weight":"12.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"A more modern, compact production pattern seen in recent Codex-era background art and Black Library description as lighter and shorter in the receiver than the older Godwyn and Umbra lines, without any suggestion it hits softer.","design":"Same anchor damage (6dx2(2) pi++, follow-up 6d cr ex) as every standard boltgun; only weight (2 lb lighter) and Bulk (-3 instead of -4, for the shorter receiver) move, reflecting a newer, more compact build rather than a different cartridge.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-3","recoil":"3"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-3","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Boltgun, Godwyn Pattern","tl":"10","lc":"1","cost":"1200","weight":"14 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes","Astra Militarum"],"ref":null,"lore":"The Godwyn-De'az pattern is the boltgun the fiction treats as the baseline: a self-contained, rocket-assisted .75-calibre round whose motor ignites a few metres clear of the muzzle, widely depicted (Horus Heresy and modern Black Library alike) as capable of blowing an unarmoured man apart and reliably punching through carapace plate, while a Space Marine can shrug off a few hits from another Marine's boltgun before going down. Special Issue Ammunition (Kraken, Hellfire, Metal Storm, Vengeance) is Deathwatch's own term and rulebook material; Inferno bolts are that line's Deathwatch-specific incendiary load; sanctified/blessed ammunition is a recurring detail in Adepta Sororitas and Chaplain background with no stated mechanical difference against armour.","design":"This is the project's fixed boltgun anchor: 6dx2(2) pi++ with a 6d cr ex follow-up (per the framework's damage table; user-set minimum). Against Astartes power armour (torso DR 100) the armour divisor (2) drops effective DR to 50; 6dx2 averages 42, so it penetrates about 14% of hits (exact dice distribution) and still has to beat the wearer's HP with the pi++ wounding bonus and the 6d cr ex follow-up when it does, matching \"a Marine takes several bolts to kill another Marine.\" Against carapace (DR 45, effective DR 22) it penetrates 99% of hits, against Adepta Sororitas armour (DR 70, effective DR 35) 79%, and against an unarmoured man or flak (DR 12, effective DR 6) it is always lethal - all as the framework specifies. Against Mk X Gravis (DR 130, effective DR 65) it drops to 0.2%, and it essentially never beats a Terminator (DR 200, effective DR 100). Kraken keeps the same 6dx2 dice but swaps the armour divisor to (3) and drops the wounding modifier from pi++ to pi (less internal fragmentation, more punch) and shrinks the follow-up from 6d to 2d cr ex; against Astartes (effective DR 33) that raises penetration to 100%, and against a Terminator (effective DR 66) to 85%, trading wounding multiplier and blast for a much better chance of getting through heavy plate at all. Hellfire and Metal Storm are built from Deathwatch's stated design intent (anti-organic, anti-horde) translated into GURPS damage types (tox for the bio-payload, a fragmentation bracket for the flechette cloud) rather than lifted from any catalogue entry: Hellfire keeps the standard round's x2(2) mechanism but halves the dice (3dx2(2) pi, since most of the penetrator mass is sacrificed for payload) and its tox follow-up (3d(5) tox, organic targets only) is untouched by the rescale since it never interacted with DR the same way; Metal Storm is bumped from 5d pi [2d pi] to 7d pi [3d pi] to stay comfortably ahead of the new, higher flak/carapace baseline while remaining exactly what it was - a no-armour-divisor flechette cloud, lethal to unarmoured hordes and irrelevant against real plate. Vengeance and sanctified rounds are modelled as unchanged ballistically from the standard round (6dx2(2) pi++ / 6d cr ex), since neither RPG nor Codex material describes a different penetrator, with their special property left as a notes-level rule the GM applies. Inferno bolts keep the standard penetrator (6dx2(2) pi++) and double their incendiary follow-up from 4d to 8d burn ex, matching the doubled standard follow-up.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Standard bolt, follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Kraken penetrator round","damage":"6dx2(3) pi","skill":"Guns (Rifle)","notes":"Dense penetrator core sacrifices most of the mass-reactive filler for armour penetration: wounding drops from pi++ to pi and the follow-up shrinks, but it punches through what a standard bolt cannot.\n","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Kraken penetrator round, follow-up (if bolt penetrates)","damage":"2d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Vengeance round","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"Same penetration as a standard bolt against personal armour, but its warhead is tuned to punish void shields, force fields and daemonic constructs: GM should waive any Force Field/Deflector DR bonus and, in campaigns using the framework's Warp rules, treat this as the anti-Unholy round of choice.\n","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Vengeance round, follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Hellfire round","damage":"3dx2(2) pi","skill":"Guns (Rifle)","notes":"Thin-walled shell carries an acid-secreting bio-payload instead of most of its penetrator mass, hence the lighter base damage.\n","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Hellfire round, follow-up (if bolt penetrates; organic targets only)","damage":"3d(5) tox","skill":"Guns (Rifle)","notes":"Represents the payload eating through living tissue once inside; it does nothing extra to vehicles, synthetics or anything else without flesh to dissolve, so apply this follow-up only against organic targets.\n","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Metal Storm round","damage":"7d pi [3d pi]","skill":"Guns (Rifle)","notes":"Bursts into a flechette cloud rather than punching through as a single penetrator: no armour divisor, and the bracketed dice are the fragmentation, not a separate follow-up line. Good against unarmoured hordes, poor against anything with real DR.\n","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Inferno bolt (Deathwatch pattern)","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"Deathwatch kill-team ammunition pairing a standard penetrator core with a phosphex/ promethium secondary charge; the primary shot is unchanged from a standard bolt.\n","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Inferno bolt, follow-up (if bolt penetrates)","damage":"8d burn ex","skill":"Guns (Rifle)","notes":"The frag concussion of a standard bolt is replaced by an incendiary flash.","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Sanctified round","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"Rounds blessed by a Chaplain or Ecclesiarchy priest over holy oils and sacred purity seals; no mechanical change against mundane DR. GM discretion whether these carry a bonus against the daemonic or undead under the campaign's Unholy/Warp rules.\n","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Sanctified round, follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Boltgun, Mk IV Pattern","tl":"10","lc":"1","cost":"900","weight":"13.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"lore":"A simplified, mass-production pattern associated in Imperial Armour-style background with wartime attrition manufacture: cheaper to produce in bulk than Godwyn or Umbra lines, at some cost to finish and long-term reliability that the fiction gestures at without quantifying.","design":"Same anchor damage (6dx2(2) pi++, follow-up 6d cr ex); the only numeric difference from Godwyn is a lower cost (cheaper mass manufacture) and slightly lower weight. This project does not model a reliability penalty for it (no Malf value is given anywhere in this file), since the fiction never quantifies one; a GM wanting to dramatise \"mass-production and less reliable\" can assign a house Malf rating without touching these numbers.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"24(3)","strength":"11","bulk":"-4","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Storm Bolter","tl":"10","lc":"1","cost":"1900","weight":"22 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"Twinned boltgun barrels sharing a single trigger and (usually) a large drum or box magazine, standard wargear for Terminator squads and a common pintle/hull weapon on Imperial vehicles; Codex and Horus Heresy background consistently shows it as simply \"two boltguns fired together,\" not a more powerful round.","design":"Same .75-calibre bolt and therefore the same damage line (6dx2(2) pi++ / 6d cr ex follow-up, identical to the standard Boltgun, Godwyn Pattern's penetration checks) as the Godwyn anchor; \"rof: 3x2\" captures the twin-linked barrels doubling the effective volume of fire per the standard GURPS convention for linked weapons, and the 60-round magazine matches the larger drums shown in art and background. Listed here for infantry (Terminator, ST 12) use with Guns (Rifle); a vehicle- or turret-mounted storm bolter should instead use Gunner (Machine Gun) per the framework's skill table, with no change to the damage line.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3x2","shots":"60(3)","strength":"12","bulk":"-5","recoil":"3"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3x2","shots":"60(3)","strength":"12","bulk":"-5","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Heavy Bolter","tl":"10","lc":"1","cost":"3500","weight":"60 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"lore":"The Imperium's standard support-weapon bolter, tripod- or vehicle-mounted, firing an oversized bolt round; consistently shown chewing through infantry and light vehicles alike while remaining useless against a main battle tank's frontal armour.","design":"This is the project's second fixed anchor: 7dx2(2) pi++, follow-up 8d cr ex (exact dice distribution computed with a Python script, not just averages). Checked against the vehicle armour table: AV10 (DR 100, e.g. a Sentinel or a Chimera's side) has effective DR 50 against the armour divisor (2); 7dx2 averages 49 and penetrates 41% of hits, \"chewing\" light vehicles about 40% of the time as required. AV11 (DR 150, Rhino front/sides, effective DR 75) drops to 0.1%, and AV12-14 (DR 200-350) are effectively 0%, so it does not reliably hurt medium- or heavy-armoured vehicles - both outcomes match the assignment's check. Against a suit of Astartes power armour (DR 100, effective DR 50) it penetrates the same 41% of hits, and it essentially never beats a Terminator (DR 200, effective DR 100) - a support weapon that threatens infantry and armour alike but not the heaviest plate. ST 14 and ROF 6 reflect a genuine support weapon needing a mount or a very strong shooter (only Astartes or a braced tripod).","weapons":[{"melee":false,"usage":"Standard bolt","damage":"7dx2(2) pi++","skill":"Gunner (Machine Gun)","notes":"","accuracy":"5","range":"400/2000","rate_of_fire":"6","shots":"60(5)","strength":"14","bulk":"-6","recoil":"4"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"8d cr ex","skill":"Gunner (Machine Gun)","notes":"","accuracy":"5","range":"400/2000","rate_of_fire":"6","shots":"60(5)","strength":"14","bulk":"-6","recoil":"4"}],"feat":{"dr":[],"other":[]}},{"name":"Bolt Rifle, Primaris Pattern","tl":"10","lc":"1","cost":"1400","weight":"13 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"Introduced with the Primaris Space Marines, current Codex background describes the bolt rifle as firing a slightly more powerful cartridge with improved sights and effective range compared with a legacy boltgun, without claiming it is a different order of weapon.","design":"One pip over the Godwyn anchor (6d+1x2(2) pi++ / 6d+1 cr ex follow-up) for the \"more powerful cartridge\" the Codex claims, plus a real jump in Acc (5 vs 4) and range (300/1200 vs 200/1000) for the improved optics and barrel. Magazine capacity (20) sits below the legacy boltgun's 24 to reflect the bulkier round in the same-size housing. Against Astartes power armour (DR 100, effective DR 50) the extra pip nudges the average from 42 to 44 and raises penetration from the standard bolt's 14% to about 21% (exact dice distribution) - a small but real edge from the \"more powerful cartridge,\" most visible against exactly the kind of target (power armour) the Codex text is describing.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"6d+1x2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"5","range":"300/1200","rate_of_fire":"3","shots":"20(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"6d+1 cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"5","range":"300/1200","rate_of_fire":"3","shots":"20(3)","strength":"11","bulk":"-4","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Auto Bolt Rifle, Primaris Pattern","tl":"10","lc":"1","cost":"1350","weight":"13.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"A Primaris pattern optimised for volume of fire over range, background material frames it as trading the bolt rifle's reach for a much higher cyclic rate, closer in role to an assault weapon than the standard bolt rifle's designated-marksman feel.","design":"Standard Godwyn-anchor damage (6dx2(2) pi++, follow-up 6d cr ex; the cartridge itself is not upgraded, unlike the Primaris bolt rifle above) with RoF doubled to 6 and a bigger 30-round magazine, at the cost of Acc and range falling below even a legacy boltgun to reflect the shorter, gas-hungrier barrel that lore says trades reach for volume.","weapons":[{"melee":false,"usage":"Standard bolt","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"3","range":"200/900","rate_of_fire":"6","shots":"30(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"3","range":"200/900","rate_of_fire":"6","shots":"30(3)","strength":"11","bulk":"-4","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Stalker Bolt Rifle, Primaris Pattern","tl":"10","lc":"1","cost":"1600","weight":"14.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"A precision, semi-automatic-only bolt rifle firing subsonic ammunition for use by Vanguard Primaris squads and scout patterns operating covertly; background stresses stealth and one-shot precision over rate of fire.","design":"Penetrator dice are unchanged from the Godwyn anchor (6dx2(2) pi++; the subsonic load does not need to lose penetration to stay quiet), but the follow-up drops from the anchor's 6d cr ex to 4d cr ex, the same one-third cut as the old scale's 3d-to-2d: a subsonic round has less kinetic energy at impact to trigger a full-yield detonation of the internal charge. Acc is the best of any weapon on this page (integral optics, single shots only, RoF 1) and Bulk is worse (-5) for the built-in suppressor/barrel shroud.","weapons":[{"melee":false,"usage":"Subsonic bolt","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"6","range":"400/1600","rate_of_fire":"1","shots":"12(3)","strength":"11","bulk":"-5","recoil":"3"},{"melee":false,"usage":"Subsonic bolt, follow-up (if bolt penetrates)","damage":"4d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"6","range":"400/1600","rate_of_fire":"1","shots":"12(3)","strength":"11","bulk":"-5","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Combi-Weapon, Bolter/Plasma","tl":"10","lc":"1","cost":"2600","weight":"16 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"Combi-weapons fuse a standard boltgun with a single-shot auxiliary barrel of a rarer special weapon, common Astartes wargear (especially for Chaplains, Sergeants and Deathwatch Space Marines) when a squad needs one extra answer to armour or a specific threat without giving up bolter fire entirely.","design":"The bolter barrel is the Godwyn anchor (6dx2(2) pi++, follow-up 6d cr ex) with a reduced magazine (20 vs 24) to make room for the auxiliary mechanism; the plasma barrel reuses the plasma gun's standard-mode damage line unchanged (6dx4(3) burn ex, see Plasma Weapons) since it is the same cartridge in a smaller reservoir, just good for one shot per reload.","weapons":[{"melee":false,"usage":"Bolter barrel","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"20(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Bolter barrel, follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"20(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Plasma barrel (single shot)","damage":"6dx4(3) burn ex","skill":"Beam Weapons (Rifle)","notes":"One shot before the auxiliary barrel's charge must be replaced; there is no room in the slaved barrel for an overcharge coil, so this barrel has no supercharged mode.\n","accuracy":"3","range":"150/450","rate_of_fire":"1","shots":"1(20)","strength":"12","bulk":"-4","recoil":"2"}],"feat":{"dr":[],"other":[]}},{"name":"Combi-Weapon, Bolter/Melta","tl":"10","lc":"1","cost":"2800","weight":"17 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"As above; the melta-pattern auxiliary barrel is the combi-weapon most sought by squads expecting armour, since it turns a bolter-armed Space Marine into a one-shot tank-killer for the price of a single melta charge.","design":"Bolter barrel is the Godwyn anchor (6dx2(2) pi++, follow-up 6d cr ex). Melta barrel reuses the meltagun's short/beyond-½D damage split unchanged (8dx6(10) burn / 4dx6(3) burn beyond, see Melta Weapons) for a single shot; this also fixes a stale line from before this rescale where the beyond-½D barrel was left as bare \"4d burn\" with no multiplier or divisor at all, out of step with the meltagun's own beyond-½D formula.","weapons":[{"melee":false,"usage":"Bolter barrel","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"20(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Bolter barrel, follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"20(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Melta barrel, short range (single shot)","damage":"8dx6(10) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"2","range":"10/50","rate_of_fire":"1","shots":"1(5)","strength":"11","bulk":"-4","recoil":"1"},{"melee":false,"usage":"Melta barrel, beyond ½D (single shot)","damage":"4dx6(3) burn","skill":"Beam Weapons (Rifle)","notes":"","accuracy":"2","range":"10/50","rate_of_fire":"1","shots":"1(5)","strength":"11","bulk":"-4","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Combi-Weapon, Bolter/Flamer","tl":"10","lc":"1","cost":"2400","weight":"15 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Astartes"],"ref":null,"lore":"As above; the flamer-pattern auxiliary is common on Sternguard and Deathwatch loadouts for clearing entrenched infantry without giving up ranged bolter fire.","design":"Bolter barrel is the Godwyn anchor (6dx2(2) pi++, follow-up 6d cr ex). Flamer barrel reuses the standard Flamer's damage and follow-up unchanged (see Flame Weapons, not part of this rescale) for a single one-shot fuel reservoir.","weapons":[{"melee":false,"usage":"Bolter barrel","damage":"6dx2(2) pi++","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"20(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Bolter barrel, follow-up (if bolt penetrates)","damage":"6d cr ex","skill":"Guns (Rifle)","notes":"","accuracy":"4","range":"200/1000","rate_of_fire":"3","shots":"20(3)","strength":"11","bulk":"-4","recoil":"3"},{"melee":false,"usage":"Flamer barrel (single burst)","damage":"3d burn","skill":"Liquid Projector (Flamethrower)","notes":"Cone attack out to the listed range; no Acc applies (see Flame Weapons) and this barrel holds fuel for one burst only.\n","range":"5","rate_of_fire":"1","shots":"1(3)","strength":"11","bulk":"-4"},{"melee":false,"usage":"Flamer barrel, follow-up (per turn if target catches fire)","damage":"1d burn","skill":"Liquid Projector (Flamethrower)","notes":"Ignores DR; see Flame Weapons for the ignition rule.","range":"5","rate_of_fire":"1","shots":"1(3)","strength":"11","bulk":"-4"}],"feat":{"dr":[],"other":[]}}],"count":15},{"id":"imperium--weapons--flame-weapons","title":"Flame Weapons","section":"Imperium/Weapons","kind":"equipment","path":"Imperium/Weapons/Flame Weapons.eqp","items":[{"name":"Hand Flamer","tl":"8","lc":"2","cost":"350","weight":"5 lb","qty":1,"tags":["Missile Weapon","Imperium","Adepta Sororitas","Inquisition"],"ref":null,"lore":"A compact, one-handed flame weapon carried by Adepta Sororitas Seraphim and Inquisitorial agents for close-quarters purging; background stresses its short reach compared with a full flamer, traded for one-handed use alongside a second weapon or wargear item.","design":"Built bottom-up rather than from an anchor, since the framework's weapon table has none for flame weapons: base damage and cone length scale down from the standard Flamer entry below in the same rough proportion the bolt and plasma families use for their pistol-scale members (2d+2 burn and a 3-yard cone versus the Flamer's 4d and 5 yards). Checked by exact dice distribution: average roll 9 penetrates flak (DR 12) on only 8.3% of hits — a flamer is not an armour-piercing weapon, its cone attack alone barely threatens even light armour, and the real threat is the DR-ignoring follow-up below. The clinging, DR-ignoring follow-up and the cover-bypassing behaviour are the two lore properties the assignment calls out for the whole flame family; both are given the same treatment as the Flamer entry so they read identically across every weapon in this file. The follow-up's sealed-armour exemption is a deliberate new rule for this Rescale: without it, a weapon whose whole selling point is bypassing armour would trivialise Astartes power armour turn after turn, which the fiction never shows — flame weapons are feared by infantry in flak, mesh or carapace, and by anyone whose suit isn't sealed, but a battle-brother who keeps his helmet locked shrugs off the fire itself.","weapons":[{"melee":false,"usage":"Cone attack (3 yards)","damage":"2d+2 burn","skill":"Liquid Projector (Flamethrower)","notes":"No Acc bonus applies and no aiming roll is needed against a target inside the cone (B412): the skill roll is only to avoid intervening obstacles and to keep the cone off friendly targets. Promethium clings to whatever it touches and burns around the edges of hard cover rather than needing a clear line of fire the way a bullet does; treat cover bonuses as halved (round down) against a flame cone, not ignored outright.\n","range":"3","shots":"3(5)","strength":"8","bulk":"-2"},{"melee":false,"usage":"Follow-up (per turn while ablaze)","damage":"1d-1 burn","skill":"Liquid Projector (Flamethrower)","notes":"A target who fails an HT roll on being hit catches fire and takes this every turn until extinguished (see B433's fire rules); this damage is not stopped by DR, since it is the promethium burning on and around the target rather than a fresh attack. This assumes exposed flesh, cloth or open-visored armour the fire can actually catch on: against a hermetically sealed suit (Astartes or Terminator power armour with the helmet locked, a void suit, etc.) the follow-up does not apply at all unless the seal has already been breached that scene (GM's call) — promethium can wash across ceramite for a turn or two of cosmetic flame, but it has nothing to ignite.\n","range":"3","shots":"3(5)","strength":"8","bulk":"-2"}],"feat":{"dr":[],"other":[]}},{"name":"Flamer","tl":"8","lc":"2","cost":"550","weight":"14 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"lore":"Standard Astra Militarum and Astartes squad flame weapon, used throughout the fiction to clear trenches, bunkers, hab-blocks and tunnel networks of infantry, xenos broods and heretics where a bolter or lasgun would need a clean line of sight to every target; universally shown as short-ranged but able to reach around corners and into cover that stops bullets.","design":"No anchor exists for flame weapons in the framework, so this entry is built from GURPS's own area/cone attack design language (B412) rather than from a catalogue item: an \"always hits inside the cone, no Acc\" ranged attack with a burning-target follow-up per the Fire rules (B433). Base damage (4d burn, up from the pre-Rescale 3d to stay meaningful now flak DR has risen to 12) and cone length (5 yards) are set to comfortably kill an unarmoured man and threaten flak on the initial hit: average roll 14 penetrates DR 12 on 66.4% of hits and DR 15 mesh on 33.6%, by exact dice distribution — a real threat to unarmoured or flak-armoured infantry, much less reliable against mesh, and the real killing power still comes from repeated, DR-ignoring burning damage once a target catches fire. That follow-up is deliberately left unscaled and instead gated by a new sealed-armour exemption (see the Hand Flamer's design note): flame weapons are feared by infantry in any armour short of sealed power armour, and should do next to nothing to a battle-brother who keeps his helmet locked, matching how the fiction never shows a flamer meaningfully hurting a sealed Astartes except by setting his surroundings alight. TL is set at 8, well below the TL10 the framework gives most standard Imperial small arms, because a pressurised-fuel-and-igniter weapon is genuinely simple compared with a lasgun or bolter; LC2 (rather than the low LC4 real stub-tech gets) reflects that the Imperium restricts flame weapons for what they do and who is trusted to carry them, not for how sophisticated they are - a deliberate case where TL and LC diverge that departs from the framework's usual TL-implies-LC pattern, worth flagging as a judgment call rather than a strict anchor.","weapons":[{"melee":false,"usage":"Cone attack (5 yards)","damage":"4d burn","skill":"Liquid Projector (Flamethrower)","notes":"No Acc bonus applies and no aiming roll is needed against a target inside the cone (B412): the skill roll is only to avoid intervening obstacles and to keep the cone off friendly targets. Promethium clings and burns around the edges of hard cover rather than needing a clear line of fire; treat cover bonuses as halved (round down) against a flame cone, not ignored outright.\n","range":"5","shots":"4(5)","strength":"9","bulk":"-3"},{"melee":false,"usage":"Follow-up (per turn while ablaze)","damage":"1d burn","skill":"Liquid Projector (Flamethrower)","notes":"A target who fails an HT roll on being hit catches fire and takes this every turn until extinguished (see B433's fire rules); this damage is not stopped by DR. As with the Hand Flamer, this assumes something the fire can actually catch on: it does not apply at all against a hermetically sealed suit (Astartes or Terminator power armour, void suits) whose seal hasn't been breached (GM's call).\n","range":"5","shots":"4(5)","strength":"9","bulk":"-3"}],"feat":{"dr":[],"other":[]}},{"name":"Heavy Flamer","tl":"8","lc":"2","cost":"900","weight":"26 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"lore":"A heavier, hotter-burning flame weapon mounted on vehicles or carried by Astartes Devastator/ Aggressor-adjacent squads and Inquisitorial storm troopers; background treats it as a bunker- and horde-clearing weapon with a longer, wider cone and a bigger promethium reservoir than a standard flamer.","design":"One die over the standard Flamer's new 4d (so 5d burn), with a longer 8-yard cone and a bigger fuel tank (6 bursts vs 4), on a much higher ST 12 reflecting a genuinely heavy weapon usually carried by an Astartes or mounted on a vehicle sponson. Average roll 17.5 penetrates flak (DR 12) on 90.2% of hits and still fails against carapace (DR 45: 0%), by exact dice distribution — a decisive threat to flak-armoured infantry, consistent with its role clearing bunkers full of cultists and light infantry, but no more able to hurt rigid plate than the standard Flamer. The DR-ignoring burning follow-up is scaled the same amount as the base damage and carries the same sealed-armour exemption as the Hand Flamer and Flamer above, keeping the same design relationship used across the family.","weapons":[{"melee":false,"usage":"Cone attack (8 yards)","damage":"5d burn","skill":"Liquid Projector (Flamethrower)","notes":"No Acc bonus applies and no aiming roll is needed against a target inside the cone (B412): the skill roll is only to avoid intervening obstacles and to keep the cone off friendly targets. Promethium clings and burns around the edges of hard cover; treat cover bonuses as halved (round down) against a flame cone, not ignored outright.\n","range":"8","shots":"6(5)","strength":"12","bulk":"-5"},{"melee":false,"usage":"Follow-up (per turn while ablaze)","damage":"1d+1 burn","skill":"Liquid Projector (Flamethrower)","notes":"A target who fails an HT roll on being hit catches fire and takes this every turn until extinguished (see B433's fire rules); this damage is not stopped by DR. As above, it does not apply at all against a hermetically sealed suit whose seal hasn't been breached.\n","range":"8","shots":"6(5)","strength":"12","bulk":"-5"}],"feat":{"dr":[],"other":[]}},{"name":"Promethium Fuel Canister","tl":"8","lc":"2","cost":"40","weight":"6 lb","qty":1,"tags":["Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"lore":"The sealed, pressurised fuel reservoir every flame weapon in this file draws from; background material treats spare canisters as standard squad-level resupply, carried by an ammo-bearer or strapped to the weapon itself, and as a minor hazard in their own right if struck by enemy fire.","design":"A plain reload item rather than a weapon: swapping one in restores a flame weapon's shots to its listed maximum (the number after the slash in each weapon's shots field above). No separate stat block is needed since the fuel itself has no damage value; a GM wanting a \"canister explodes if shot\" hazard can rule it detonates for the carrying weapon's own cone damage.","weapons":[],"feat":{"dr":[],"other":[]}}],"count":4},{"id":"imperium--weapons--grenades-and-launchers","title":"Grenades and Launchers","section":"Imperium/Weapons","kind":"equipment","path":"Imperium/Weapons/Grenades and Launchers.eqp","items":[{"name":"Frag Grenade","tl":"8","lc":"2","cost":"20","weight":"1 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"The standard fragmentation grenade of the Departmento Munitorum, a fist-sized charge issued to virtually every Guardsman; a background constant across Black Library Guard fiction from Gaunt's Ghosts to the Ciaphas Cain novels.","design":"No framework.md anchor covers grenades, so this is built independently using GURPS's own explosive-damage convention — a concussion \"cr ex\" figure plus a bracketed fragmentation die, exactly the pattern data-format.md's own schema example uses. Concussion is set to a modest 3d cr ex (enough to injure at the centre, nowhere near a demolition charge) with a 6d cut fragmentation cloud as the real threat to exposed infantry within a few yards. Checked by exact dice distribution against the new armour anchors: 6d cut (avg 21, no armour divisor) penetrates flak (DR 12) on 98.0% of hits but carapace (DR 45) on 0% — unchanged from the pre-Rescale numbers' relative spread (flak was 99.9% at the old DR 8), so no die-count change was needed to keep frag grenades lethal to troops in the open but useless against armour or fortifications.","weapons":[{"melee":false,"usage":"Thrown","damage":"3d cr ex [6d cut]","skill":"Throwing","notes":""}],"feat":{"dr":[],"other":[]}},{"name":"Krak Grenade","tl":"8","lc":"2","cost":"60","weight":"1.5 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"The Imperium's standard anti-armour and anti-fortification grenade, issued alongside frag grenades to Guard and Astartes forces alike; codex and Black Library background repeatedly show it wrecking light vehicles and bunker firing points, and occasionally cracking heavier targets at real cost and risk.","design":"Modelled as a hand-thrown shaped charge using the same \"cr ex plus armour divisor\" logic GURPS uses for anti-tank warheads, kept well below the meltagun anchor (8dx6(10) burn to ½D) in both multiplier and divisor: a grenade-sized shaped charge carries an order of magnitude less fuel and a much less focused liner than a dedicated melta weapon's thermal lance, so it keeps the mundane armour divisor of (2) rather than melta's (10). Required vehicle-armour check against framework.md's AV-to-DR table, by exact dice distribution (6dx4, average 84, divisor 2): AV10 (DR 100, effective 50) penetrates 98.0% of hits, AV11 (DR 150, effective 75) 72.1% — both comfortably \"reliable.\" AV12 (DR 200, effective 100) drops to 14.5% — \"sometimes,\" as required. AV13 (DR 275, effective 137.5) rounds to a negligible 0.015% (only the maximum possible roll of 6d, 36, times 4 = 144, just clears it), and AV14 (DR 350, effective 175) is a flat 0% — the maximum possible roll (144) can never reach 175 at all — so a krak grenade cannot crack a Leman Russ or Land Raider's frontal armour. This matches the lore's use of krak grenades as light-vehicle and infantry-support ordnance rather than a dedicated tank-killer — that job belongs to the meltagun and melta bomb.","weapons":[{"melee":false,"usage":"Thrown, shaped charge","damage":"6dx4(2) cr ex","skill":"Throwing","notes":"Contact-fused shaped charge with a very small blast radius (roughly 1 yard) — built for a single hard target, not an area effect."}],"feat":{"dr":[],"other":[]}},{"name":"Melta Bomb","tl":"11","lc":"1","cost":"250","weight":"6 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"A hefty demolition charge with an integral melta-coil detonator, carried by sappers and Techmarines to crack void-hull bulkheads, bunkers and vehicle hulls when a meltagun isn't available or isn't enough; Black Library fiction shows melta bombs destroying Land Raiders and fortifications when a Space Marine or Guard sapper can get one physically onto the target.","design":"Uses the same superheated thermal-lance principle as the meltagun anchor (8dx6(10) burn to ½D) and keeps its armour divisor of (10) unchanged — it's the same fuel-air/thermic mechanism, just a bigger charge. The satchel-sized reservoir carries proportionally more fuel than a meltagun's cell, kept at the same ratio the pre-Rescale draft used above its own meltagun figure (roughly 1.25x by average damage): 6dx10 averages 210, about 1.25x the meltagun's own 8dx6 average of 168. Sanity check against the toughest anchor, by exact dice distribution: Land Raider frontal armour (AV14, DR 350) is reduced to an effective DR 35 by the divisor, and even the minimum possible roll (6 dice all showing 1, x10 = 60) clears that — a melta bomb beats AV14 on 100% of hits, guaranteed. That's stronger than \"usually\" and is deliberate: a hand-placed, contact-fused charge doesn't suffer a meltagun's range falloff, so it should be the single most reliable anti-tank tool in the Imperium's arsenal, consistent with it being a dedicated, single-use, last-resort tank-killer rather than a weapon anyone carries casually (LC1, high cost).","weapons":[{"melee":false,"usage":"Placed charge (contact, timed or remote-detonated)","damage":"6dx10(10) burn","skill":"IQ-4","notes":"Hand-placed against a hull, hatch or wall; not thrown and not usable at range. Arming and placing it well enough to guarantee the shot is a demolitions task, not a weapon skill."}],"feat":{"dr":[],"other":[]}},{"name":"Photon Flash Grenade","tl":"8","lc":"3","cost":"25","weight":"1 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"A dazzling photonic flash grenade used by the Guard and the Adeptus Arbites for room-clearing and riot control; consistently shown as a non-lethal, temporary-blindness tool rather than a casualty-producing weapon.","design":"Modelled as a GURPS Affliction-style blinding attack (per Basic Set's flash-grenade conventions) using a flat HT roll rather than a damage roll, since a photon flash grenade's entire purpose is sensory disruption rather than physical injury. No dedicated GCS damage type exists for this, so \"spec\" (special) is used and the actual mechanic is spelled out in the notes field, which is read at the table.","weapons":[{"melee":false,"usage":"Flash","damage":"spec","skill":"Throwing","notes":"Everyone within 5 yards facing the grenade when it goes off must roll vs. HT-6 or be blinded for 1d minutes; anyone looking away or wearing eye protection is unaffected. Deals no HP damage."}],"feat":{"dr":[],"other":[]}},{"name":"Blind Grenade","tl":"7","lc":"3","cost":"18","weight":"1 lb","qty":1,"tags":["Missile Weapon","Imperium"],"ref":null,"lore":"Several RPG-line sourcebooks use \"blind grenade\" and \"photon flash grenade\" almost interchangeably; honestly, no single source draws a hard line between them. This entry treats the blind grenade as the cruder, more common cousin of the Guard's issued photon flash grenade — a chemical flash-charge rather than a calibrated photonic burst, and correspondingly cheaper and more widely available.","design":"Same Affliction-style blinding effect as the Photon Flash Grenade, but a shallower HT-4 roll to be blinded, reflecting the cruder, less reliable dazzle mechanism implied by its lower cost and wider availability (LC3 vs. the photon flash's more standardised issue).","weapons":[{"melee":false,"usage":"Flash","damage":"spec","skill":"Throwing","notes":"Everyone within 5 yards facing the grenade when it goes off must roll vs. HT-4 or be blinded for 1d minutes; anyone looking away or wearing eye protection is unaffected. Deals no HP damage."}],"feat":{"dr":[],"other":[]}},{"name":"Smoke Grenade","tl":"7","lc":"4","cost":"15","weight":"1 lb","qty":1,"tags":["Imperium","Astra Militarum"],"ref":null,"notes":"Fills a roughly 5-yard-radius area with heavy smoke starting the turn after it lands, blocking normal vision through the cloud (treat as Dark, B358) for several minutes depending on wind; auspex and thermal sights may partially see through it at the GM's discretion.","lore":"The standard obscurant grenade issued to virtually every Imperial infantry force for cover during an advance or a withdrawal — one of the least remarkable and most universally carried pieces of Guard wargear.","design":"No attack roll applies, so there's no `weapons` entry; the area effect is written directly into the rules-text `notes` field using GURPS's existing smoke/vision rules (B358) rather than inventing a new mechanic for it.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Stun Grenade","tl":"8","lc":"3","cost":"30","weight":"1 lb","qty":1,"tags":["Missile Weapon","Imperium","Adeptus Arbites"],"ref":null,"lore":"A non-lethal concussive grenade used by the Adeptus Arbites, ship security details and Inquisitorial forces for taking suspects alive rather than killing them.","design":"Deliberately weak on raw damage (1d cr, rarely more than a bruise) because its purpose is the HT roll it forces, not the blast itself — the same additional-effect logic GURPS flashbangs use. The small crushing damage represents the physical concussion of the charge.","weapons":[{"melee":false,"usage":"Concussion","damage":"1d cr","skill":"Throwing","notes":"Everyone within 3 yards who fails a HT-4 roll is stunned (B420) and deafened for 1d rounds, in addition to the blast damage."}],"feat":{"dr":[],"other":[]}},{"name":"Plasma Grenade","tl":"11","lc":"1","cost":"500","weight":"2 lb","qty":1,"tags":["Missile Weapon","Imperium"],"ref":null,"lore":"A rare, expensive superheated-plasma grenade, more commonly referenced in Horus Heresy-era and elite Inquisitorial/Deathwatch matériel than standard Guard issue; included here as the thrown cousin of the plasma gun, honestly noted as an uncommon item rather than standard-issue wargear.","design":"Scaled down from the plasma gun anchor (6dx4(3) burn ex) at half the base dice count, the same relationship the earlier draft used (half of 6d, keeping the x4 multiplier and the (3) divisor unchanged): a hand-thrown plasma charge has an even smaller containment cell than a plasma pistol's, but it's still the same superheated-plasma penetration principle, so the divisor carries over unmodified. Average roll 42 comfortably beats carapace (DR 45, effective 15: 99.5% of hits) and Sororitas plate (DR 70, effective 23.3: 95.4%), and still gets through Astartes power armour (DR 100, effective 33.3) on 74.1% of hits — a rare grenade that can seriously hurt a Space Marine, matching plasma's place as the one small-arms family that reliably threatens power armour. The canonical containment-failure/overheat hazard of plasma technology is noted as flavour rather than modelled numerically, matching how the plasma gun anchor itself just references \"Malfunction\" without a schema field for it.","weapons":[{"melee":false,"usage":"Thrown","damage":"3dx4(3) burn ex","skill":"Throwing","notes":""}],"feat":{"dr":[],"other":[]}},{"name":"Haywire Grenade","tl":"8","lc":"2","cost":"150","weight":"1.5 lb","qty":1,"tags":["Missile Weapon","Imperium"],"ref":null,"lore":"An anti-vehicle, anti-servitor EMP charge used by Guard tank-hunter teams and Inquisitorial forces against constructs and unshielded machine-spirits; background material notes it as effective but unpredictable against lightly shielded war machines, and useless against anything that isn't substantially mechanical.","design":"Deals no HP damage at all — modelled purely as a systems-disable effect (the \"spec\" damage type plus rules text) rather than a damage roll, matching how GURPS treats EMP-style weapons as a disruption effect rather than a wounding one.","weapons":[{"melee":false,"usage":"EMP burst","damage":"spec","skill":"Throwing","notes":"No effect on living flesh. Vehicles, robots and servitors within 2 yards have all active systems (weapons, engines, augur/vox) disabled for 2d turns unless the GM rules the target is shielded; against a Machine Spirit-bound war engine (Dreadnoughts, Sentinels and the like), treat this as an unusually harsh HT roll instead of an automatic effect."}],"feat":{"dr":[],"other":[]}},{"name":"Grenade Launcher","tl":"8","lc":"2","cost":"700","weight":"6 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"lore":"A break-action or revolver-cylinder launcher used by Guard grenadiers and heavy-weapon teams to put frag or krak payloads well past throwing range; a mainstay support weapon across Astra Militarum background art and fiction.","design":"The damage lines are identical to the hand-thrown Frag and Krak Grenade entries above — same warhead, delivered by a launcher tube instead of an arm, which is the standard GURPS approach (B412: a launched grenade uses the grenade's own damage, not a new figure). Acc/range/RoF/shots are new here, since a thrown weapon doesn't carry those stats, and are built as a simple single-shot break-action or revolver launcher: modest accuracy, a much longer practical reach than a throwing arm, and slow reloading between shots.","weapons":[{"melee":false,"usage":"Frag round","damage":"3d cr ex [6d cut]","skill":"Guns (Grenade Launcher)","notes":"","accuracy":"3","range":"170/650","rate_of_fire":"1","shots":"6(3)","strength":"9","bulk":"-4","recoil":"1"},{"melee":false,"usage":"Krak round","damage":"6dx4(2) cr ex","skill":"Guns (Grenade Launcher)","notes":"Same shaped-charge warhead as the hand-thrown Krak Grenade; see that entry's design notes for how it performs against vehicle armour.","accuracy":"3","range":"170/650","rate_of_fire":"1","shots":"6(3)","strength":"9","bulk":"-4","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Frag Grenades, Launcher Rounds (box of 6)","tl":"8","lc":"2","cost":"90","weight":"6 lb","qty":1,"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"Boxed frag rounds packaged for the grenade launcher rather than for hand-throwing.","design":"Pure ammunition item backing the Grenade Launcher's \"Frag round\" usage line.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Krak Grenades, Launcher Rounds (box of 6)","tl":"8","lc":"2","cost":"300","weight":"9 lb","qty":1,"tags":["Imperium","Astra Militarum"],"ref":null,"lore":"Boxed krak rounds packaged for the grenade launcher rather than for hand-throwing.","design":"Pure ammunition item backing the Grenade Launcher's \"Krak round\" usage line.","weapons":[],"feat":{"dr":[],"other":[]}}],"count":12},{"id":"imperium--weapons--heavy-weapons","title":"Heavy Weapons","section":"Imperium/Weapons","kind":"equipment","path":"Imperium/Weapons/Heavy Weapons.eqp","items":[{"name":"Lascannon","tl":"10","lc":"2","cost":"15000","weight":"80 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum","Adeptus Astartes"],"ref":null,"notes":"Needs a tripod or vehicle pit mount (ST 12M): an unmounted human cannot brace it, though Astartes ST lets a Space Marine fire it standing (treat as braced at ST 12 rather than mounted, GM's call). Draws from a dedicated power cell (see Lascannon Power Cell); swapping cells takes the 5-turn reload noted in shots.","lore":"The definitive Imperial anti-tank weapon: Guard heavy weapons squads, Space Marine Devastators and Predator/Rhino/Razorback sponsons and turrets all mount it, and Black Library fiction (Gaunt's Ghosts, Horus Heresy novels) consistently has a well-placed lascannon shot cripple or kill a battle tank, and treats it as one of the few man-portable weapons that can bring down a Terminator or walker.","design":"Damage is the fixed anchor from framework.md: 8dx8(5) burn (\"kills tanks and Terminators\"). Checked against the vehicle AV table with the exact dice distribution: average 224 burn through an armor divisor of 5 gives an effective DR of 20 (AV10) to 70 (AV14). Even a worst-case minimum roll (8 dice all at 1, x8 = 64) clears every effective DR on the table, so the lascannon always beats AV10 through AV14 (DR 100-350) with the anchor's divisor doing almost all the work; against a Terminator (DR 200, effective DR 40) or Astartes power armor (DR 100, effective DR 20) it is likewise a guaranteed penetration, matching \"kills tanks and Terminators\" without exception. Acc, range, RoF, shots, Bulk and Rcl are not anchored by framework.md, so they're built from first principles: RoF 1 and Rcl 1 because a beam weapon has no recoil and the capacitor cycle time is the limiting factor; Acc 14 and a long 1500/4500 range because the weapon's entire battlefield role is precision fire on distant armor, which demands better optics than a lasgun (Acc 10); Bulk -8 and ST 12M because the weapon and its cooling housing are backpack-sized and unwieldy without a brace. Cost and LC follow \"military-issue heavy weapons\" (LC2) and are priced well above a lasgun to reflect scarcity of the long-barrel focusing crystal.","weapons":[{"melee":false,"usage":"Braced/mounted","damage":"8dx8(5) burn","skill":"Gunner (Beams)","notes":"","accuracy":"14","range":"1500/4500","rate_of_fire":"1","shots":"5(5)","strength":"12M","bulk":"-8","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Lascannon Power Cell","tl":"10","lc":"2","cost":"2000","weight":"15 lb","qty":1,"tags":["Imperium","Astra Militarum","Adeptus Astartes","Ammunition"],"ref":null,"notes":"Good for 5 shots per the lascannon's shots rating. A spent cell must be sent back to an armoury or Tech-Priest for recharging; it isn't a field-rechargeable pack like a lasgun's.","lore":"Described in Guard logistics fiction as a heavy, closely-guarded item; a heavy weapons team is only as good as its ammo carrier's supply of charged cells.","design":"Weight and cost scaled up from a lasgun power pack (a small, cheap, common item) by roughly the same ratio as the lascannon's damage output over a lasgun's, since it stores far more energy in a denser, more dangerous cell. No anchor fixes this number; it exists to make ammunition resupply a logistics concern in play.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Heavy Weapon Tripod","tl":"8","lc":"3","cost":"300","weight":"20 lb","qty":1,"tags":["Imperium","Astra Militarum","Gear"],"ref":null,"notes":"Required to fire a mounted-only (M) heavy weapon without an Astartes-grade ST score. Setup/breakdown takes about a minute (Fast-Draw or GM discretion can shorten this).","lore":"Guard heavy weapons squads are built around a two- or three-man team - gunner, loader, and often an ammo carrier - who move the tripod between firing positions, a staple of Astra Militarum fiction from Gaunt's Ghosts onward.","design":"Not anchored; a generic piece of gear so lascannon, multi-laser, autocannon and mortar entries can all reference the same mount rather than each inventing one. Cost and weight are a plausible generic tripod, not derived from any weapon-specific figure.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Multi-laser, Tripod-Mounted","tl":"10","lc":"2","cost":"8000","weight":"45 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"More commonly seen as a Sentinel or Rhino turret weapon than carried into the field; this is the static defensive-emplacement or bunker version issued to line regiments guarding a position.","lore":"Multi-lasers are the standard secondary and light-vehicle turret weapon across the Astra Militarum (Sentinels, Chimeras, Rhinos); fiction and background consistently treat them as good infantry-shredders that struggle to hurt anything with real armour plate.","design":"No framework anchor covers the multi-laser. It is several linked lasgun-grade emitters cycling far faster and harder than any infantry weapon, and the fiction treats it as a heavier anti-infantry weapon than the heavy bolter, so each shot sits level with a bolter round at 6dx2(2) burn (avg 42). Exact odds per hit: always penetrates carapace (DR 45); Sororitas plate (DR 70, eff. 35) 79%; Astartes power armour (DR 100, eff. 50) 14%, same as a bolter; AV10 (DR 100) 14%, so it can threaten a Chimera's flank with luck but no tank. RoF 3 represents the linked barrels. Acc, range and Bulk sit between the lasgun and lascannon.","weapons":[{"melee":false,"usage":"Braced/mounted","damage":"6dx2(2) burn","skill":"Gunner (Beams)","notes":"","accuracy":"8","range":"900/2700","rate_of_fire":"3","shots":"100(5)","strength":"9M","bulk":"-6","recoil":"1"}],"feat":{"dr":[],"other":[]}},{"name":"Autocannon","tl":"8","lc":"2","cost":"6000","weight":"85 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"Weight includes the tripod mount; a Heavy Weapons Squad crews it as gunner plus loader. The Predator battle tank's turret gun is the same weapon on a stabilised vehicle mount.","lore":"The autocannon is the Guard heavy weapons squad's and the Predator tank's main anti-light-vehicle gun throughout the fiction: reliably described tearing through Ork trukks, light xenos raiders and Sentinel-class walkers, denting Rhinos and Chimeras, and bouncing or only chipping a Leman Russ or Land Raider's frontal glacis.","design":"Not covered by a framework anchor, so it's built as a solid-projectile \"stub\" weapon per the TL table (autogun/stubber bracket, scaled to artillery-grade tolerances) rather than borrowed from any GURPS catalogue cannon: a single heavy AP penetrator per round gives pi++ (full wound multiplier, no follow-up), with a moderate armor divisor (3) for the hardened long-rod core, and a real cannon's low-teens RoF is dialed back to RoF 3 to keep it a burst weapon rather than a chain-gun (that's the assault cannon's niche). Checked with the exact dice distribution (6dx3(3) pi++, avg 63) against the vehicle AV table: it penetrates AV10 (DR 100, eff. DR 33) 99% of the time and AV11 (DR 150, eff. DR 50, a Rhino's front/sides) 85% of the time - reliably beats both, as required; against AV12 (DR 200, eff. DR 66, a Chimera's front) that drops to 36% - sometimes beats it, matching \"dents a Rhino, sometimes cracks a Chimera\"; and against AV13 (DR 275, eff. DR 91) it falls to 1% and AV14 (DR 350, eff. DR 116) to effectively 0% - it does not beat a Leman Russ or Land Raider's armour, matching every source that has autocannon fire shrug off a main battle tank's frontal plate.","weapons":[{"melee":false,"usage":"Braced/mounted","damage":"6dx3(3) pi++","skill":"Gunner (Cannon)","notes":"","accuracy":"8","range":"1000/3000","rate_of_fire":"3","shots":"20(3)","strength":"14M","bulk":"-8","recoil":"3"}],"feat":{"dr":[],"other":[]}},{"name":"Autocannon Ammunition, Solid Shot (20)","tl":"8","lc":"2","cost":"150","weight":"12 lb","qty":1,"tags":["Imperium","Astra Militarum","Ammunition"],"ref":null,"notes":"One full magazine load per the autocannon's shots rating.","lore":"Depicted as belted or clipped heavy-calibre shells, hauled by the loader in a Heavy Weapons Squad.","design":"Generic ammunition line so autocannon resupply has a weight and cost; not separately anchored.","weapons":[],"feat":{"dr":[],"other":[]}},{"name":"Missile Launcher","tl":"8","lc":"2","cost":"5000","weight":"22 lb","qty":1,"tags":["Missile Weapon","Imperium","Astra Militarum"],"ref":null,"notes":"Shoulder-fired, one missile loaded at a time; the gunner (or a loader) carries spares separately (see the missile entries below). Flakk missiles trade blast for a proximity fuze and are wasted against ground targets.","lore":"The Guard's man-portable answer to armour and aircraft when a lascannon isn't to hand: fiction repeatedly has missile teams crack light and medium vehicles and occasionally cripple a Leman Russ, while frag loads are the squad's answer to entrenched infantry and light structures.","design":"No single framework anchor covers this launcher as a whole, but Krak is itself one of the project's fixed anchors: 6dx6(3) cr, a one-shot, disposable shaped charge. Checked with the exact dice distribution (avg. 126) against the AV table: it beats AV10 (DR 100, eff. DR 33) essentially always and AV11-12 (DR 150/200, eff. DR 50/66) 100%/99% of the time - reliably wrecks Chimeras and Rhinos; against AV13 (DR 275, eff. DR 91) it's still 90% - reliable vs AV12-13 as the anchor requires; and against AV14 (DR 350, eff. DR 116) it drops to 64% - \"about two in three\" - so a Land Raider or Leman Russ's frontal glacis is a real but not certain kill, which is why the fiction has missile teams engage such targets in numbers rather than solo. Frag: scaled from the B414 fragmentation rules as a \"big
