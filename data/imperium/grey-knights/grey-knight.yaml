kind: template
output: Imperium/Templates/Grey Knight Add-On.gct
notes: >
  An add-on, not a full character: layer this over Imperium/Templates/
  Astartes Battle-Brother.gct exactly as Imperium/Templates/Astartes
  Librarian Add-On.gct and Astartes Techmarine Add-On.gct do, in place of
  (not alongside) a Chapter Gene-Seed lens from Astartes Gene-Seed.adq --
  the Grey Knights' own gene-seed provenance is unknown even within this
  project (see Imperium/Traits/Grey Knights.adq, "Gene-Seed Provenance:
  Unknown"), so this add-on stands in for a Chapter lens rather than
  stacking with one. It does not repeat the Battle-Brother's attributes,
  physiology, Chapter Rank, or Reputation -- only what every Grey Knight
  has beyond a Tactical Marine of an ordinary Chapter: an incorruptible,
  warded soul; the psychic gift and Sanctic Daemonology training that make
  the Chapter's daemon-hunting possible; the squad-wide Brotherhood bond;
  and the Chapter's own Duty and Secret.

  Every Grey Knight is himself a trained psyker from his first patrol (see
  Grey Knight Psychic Gift, Imperium/Traits/Grey Knights.adq): this add-on
  buys Psyker (Talent) 4 and Warp Empowerment 3, landing a rank-and-file
  Brother at a Gamma-equivalent grade (Talent 4 / Empowerment 3, cap 40) on
  the warp.yaml Assignment table -- one step under the full Alpha grade this project's own Librarian Add-On
  buys, reflecting "every brother is at least a strong psyker" while
  leaving room for a named Grand Master or Brother-Captain to buy Psyker
  and Warp Empowerment higher as an individual advancement on top of this
  shared baseline, the same way a line Battle-Brother buys up Rank and
  Reputation. Sanctic Daemonology (Imperium/Traits/Psykers and the
  Warp.adq) is bought at Banishment 2 (modified cost 8) and Hammerhand 2
  (modified cost 7), both well under this add-on's cap of 40, plus
  Sanctuary at its flat cost (13) -- a squad-ward power that needs only
  Warp Empowerment 1 (cap 20) and so is within easy reach of this add-on's
  level 3 (cap 40), with real headroom left for a GM to push a known power to a higher
  level/more dice as the Warp Empowerment cap allows.

  Point math for this add-on alone: 40 (Grey Knight Soul: 15 Incorruptible
  + 10 Rites of Sanctity + 15 Indomitable Will) + 98 (Grey Knight Psychic
  Gift: 10 Unusual Background + 40 Psyker 4 + 40 Warp Empowerment 3 + 8
  Witch-sight) + 10 (Brotherhood) - 10 (Duty, Chamber Militant) - 10
  (Secret, The Grey Knights) + 0 (Gene-Seed Provenance: Unknown) = 128
  traits from Imperium/Traits/Grey Knights.adq, + 28 (Sanctic Daemonology:
  Banishment 2 = 8, Hammerhand 2 = 7, Sanctuary = 13) + 56 skills (Meditation
  4, Hidden Lore the Warp 4, Hidden Lore Daemons 16, Polearm 8, Two-Handed
  Axe/Mace 8, Staff 4, Gunner Machine Gun 8, Liquid Projector Flamethrower
  4) = 212 points (128 + 28 + 56) on top of the Battle-Brother's own 821,
  for 1,033 total --
  landing at about the Librarian Add-On's own combined total (~1,032),
  matching how Codex and Black Library background treat an ordinary Grey
  Knight Brother as costing about as much as another Chapter's Librarian,
  not merely as much as a Tactical Marine. The four squad-role lenses below
  (Purifier, Purgation, Interceptor, Paladin) are disabled by default,
  exactly as the Dark Angels' Inner Circle Secret (Astartes Gene-Seed.adq)
  is disabled by default: enable the one matching a specific Grey Knight's
  posting on the character sheet, not all four at once.
traits:
  - include: "imperium/grey-knights/traits.yaml#Grey Knight Soul"
  - include: "imperium/grey-knights/traits.yaml#Grey Knight Psychic Gift"
  - include: "imperium/grey-knights/traits.yaml#Brotherhood"
  - include: "imperium/grey-knights/traits.yaml#Duty (Chamber Militant of the Ordo Malleus)"
  - include: "imperium/grey-knights/traits.yaml#Secret (The Grey Knights)"
  - include: "imperium/grey-knights/traits.yaml#Gene-Seed Provenance: Unknown"
  - name: Sanctic Daemonology
    container: group
    children:
      - include: "imperium/psykers/warp.yaml#Banishment"
        levels: 2
      - include: "imperium/psykers/warp.yaml#Hammerhand"
        levels: 2
      - include: "imperium/psykers/warp.yaml#Sanctuary"
    lore: >
      Every Grey Knight Brother is trained in the Chapter's own Sanctic
      discipline from his earliest days in the Chapter's scholam, per
      Codex: Grey Knights and Ben Counter's Grey Knights novels; a squad
      that channels Hammerhand or Sanctuary together is drawing on the
      same Brotherhood bond that lets them fight as a psychic gestalt.
  # ------------------------------------------------------- squad-role lenses
  - name: "Grey Knight Lens: Purifier"
    container: meta_trait
    disabled: true
    tags: [Advantage, Mental, Imperium, Grey Knights, Chapter Variant]
    children:
      - name: Cleansing Flame
        per_level: 5
        levels: 2
        tags: [Advantage, Mental, Psyker, Imperium, Grey Knights]
        modifiers:
          - {name: Accessibility (only vs. Warp-touched/daemonic creatures), cost: "-10%"}
          - "Warp Sorcery, -20%"
          - "Perils of the Warp (Severe), -20%"
    notes: Disabled by default; enable only for a Grey Knight posted to a Purifier squad.
    lore: >
      Purifiers are Grey Knights whose faith and hatred of the warp burn
      hottest, per Codex: Grey Knights background: a Purifier squad is
      entrusted with the harshest purges and can call on Cleansing Flame,
      a searing psychic fire that does nothing to a mortal but consumes
      daemonic matter outright.
    design: >
      Built like Sanctic Daemonology's own Banishment (Imperium/Traits/
      Psykers and the Warp.adq), but as fire: Innate Attack (Burning,
      5/die, B61) restricted to Warp-touched targets (-10%), Warp Sorcery
      (-20%) and Severe Perils (-20%), net -50%. Full modified cost:
      5 x 0.5 = 2.5 points/level; the default 2 levels cost 5 points and
      need only Warp Empowerment level 1 (cap 20), comfortably under this
      add-on's baseline level 3.

  - name: "Grey Knight Lens: Purgation"
    per_level: 5
    levels: 1
    disabled: true
    tags: [Advantage, Mental, Imperium, Grey Knights, Chapter Variant]
    skill_bonuses: {"Gunner (Machine Gun)": 1, "Guns (Rifle)": 1}
    notes: "Disabled by default; enable only for a Grey Knight posted to a Purgation squad (heavy-weapon specialists: psycannon, psilencer, incinerator)."
    lore: >
      Purgation squads are the Grey Knights' heavy-weapon specialists,
      per Codex: Grey Knights background, drilled specifically on the
      Chapter's own psycannon, psilencer and incinerator patterns (see
      Imperium/Grey Knights/Grey Knights Wargear.eqp) rather than the
      standard Astartes armoury.
    design: >
      A minor Talent (Basic B89-91, 5 points/level for the one-two-skill
      bracket) covering the two heavy-weapon skills a Purgation Brother
      actually uses; kept at level 1 (5 points) as a squad-training flag
      rather than a large investment, since the underlying Gunner and
      Guns skills are bought at whatever level a given character sheet
      needs separately.

  - name: "Grey Knight Lens: Interceptor"
    points: 100
    disabled: true
    tags: [Advantage, Mental, Psyker, Imperium, Grey Knights, Chapter Variant]
    modifiers:
      - "Preparation Required, -20%"
      - "Warp Sorcery, -20%"
      - "Perils of the Warp (Severe), -20%"
    notes: Disabled by default; enable only for a Grey Knight posted to an Interceptor squad (teleport-strike deep insertion).
    lore: >
      Interceptor squads are the Grey Knights' rapid-response arm,
      teleporting directly into a daemonic incursion's midst rather than
      advancing on foot, per Codex: Grey Knights background and Ben
      Counter's novels' recurring "Grey Knights translate directly into
      the heart of the fighting" beat.
    design: >
      Rather than invent a new short-range teleport mechanic, this lens
      is built identically to Telekinesis's own Gate of Infinity
      (Imperium/Traits/Psykers and the Warp.adq: Basic's Warp advantage,
      B99, flat 100, with Preparation Required -20%, Warp Sorcery -20%,
      and Severe Perils -20%, net -60%) -- an Interceptor's teleport
      strike is mechanically the same instant-translocation power a
      Librarian's Gate of Infinity is, just trained into every Brother of
      this squad role rather than one specialist. Full modified cost: 100
      x 0.4 = 40 points; it needs Warp Empowerment level 3 (cap 40) --
      exactly this add-on's baseline level, so enabling this lens uses the
      full width of the psychic gift's cap with no headroom to spare,
      appropriate for a squad role built entirely around one demanding,
      high-risk power.

  - name: "Grey Knight Lens: Paladin"
    container: meta_trait
    disabled: true
    tags: [Advantage, Physical, Mental, Imperium, Grey Knights, Chapter Variant]
    children:
      - name: Rank 1 (Grey Knight Paladin)
        points: 5
        ref: B29
      - name: Extra Hit Points
        per_level: 2
        levels: 1
        ref: B16
    notes: Disabled by default; enable only for a veteran Grey Knight elevated to the Paladin cadre (Terminator-armoured elite, see Aegis Terminator Armour, Imperium/Grey Knights/Grey Knights Wargear.eqp).
    lore: >
      Paladins are the Grey Knights' most veteran Brothers, fighting
      permanently in Terminator plate against the worst things the
      Chapter faces; Codex: Grey Knights background treats elevation to
      the Paladin cadre as a mark of survival and trust on top of the
      standard Battle-Brother training every Grey Knight already has.
    design: >
      One further level of Rank (B29, 5 points/level, matching the
      Battle-Brother template's own Rank 3 entry in Astartes Gene-Seed.adq's
      parent template) plus Extra Hit Points +1 (B16, 2/level) for the
      additional hardening veteran survival buys, 5 + 2 = 7 points -- a
      modest bump reflecting individual seniority on top of the shared
      Grey Knight package, not a second racial template.
skills:
  - name: Meditation
    diff: Will/H
    points: 4
    tags: [Imperium, Psyker, Grey Knights]
    lore: >
      Every Grey Knight drills the same discipline the Astartes Librarian
      Add-On's own Meditation entry (Imperium/Templates/Astartes Librarian
      Add-On.gct) describes, to hold his gift steady in the presence of
      the warp's worst.
    design: Meditation is Will/Hard (B207); points as the Librarian Add-On's own identical entry.
  - name: Hidden Lore
    spec: the Warp
    diff: IQ/A
    points: 4
    tags: [Imperium, Psyker, Grey Knights]
    lore: A Grey Knight's formal Sanctic training in the immaterium's nature, matching the Librarian Add-On's identical entry.
    design: Average skill; points as the Librarian Add-On's own identical entry.
  - name: Hidden Lore
    spec: Daemons
    diff: IQ/A
    points: 16
    tags: [Imperium, Psyker, Grey Knights]
    lore: >
      The Grey Knights exist to hunt daemons, and Codex: Grey Knights
      background is explicit that the Chapter's knowledge of daemonic
      nature, names and weaknesses outstrips even the Inquisition's Ordo
      Malleus in places -- a Grey Knight's Hidden Lore (Daemons) is
      expected to be exceptional, not merely competent the way a line
      Battle-Brother's (Astartes Gene-Seed.adq's Battle-Brother template
      already has a lesser Hidden Lore, Xenos and Heresy, at 8 and 2
      points respectively).
    design: >
      16 points on an IQ/Average skill is enough for roughly IQ+3 or
      better at a Grey Knight's typical IQ, a specialist's mastery rather
      than the field-competence level (8 points, roughly IQ+1) this
      project gives a line Battle-Brother's Hidden Lore specialisations.
  - name: Polearm
    diff: DX/A
    points: 8
    tags: [Imperium, Psyker, Grey Knights]
    notes: Nemesis Force Halberd (Imperium/Gear/Psychic Gear.eqp).
    lore: The Nemesis Force Halberd is the Chapter's signature weapon, and most Grey Knights are trained to use one from their earliest live drills.
    design: Average skill, a trained specialist's level; the Battle-Brother base template has no Polearm skill of its own.
  - name: Two-Handed Axe/Mace
    diff: DX/A
    points: 8
    tags: [Imperium, Psyker, Grey Knights]
    notes: Nemesis Daemon Hammer (Imperium/Grey Knights/Grey Knights Wargear.eqp).
    lore: Carried by Grey Knights who favour crushing force over the halberd's reach, especially among Terminator-armoured Paladins.
    design: Average skill; the Battle-Brother base template's Axe/Mace entry (2 points, chainaxe familiarity) is a different, lighter weapon class.
  - name: Staff
    diff: DX/A
    points: 4
    tags: [Imperium, Psyker, Grey Knights]
    notes: Warding Stave (Imperium/Grey Knights/Grey Knights Wargear.eqp).
    lore: Carried by Grey Knights who lead a kill-team's wardings, per Imperium/Grey Knights/Grey Knights Wargear.eqp's own entry.
    design: Average skill at familiarity level; not every Grey Knight carries a stave, so this is priced lightly compared with Polearm above.
  - name: Gunner
    spec: Machine Gun
    diff: DX/A
    points: 8
    tags: [Imperium, Adeptus Astartes, Grey Knights]
    notes: Psycannon and Psilencer (Imperium/Grey Knights/Grey Knights Wargear.eqp), per the framework's "braced/mounted heavies -> Gunner" skill rule.
    design: Average skill; the Battle-Brother base template has Guns (Rifle/Pistol) but no Gunner skill, which the Chapter's own heavy weapons need.
  - name: Liquid Projector
    spec: Flamethrower
    diff: DX/E
    points: 4
    tags: [Imperium, Adeptus Astartes, Grey Knights]
    notes: Incinerator (Imperium/Grey Knights/Grey Knights Wargear.eqp).
    design: Easy skill; the Battle-Brother base template has no flame-weapon skill of its own.
equipment:
  - include: "imperium/grey-knights/wargear.yaml#Aegis Power Armour"
  - include: "imperium/grey-knights/wargear.yaml#Nemesis Force Sword"
  - include: "imperium/psykers/psychic-gear.yaml#Nemesis Force Halberd"
  - include: "imperium/weapons/bolt.yaml#Storm Bolter"
    notes: >-
      Unmodified Astartes storm bolter; gains nothing Grey-Knight-specific
      unless loaded with the Psybolt Ammunition below.
  - include: "imperium/grey-knights/wargear.yaml#Psybolt Ammunition"
