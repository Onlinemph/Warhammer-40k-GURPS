          check vs. daemons, field on; +1d per level of Psyker Talent.
        reach: "1,2"
        parry: 0
        st: 14
        skill: Staff
    conditional:
      - situation: to resist Warp Sorcery-tagged Affliction, Mind Control, Mind Probe, and Fear effects, and to resist possession, directed at the bearer and any ally within the stave's reach
        amount: 2
    lore: >-
      Some Grey Knights — particularly Brother-Chaplains and those who lead
      a kill-team's wardings rather than its charge — carry a warding stave
      instead of a sword or hammer: a badge of office and a focus for
      Sanctic Daemonology's protective workings (see Sanctuary, Imperium/
      Traits/Psykers and the Warp.adq) as much as a weapon, per Codex: Grey
      Knights background and its Black Library depictions of the Chapter's
      more ritual-focused Brothers.
    design: >-
      Built the same way the Nemesis Force Halberd scales up the generic
      Force Axe (Imperium/Gear/Psychic Gear.eqp) to Astartes proportions:
      here the generic Force Staff's mundane baseline (sw+1 cr/thr+1 cr,
      field-on sw+3d(10) cr) is instead scaled to the Power Stave's heavier
      profile (sw+2 cr/thr+2 cr, field-on sw+3d+2(10) cr, Imperium/Weapons/
      Melee Weapons.eqp) and then given Astartes-scale weight and min ST (9
      lb/ST 14, lighter than the Nemesis Force Halberd's 14 lb but the same
      two-handed-haft class) rather than the human Force Staff's 5 lb/ST 10, since this
      is built for a Grey Knight's grip and strength like every other
      Nemesis-family item on this page. At full Astartes ST 30 (sw 5d+2,
      field-on swing totals 8d+4(10) cr, thrust 6d+2(10) cr) the swing
      penetrates every personal-armour anchor in the framework essentially
      always (99.3% against Terminator plate); the thrust penetrates Astartes
      plate 99.9% of the time but Terminator plate only 72.1%. The conditional bonus (+2, Area of reach
      rather than self-only, reflecting a stave actively held out to ward a
      companion rather than worn like the Aegis armour's inscriptions) uses
      the same conditional_modifier mechanic as the Psychic Hood and Aegis
      armour, one point below the Aegis power armour's self-only +3 since
      it depends on being physically near the bearer rather than inscribed
      across a whole suit. LC0/TL10^ as every Nemesis and force weapon in
      this project.

  # ---------------------------------------------------------------- ranged weapons

  # Storm Bolter: unmodified Astartes wargear, not restated here. The Grey
  # Knight Add-On template (Imperium/Templates/Grey Knight Add-On.gct)
  # includes it directly from Imperium/Weapons/Bolt Weapons.eqp -- it is
  # the Chapter's standard Terminator sidearm exactly as for any other
  # Chapter's Terminators, and gains nothing Grey-Knight-specific unless
  # loaded with the Psybolt Ammunition below.

  - name: Psybolt Ammunition
    tl: "10^"
    lc: 0
    cost: 900
    weight: 3
    tags: [Imperium, Adeptus Astartes, Grey Knights, Ammunition]
    weapons:
      - usage: Standard bolt (psybolt-loaded)
        damage: 6dx2(3) pi++
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Follow-up (if bolt penetrates)
        damage: 2d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
    notes: >-
      A full magazine load, statted as loaded into a Boltgun, Godwyn
      Pattern or Storm Bolter (matching that weapon's own handling figures
      above, RoF 3x2 and ST 20 for the twin-linked storm bolter); use this
      weapon block in place of the host weapon's Standard bolt line while
      loaded.
    lore: >-
      Grey Knights load their boltguns and storm bolters with rounds cast
      from psychically-reactive, sanctified alloys and blessed over weeks
      of ritual before a campaign, described in Codex: Grey Knights
      background as hitting noticeably harder than a standard bolt round
      against armoured foes and daemonic constructs alike, without
      changing the weapon that fires them.
    design: >-
      Same dice and wounding modifier as the standard Godwyn-anchor bolt
      (6dx2(2) pi++, Imperium/Weapons/Bolt Weapons.eqp) with the armour
      divisor raised one step to (3), the same divisor-only change the
      Kraken penetrator round already uses on the same page, representing
      a denser sanctified penetrator core rather than a new cartridge.
      Exact dice distribution against Astartes power armour (DR 100, eff.
      DR 33.3): penetrates 85.5% of hits, up from the standard round's
      14.5% — the "hits noticeably harder against armoured foes" the lore
      describes — while carapace (DR 70, eff. 23.3) and Sororitas armour
      (DR 85, eff. 28.3) both round to essentially 100%. Handling figures
      are not restated as their own weapon: this is ammunition for an
      existing gun, so weight and cost are for one spare magazine's worth,
      priced above plain bolt rounds for the sanctification labour, and
      TL is marked superscience (10^) like this project's other
      warp-touched consumables despite riding in an ordinary TL10 weapon.

  - name: Psycannon
    tl: "10^"
    lc: 0
    cost: 26000
    weight: 60
    tags: [Missile Weapon, Imperium, Adeptus Astartes, Grey Knights]
    weapons:
      - usage: Standard bolt
        damage: 6dx2(3) pi++
        acc: 4
        range: 250/1200
        rof: 4
        shots: 40(4)
        st: 25
        bulk: -7
        rcl: 3
        skill: Gunner (Machine Gun)
      - usage: Follow-up (if bolt penetrates)
        damage: 2d cr ex
        acc: 4
        range: 250/1200
        rof: 4
        shots: 40(4)
        st: 25
        bulk: -7
        rcl: 3
        skill: Gunner (Machine Gun)
    notes: >-
      Man-portable by a single Astartes (no tripod), or arm-mounted on
      Terminator armour in place of a storm bolter.
    lore: >-
      The Grey Knights' signature heavy weapon: Codex: Grey Knights
      background describes the psycannon as firing large-calibre
      sanctified penetrator rounds built specifically to bring down
      heavily armoured foes and tear through daemonic flesh that shrugs
      off ordinary weapons, carried by Purgation squads and mounted on
      Grey Knight Dreadknights and Terminators alike.
    design: >-
      Built as a dedicated anti-armour bolt weapon rather than copied from
      the Heavy Bolter or Assault Cannon anchors: same .75-calibre bolt and
      3d cr ex frag follow-up as the standard Godwyn round (Imperium/
      Weapons/Bolt Weapons.eqp), but firing permanently Psybolt-grade
      ammunition, so the armour divisor is (3) rather than the standard
      bolter's (2) as standard issue, not an optional load — reflecting
      "designed specifically to punch through heavily armoured foes." Exact
      dice distribution: penetrates carapace (DR 70, eff. 23.3) 99.0% of
      hits, Sororitas power armour (DR 85, eff. 28.3) 93.9%, and full
      Astartes power armour (DR 100, eff. 33.3) 85.5% — reliably drops
      power-armoured heretics and traitor Astartes alike, matching the
      psycannon's reputation as the answer to targets a storm bolter can't
      touch — while still essentially never beating Terminator plate (DR
      200, eff. 66.7) at 0.1%. Checked against the vehicle AV table for
      completeness though the psycannon is not an anti-tank weapon in the
      fiction: AV10 (DR 100, eff. 33.3) 85.5%, AV11 (DR 150, eff. 50)
      14.5%, AV12-14 (DR 200-350) 0.06% or less — an infantry- and
      daemon-killer, not a tank-killer, the same role this project already
      gives the Assault Cannon.
      Dice: 6d rather than the Heavy Bolter's 7d (and a 3d rather than 4d
      follow-up) because this is a 60 lb man-portable weapon, not an 85 lb
      tripod gun; the armour divisor (3) does the work instead. Against
      Astartes plate it penetrates 85.5% of hits against the Heavy Bolter's
      41.4%, which is the role the fiction gives it (the answer to armoured
      targets, not to crowds). Skill is Gunner (Machine Gun): it is a
      braced heavy weapon (framework.md's braced/mounted-heavies rule), the
      same skill the Purgation lens and Grey Knight template train.
      Handling: 60 lb loaded (heavier than the Storm Bolter's 40 lb for
      the reinforced barrel and larger sanctified-round mechanism, lighter
      than the tripod Heavy Bolter's 85 lb since it's meant to be carried
      and fired by one Astartes). Min ST 25 (sqrt(10x60)~24.5): an Astartes
      at ST 30 handles it two-handed without penalty, but it sits above
      even Astartes ST x1.5 thresholds for one-handed use, matching every
      depiction of the psycannon as a braced, two-handed weapon (or
      forearm-mounted on Terminator plate) rather than a one-handed gun.
      RoF 4 sits between the standard boltgun's semi/burst RoF 3 and the
      Storm Bolter's twin-linked 3x2, reflecting a single heavier-cycling
      barrel rather than paired guns. Bulk -7 and Rcl 3 mark a large,
      two-handed support weapon in line with this project's other
      Astartes heavy bolt weapons; Acc 4 and the 250/1200 range are a
      modest step up from the standard boltgun's 200/1000 for the longer,
      reinforced barrel.

  - name: Psilencer
    tl: "10^"
    lc: 0
    cost: 22000
    weight: 45
    tags: [Missile Weapon, Imperium, Adeptus Astartes, Grey Knights]
    weapons:
      - usage: Standard bolt (subsonic)
        damage: 5dx2(2) pi+
        acc: 3
        range: 150/700
        rof: 8
        shots: 60(4)
        st: 21
        bulk: -6
        rcl: 2
        skill: Gunner (Machine Gun)
      - usage: Follow-up (if bolt penetrates)
        damage: 1d-1 cr ex
        acc: 3
        range: 150/700
        rof: 8
        shots: 60(4)
        st: 21
        bulk: -6
        rcl: 2
        skill: Gunner (Machine Gun)
    notes: Man-portable by a single Astartes; carried by Purgation and Interceptor squads for close-in suppression where a psycannon's report would betray a kill-team's position.
    lore: >-
      A quieter Grey Knight support weapon, per Codex: Grey Knights
      background: a lighter, subsonic-round autoloader traded for near-
      silence, used to suppress and cull lesser threats while a kill-team
      moves in on a psychic phenomenon or daemon incursion without
      announcing itself the way a psycannon or bolter volley would.
    design: >-
      Scaled down from the Psycannon the same way the Stalker Bolt Rifle
      scales down from a standard boltgun (Imperium/Weapons/Bolt
      Weapons.eqp): subsonic rounds keep a smaller pi+ wound multiplier
      (5dx2 rather than 6dx2) and a reduced 1d cr ex follow-up (a subsonic
      round carries less kinetic energy at impact to trigger a full-yield
      detonation), but a much higher sustained RoF (8, a light autoloader
      rather than the Psycannon's heavier single-barrel action) matching
      its suppression role. Exact dice distribution: penetrates carapace
      (DR 70, eff. 35) 50.0% of hits, Sororitas power armour (DR 85, eff.
      42.5) 15.2%, Astartes power armour (DR 100, eff. 50) 1.6%, and
      essentially never Terminator plate — a real but limited threat that
      trades the Psycannon's armour-cracking punch for volume of fire and
      a quiet report, exactly the "suppress rather than kill outright"
      role Codex background gives it. Skill is Gunner (Machine Gun) for the
      same reason as the Psycannon (braced 45 lb support weapon).
      Handling: 45 lb loaded (lighter than the Psycannon's 60 lb for a
      smaller-calibre mechanism and integral suppressor rather than a
      full reinforced barrel). Min ST 21 (sqrt(10x45)~21.2). Bulk -6
      (one step better than the Psycannon's -7 for the lighter housing)
      and Rcl 2 (down from the Psycannon's 3, the subsonic load kicking
      less). Acc 3 and a shorter 150/700 range reflect the suppressor's
      shrouded sight line and the subsonic round's shorter effective
      reach, and Shots 60(4) matches the higher sustained RoF with a
      bigger magazine than the Psycannon's 40.

  - name: Incinerator
    tl: "10^"
    lc: 0
    cost: 4200
    weight: 30
    tags: [Missile Weapon, Imperium, Adeptus Astartes, Grey Knights]
    weapons:
      - usage: Cone attack (10 yards)
        damage: 6d burn
        range: 10
        shots: 6(5)
        st: 13
        bulk: -6
        skill: Liquid Projector (Flamethrower)
        notes: >
          No Acc bonus applies and no aiming roll is needed against a
          target inside the cone (B412); promethium clings and burns
          around cover, treat cover bonuses as halved (round down) rather
          than ignored, as the Flamer family (Imperium/Weapons/Flame
          Weapons.eqp).
      - usage: Follow-up (per turn while ablaze)
        damage: 1d+1 burn
        range: 10
        shots: 6(5)
        st: 13
        bulk: -6
        skill: Liquid Projector (Flamethrower)
        notes: >
          As the Flamer family's burning follow-up: ignores DR, does not
          apply against a hermetically sealed suit whose seal hasn't been
          breached that scene. Against a daemon or other Warp-touched
          creature with no armour to seal in the first place, both this
          line and the cone attack above apply at full effect and a GM
          should treat the promethium's sanctification as denying the
          target any supernatural fire resistance or regeneration against
          this damage specifically, per the lore note below.
    lore: >-
      Codex: Grey Knights background describes the incinerator as loaded
      with promethium blessed and psychically charged during the same
      rites that sanctify a Nemesis weapon, burning daemonic flesh in a way
      an ordinary flamer's fire does not — countering the regenerative and
      fire-resistant nature many daemons otherwise show in the fiction.
    design: >-
      Built one step up the Flame Weapons family from the Heavy Flamer
      (Imperium/Weapons/Flame Weapons.eqp: 5d burn, 8-yard cone, ST 12) to
      reflect the incinerator's larger fuel reservoir and longer reach in
      Codex background: 6d burn, a 10-yard cone, ST 13, and a bigger 6-burst
      tank. Raw cone damage still cannot scratch flak or carapace by exact
      dice distribution at these anchors (matching every entry in the Flame
      Weapons family after two rounds of the armour rescale, see that
      file's own design notes) — the incinerator's real threat to armoured
      targets, as with every flame weapon here, is the DR-ignoring burning
      follow-up, not the initial cone hit. What's new for this entry is the
      anti-daemon note on that follow-up: rather than invent a new damage
      type, this project encodes "sanctified fire hurts daemons especially
      badly" as a GM-adjudicated denial of supernatural fire immunity/
      regeneration specifically against this weapon's follow-up, the same
      notes-level treatment this project already gives Vengeance bolter
      rounds against void shields (Imperium/Weapons/Bolt Weapons.eqp).
      Handling: 30 lb loaded (between the Flamer's 14 lb and Heavy Flamer's
      26 lb on the low end and the psycannon's 60 lb on the high end,
      reflecting a genuinely heavier two-handed weapon than the standard
      squad flamer but still man-portable without a mount); ST 13, one
      point over the Heavy Flamer's 12 for the bigger tank; Bulk -6, one
      step worse than the Heavy Flamer's -5, for the same reason.
