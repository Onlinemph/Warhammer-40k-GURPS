          Hammer.
        reach: "1"
        parry: "0U"
        st: 21
        skill: Two-Handed Axe/Mace
    lore: >-
      The Grey Knights' own thunder hammer pattern, further sanctified and
      permanently attuned against the warp; Codex: Grey Knights background
      and Ben Counter's novels show it wielded by the Chapter's Terminator-
      armoured Paladins against Greater Daemons and other Terminator-grade
      threats where the Nemesis Force Halberd's finesse matters less than
      raw, armour-caving force.
    design: >-
      Identical mundane baseline and power-field math to the Thunder
      Hammer (Imperium/Weapons/Melee Weapons.eqp: field off sw+3 cr, field
      on sw+6d(10) cr, the framework's own "thunder hammers +6d" figure)
      at the same weight (40 lb) and min ST (21), since a Daemon Hammer is
      mechanically the same massive capacitor-headed maul in Astartes
      hands — what makes it a Nemesis weapon is the sanctification and
      permanent anti-daemon attunement carried in the Force Strike line,
      not a heavier head. At full Astartes ST 30 (sw 5d+2, field-on 11d+2(10)
      cr, average 40.5) it penetrates every anchor in the framework's
      personal-armour table (carapace, Sororitas, Astartes, and Terminator
      plate alike) essentially 100% of the time by exact dice distribution — a
      Terminator-killer even before the Force Strike line adds its
      anti-daemon DR-ignoring component, matching the weapon's reputation
      against the very worst things a Grey Knight fights. LC0 and
      superscience TL11^ (an already-advanced Imperial power weapon made
      warp-touched by its sanctification) mark it Chapter-restricted, one
      tier above the mundane Thunder Hammer's plain TL11.

