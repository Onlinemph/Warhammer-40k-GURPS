kind: equipment
output: Imperium/Grey Knights/Grey Knights Wargear.eqp
items:

  # ---------------------------------------------------------------- armour

  - name: Aegis Power Armour
    tl: "11^"
    lc: 0
    cost: 84000
    weight: 146
    tags: [Body Armor, Imperium, Adeptus Astartes, Grey Knights]
    dr: {"torso,vitals,groin": 100, arm: 88, leg: 88, neck: 63, skull: 100, face: 75, eye: 75, hand: 63, foot: 75}
    weak_points: 4
    attributes: {lifting_st: 9, striking_st: 5}
    children:
      - name: Auto-senses Suite
        weight: 4
        cost: 6000
        skill_bonuses: {Observation: 2}
        notes: As the Mark VII Auto-senses Suite (threat auto-cueing, low-light and audio filtering); requires the black carapace interface for full effect.
        lore: The Aegis plate is a warded Mark VII derivative and keeps the standard Astartes sensor package.
        design: Same figures as the Mark VII child (Imperium/Armour/Imperial Armour.eqp); GCS adds a container's children to its own weight and cost, so the shell carries 146 lb and $84,000 and the assembled suit still totals 150 lb and $90,000.
    conditional:
      - situation: to resist Warp Sorcery-tagged Affliction, Mind Control, Mind Probe, and Fear effects, and to resist possession, directed at the wearer
        amount: 3
    notes: >-
      Requires the black carapace interface, as Mark VII. The Aegis
      conditional bonus stacks with the wearer's own Rites of Sanctity
      (Imperium/Traits/Grey Knights.adq) and with a carried Psychic Hood or
      Hexagrammic Ward Charm (Imperium/Gear/Psychic Gear.eqp).
    lore: >-
      Codex: Grey Knights and Ben Counter's novels describe Grey Knight
      power armour as Mark VII-class plate every plate and seal of which is
      inlaid with silver hexagrammic wards, anointed and re-sanctified by
      the Chapter's own Interrogator-Chaplains, so that the armour itself
      resists possession and daemonic influence rather than relying on the
      wearer's own soul alone — a second line of defence on top of what a
      Grey Knight's body already is (see Grey Knight Soul, Imperium/Traits/
      Grey Knights.adq).
    design: >-
      Torso DR, weak_points, eye-lens DR, and servo-motor ST bonus are taken
      unchanged from the Mark VII (Aquila Pattern) baseline (Imperium/
      Armour/Imperial Armour.eqp): the anchor table lore is explicit that
      Grey Knight plate is a warded Mark VII derivative, not a physically
      thicker suit — the Chapter's edge against daemons is spiritual, not a
      bigger DR number, so this entry deliberately does not invent a new
      physical-DR anchor. What's added is the conditional_modifier feature
      (same mechanic as the Psychic Hood item, Imperium/Gear/Psychic Gear.eqp):
      a flat +3 to resist Warp Sorcery-tagged mental attacks and possession
      directed at the wearer, one point higher than the Psychic Hood's +2
      since this is inscribed across an entire suit of plate rather than a
      single circlet. Cost is more than doubled over the Mark VII baseline
      (40000) to reflect the labour of a full-suit sanctification rite (Ordo
      Malleus- and Chapter-restricted, hence the LC0 and the superscience ^
      TL tag alongside the standard TL11 power-armour bracket) rather than a
      material or servo upgrade; weight, attribute bonuses and every other
      figure are otherwise identical to Mark VII.

  - name: Aegis Terminator Armour
    tl: "11^"
    lc: 0
    cost: 160000
    weight: 294
    tags: [Body Armor, Imperium, Adeptus Astartes, Grey Knights]
    dr: {"torso,vitals,groin": 200, arm: 175, leg: 175, neck: 138, skull: 200, face: 150, eye: 150, hand: 125, foot: 150}
    weak_points: 3
    attributes: {lifting_st: 20, striking_st: 10, sm: 1, basic_move: -1}
    children:
      - name: Auto-senses Suite (Terminator Pattern)
        weight: 6
        cost: 10000
        skill_bonuses: {Observation: 2}
        notes: As the Indomitus Pattern Terminator Auto-senses Suite; requires the black carapace interface for full effect.
        lore: Grey Knight Terminators keep the standard Terminator sensor package under the Aegis wards.
        design: Same figures as the Terminator-pattern child (Imperium/Armour/Imperial Armour.eqp); the shell carries 294 lb and $160,000 so the assembled suit is still 300 lb and $170,000.
    conditional:
      - situation: to resist Warp Sorcery-tagged Affliction, Mind Control, Mind Probe, and Fear effects, and to resist possession, directed at the wearer
        amount: 4
    notes: >-
      As Tactical Dreadnought Armour, Indomitus Pattern (effective SM +1,
      -2 to fine DX work, unaided teleportation, black carapace required),
      plus the Aegis warding below.
    lore: >-
      Grey Knight Terminators — the Chapter's most senior Brothers, often
      called Grey Knight Paladins — fight daemons and other Terminator-
      grade threats in Tactical Dreadnought Armour warded the same way the
      Chapter's power armour is, per Codex: Grey Knights background; the
      teleport-strike doctrine this plate enables is the Chapter's
      signature way of bringing a kill-team directly into a daemon
      incursion.
    design: >-
      Torso DR, limb/head DR, weak_points, SM, Basic Move penalty and
      servo-motor ST bonus are taken unchanged from Tactical Dreadnought
      Armour, Indomitus Pattern (Imperium/Armour/Imperial Armour.eqp), for
      the same reason as the Aegis power armour above: the difference is
      warding, not thicker plate. The conditional bonus is raised to +4
      (one point above the power-armour version) since a full Terminator
      shell carries proportionally more inscribed silver and ritual work
      across its much larger surface. Cost is raised well above the plain
      Indomitus baseline (120000) for the same full-suit sanctification
      labour reasoning as the power armour, and it carries the same LC0/TL11^
      tagging.

  # ---------------------------------------------------------------- Nemesis weapons

  - name: Nemesis Force Sword
    tl: "10^"
    lc: 0
    cost: 22000
    weight: 9
    tags: [Melee Weapon, Imperium, Psyker, Grey Knights]
    weapons:
      - usage: Field off
        damage: sw+1 cut
        reach: "1"
        parry: 0
        st: 16
        skill: Broadsword
      - usage: Field on
        damage: sw+3d+1(10) cut
        reach: "1"
        parry: 0
        st: 16
        skill: Broadsword
      - usage: Force Strike (charged, vs. daemons)
        damage: sw+3d+1 cut (ignores DR)
        notes: >
          As the Nemesis Force Halberd's Force Strike (Imperium/Gear/
          Psychic Gear.eqp): no Perils of the Warp check against a daemon
          or other Warp-touched target, field on; the ignores-DR component
          only applies against such targets. Add +1d per level of Psyker
          Talent (GCS can't scale this automatically; edit on the sheet).
        reach: "1"
        parry: 0
        st: 16
        skill: Broadsword
    lore: >-
      The standard one-handed Nemesis weapon pattern, carried where a Grey
      Knight favours reach and a guard over the Nemesis Force Halberd's
      two-handed heft; Ben Counter's Grey Knights novels show it as the
      Chapter's most common sidearm-grade Nemesis weapon after the
      halberd itself.
    design: >-
      Astartes Power Sword pattern (Imperium/Weapons/Melee Weapons.eqp):
      field-off is the plain Astartes-scale broadsword baseline (sw+1
      cut), field-on adds the shared power-field rule's +3d and Armor
      Divisor (10) (framework.md), at the same weight (9 lb) and min ST
      (16) as that entry, since a Nemesis blade's extra sanctification and
      psychic attunement change what it can do to a daemon, not its
      physical mass or handling. Exact dice distribution at full Astartes
      ST 30 (sw 5d+2 per B16, so field-on totals 8d+3(10) cut, average 31):
      penetrates carapace (DR 70), Sororitas power armour (DR 85), and
      Astartes power armour (DR 100) essentially always (100% by exact
      distribution) and Terminator plate (DR 200, eff. DR 20) 98.6% of the
      time — matching
      "the disruption field shears power armour whoever holds it" at the
      high end of this project's power-weapon family. The Force Strike
      line reuses the Nemesis Force Halberd's waived-Perils convention
      (Imperium/Gear/Psychic Gear.eqp): every Nemesis weapon is
      permanently attuned for anti-daemon work, so a Grey Knight needs no
      check to use it against the enemy this weapon exists for. LC0 (Grey
      Knights- and Ordo Malleus-restricted, per the framework's legality
      table) and superscience TL10^ (warp-attuned, like every other force
      weapon in Imperium/Gear/Psychic Gear.eqp), priced above the generic
      Force Sword (8000, Imperium/Gear/Psychic Gear.eqp) for the Chapter's
      own sanctification rites on top of the Astartes-scale housing.

  - name: Nemesis Force Falchions
    tl: "10^"
    lc: 0
    cost: 20000
    weight: 5
    tags: [Melee Weapon, Imperium, Psyker, Grey Knights]
    weapons:
      - usage: Field off, single falchion
        damage: sw+0 cut
        reach: "C,1"
        parry: 0
        st: 13
        skill: Shortsword
      - usage: Field on, single falchion
        damage: sw+3d(10) cut
        reach: "C,1"
        parry: 0
        st: 13
        skill: Shortsword
      - usage: Force Strike (charged, vs. daemons)
        damage: sw+3d cut (ignores DR)
        notes: >
          As the Nemesis Force Sword's Force Strike; no Perils of the Warp
          check vs. daemons, field on; +1d per level of Psyker Talent.
        reach: "C,1"
        parry: 0
        st: 13
        skill: Shortsword
    notes: >-
      Always carried and priced as a matched pair; a Grey Knight fighting
      with one in each hand uses the standard Basic Set rules for two
      weapons (B417, off-hand weapon training, extra attack at the usual
      multiple-attack penalties) rather than any special rule of this
      entry's own.
    lore: >-
      A shorter, lighter-bladed Nemesis pattern favoured by Grey Knights
      who fight with a blade in each hand rather than a single sword or the
      two-handed halberd — depicted in Codex: Grey Knights background and
      Ben Counter's novels as a rarer, more aggressive close-combat
      specialist's loadout than the standard Nemesis Force Sword.
    design: >-
      Scaled down one step from the Nemesis Force Sword's mundane baseline
      the way the human Catachan Fang sits one step below a full sabre
      (Imperium/Weapons/Melee Weapons.eqp): a shorter, single-edged blade
      gives sw+0 cut rather than sw+1, at a lighter weight (5 lb per blade
      vs. the Force Sword's 9) and lower min ST (13 vs. 16) for the smaller
      grip and shorter lever arm, keeping Shortsword rather than
      Broadsword as the family skill. The same power-field +3d/Armor
      Divisor (10) addition applies per blade. At full Astartes ST 30 (sw
      5d+2), field-on per falchion totals 8d+2(10) cut — one point under
      the Force Sword's 8d+3(10) from the one lower mundane pip,
      penetrating every one of the framework's personal-armour anchors up
      to Astartes plate always and Terminator plate 97.6% of the time. Priced level with the Force
      Sword (as a matched pair, not per blade) since a falchion set is no
      less a piece of sanctified Nemesis wargear for being lighter; weight
      given is per blade.

