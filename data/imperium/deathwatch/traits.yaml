kind: traits
output: Imperium/Traits/Deathwatch.adq
items:
  # ------------------------------------------------------------ Oath and Vigil

  - name: "Deathwatch Oath: The Long Watch"
    points: -10
    tags: [Disadvantage, Social, Imperium, Adeptus Astartes, Deathwatch]
    ref: B133
    notes: >
      Quite Often, Hazardous. Covers only the Battle-Brother's secondment
      to the Deathwatch itself; it is layered on top of (not a replacement
      for) his own Chapter's Duty (Chapter and Imperium), which the
      Astartes Hypno-Indoctrination package already prices. A seconded
      Marine answers to two chains of command until his tour ends.
    lore: >
      Every Chapter (bar a handful of holdouts and the notorious
      exceptions the Inquisition has learned to work around) owes the
      Deathwatch a tithe of Battle-Brothers under the ancient Pact of the
      Long Vigil, sworn after the Horus Heresy so that no single Chapter
      could again be turned against the Imperium unsupervised while the
      Adeptus Astartes still pooled its expertise against the alien. A
      seconded Marine takes a fresh oath at the Watch Fortress he reports
      to, serves a term of the Chapter Master's choosing (often years,
      sometimes a Marine's remaining service), and lives, trains and
      fights alongside strangers from other Chapters for its duration —
      Black Library's Deathwatch-focused fiction (notably Steve Parker's
      Deathwatch novel and the Deathwatch anthologies) and Codex:
      Deathwatch background both treat the tour's end as a real, if
      sometimes delayed by circumstance, event: a Marine can and does go
      home.
    design: >
      Basic Set Duty (B133) at a lighter frequency and cost than the
      Chapter Duty it sits alongside (Quite Often rather than Almost
      Always, -10 rather than -15): the danger is not less real, but the
      obligation is bounded to a term rather than lifelong, and unlike
      Chapter Duty it does not also carry the weight of "and Imperium" —
      that half is still covered by the Marine's own Chapter oath. This
      project deliberately does not fold Deathwatch service into a single
      bigger Duty trait; keeping the two separate lets a GM show a
      character's tour ending (drop this trait, keep the Chapter one)
      without touching the racial package.

  - name: "Vigil Oath (Silence of the Long Watch)"
    points: -1
    tags: [Quirk, Mental, Imperium, Adeptus Astartes, Deathwatch]
    ref: B22
    lore: >
      Every kill-team brother swears never to speak, outside the Watch
      Fortress, of what he learns there — xenobiology, captured wargear,
      Ordo Xenos intelligence, the failures as well as the victories. A
      recurring beat in Deathwatch fiction is a Marine's visible discomfort
      when a well-meaning ally or debriefing officer pushes for details he
      has sworn not to give.
    design: >
      Basic Set Quirk (B22): a specific, roleplayable behavioural
      restriction rather than a fresh Vow (which would be redundant with
      the Duty trait above and the Chapter's existing Code of Honor);
      priced at the flat -1 every quirk in this project uses.

  # -------------------------------------------------------------- Kill-team

  - include: "imperium/common/imperial-traits.yaml#Sense of Duty (Squadmates)"
    notes: >
      The kill-team, not the squad — Basic Set's small-group Sense of Duty
      (B153) applied to men who, unlike a Battle-Brother's own Chapter
      squad, may not share a Chapter, a gene-seed line, or (until this
      posting) a language of battle-sign. Stacks with, and is distinct
      from, the Astartes racial package's Sense of Duty (Battle-Brothers),
      which still covers the wider Chapter back home.
    design: >
      Reused via include rather than restated (framework.md and
      data-format.md both prefer this to a second copy of the same B153
      build): only the notes are overridden to make clear which group of
      brothers this points at.

  - name: Chapter Rivalry
    points: -1
    tags: [Quirk, Mental, Imperium, Adeptus Astartes, Deathwatch]
    ref: B22
    lore: >
      Centuries of doctrinal friction don't evaporate because two Marines
      now share a kill-team badge: a White Scar's impatience with a Dark
      Angel's secrecy, an Imperial Fist's dim view of a Space Wolf's
      informality, old grudges between Successor lines. Deathwatch fiction
      treats this as background texture the kill-team works through or
      around, not a fight that breaks the squad — Watch Sergeants exist
      precisely to keep it that way.
    design: >
      Basic Set Quirk (B22): a specific, GM-adjudicated friction with one
      other Chapter (player's or GM's choice) that never rises to a
      combat-relevant penalty, distinct from the Sense of Duty above (which
      is what actually governs whether the character risks himself for the
      squad) and from any one Chapter's own gene-seed quirks in
      Astartes Gene-Seed.adq, which are unaffected.

  # ------------------------------------------------------------ Xenos expertise

  - name: Xenos Hunter
    per_level: 5
    levels: 4
    tags: [Advantage, Mental, Imperium, Deathwatch, Talent]
    ref: B89
    skill_bonuses:
      "Hidden Lore (Xenos)": 1
      Tactics: 1
      "Survival (Any)": 1
      Tracking: 1
    reactions:
      - situation: from other Ordo Xenos and Deathwatch personnel who recognize the expertise
        amount: 1
    lore: >
      Years spent studying, hunting and killing a rotating cast of alien
      threats give a Deathwatch veteran a working, cross-species
      battlefield expertise no single-Chapter Astartes accumulates: reading
      an unfamiliar xenos' tactics fast enough to counter them, tracking
      quarry across terrain built for another biology, and pattern-matching
      captured wargear or physiology against Ordo Xenos archives from
      memory. This is the throughline of Deathwatch's Kill Team-focused
      fiction and Codex: Deathwatch background alike: the kill-team's edge
      is knowing the enemy, not just outgunning it.
    design: >
      Built as a Basic Set Talent (B89-90): a single leveled trait giving a
      flat bonus to a cluster of related skills (Hidden Lore (Xenos),
      Tactics, Survival, Tracking — four skills, priced at the standard
      5 points/level GURPS uses for a Talent covering that many abilities)
      plus a modest reaction bonus from people who share or respect the
      specialty, per B90's Talent template. This is the "Talent" the
      framework's checklist asks for, honestly built rather than reusing
      Sorcery Talent or any other book Talent under a new name.

  - name: "Xenos Bane"
    container: alternative_abilities
    tags: [Advantage, Mental, Imperium, Deathwatch]
    notes: >
      Pick one specialisation per Marine (a kill-team specialist rarely
      carries more than one live vendetta); a GM running a long-service
      Black Shield may allow a second at the same total cost, split across
      both.
    children:
      - name: "Xenos Bane (Orks)"
        points: 5
        conditional:
          - situation: to hit, and to Tactics/Survival rolls made specifically against Orks and Ork-kin
            amount: 1
      - name: "Xenos Bane (Tyranids)"
        points: 5
        conditional:
          - situation: to hit, and to Tactics/Survival rolls made specifically against Tyranids and Genestealer broods
            amount: 1
      - name: "Xenos Bane (Necrons)"
        points: 5
        conditional:
          - situation: to hit, and to Tactics/Survival rolls made specifically against Necrons
            amount: 1
      - name: "Xenos Bane (Eldar/Drukhari)"
        points: 5
        conditional:
          - situation: to hit, and to Tactics/Survival rolls made specifically against Aeldari of any kind
            amount: 1
      - name: "Xenos Bane (T'au)"
        points: 5
        conditional:
          - situation: to hit, and to Tactics/Survival rolls made specifically against the T'au Empire's forces
            amount: 1
    lore: >
      Deathwatch kill-teams are built and briefed around a specific,
      known threat far more often than a Chapter-side Marine ever is; a
      veteran who has hunted the same xenos race across a dozen postings
      develops a narrow, hard-won edge against it specifically, distinct
      from the broader Xenos Hunter Talent above. The Deathwatch RPG line
      builds an entire background/specialisation system around exactly
      this (a kill-team specialist's chosen xenological focus); this
      project's own division into five named banes is a reasoned
      approximation of that idea in GURPS terms, not a page-for-page reprint
      of any FFG table.
    design: >
      Each bane is a small conditional combat/skill bonus (data-format.md's
      `conditional` feature) restricted to one named threat: +1 is a
      genuinely useful edge in exactly the fights this project's fiction
      says a specialist has trained for, without becoming a blanket
      combat bonus the way a general "+1 to hit" advantage would. Priced
      at 5 points by analogy with this project's other narrow, situational
      bonuses (compare the Ecclesiarchy's Social Regard at 2/level for a
      reaction bonus valid with one group only) — a combat-relevant +1
      restricted to one enemy type earns a somewhat higher per-point rate
      than a reaction bonus, but nowhere near a general Weapon Master-style
      trait's cost. Built as alternative_abilities (data-format.md) since
      picking more than one at full price double-dips on the same
      specialist-training justification; the container's own notes cover
      the GM exception for a genuinely veteran Black Shield.

  # ---------------------------------------------------------------- Black Shield

  - name: Black Shield
    container: meta_trait
    tags: [Imperium, Adeptus Astartes, Deathwatch, Chapter Variant]
    children:
      - name: Secret (True Chapter of Origin)
        points: -10
        ref: B152
        notes: >
          Moderate exposure: discovery risks anything from Chapter
          reprisal to an Inquisitorial recall, depending on why the Marine
          left his Chapter unnamed in the first place — left deliberately
          vague, per the fiction's own refusal to give a single answer.
      - name: No Chapter Badge
        points: -1
        tags: [Quirk]
        notes: >
          Wears plain, unmarked black plate with no Chapter iconography
          beneath the Deathwatch's own heraldry; instantly recognisable as
          a Black Shield to anyone who knows the sign, and quietly
          distrusted by the superstitious for it.
    lore: >
      A minority of Deathwatch Marines serve with no Chapter badge at all
      beneath the Deathwatch cross — "Black Shields" whose origin is known,
      if at all, only to the Watch Master who accepted their oath.
      Black Library's Deathwatch fiction treats the reasons as varied and
      often left unresolved on the page: a Chapter destroyed to the last
      man, a Marine whose Chapter disowned him, an Inquisitorial placement
      too sensitive to badge, or simply personal choice. What's consistent
      across sources is that other Astartes find a badgeless brother
      unsettling, and the Deathwatch itself is one of the very few
      institutions in the Imperium that will take such a Marine at all.
    design: >
      A meta-trait lens exactly like the Chapter Gene-Seed lenses in
      Astartes Gene-Seed.adq, but for concealed origin rather than
      physiology: Secret (B152) at a moderate cost since what's actually at
      risk varies by the individual's backstory (a GM ruling this session's
      specific Black Shield's secret is more dangerous should raise the
      cost accordingly, per B152's own guidance), plus a 1-point Quirk
      flagging the in-fiction "other Marines find this unsettling" beat as
      a roleplaying hook rather than a mechanical reaction penalty (which
      would double-count against the Sense of Duty and Chapter Rivalry
      quirks above).

  # --------------------------------------------------------------------- Rank

  - name: Deathwatch Rank
    per_level: 5
    levels: 6
    tags: [Advantage, Social, Imperium, Deathwatch]
    ref: B29
    notes: >
      Levels: 2 Watch Sergeant (leads one kill-team), 4 Watch Captain
      (commands a Watch Fortress's worth of kill-teams and answers directly
      to that fortress's Ordo Xenos liaison), 6 Watch Master (head of the
      entire Deathwatch, one of the very few Astartes officers who reports
      to the Inquisition, in practice, as something closer to a peer than a
      subordinate). Levels 1, 3 and 5 cover intermediate seniority with no
      distinct title in the sources consulted. This Rank governs standing
      within the Deathwatch's own chain of command only; it neither
      replaces nor outranks a Marine's Chapter Rank back home.
    lore: >
      The Deathwatch runs a rank structure parallel to, and largely
      independent of, every founding Chapter's own: a seconded
      Battle-Brother answers first to his kill-team's Watch Sergeant, Watch
      Sergeants to a Watch Fortress's Watch Captain, and Watch Captains
      (however many the Deathwatch currently fields) to a single Watch
      Master, per Codex: Deathwatch background and its consistent portrayal
      across Black Library's Deathwatch line. A Watch Master's authority to
      requisition matériel and troops for a xenos-hunting mission is, in
      practice, backed by the Inquisition's own Ordo Xenos.
    design: >
      Basic Set Rank (B29), 5 points/level, built the same way as this
      project's existing Military Rank and Religious Rank entries
      (Imperial Traits.adq) rather than inventing a new mechanic: one
      leveled trait covers the whole ladder, and the notes field does the
      work of mapping levels to the named offices the framework asks for
      (Watch Master and Watch Captain) instead of splitting them into
      separate un-leveled traits that would have to be kept in sync by
      hand.

  # ---------------------------------------------------------------- Authority

  - name: "Deathwatch Authority (Ordo Xenos Writ)"
    per_level: 5
    levels: 3
    max_levels: 3
    tags: [Advantage, Social, Imperium, Deathwatch, Inquisition]
    ref: B65
    notes: >
      Scoped to xenos-threat operations specifically: commandeering local
      Imperial forces and matériel, overriding a planetary commander's
      order to disengage, and demanding logistical priority from the
      Departmento Munitorum when a kill-team is in the field. It does not
      extend to policing the Inquisition's own internal affairs (that
      remains Inquisitorial Rank in Imperial Traits.adq) and, per the
      Deathwatch's own founding compact, is never turned against another
      Chapter's internal discipline.
    lore: >
      A Deathwatch kill-team operates under a writ the Inquisition's Ordo
      Xenos backs to the hilt whenever a confirmed alien threat is in
      play: Codex: Deathwatch and Black Library's Deathwatch fiction both
      show planetary governors, Naval officers and even Astra Militarum
      generals stepping aside for a kill-team's Watch Sergeant once the
      writ is shown, precisely because the Ordo Xenos has learned that
      hesitation in the face of a genuine xenos incursion gets worlds
      lost.
    design: >
      Basic Set Legal Enforcement Powers (B65), 5/level, at 3 levels
      (15 points) — the same shape as Imperial Traits.adq's Legal
      Enforcement Powers (Commissariat), reused as a template rather than
      invented fresh, but scoped narrower in the notes (xenos operations
      only) to keep it distinct from an actual Inquisitorial rosette, which
      this trait deliberately does not grant.
