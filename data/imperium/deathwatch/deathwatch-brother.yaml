kind: template
output: Imperium/Templates/Deathwatch Add-On.gct
notes: >
  An add-on, not a full character: layer this over Imperium/Templates/
  Astartes Battle-Brother.gct plus the Marine's own Chapter Gene-Seed lens
  from Astartes Gene-Seed.adq (keep that lens — a Deathwatch posting changes
  nothing about a Marine's physiology or Chapter of origin, and a seconded
  Marine's gene-seed quirks, Chapter Rank and Chapter-side Duty are all still
  in force underneath the traits below). Swap the Battle-Brother's own
  Boltgun, Godwyn Pattern and Bolt Pistol, Mk II Phobos-Pattern for whichever
  of this add-on's own Deathwatch Wargear.eqp weapons the kill-team's mission
  calls for; keep the Battle-Brother's chainsword, combat knife and grenades
  unless the player wants the Xenophase Blade instead of a chainsword.

  This add-on's own traits and skills, at their default (rank-and-file,
  no optional lens enabled) settings, come to 80 points — see the
  point math below. The Astartes Battle-Brother.gct template it layers
  onto totals 821 points before equipment (Astartes package with ST 30
  and DX 16, plus training and skills), so a rank-and-file Deathwatch
  Marine is about 901. Enabling any of the disabled lenses below (Watch
  Sergeant, Watch Master, Black Shield, Veteran, extra Deathwatch
  Authority) adds further points on top of that,
  per each lens's own note.

  Point math for this add-on's default build: -10 (Duty: The Long Watch)
  - 1 (Vigil Oath quirk) - 5 (Sense of Duty, Kill-team, included from
  Imperial Traits.adq) - 1 (Chapter Rivalry quirk) = -17 of disadvantage;
  + 40 (Xenos Hunter Talent 4 at 10/level) + 5 (Xenos Bane: Tyranids,
  enabled by default as the archetypal Deathwatch specialisation — swap
  which child is enabled for a different xenos focus) = 45 of advantage; + 52 of
  skills (Hidden Lore (Xenos) +8, Tactics +8, Survival (Any) +8, Tracking
  +8, Gesture +4, Soldier +8, and a new Guns (Shotgun) 8, all additive to
  the Battle-Brother's own entries of the same name where one already
  exists, per each skill line's own note) = -17 + 45 + 52 = 80. The
  disabled Watch Sergeant, Watch Master, Black Shield, Veteran and extra
  Deathwatch Authority lenses below are not part of this baseline; each
  states what enabling it costs on top.
traits:
  - include: "imperium/deathwatch/traits.yaml#Deathwatch Oath: The Long Watch"
  - include: "imperium/deathwatch/traits.yaml#Vigil Oath (Silence of the Long Watch)"
  - include: "imperium/common/imperial-traits.yaml#Sense of Duty (Squadmates)"
    notes: >
      The kill-team, not the squad — see Deathwatch.adq's own copy of this
      entry for the full note; referenced directly from Imperial
      Traits.adq here rather than chained through Deathwatch.adq, since
      this project's build tool does not resolve an include-of-an-include.
  - include: "imperium/deathwatch/traits.yaml#Chapter Rivalry"
  - include: "imperium/deathwatch/traits.yaml#Xenos Hunter"
    levels: 4
  - include: "imperium/deathwatch/traits.yaml#Xenos Bane"
    notes: >
      Alternative Abilities (B61): all five specialisations are listed,
      but only Tyranids is enabled (5 points, the shared cost of every
      child) — enable the child that fits the Marine's posting history
      instead and disable Tyranids; a GM may let a long-serving Black
      Shield enable a second for 1 more point (see the parent trait's own
      container note in Deathwatch.adq).
  - name: "Watch Sergeant"
    container: meta_trait
    tags: [Imperium, Adeptus Astartes, Deathwatch]
    disabled: true
    notes: >
      Disabled lens for a Marine who leads his own kill-team. Enable for
      +10 points (Deathwatch Rank 2).
    children:
      - include: "imperium/deathwatch/traits.yaml#Deathwatch Rank"
        levels: 2
    lore: >
      A Battle-Brother trusted to lead a mixed-Chapter kill-team in the
      field answers to the Watch Fortress as a Watch Sergeant — the most
      common command rank an active Deathwatch Marine actually holds, per
      Codex: Deathwatch and the wider Deathwatch RPG line's own kill-team
      structure.
    design: >
      Deathwatch Rank at level 2 (10 points), reusing the leveled trait
      from Deathwatch.adq rather than restating Basic Set Rank math here.
  - name: "Watch Master"
    container: meta_trait
    tags: [Imperium, Adeptus Astartes, Deathwatch]
    disabled: true
    notes: >
      Disabled lens for the single Astartes who commands the entire
      Deathwatch. Enable for +30 points (Deathwatch Rank 6) plus, at a
      GM's discretion, several levels of Deathwatch Authority above this
      add-on's own baseline — a Watch Master's writ reaches further than a
      single kill-team's. Firmly a "Heroes and legends" character once
      enabled, not a rank-and-file kill-team build; see framework.md's
      point-scale table.
    children:
      - include: "imperium/deathwatch/traits.yaml#Deathwatch Rank"
        levels: 6
    lore: >
      The Deathwatch's single overall commander, one of the very few
      Astartes officers who deals with the Inquisition as something close
      to a peer rather than a subordinate; see Deathwatch.adq's own Rank
      entry for the sourcing.
    design: >
      Deathwatch Rank at level 6 (30 points), reused from Deathwatch.adq.
  - name: "Black Shield"
    container: meta_trait
    tags: [Imperium, Adeptus Astartes, Deathwatch, Chapter Variant]
    disabled: true
    notes: >
      Disabled lens for a Marine who serves with no Chapter badge. Enable
      for -11 points (Black Shield, Deathwatch.adq) and, at the table's
      discretion, disable/replace the Marine's own Chapter Gene-Seed lens
      with the plain Astartes ancestry trait if the character's true
      Chapter is meant to be unknown even to the player — this project
      leaves that choice to the GM rather than assuming it, since Black
      Shields in the fiction sometimes do know their own origin even when
      no one else does.
    children:
      - include: "imperium/deathwatch/traits.yaml#Black Shield"
    lore: See Deathwatch.adq's own Black Shield entry for full sourcing.
    design: Thin wrapper so this template can list Black Shield as a lens alongside the Rank lenses, matching the Chapter Gene-Seed lenses' own container pattern in Astartes Gene-Seed.adq.
  - name: "Veteran (Kill-team Specialist)"
    container: meta_trait
    tags: [Imperium, Adeptus Astartes, Deathwatch]
    disabled: true
    notes: >
      Disabled lens for a Vanguard-tier or otherwise especially
      experienced kill-team veteran. Enable for +25 points, all of it free skill
      points (this lens intentionally adds skill points rather than new
      combat advantages, since the Astartes and Hypno-Indoctrination
      packages already cover reflexes and pain tolerance).
    children:
      - name: Veteran Skill Package
        points: 25
        tags: [Imperium, Deathwatch]
        lore: >
          A Marine who has run enough kill-team postings picks up a
          second specialisation and sharper all-round battlefield
          judgement than a first-tour secondee, matching how Deathwatch
          fiction treats its long-serving Vanguard veterans as
          noticeably more capable than a newly-arrived Battle-Brother,
          without making them a different kind of soldier.
        design: >
          25 points of free skill-point improvement (GM/player allocates
          across this add-on's own skills below, or the Battle-Brother's),
          rather than a second Xenos Hunter Talent level or a new combat
          trait, so a "veteran" build stays a better-trained version of
          the same Marine instead of quietly becoming a Librarian-tier
          specialist through the back door.
    lore: >
      Deathwatch fiction (the Deathwatch anthologies in particular)
      consistently shows its named Vanguard-tier veterans as the ones a
      Watch Captain assigns to the hardest postings, not because they hit
      harder in an absolute sense but because they've simply done this
      longer.
    design: A flat skill-point lens rather than a new combat trait, per the note above.
  - name: "Deathwatch Authority (Ordo Xenos Writ)"
    container: meta_trait
    tags: [Imperium, Deathwatch, Inquisition]
    disabled: true
    notes: >
      Disabled by default (see this file's own point-math note above).
      Enable at level 1 for +5, level 2 for +10, or the full level 3 for
      +15 (Deathwatch.adq).
    children:
      - include: "imperium/deathwatch/traits.yaml#Deathwatch Authority (Ordo Xenos Writ)"
        levels: 1
    lore: See Deathwatch.adq's own entry for sourcing.
    design: Thin wrapper, same pattern as the Black Shield lens above.
skills:
  - include: "imperium/common/skills.yaml#Hidden Lore"
    spec: Xenos
    points: 8
    notes: >
      Add these 8 points to the Battle-Brother's own Hidden Lore (Xenos)
      8 points (already on that template, for 16 total) rather than
      tracking a second entry — a seconded Marine's xenos-lore training
      deepens what he already studied at the Chapter, it doesn't start
      over.
  - name: Tactics
    diff: IQ/H
    points: 8
    tags: [Imperium, Deathwatch]
    lore: >
      Add to the Battle-Brother's own Tactics 24 points (for 32 total):
      cross-Chapter kill-team doctrine specifically, on top of the
      single-Chapter combat doctrine the base template already covers.
    design: >
      8 points of Tactics improvement, same additive-to-the-base-template
      pattern the Hidden Lore (Xenos) line above uses, rather than a
      second stand-alone Tactics entry on the character sheet.
  - name: Survival
    spec: Any
    diff: Per/A
    points: 8
    tags: [Imperium, Deathwatch]
    lore: >
      Add to the Battle-Brother's own Survival (Any) 8 points (for 16
      total): tracking and surviving across whatever terrain a mission
      demands, on worlds no single Chapter trains for.
    design: Additive-to-the-base-template pattern, as above.
  - name: Tracking
    diff: Per/A
    points: 8
    tags: [Imperium, Deathwatch]
    lore: >
      Add to the Battle-Brother's own Tracking 2 points (for 10 total):
      following unfamiliar xenos quarry across terrain built for another
      biology, a routine kill-team task per Deathwatch fiction.
    design: Additive-to-the-base-template pattern, as above.
  - name: Gesture
    diff: IQ/E
    points: 4
    tags: [Imperium, Deathwatch]
    lore: >
      Add to the Battle-Brother's own Gesture 1 point (for 5 total): a
      kill-team drills a shared battle-sign that has to work across
      Chapters with no common signing tradition, not just within one
      Chapter's own squads.
    design: Additive-to-the-base-template pattern, as above.
  - name: Soldier
    diff: IQ/A
    points: 8
    tags: [Imperium, Deathwatch]
    lore: >
      Add to the Battle-Brother's own Soldier 12 points (for 20 total):
      Deathwatch field protocols, Watch Fortress procedure and Ordo
      Xenos liaison work on top of a Marine's own Chapter soldiering.
    design: Additive-to-the-base-template pattern, as above.
  - name: Guns
    spec: Shotgun
    diff: DX/E
    points: 8
    tags: [Imperium, Deathwatch]
    lore: >
      A Deathwatch Marine training on the kill-team's own shotgun and its
      specialist shells, a weapon type the standard Battle-Brother
      template doesn't otherwise train.
    design: >
      New skill line (the base template has no Guns (Shotgun) entry to
      add to), Easy difficulty per the framework's own weapon-skill
      table; priced at a full 8 points (not the 1-2 point "familiarity"
      level) since the shotgun is this add-on's own primary breaching
      weapon, not a rarely-touched sidearm.
equipment:
  - include: "imperium/armour/armour.yaml#Power Armour, Mark VII (Aquila Pattern)"
    name: Power Armour, Deathwatch Livery
    notes: >
      Referenced directly from Imperial Armour.eqp rather than chained
      through Deathwatch Wargear.eqp's own copy of this entry, since this
      project's build tool does not resolve an include-of-an-include; see
      Deathwatch Wargear.eqp for the full note on why this is the same
      suit repainted, not a new one.
  - include: "imperium/deathwatch/wargear.yaml#Boltgun, Stalker Pattern (Deathwatch)"
    equipped: false
    notes: Not equipped by default; swap in for the Battle-Brother's own Boltgun, Godwyn Pattern for a stealth-role loadout.
  - include: "imperium/deathwatch/wargear.yaml#Deathwatch Shotgun"
    equipped: false
    notes: Not equipped by default; swap in for a close-quarters/breaching loadout.
  - include: "imperium/deathwatch/wargear.yaml#Xenophase Blade"
    equipped: false
    notes: Not equipped by default, relic-tier gear; swap in only with GM permission in place of the Battle-Brother's own chainsword or combat knife.
