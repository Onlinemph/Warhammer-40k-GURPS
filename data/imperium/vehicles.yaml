kind: equipment
output: Imperium/Vehicles/Imperial Vehicles.eqp
# Vehicle stat blocks in the Basic Set format (B462-463): ST/HP, Hnd/SR, HT, Move (Acceleration/Top Speed in
# yards/second), LWt. and Load in tons, SM, Occ., DR by facing, Locations (B554). The `vehicle` block is what the
# combat simulator reads; build_gcs.py writes the same numbers into the item's notes as a stat line.
#
# How the numbers are built (docs/framework.md "Vehicles"):
#   HP = 4 x cube root of the curb weight in lb (the Basic Set tables follow it: the APC's 12.5 tons gives 111);
#   ST = HP for a powered vehicle (B462).
#   DR by facing from the framework's AV table: AV10 100, AV11 150, AV12 200, AV13 275, AV14 350. Top and
#   underside take the rear value.
#   SM from the longest dimension (B550), +1 for an elongated box (B550 note), as the APC's +4.
#   Move from lore road speed (km/h / 3.3 = yd/s); Acceleration from the Basic Set's APC (1) scaled by power.
#   Hnd/SR from the APC's -3/5; lighter, faster hulls one better.
#   HT 11-12, "f" for the promethium and multi-fuel engines (Flammable, B462).
# vehicle.crew: one station each, in order of priority (a crewman moves up to an empty station above his own).
#   station: driver | turret | hull | left | right | pintle (where he sits: an occupant hit in the turret finds
#   the turret crew); arc: the weapon's field of fire (turret all round, front, left, right, pintle all round);
#   loads: the station whose gun this loader feeds (halves its reload).
# vehicle.skills: the crew's trained levels, laid over the crew template.
