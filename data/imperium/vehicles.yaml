      are optional in the field; with them the crew is six). The main turret [T]
      jams or loses its gun on a major wound and a failed HT roll (B554).
    lore: >
      The backbone of the Imperial Guard's armoured regiments: 63 tonnes,
      7.08 m long, 35 km/h on a road, 21 km/h across country, a crew of four
      plus two sponson gunners (Imperial Armour Volume One). Front AV14, sides
      AV13, rear AV10; the battle cannon is a large-blast, Strength 8 gun.
    design: >
      HP 4 x cube root of 126,000 lb = 200. Front DR 350 (AV14), sides 275
      (AV13), rear, top and underside 100 (AV10); the turret is as thick at the
      front and sides and a little better than the hull at the back. 7.08 m
      (7.7 yd) gives SM +4, +1 for the box: +5. Move 1/11 (35 km/h): as
      sluggish off the mark as the Basic Set's APC. HT 12: the Leman Russ is
      famous for keeping going.

