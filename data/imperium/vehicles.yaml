    weight: 76000
    tags: [Vehicle, Imperium, Astra Militarum]
    vehicle:
      st_hp: 170
      hnd: -2
      sr: 5
      ht: 11
      ht_code: f
      move: [2, 21]
      lwt: 38
      load: 1.5
      sm: 5
      occ: "3+12S"
      dr: {front: 200, side: 100, rear: 100, top: 100, under: 100}
      turret: {front: 200, side: 100, rear: 100}
      locations: 2Ct
      control: Driving (Tracked)
      crew_template: Astra Militarum Guardsman
      skills: {"Driving (Tracked)": 13, "Gunner (Beams)": 13, "Gunner (Machine Gun)": 13}
      crew:
        - {role: Driver, station: driver}
        - {role: Turret gunner, station: turret, arc: turret, weapon: {item: "Multi-laser, Tripod-Mounted", mode: "Braced/mounted"}, stabilised: false}
        - {role: Hull gunner, station: hull, arc: front, weapon: {item: Heavy Bolter, mode: Standard bolt}}
    notes: >
      Turret multi-laser and hull heavy bolter (the common fit; a heavy flamer can
      replace the bolter). Six lasgun firing ports along the hull for the squad
      inside. Amphibious. The turret is an independent turret [t]: losing it
      leaves the vehicle running.
    lore: >
      The Guard's standard armoured transport, built on every forge world from
      the STC pattern: 38 tonnes, 6.9 m long, up to 70 km/h on a road, crew of
      three and a full infantry squad of twelve (Imperial Armour Volume One).
      Front armour AV12, sides and rear AV10.
    design: >
      HP 4 x cube root of 76,000 lb = 170. Front DR 200 (AV12), the rest 100
      (AV10). 6.9 m (7.5 yd) gives SM +4, +1 for the box hull: +5. Move 2/21
      (70 km/h). Hnd/SR -2/5: a lighter, quicker hull than the Basic Set APC's
      -3/5.

