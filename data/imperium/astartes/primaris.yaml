kind: template
output: Imperium/Templates/Primaris Battle-Brother.gct
notes: >-
  A Primaris Marine of Cawl's design: the full Astartes gene-seed package plus the three Primaris-only
  organs (Sinew Coils, Magnificat, Belisarian Furnace). Skill investment (148 points) is close to the Firstborn Battle-Brother's 168,
  minus Strategy, Wrestling, Axe/Mace and Hidden Lore (Heresy) -- Primaris training is compressed but thorough, and the strain's
  own combat record backs treating a rank-and-file Primaris Battle-Brother as roughly on par with, not
  junior to, a veteran of the old pattern. Equipment (Mk X bolt rifle, Mk X power armour) lives in the
  armoury files, not here.
traits:
- include: "imperium/astartes/gene-seed.yaml#Astartes"
- include: "imperium/astartes/gene-seed.yaml#Primaris Astartes"
- name: Personal Advancement
  points: 60
  attributes:
    dx: 1
    iq: 1
    ht: 1
    will: 1
    per: 1
  tags:
  - Physical
  - Mental
  lore: >-
    Individual variation applies to Primaris Marines the same as Firstborn: the same augmentation regime,
    run through Cawl's expanded gene-seed, still produces a range of outcomes rather than identical copies.
  design: >-
    DX+1 (20) + IQ+1 (20) + HT+1 (10) + Will+1 (5) + Per+1 (5) = 60, matching the Firstborn Battle-Brother's
    Personal Advancement package.
- name: Rank 2 (Battle-Brother, Primaris Strike Force)
  points: 10
  ref: B29
  lore: >-
    Standing within his squad and company, built up over a shorter career than a Firstborn veteran's but
    still marking him as a proven, trusted Battle-Brother.
  design: Rank (B29), 5 points/level, 2 levels = 10 points.
