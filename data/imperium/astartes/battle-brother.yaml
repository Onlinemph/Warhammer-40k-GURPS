kind: template
output: Imperium/Templates/Astartes Battle-Brother.gct
notes: >-
  A Tactical Marine with some decades of service to his Chapter: fully implanted, trained, and combat-proven,
  but not yet a squad Sergeant or Chapter specialist. Point total (physiology + skills, no gear) is about 822, inside the framework's
  550-850 Astartes tier -- a veteran with more time in service, a command
  role, or a Chapter specialty (Apothecary, Techmarine, Chaplain, Librarian) should cost more on top of
  this. Equipment (bolter, power armour, chainsword) is defined in the armoury files, not here; add the
  relevant Chapter Gene-Seed lens from Astartes Gene-Seed.adq for a specific Chapter.
traits:
- include: "imperium/astartes/gene-seed.yaml#Astartes"
- name: Personal Advancement
  points: 60
  attributes:
    dx: 1
    iq: 1
    ht: 1
    will: 1
    per: 1
  tags:
  - Physical
  - Mental
  lore: >-
    No two Battle-Brothers are physiologically identical even off the same gene-seed template, and what
    decades of live combat does to a body and mind that heal and learn far faster than baseline is depicted
    throughout Black Library fiction as making veterans noticeably sharper and tougher than newly-raised
    Battle-Brothers.
  design: >-
    DX+1 (20) + IQ+1 (20) + HT+1 (10) + Will+1 (5) + Per+1 (5) = 60 points of personal growth bought on
    top of the racial baseline.
- name: Rank 3 (Battle-Brother, Veteran)
  points: 15
  ref: B29
  lore: >-
    Recognized standing within the squad and Chapter hierarchy built up over decades: enough seniority
    to be trusted with a fireteam or combat squad in his Sergeant's absence, short of holding a command
    role himself.
  design: Rank (B29), 5 points/level, 3 levels = 15 points.
- name: Reputation (Angel of Death)
  points: 5
  ref: B27
  reactions:
  - situation: from Imperial citizens and Guard who recognize the Chapter's colors
    amount: 2
  lore: >-
    An Astartes in his Chapter's heraldry is instantly recognized by Imperial citizens and soldiery, who
    react with awe, hope, or fear -- a constant, near-universal reaction shown wherever Marines appear
    in the fiction.
  design: >-
    Small, reliably-recognized reaction bonus (+2), priced as a minor Reputation (B27): 5 points.
