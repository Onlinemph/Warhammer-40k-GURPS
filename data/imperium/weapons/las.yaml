kind: equipment
output: Imperium/Weapons/Las Weapons.eqp
items:
  - name: Laspistol, Common Pattern
    tl: 10
    lc: 3
    cost: 150
    weight: 2.5
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 4d(2) burn
        acc: 2
        range: 120/360
        rof: 3
        shots: 30(3)
        st: 5
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Pistol)
    lore: >-
      The commonest sidearm in the Imperium: issued to Guard officers, Munitorum
      staff, hive militia and anyone who rates a weapon above a stub pistol.
      Depicted constantly across Black Library Guard fiction (Gaunt's Ghosts,
      the Ciaphas Cain novels) as the backup weapon of choice once a soldier's
      lasgun runs dry or their hands are full.
    design: >-
      Damage is the fixed laspistol anchor (4d(2) burn, updated with the
      armour rescale below). Average roll 14 already kills an unarmoured
      man (HP 10) in 1-2 hits per framework.md; the (2) divisor is carried
      by every las weapon in the post-Rescale lineup so a laspistol still
      means something against flak (DR 30, effective 15): 4d(2) penetrates
      33.6% of hits there, but never against carapace (DR 70, effective 35)
      — 0% of hits get through. Acc, range, RoF and
      shot count are not anchored, so they're built from scratch for a
      hand-held energy pistol: a smaller accumulator than a lasgun's gives
      roughly half the lasgun's shot count (30 vs. 60), and the short
      emitter keeps Bulk and ST modest. RoF 3 represents the selector's
      rapid-pulse setting rather than a sustained full-auto mode.
      Handling: min ST 5 matches framework.md's √(10×weight) formula almost
      exactly for a 2.5 lb pistol (√25=5), so it needs no adjustment - a
      low-recoil beam sidearm this light sits right at the formula's
      baseline. Bulk -2 and Rcl 1 are ordinary low-recoil pistol figures.

  - name: Laspistol, Compact "Hostile Environment" Pattern
    tl: 10
    lc: 3
    cost: 180
    weight: 2
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 4d(2) burn
        acc: 1
        range: 80/240
        rof: 3
        shots: 20(3)
        st: 4
        bulk: -1
        rcl: 1
        skill: Beam Weapons (Pistol)
    lore: >-
      A shortened laspistol favoured by commissars and naval officers who
      need a weapon that won't print under a greatcoat; several Commissar
      characters across Guard fiction are shown carrying a compact sidearm
      distinct from a trooper's full-size laspistol, though no single novel
      gives it a formal designation, so "Hostile Environment Pattern" here is
      a descriptive label rather than an attested in-universe name.
    design: >-
      Damage stays at the fixed laspistol anchor (4d(2) burn) — shrinking
      the emitter doesn't change the lasing chemistry or the focusing coil
      that gives it the (2) divisor, only its housing. A smaller cell drops
      the shot count to 20 and shortens effective range; the shorter barrel
      worsens Acc by 1 but improves Bulk to -1, which is the standard GURPS
      trade a concealable pistol makes against a full-size one.
      Handling: min ST corrected to 4 (√(10×2)≈4.5, rounded down) from a
      previous flat 5 copied from the full-size pistol above - a lighter,
      shorter housing needs a hair less strength to control even though the
      lasing chemistry is unchanged. Bulk -1 and Rcl 1 are unchanged.

  - name: Lasgun, Kantrael Pattern
    tl: 10
    lc: 3
    cost: 500
    weight: 8
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 7d(2) burn
        acc: 6
        range: 300/900
        rof: 10
        shots: 60(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
      - usage: Hot-shot pack
        damage: 8d(3) burn
        acc: 6
        range: 300/900
        rof: 1
        shots: 1(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
        notes: >-
          Fired with a Hot-Shot Power Pack loaded in place of the standard
          charge pack. The cell is spent after this one shot, and firing a
          second hot-shot round without replacing the pack risks cooking off
          or fusing the lasing chamber (GM's call).
      - usage: Overcharge shot
        damage: 8d burn
        acc: 6
        range: 300/900
        rof: 1
        shots: 10(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
        notes: >-
          Fired from an Overcharge Power Pack: one extra die of damage over
          the standard shot, but no armour divisor, and the deliberately
          overloaded cell only lasts for 10 such shots and increases the
          odds of a jam or a scorched barrel on any given shot (GM's call).
    lore: >-
      The most widely issued lasgun in the Astra Militarum, standard
      Departmento Munitorum pattern and the rifle carried by the Cadian
      shock troops in codex background and countless Black Library novels.
      Some Munitorum logistics texts refer to the same basic mass-production
      design as "M-Galaxy pattern"; this entry treats the two names as the
      same underlying weapon rather than asserting they're formally distinct.
    design: >-
      Damage is the fixed lasgun anchor, raised to 7d(2) burn across two
      rounds of the armour rescale (flak 12→18→30, carapace 45→60→70).
      Range/RoF/shots are not anchored and are built to match the lasgun's
      lore signature: a 60-shot accumulator that recharges off almost any
      power source, and a fire selector giving single, burst and full-auto
      settings (abstracted here as RoF 10 for full-auto; treat single fire
      as RoF 1 at the GM's discretion). Required lasgun-vs-armour check
      (framework.md, exact dice distribution): 7d(2) averages 24.5 and
      penetrates flak (DR 30, effective 15) on 97.8% of hits, matching
      "punches flak"; against carapace (DR 70, effective 35) it penetrates
      0.6% of hits, matching "penetrates carapace about one hit in ten" only
      loosely now that carapace has been raised twice - the user's own
      figure, kept as given. Against Astartes power armour (DR 100,
      effective 50, unchanged by both rescales) it penetrates 0% of hits,
      matching "useless against power armour." The Hot-shot pack usage
      reuses the hellgun anchor (8d(3) burn) exactly, since a hot-shot pack
      is explicitly the same overcharge trick as a hellgun's power cell,
      just dropped into an ordinary lasgun for one shot. The Overcharge
      usage is a milder, non-hellgun field expedient stepped up from the
      lasgun anchor: +1 die (8d burn, average 28), no armour divisor,
      limited shots — it still clears flak (30.5% of hits) but fails
      against mesh (3.9%) and carapace (0% of hits), because the whole
      point of the divisor is what an overcharge pack doesn't add.
      Handling: min ST corrected to 9 for all three usages (standard,
      hot-shot pack, overcharge shot - it's the same physical rifle, so
      they share one ST figure), matching framework.md's own worked example
      of √(10×8)≈9 for an 8 lb rifle almost exactly. The previous ST 6 on
      this and every other lasgun pattern in this file understated the
      handling of a shoulder rifle by three whole points against the
      framework's explicit guidance - it has been corrected here and on
      every pattern below. RoF 10 (full-auto) and RoF 1 (single fire, hot-
      shot and overcharge, since neither the hot-shot pack nor the
      overcharge cell is rated for autofire) reflect the lasgun's actual
      fire-selector modes rather than a single blanket value; Bulk -4 and
      Rcl 1 are unchanged, appropriate for a full-length rifle with almost
      no felt recoil.

  - name: Lasgun, Mars Pattern
    tl: 10
    lc: 3
    cost: 650
    weight: 9.5
    tags: [Missile Weapon, Imperium, Adeptus Mechanicus]
    weapons:
      - usage: Standard
        damage: 7d(2) burn
        acc: 6
        range: 300/900
        rof: 10
        shots: 60(3)
        st: 10
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      Forge-produced to exacting Mechanicus ritual-specification, the Mars
      pattern is prized for durability and is common among Skitarii auxilia
      and Mechanicus-aligned regiments; codex and Forge World background
      repeatedly single it out as the most rugged of the mass-production
      lasgun patterns.
    design: >-
      Same fixed lasgun anchor (7d(2) burn) as every pattern in this family —
      the difference is build quality, not lasing power. Extra shielding and
      a reinforced housing add roughly 1.5 lb and 1 ST over the Kantrael
      baseline and justify the higher cost. GCS has no reliability/
      malfunction stat, so the pattern's noted ruggedness is left as lore
      flavour rather than a mechanical bonus.
      Handling: min ST corrected to 10 (√(10×9.5)≈9.7, rounded up), one
      point over the corrected Kantrael figure of 9, matching the extra
      shielding and reinforced housing this pattern is built with. RoF,
      Bulk and Rcl are unchanged from the Kantrael baseline.

  - name: Lasgun, Accatran Pattern
    tl: 10
    lc: 3
    cost: 520
    weight: 8.5
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 7d(2) burn
        acc: 6
        range: 280/840
        rof: 10
        shots: 60(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      Sealed-housing pattern associated with the Death Korps of Krieg,
      built for trench warfare, gas attack and sustained exposure to mud and
      ash — a design emphasis that recurs throughout Krieg background art
      and Forge World material.
    design: >-
      Damage fixed at the lasgun anchor (7d(2) burn); the sealed barrel shroud
      that keeps mud and gas out marginally shortens the beam path, modelled
      as a small range reduction (280/840 vs. the Kantrael's 300/900) rather
      than any change to the fixed damage figure.
      Handling: min ST corrected to 9, matching the Kantrael's corrected
      figure (√(10×8.5)≈9.2) - the sealed shroud changes range, not the
      rifle's actual mass enough to move the rounded ST. RoF, Bulk and Rcl
      are unchanged.

  - name: Lasgun, Lucius Pattern
    tl: 10
    lc: 3
    cost: 550
    weight: 6.5
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 7d(2) burn
        acc: 6
        range: 300/900
        rof: 10
        shots: 60(3)
        st: 8
        bulk: -3
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      A lighter, sleeker lasgun pattern; Gaunt's Ghosts establishes the
      Tanith First's lasguns as this pattern, and the novels note it as
      reliable but less tolerant of mud and rough handling than the
      heavier Munitorum-standard patterns.
    design: >-
      Damage fixed at the lasgun anchor (7d(2) burn) — a slimmer frame doesn't
      change the lasing chamber's output. The lighter build lowers ST
      requirement and improves Bulk to -3 (vs. -4 for the Kantrael/Mars/
      Accatran patterns), reflecting the more compact, less rugged design.
      Its documented fragility in mud has no GCS reliability stat to hang
      on, so it's recorded here as flavour only.
      Handling: min ST corrected to 8 (√(10×6.5)≈8.1), a point below the
      corrected Kantrael figure of 9, for the lighter, slimmer frame Gaunt's
      Ghosts describes - still following the framework's sqrt formula, just
      from a lower starting weight. RoF and Rcl are unchanged; Bulk stays
      one step better than the standard pattern's -4.

  - name: Lasgun, Triplex Pattern
    tl: 10
    lc: 3
    cost: 560
    weight: 8.5
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Burst (3-round)
        damage: 7d(2) burn
        acc: 7
        range: 300/900
        rof: 3
        shots: 60(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
      - usage: Full Auto
        damage: 7d(2) burn
        acc: 6
        range: 300/900
        rof: 10
        shots: 60(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      Named for its three-position fire selector, the Triplex pattern adds a
      mechanical 3-round burst mode on top of the usual single/full-auto
      options found across the standard lasgun family.
    design: >-
      Damage fixed at the lasgun anchor (7d(2) burn) for both modes — the
      selector changes how the shots are grouped, not the lasing output.
      The controlled 3-round burst gets a +1 Acc bump over the full-auto
      line (7 vs. 6) to represent the tighter grouping a mechanical burst
      limiter gives compared to unrestrained full-auto fire.
      Handling: min ST corrected to 9 for both modes (√(10×8.5)≈9.2, same
      weight class as the Accatran pattern), sharing one figure since it's
      the same physical rifle on two fire-selector settings. RoF 3 for the
      controlled burst and RoF 10 for full-auto correctly reflect two
      different mechanical modes rather than one blanket rate copied across
      both lines. Bulk -4 and Rcl 1 are unchanged.

  - name: Lascarbine
    tl: 10
    lc: 3
    cost: 480
    weight: 6
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 7d(2) burn
        acc: 5
        range: 200/600
        rof: 10
        shots: 60(3)
        st: 8
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      A cut-down lasgun issued to vehicle crew, tank riders and scouts who
      need something more compact than a full-length rifle; short-barrelled
      lasguns of this kind appear throughout Guard fiction as tank-crew and
      support-trooper sidearms.
    design: >-
      Damage fixed at the lasgun anchor (7d(2) burn); the lasing chemistry
      that produces that figure doesn't depend on barrel length the way a
      slugthrower's velocity does, so the carbine's shorter emitter only
      costs Acc and effective range (5/200-600 vs. the full lasgun's
      6/300-900) while buying a much better Bulk (-2) for cramped vehicle
      interiors.
      Handling: min ST corrected to 8 (√(10×6)≈7.75), following the same
      formula as every other lasgun pattern in this file rather than the
      previous flat 5 shared with the pistols. RoF 10 and Rcl 1 are
      unchanged.

  - name: Long-Las
    tl: 10
    lc: 2
    cost: 1200
    weight: 11
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 8d(2) burn
        acc: 9
        range: 600/1800
        rof: 1
        shots: 20(3)
        st: 10
        bulk: -6
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      A sniper-modified lasgun with an added focusing lens and a stabilised
      barrel; Gaunt's Ghosts' marksman Mad Larkin's long-las is the best
      known example, and the weapon recurs as the Guard's standard sniper
      tool across Black Library fiction.
    design: >-
      Damage is the fixed long-las anchor (8d(2) burn), one die over the
      standard lasgun — an extra focusing chamber concentrates more energy
      per shot at the cost of rate of fire, and keeps the same (2) divisor
      family-wide. Average roll 28 makes flak (DR 30) nearly a non-issue
      (99.6% of hits penetrate) and gets through carapace (DR 70, effective
      35) on 6.1% of hits, comfortably better than the lasgun's 0.6% and
      matching the long-las's role as the harder-hitting sniper pattern; it
      still fails outright against Astartes power armour (0% of hits, eff.
      DR 50 unchanged by both armour rescales). RoF drops
      to 1 (no autofire mechanism survives the rebuild) and the custom cell
      holds fewer shots than a stock lasgun. Acc rises to 9 for the integral
      scope, and Bulk worsens to -6 for the longer, heavier weapon, following
      the usual GURPS convention for a dedicated sniper rifle.
      Handling: min ST corrected to 10 (√(10×11)≈10.5), following the
      framework formula for an 11 lb rifle rather than the previous flat 7 -
      a heavier barrel and stock for stability costs more strength to
      shoulder, not less, than a standard lasgun. RoF 1, Bulk -6 and Rcl 1
      are unchanged.

  - name: Hellpistol
    tl: 11
    lc: 2
    cost: 700
    weight: 3
    tags: [Missile Weapon, Imperium, Militarum Tempestus]
    weapons:
      - usage: Standard
        damage: 7d(3) burn
        acc: 2
        range: 100/300
        rof: 3
        shots: 16(3)
        st: 6
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Pistol)
    lore: >-
      A compact hot-shot sidearm issued alongside the hellgun to Militarum
      Tempestus officers and Inquisitorial agents who need a backup weapon
      that can still trouble carapace armour.
    design: >-
      Scaled from the hellgun anchor (8d(3) burn) the same way the
      laspistol steps down one die from the lasgun: -1d, armour divisor
      unchanged. The (3) divisor is what lets it beat carapace at all —
      that's the entire point of the hot-shot family, so it carries over
      unmodified. Average roll 24.5 against carapace (DR 70, effective 23.3)
      penetrates 58.6% of hits: a real threat, if less reliable than the
      full-size hellgun's 82.1%. Shot count is lower than an ordinary
      laspistol's because a hot-shot cell packs more energy per shot into
      the same volume, so it burns out faster.
      Handling: min ST 6 (√(10×3)≈5.5, rounded up for the reinforced
      housing a hot-shot cell needs even at pistol scale) sits a point
      above an ordinary laspistol's ST 5 for the same reason the full
      hellgun needs more ST than a standard lasgun. RoF 3, Bulk -2 and Rcl
      1 are ordinary pistol figures.

  - name: Hellgun
    tl: 11
    lc: 2
    cost: 1600
    weight: 9
    tags: [Missile Weapon, Imperium, Militarum Tempestus]
    weapons:
      - usage: Standard
        damage: 8d(3) burn
        acc: 6
        range: 280/840
        rof: 10
        shots: 40(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      The signature weapon of the Militarum Tempestus Scions, an overcharged
      lasgun-pattern rifle purpose-built to beat armour a standard lasgun
      can't; its role as the carapace-killer of Imperial small arms is
      consistent background across Scion-focused fiction and codex material.
    design: >-
      Damage is the fixed hellgun anchor, raised to 8d(3) burn across two
      rounds of the armour rescale. Sanity check against the framework's
      stated purpose, computed by exact dice distribution: average roll 28,
      armour divisor 3 cuts carapace's DR 70 to an effective 23.3, so 8d(3)
      penetrates carapace on 82.1% of hits — it reliably beats carapace,
      confirming "built to beat carapace" with no adjustment needed. Against
      Sororitas power armour (DR 85, effective 28.3) it still gets through
      46.0% of the time; against Astartes power armour (DR 100, effective
      33.3, unchanged by both rescales) that drops to 13.0%, matching
      hellgun's place below the boltgun as an infantry-scale weapon. Shot
      count (40) is lower than a
      standard lasgun's 60 to reflect the hungrier, hotter cell.
      Handling: min ST corrected to 9 (√(10×9)≈9.5, rounded down), matching
      the framework formula for a 9 lb rifle - a point above a standard
      lasgun's corrected ST of 9 at the same nominal weight would suggest,
      reflecting the extra containment shielding an overcharged cell needs;
      the previous flat ST 7 undersold how much of a handful a hellgun
      actually is. RoF 10, Bulk -4 and Rcl 1 are unchanged.

  - name: Hot-Shot Volley Gun
    tl: 11
    lc: 2
    cost: 4200
    weight: 30
    tags: [Missile Weapon, Imperium, Militarum Tempestus]
    weapons:
      - usage: Standard
        damage: 8d(3) burn
        acc: 4
        range: 280/840
        rof: 6
        shots: 60(5)
        st: 10B
        bulk: -6
        rcl: 1
        skill: Gunner (Beams)
    lore: >-
      A rare, high-maintenance support weapon fielded by elite Tempestus
      heavy-weapon teams, firing a rapid volley of hot-shot bolts for
      suppressive anti-armour and anti-elite infantry work; referenced in
      Militarum Tempestus background material as scarce and Munitorum-
      restricted compared to the standard hellgun.
    design: >-
      Per-bolt damage is the hellgun anchor (8d(3) burn) unchanged, since
      the volley gun is simply several hellgun-grade lasing chambers fired
      in quick succession rather than one bigger blast. RoF 6 represents
      that volley of near-simultaneous pulses. It's mounted (ST 10B on a
      tripod or pintle) and uses Gunner (Beams) per framework.md's rule that
      braced/mounted heavies use the Gunner skill family rather than Beam
      Weapons.
      Handling: ST 10B (bipod/tripod) is unchanged - the mount bears most of
      the 30 lb loaded weight, so the ST figure covers aim and recoil rather
      than the raw √(10×30)≈17.3 a shoulder-fired weapon this heavy would
      need, consistent with the other mounted weapons in this project's
      heavy-weapons file. RoF 6, Bulk -6 and Rcl 1 are unchanged.

  - name: Charge Pack, Laspistol
    tl: 10
    lc: 3
    cost: 10
    weight: 0.5
    tags: [Imperium, Astra Militarum]
    lore: >-
      The standard rechargeable accumulator cell for a laspistol; widely
      depicted as rechargeable from almost any generator, or slowly by a
      hand-crank in the field when nothing else is available.
    design: >-
      Pure ammunition item, no weapon stats of its own — it's what "30(3)"
      on the laspistol's shot line refers to. Capacity matches the common
      pattern laspistol's shot count.

  - name: Charge Pack, Lasgun
    tl: 10
    lc: 3
    cost: 15
    weight: 1
    tags: [Imperium, Astra Militarum]
    lore: >-
      The standard 60-shot accumulator cell shared by every lasgun pattern
      in Munitorum service; its 60-round capacity is one of the most
      consistently repeated facts about the lasgun across Imperial Guard
      background material.
    design: >-
      Pure ammunition item matching the "60(3)" shot line common to every
      lasgun pattern above.

  - name: Charge Pack, Long-Las
    tl: 10
    lc: 2
    cost: 40
    weight: 1.5
    tags: [Imperium, Astra Militarum]
    lore: >-
      A higher-capacity, tighter-tolerance cell built for the long-las's
      focusing chamber; sniper teams are consistently shown carrying extra
      packs rather than relying on field recharge, since a spoiled cell
      ruins the rifle's accuracy.
    design: >-
      Pure ammunition item matching the long-las's "20(3)" shot line.
      Restricted to LC 2 in line with the rifle's own sniper-issue legality.

  - name: Hot-Shot Power Pack
    tl: 11
    lc: 2
    cost: 60
    weight: 1
    tags: [Imperium, Militarum Tempestus]
    lore: >-
      The superheated power cell standard to the hellgun and hellpistol,
      and the same item Guardsmen famously slot into an ordinary lasgun to
      turn it into a one-shot hellgun in a pinch — a trick referenced
      repeatedly in Guard-focused fiction and RPG background alike.
    design: >-
      Pure ammunition item; it's what unlocks the "Hot-shot pack" usage
      line on the Kantrael lasgun above (and, at the GM's discretion, on any
      other lasgun pattern) as well as powering the hellgun/hellpistol's
      standard fire. The overheat risk after use is a roleplaying
      consequence noted on those weapons' usage lines rather than a GCS
      stat, since the schema has no malfunction field (the plasma gun
      anchor has the same limitation).

  - name: Overcharge Power Pack
    tl: 10
    lc: 3
    cost: 40
    weight: 1
    tags: [Imperium, Astra Militarum]
    lore: >-
      A lasgun accumulator cell deliberately overloaded for extra punch per
      shot — a field-expedient trick short of a true hot-shot conversion,
      well short of hellgun performance but easier to come by.
    design: >-
      Pure ammunition item backing the "Overcharge shot" usage line on the
      Kantrael lasgun above: +1 die of damage, no armour divisor, and a
      short 10-shot life before the cell is spent.
