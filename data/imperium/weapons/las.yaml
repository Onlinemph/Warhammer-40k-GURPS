kind: equipment
output: Imperium/Weapons/Las Weapons.eqp
items:
  - name: Laspistol, Common Pattern
    tl: 10
    lc: 3
    cost: 150
    weight: 2.5
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 3d(2) burn
        acc: 2
        range: 120/360
        rof: 3
        shots: 30(3)
        st: 5
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Pistol)
    lore: >-
      The commonest sidearm in the Imperium: issued to Guard officers, Munitorum
      staff, hive militia and anyone who rates a weapon above a stub pistol.
      Depicted constantly across Black Library Guard fiction (Gaunt's Ghosts,
      the Ciaphas Cain novels) as the backup weapon of choice once a soldier's
      lasgun runs dry or their hands are full.
    design: >-
      Damage is the fixed laspistol anchor (3d(2) burn). Average roll 10.5
      already kills an unarmoured man (HP 10) in 1-2 hits per framework.md;
      the (2) divisor is carried by every las weapon in the post-Rescale
      lineup so a laspistol still means something against flak (DR 12):
      3d(2) penetrates 90.7% of hits there, but never against carapace
      (DR 45, effective 22.5) — 0% of hits get through. Acc, range, RoF and
      shot count are not anchored, so they're built from scratch for a
      hand-held energy pistol: a smaller accumulator than a lasgun's gives
      roughly half the lasgun's shot count (30 vs. 60), and the short
      emitter keeps Bulk and ST modest. RoF 3 represents the selector's
      rapid-pulse setting rather than a sustained full-auto mode.

  - name: Laspistol, Compact "Hostile Environment" Pattern
    tl: 10
    lc: 3
    cost: 180
    weight: 2
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 3d(2) burn
        acc: 1
        range: 80/240
        rof: 3
        shots: 20(3)
        st: 5
        bulk: -1
        rcl: 1
        skill: Beam Weapons (Pistol)
    lore: >-
      A shortened laspistol favoured by commissars and naval officers who
      need a weapon that won't print under a greatcoat; several Commissar
      characters across Guard fiction are shown carrying a compact sidearm
      distinct from a trooper's full-size laspistol, though no single novel
      gives it a formal designation, so "Hostile Environment Pattern" here is
      a descriptive label rather than an attested in-universe name.
    design: >-
      Damage stays at the fixed laspistol anchor (3d(2) burn) — shrinking
      the emitter doesn't change the lasing chemistry or the focusing coil
      that gives it the (2) divisor, only its housing. A smaller cell drops
      the shot count to 20 and shortens effective range; the shorter barrel
      worsens Acc by 1 but improves Bulk to -1, which is the standard GURPS
      trade a concealable pistol makes against a full-size one.

  - name: Lasgun, Kantrael Pattern
    tl: 10
    lc: 3
    cost: 500
    weight: 8
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 5d(2) burn
        acc: 6
        range: 300/900
        rof: 10
        shots: 60(3)
        st: 6
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
      - usage: Hot-shot pack
        damage: 6d(3) burn
        acc: 6
        range: 300/900
        rof: 1
        shots: 1(3)
        st: 6
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
        notes: >-
          Fired with a Hot-Shot Power Pack loaded in place of the standard
          charge pack. The cell is spent after this one shot, and firing a
          second hot-shot round without replacing the pack risks cooking off
          or fusing the lasing chamber (GM's call).
      - usage: Overcharge shot
        damage: 6d burn
        acc: 6
        range: 300/900
        rof: 1
        shots: 10(3)
        st: 6
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
        notes: >-
          Fired from an Overcharge Power Pack: one extra die of damage over
          the standard shot, but no armour divisor, and the deliberately
          overloaded cell only lasts for 10 such shots and increases the
          odds of a jam or a scorched barrel on any given shot (GM's call).
    lore: >-
      The most widely issued lasgun in the Astra Militarum, standard
      Departmento Munitorum pattern and the rifle carried by the Cadian
      shock troops in codex background and countless Black Library novels.
      Some Munitorum logistics texts refer to the same basic mass-production
      design as "M-Galaxy pattern"; this entry treats the two names as the
      same underlying weapon rather than asserting they're formally distinct.
    design: >-
      Damage is the fixed lasgun anchor (5d(2) burn). Range/RoF/shots are not
      anchored and are built to match the lasgun's lore signature: a 60-shot
      accumulator that recharges off almost any power source, and a fire
      selector giving single, burst and full-auto settings (abstracted here
      as RoF 10 for full-auto; treat single fire as RoF 1 at the GM's
      discretion). Required lasgun-vs-armour check (framework.md, exact dice
      distribution): 5d(2) averages 17.5 and penetrates flak (DR 12,
      effective 6) on 99.9% of hits, matching "punches flak"; against
      carapace (DR 45, effective 22.5) it penetrates only 9.8% of hits,
      matching "penetrates carapace about one hit in ten"; against Astartes
      power armour (DR 100, effective 50) it penetrates 0% of hits, matching
      "useless against power armour." No departure from the anchor was
      needed — the numbers check out as written. The Hot-shot pack usage
      reuses the hellgun anchor (6d(3) burn) exactly, since a hot-shot pack
      is explicitly the same overcharge trick as a hellgun's power cell,
      just dropped into an ordinary lasgun for one shot. The Overcharge
      usage is a milder, non-hellgun field expedient stepped up from the
      lasgun anchor: +1 die (6d burn, average 21), no armour divisor,
      limited shots — it still only clears flak (98.0% of hits) and fails
      against carapace (0% of hits), because the whole point of the divisor
      is what an overcharge pack doesn't add.

  - name: Lasgun, Mars Pattern
    tl: 10
    lc: 3
    cost: 650
    weight: 9.5
    tags: [Missile Weapon, Imperium, Adeptus Mechanicus]
    weapons:
      - usage: Standard
        damage: 5d(2) burn
        acc: 6
        range: 300/900
        rof: 10
        shots: 60(3)
        st: 7
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      Forge-produced to exacting Mechanicus ritual-specification, the Mars
      pattern is prized for durability and is common among Skitarii auxilia
      and Mechanicus-aligned regiments; codex and Forge World background
      repeatedly single it out as the most rugged of the mass-production
      lasgun patterns.
    design: >-
      Same fixed lasgun anchor (5d(2) burn) as every pattern in this family —
      the difference is build quality, not lasing power. Extra shielding and
      a reinforced housing add roughly 1.5 lb and 1 ST over the Kantrael
      baseline and justify the higher cost. GCS has no reliability/
      malfunction stat, so the pattern's noted ruggedness is left as lore
      flavour rather than a mechanical bonus.

  - name: Lasgun, Accatran Pattern
    tl: 10
    lc: 3
    cost: 520
    weight: 8.5
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 5d(2) burn
        acc: 6
        range: 280/840
        rof: 10
        shots: 60(3)
        st: 6
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      Sealed-housing pattern associated with the Death Korps of Krieg,
      built for trench warfare, gas attack and sustained exposure to mud and
      ash — a design emphasis that recurs throughout Krieg background art
      and Forge World material.
    design: >-
      Damage fixed at the lasgun anchor (5d(2) burn); the sealed barrel shroud
      that keeps mud and gas out marginally shortens the beam path, modelled
      as a small range reduction (280/840 vs. the Kantrael's 300/900) rather
      than any change to the fixed damage figure.

  - name: Lasgun, Lucius Pattern
    tl: 10
    lc: 3
    cost: 550
    weight: 6.5
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 5d(2) burn
        acc: 6
        range: 300/900
        rof: 10
        shots: 60(3)
        st: 5
        bulk: -3
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      A lighter, sleeker lasgun pattern; Gaunt's Ghosts establishes the
      Tanith First's lasguns as this pattern, and the novels note it as
      reliable but less tolerant of mud and rough handling than the
      heavier Munitorum-standard patterns.
    design: >-
      Damage fixed at the lasgun anchor (5d(2) burn) — a slimmer frame doesn't
      change the lasing chamber's output. The lighter build lowers ST
      requirement and improves Bulk to -3 (vs. -4 for the Kantrael/Mars/
      Accatran patterns), reflecting the more compact, less rugged design.
      Its documented fragility in mud has no GCS reliability stat to hang
      on, so it's recorded here as flavour only.

