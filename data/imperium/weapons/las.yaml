    weapons:
      - usage: Burst (3-round)
        damage: 4d burn
        acc: 7
        range: 300/900
        rof: 3
        shots: 60(3)
        st: 6
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
      - usage: Full Auto
        damage: 4d burn
        acc: 6
        range: 300/900
        rof: 10
        shots: 60(3)
        st: 6
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      Named for its three-position fire selector, the Triplex pattern adds a
      mechanical 3-round burst mode on top of the usual single/full-auto
      options found across the standard lasgun family.
    design: >-
      Damage fixed at the lasgun anchor (4d burn) for both modes — the
      selector changes how the shots are grouped, not the lasing output.
      The controlled 3-round burst gets a +1 Acc bump over the full-auto
      line (7 vs. 6) to represent the tighter grouping a mechanical burst
      limiter gives compared to unrestrained full-auto fire.

  - name: Lascarbine
    tl: 10
