    weapons:
      - usage: Standard
        damage: 4d burn
        acc: 5
        range: 200/600
        rof: 10
        shots: 60(3)
        st: 5
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      A cut-down lasgun issued to vehicle crew, tank riders and scouts who
      need something more compact than a full-length rifle; short-barrelled
      lasguns of this kind appear throughout Guard fiction as tank-crew and
      support-trooper sidearms.
    design: >-
      Damage fixed at the lasgun anchor (4d burn); the lasing chemistry
      that produces that figure doesn't depend on barrel length the way a
      slugthrower's velocity does, so the carbine's shorter emitter only
      costs Acc and effective range (5/200-600 vs. the full lasgun's
      6/300-900) while buying a much better Bulk (-2) for cramped vehicle
      interiors.

  - name: Long-Las
    tl: 10
    lc: 2
    cost: 1200
    weight: 11
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 5d burn
        acc: 9
        range: 600/1800
        rof: 1
        shots: 20(3)
        st: 7
        bulk: -6
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      A sniper-modified lasgun with an added focusing lens and a stabilised
      barrel; Gaunt's Ghosts' marksman Mad Larkin's long-las is the best
      known example, and the weapon recurs as the Guard's standard sniper
      tool across Black Library fiction.
    design: >-
      Damage is the fixed long-las anchor (5d burn), one die over the
      standard lasgun — an extra focusing chamber concentrates more energy
      per shot at the cost of rate of fire. RoF drops to 1 (no autofire
      mechanism survives the rebuild) and the custom cell holds fewer shots
      than a stock lasgun. Acc rises to 9 for the integral scope, and Bulk
      worsens to -6 for the longer, heavier weapon, following the usual
      GURPS convention for a dedicated sniper rifle.

  - name: Hellpistol
    tl: 11
    lc: 2
    cost: 700
    weight: 3
    tags: [Missile Weapon, Imperium, Militarum Tempestus]
    weapons:
      - usage: Standard
        damage: 4d(2) burn
        acc: 2
        range: 100/300
        rof: 3
        shots: 16(3)
        st: 6
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Pistol)
    lore: >-
      A compact hot-shot sidearm issued alongside the hellgun to Militarum
      Tempestus officers and Inquisitorial agents who need a backup weapon
      that can still trouble carapace armour.
    design: >-
      Scaled from the hellgun anchor (5d(2) burn) the same way the
      laspistol steps down one die from the lasgun: -1d, armour divisor
      unchanged. The (2) divisor is what lets it beat carapace at all —
      that's the entire point of the hot-shot family, so it carries over
      unmodified. Shot count is lower than an ordinary laspistol's because a
      hot-shot cell packs more energy per shot into the same volume, so it
      burns out faster.

  - name: Hellgun
    tl: 11
    lc: 2
    cost: 1600
    weight: 9
    tags: [Missile Weapon, Imperium, Militarum Tempestus]
    weapons:
      - usage: Standard
        damage: 5d(2) burn
        acc: 6
        range: 280/840
        rof: 10
        shots: 40(3)
        st: 7
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      The signature weapon of the Militarum Tempestus Scions, an overcharged
      lasgun-pattern rifle purpose-built to beat armour a standard lasgun
      can't; its role as the carapace-killer of Imperial small arms is
      consistent background across Scion-focused fiction and codex material.
    design: >-
      Damage is the fixed hellgun anchor (5d(2) burn) exactly. Sanity check
      against the framework's stated purpose: average roll 17.5, armour
      divisor 2 halves carapace's DR 20 to an effective 10, so ~7.5 points
      get through on an average hit — it reliably beats carapace, confirming
      "built to beat carapace" with no adjustment needed. Shot count (40) is
      lower than a standard lasgun's 60 to reflect the hungrier, hotter
      cell; ST is bumped to 7 for the heavier housing needed to safely
      contain the higher-energy discharge.

  - name: Hot-Shot Volley Gun
    tl: 11
    lc: 2
    cost: 4200
    weight: 30
    tags: [Missile Weapon, Imperium, Militarum Tempestus]
    weapons:
      - usage: Standard
        damage: 5d(2) burn
        acc: 4
        range: 280/840
        rof: 6
        shots: 60(5)
        st: 10B
        bulk: -6
        rcl: 1
        skill: Gunner (Beams)
    lore: >-
      A rare, high-maintenance support weapon fielded by elite Tempestus
      heavy-weapon teams, firing a rapid volley of hot-shot bolts for
      suppressive anti-armour and anti-elite infantry work; referenced in
      Militarum Tempestus background material as scarce and Munitorum-
      restricted compared to the standard hellgun.
    design: >-
      Per-bolt damage is the hellgun anchor (5d(2) burn) unchanged, since
      the volley gun is simply several hellgun-grade lasing chambers fired
      in quick succession rather than one bigger blast. RoF 6 represents
      that volley of near-simultaneous pulses. It's mounted (ST 10B on a
      tripod or pintle) and uses Gunner (Beams) per framework.md's rule that
      braced/mounted heavies use the Gunner skill family rather than Beam
      Weapons.

  - name: Charge Pack, Laspistol
    tl: 10
    lc: 3
    cost: 10
    weight: 0.5
    tags: [Imperium, Astra Militarum]
    lore: >-
      The standard rechargeable accumulator cell for a laspistol; widely
      depicted as rechargeable from almost any generator, or slowly by a
      hand-crank in the field when nothing else is available.
    design: >-
      Pure ammunition item, no weapon stats of its own — it's what "30(3)"
      on the laspistol's shot line refers to. Capacity matches the common
      pattern laspistol's shot count.

  - name: Charge Pack, Lasgun
    tl: 10
    lc: 3
    cost: 15
    weight: 1
    tags: [Imperium, Astra Militarum]
    lore: >-
      The standard 60-shot accumulator cell shared by every lasgun pattern
      in Munitorum service; its 60-round capacity is one of the most
      consistently repeated facts about the lasgun across Imperial Guard
      background material.
    design: >-
      Pure ammunition item matching the "60(3)" shot line common to every
      lasgun pattern above.

  - name: Charge Pack, Long-Las
    tl: 10
    lc: 2
    cost: 40
    weight: 1.5
    tags: [Imperium, Astra Militarum]
    lore: >-
      A higher-capacity, tighter-tolerance cell built for the long-las's
      focusing chamber; sniper teams are consistently shown carrying extra
      packs rather than relying on field recharge, since a spoiled cell
      ruins the rifle's accuracy.
    design: >-
      Pure ammunition item matching the long-las's "20(3)" shot line.
      Restricted to LC 2 in line with the rifle's own sniper-issue legality.

  - name: Hot-Shot Power Pack
    tl: 11
    lc: 2
    cost: 60
    weight: 1
    tags: [Imperium, Militarum Tempestus]
    lore: >-
      The superheated power cell standard to the hellgun and hellpistol,
      and the same item Guardsmen famously slot into an ordinary lasgun to
      turn it into a one-shot hellgun in a pinch — a trick referenced
      repeatedly in Guard-focused fiction and RPG background alike.
    design: >-
      Pure ammunition item; it's what unlocks the "Hot-shot pack" usage
      line on the Kantrael lasgun above (and, at the GM's discretion, on any
      other lasgun pattern) as well as powering the hellgun/hellpistol's
      standard fire. The overheat risk after use is a roleplaying
      consequence noted on those weapons' usage lines rather than a GCS
      stat, since the schema has no malfunction field (the plasma gun
      anchor has the same limitation).

  - name: Overcharge Power Pack
    tl: 10
    lc: 3
    cost: 40
    weight: 1
    tags: [Imperium, Astra Militarum]
    lore: >-
      A lasgun accumulator cell deliberately overloaded for extra punch per
      shot — a field-expedient trick short of a true hot-shot conversion,
      well short of hellgun performance but easier to come by.
    design: >-
      Pure ammunition item backing the "Overcharge shot" usage line on the
      Kantrael lasgun above: +1 die of damage, no armour divisor, and a
      short 10-shot life before the cell is spent.
