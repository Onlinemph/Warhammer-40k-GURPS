      is lighter than a plasma or melta charge assembly; min ST 19 (√(10×40)≈20, rounded to match
      the boltgun's own housing) and Bulk -5 apply to both barrels. RoF is per-mechanism: bolter
      barrel RoF 3 (semi/burst), flamer barrel RoF 1 (a cone attack fired once per fuel charge, not
