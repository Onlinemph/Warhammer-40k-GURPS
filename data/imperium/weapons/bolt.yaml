  - name: Boltgun, Godwyn Pattern
    tl: 10
    lc: 1
    cost: 1200
    weight: 38
    tags: [Missile Weapon, Imperium, Adeptus Astartes, Astra Militarum]
    weapons:
      - usage: Standard bolt
        damage: 6dx2(2) pi++
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Standard bolt, follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Kraken penetrator round
        damage: 6dx2(3) pi
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Dense penetrator core sacrifices most of the mass-reactive filler for armour penetration:
          wounding drops from pi++ to pi and the follow-up shrinks, but it punches through what a
          standard bolt cannot.
      - usage: Kraken penetrator round, follow-up (if bolt penetrates)
        damage: 2d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Vengeance round
        damage: 6dx2(2) pi++
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Same penetration as a standard bolt against personal armour, but its warhead is tuned to
          punish void shields, force fields and daemonic constructs: GM should waive any Force
          Field/Deflector DR bonus and, in campaigns using the framework's Warp rules, treat this
          as the anti-Unholy round of choice.
      - usage: Vengeance round, follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Hellfire round
        damage: 3dx2(2) pi
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Thin-walled shell carries an acid-secreting bio-payload instead of most of its penetrator
          mass, hence the lighter base damage.
      - usage: Hellfire round, follow-up (if bolt penetrates; organic targets only)
        damage: 3d(5) tox
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Represents the payload eating through living tissue once inside; it does nothing extra
          to vehicles, synthetics or anything else without flesh to dissolve, so apply this
          follow-up only against organic targets.
      - usage: Metal Storm round
        damage: 7d pi [3d pi]
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Bursts into a flechette cloud rather than punching through as a single penetrator: no
          armour divisor, and the bracketed dice are the fragmentation, not a separate follow-up
          line. Good against unarmoured hordes, poor against anything with real DR.
      - usage: Inferno bolt (Deathwatch pattern)
        damage: 6dx2(2) pi++
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Deathwatch kill-team ammunition pairing a standard penetrator core with a phosphex/
          promethium secondary charge; the primary shot is unchanged from a standard bolt.
      - usage: Inferno bolt, follow-up (if bolt penetrates)
        damage: 8d burn ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
        notes: The frag concussion of a standard bolt is replaced by an incendiary flash.
      - usage: Sanctified round
        damage: 6dx2(2) pi++
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Rounds blessed by a Chaplain or Ecclesiarchy priest over holy oils and sacred purity
          seals; no mechanical change against mundane DR. GM discretion whether these carry a bonus
          against the daemonic or undead under the campaign's Unholy/Warp rules.
      - usage: Sanctified round, follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      The Godwyn-De'az pattern is the boltgun the fiction treats as the baseline: a self-contained,
      rocket-assisted .75-calibre round whose motor ignites a few metres clear of the muzzle,
      widely depicted (Horus Heresy and modern Black Library alike) as capable of blowing an
      unarmoured man apart and reliably punching through carapace plate, while a Space Marine can
      shrug off a few hits from another Marine's boltgun before going down. Special Issue Ammunition
      (Kraken, Hellfire, Metal Storm, Vengeance) is Deathwatch's own term and rulebook material;
      Inferno bolts are that line's Deathwatch-specific incendiary load; sanctified/blessed
      ammunition is a recurring detail in Adepta Sororitas and Chaplain background with no stated
      mechanical difference against armour.
    design: >
      This is the project's fixed boltgun anchor: 6dx2(2) pi++ with a 6d cr ex follow-up (per the
      framework's damage table; user-set minimum). Against Astartes power armour (torso DR 100) the
      armour divisor (2) drops effective DR to 50; 6dx2 averages 42, so it penetrates about 14% of
      hits (exact dice distribution) and still has to beat the wearer's HP with the pi++ wounding
      bonus and the 6d cr ex follow-up when it does, matching "a Marine takes several bolts to kill
      another Marine." Against carapace (DR 45, effective DR 22) it penetrates 99% of hits, against
      Adepta Sororitas armour (DR 70, effective DR 35) 79%, and against an unarmoured man or flak
      (DR 12, effective DR 6) it is always lethal - all as the framework specifies. Against Mk X
      Gravis (DR 130, effective DR 65) it drops to 0.2%, and it essentially never beats a Terminator
      (DR 200, effective DR 100). Kraken keeps the same 6dx2 dice but swaps the armour divisor to
      (3) and drops the wounding modifier from pi++ to pi (less internal fragmentation, more punch)
      and shrinks the follow-up from 6d to 2d cr ex; against Astartes (effective DR 33) that raises
      penetration to 100%, and against a Terminator (effective DR 66) to 85%, trading wounding
      multiplier and blast for a much better chance of getting through heavy plate at all. Hellfire
      and Metal Storm are built from Deathwatch's stated design intent (anti-organic, anti-horde)
      translated into GURPS damage types (tox for the bio-payload, a fragmentation bracket for the
      flechette cloud) rather than lifted from any catalogue entry: Hellfire keeps the standard
      round's x2(2) mechanism but halves the dice (3dx2(2) pi, since most of the penetrator mass is
      sacrificed for payload) and its tox follow-up (3d(5) tox, organic targets only) is untouched
      by the rescale since it never interacted with DR the same way; Metal Storm is bumped from 5d
      pi [2d pi] to 7d pi [3d pi] to stay comfortably ahead of the new, higher flak/carapace
      baseline while remaining exactly what it was - a no-armour-divisor flechette cloud, lethal to
      unarmoured hordes and irrelevant against real plate. Vengeance and sanctified rounds are
      modelled as unchanged ballistically from the standard round (6dx2(2) pi++ / 6d cr ex), since
      neither RPG nor Codex material describes a different penetrator, with their special property
      left as a notes-level rule the GM applies. Inferno bolts keep the standard penetrator (6dx2(2)
      pi++) and double their incendiary follow-up from 4d to 8d burn ex, matching the doubled
      standard follow-up.
      Handling: this entry is also the project's fixed handling anchor for every Astartes-pattern
      boltgun on this page. Loaded weight is set to 38 lb per the framework's own guidance (an
      Astartes Godwyn boltgun runs about 35-40 lb loaded; Deathwatch lists 18 kg ≈ 39.7 lb). Min ST
      19 follows √(10×38)≈19.5, exactly the framework's worked example for "a 36 lb Astartes
      boltgun": a Guardsman (ST 10-11) can lift it but fires it at a heavy under-ST penalty two-
      handed, while a Marine at ST 30 comfortably exceeds 1.5×19=28.5 and fires it one-handed, as
      the fiction consistently shows. RoF 3 reflects the boltgun's actual cyclic action - a
      recoil-operated mechanism firing large, rocket-propelled cartridges, not a true high-cyclic
      autoloader - per framework.md's "bolters fire slower, heavier rounds (boltgun 3 semi or
      burst)" rule; every ammunition usage above shares this RoF and the same 24-round sickle
      magazine (Shots 24(3), the standard capacity across Black Library and Codex background) since
      swapping ammunition doesn't change the action. Bulk -5, one step worse than a human rifle's
      -4, per the framework's rule that Astartes-pattern weapons are a step bulkier than a human
      weapon of the same type; Rcl 3 matches framework.md's "bolters 3-4" band, and Acc 4 sits in
      the rifle range (4-5) appropriate to iron sights and a scope rail rather than a dedicated
      optic.

  - name: Boltgun, Sororitas/Human Pattern
    tl: 10
    lc: 1
    cost: 1200
    weight: 19
    tags: [Missile Weapon, Imperium, Adepta Sororitas, Inquisition, Astra Militarum]
    weapons:
      - usage: Standard bolt
        damage: 6dx2(2) pi++
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 14
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
      - usage: Follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 14
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      Not every boltgun-armed Imperial servant is a Space Marine: Adepta Sororitas Battle Sisters,
      Inquisitors, commissar-general staff and other elite, unaugmented humans are shown across
      Black Library and Codex background wielding full boltguns despite lacking Astartes-grade
      strength - the recoil is punishing and the weapon a real handful, but never depicted as
      literally unliftable the way an Astartes boltgun would be for an ordinary Guardsman. This
      entry gives that human-scale weapon its own line rather than folding it silently into the
      Astartes-pattern stat block above, per the framework's rule that human- and Astartes-scale
      versions of the same weapon type need different min ST and weight, not just a relabelling.
    design: >
      Same fixed boltgun anchor damage as every other pattern in this family (6dx2(2) pi++,
      follow-up 6d cr ex) - a Sister of Battle's bolter kills exactly as hard as a Marine's, per the
      framework's "internal consistency" goal (a bolter built for the Astartes armoury and one
      carried by a Sister of Battle are the same weapon with the same numbers, only the frame
      scales down to a human grip).
      Handling: built to roughly half the Astartes anchor's loaded weight, per the framework's
      explicit guidance ("a human-scale boltgun roughly half that" of the ~38 lb Astartes figure) -
      19 lb loaded, a lighter alloy stock and shortened housing rather than a different mechanism.
      Min ST 14 (√(10×19)≈13.8) is still well above a standard lasgun's ST 9, reflecting a
      genuinely heavy, hard-recoiling weapon for an unaugmented human - a Guardsman-strength user
      (ST 10-11) fires it at a real but survivable under-ST penalty, unlike the Astartes-pattern
      guns above which are effectively unusable by anyone that light. Bulk -4 matches a human rifle
      of this size (one step better than the Astartes pattern's -5, since there's simply less gun
      to carry); RoF 3, Rcl 3, Acc 4 and the 24-round sickle magazine are unchanged from the
      Astartes-pattern anchor, since the action and cartridge are identical - only the stock is
      cut down.

