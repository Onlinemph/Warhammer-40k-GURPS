      Standard Godwyn-anchor damage (6dx2(2) pi++, follow-up 6d cr ex; the cartridge itself is not
      upgraded, unlike the Primaris bolt rifle above) with RoF doubled to 6 and a bigger 30-round
      magazine, at the cost of Acc and range falling below even a legacy boltgun to reflect the
      shorter, gas-hungrier barrel that lore says trades reach for volume.

