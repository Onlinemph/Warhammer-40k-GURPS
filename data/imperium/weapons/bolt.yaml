      A simplified, mass-production pattern associated in Imperial Armour-style background with
      wartime attrition manufacture: cheaper to produce in bulk than Godwyn or Umbra lines, at some
      cost to finish and long-term reliability that the fiction gestures at without quantifying.
    design: >
      Same anchor damage (6dx2(2) pi++, follow-up 6d cr ex); the only intended difference from
      Godwyn is manufacture quality, reflected in cost, not a performance edge. This project does
      not model a reliability penalty for it (no Malf value is given anywhere in this file), since
      the fiction never quantifies one; a GM wanting to dramatise "mass-production and less
      reliable" can assign a house Malf rating without touching these numbers.
      Handling: still a full Astartes-pattern boltgun - a slightly plainer receiver shaves 2 lb off
      the Godwyn anchor's 38 lb rather than changing the gun's class, landing at 36 lb (min ST 19,
      √(10×36)≈19, unchanged from the anchor at this rounding). RoF 3, Shots 24(3), Bulk -5 and Rcl
      3 all match the Godwyn anchor exactly - a mass-production line is cheaper to build, not a
      different weapon to fire.

  # -------------------------------------------------------- crew-served / mounted

  - name: Storm Bolter
    tl: 10
    lc: 1
    cost: 1900
    weight: 40
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
        damage: 6dx2(2) pi++
        acc: 4
        range: 200/1000
        rof: 3x2
        shots: 60(3)
        st: 20
        bulk: -6
        rcl: 4
        skill: Guns (Rifle)
      - usage: Follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 4
        range: 200/1000
        rof: 3x2
        shots: 60(3)
        st: 20
        bulk: -6
        rcl: 4
        skill: Guns (Rifle)
    lore: >
      Twinned boltgun barrels sharing a single trigger and (usually) a large drum or box magazine,
      standard wargear for Terminator squads and a common pintle/hull weapon on Imperial vehicles;
      Codex and Horus Heresy background consistently shows it as simply "two boltguns fired
      together," not a more powerful round.
    design: >
      Same .75-calibre bolt and therefore the same damage line (6dx2(2) pi++ / 6d cr ex follow-up,
      identical to the standard Boltgun, Godwyn Pattern's penetration checks) as the Godwyn anchor;
      "rof: 3x2" captures the twin-linked barrels doubling the effective volume of fire per the
      standard GURPS convention for linked weapons.
      Handling: two full boltgun actions and a bigger drum magazine make this noticeably heavier
      than a single Godwyn-pattern gun - 40 lb loaded, roughly two barrels' worth of receiver
      sharing one stock and trigger group rather than twice the weight of one gun. Min ST 20
      (√(10×40)≈20) sits a point above the single-barrel anchor, and the 60-round magazine matches
      the larger drums shown in art and background (Shots 60(3)). Bulk -6 (one step worse than a
      single boltgun's -5) and Rcl 4 (up from 3) reflect the twin barrels' combined mass and kick.
      Listed here for infantry (Terminator, ST 20) use with Guns (Rifle); a vehicle- or turret-
      mounted storm bolter should instead use Gunner (Machine Gun) per the framework's skill table,
      with no change to the damage line.

  - name: Heavy Bolter
    tl: 10
    lc: 1
    cost: 3500
    weight: 85
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
        damage: 7dx2(2) pi++
        acc: 5
        range: 400/2000
        rof: 8
        shots: 60(5)
        st: 14B
        bulk: -7
        rcl: 4
        skill: Gunner (Machine Gun)
      - usage: Follow-up (if bolt penetrates)
        damage: 8d cr ex
        acc: 5
        range: 400/2000
        rof: 8
        shots: 60(5)
        st: 14B
        bulk: -7
        rcl: 4
        skill: Gunner (Machine Gun)
    lore: >
      The Imperium's standard support-weapon bolter, tripod- or vehicle-mounted, firing an
      oversized bolt round; consistently shown chewing through infantry and light vehicles alike
      while remaining useless against a main battle tank's frontal armour.
    design: >
      This is the project's second fixed anchor: 7dx2(2) pi++, follow-up 8d cr ex (exact dice
      distribution computed with a Python script, not just averages). Checked against the vehicle
      armour table: AV10 (DR 100, e.g. a Sentinel or a Chimera's side) has effective DR 50 against
      the armour divisor (2); 7dx2 averages 49 and penetrates 41% of hits, "chewing" light vehicles
      about 40% of the time as required. AV11 (DR 150, Rhino front/sides, effective DR 75) drops to
      0.1%, and AV12-14 (DR 200-350) are effectively 0%, so it does not reliably hurt medium- or
      heavy-armoured vehicles - both outcomes match the assignment's check. Against a suit of
      Astartes power armour (DR 100, effective DR 50) it penetrates the same 41% of hits, and it
      essentially never beats a Terminator (DR 200, effective DR 100) - a support weapon that
      threatens infantry and armour alike but not the heaviest plate.
      Handling: an oversized cartridge and a tripod-grade receiver put this at 85 lb loaded, close
      to Deathwatch's own figure for the weapon (roughly 40 kg with its mount). Min ST 14B: the "B"
      (bipod/tripod) marks that the mount, not the gunner's back, bears most of that weight, so the
      ST figure covers recoil control rather than the raw sqrt(10×85)≈29 a shoulder-fired weapon
      this heavy would need - comparable to the similarly mounted Autocannon (85 lb, ST 14M)
      elsewhere in this project. RoF 8 follows framework.md's explicit "heavy bolter around 8"
      guidance - a genuine sustained-fire support weapon, faster than an infantry boltgun's
      semi/burst RoF 3 but well below a true chain-driven autoloader. Bulk -7 and Rcl 4 mark a
      support weapon needing a mount or a very strong shooter (only Astartes or a braced tripod).

  # -------------------------------------------------------------- Primaris bolt

  - name: Bolt Rifle, Primaris Pattern
    tl: 10
    lc: 1
    cost: 1400
    weight: 22
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
        damage: 6d+1x2(2) pi++
        acc: 5
        range: 300/1200
        rof: 3
        shots: 20(3)
        st: 15
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
      - usage: Follow-up (if bolt penetrates)
        damage: 6d+1 cr ex
        acc: 5
        range: 300/1200
        rof: 3
        shots: 20(3)
        st: 15
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      Introduced with the Primaris Space Marines, current Codex background describes the bolt
      rifle as firing a slightly more powerful cartridge with improved sights and effective range
      compared with a legacy boltgun, without claiming it is a different order of weapon.
    design: >
      One pip over the Godwyn anchor (6d+1x2(2) pi++ / 6d+1 cr ex follow-up) for the "more powerful
      cartridge" the Codex claims, plus a real jump in Acc (5 vs 4) and range (300/1200 vs
      200/1000) for the improved optics and barrel. Magazine capacity (20) sits below the legacy
      boltgun's 24 to reflect the bulkier round in the same-size housing. Against Astartes power
      armour (DR 100, effective DR 50) the extra pip nudges the average from 42 to 44 and raises
      penetration from the standard bolt's 14% to about 21% (exact dice distribution) - a small
      but real edge from the "more powerful cartridge," most visible against exactly the kind of
      target (power armour) the Codex text is describing.
      Handling: a lighter, more refined Astartes-pattern build than the legacy line - Codex
      background credits Primaris weapons with improved engineering, modelled here as 22 lb loaded
      against the legacy Godwyn's 38 lb, still very much an Astartes-scale weapon and nowhere near
      a human-portable one. Min ST 15 (√(10×22)≈14.8) follows from that lighter housing. Bulk -4
      (one step better than the legacy Astartes pattern's -5) matches the sleeker, more modern
      silhouette Codex art gives it; RoF 3 keeps the standard boltgun cyclic rate (it's a
      designated-marksman pattern, not an assault weapon - see the Auto Bolt Rifle below for that
      role), and Rcl 3 is unchanged.

  - name: Auto Bolt Rifle, Primaris Pattern
    tl: 10
    lc: 1
    cost: 1350
    weight: 24
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
        damage: 6dx2(2) pi++
        acc: 3
        range: 200/900
        rof: 6
        shots: 30(3)
        st: 15
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
      - usage: Follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 3
        range: 200/900
        rof: 6
        shots: 30(3)
        st: 15
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      A Primaris pattern optimised for volume of fire over range, background material frames it as
      trading the bolt rifle's reach for a much higher cyclic rate, closer in role to an assault
      weapon than the standard bolt rifle's designated-marksman feel.
    design: >
      Standard Godwyn-anchor damage (6dx2(2) pi++, follow-up 6d cr ex; the cartridge itself is not
      upgraded, unlike the Primaris bolt rifle above) with RoF doubled to 6 and a bigger 30-round
      magazine, at the cost of Acc and range falling below even a legacy boltgun to reflect the
      shorter, gas-hungrier barrel that lore says trades reach for volume.
      Handling: same lighter Primaris-pattern housing as the Bolt Rifle above (24 lb loaded, min ST
      15, √(10×24)≈15.5), with a shorter barrel and a bigger feed mechanism to sustain RoF 6 rather
      than the standard pattern's semi/burst RoF 3 - a genuine mechanism difference, not a
      relabelled rifle, per lore's framing of it as closer to an assault weapon. Bulk -4 and Rcl 3
      match the Bolt Rifle's figures, since the extra rate of fire comes from the feed and action,
      not a heavier or more awkward gun.

  - name: Stalker Bolt Rifle, Primaris Pattern
    tl: 10
    lc: 1
    cost: 1600
    weight: 23
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Subsonic bolt
        damage: 6dx2(2) pi++
        acc: 6
        range: 400/1600
        rof: 1
        shots: 12(3)
        st: 15
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Subsonic bolt, follow-up (if bolt penetrates)
        damage: 4d cr ex
        acc: 6
        range: 400/1600
        rof: 1
        shots: 12(3)
        st: 15
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      A precision, semi-automatic-only bolt rifle firing subsonic ammunition for use by Vanguard
      Primaris squads and scout patterns operating covertly; background stresses stealth and
      one-shot precision over rate of fire.
    design: >
      Penetrator dice are unchanged from the Godwyn anchor (6dx2(2) pi++; the subsonic load does not
      need to lose penetration to stay quiet), but the follow-up drops from the anchor's 6d cr ex to
      4d cr ex, the same one-third cut as the old scale's 3d-to-2d: a subsonic round has less
      kinetic energy at impact to trigger a full-yield detonation of the internal charge.
      Handling: same Primaris-pattern housing weight class as the other two rifles above (23 lb
      loaded, min ST 15), with an integral suppressor and heavier barrel shroud pushing Bulk to -5
      (worse than the standard Primaris bolt rifle's -4, matching the legacy Astartes pattern's
      figure) for the extra bulk that quiets the report. RoF 1 (single shots only, per its
      lore role as a precision weapon rather than a volume weapon) and Acc 6 - the best of any
      weapon on this page thanks to integral optics - reflect a rifle built to place one round
      exactly, not spray a squad's worth of fire.

  # -------------------------------------------------------------- combi-weapons

  - name: Combi-Weapon, Bolter/Plasma
    tl: 10
    lc: 1
    cost: 2600
    weight: 42
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Bolter barrel
        damage: 6dx2(2) pi++
        acc: 4
        range: 200/1000
        rof: 3
        shots: 20(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Bolter barrel, follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 20(3)
        st: 19
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Plasma barrel (single shot)
        damage: 6dx4(3) burn ex
        acc: 3
        range: 150/450
        rof: 1
        shots: 1(20)
        st: 19
        bulk: -5
        rcl: 2
        skill: Beam Weapons (Rifle)
        notes: >
          One shot before the auxiliary barrel's charge must be replaced; there is no room in the
          slaved barrel for an overcharge coil, so this barrel has no supercharged mode.
    lore: >
      Combi-weapons fuse a standard boltgun with a single-shot auxiliary barrel of a rarer special
      weapon, common Astartes wargear (especially for Chaplains, Sergeants and Deathwatch
      Space Marines) when a squad needs one extra answer to armour or a specific threat without
      giving up bolter fire entirely.
    design: >
      The bolter barrel is the Godwyn anchor (6dx2(2) pi++, follow-up 6d cr ex) with a reduced
      magazine (20 vs 24) to make room for the auxiliary mechanism; the plasma barrel reuses the
      plasma gun's standard-mode damage line unchanged (6dx4(3) burn ex, see Plasma Weapons) since
      it is the same cartridge in a smaller reservoir, just good for one shot per reload.
      Handling: both barrels share one stock, so both usage lines carry the same handling figures.
      A full Astartes boltgun receiver plus a slaved plasma barrel and reservoir pushes total
      loaded weight to 42 lb - above the plain Godwyn-pattern boltgun's 38 lb, but well under
      carrying a separate boltgun and plasma pistol - and min ST to 19 (√(10×42)≈20.5, rounded to
      match the dominant bolter action). Bulk -5 matches a legacy Astartes boltgun's figure. RoF
      is per-mechanism, not copy-pasted: the bolter barrel keeps the standard semi/burst RoF 3,
      while the plasma barrel is corrected to RoF 1 (a single-shot auxiliary reservoir cannot
      cycle for a second pulse until reloaded - the previous RoF 3 on a "shots: 1(20)" line was
      self-contradictory) per framework.md's plasma-weapons rule.

