    design: >
      Same anchor damage (6dx2(2) pi++, follow-up 6d cr ex); the only numeric difference from
      Godwyn is a lower cost (cheaper mass manufacture) and slightly lower weight. This project does
      not model a reliability penalty for it (no Malf value is given anywhere in this file), since
      the fiction never quantifies one; a GM wanting to dramatise "mass-production and less
      reliable" can assign a house Malf rating without touching these numbers.

  # -------------------------------------------------------- crew-served / mounted

  - name: Storm Bolter
    tl: 10
    lc: 1
    cost: 1900
    weight: 22
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
        damage: 6dx2(2) pi++
        acc: 4
        range: 200/1000
        rof: 3x2
        shots: 60(3)
        st: 12
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 4
        range: 200/1000
        rof: 3x2
        shots: 60(3)
        st: 12
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      Twinned boltgun barrels sharing a single trigger and (usually) a large drum or box magazine,
      standard wargear for Terminator squads and a common pintle/hull weapon on Imperial vehicles;
      Codex and Horus Heresy background consistently shows it as simply "two boltguns fired
      together," not a more powerful round.
    design: >
      Same .75-calibre bolt and therefore the same damage line (6dx2(2) pi++ / 6d cr ex follow-up,
      identical to the standard Boltgun, Godwyn Pattern's penetration checks) as the Godwyn anchor;
      "rof: 3x2" captures the twin-linked barrels doubling the effective volume of fire per the
      standard GURPS convention for linked weapons, and the 60-round magazine matches the larger
      drums shown in art and background. Listed here for infantry (Terminator, ST 12) use with Guns
      (Rifle); a vehicle- or turret-mounted storm bolter should instead use Gunner (Machine Gun) per
      the framework's skill table, with no change to the damage line.

  - name: Heavy Bolter
    tl: 10
    lc: 1
    cost: 3500
    weight: 60
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
        damage: 7dx2(2) pi++
        acc: 5
        range: 400/2000
        rof: 6
        shots: 60(5)
        st: 14
        bulk: -6
        rcl: 4
        skill: Gunner (Machine Gun)
      - usage: Follow-up (if bolt penetrates)
        damage: 8d cr ex
        acc: 5
        range: 400/2000
        rof: 6
        shots: 60(5)
        st: 14
        bulk: -6
        rcl: 4
        skill: Gunner (Machine Gun)
    lore: >
      The Imperium's standard support-weapon bolter, tripod- or vehicle-mounted, firing an
      oversized bolt round; consistently shown chewing through infantry and light vehicles alike
      while remaining useless against a main battle tank's frontal armour.
    design: >
      This is the project's second fixed anchor: 7dx2(2) pi++, follow-up 8d cr ex (exact dice
      distribution computed with a Python script, not just averages). Checked against the vehicle
      armour table: AV10 (DR 100, e.g. a Sentinel or a Chimera's side) has effective DR 50 against
      the armour divisor (2); 7dx2 averages 49 and penetrates 41% of hits, "chewing" light vehicles
      about 40% of the time as required. AV11 (DR 150, Rhino front/sides, effective DR 75) drops to
      0.1%, and AV12-14 (DR 200-350) are effectively 0%, so it does not reliably hurt medium- or
      heavy-armoured vehicles - both outcomes match the assignment's check. Against a suit of
      Astartes power armour (DR 100, effective DR 50) it penetrates the same 41% of hits, and it
      essentially never beats a Terminator (DR 200, effective DR 100) - a support weapon that
      threatens infantry and armour alike but not the heaviest plate. ST 14 and ROF 6 reflect a
      genuine support weapon needing a mount or a very strong shooter (only Astartes or a braced
      tripod).

  # -------------------------------------------------------------- Primaris bolt

  - name: Bolt Rifle, Primaris Pattern
    tl: 10
    lc: 1
    cost: 1400
    weight: 13
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
        damage: 6d+1x2(2) pi++
        acc: 5
        range: 300/1200
        rof: 3
        shots: 20(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
      - usage: Follow-up (if bolt penetrates)
        damage: 6d+1 cr ex
        acc: 5
        range: 300/1200
        rof: 3
        shots: 20(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      Introduced with the Primaris Space Marines, current Codex background describes the bolt
      rifle as firing a slightly more powerful cartridge with improved sights and effective range
      compared with a legacy boltgun, without claiming it is a different order of weapon.
    design: >
      One pip over the Godwyn anchor (6d+1x2(2) pi++ / 6d+1 cr ex follow-up) for the "more powerful
      cartridge" the Codex claims, plus a real jump in Acc (5 vs 4) and range (300/1200 vs
      200/1000) for the improved optics and barrel. Magazine capacity (20) sits below the legacy
      boltgun's 24 to reflect the bulkier round in the same-size housing. Against Astartes power
      armour (DR 100, effective DR 50) the extra pip nudges the average from 42 to 44 and raises
      penetration from the standard bolt's 14% to about 21% (exact dice distribution) - a small
      but real edge from the "more powerful cartridge," most visible against exactly the kind of
      target (power armour) the Codex text is describing.

