    lore: >
      One of the older mass-produced boltgun patterns, predating Godwyn-De'az manufacture in
      several Chapter armouries and Forge World background as a heavier, more conservatively built
      weapon kept in service out of reliability and reverence rather than performance.
    design: >
      Fires the same standard .75-calibre mass-reactive bolt as every other weapon on this page, so
