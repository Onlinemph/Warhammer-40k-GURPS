      Penetrator dice are unchanged from the Godwyn anchor (the subsonic load does not need to lose
      penetration to stay quiet), but the follow-up drops from 3d cr ex to 2d cr ex: a subsonic
      round has less kinetic energy at impact to trigger a full-yield detonation of the internal
      charge. Acc is the best of any weapon on this page (integral optics, single shots only, RoF
      1) and Bulk is worse (-5) for the built-in suppressor/barrel shroud.

