    design: >
      Same anchor damage; the only numeric difference from Godwyn is a lower cost (cheaper mass
      manufacture) and slightly lower weight. This project does not model a reliability penalty for
      it (no Malf value is given anywhere in this file), since the fiction never quantifies one; a
      GM wanting to dramatise "mass-production and less reliable" can assign a house Malf rating
      without touching these numbers.

  # -------------------------------------------------------- crew-served / mounted

  - name: Storm Bolter
    tl: 10
    lc: 1
    cost: 1900
    weight: 22
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
        damage: 6d(2) pi+
        acc: 4
        range: 200/1000
        rof: 3x2
        shots: 60(3)
        st: 12
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Follow-up (if bolt penetrates)
        damage: 3d cr ex
        acc: 4
        range: 200/1000
        rof: 3x2
        shots: 60(3)
        st: 12
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      Twinned boltgun barrels sharing a single trigger and (usually) a large drum or box magazine,
      standard wargear for Terminator squads and a common pintle/hull weapon on Imperial vehicles;
      Codex and Horus Heresy background consistently shows it as simply "two boltguns fired
      together," not a more powerful round.
    design: >
      Same .75-calibre bolt and therefore the same damage line as the Godwyn anchor; "rof: 3x2"
      captures the twin-linked barrels doubling the effective volume of fire per the standard GURPS
      convention for linked weapons, and the 60-round magazine matches the larger drums shown in
      art and background. Listed here for infantry (Terminator, ST 12) use with Guns (Rifle); a
      vehicle- or turret-mounted storm bolter should instead use Gunner (Machine Gun) per the
      framework's skill table, with no change to the damage line.

  - name: Heavy Bolter
    tl: 10
    lc: 1
    cost: 3500
    weight: 60
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
