items:

  # ---------------------------------------------------------------- pistols

  - name: Bolt Pistol, Godwyn-De'az Pattern
    tl: 10
    lc: 1
    cost: 500
    weight: 5
    tags: [Missile Weapon, Imperium, Inquisition, Astra Militarum]
    weapons:
      - usage: Standard bolt
        damage: 5dx2(2) pi++
        acc: 2
        range: 120/400
        rof: 3
        shots: 8(3)
        st: 10†
        bulk: -2
        rcl: 3
        skill: Guns (Pistol)
      - usage: Follow-up (if bolt penetrates)
        damage: 5d cr ex
        acc: 2
        range: 120/400
        rof: 3
        shots: 8(3)
        st: 10†
        bulk: -2
        rcl: 3
        skill: Guns (Pistol)
    lore: >
      The human-portable bolt pistol, most commonly the Godwyn-De'az pattern that shares its
      mass-reactive .75-calibre round with the standard Godwyn boltgun, is issued to Inquisitorial
      acolytes, commissars, veteran officers and other elite humans rather than to rank-and-file
      Guardsmen, who are more usually equipped with an autopistol or laspistol if they carry a
      sidearm at all. Dark Heresy and Rogue Trader both depict it as a prized, LC1 weapon whose
      recoil is punishing for an unaugmented shooter.
    design: >
      Scaled down one die from the Godwyn boltgun anchor (6dx2(2) pi++, see the standard Boltgun,
      Godwyn Pattern entry) to 5dx2(2) pi++: the bolt's rocket motor ignites a few metres clear of
      the muzzle and does most of the accelerating, so a shorter pistol barrel costs less damage
      than a conventional gunpowder round would lose, but it still loses something to the reduced
      initial propellant charge and shorter sighting radius. The follow-up scales the same way,
      one die down from the boltgun's 6d cr ex anchor to 5d cr ex. Special ammunition (Kraken,
      Hellfire, etc.) is not repeated here; see the Boltgun, Godwyn Pattern entry for full stats,
      all of which are loaded in .75-calibre pistol form as well as rifle form per Deathwatch's
      Special Issue Ammunition rules.
      Handling: 5 lb loaded, in line with Dark Heresy/Rogue Trader's roughly 2.5 kg figure for a
      human-portable bolt pistol. Min ST 10† (√(10×5)≈7, bumped up three for the punishing recoil
      of a mass-reactive round fired from a pistol frame - unusually high for a service pistol,
      compare a normal GURPS pistol's ST 8-9) reflects the "hard for unaugmented humans to handle"
      property the fiction keeps returning to; the † lets it be fired two-handed at the listed ST,
      one-handed by anyone under ST 10 at the standard penalty for shooting under minimum ST. RoF 3
      is the standard semi-automatic rate every boltgun in this file uses (per framework.md, a
      bolt weapon is not a true rapid-fire autoloader). Shots 8(3): an 8-round box magazine, short
      compared with a rifle's, and a quick 3-second reload. Bulk -2 and Rcl 3 are ordinary pistol
      figures, the latter elevated slightly above a stub pistol's for the bolt's initial kick.

  - name: Bolt Pistol, Mk II Phobos-Pattern
    tl: 10
    lc: 0
