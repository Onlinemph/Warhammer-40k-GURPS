  - name: Boltgun, Godwyn Pattern
    tl: 10
    lc: 1
    cost: 1200
    weight: 14
    tags: [Missile Weapon, Imperium, Adeptus Astartes, Astra Militarum]
    weapons:
      - usage: Standard bolt
        damage: 6d(2) pi+
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
      - usage: Standard bolt, follow-up (if bolt penetrates)
        damage: 3d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
      - usage: Kraken penetrator round
        damage: 6d(3) pi
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Dense penetrator core sacrifices most of the mass-reactive filler for armour penetration:
          wounding drops from pi+ to pi and the follow-up shrinks, but it punches through what a
          standard bolt cannot.
      - usage: Kraken penetrator round, follow-up (if bolt penetrates)
        damage: 1d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
      - usage: Vengeance round
        damage: 6d(2) pi+
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Same penetration as a standard bolt against personal armour, but its warhead is tuned to
          punish void shields, force fields and daemonic constructs: GM should waive any Force
          Field/Deflector DR bonus and, in campaigns using the framework's Warp rules, treat this
          as the anti-Unholy round of choice.
      - usage: Vengeance round, follow-up (if bolt penetrates)
        damage: 3d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
      - usage: Hellfire round
        damage: 3d(2) pi
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Thin-walled shell carries an acid-secreting bio-payload instead of most of its penetrator
          mass, hence the lighter base damage.
      - usage: Hellfire round, follow-up (if bolt penetrates; organic targets only)
        damage: 3d(5) tox
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Represents the payload eating through living tissue once inside; it does nothing extra
          to vehicles, synthetics or anything else without flesh to dissolve, so apply this
          follow-up only against organic targets.
      - usage: Metal Storm round
        damage: 5d pi [2d pi]
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Bursts into a flechette cloud rather than punching through as a single penetrator: no
          armour divisor, and the bracketed dice are the fragmentation, not a separate follow-up
          line. Good against unarmoured hordes, poor against anything with real DR.
      - usage: Inferno bolt (Deathwatch pattern)
        damage: 6d(2) pi+
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Deathwatch kill-team ammunition pairing a standard penetrator core with a phosphex/
          promethium secondary charge; the primary shot is unchanged from a standard bolt.
      - usage: Inferno bolt, follow-up (if bolt penetrates)
        damage: 4d burn ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
        notes: The frag concussion of a standard bolt is replaced by an incendiary flash.
      - usage: Sanctified round
        damage: 6d(2) pi+
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
        notes: >
          Rounds blessed by a Chaplain or Ecclesiarchy priest over holy oils and sacred purity
          seals; no mechanical change against mundane DR. GM discretion whether these carry a bonus
          against the daemonic or undead under the campaign's Unholy/Warp rules.
      - usage: Sanctified round, follow-up (if bolt penetrates)
        damage: 3d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 11
        bulk: -4
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      The Godwyn-De'az pattern is the boltgun the fiction treats as the baseline: a self-contained,
      rocket-assisted .75-calibre round whose motor ignites a few metres clear of the muzzle,
      widely depicted (Horus Heresy and modern Black Library alike) as capable of blowing an
      unarmoured man apart and reliably punching through carapace plate, while a Space Marine can
      shrug off a few hits from another Marine's boltgun before going down. Special Issue Ammunition
      (Kraken, Hellfire, Metal Storm, Vengeance) is Deathwatch's own term and rulebook material;
      Inferno bolts are that line's Deathwatch-specific incendiary load; sanctified/blessed
      ammunition is a recurring detail in Adepta Sororitas and Chaplain background with no stated
      mechanical difference against armour.
    design: >
      This is the project's fixed boltgun anchor: 6d(2) pi+ with a 3d cr ex follow-up (per the
      framework's damage table). Against a torso DR 40 suit of Astartes power armour the armour
      divisor (2) drops effective DR to 20; 6d(2) averages 21, so it usually needs several hits to
      punch through and then still has to beat the wearer's HP with the wounding bonus, matching
      "a Marine takes several bolts to kill another Marine." Against carapace (DR 20, effective
      DR 10) it penetrates easily, and against an unarmoured man it is instantly lethal, both as the
      framework specifies. Kraken swaps the armour divisor to (3) and drops the wounding modifier
      from pi+ to pi (less internal fragmentation, more punch) - effective DR 40/3 ≈ 13, and the
      dice are unchanged, so its edge over a standard round is entirely in the armour divisor.
      Hellfire and Metal Storm are built from Deathwatch's stated design intent (anti-organic,
      anti-horde) translated into GURPS damage types (tox for the bio-payload, a fragmentation
      bracket for the flechette cloud) rather than lifted from any catalogue entry. Vengeance and
      sanctified rounds are modelled as unchanged ballistically, since neither RPG nor Codex
      material describes a different penetrator, with their special property left as a notes-level
      rule the GM applies.

