        range: 120/400
        rof: 3
        shots: 8(3)
        st: 12†
        bulk: -2
        rcl: 3
        skill: Guns (Pistol)
    lore: >
      The Phobos-pattern bolt pistol is a common Astartes sidearm, its grip and slide machined to
      mag-lock against a suit of power armour's thigh or chest plate when holstered. Codex
      background across many Chapters shows it as the Techmarine-serviced companion to the
      chainsword for close-quarters work once a boltgun's magazine runs dry.
    design: >
      Same .75-calibre round and therefore the same damage line as the Godwyn-De'az pattern above;
      only the frame differs. ST is raised to 12† to reflect the more robust, Astartes-proportioned
      grip: a Space Marine (ST 18-20 per the framework's Astartes physiology target) uses it one-
      handed with no penalty, while an unaugmented human struggles even two-handed. LC0 because,
      per the framework's legality table, Astartes-marked wargear is heresy for the unauthorised to
      possess even though the ammunition and mechanism are identical to a human-issue bolt pistol.

