    lore: >
      Introduced with the Primaris Space Marines, current Codex background describes the bolt
      rifle as firing a slightly more powerful cartridge with improved sights and effective range
      compared with a legacy boltgun, without claiming it is a different order of weapon.
    design: >
      One pip over the Godwyn anchor (6d+1(2) pi+ / 3d+1 cr ex follow-up) for the "more powerful
      cartridge" the Codex claims, plus a real jump in Acc (5 vs 4) and range (300/1200 vs
      200/1000) for the improved optics and barrel. Magazine capacity (20) sits below the legacy
      boltgun's 24 to reflect the bulkier round in the same-size housing.

