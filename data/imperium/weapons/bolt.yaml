        rof: 3
        shots: 8(3)
        st: 13†
        bulk: -2
        rcl: 3
        skill: Guns (Pistol)
      - usage: Follow-up (if bolt penetrates)
        damage: 5d cr ex
        acc: 2
        range: 120/400
        rof: 3
        shots: 8(3)
        st: 13†
        bulk: -2
        rcl: 3
        skill: Guns (Pistol)
    lore: >
      The Phobos-pattern bolt pistol is a common Astartes sidearm, its grip and slide machined to
      mag-lock against a suit of power armour's thigh or chest plate when holstered. Codex
      background across many Chapters shows it as the Techmarine-serviced companion to the
      chainsword for close-quarters work once a boltgun's magazine runs dry.
    design: >
      Same .75-calibre round and therefore the same damage line (5dx2(2) pi++ / 5d cr ex
      follow-up) as the Godwyn-De'az pattern above; only the frame differs.
      Handling: an Astartes-proportioned pistol per the framework's rule that Astartes-pattern
      wargear is built heavier than its human counterpart, not merely relabelled - 8 lb loaded (vs
      the human Godwyn-De'az's 5 lb) for a larger case, reinforced slide and servo-assisted grip
      sized to a gauntleted hand. Min ST 13† (√(10×8)≈9, bumped up for the same recoil-handling
      reasons as the human pistol) means a Space Marine (ST 30, well over 1.5×13) fires it
      one-handed with no penalty, while an unaugmented human cannot even lift it to the two-handed
      standard. Acc, range, RoF, Shots, Bulk and Rcl are unchanged from the human pistol - same
      mechanism, same ammunition, just a bigger housing. LC0 because, per the framework's legality
      table, Astartes-marked wargear is heresy for the unauthorised to possess even though the
      ammunition and mechanism are identical to a human-issue bolt pistol.

