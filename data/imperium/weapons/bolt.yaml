    lore: >
      Fielded by Primaris Space Marines (Bladeguard Veterans, Inceptors and others), current Codex
      background is explicit that the heavy bolt pistol fires a larger case than the legacy bolt
      pistol, closing most of the gap with a full boltgun in a sidearm's frame.
    design: >
      "Heavy" is taken literally: it is given the full Godwyn boltgun anchor damage (6d(2) pi+ /
      3d cr ex follow-up) rather than the reduced pistol line above, on a bigger, ST 11† frame with
      a magazine (14 rounds) between the standard pistol's 8 and the boltgun's 24. Range and Acc
      sit above the lighter bolt pistol because the larger case gives a flatter trajectory and
      better sight radius.

