  # ---------------------------------------------------------------- pistols

  - name: Bolt Pistol, Godwyn-De'az Pattern
    tl: 10
    lc: 1
    cost: 500
    weight: 4
    tags: [Missile Weapon, Imperium, Inquisition, Astra Militarum]
    weapons:
      - usage: Standard bolt
        damage: 5d(2) pi+
        acc: 2
        range: 120/400
        rof: 3
        shots: 8(3)
        st: 10†
        bulk: -2
        rcl: 3
        skill: Guns (Pistol)
      - usage: Follow-up (if bolt penetrates)
        damage: 2d cr ex
        acc: 2
        range: 120/400
        rof: 3
        shots: 8(3)
        st: 10†
        bulk: -2
        rcl: 3
        skill: Guns (Pistol)
    lore: >
      The human-portable bolt pistol, most commonly the Godwyn-De'az pattern that shares its
      mass-reactive .75-calibre round with the standard Godwyn boltgun, is issued to Inquisitorial
      acolytes, commissars, veteran officers and other elite humans rather than to rank-and-file
      Guardsmen, who are more usually equipped with an autopistol or laspistol if they carry a
      sidearm at all. Dark Heresy and Rogue Trader both depict it as a prized, LC1 weapon whose
      recoil is punishing for an unaugmented shooter.
    design: >
      Scaled down one die from the Godwyn boltgun anchor (6d(2) pi+, see the standard Boltgun,
      Godwyn Pattern entry) to 5d(2) pi+: the bolt's rocket motor ignites a few metres clear of the
      muzzle and does most of the accelerating, so a shorter pistol barrel costs less damage than a
      conventional gunpowder round would lose, but it still loses something to the reduced initial
      propellant charge and shorter sighting radius. The follow-up scales the same way from the
      boltgun's 3d cr ex anchor. ST 10† and Rcl 3 are both unusually high for a service pistol
      (compare a normal GURPS pistol's ST 8-9, Rcl 2): this is the "hard for unaugmented humans to
      handle" property the fiction keeps returning to. The † lets it be fired two-handed at the
      listed ST; fired one-handed by anyone under ST 10 it takes the standard extra recoil and
      reduced accuracy for shooting under minimum ST. Special ammunition (Kraken, Hellfire, etc.)
      is not repeated here; see the Boltgun, Godwyn Pattern entry for full stats, all of which are
      loaded in .75-calibre pistol form as well as rifle form per Deathwatch's Special Issue
      Ammunition rules.

