        acc: 5
        range: 400/2000
        rof: 6
        shots: 60(5)
        st: 14
        bulk: -6
        rcl: 4
        skill: Gunner (Machine Gun)
      - usage: Follow-up (if bolt penetrates)
        damage: 4d cr ex
        acc: 5
        range: 400/2000
        rof: 6
        shots: 60(5)
        st: 14
        bulk: -6
        rcl: 4
        skill: Gunner (Machine Gun)
    lore: >
      The Imperium's standard support-weapon bolter, tripod- or vehicle-mounted, firing an
      oversized bolt round; consistently shown chewing through infantry and light vehicles alike
      while remaining useless against a main battle tank's frontal armour.
    design: >
      This is the project's second fixed anchor: 8d(2) pi+, follow-up 4d cr ex. Checked against
      the vehicle armour table: AV10 (DR 50, e.g. a Sentinel or a Chimera's side) has effective DR
      25 against the armour divisor (2); 8d(2) averages 28, so it does get through and "chews" light
      vehicles as required. AV12 (DR 120, a Chimera's front) has effective DR 60, comfortably out of
      reach of an average roll of 28, so it does not reliably hurt medium-armoured vehicles - both
      outcomes match the assignment's check. ST 14 and ROF 6 reflect a genuine support weapon
      needing a mount or a very strong shooter (only Astartes or a braced tripod).

