        range: 150/500
        rof: 3
        shots: 14(3)
        st: 13†
        bulk: -3
        rcl: 3
        skill: Guns (Pistol)
      - usage: Follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 3
        range: 150/500
        rof: 3
        shots: 14(3)
        st: 13†
        bulk: -3
        rcl: 3
        skill: Guns (Pistol)
    lore: >
      Fielded by Primaris Space Marines (Bladeguard Veterans, Inceptors and others), current Codex
      background is explicit that the heavy bolt pistol fires a larger case than the legacy bolt
      pistol, closing most of the gap with a full boltgun in a sidearm's frame.
    design: >
      "Heavy" is taken literally: it is given the full Godwyn boltgun anchor damage (6dx2(2) pi++ /
      6d cr ex follow-up) rather than the reduced pistol line above, on a bigger frame with
      a magazine (14 rounds) between the standard pistol's 8 and the boltgun's 24.
      Handling: at 9 lb loaded it is heavier again than the Phobos-pattern Astartes bolt pistol
      (8 lb), for the larger case the Codex describes; min ST 13† follows the same Astartes-pistol
      logic as the Phobos-pattern above (√(10×9)≈9.5, bumped for recoil). Range and Acc sit above
      the lighter bolt pistol because the larger case gives a flatter trajectory and better sight
      radius; Bulk -3 (one step worse than the standard bolt pistol's -2) reflects the bigger
      frame, and Rcl 3 is unchanged since the case is bigger but the mechanism is the same.

  # ----------------------------------------------------------------- rifles

  - name: Boltgun, Umbra Pattern
    tl: 10
    lc: 1
    cost: 1100
    weight: 41
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Standard bolt
        damage: 6dx2(2) pi++
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 20
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
      - usage: Follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 4
        range: 200/1000
        rof: 3
        shots: 24(3)
        st: 20
        bulk: -5
        rcl: 3
        skill: Guns (Rifle)
    lore: >
      One of the older mass-produced boltgun patterns, predating Godwyn-De'az manufacture in
      several Chapter armouries and Forge World background as a heavier, more conservatively built
      weapon kept in service out of reliability and reverence rather than performance.
    design: >
      Fires the same standard .75-calibre mass-reactive bolt as every other weapon on this page, so
      the damage line is identical to the Godwyn-pattern anchor (6dx2(2) pi++, follow-up 6d cr ex);
      the pattern difference is manufacture and furniture, not ballistics.
      Handling: this is a full Astartes-pattern boltgun, built for ST 30 hands and far heavier than
      any human weapon - per the framework's own worked figure (an Astartes Godwyn boltgun is about
      35-40 lb loaded, Deathwatch lists 18 kg), and the older, thicker-walled Umbra receiver runs
      3 lb over that anchor at 41 lb. Min ST 20 (√(10×41)≈20) is well above what a Guardsman can
      shoulder without a heavy penalty, but a Marine at ST 30 clears 1.5×20=30 exactly, letting him
      fire it essentially one-handed in a pinch, as the fiction shows. Bulk -5 (one step worse than
      a human rifle's -4, per the framework's Astartes-pattern rule) reflects the longer, heavier
      receiver; Rcl 3 and RoF 3 (semi/burst, per framework.md's boltgun mechanism note) and the
      24-round sickle magazine are unchanged from the Godwyn anchor, since none of that differs
      pattern to pattern - only the housing does.

