    lore: >
      As above; the melta-pattern auxiliary barrel is the combi-weapon most sought by squads
      expecting armour, since it turns a bolter-armed Space Marine into a one-shot tank-killer for
      the price of a single melta charge.
    design: >
      Bolter barrel is the Godwyn anchor (6dx2(2) pi++, follow-up 6d cr ex). Melta barrel reuses the
      meltagun's short/beyond-½D damage split unchanged (8dx6(10) burn / 4dx6(3) burn beyond, see
      Melta Weapons) for a single shot; this also fixes a stale line from before this rescale where
      the beyond-½D barrel was left as bare "4d burn" with no multiplier or divisor at all, out of
      step with the meltagun's own beyond-½D formula.
      Handling: heaviest of the three combi-weapons at 44 lb loaded, since a melta reservoir and
      coil add more mass than the plasma barrel's reservoir does; min ST 20 (√(10×44)≈21, rounded
      to match the boltgun action's own housing) and Bulk -5 apply to every barrel, since they all
      share one stock. RoF is per-mechanism: bolter barrel RoF 3 (semi/burst), melta barrel RoF 1
      at both range bands (melta weapons must recharge/vent between shots, per framework.md).

