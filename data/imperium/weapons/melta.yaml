items:

  - name: Inferno Pistol
    tl: 11
    lc: 1
    cost: 2600
    weight: 6
    tags: [Missile Weapon, Imperium, Adeptus Astartes, Inquisition]
    weapons:
      - usage: Short range (up to ½D)
        damage: 6dx6(10) burn
        acc: 1
        range: 5/25
        rof: 1
        shots: 3(5)
        st: 9
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Pistol)
      - usage: Beyond ½D
        damage: 3dx6(3) burn
        acc: 1
        range: 5/25
        rof: 1
        shots: 3(5)
        st: 9
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Pistol)
        notes: >
          Half damage past ½D (the usual GURPS rule) and the armour divisor falls
          from (10) to (3) as the fusion beam loses cohesion. Still dangerous to light and
          medium vehicles (avg 63 vs AV10 DR 100/3 = eff. 33, 95% penetration), tails off hard
          against a Leman Russ or Land Raider's frontal glacis.
    lore: >
      A pistol-format melta weapon carried by Astartes command squads, Inquisitors and Tempestus
      officers wanting a point-blank answer to armour without a full meltagun's bulk; background
      consistently frames it as devastating at arm's length and near-useless at any real distance.
    design: >
      Scaled down two dice from the meltagun anchor (8dx6(10) burn) to 6dx6(10) burn for a pistol-
      sized fuel cell, on a very short 5/25 range band matching the anchor's "vehicle-killer at
      short range, much less beyond" description. At short range 6dx6 averages 126, which - like
      the full meltagun - penetrates every vehicle on the AV table and any personal armour outright
      (effective DR under the (10) divisor never exceeds 35, even against AV14's DR 350). See the
      Meltagun entry for the beyond-½D check; the pistol's beyond-½D line is one die lower than the
      meltagun's (3d vs 4d), the same one-die-down relationship.
      Handling: min ST 9 (√(10×6)≈7.7, bumped for the bulky coil and reservoir a fusion weapon
      needs even at pistol scale, the same treatment the Plasma Pistol gets). RoF 1 at both range
      bands: melta weapons must vent and recharge between shots per framework.md, unlike
      the semi-automatic pistol families. Shots 3(5), Bulk -2 and Rcl 1 are ordinary pistol figures.

  - name: Meltagun
    tl: 11
    lc: 1
    cost: 4200
    weight: 17
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Short range (up to ½D)
        damage: 8dx6(10) burn
        acc: 2
        range: 10/50
        rof: 1
        shots: 4(5)
        st: 13
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
      - usage: Beyond ½D
        damage: 4dx6(3) burn
        acc: 2
        range: 10/50
        rof: 1
        shots: 4(5)
        st: 13
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
        notes: >
          Half the dice past ½D (the usual GURPS rule) and the armour divisor falls
          from (10) to (3) as the fusion beam loses cohesion. Still wrecks light and
          medium vehicles (avg 84 vs AV12 DR 200/3 = eff. 66, 76% penetration), but rarely
          beats a Leman Russ or Land Raider's frontal glacis (AV14, 5%).
    lore: >
      The Imperium's dedicated close-range anti-armour infantry weapon, flash-vaporising the
      target's outer surface with a superheated fusion reaction; fiction across every era treats
      it as able to gut a tank at point-blank range and as nearly worthless at any distance, in
      sharp contrast to a lascannon's much longer reach.
    design: >
      This is the project's fixed melta anchor: 8dx6(10) burn at ½D, "much less beyond" 4dx6(3).
      Checked against the vehicle armour table with the exact dice distribution: AV14 (DR 350, a
      Leman Russ or Land Raider's front) has effective DR 35 against the (10) armour divisor; 8dx6
      averages 168, always penetrating, so it easily beats even the heaviest armour in the
      framework's table at ½D range, as the assignment requires - the same holds at every lower AV
      on the table. The sharp drop-off is modelled as a second weapon line rather than a formula:
      beyond ½D the round keeps only half its dice (4d instead of 8d, the usual GURPS halving for
      range) but keeps a x6 multiplier and a much weaker (3) armour divisor instead of (10),
      representing the fusion reaction losing coherence and cohesion in open air before it reaches
      the target. Checked against the AV table: beyond ½D it averages 84 and still wrecks AV12 (DR
      200, effective DR 66) 76% of the time and AV10-11 (DR 100/150) 94-100% of the time, but drops
      to 34% against AV13 (DR 275) and just 5% against AV14 (DR 350) - "almost never beats" the
      heaviest tanks, exactly as the framework specifies. A very short 10/50 range band
      (versus a boltgun's 200/1000) captures the weapon's role as a close-assault specialist, not a
      rifle.
      Handling: min ST 13 (√(10×17)≈13.04, matching framework.md's sqrt formula almost exactly).
      RoF 1 (melta weapons must vent and recharge between shots). Bulk -4 and Rcl 1.
      Shared pattern: Astartes carry this same weapon (Deathwatch shows the same guns), so it is
      one stat block, not a human/Astartes split.

  - name: Multi-Melta
    tl: 11
    lc: 1
    cost: 8000
    weight: 55
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Short range (up to ½D)
        damage: 10dx6(10) burn
        acc: 3
        range: 15/75
        rof: 1
        shots: 6(5)
        st: 14M
        bulk: -6
        rcl: 1
        skill: Gunner (Beams)
      - usage: Beyond ½D
        damage: 5dx6(3) burn
        acc: 3
        range: 15/75
        rof: 1
        shots: 6(5)
        st: 14M
        bulk: -6
        rcl: 1
        skill: Gunner (Beams)
        notes: >
          Half the dice past ½D (the usual GURPS rule) and the armour divisor falls
          from (10) to (3) as the fusion beam loses cohesion. Unlike the shoulder-fired meltagun,
          this still wrecks AV13 (avg 105 vs DR 275/3 = eff. 91, 70%) and has a real chance against
          AV14 (31%), reflecting the bigger reactor's reserve of power.
    lore: >
      A tripod- or vehicle-mounted heavy melta weapon fielded by heavy weapon teams and as a common
      tank sponson/hull weapon; background treats it exactly as a bigger meltagun, killing the
      heaviest vehicles at short range and rapidly losing effect beyond it.
    design: >
      Two dice over the meltagun anchor (10dx6(10) vs 8dx6(10) short, 5dx6(3) vs 4dx6(3) beyond),
      matching this project's standard heavy-weapon progression, on a slightly longer 15/75 range
      band appropriate to a crew-served weapon with a bigger reactor. At short range it averages 210
      and penetrates every vehicle and personal armour on the tables without exception, same as the
      meltagun; beyond ½D the extra die keeps it meaningfully ahead of the meltagun against the
      heaviest tanks (31% vs AV14, versus the meltagun's 5%) while still tailing off, matching the
      fiction's "bigger meltagun" framing rather than a full return to short-range lethality.
      Handling: 55 lb loaded, ST 14M (mounted, like the other tripod- and vehicle-mounted weapons
      in heavy.yaml: the sqrt(10x55)=23 a shoulder-fired weapon this heavy would need is carried by
      the mount) and Gunner (Beams) reflect a support weapon fired from a tripod or vehicle mount; RoF 1 is unchanged, per the family-wide melta vent/recharge rule. Bulk -6
      and Rcl 1 are unchanged.
