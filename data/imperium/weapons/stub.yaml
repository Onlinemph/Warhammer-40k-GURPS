        acc: 2
        range: 15/60
        rof: 1
        shots: 5+1(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Guns (Shotgun)
      - usage: Slug
        damage: 5d+2 pi+
        acc: 3
        range: 120/400
        rof: 1
        shots: 5+1(3)
        st: 9
        bulk: -4
        rcl: 2
        skill: Guns (Shotgun)
    lore: >-
      A civilian and militia pump-action scattergun common on agri and
      feral worlds and among hive gangers — a step down from the military
      combat shotgun, and the more commonly depicted shotgun among
      non-military characters in Imperial fiction.
    design: >-
      Same buckshot/slug split as the Combat Shotgun, toned down roughly
      half a die (matching the Combat Shotgun's own new figures) and locked
      to RoF 1 (manual pump cycling, no autofire) to reflect civilian
      manufacture rather than a military select-fire action: buckshot
      averages 14 (66.4% through flak at point-blank range), slug averages
      19.5 and still fails against carapace (0% of hits).

  - name: Hunting Rifle
    tl: 7
    lc: 4
    cost: 300
    weight: 9
    tags: [Missile Weapon, Imperium]
    weapons:
      - usage: Standard
        damage: 7d pi
        acc: 7
        range: 600/2000
        rof: 1
        shots: 5(3)
        st: 10
        bulk: -6
        rcl: 2
        skill: Guns (Rifle)
    lore: >-
      A bolt-action precision rifle common on agri, feral and frontier
      worlds, pressed into service as a stopgap sniper weapon by Guard
      marksmen and PDF units where a long-las isn't issued.
    design: >-
      Modelled as a realistic TL7 bolt-action big-game rifle (a real-world
      analogue, not a renamed catalogue item), scaled up in the same
      proportion as the other stub-tech weapons in this file: a large
      single round for maximum penetration (average 24.5), RoF 1 for manual
      bolt cycling between shots. Kept below the long-las (6d(2) burn) in
      practical terms — full pi wounding and no armour divisor mean it's
      comparably lethal to an unarmoured target (99.7% through flak, DR 12)
      but does nothing against carapace-or-better armour (0% of hits at
      DR 45), in contrast to the long-las which at least keeps pace with a
      standard lasgun there.

