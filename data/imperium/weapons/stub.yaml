kind: equipment
output: Imperium/Weapons/Solid Projectile Weapons.eqp
items:
  - name: Autopistol
    tl: 7
    lc: 4
    cost: 80
    weight: 2
    tags: [Missile Weapon, Imperium]
    weapons:
      - usage: Standard (ball)
        damage: 3d+1 pi
        acc: 2
        range: 80/180
        rof: 3
        shots: 16+1(3)
        st: 7
        bulk: -2
        rcl: 2
        skill: Guns (Pistol)
      - usage: Manstopper rounds
        damage: 3d+2(0.5) pi+
        acc: 2
        range: 80/180
        rof: 3
        shots: 16+1(3)
        st: 7
        bulk: -2
        rcl: 2
        skill: Guns (Pistol)
        notes: >-
          Soft-nosed rounds that flatten on impact for a bigger wound
          channel but poor penetration.
    lore: >-
      A cheap, mass-produced sidearm found across a billion hive worlds:
      gang muscle, PDF conscripts and Guard officers who don't rate a
      laspistol all carry one. Consistently portrayed in Guard and Arbites
      fiction as the low-status "poor man's laspistol."
    design: >-
      No framework anchor covers stub weapons directly, but they must stay
      proportional to the autogun anchor (7d pi) they're built alongside.
      The autopistol is the cheapest, lightest pistol-calibre round in the
      file: 3d+1 pi (avg 11.5), about 47% of the autogun's average of 24.5,
      full pi wounding for a modern jacketed round. It sits below the stub
      automatic (3d+2) and the stub revolver (4d), the ordering FFG-line
      background gives for relative calibration. Against flak (DR 30) it
      penetrates 0% of hits, so it is relevant only against unarmoured
      targets; a GM wanting it to matter against flak would need to depart
      from this pistol-family scaling, which this entry does not do on its
      own authority. The Manstopper usage keeps the pi+/divisor (0.5) shape
      with +1 damage over the ball round (3d+2(0.5) pi+, avg 12.5): it never
      penetrates flak or better (0% of hits, effective DR doubled by the
      divisor) but hits unarmoured flesh harder, the standard GURPS way to
      model an expanding round: more damage to flesh, worse against any DR.
      Handling: weight (2 lb) and min ST (7) follow GURPS's pistol-weight
      convention (roughly ST 7 for a service-calibre autoloader this size)
      rather than the shoulder-arm sqrt formula, which this project reserves
      for rifles and heavier weapons. Bulk -2 and Rcl 2 are ordinary pistol
      figures.

  - name: Autogun
    tl: 7
    lc: 3
    cost: 150
    weight: 8
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard ball
        damage: 7d pi
        acc: 4
        range: 500/2000
        rof: 10
        shots: 30(3)
        st: 9†
        bulk: -4
        rcl: 2
        skill: Guns (Rifle)
      - usage: Dum-Dum rounds
        damage: 7d(0.5) pi+
        acc: 4
        range: 500/2000
        rof: 10
        shots: 30(3)
        st: 9†
        bulk: -4
        rcl: 2
        skill: Guns (Rifle)
        notes: >-
          Expanding rounds: bigger wound channel against flesh, much worse
          against armour.
    lore: >-
      The standard-issue solid-slug battle rifle of regiments and militias
      that lack a lasgun allocation — a recoil-operated intermediate-calibre
      rifle that recurs across Astra Militarum background material as the
      "poor cousin" of the lasgun, more common on low-priority garrison and
      PDF postings.
    design: >-
      Fixed autogun anchor, 7d pi, holding lasgun parity (per framework.md: "Lasgun parity against
      flesh... stopped by carapace"). Average roll 24.5 gets through flak
      (DR 30) on 9.4% of hits and mesh (DR 36) on 0.3%, notably worse than
      the lasgun's own 97.8%/90.6% because the autogun has no armour divisor and a solid slug
      has no focusing trick to help it through DR the way a lasgun's beam
      does; against carapace (DR 70) it penetrates 0% of hits, confirming
      "stopped by carapace" even more emphatically than before. This is an
      honest consequence of a family with no divisor, not a departure from the
      lasgun-parity design goal, which is measured against flesh (HP), not
      DR. Range 500/2000 fits an intermediate-calibre rifle. RoF 10, 30(3)
      follow selective-fire rifle conventions. The Dum-Dum usage applies the
      same expanding-round logic as the autopistol's Manstopper.
      Handling: min ST corrected to 9 (√(10×8)≈8.9), matching the same
      formula correction applied to the 8 lb lasgun patterns in this
      project's las.yaml. Bulk -4 and Rcl 2 are unchanged.

  - name: Stub Revolver
    tl: 7
    lc: 4
    cost: 140
    weight: 2.5
    tags: [Missile Weapon, Imperium]
    weapons:
      - usage: Standard
        damage: 4d pi
        acc: 2
        range: 100/250
        rof: 1
        shots: 6(3)
        st: 7
        bulk: -2
        rcl: 2
        skill: Guns (Pistol)
    lore: >-
      A well-made, reliable break-top or swing-cylinder handgun favoured by
      Inquisitorial acolytes, enforcers and anyone who prizes reliability
      over firepower or rate of fire; FFG-line background (used here only
      for relative calibration, per framework.md's source order) singles
      the stub revolver out as the higher-quality, slower-firing counterpart
      to the stub automatic.
    design: >-
      Single-action cycling caps RoF at 1 — there's no autofire mechanism.
      A heavier, hand-loaded magnum-class round (GURPS real-world baseline:
      a .44 Magnum runs about 3d pi, scaled by the same ×1.32 ratio as the
      autogun to 4d pi, avg 14) sits above the autopistol's 3d+1 pi (avg
      11.5) and the stub automatic's 3d+2, reflecting a larger-calibre,
      better-machined round fired from a tighter, hand-fitted barrel, and
      stays well under the autogun's 7d pi rifle round. Average roll 14
      penetrates flak (DR 30) on 0% of hits and never beats carapace (DR 70:
      0%); like every stub pistol-calibre round in this file it is a threat
      to unarmoured targets only.
      Rcl 2, the Basic Set's figure for a light revolver (B278) and the low end
      of framework.md's pistol range.

  - name: Stub Automatic
    tl: 7
    lc: 4
    cost: 60
    weight: 2.5
    tags: [Missile Weapon, Imperium]
    weapons:
      - usage: Standard (ball)
        damage: 3d+2 pi
        acc: 2
        range: 80/180
        rof: 3
        shots: 10+1(3)
        st: 8
        bulk: -2
        rcl: 2
        skill: Guns (Pistol)
    lore: >-
      The cheaper, select-fire cousin of the autopistol and stub revolver,
      common as a backup piece among gangers, cultists and low-tier militia;
      distinguished in FFG-line background primarily by cost and magazine
      capacity rather than raw power.
    design: >-
      A heavier-framed, hotter-loaded slugthrower than the autopistol: 3d+2
      pi (avg 12.5, one point over the autopistol's 3d+1) from a smaller
      magazine (10+1 vs. 16+1). The simpler, cheaper construction (cost 60
      against the autopistol's 80) comes from a plain steel frame with none
      of the autopistol's magazine machining, which is also why it weighs
      2.5 lb against 2 and wants ST 8 against 7. Bulk -2 and Rcl 2 match
      the autopistol (same class of pistol); like every stub pistol it
      cannot penetrate flak (0% of hits).

  - name: Heavy Stubber
    tl: 7
    lc: 2
    cost: 900
    weight: 40
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 8d+2 pi+
        acc: 4
        range: 500/2000
        rof: 15
        shots: 250(20)
        st: 12B
        bulk: -6
        rcl: 3
        skill: Gunner (Machine Gun)
    lore: >-
      The Imperium's standard heavy machine gun: a deliberately archaic
      solid-slug design valued precisely because a forge world with almost
      no infrastructure can still manufacture it. A mainstay on Chimera
      pintles, Sentinel weapon mounts and heavy-weapon squads across Guard
      background art and fiction, and never once shown killing a tank.
    design: >-
      Scaled up from the autogun's pi rating to a true heavy-calibre weapon
      (pi+, the GURPS x1.5 wounding multiplier), landing close to GURPS's
      own real-world .50-calibre benchmark, then rescaled by the same ×1.32
      ratio the autogun itself moved to keep pace with the las/autogun
      family: 6d+2 pi+ (avg 23) becomes 8d+2 pi+ (avg 30). Deliberately kept
      well below the heavy bolter anchor ((8d+2)×2(2) pi++, which "chews light
      vehicles" at AV10): 8d+2 pi+ averages 30 with no armour divisor,
      penetrating 0% of hits against AV10 (DR 125, per framework.md's
      vehicle-armour table).
      That failure is intentional and total — the fiction never shows a
      heavy stubber meaningfully hurting a vehicle, only infantry, and this
      stat block keeps reproducing that gap by a wide margin. It
      penetrates flak (DR 30) on 46.0% of hits and mesh (DR 36) on 9.1%, and
      fails outright against carapace (DR 70: 0%), as an un-divisored
      solid-slug weapon should. Mounted per
      framework.md's braced/mounted-heavies rule, hence Gunner (Machine
      Gun) rather than Guns.
      Handling: RoF 15 follows framework.md's "heavy stubbers and assault
      cannons high (15-20+)" guidance: a belt-fed machine gun out-sprays
      every rifle-class weapon in the Imperium's armoury (lasgun RoF 10). ST 12B (bipod/tripod) is unchanged: the mount bears the 40 lb
      loaded weight, so the figure covers recoil control, not the raw
      √(10×40)≈20 a shoulder-fired weapon this heavy would need. Bulk -6
      and Rcl 3 are unchanged.

  - name: Combat Shotgun
    tl: 7
    lc: 2
    cost: 350
    weight: 9
    tags: [Missile Weapon, Imperium, Adeptus Arbites]
    weapons:
      - usage: Buckshot
        damage: 6d pi+
        acc: 2
        range: 20/70
        rof: 3
        shots: 8(3)
        st: 9†
        bulk: -4
        rcl: 1
        skill: Guns (Shotgun)
      - usage: Slug
        damage: 8d pi+
        acc: 3
        range: 150/500
        rof: 1
        shots: 8(3)
        st: 9†
        bulk: -4
        rcl: 2
        skill: Guns (Shotgun)
      - usage: Executioner shell
        damage: 7d(2) pi+
        acc: 2
        range: 20/70
        rof: 1
        shots: 8(3)
        st: 9†
        bulk: -4
        rcl: 1
        skill: Guns (Shotgun)
        notes: >-
          Rare flechette/APDS-style shell, usually restricted to Inquisition
          or Arbites armouries.
    lore: >-
      A full-auto-capable military scattergun issued to void-ship boarding
      parties, PDF close-quarters units and Adeptus Arbites riot squads.
      "Executioner" shells are referenced in FFG-line background (relative
      calibration only, per framework.md) as a specialist close-range,
      armour-beating round issued to elite units rather than line troops.
    design: >-
      Buckshot and slug follow the usual GURPS shotgun split — short-ranged
      and hard-hitting versus long-ranged and precise — but are given single
      flat damage figures rather than the Basic Set's full range-banded
      pellet-spread rules, a deliberate simplification noted here for
      transparency. Both are rescaled by the same ×1.32 ratio the autogun
      itself moved: buckshot (4d+2 pi+, avg 16) becomes 6d pi+ (avg 21) and
      penetrates flak (DR 30) on just 1.0% of hits at point-blank range -
      flak (DR 30) stops a shotgun blast almost
      completely, matching a scattergun's real-world reputation against
      rigid plate even at the "vest" tier; slug (6d pi+, avg 21) becomes
      8d pi+ (avg 28) and still can't beat carapace (DR 70: 0% of hits). The
      Executioner shell keeps the buckshot's short range but adds an armour
      divisor of (2) and is rescaled to track the lasgun exactly (7d(2)
      pi+, avg 24.5, per this entry's original design intent of "the same
      figure as a standard lasgun"): 0.6% against carapace (DR 70, effective
      35), the same figure as the current lasgun.
      Handling: RoF is now per-mode rather than one blanket "3" copied
      across every ammunition type: buckshot keeps RoF 3 (a genuinely
      full-auto-capable close-range load, matching the lore's "full-auto-
      capable military scattergun"), while slug and the rare Executioner
      shell drop to RoF 1 - both are precision, longer-ranged or
      armour-beating rounds a gunner fires deliberately, one at a time, not
      sprayed on full auto, and neither pattern's lore ever shows it used
      that way.

  - name: Pump Shotgun
    tl: 7
    lc: 4
    cost: 150
    weight: 7
    tags: [Missile Weapon, Imperium]
    weapons:
      - usage: Buckshot
        damage: 5d+1 pi+
        acc: 2
        range: 15/60
        rof: 1
        shots: 5+1(3)
        st: 9†
        bulk: -4
        rcl: 1
        skill: Guns (Shotgun)
      - usage: Slug
        damage: 7d+1 pi+
        acc: 3
        range: 120/400
        rof: 1
        shots: 5+1(3)
        st: 9†
        bulk: -4
        rcl: 2
        skill: Guns (Shotgun)
    lore: >-
      A civilian and militia pump-action scattergun common on agri and
      feral worlds and among hive gangers — a step down from the military
      combat shotgun, and the more commonly depicted shotgun among
      non-military characters in Imperial fiction.
    design: >-
      Same buckshot/slug split as the Combat Shotgun, toned down roughly
      half a die (matching the Combat Shotgun's own new figures) and locked
      to RoF 1 (manual pump cycling, no autofire) to reflect civilian
      manufacture rather than a military select-fire action: buckshot (avg
      18.5) penetrates flak (DR 30) on 0% of hits at point-blank range -
      civilian buckshot no longer threatens military flak at all under the
      current anchors - and slug (avg 25.5) still fails against carapace
      (DR 70: 0% of hits).
      Handling: RoF 1 for both modes is unchanged and correct as-is - a
      pump-action shotgun has no autofire mechanism regardless of the load,
      so unlike the Combat Shotgun above there was never a per-mode RoF
      inconsistency to fix here. Weight, min ST, Bulk and Rcl are unchanged.

  - name: Hunting Rifle
    tl: 7
    lc: 4
    cost: 300
    weight: 9
    tags: [Missile Weapon, Imperium]
    weapons:
      - usage: Standard
        damage: 9d+1 pi
        acc: 7
        range: 600/2000
        rof: 1
        shots: 5(3)
        st: 11†
        bulk: -6
        rcl: 2
        skill: Guns (Rifle)
    lore: >-
      A bolt-action precision rifle common on agri, feral and frontier
      worlds, pressed into service as a stopgap sniper weapon by Guard
      marksmen and PDF units where a long-las isn't issued.
    design: >-
      Modelled as a realistic TL7 bolt-action big-game rifle (a real-world
      analogue, not a renamed catalogue item), rescaled by the same ×1.32
      ratio the autogun itself moved (7d pi, avg 24.5, becomes 9d+1 pi, avg
      32.5): a large single round for maximum penetration, RoF 1 for manual
      bolt cycling between shots. Kept below the long-las (8d(2) burn) in
      practical terms — full pi wounding and no armour divisor mean it's
      comparably lethal to an unarmoured target (65.0% through flak, DR 30)
      but does nothing against carapace-or-better armour (0% of hits at
      DR 70), in contrast to the long-las which at least keeps pace with a
      standard lasgun there.
      Handling: min ST corrected to 11 (√(10×9)≈9.5, bumped for a stiff-
      recoiling big-game round rather than a light sporting rifle - real
      hunting rifles chambered for genuinely large game run ST 10-11 in
      GURPS convention). Bulk -6 and Rcl 2 are unchanged.

