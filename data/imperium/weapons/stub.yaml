kind: equipment
output: Imperium/Weapons/Solid Projectile Weapons.eqp
items:
  - name: Autopistol
    tl: 7
    lc: 4
    cost: 80
    weight: 2
    tags: [Missile Weapon, Imperium]
    weapons:
      - usage: Standard (ball)
        damage: 3d+2 pi
        acc: 2
        range: 80/180
        rof: 3
        shots: 16+1(3)
        st: 7
        bulk: -2
        rcl: 2
        skill: Guns (Pistol)
      - usage: Manstopper rounds
        damage: 3d+3(0.5) pi+
        acc: 2
        range: 80/180
        rof: 3
        shots: 16+1(3)
        st: 7
        bulk: -2
        rcl: 2
        skill: Guns (Pistol)
        notes: >-
          Soft-nosed rounds that flatten on impact for a bigger wound
          channel but poor penetration.
    lore: >-
      A cheap, mass-produced sidearm found across a billion hive worlds:
      gang muscle, PDF conscripts and Guard officers who don't rate a
      laspistol all carry one. Consistently portrayed in Guard and Arbites
      fiction as the low-status "poor man's laspistol."
    design: >-
      No framework anchor covers stub weapons directly, but they must stay
      proportional to the autogun anchor (7d pi) they're built alongside.
      GURPS's own real-world pistol-calibre baseline sits at roughly the
      same fraction of the autogun the earlier pass used (avg 9/avg 18.5 =
      49% pre-rescale), so the autopistol is rescaled by the same ratio the
      autogun itself moved (5d+1→7d, avg 18.5→24.5, ×1.32): 2d+2 pi (avg 9)
      becomes 3d+2 pi (avg 12.5), keeping full pi wounding for a modern
      jacketed round rather than the crude ball ammo an earlier pass
      assumed. Against flak (DR 18) it penetrates just 1.9% of hits — a real
      but unimpressive threat, matching the autopistol's reputation as a
      backup weapon rather than a main-line arm. The Manstopper usage keeps
      the same pi+/divisor(0.5) shape and the same +1 die/+1 over the ball
      round relationship (3d+3(0.5) pi+, avg 13.5): it never penetrates flak
      or better (0% of hits, effective DR doubled by the divisor) but hits
      unarmoured flesh harder, the standard GURPS way to model an expanding
      round — more damage to flesh, worse against any DR.
      Handling: weight (2 lb) and min ST (7) are unchanged - GURPS's own
      pistol-weight convention (roughly ST 7 for a service-calibre autoloader
      this size) already applies here rather than the shoulder-arm sqrt
      formula, which this project reserves for rifles and heavier weapons.
      Bulk -2 and Rcl 2 are ordinary pistol figures.

  - name: Autogun
    tl: 7
    lc: 3
    cost: 150
    weight: 8
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard ball
        damage: 5d+1 pi
        acc: 4
        range: 500/2000
        rof: 10
        shots: 30(3)
        st: 8
        bulk: -4
        rcl: 2
        skill: Guns (Rifle)
      - usage: Dum-Dum rounds
        damage: 5d+1(0.5) pi+
        acc: 4
        range: 500/2000
        rof: 10
        shots: 30(3)
        st: 8
        bulk: -4
        rcl: 2
        skill: Guns (Rifle)
        notes: >-
          Expanding rounds: bigger wound channel against flesh, much worse
          against armour.
    lore: >-
      The standard-issue solid-slug battle rifle of regiments and militias
      that lack a lasgun allocation — a recoil-operated intermediate-calibre
      rifle that recurs across Astra Militarum background material as the
      "poor cousin" of the lasgun, more common on low-priority garrison and
      PDF postings.
    design: >-
      Fixed autogun anchor (5d+1 pi): calibrated to lasgun parity rather
      than to flak. In the fiction autoguns kill as readily as lasguns, and
      Only War gives both the same damage, so the autogun is set for the
      same practical lethality as the lasgun anchor (5d(2) burn, avg 17.5)
      without copying its armour divisor — a solid slug has no focusing
      trick to help it through DR. Average roll 18.5 gets through flak
      (DR 12) on 94.1% of hits and mesh (DR 15) on 77.9%, both comparable to
      the lasgun's own flak/mesh numbers; against carapace (DR 45) it
      penetrates 0% of hits, even worse than the lasgun's rare 9.8% since it
      has no armour divisor to help it — confirming "stopped by carapace."
      An earlier
      draft used 2d+2 pi to make flak "stop stub rounds"; that framework
      wording was about pistol calibres and has been corrected. Range
      500/2000 fits an intermediate-calibre rifle. RoF 10, 30(3) follow
      selective-fire rifle conventions. The Dum-Dum usage applies the same
      expanding-round logic as the autopistol's Manstopper, bumped the same
      +1 die as the ball round.

  - name: Stub Revolver
    tl: 7
    lc: 4
    cost: 140
    weight: 2.5
    tags: [Missile Weapon, Imperium]
    weapons:
      - usage: Standard
        damage: 3d pi
        acc: 2
        range: 100/250
        rof: 1
        shots: 6(3)
        st: 7
        bulk: -2
        rcl: 1
        skill: Guns (Pistol)
    lore: >-
      A well-made, reliable break-top or swing-cylinder handgun favoured by
      Inquisitorial acolytes, enforcers and anyone who prizes reliability
      over firepower or rate of fire; FFG-line background (used here only
      for relative calibration, per framework.md's source order) singles
      the stub revolver out as the higher-quality, slower-firing counterpart
      to the stub automatic.
    design: >-
      Single-action cycling caps RoF at 1 — there's no autofire mechanism.
      A heavier, hand-loaded magnum-class round (GURPS real-world baseline:
      a .44 Magnum runs about 3d pi) sits above the autopistol's 9mm-class
      2d+2 pi, reflecting a larger-calibre, better-machined round fired from
      a tighter, hand-fitted barrel — and stays well under the autogun's
      5d+1 pi rifle round, the same gap the old 2d+1 kept below the old
      4d+1 autogun. Average roll 10.5 penetrates flak (DR 12) on 25.9% of
      hits (better than the autopistol's 8.3%), mesh (DR 15) on 4.6%, and
      never beats carapace (DR 45: 0%). Low Rcl (1) follows from GURPS
      convention for a heavier, well-balanced revolver.

  - name: Stub Automatic
    tl: 7
    lc: 4
    cost: 90
    weight: 2
    tags: [Missile Weapon, Imperium]
    weapons:
      - usage: Standard (ball)
        damage: 2d+2 pi
        acc: 2
        range: 80/180
        rof: 3
        shots: 10+1(3)
        st: 7
        bulk: -2
        rcl: 2
        skill: Guns (Pistol)
    lore: >-
      The cheaper, select-fire cousin of the autopistol and stub revolver,
      common as a backup piece among gangers, cultists and low-tier militia;
      distinguished in FFG-line background primarily by cost and magazine
      capacity rather than raw power.
    design: >-
      Same round as the autopistol's standard ball ammunition (2d+2 pi),
      since both fire generic mass-produced pistol-calibre cartridges — the
      difference is a smaller magazine (10+1 vs. 16+1) and cheaper
      construction, reflected here in cost and weight rather than a
      duplicate damage figure, since GCS has no separate build-quality stat.

  - name: Heavy Stubber
    tl: 7
    lc: 2
    cost: 900
    weight: 40
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Standard
        damage: 6d+2 pi+
        acc: 4
        range: 500/2000
        rof: 15
        shots: 250(20)
        st: 12B
        bulk: -6
        rcl: 3
        skill: Gunner (Machine Gun)
    lore: >-
      The Imperium's standard heavy machine gun: a deliberately archaic
      solid-slug design valued precisely because a forge world with almost
      no infrastructure can still manufacture it. A mainstay on Chimera
      pintles, Sentinel weapon mounts and heavy-weapon squads across Guard
      background art and fiction, and never once shown killing a tank.
    design: >-
      Scaled up from the autogun's pi rating to a true heavy-calibre weapon
      (pi+, the GURPS x1.5 wounding multiplier), landing close to GURPS's
      own real-world .50-calibre benchmark (roughly 6d+2 pi+) rather than
      any 40k catalogue entry. Deliberately pitched well below the heavy
      bolter anchor (7d×2(2) pi++, which "chews light vehicles" at AV10):
      6d+2 pi+ averages 23 with no armour divisor, penetrating 0% of hits
      against AV10 (DR 100). That failure is intentional and total — the
      fiction never shows a heavy stubber meaningfully hurting a vehicle,
      only infantry, and this stat block reproduces that gap explicitly and
      by a wider margin than the old DR 50 threshold did. Mounted per
      framework.md's braced/mounted-heavies rule, hence Gunner (Machine
      Gun) rather than Guns.
      Handling: RoF corrected to 15 per framework.md's explicit "heavy
      stubbers and assault cannons high (15-20+)" guidance - the previous
      RoF 10 undersold a belt-fed machine gun's actual cyclic rate and sat
      no higher than a lasgun's own full-auto figure, when a heavy stubber
      is meant to out-spray every rifle-class weapon in the Imperium's
      armoury. ST 12B (bipod/tripod) is unchanged: the mount bears the 40 lb
      loaded weight, so the figure covers recoil control, not the raw
      √(10×40)≈20 a shoulder-fired weapon this heavy would need. Bulk -6
      and Rcl 3 are unchanged.

  - name: Combat Shotgun
    tl: 7
    lc: 2
    cost: 350
    weight: 9
    tags: [Missile Weapon, Imperium, Adeptus Arbites]
    weapons:
      - usage: Buckshot
        damage: 4d+2 pi+
        acc: 2
        range: 20/70
        rof: 3
        shots: 8(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Guns (Shotgun)
      - usage: Slug
        damage: 6d pi+
        acc: 3
        range: 150/500
        rof: 3
        shots: 8(3)
        st: 9
        bulk: -4
        rcl: 2
        skill: Guns (Shotgun)
      - usage: Executioner shell
        damage: 5d(2) pi+
        acc: 2
        range: 20/70
        rof: 3
        shots: 8(3)
        st: 9
        bulk: -4
        rcl: 1
        skill: Guns (Shotgun)
        notes: >-
          Rare flechette/APDS-style shell, usually restricted to Inquisition
          or Arbites armouries.
    lore: >-
      A full-auto-capable military scattergun issued to void-ship boarding
      parties, PDF close-quarters units and Adeptus Arbites riot squads.
      "Executioner" shells are referenced in FFG-line background (relative
      calibration only, per framework.md) as a specialist close-range,
      armour-beating round issued to elite units rather than line troops.
    design: >-
      Buckshot and slug follow the usual GURPS shotgun split — short-ranged
      and hard-hitting versus long-ranged and precise — but are given single
      flat damage figures rather than the Basic Set's full range-banded
      pellet-spread rules, a deliberate simplification noted here for
      transparency. Both are scaled up in proportion to the autogun's own
      1.27x jump (old 4d+1 avg 15 to new 5d+1 avg 18.5): buckshot averages
      16 and penetrates flak (DR 12) on 84.1% of hits at point-blank range;
      slug averages 21 and still can't beat carapace (DR 45: 0% of hits),
      matching a shotgun's real-world reputation against rigid plate. The
      Executioner shell keeps the buckshot's short range but adds an armour
      divisor of (2), modelling a penetrator flechette payload that trades
      general usefulness for beating armour at point-blank range: average 17.5,
      penetrating carapace (DR 45, effective 22.5) on 9.8% of hits, the same
      figure as a standard lasgun.

