      sw+3d+2(10) cr (field on) - the same +3d/(10) step used to build
      every other field-on/field-off pair in this file, keeping the
      Arbites maul consistent with the Chapter- and Sororitas-issue power
      weapons below it despite its different institutional owner.
      Handling: parry corrected to -1U on both settings, matching the
      Axe/Mace family convention (a maul head, powered or not, is still a
      blunt, head-forward weapon). Weight (5 lb) and min ST (10) are
      unchanged.

  # --------------------------------------------------------------------- Power

  - name: Power Sword
    tl: 11
    lc: 1
    cost: 6000
    weight: 4
    tags: [Melee Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Field on
        damage: sw+3d+1(10) cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
      - usage: Field off (as plain blade)
        damage: sw+1 cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
    notes: >
      The disruption field is a toggle (free action); with the field off,
      this is an unremarkable, if beautifully made, one-handed sword. A
      depleted or damaged power cell disables the field the same way.
    lore: >
      The classic officer's and veteran's duelling and battle blade of the
      Imperium, from Guard colonels to Astartes veteran sergeants and
      Inquisitors; consistently shown shearing through flak, flesh and
      even power armour where a plain sword or chainsword would just
      bounce or skid, matching the framework anchor's own description.
    design: >
      Fixed anchor (Rescale): sw+3d+1(10) cut, reach 1, parry 0, min ST 10.
      This entry also establishes the general "power field" rule every
      other powered edged/blunt weapon in this file is built from
      (framework.md, power-field rule): comparing the anchor to a plain
      one-handed sword's Basic Set baseline (sw+1 cut for a broadsword-
      class blade) shows the field itself contributes exactly +3d damage
      and Armor Divisor (10) over the same weapon with the field off - the
      "field off" line above is that same sw+1 cut baseline, unchanged by
      the Rescale (a plain sword's mundane edge doesn't care what DR
      anchors moved). This is why the field-off usage is included
      explicitly: the framework says power field on/off must be modelled
      as separate weapon lines, and this file applies the same +3d/(10)
      delta to every bladed/mace power weapon below (thunder hammers get
      +6d and power fists thr+8d instead, per the framework's own
      breakdown), scaled from each weapon's own mundane baseline rather
      than re-deriving the anchor each time. Checked against the new
      armour anchors: a Guardsman-strength blow (sw=1d+1, so field-on
      totals 4d+1) penetrates carapace (DR 70, eff. 7) essentially always
      (98.8%), Astartes power armour (DR 100, eff. 10) about 90% of the
      time, and
      Terminator plate (DR 200, eff. 20) about 5% of the time; an
      Astartes-strength blow (sw=3d, field-on 6d) penetrates Astartes
      power armour better than 99% of the time and Terminator plate more
      than half the time. This matches the framework's "the disruption
      field shears power armour whoever holds it" - even a human's power
      sword reliably beats another human's power armour. TL11 and LC1 per
      the framework's "Advanced Imperial/rare" and "power weapons"
      brackets. This is the human-scale power sword; see Power Sword,
      Astartes Pattern below for the heavier Chapter-armoury version built
      the same way the Astartes chainsword is built from the human one.
      Handling: Broadsword's Basic Set parry (0) applies unchanged - a
      guarded, edged weapon, not an axe/mace. Weight (4 lb) and min ST (10)
      match a real one-handed duelling sword.

