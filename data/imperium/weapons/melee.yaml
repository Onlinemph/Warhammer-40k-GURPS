kind: equipment
output: Imperium/Weapons/Melee Weapons.eqp
items:
  # ---------------------------------------------------------------- Mundane

  - name: Combat Knife, Munitorum Pattern
    tl: 2
    lc: 4
    cost: 40
    weight: 1
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Thrust
        damage: thr-1 imp
        reach: C,1
        parry: 0
        st: 6
        skill: Knife
      - usage: Swing
        damage: sw-2 cut
        reach: C,1
        parry: 0
        st: 6
        skill: Knife
    notes: Standard sidearm/tool for every Guardsman; also the unmounted profile for the bayonet below.
    lore: >
      Every Imperial Guard regiment issues a plain steel fighting knife
      alongside the lasgun, seen constantly in the background as a
      last-resort weapon and general tool; Black Library fiction (Gaunt's
      Ghosts and others) treats it as unremarkable field kit rather than a
      named piece of wargear.
    design: >
      Built from Basic Set knife-family design logic, not anchored by
      framework.md (no dedicated anchor exists below the chainsword): a
      short single-edged blade gives thr-1 imp / sw-2 cut, reach C,1,
      parry 0, min ST 6. TL2 reflects that a simple knife is primitive-tech
      regardless of the TL10 industry that stamps it out by the million; LC4
      matches "cheap civilian stubbers, knives" in the framework's legality
      table.

  - name: Bayonet, Lug-Mounted
    tl: 2
    lc: 4
    cost: 30
    weight: 1
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Fixed to lasgun
        damage: thr+1 imp
        reach: "1,2"
        parry: 0
        st: 6
        skill: Spear
      - usage: Unmounted (as knife)
        damage: thr-1 imp
        reach: C,1
        parry: 0
        st: 6
        skill: Knife
      - usage: Unmounted, swing
        damage: sw-2 cut
        reach: C,1
        parry: 0
        st: 6
        skill: Knife
    notes: >
      Fits the standard-issue lasgun's bayonet lug (and most stub-pattern
      long arms of similar profile); mounting or removing it takes a Ready
      maneuver. Mounted, treat it as an improvised short spear rather than a
      knife for reach and defaults.
    lore: >
      Depicted throughout Guard fiction as the last line of defence when a
      firefight closes to melee and a Guardsman's lasgun runs dry or jams -
      "fix bayonets" is a recurring line in Astra Militarum combat scenes,
      most famously associated with charge orders in Gaunt's Ghosts-style
      trench and siege fighting.
    design: >
      Same blade and knife-mode profile as the Munitorum combat knife
      above; the mounted profile follows Basic Set convention for a bayonet
      fixed to a long arm (treated as a short thrusting spear once fixed,
      reach 1,2, +1 to thrust damage for the leverage of the gun's length
      behind the point) rather than inventing new mechanics. TL/LC as the
      knife it's built from.

  - name: Combat Knife, Astartes Pattern
    tl: 2
    lc: 1
    cost: 200
    weight: 4
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Thrust
        damage: thr+1 imp
        reach: C,1
        parry: 0
        st: 11
        skill: Shortsword
      - usage: Swing
        damage: sw+1 cut
        reach: C,1
        parry: 0
        st: 11
        skill: Shortsword
    notes: Sized for a gauntleted Astartes hand; scaled to a human's shortsword rather than a human's knife.
    lore: >
      Space Marines carry a sidearm blade proportioned to their size and
      strength - visually a long fighting knife on a Marine's belt reads as
      a shortsword in a human's hand; consistently shown as a backup when a
      chainsword or bolt pistol isn't drawn, in Black Library Space Marine
      fiction from the Horus Heresy series onward.
    design: >
      Not a bigger version of the human combat knife's stat block (that
      would just be the same knife with a higher min ST, understating how
      much blade an Astartes-scale grip actually carries) - instead it is
      built on the human Shortsword profile (thr+1 imp/sw+1 cut) scaled up
      in weight and min ST for an Astartes fist, per the framework's rule
      that Astartes- and human-scale versions of the same weapon type need
      different stats, not just a relabelling. LC1 (Astartes-issue gear)
      rather than the LC4 civilian knife bracket.

  - name: Entrenching Tool, Folding
    tl: 5
    lc: 4
    cost: 30
    weight: 5
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Spade edge
        damage: sw+1 cr
        reach: 1
        parry: -1
        st: 8
        skill: Axe/Mace
    notes: Doubles as a digging tool; treat as an improvised weapon (already priced and statted as one, no further penalty needed when it's used as intended).
    lore: >
      Standard Guard field-engineering kit, folded and slung on webbing;
      depicted in trench-warfare-flavoured Guard fiction being swung in
      desperate close combat as often as it's used to dig in, in the
      tradition of real-world entrenching-tool improvised weapons.
    design: >
      Not anchored; built as a short, heavy-headed improvised axe/mace per
      Basic Set logic - a folding steel spade has enough mass to crush but
      a poor edge and balance, giving sw+1 cr, reach 1, parry -1 (awkward
      compared to a purpose-built club), min ST 8. TL5 reflects the folding
      steel tool itself (an industrial product), not the Imperium's overall
      manufacturing TL.

  - name: Maul, Guardsman's Club
    tl: 0
    lc: 4
    cost: 20
    weight: 3
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Swing
        damage: sw+2 cr
        reach: 1
        parry: 0
        st: 9
        skill: Axe/Mace
    notes: Riot batons, Arbites-issue billy clubs and improvised trench clubs all use this profile.
    lore: >
      The plainest possible melee weapon: a weighted length of wood, plas or
      scavenged pipe, seen everywhere from hive underworld gangs to
      penal-legion improvisation in Guard-adjacent fiction; no source treats
      it as anything but a crude, universally available last resort.
    design: >
      Straight Basic Set club design (sw+2 cr, reach 1, parry 0, min ST 9);
      not anchored by framework.md since it sits well below the chainsword
      tier, TL0 because a club needs no technology at all.

  - name: Catachan Fang
    tl: 2
    lc: 4
    cost: 60
    weight: 2.5
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Thrust
        damage: thr+1 imp
        reach: 1
        parry: 0
        st: 9
        skill: Shortsword
      - usage: Swing
        damage: sw+1 cut
        reach: 1
        parry: 0
        st: 9
        skill: Shortsword
    notes: Doubles as a survival/jungle tool as well as a sidearm; several Catachan-pattern variants exist, all statted the same.
    lore: >
      The heavy-bladed survival knife/machete carried by Catachan Jungle
      Fighters and often imitated by other jungle- and feral-world
      regiments; depicted in Astra Militarum background material as a
      point of regimental pride and a genuinely effective close-combat
      weapon rather than a mere tool, distinguishing it from the standard
      Munitorum knife.
    design: >
      Built one step up from the Munitorum combat knife on the machete/
      large-knife-to-shortsword continuum: a blade long and heavy enough to
      be genuinely dangerous in melee (matching its lore reputation as a
      combat weapon, not just a tool) gets the Shortsword profile
      (thr+1 imp/sw+1 cut) rather than the plain Knife profile, at a
      correspondingly higher min ST (9) and weight. Not a framework anchor;
      calibrated relative to the knife anchor above it and the chainsword
      anchor above that.

  - name: Commissar's Sabre
    tl: 4
    lc: 2
    cost: 600
    weight: 3
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Thrust
        damage: thr+1 imp
        reach: 1
        parry: 0
        st: 9
        skill: Shortsword
      - usage: Swing
        damage: sw+1 cut
        reach: 1
        parry: 0
        st: 9
        skill: Shortsword
    notes: A badge of office as much as a weapon; carrying one marks the bearer as a commissar or officer to friend and foe alike.
    lore: >
      The curved sabre is near-universal Commissariat and senior-officer
      iconography in Astra Militarum art and fiction, frequently drawn
      during summary executions or to lead a charge (Ciaphas Cain and
      Gaunt's Ghosts both use this image repeatedly); it is functional, not
      purely ceremonial, and commissars are shown killing with it.
    design: >
      Same underlying profile as the Catachan Fang (a well-made one-handed
      cutting/thrusting blade, thr+1 imp/sw+1 cut, min ST 9) since nothing
      in the fiction suggests a sabre out-cuts a war-knife in a Guardsman's
      hands - the difference is entirely in cost, finish and legal status:
      LC2 and a high cost reflect that carrying one signals officer/
      commissar rank rather than reflecting a mechanical edge in a fight.

  # ------------------------------------------------------------------ Chain

  - name: Chainsword
    tl: 10
    lc: 2
    cost: 600
    weight: 6
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Swing
        damage: sw+2d(2) cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
    notes: >
      The motor and chain-teeth tear rather than cleanly cut, hence the
      Armor Divisor (2) rather than a clean-edged blade's no-divisor cut;
      the framework anchor notes it "skids off power armour" - against
      DR 70+ targets it essentially never penetrates, at the table's
      discretion the GM may rule the chain simply fails to bite rather than
      dealing a grazing wound. A jammed or fouled chain (tangled cloth,
      bone, or a lucky parry) may stall the motor until cleared with a
      Ready maneuver.
    lore: >
      The archetypal Imperial melee weapon: sergeants, veterans and
      officers across the Astra Militarum, plus most Chaos and Imperial
      cultist/human forces, carry a motorised chainblade; consistently
      shown butchering unarmoured infantry but failing to trouble power
      armour, matching the framework anchor's own description.
    design: >
      Fixed anchor (Rescale): sw+2d(2) cut, reach 1, parry 0, min ST 10.
      The Rescale raised the chainsword from a flat sw+1d cut with no
      divisor to sw+2d(2): against carapace (DR 45) a Guardsman-strength
      swing (roughly 3d+1 total) essentially never gets through (eff. DR 22
      well above the average roll), matching "bites carapace" only in an
      Astartes' hands, while it still guts an unarmoured man or a flak
      vest (DR 12, eff. 6) on nearly every hit and skids off power armour
      (eff. DR 50+) outright - exactly the framework's "tears flesh and
      flak; bites carapace; skids off power armour." Weight (6 lb, heavier
      than a plain sword for the motor housing and chain loop) and min ST
      10 (higher than a mundane broadsword's ST 9-10 band, again for the
      added mass) are the only free parameters. TL10 and LC2 per the
      framework's own worked example ("Standard Imperial manufacture:
      TL10 ... chainsword").

  - name: Chainsword, Astartes Pattern
    tl: 10
    lc: 1
    cost: 1500
    weight: 14
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Swing
        damage: sw+2d(2) cut
        reach: 1
        parry: 0
        st: 15
        skill: Broadsword
    notes: Same rules as the human chainsword above (chain-vs-armour, jamming); scaled to a Marine's grip and strength.
    lore: >
      The Adeptus Astartes issue a larger, heavier-toothed chainsword built
      to Astartes proportions - a recurring sidearm for Tactical and
      Assault Marines throughout Black Library fiction, distinct from (and
      more common than) power swords, which are reserved for veterans and
      officers.
    design: >
      The sw+2d(2) cut formula is unchanged from the human-scale anchor -
      GCS resolves "sw" from the wielder's own ST, so an Astartes swinging
      this weapon already rolls more dice than a human swinging the
      human-scale version (a Marine's sw is 5d vs. a Guardsman's 3d+1,
      before the +2d chain bonus) without changing the weapon's damage
      line. This is exactly why an Astartes chainsword bites carapace
      (DR 45) roughly one swing in ten while a Guardsman's essentially
      never does, and still skids off power armour either way. What must
      change, per the framework's instruction that human- and Astartes-
      scale versions need different min ST and weight, is the housing
      itself: heavier chain loop and motor (14 lb vs. 6 lb) and a min ST
      (15) far above what an unaugmented human can bring to bear
      one-handed, so a human could not wield this pattern even though the
      damage formula looks identical on paper. LC1 (Astartes-issue), not
      LC0, since the framework's LC1 bracket explicitly covers
      Astartes-carried war-gear one tier below power-armour-integrated
      items.

  - name: Chainaxe
    tl: 10
    lc: 1
    cost: 1400
    weight: 15
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Swing
        damage: sw+2d+2(2) cut
        reach: 1
        parry: -1
        st: 13
        skill: Axe/Mace
    notes: Chain-vs-armour and jamming rules as the chainsword; the single heavy blade makes it even more prone to sticking in a solid hit than a chainsword's finer teeth.
    lore: >
      A heavier chain weapon favoured by close-combat specialists and
      several Chapters and warband traditions (most infamously World
      Eaters iconography, though Loyalist Astartes and some Guard veteran/
      penal formations field it too); depicted as hitting harder but
      handling clumsier than a chainsword.
    design: >
      Scaled from the chainsword anchor the way Basic Set/Low-Tech scale a
      one-handed axe over a one-handed sword of the same era: a single
      heavy, chain-driven axe-head carries more mass into the swing than a
      chainsword's full-length blade, for +2 damage over the chainsword's
      sw+2d, keeping the same Armor Divisor (2) since it's the same
      grinding chain-teeth mechanic; axes are traditionally worse for
      defense, hence parry -1 instead of 0. At Astartes ST an axe swing
      (5d+2(2)) bites carapace (DR 45) noticeably harder than a plain
      chainsword (about 1 hit in 5 vs. 1 in 10) but still skids off power
      armour, matching its "hits harder but handles clumsier" reputation.
      Min ST 13 sits above the human chainsword's ST 10 and below the
      Astartes chainsword's ST 15, reflecting that it is normally an
      Astartes weapon but (per its fiction) occasionally wielded one-handed
      by an unusually strong or augmented human at a stiff strength
      penalty.

  - name: Eviscerator
    tl: 10
    lc: 1
    cost: 1000
    weight: 25
    tags: [Melee Weapon, Imperium, Adepta Sororitas]
    weapons:
      - usage: Swing, two-handed
        damage: sw+3d(2) cut
        reach: "1,2"
        parry: -1
        st: 13
        skill: Two-Handed Sword
    notes: >
      Always wielded two-handed; treat as unready after a solid parry
      (the chain bucks in the user's grip) at the GM's discretion. Sisters
      Repentia below the listed min ST take the normal reduced-ST
      penalties to skill rather than being unable to lift it - their
      fervour, not raw strength, is what the fiction credits.
    lore: >
      An oversized, double-handed chain weapon issued to Adepta Sororitas
      Repentia squads doing penance in battle; consistently drawn and
      described as a huge, brutal chainblade too large and heavy for
      ordinary one-handed use, swung by zealots who accept the personal
      risk of wielding something this unwieldy.
    design: >
      One further step up the chain-weapon family from the chainaxe: a
      two-handed weapon gets Basic Set's two-handed bonus over a
      one-handed weapon of the same family (roughly +1 die over the
      one-handed chainaxe's sw+2d+2, rounded to a clean sw+3d cut), keeping
      the shared chain-family Armor Divisor (2), with reach extended to 1,2
      and parry penalised further (-1) for its bulk. At a Sororitas-typical
      ST this still only scratches carapace occasionally and does nothing
      to power armour - fitting its role as an anti-personnel penance
      weapon, not an anti-Astartes one. Min ST 13 is kept in the human
      range rather than pushed to Astartes levels, per its lore as human
      (if enhanced-by-faith) Sororitas wargear, not Astartes equipment -
      hence the notes on using it below min ST rather than simply barring
      human use outright.

  - name: Chainfist
    tl: 11
    lc: 1
    cost: 5000
    weight: 45
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Punch
        damage: thr+7d(10) cut
        reach: C
        parry: "-2"
        st: 17
        skill: Brawling
    notes: >
      Shares the power fist's servo-driven punch (see Power Fist below) but
      replaces the smooth crushing plates with a ring of high-speed chain
      teeth for gnawing through bulkheads, void-ship hulls and vehicle
      armour rather than just crushing flesh and ceramite; a hit that
      penetrates a vehicle's DR may be ruled to lodge the fist in the
      material, costing a Ready maneuver to wrench free (GM's discretion).
      Like the power fist, it is slow and clumsy in a defensive sense: -2
      to parry, and it cannot be used to Feint.
    lore: >
      A rarer, heavier variant of the power fist mounting a chainblade ring
      instead of a plain gauntlet, issued to Astartes and Imperial Knight
      pilots for boarding actions and siege-breaching where cutting through
      armour plate or a bulkhead matters as much as punching through a
      body; consistently shown as slower and more specialised than a plain
      power fist.
    design: >
      Same servo-fist chassis and damage logic as the Power Fist entry
      below (thr plus a large flat die bonus from the hydraulic mechanism,
      not a multiplier on the wielder's own thrust - see that entry's design
      note for why), with the same (10) disruption-field divisor every Imperial
      power weapon shares (framework.md, power-field rule), and the
      die count is one step down (+7d vs. the power fist's +8d) because
      chain teeth trade some raw hitting power for penetration and add
      their own moving parts' weight and drag. At Astartes ST (thr+7d
      averaging around 30) it still penetrates Terminator plate (eff. DR 20)
      the large majority of the time, keeping it a credible boarding/
      breaching weapon even though it hits slightly softer than a plain
      power fist. TL11 (advanced Imperial/rare, shares the power-field-
      adjacent servo technology) and LC1 (Astartes power-weapon-tier
      legality per the framework).

  # --------------------------------------------------------- Shock/electro

  - name: Shock Maul
    tl: 10
    lc: 2
    cost: 150
    weight: 3
    tags: [Melee Weapon, Imperium, Adeptus Arbites]
    weapons:
      - usage: Swing
        damage: sw+1 cr
        reach: 1
        parry: 0
        st: 8
        skill: Axe/Mace
        notes: A hit that does any HP of damage forces the target to roll HT-3 or be stunned (treat as the standard Stun rule, B420) from the charge.
    notes: Draws from a small power cell; good for many dozens of charged strikes before a recharge is needed.
    lore: >
      The standard Adeptus Arbites and hive-enforcer riot weapon: a
      shock-charged baton meant to subdue rather than kill, ubiquitous in
      Arbites background material and Necromunda-adjacent underhive
      fiction as the tool of choice for crowd control and arrests.
    design: >
      Built as a plain club (sw+1 cr, matching the Guardsman's maul one
      step up for its denser Arbites-grade construction) plus a Basic Set
      electrical-stun effect layered on top as a secondary rules note
      (HT-3 or stunned) rather than a new damage type, since GURPS models
      "shocked and dazed but not much hurt" through the Stun rule, not
      through raw damage. Rescale note: this weapon's raw damage is left
      unchanged, since it was never anchored to any armour DR figure - it's
      plain ST-scaled club damage, and its entire purpose (subduing a
      target, not penetrating armour) is carried by the Stun rule rather
      than by beating DR, so the armour-anchor rescale doesn't touch it.
      TL10 for the power cell and stun generator; LC2 (enforcer/Arbites-
      issue, not general military) per the framework's "military-issue
      heavy weapons, carapace, hellguns" LC2 bracket.

  - name: Electro-flail
    tl: 10
    lc: 2
    cost: 250
    weight: 6
    tags: [Melee Weapon, Imperium, Adeptus Arbites]
    weapons:
      - usage: Swing
        damage: sw+2 cr
        reach: "1,2*"
        parry: "No"
        st: 10
        skill: Flail
        notes: A hit that does any HP of damage forces the target to roll HT-3 or be stunned (B420), as the shock maul.
    notes: Flails cannot parry (Basic Set flail rule) and the head's momentum makes them awkward around allies at close range.
    lore: >
      A heavier, multi-headed shock weapon seen in Ecclesiarchy penitent
      and some Arbites riot-control contexts, its swinging heads and
      crackling charge making it as much an instrument of intimidation as
      of subjugation; less common than the shock maul and depicted as
      harder to control.
    design: >
      Standard Basic Set flail design logic (extra reach when extended,
      cannot parry, more damage than a rigid weapon of similar weight for
      the whipping strike) applied one step above the shock maul (sw+2 cr
      vs. sw+1 cr) since a multi-headed flail carries more striking mass,
      plus the same HT-3 stun note. As with the shock maul, raw damage is
      unaffected by the armour-DR rescale: this is a subdual weapon whose
      job is done by the Stun rule, not by beating DR. TL/LC match the
      shock maul's bracket.

  - name: Shock Staff
    tl: 10
    lc: 2
    cost: 200
    weight: 4
    tags: [Melee Weapon, Imperium, Adeptus Arbites]
    weapons:
      - usage: Swing
        damage: sw+1 cr
        reach: "1,2"
        parry: 0
        st: 8
        skill: Staff
        notes: A hit that does any HP of damage forces the target to roll HT-3 or be stunned (B420), as the shock maul.
      - usage: Thrust
        damage: thr+1 cr
        reach: "1,2"
        parry: 0
        st: 8
        skill: Staff
        notes: As the swing usage above.
    notes: The Staff skill's own active-defense bonus (see Basic Set) applies as normal; this entry adds no extra parry bonus beyond that.
    lore: >
      A two-handed shock weapon issued where reach and crowd control matter
      more than portability - riot lines, cell-block patrols, and some
      Ecclesiarchy or penal-world guards; less iconic than the shock maul
      but built on the same principle.
    design: >
      A quarterstaff profile (sw+1 cr/thr+1 cr, reach 1,2) carrying the
      same electro-stun note as the shock maul and electro-flail rather
      than a new mechanic; the two-handed reach trades the flail's extra
      damage for the Staff skill's superior defensive profile. Raw damage
      is left unchanged by the Rescale for the same reason as the rest of
      the shock-weapon family (it's a mundane, Stun-rule weapon, not one
      derived from any armour DR anchor). TL/LC match the rest of the
      shock-weapon family.

  - name: Power Maul, Arbites Pattern
    tl: 11
    lc: 1
    cost: 2200
    weight: 5
    tags: [Melee Weapon, Imperium, Adeptus Arbites]
    weapons:
      - usage: Suppression setting (field off)
        damage: sw+2 cr
        reach: 1
        parry: 0
        st: 10
        skill: Axe/Mace
        notes: A hit that does any HP of damage forces the target to roll HT-3 or be stunned (B420), as the shock maul.
      - usage: Lethal setting (field on)
        damage: sw+3d+2(10) cr
        reach: 1
        parry: 0
        st: 10
        skill: Axe/Mace
    notes: >
      Toggling between settings is a free action; Arbitrators are trained
      and expected to keep the weapon on suppression setting for routine
      enforcement and switch to lethal only against a genuine threat.
    lore: >
      A dual-mode maul issued to senior Arbites Judges and Marshals: an
      Adeptus Arbites badge of office as much as the shock maul is a
      street enforcer's tool, and background material is explicit that it
      can be dialled from a stunning baton up to a lethal power weapon.
    design: >
      Suppression setting is the same maul-plus-stun-note logic as the
      shock maul family above, one step heavier (sw+2 cr) for the denser
      Arbites-issue head; its damage is unaffected by the Rescale for the
      same reason as the mundane shock weapons. Lethal setting applies this
      file's general power-field rule (framework.md: field-on = mundane
      baseline +3d, Armor Divisor (10)): sw+2 cr (field off) becomes
      sw+3d+2(10) cr (field on) - the same +3d/(10) step used to build
      every other field-on/field-off pair in this file, keeping the
      Arbites maul consistent with the Chapter- and Sororitas-issue power
      weapons below it despite its different institutional owner.

  # --------------------------------------------------------------------- Power

  - name: Power Sword
    tl: 11
    lc: 1
    cost: 6000
    weight: 4
    tags: [Melee Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Field on
        damage: sw+3d+1(10) cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
      - usage: Field off (as plain blade)
        damage: sw+1 cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
    notes: >
      The disruption field is a toggle (free action); with the field off,
      this is an unremarkable, if beautifully made, one-handed sword. A
      depleted or damaged power cell disables the field the same way.
    lore: >
      The classic officer's and veteran's duelling and battle blade of the
      Imperium, from Guard colonels to Astartes veteran sergeants and
      Inquisitors; consistently shown shearing through flak, flesh and
      even power armour where a plain sword or chainsword would just
      bounce or skid, matching the framework anchor's own description.
    design: >
      Fixed anchor (Rescale): sw+3d+1(10) cut, reach 1, parry 0, min ST 10.
      This entry also establishes the general "power field" rule every
      other powered edged/blunt weapon in this file is built from
      (framework.md, power-field rule): comparing the anchor to a plain
      one-handed sword's Basic Set baseline (sw+1 cut for a broadsword-
      class blade) shows the field itself contributes exactly +3d damage
      and Armor Divisor (10) over the same weapon with the field off - the
      "field off" line above is that same sw+1 cut baseline, unchanged by
      the Rescale (a plain sword's mundane edge doesn't care what DR
      anchors moved). This is why the field-off usage is included
      explicitly: the framework says power field on/off must be modelled
      as separate weapon lines, and this file applies the same +3d/(10)
      delta to every bladed/mace power weapon below (thunder hammers get
      +6d and power fists thr+8d instead, per the framework's own
      breakdown), scaled from each weapon's own mundane baseline rather
      than re-deriving the anchor each time. Checked against the new
      armour anchors: a Guardsman-strength blow (sw=1d+1, so field-on
      totals 4d+1) penetrates carapace (DR 45, eff. 4) essentially always,
      Astartes power armour (DR 100, eff. 10) about 90% of the time, and
      Terminator plate (DR 200, eff. 20) about 5% of the time; an
      Astartes-strength blow (sw=3d, field-on 6d) penetrates Astartes
      power armour better than 99% of the time and Terminator plate more
      than half the time. This matches the framework's "the disruption
      field shears power armour whoever holds it" - even a human's power
      sword reliably beats another human's power armour. TL11 and LC1 per
      the framework's "Advanced Imperial/rare" and "power weapons"
      brackets.

  - name: Power Axe
    tl: 11
    lc: 1
    cost: 6000
    weight: 6
    tags: [Melee Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Field on
        damage: sw+3d+2(10) cut
        reach: 1
        parry: -1
        st: 12
        skill: Axe/Mace
      - usage: Field off (as plain blade)
        damage: sw+2 cut
        reach: 1
        parry: -1
        st: 12
        skill: Axe/Mace
    notes: Field toggle and depleted-cell rules as the power sword.
    lore: >
      A heavier power weapon favoured where a wielder wants more raw
      hitting power than a power sword at the cost of some finesse -
      recurring wargear for Astartes veterans and Guard officers with a
      taste for a bigger blade.
    design: >
      Applies the power-field rule established under Power Sword (+3d
      damage, Armor Divisor (10), field on vs. off) to a plain axe's Basic
      Set baseline (sw+2 cut, parry -1, per the same broadsword-vs-axe
      relationship used for the mundane weapons above) rather than to the
      power sword's own base line, since an axe and a sword are not the
      same mundane weapon with a field bolted on.

  - name: Power Maul
    tl: 11
    lc: 1
    cost: 5500
    weight: 5
    tags: [Melee Weapon, Imperium, Astra Militarum, Adeptus Astartes, Adepta Sororitas]
    weapons:
      - usage: Field on
        damage: sw+3d+2(10) cr
        reach: 1
        parry: 0
        st: 11
        skill: Axe/Mace
      - usage: Field off (as plain blade)
        damage: sw+2 cr
        reach: 1
        parry: 0
        st: 11
        skill: Axe/Mace
    notes: Field toggle and depleted-cell rules as the power sword; this is the general-issue pattern the Arbites power maul above is built from.
    lore: >
      A power weapon built around a blunt head rather than an edge, issued
      to some Ministorum, Sororitas and Guard-officer wielders who favour
      crushing force; background material treats it as functionally
      equivalent to a power sword or axe, just blunt rather than edged.
    design: >
      Same power-field rule as Power Sword and Power Axe (+3d, field on
      vs. off), applied to a plain mace's Basic Set baseline (sw+2 cr); the
      field still applies Armor Divisor (10) and damage type stays crushing
      rather than
      switching to cut, since the field disrupts and shears at the point of
      impact regardless of whether the striking surface is an edge or a
      flat head - the wound is still blunt trauma amplified by the field,
      matching 40k depictions of power mauls caving in what they hit rather
      than slicing it.

  - name: Power Lance
    tl: 11
    lc: 1
    cost: 7000
    weight: 15
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Field on, mounted charge
        damage: thr+3d+3(10) imp
        reach: "1,2*,3*"
        parry: -1
        st: 11
        skill: Spear
      - usage: Field on, braced (dismounted)
        damage: thr+3d+2(10) imp
        reach: "1,2"
        parry: -1
        st: 11
        skill: Spear
      - usage: Field off, mounted charge
        damage: thr+3 imp
        reach: "1,2*,3*"
        parry: -1
        st: 11
        skill: Spear
    notes: >
      The full mounted-charge bonus (marked *) requires a mount at a
      gallop per the lance rules a GM is already using for cavalry combat;
      used from the ground it only reaches the braced profile.
    lore: >
      Carried by Rough Rider-type Guard cavalry and some Sororitas Seraphim
      or mounted formations as an upgrade over a mundane hunting lance;
      depicted as punching through infantry and light vehicles alike on a
      charge.
    design: >
      Baseline mundane lance follows Basic Set cavalry lance logic
      (thr+3 imp mounted at a charge, extra reach only while mounted and
      moving); the power-field rule adds its usual +3d and Armor Divisor
      (10) on top. The braced (dismounted) line drops one point of charge
      momentum but keeps the field's own +3d bonus, since the field itself
      doesn't care whether the wielder is moving.

  - name: Power Stave
    tl: 11
    lc: 1
    cost: 5000
    weight: 5
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Field on, swing
        damage: sw+3d+2(10) cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
      - usage: Field on, thrust
        damage: thr+3d+2(10) cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
      - usage: Field off
        damage: sw+2 cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
    notes: >
      This is a mundane-but-powered stave (a two-handed power maul built
      long, for reach and the Staff skill's defensive bonus), not a
      psyker's force stave - a force weapon draws on the wielder's own
      Warp-touched abilities and is covered separately.
    lore: >
      Issued to some Inquisitorial acolytes, tech-adepts and Ministorum
      enforcers who want a power weapon's bite with a quarterstaff's reach
      and two-handed control rather than a one-handed blade.
    design: >
      Same power-field rule as Power Maul (+3d, field on vs. off), applied
      to a two-handed quarterstaff's Basic Set baseline (sw+2 cr/thr+2 cr,
      reach 1,2) instead of a one-handed mace. Explicitly not the same item as a
      force stave (a Warp-powered weapon keyed to a psyker's own ability,
      per framework.md's psychic-power rules) - that variant belongs to the
      psyker-equipment file, not here.

  - name: Power Fist
    tl: 11
    lc: 1
    cost: 8000
    weight: 40
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Punch
        damage: thr+8d(10) cr
        reach: C
        parry: "-2"
        st: 15
        skill: Brawling
    notes: >
      Cannot be used to Feint, and the -2 parry reflects how slow and
      clumsy the servo-driven gauntlet is to reposition defensively; a GM
      may rule it takes a Ready maneuver to recover after a solid punch
      against a very hard surface (a wall, a vehicle hull). It is not a
      precision weapon: no combination of skill or luck lets it target a
      called shot at a meaningful bonus (GM's call).
    lore: >
      One of the signature Astartes and Terminator melee weapons: a
      reinforced gauntlet with an internal power field and myo-fibre
      actuators, consistently shown punching clean through Astartes power
      armour, vehicle hulls and monstrous xenos alike - the framework's
      Tactical Dreadnought (DR 200) armour table entry explicitly lists the
      power fist as one of the few things that still kills a Terminator.
    design: >
      Fixed anchor (Rescale, framework.md): thr+8d(10) cr. It is built from
      first principles rather than borrowed from a catalogue "power glove":
      because the internal actuators (not the wielder's own swing) generate
      most of the force, its bonus is a large flat die addition to the
      wielder's own thrust (thr+8d) rather than a multiplier on that thrust
      (a "thr x3"-style multiplier was considered and rejected, since it
      would make the weapon nearly unusable in a human's hands and
      absurdly swingy in an Astartes', whereas a flat die bonus keeps it
      dangerous regardless of wielder and matches the fiction that the fist
      itself, not the arm behind it, is doing the killing). Armor Divisor
      (10) is the shared disruption-field divisor (framework.md,
      power-field rule). At Astartes ST 18, thr+8d (thr 1d+2, so 9d+2,
      avg ~33.5) against Terminator plate (DR 200, eff. DR 20) penetrates
      about 99.5% of the time and against Astartes power armour (DR 100,
      eff. 10) essentially always, matching "power fist ... kills
      Terminators in Astartes hands" cleanly. Reach C, parry -2 and the
      no-Feint/no-called-shot notes encode the framework's "power fist ...
      unwieldy (hard to parry, slow)" instruction without needing a bespoke
      game mechanic beyond existing GURPS defense penalties.

  - name: Relic Blade
    tl: 11
    lc: 1
    cost: 15000
    weight: 8
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Field on
        damage: sw+3d+3(10) cut
        reach: "1,2"
        parry: 0
        st: 16
        skill: Broadsword
      - usage: Field off (as plain blade)
        damage: sw+3 cut
        reach: "1,2"
        parry: 0
        st: 16
        skill: Broadsword
    notes: >
      Always a unique, named heirloom weapon in the fiction; a given relic
      blade may carry additional individual traits or a name-specific
      ability a GM adds on top of this baseline profile.
    lore: >
      Ancient, master-crafted power swords carried by Chapter Masters and
      other Astartes heroes, oversized compared to a standard power sword
      and wielded one-handed only by Astartes-grade strength; a recurring
      "hero weapon" across Black Library Space Marine fiction (e.g. named
      blades carried by Chapter Masters and First Company veterans).
    design: >
      Applies the power-field rule (+3d, field on vs. off) to a two-handed
      greatsword's Basic Set baseline (sw+3 cut) rather than the one-handed
      broadsword baseline used for the standard power sword, reflecting a
      longer, heavier blade; min ST 16 keeps it a firmly Astartes-only
      weapon (a human could not meet the strength requirement even
      one-handed), matching the fiction that ordinary humans do not wield
      relic blades. At Astartes ST (sw=3d, field-on 6d+3, avg ~24) it
      penetrates Astartes power armour (DR 100, eff. 10) essentially always
      and Terminator plate (DR 200, eff. 20) about 4 times in 5, a step
      above the standard power sword's own Astartes-hands figures,
      fitting its "hero weapon" status.

  - name: Thunder Hammer
    tl: 11
    lc: 1
    cost: 9000
    weight: 35
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Field on, two-handed swing
        damage: sw+6d(10) cr
        reach: 1
        parry: -1
        st: 15
        skill: Two-Handed Axe/Mace
      - usage: Field off (as plain maul)
        damage: sw+3 cr
        reach: 1
        parry: -1
        st: 15
        skill: Two-Handed Axe/Mace
    notes: >
      Any hit that penetrates the target's DR also inflicts Knockback
      (B378) using the raw crushing damage rolled, even against a target
      too armoured to actually be wounded much - representing Astartes,
      Terminators and even light vehicles being physically hurled by the
      blow, per the weapon's fiction reputation.
    lore: >
      A massive two-handed maul carrying a huge capacitor coil, issued to
      Astartes Terminator assault squads and veteran sergeants;
      consistently shown caving in Terminator armour and knocking
      opponents flying rather than cutting them, distinct in style from
      the disruption-field swords and axes above.
    design: >
      Fixed anchor (Rescale, framework.md): sw+6d(10) cr. A two-handed
      great maul's Basic Set baseline is sw+3 cr (unchanged, field off);
      the field's bonus is scaled up well past the standard +3d used for
      the sword/axe/maul family (framework.md: "thunder hammers +6d")
      since a thunder hammer's coil is built into a much larger head than a
      sword's blade, with the shared (10) disruption-field divisor. An
      earlier draft used (3) on the theory that a hammer beats armour by
      concussion, but that left a Marine's average blow unable to clear
      Terminator armour, contradicting the hammer's role as the
      Terminator-killer. At Astartes ST 18 (sw=3d, so 9d, avg ~31.5)
      against the Rescale's Terminator anchor (DR 200, eff. 20/10) it
      penetrates about 98-99% of the time and adds knockback. The knockback
      note captures the anchor-adjacent "thunder hammer" lore detail (send
      Marines and even light vehicles flying) using the existing Basic Set
      B378 knockback rule rather than a new mechanic, per this project's
      preference for built, not borrowed, but standard-rules design.

  - name: Lightning Claw
    tl: 11
    lc: 1
    cost: 6500
    weight: 3
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Field on
        damage: sw+3d-2(10) cut
        reach: C,1
        parry: -1
        st: 9
        skill: Brawling
      - usage: Field off (as claw gauntlet)
        damage: sw-2 cut
        reach: C,1
        parry: -1
        st: 9
        skill: Brawling
    notes: >
      Worn as a gauntlet rather than swung as a separate object; treat
      attacks as unarmed strikes enhanced by the claw for skill purposes
      (Brawling or Karate per framework.md's weapon skill table). See
      Lightning Claws, Paired below for the two-claw fighting set.
    lore: >
      A gauntlet mounting several short power-field blades, worn by
      specialist Astartes assault troops (Raven Guard and other Chapters
      with an assault-focused iconography feature prominently); individual
      claw strikes are lighter than a power sword's but the weapon is
      built around speed and repeated attacks rather than one heavy blow.
    design: >
      Applies the power-field rule to a set of short knuckle-blades rather
      than a full sword: the mundane baseline is a light claw weapon (built
      one step below the plain knife's sw-2 cut on weight/reach grounds,
      since the blades are short and fixed to a glove rather than a full
      hilt), giving sw+1d-2(10) cut with the field on. Min ST (9) and
      weight (3 lb per claw) are deliberately lower than the power sword's,
      reflecting a lighter weapon meant to be worn in pairs rather than a
      single two-handed-capable blade.

  - name: Lightning Claws, Paired
    tl: 11
    lc: 1
    cost: 13000
    weight: 6
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Field on (either claw)
        damage: sw+1d-2(10) cut
        reach: C,1
        parry: -1
        st: 9
        skill: Brawling
      - usage: Field off (either claw)
        damage: sw-2 cut
        reach: C,1
        parry: -1
        st: 9
        skill: Brawling
    notes: >
      One claw worn per hand; each claw is identical to the single
      Lightning Claw above. A wielder trained in two-weapon fighting may
      attack with both in the same turn using the standard Basic Set rules
      for fighting with two weapons (dual-weapon attack/off-hand weapon
      training), rather than any bespoke "paired claws" rule - this file
      adds no new mechanic for the pairing, only the matched equipment
      set. Losing the ability to parry with a shield or second weapon is
      the normal cost of fighting with a claw in each hand.
    lore: >
      The more iconic configuration: a claw on each hand rather than one
      claw and a bolt pistol or shield, a signature look for several
      assault-specialist Chapters in Black Library fiction and codex
      background, prized for the speed of a flurry of cuts over any single
      blow's power.
    design: >
      Identical per-claw profile to the single Lightning Claw entry
      (paired weapons are the same item worn twice, not a mechanically
      different weapon), priced as two claws with only a small discount for
      buying the matched set. Making it a separate equipment entry (rather
      than a quantity of 2 on the single-claw entry) lets a character sheet
      show "wielding a matched pair" distinctly and lets the GM apply
      two-weapon fighting rules cleanly.

  - name: Blessed Blade, Sororitas Pattern
    tl: 11
    lc: 1
    cost: 7000
    weight: 4
    tags: [Melee Weapon, Imperium, Adepta Sororitas]
    weapons:
      - usage: Field on
        damage: sw+1d+1(10) cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
      - usage: Field off (as plain blade)
        damage: sw+1 cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
    notes: >
      Mechanically an ordinary power sword; any anti-daemon or faith-linked
      combat bonus a specific consecrated blade carries in play is a
      character/relic trait, not a property of the weapon itself, and
      belongs in a traits file rather than here.
    lore: >
      Adepta Sororitas power swords are frequently shown consecrated by an
      Order's chaplain before battle and treated as holy relics in their
      own right, especially those carried by Celestians, Palatines and
      Canonesses; the fiction does not suggest the blessing changes what
      the blade physically does to a target, only what it means to the
      wielder and her Order.
    design: >
      Identical stat block to the Power Sword anchor entry (this is the
      framework's own instruction: a bolter built for the Astartes armoury
      and one carried by a Sister of Battle are the same weapon with the
      same numbers) at a higher cost reflecting the rarity and ceremony of
      a named, consecrated blade rather than any mechanical difference. Any
      distinct blessing/relic effect is deliberately left out of this
      equipment entry and left for a traits file to add on top, per the
      separation of concerns in data-format.md.

  # ------------------------------------------------------------------- Shields

  - name: Combat Shield
    tl: 2
    lc: 3
    cost: 40
    weight: 8
    tags: [Melee Weapon, Imperium, Astra Militarum, Adeptus Arbites]
    attributes: {block: 2}
    weapons:
      - usage: Shield bash
        damage: sw-2 cr
        reach: C,1
        parry: 0
        st: 8
        skill: Shield
    notes: >
      Riot and line-infantry shield issued to Arbites squads and some Guard
      formations for close-quarters and crowd-control work; the block
      bonus above uses the Shield skill as normal.
    lore: >
      A round or kite-shaped physical shield seen in Arbites riot-control
      and some Guard trench-fighting depictions; a mundane defensive tool
      with no energy field, unlike Astartes storm shields.
    design: >
      Basic Set Medium Shield stats (DB 2, modelled here as a +2 attribute
      bonus to Block per data-format.md's supported attribute list) plus
      the standard shield-bash attack (sw-2 cr); not anchored by
      framework.md, built from first principles as ordinary Low-Tech gear.

  - name: Boarding Shield
    tl: 2
    lc: 2
    cost: 150
    weight: 15
    tags: [Melee Weapon, Imperium, Astra Militarum]
    attributes: {block: 3}
    weapons:
      - usage: Shield bash
        damage: sw-1 cr
        reach: C,1
        parry: 0
        st: 11
        skill: Shield
    notes: Larger and heavier than a combat shield, meant to cover a boarder advancing down a corridor or breach rather than a static line.
    lore: >
      A large, heavy void-ship boarding shield used by Naval boarding
      parties and some Guard siege/storm-trooper formations clearing
      confined spaces where a bolter or lasgun can't easily be brought to
      bear at close range; background material treats it as a specialist,
      situational item rather than universal-issue.
    design: >
      Basic Set Large Shield stats (DB 3, +3 Block attribute bonus) with a
      correspondingly higher min ST and weight than the Combat Shield; not
      anchored, built from Low-Tech shield-scaling logic.

  - name: Storm Shield
    tl: 10
    lc: 1
    cost: 9000
    weight: 20
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    attributes: {block: 3}
    weapons:
      - usage: Shield bash
        damage: sw+1 cr
        reach: C,1
        parry: 0
        st: 14
        skill: Shield
    notes: >
      This entry is the physical shield only: the ceramite/adamantium
      plate, its bash attack, and its Block bonus. The storm shield's
      signature void/energy dispersion field - the part of its reputation
      that lets it stop power weapons, chainblades and even a bolt round
      outright - is a separate force-field feature layered on top and
      belongs in the personal armour file alongside other Astartes energy
      shielding, not here; treat this shield as "just" a very large,
      well-made Astartes plate until that feature is added from that file.
    lore: >
      Carried by Astartes Terminators and some veteran assault troops
      (paired with a thunder hammer as the classic "hammer and shield"
      Terminator loadout); consistently shown stopping blows that would
      shear through lesser shields or armour, which the fiction attributes
      to an active energy field rather than the metal plate alone.
    design: >
      Physical component built as an Astartes-scale large shield (Basic
      Set Large Shield DB 3, +3 Block) at Astartes weight and min ST (20
      lb, ST 14, both above the human Boarding Shield's figures the way the
      Astartes chainsword sits above the human one); the bash attack scales
      up accordingly (sw+1 cr, heavier plate than a boarding shield). The
      force-field component that does the real work in the fiction (per
      the framework's instruction that the force field is the armour
      agent's responsibility, referenced here only in notes) is
      deliberately left out of this equipment entry's damage/DR fields so
      the two files don't duplicate or contradict each other's numbers.
