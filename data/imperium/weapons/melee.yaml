      crafted Astartes blade wielded one-handed: weight bumped from 8 lb to
      10 lb and min ST from 16 to 17, keeping it a firmly Astartes-only
      weapon - a human could not meet the strength requirement even
      one-handed, matching the fiction that ordinary humans do not wield
      relic blades. Parry stays 0 (Broadsword, a guarded blade rather than
      an axe/mace weapon).

  - name: Thunder Hammer
    tl: 11
    lc: 1
    cost: 9000
    weight: 40
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Field on, two-handed swing
        damage: sw+6d(10) cr
        reach: 1
        parry: "0U"
        st: 21
        skill: Two-Handed Axe/Mace
      - usage: Field off (as plain maul)
        damage: sw+3 cr
        reach: 1
        parry: "0U"
        st: 21
        skill: Two-Handed Axe/Mace
    notes: >
      Any hit that penetrates the target's DR also inflicts Knockback
      (B378) using the raw crushing damage rolled, even against a target
      too armoured to actually be wounded much - representing Astartes,
      Terminators and even light vehicles being physically hurled by the
      blow, per the weapon's fiction reputation. The 0U parry is the Basic
      Set figure for a two-handed maul/great axe class weapon (B271): it
      can still parry, but the wielder cannot parry again with it until a
      turn has passed since the last parry.
    lore: >
      A massive two-handed maul carrying a huge capacitor coil, issued to
      Astartes Terminator assault squads and veteran sergeants;
      consistently shown caving in Terminator armour and knocking
      opponents flying rather than cutting them, distinct in style from
      the disruption-field swords and axes above.
    design: >
      Fixed anchor (Rescale, framework.md): sw+6d(10) cr. A two-handed
      great maul's Basic Set baseline is sw+3 cr (unchanged, field off);
      the field's bonus is scaled up well past the standard +3d used for
      the sword/axe/maul family (framework.md: "thunder hammers +6d")
      since a thunder hammer's coil is built into a much larger head than a
      sword's blade, with the shared (10) disruption-field divisor. An
      earlier draft used (3) on the theory that a hammer beats armour by
      concussion, but that left a Marine's average blow unable to clear
      Terminator armour, contradicting the hammer's role as the
      Terminator-killer. At Astartes ST 30 (sw 5d+2, so 11d+2, average 40.5)
      against the Rescale's Terminator anchor (DR 200, eff. 20) it
      penetrates every time and adds knockback. The knockback
      note captures the anchor-adjacent "thunder hammer" lore detail (send
      Marines and even light vehicles flying) using the existing Basic Set
      B378 knockback rule rather than a new mechanic, per this project's
      preference for built, not borrowed, but standard-rules design.
      Handling: re-derived against a real Low-Tech great maul analogue
      (Great Maul: roughly 15-20 lb, ST 17-19, two-handed) scaled up hard
      for a "massive two-handed maul carrying a huge capacitor coil" -
      weight bumped from a previously-copied 35 lb to 40 lb and min ST from
      15 to 21, both far above the standard power sword/axe/maul family
      (ST 10-12) and above even the Astartes chainaxe (ST 16), matching the
      lore's "heaviest thing an Astartes swings" reputation. Parry is
      corrected from a flat -1 to 0U, the actual Basic Set two-handed
      axe/mace figure: it is not worse to parry with than a one-handed
      weapon (0, not -1), but it is unbalanced and needs a turn to recover
      before parrying again (U) - previously this weapon had neither the
      right parry value nor the U flag.

  - name: Lightning Claw
    tl: 11
    lc: 1
    cost: 6500
    weight: 12
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Field on
        damage: sw+3d-2(10) cut
        reach: C,1
        parry: -1
        st: 13
        skill: Brawling
      - usage: Field off (as claw gauntlet)
        damage: sw-2 cut
        reach: C,1
        parry: -1
        st: 13
        skill: Brawling
    notes: >
      Worn as a power-armour or Terminator gauntlet, not swung as a separate object; treat
      attacks as unarmed strikes enhanced by the claw for skill purposes
      (Brawling or Karate per framework.md's weapon skill table). See
      Lightning Claws, Paired below for the two-claw fighting set.
    lore: >
      A gauntlet mounting several short power-field blades, worn by
      specialist Astartes assault troops (Raven Guard and other Chapters
      with an assault-focused iconography feature prominently); individual
      claw strikes are lighter than a power sword's but the weapon is
      built around speed and repeated attacks rather than one heavy blow.
    design: >
      Applies the power-field rule (+3d, field on vs. off) to a set of short knuckle-blades
      rather than a full sword: the mundane baseline is a light claw weapon (one step below the
      plain knife's sw-2 cut on weight and reach grounds, since the blades are short and fixed
      to a glove rather than a full hilt), giving sw+3d-2(10) cut with the field on. At Astartes
      ST 30 (sw 5d+2, field-on 8d, average 28) it clears Astartes power armour (DR 100, eff. 10)
      always and Terminator plate (DR 200, eff. 20) 93.9% of the time, reflecting a fast weapon
      built around repeated attacks rather than one heavy blow.
      Handling: an Astartes/Terminator power-armour gauntlet rather than a light hand weapon:
      the fiction and every model depiction show a bulky, armoured, power-field-generating fist
      unit integrated into a warplate glove. 12 lb (a bolt-pistol-sized housing plus the field
      generator and blade assembly) and min ST 13, an Astartes-only figure consistent with the
      weapon's LC1/Adeptus Astartes-only issue: no human wields one in the fiction. Reach C,1
      and parry -1 (Brawling, no axe/mace U convention since it's an unarmed-style weapon).
      Weight and min ST are lower than the Power Fist's 40 lb/ST 15, reflecting a lighter,
      faster gauntlet meant to be worn in pairs rather than a single crushing weapon.

  - name: Lightning Claws, Paired
    tl: 11
    lc: 1
    cost: 12000
    weight: 22
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Field on (either claw)
        damage: sw+3d-2(10) cut
        reach: C,1
        parry: -1
        st: 13
        skill: Brawling
      - usage: Field off (either claw)
        damage: sw-2 cut
        reach: C,1
        parry: -1
        st: 13
        skill: Brawling
    notes: >
      One claw worn per hand; each claw is identical to the single
      Lightning Claw above. A wielder trained in two-weapon fighting may
      attack with both in the same turn using the standard Basic Set rules
      for fighting with two weapons (dual-weapon attack/off-hand weapon
      training), rather than any bespoke "paired claws" rule - this file
      adds no new mechanic for the pairing, only the matched equipment
      set. Losing the ability to parry with a shield or second weapon is
      the normal cost of fighting with a claw in each hand.
    lore: >
      The more iconic configuration: a claw on each hand rather than one
      claw and a bolt pistol or shield, a signature look for several
      assault-specialist Chapters in Black Library fiction and codex
      background, prized for the speed of a flurry of cuts over any single
      blow's power.
    design: >
      Identical per-claw profile to the single Lightning Claw entry
      (paired weapons are the same item worn twice, not a mechanically
      different weapon), priced at $12,000, a discount of $1,000 on two single
      claws ($13,000) for buying the matched set. Making it a separate equipment entry (rather
      than a quantity of 2 on the single-claw entry) lets a character sheet
      show "wielding a matched pair" distinctly and lets the GM apply
      two-weapon fighting rules cleanly.
      Handling: total weight is two corrected 12 lb claws minus a small
      integration saving for the shared power-cell routing (22 lb rather
      than a flat 24 lb), not the doubled-wrong-number the old 3 lb entry
      would have given (6 lb for a "pair" of gauntlets meant to punch
      through Terminator plate was never plausible). Min ST (13), reach
      (C,1) and parry (-1) are identical per claw to the single Lightning
      Claw above, since each hand fights as its own weapon.

  - name: Blessed Blade, Sororitas Pattern
    tl: 11
    lc: 1
    cost: 7000
    weight: 4
    tags: [Melee Weapon, Imperium, Adepta Sororitas]
    weapons:
      - usage: Field on
        damage: sw+3d+1(10) cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
      - usage: "Thrust, field on"
        damage: thr+3d+2(10) imp
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
      - usage: Field off (as plain blade)
        damage: sw+1 cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
      - usage: "Thrust, field off (as plain blade)"
        damage: thr+2 imp
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
    notes: >
      Mechanically an ordinary power sword; any anti-daemon or faith-linked
      combat bonus a specific consecrated blade carries in play is a
      character/relic trait, not a property of the weapon itself, and
      belongs in a traits file rather than here.
    lore: >
      Adepta Sororitas power swords are frequently shown consecrated by an
      Order's chaplain before battle and treated as holy relics in their
      own right, especially those carried by Celestians, Palatines and
      Canonesses; the fiction does not suggest the blessing changes what
      the blade physically does to a target, only what it means to the
      wielder and her Order.
    design: >
      Identical stat block to the Power Sword anchor entry (this is the
      framework's own instruction: a bolter built for the Astartes armoury
      and one carried by a Sister of Battle are the same weapon with the
      same numbers) at a higher cost reflecting the rarity and ceremony of
      a named, consecrated blade rather than any mechanical difference. Any
      distinct blessing/relic effect is deliberately left out of this
      equipment entry and left for a traits file to add on top, per the
      separation of concerns in data-format.md.
      Handling: identical to the human-scale Power Sword - weight 4 lb,
      min ST 10, parry 0 (Broadsword) - since a Sororitas Battle Sister is
      human-scale, not Astartes-scale, and this is the same physical blade.

  # ------------------------------------------------------------------- Shields

  - name: Combat Shield
    tl: 2
    lc: 3
    cost: 40
    weight: 15
    tags: [Melee Weapon, Imperium, Astra Militarum, Adeptus Arbites]
    attributes: {block: 2}
    weapons:
      - usage: Shield bash
        damage: sw-2 cr
        reach: C,1
        parry: 0
        st: 9
        skill: Shield
    notes: >
      Riot and line-infantry shield issued to Arbites squads and some Guard
      formations for close-quarters and crowd-control work; the block
      bonus above uses the Shield skill as normal.
    lore: >
      A round or kite-shaped physical shield seen in Arbites riot-control
      and some Guard trench-fighting depictions; a mundane defensive tool
      with no energy field, unlike Astartes storm shields.
    design: >
      Basic Set Medium Shield stats (DB 2, modelled here as a +2 attribute
      bonus to Block per data-format.md's supported attribute list) plus
      the standard shield-bash attack (sw-2 cr); not anchored by
      framework.md, built from first principles as ordinary Low-Tech gear.
      Handling: re-derived against Basic Set's actual Medium Shield entry
      (B287: 15 lb, min ST 9, DB2) - the previous 8 lb/ST 8 figures matched
      a Small Shield's weight/DB pairing while still claiming DB2, an
      internal mismatch. Corrected to weight 15, min ST 9, matching a real
      Medium Shield exactly.

  - name: Boarding Shield
    tl: 2
    lc: 2
    cost: 150
    weight: 25
    tags: [Melee Weapon, Imperium, Astra Militarum]
    attributes: {block: 3}
    weapons:
      - usage: Shield bash
        damage: sw-1 cr
        reach: C,1
        parry: 0
        st: 11
        skill: Shield
    notes: Larger and heavier than a combat shield, meant to cover a boarder advancing down a corridor or breach rather than a static line.
    lore: >
      A large, heavy void-ship boarding shield used by Naval boarding
      parties and some Guard siege/storm-trooper formations clearing
      confined spaces where a bolter or lasgun can't easily be brought to
      bear at close range; background material treats it as a specialist,
      situational item rather than universal-issue.
    design: >
      Basic Set Large Shield stats (DB 3, +3 Block attribute bonus) with a
      correspondingly higher min ST and weight than the Combat Shield; not
      anchored, built from Low-Tech shield-scaling logic.
      Handling: re-derived against Basic Set's actual Large Shield entry
      (B287: 25 lb, min ST 11, DB3) - min ST 11 already matched, but weight
      was previously set to 15 lb, a Medium Shield's figure paired with a
      Large Shield's DB. Corrected to weight 25, matching the real analogue.

  - name: Storm Shield
    tl: 11
    lc: 1
    cost: 9000
    weight: 32
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    attributes: {block: 3}
    weapons:
      - usage: Shield bash
        damage: sw+1 cr
        reach: C,1
        parry: 0
        st: 15
        skill: Shield
    notes: >
      This entry is the physical shield only: the ceramite/adamantium
      plate, its bash attack, and its Block bonus. The storm shield's
      signature void/energy dispersion field - the part of its reputation
      that lets it stop power weapons, chainblades and even a bolt round
      outright - is a separate force-field feature layered on top and
      belongs in the personal armour file alongside other Astartes energy
      shielding, not here; treat this shield as "just" a very large,
      well-made Astartes plate until that feature is added from that file.
    lore: >
      Carried by Astartes Terminators and some veteran assault troops
      (paired with a thunder hammer as the classic "hammer and shield"
      Terminator loadout); consistently shown stopping blows that would
      shear through lesser shields or armour, which the fiction attributes
      to an active energy field rather than the metal plate alone.
    design: >
      Physical component built as an Astartes-scale large shield (Basic
      Set Large Shield DB 3, +3 Block) at Astartes weight and min ST, above
      the human Boarding Shield's figures the way the
      Astartes chainsword sits above the human one; the bash attack scales
      up accordingly (sw+1 cr, heavier plate than a boarding shield). The
      force-field component that does the real work in the fiction (per
      the framework's instruction that the force field is the armour
      agent's responsibility, referenced here only in notes) is
      deliberately left out of this equipment entry's damage/DR fields so
      the two files don't duplicate or contradict each other's numbers.
      Handling: re-derived from the human Large Shield analogue (25 lb, ST
      11) the same way the Astartes chainsword scales from the human
      chainsword (roughly +8 lb, +5 ST) - 32 lb loaded and min ST 15, both
      well above the Boarding Shield's figures but not pushed as far as a
      solid ceramite slab would go, since a Terminator's storm shield is
      still carried and maneuvered in a fight, not just braced.
