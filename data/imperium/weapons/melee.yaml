  - name: Power Fist
    tl: 11
    lc: 1
    cost: 8000
    weight: 40
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Punch
        damage: thr+8d(10) cr
        reach: C
        parry: "-2"
        st: 15
        skill: Brawling
    notes: >
      Cannot be used to Feint, and the -2 parry reflects how slow and
      clumsy the servo-driven gauntlet is to reposition defensively; a GM
      may rule it takes a Ready maneuver to recover after a solid punch
      against a very hard surface (a wall, a vehicle hull). It is not a
      precision weapon: no combination of skill or luck lets it target a
      called shot at a meaningful bonus (GM's call).
    lore: >
      One of the signature Astartes and Terminator melee weapons: a
      reinforced gauntlet with an internal power field and myo-fibre
      actuators, consistently shown punching clean through Astartes power
      armour, vehicle hulls and monstrous xenos alike - the framework's
      Tactical Dreadnought (DR 200) armour table entry explicitly lists the
      power fist as one of the few things that still kills a Terminator.
    design: >
      Fixed anchor (Rescale, framework.md): thr+8d(10) cr. It is built from
      first principles rather than borrowed from a catalogue "power glove":
      because the internal actuators (not the wielder's own swing) generate
      most of the force, its bonus is a large flat die addition to the
      wielder's own thrust (thr+8d) rather than a multiplier on that thrust
      (a "thr x3"-style multiplier was considered and rejected, since it
      would make the weapon nearly unusable in a human's hands and
      absurdly swingy in an Astartes', whereas a flat die bonus keeps it
      dangerous regardless of wielder and matches the fiction that the fist
      itself, not the arm behind it, is doing the killing). Armor Divisor
      (10) is the shared disruption-field divisor (framework.md,
      power-field rule). At Astartes ST 18, thr+8d (thr 1d+2, so 9d+2,
      avg ~33.5) against Terminator plate (DR 200, eff. DR 20) penetrates
      about 99.5% of the time and against Astartes power armour (DR 100,
      eff. 10) essentially always, matching "power fist ... kills
      Terminators in Astartes hands" cleanly.
      Handling: reach C, parry -2 and the no-Feint/no-called-shot notes
      encode the framework's "power fist ... unwieldy (hard to parry,
      slow)" instruction without needing a bespoke game mechanic beyond
      existing GURPS defense penalties; being an unarmed-style Brawling
      punch rather than a bladed weapon, the axe/mace "U" convention
      doesn't apply. Weight (40 lb) and min ST (15) are unchanged - already
      an Astartes-only figure.

