kind: equipment
output: Imperium/Weapons/Melee Weapons.eqp
items:
  # ---------------------------------------------------------------- Mundane

  - name: Combat Knife, Munitorum Pattern
    tl: 2
    lc: 4
    cost: 40
    weight: 1
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Thrust
        damage: thr-1 imp
        reach: C,1
        parry: -1
        st: 6
        skill: Knife
      - usage: Swing
        damage: sw-2 cut
        reach: C,1
        parry: -1
        st: 6
        skill: Knife
    notes: Standard sidearm/tool for every Guardsman; also the unmounted profile for the bayonet below.
    lore: >
      Every Imperial Guard regiment issues a plain steel fighting knife
      alongside the lasgun, seen constantly in the background as a
      last-resort weapon and general tool; Black Library fiction (Gaunt's
      Ghosts and others) treats it as unremarkable field kit rather than a
      named piece of wargear.
    design: >
      Built from Basic Set knife-family design logic, not anchored by
      framework.md (no dedicated anchor exists below the chainsword): a
      short single-edged blade gives thr-1 imp / sw-2 cut, reach C,1,
      min ST 6. TL2 reflects that a simple knife is primitive-tech
      regardless of the TL10 industry that stamps it out by the million; LC4
      matches "cheap civilian stubbers, knives" in the framework's legality
      table.
      Handling: parry corrected to -1, the Basic Set Knife entry's actual
      figure (a short blade with no guard and little reach gives a worse
      parry than a proper sword, not the parry 0 a previous pass copied from
      the sword-family weapons on this page). Weight (1 lb) and min ST (6)
      are unchanged - a plain steel blade this size needs almost no strength
      to wield.

  - name: Bayonet, Lug-Mounted
    tl: 2
    lc: 4
    cost: 30
    weight: 1
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Fixed to lasgun
        damage: thr+1 imp
        reach: "1,2"
        parry: 0
        st: 6
        skill: Spear
      - usage: Unmounted (as knife)
        damage: thr-1 imp
        reach: C,1
        parry: -1
        st: 6
        skill: Knife
      - usage: Unmounted, swing
        damage: sw-2 cut
        reach: C,1
        parry: -1
        st: 6
        skill: Knife
    notes: >
      Fits the standard-issue lasgun's bayonet lug (and most stub-pattern
      long arms of similar profile); mounting or removing it takes a Ready
      maneuver. Mounted, treat it as an improvised short spear rather than a
      knife for reach and defaults.
    lore: >
      Depicted throughout Guard fiction as the last line of defence when a
      firefight closes to melee and a Guardsman's lasgun runs dry or jams -
      "fix bayonets" is a recurring line in Astra Militarum combat scenes,
      most famously associated with charge orders in Gaunt's Ghosts-style
      trench and siege fighting.
    design: >
      Same blade and knife-mode profile as the Munitorum combat knife
      above; the mounted profile follows Basic Set convention for a bayonet
      fixed to a long arm (treated as a short thrusting spear once fixed,
      reach 1,2, +1 to thrust damage for the leverage of the gun's length
      behind the point) rather than inventing new mechanics. TL/LC as the
      knife it's built from.
      Handling: unmounted knife-mode parry corrected to -1 to match the
      Munitorum knife it shares a blade with; the mounted (Spear-skill)
      profile keeps parry 0, the Basic Set figure for a one-handed spear
      braced on a long arm, since a fixed bayonet has more reach and leverage
      to block with than a bare knife does. Weight and min ST are unchanged.

  - name: Combat Knife, Astartes Pattern
    tl: 2
    lc: 1
    cost: 200
    weight: 4
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Thrust
        damage: thr+1 imp
        reach: C,1
        parry: 0
        st: 11
        skill: Shortsword
      - usage: Swing
        damage: sw+1 cut
        reach: C,1
        parry: 0
        st: 11
        skill: Shortsword
    notes: Sized for a gauntleted Astartes hand; scaled to a human's shortsword rather than a human's knife.
    lore: >
      Space Marines carry a sidearm blade proportioned to their size and
      strength - visually a long fighting knife on a Marine's belt reads as
      a shortsword in a human's hand; consistently shown as a backup when a
      chainsword or bolt pistol isn't drawn, in Black Library Space Marine
      fiction from the Horus Heresy series onward.
    design: >
      Not a bigger version of the human combat knife's stat block (that
      would just be the same knife with a higher min ST, understating how
      much blade an Astartes-scale grip actually carries) - instead it is
      built on the human Shortsword profile (thr+1 imp/sw+1 cut) scaled up
      in weight and min ST for an Astartes fist, per the framework's rule
      that Astartes- and human-scale versions of the same weapon type need
      different stats, not just a relabelling. LC1 (Astartes-issue gear)
      rather than the LC4 civilian knife bracket.
      Handling: already built on the Shortsword profile, whose Basic Set
      parry is 0 (a proper hilt and cross-guard, unlike the plain-bladed
      Munitorum knife above), so no parry change is needed here - only the
      plain Knife-skill weapons on this page needed the -1 correction.
      Weight (4 lb) and min ST (11) are unchanged, already scaled up from
      the human knife's 1 lb/ST 6 for an Astartes-proportioned grip.

  - name: Entrenching Tool, Folding
    tl: 5
    lc: 4
    cost: 30
    weight: 5
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Spade edge
        damage: sw+1 cr
        reach: 1
        parry: "-1U"
        st: 8
        skill: Axe/Mace
    notes: >
      Doubles as a digging tool; treat as an improvised weapon (already priced and statted as one,
      no further penalty needed when it's used as intended). The U means the wielder cannot parry
      again with it until a turn has passed since the last parry (B404) - a heavy, head-forward
      tool is slow to bring back on guard.
    lore: >
      Standard Guard field-engineering kit, folded and slung on webbing;
      depicted in trench-warfare-flavoured Guard fiction being swung in
      desperate close combat as often as it's used to dig in, in the
      tradition of real-world entrenching-tool improvised weapons.
    design: >
      Not anchored; built as a short, heavy-headed improvised axe/mace per
      Basic Set logic - a folding steel spade has enough mass to crush but
      a poor edge and balance, giving sw+1 cr, reach 1, min ST 8. TL5 reflects the folding
      steel tool itself (an industrial product), not the Imperium's overall
      manufacturing TL.
      Handling: parry corrected to -1U, the Basic Set convention for a
      head-heavy chopping/crushing tool (Axe/Mace family, B271): it is worse
      to parry with than a purpose-built one-handed weapon, and swinging a
      lopsided spade-head leaves it out of position to parry again right
      away. Weight (5 lb) and min ST (8) are unchanged.

  - name: Maul, Guardsman's Club
    tl: 0
    lc: 4
    cost: 20
    weight: 3
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Swing
        damage: sw+2 cr
        reach: 1
        parry: "-1U"
        st: 9
        skill: Axe/Mace
    notes: >
      Riot batons, Arbites-issue billy clubs and improvised trench clubs all use this profile. The
      U means the wielder cannot parry again with it until a turn has passed since the last parry.
    lore: >
      The plainest possible melee weapon: a weighted length of wood, plas or
      scavenged pipe, seen everywhere from hive underworld gangs to
      penal-legion improvisation in Guard-adjacent fiction; no source treats
      it as anything but a crude, universally available last resort.
    design: >
      Straight Basic Set club design (sw+2 cr, reach 1, min ST 9);
      not anchored by framework.md since it sits well below the chainsword
      tier, TL0 because a club needs no technology at all.
      Handling: parry corrected to -1U, the standard Basic Set figure for a
      simple blunt club (Axe/Mace family) rather than the parry 0 a sword or
      knife gets - a plain weighted stick has no guard to block with and is
      slow to recover a swing. Weight and min ST are unchanged.

  - name: Catachan Fang
    tl: 2
    lc: 4
    cost: 60
    weight: 2.5
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Thrust
        damage: thr+1 imp
        reach: C,1
        parry: -1
        st: 8
        skill: Knife
      - usage: Swing
        damage: sw cut
        reach: C,1
        parry: -1
        st: 8
        skill: Knife
    notes: Doubles as a survival/jungle tool as well as a sidearm; several Catachan-pattern variants exist, all statted the same.
    lore: >
      The heavy-bladed survival knife/machete carried by Catachan Jungle
      Fighters and often imitated by other jungle- and feral-world
      regiments; depicted in Astra Militarum background material as a
      point of regimental pride and a genuinely effective close-combat
      weapon rather than a mere tool, distinguishing it from the standard
      Munitorum knife.
    design: >
      One step up from the Munitorum combat knife on the knife-to-machete continuum: a heavy
      blade in the Basic Set Large Knife class, scaled up to thr+1 imp, sw cut, reach C,1, min
      ST 8 and 2.5 lb (the combat knife is thr-1/sw-2 at 1 lb). It stays a Knife-skill weapon
      with the Knife parry of -1, so it is clearly a different item from the sabre. Not a
      framework anchor; calibrated between the knife above and the chainsword anchor below.

  - name: Commissar's Sabre
    tl: 4
    lc: 2
    cost: 600
    weight: 2.5
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Thrust
        damage: thr+1 imp
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
      - usage: Swing
        damage: sw+1 cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
    notes: A badge of office as much as a weapon; carrying one marks the bearer as a commissar or officer to friend and foe alike.
    lore: >
      The curved sabre is near-universal Commissariat and senior-officer
      iconography in Astra Militarum art and fiction, frequently drawn
      during summary executions or to lead a charge (Ciaphas Cain and
      Gaunt's Ghosts both use this image repeatedly); it is functional, not
      purely ceremonial, and commissars are shown killing with it.
    design: >
      A light sabre in the Broadsword class (Basic Set Cavalry Saber: sw+1 cut, thr+1 imp, parry
      0, ST 10), at 2.5 lb, 0.5 lb under the Basic Set's 3 lb: a slimmer officer's blade. It is
      a rank symbol first and out-cuts nothing in a Guardsman's hands, so the profile is the
      plain baseline; the difference from a war-knife is in cost, finish and legal status. LC2
      and a high cost reflect that carrying one signals officer or commissar rank rather than a
      mechanical edge. In the fiction commissars also carry chainswords and power swords, which
      are separate entries. Broadsword parry 0.

  # ------------------------------------------------------------------ Chain

  - name: Chainsword
    tl: 10
    lc: 2
    cost: 600
    weight: 6
    tags: [Melee Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Swing
        damage: sw+2d(2) cut
        reach: 1
        parry: 0
        st: 10
        skill: Broadsword
    notes: >
      The motor and chain-teeth tear rather than cleanly cut, hence the
      Armor Divisor (2) rather than a clean-edged blade's no-divisor cut;
      the framework anchor notes it "skids off power armour" - against
      DR 70+ targets a human wielder essentially never penetrates, at the table's
      discretion the GM may rule the chain simply fails to bite rather than
      dealing a grazing wound. A jammed or fouled chain (tangled cloth,
      bone, or a lucky parry) may stall the motor until cleared with a
      Ready maneuver.
    lore: >
      The archetypal Imperial melee weapon: sergeants, veterans and
      officers across the Astra Militarum, plus most Chaos and Imperial
      cultist/human forces, carry a motorised chainblade; consistently
      shown butchering unarmoured infantry but failing to trouble power
      armour, matching the framework anchor's own description.
    design: >
      Fixed anchor (Rescale): sw+2d(2) cut, reach 1, parry 0, min ST 10. The Rescale raised the
      chainsword from a flat sw+1d cut with no divisor to sw+2d(2). A Guardsman (ST 10-11, sw 1d
      to 1d+1) rolls about 3d(2), average 10.5-11.5: against carapace (DR 70, eff. 35) that
      never penetrates, and against a flak vest (DR 30, eff. 15) only about 5-9% of hits, so a
      Guardsman rarely gets through flak. An Astartes wielder (ST 30, sw 5d+2, so 7d+2(2),
      average 26.5) usually does: 99% against flak, 2.2% against carapace, and it skids off
      power armour (eff. DR 50+) outright. That matches the framework's "tears flesh and flak;
      bites carapace; skids off power armour", with "tears flak" belonging to the Marine. TL10
      and LC2 per the framework's own worked example ("Standard Imperial manufacture: TL10 ...
      chainsword").
      Handling: Broadsword's Basic Set parry (0) is correct for a bladed, guarded weapon like a
      chainsword, so no U or -1 correction applies (unlike the axe/mace/maul family). Weight (6
      lb, heavier than a plain sword for the motor housing and chain loop) and min ST 10 (above
      a mundane broadsword's ST 10 only in mass) are the only free parameters.

  - name: Chainsword, Astartes Pattern
    tl: 10
    lc: 1
    cost: 1500
    weight: 14
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Swing
        damage: sw+2d(2) cut
        reach: 1
        parry: 0
        st: 15
        skill: Broadsword
    notes: Same rules as the human chainsword above (chain-vs-armour, jamming); scaled to a Marine's grip and strength.
    lore: >
      The Adeptus Astartes issue a larger, heavier-toothed chainsword built
      to Astartes proportions - a recurring sidearm for Tactical and
      Assault Marines throughout Black Library fiction, distinct from (and
      more common than) power swords, which are reserved for veterans and
      officers.
    design: >
      The sw+2d(2) cut formula is unchanged from the human-scale anchor: GCS resolves "sw" from
      the wielder's own ST, so an Astartes (ST 30, sw 5d+2) swinging this weapon already rolls
      7d+2(2), average 26.5, against a Guardsman's 3d, without the weapon's damage line
      changing. Against flak (eff. DR 15) that penetrates 99% of hits and against carapace (DR
      70, eff. 35) 2.2%, and it still skids off power armour either way: the chain-vs-armour gap
      the framework describes, compressed toward "very occasionally" for carapace. What must
      change, per the framework's instruction that human- and Astartes-scale versions need
      different min ST and weight, is the housing: heavier chain loop and motor (14 lb vs. 6 lb)
      and a min ST (15) far above what an unaugmented human can bring to bear one-handed, so a
      human could not wield this pattern even though the damage formula looks identical on
      paper. LC1 (Astartes-issue), not LC0, since the framework's LC1 bracket covers Astartes-
      carried war-gear one tier below power-armour-integrated items.
      Handling: parry 0 (Broadsword, as the human pattern). This is the anchor case for the
      project's "same formula, heavier housing" rule that the Astartes power sword and power axe
      below also follow.

  - name: Chainaxe
    tl: 10
    lc: 1
    cost: 1400
    weight: 15
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Swing
        damage: sw+2d+2(2) cut
        reach: 1
        parry: "-1U"
        st: 16
        skill: Axe/Mace
    notes: >
      Chain-vs-armour and jamming rules as the chainsword; the single heavy blade makes it even
      more prone to sticking in a solid hit than a chainsword's finer teeth. The U means the
      wielder cannot parry again with it until a turn has passed since the last parry.
    lore: >
      A heavier chain weapon favoured by close-combat specialists and
      several Chapters and warband traditions (most infamously World
      Eaters iconography, though Loyalist Astartes and some Guard veteran/
      penal formations field it too); depicted as hitting harder but
      handling clumsier than a chainsword.
    design: >
      Scaled from the chainsword anchor the way Basic Set/Low-Tech scale a one-handed axe over a
      one-handed sword of the same era: a single heavy, chain-driven axe-head carries more mass
      into the swing than a chainsword's full-length blade, for +2 damage over the chainsword's
      sw+2d, keeping the same Armor Divisor (2) since it is the same grinding chain-teeth
      mechanic. At Astartes ST (sw 5d+2, so 7d+4(2), average 28.5) an axe swing bites carapace
      (DR 70, eff. 35) on 6.1% of hits, against the Astartes chainsword's 2.2%: roughly three
      times as often, though neither reliably bites carapace, and both skid off power armour.
      That matches its "hits harder but handles clumsier" reputation.
      Min ST 16 sits just above the Astartes chainsword's ST 15 because the axe is a bit heavier
      (15 lb vs. 14 lb). It is an Astartes weapon: an unusually strong or augmented human can
      swing it one-handed only at a stiff penalty for the missing strength.
      Handling: parry -1U, the Basic Set Axe/Mace figure for a one-handed axe (worse than a
      sword's parry 0, and unready after a parry the way every axe/mace/maul weapon here reads).

  - name: Eviscerator
    tl: 10
    lc: 1
    cost: 1000
    weight: 25
    tags: [Melee Weapon, Imperium, Adepta Sororitas]
    weapons:
      - usage: Swing, two-handed
        damage: sw+3d(2) cut
        reach: "1,2"
        parry: "-1U"
        st: 15
        skill: Two-Handed Sword
    notes: >
      Always wielded two-handed; the U means the wielder cannot parry again with it until a turn
      has passed since the last parry - the chain bucks hard enough in a solid hit to need a beat
      to bring back on guard, not merely a GM's-discretion "treat as unready" note. Sisters
      Repentia below the listed min ST take the normal reduced-ST
      penalties to skill rather than being unable to lift it - their
      fervour, not raw strength, is what the fiction credits.
    lore: >
      An oversized, double-handed chain weapon issued to Adepta Sororitas
      Repentia squads doing penance in battle; consistently drawn and
      described as a huge, brutal chainblade too large and heavy for
      ordinary one-handed use, swung by zealots who accept the personal
      risk of wielding something this unwieldy.
    design: >
      One further step up the chain-weapon family from the chainaxe: a
      two-handed weapon gets Basic Set's two-handed bonus over a
      one-handed weapon of the same family (roughly +1 die over the
      one-handed chainaxe's sw+2d+2, rounded to a clean sw+3d cut), keeping
      the shared chain-family Armor Divisor (2), with reach extended to 1,2.
      At a Sororitas-typical ST this still only scratches carapace occasionally and does nothing
      to power armour - fitting its role as an anti-personnel penance
      weapon, not an anti-Astartes one.
      Handling: re-derived against the real analogue of a Low-Tech two-
      handed greatsword-class weapon with a heavy chain drive bolted on -
      25 lb loaded (well above a mundane two-handed sword's 6-8 lb, for the
      motor, drive chain and reinforced haft) with min ST 15, well under
      the Astartes chainaxe's ST 16 for 15 lb because two hands share the
      load (and above the human chainsword's ST 10/6 lb), to reflect real
      mass, not raw Astartes strength - this stays a human (if
      enhanced-by-faith) weapon per its Sororitas lore, hence the notes on
      using it below min ST rather than simply barring human use outright.
      Parry corrected to -1U (Two-Handed Sword's baseline plus the same
      chain-weapon "must recover" logic used for the chainsword family),
      replacing the previous GM's-discretion note with an actual mechanical
      flag.

  - name: Chainfist
    tl: 11
    lc: 1
    cost: 5000
    weight: 45
    tags: [Melee Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Punch, field on
        damage: thr+7d(10) cut
        reach: C
        parry: "-2"
        st: 17
        skill: Brawling
      - usage: Punch, field off (chain teeth only)
        damage: thr+1d cut
        reach: C
        parry: "-2"
        st: 17
        skill: Brawling
    notes: >
      Shares the power fist's servo-driven punch (see Power Fist below) but
      replaces the smooth crushing plates with a ring of high-speed chain
      teeth for gnawing through bulkheads, void-ship hulls and vehicle
      armour rather than just crushing flesh and ceramite; a hit that
      penetrates a vehicle's DR may be ruled to lodge the fist in the
      material, costing a Ready maneuver to wrench free (GM's discretion).
      Like the power fist, it is slow and clumsy in a defensive sense: -2
      to parry, and it cannot be used to Feint.
    lore: >
      A rarer, heavier variant of the power fist mounting a chainblade ring
      instead of a plain gauntlet, issued to Terminators, Dreadnoughts
      and boarding specialists for boarding actions and siege-breaching where cutting through
      armour plate or a bulkhead matters as much as punching through a
      body; consistently shown as slower and more specialised than a plain
      power fist.
    design: >
      Same servo-fist chassis and damage logic as the Power Fist entry below (thr plus a large
      flat die bonus from the hydraulic mechanism, not a multiplier on the wielder's own thrust;
      see that entry's design note), with the same (10) disruption-field divisor every Imperial
      power weapon shares (framework.md, power-field rule). The die count is one step down (+7d
      vs. the power fist's +8d) because chain teeth trade some raw hitting power for penetration
      and add their own moving parts' weight and drag. At Astartes ST 30 (thr 3d, so thr+7d =
      10d, average 35) it penetrates Terminator plate (eff. DR 20) 99.7% of the time, keeping it
      a credible boarding and breaching weapon even though it hits slightly softer than a plain
      power fist. With the field off it is a chain-toothed gauntlet at the mundane baseline of
      thr+1d cut, reach C and parry -2 like the field-on line. TL11 (advanced Imperial/rare,
      shares the power-field-adjacent servo technology) and LC1 (Astartes power-weapon-tier
      legality per the framework).
      Handling: unarmed-style Brawling punch, not a bladed/axe weapon, so the axe/mace "U"
      convention doesn't apply; the -2 parry encodes how slow and hard to reposition a fist-
      mounted chain ring is. Weight 45 lb and min ST 17 are Astartes-only figures consistent
      with the Power Fist below.

  # --------------------------------------------------------- Shock/electro

  - name: Shock Maul
    tl: 10
    lc: 2
    cost: 150
    weight: 3
    tags: [Melee Weapon, Imperium, Adeptus Arbites]
    weapons:
      - usage: Swing
        damage: sw+1 cr
        reach: 1
        parry: "-1U"
        st: 8
        skill: Axe/Mace
        notes: A hit that does any HP of damage forces the target to roll HT-3 or be stunned (treat as the standard Stun rule, B420) from the charge.
    notes: >
      Draws from a small power cell; good for many dozens of charged strikes before a recharge is
      needed. The U means the wielder cannot parry again with it until a turn has passed since the
      last parry.
    lore: >
      The standard Adeptus Arbites and hive-enforcer riot weapon: a
      shock-charged baton meant to subdue rather than kill, ubiquitous in
      Arbites background material and Necromunda-adjacent underhive
      fiction as the tool of choice for crowd control and arrests.
    design: >
      Built as a plain club (sw+1 cr, matching the Guardsman's maul one
      step up for its denser Arbites-grade construction) plus a Basic Set
      electrical-stun effect layered on top as a secondary rules note
      (HT-3 or stunned) rather than a new damage type, since GURPS models
      "shocked and dazed but not much hurt" through the Stun rule, not
      through raw damage. Rescale note: this weapon's raw damage is left
      unchanged, since it was never anchored to any armour DR figure - it's
      plain ST-scaled club damage, and its entire purpose (subduing a
      target, not penetrating armour) is carried by the Stun rule rather
      than by beating DR, so the armour-anchor rescale doesn't touch it.
      TL10 for the power cell and stun generator; LC2 (enforcer/Arbites-
      issue, not general military) per the framework's "military-issue
      heavy weapons, carapace, hellguns" LC2 bracket.
      Handling: parry corrected to -1U to match the Axe/Mace family
      convention used consistently on this page (a rigid club-shaped weapon
      is worse to parry with than a sword, and slower to recover). Weight
      (3 lb) and min ST (8) are unchanged.

  - name: Electro-flail
    tl: 10
    lc: 2
    cost: 250
    weight: 6
    tags: [Melee Weapon, Imperium, Adeptus Arbites]
    weapons:
      - usage: Swing
        damage: sw+2 cr
        reach: "1,2*"
        parry: 0U
        st: 10
        skill: Flail
        notes: A hit that does any HP of damage forces the target to roll HT-3 or be stunned (B420), as the shock maul.
    notes: A flail can parry, but the U means the wielder cannot parry again with it until a turn has passed since the last parry; other fighters parry a flail attack at -4 (B404). The head's momentum makes it awkward around allies at close range.
    lore: >
      A heavier, multi-headed shock weapon seen in Ecclesiarchy penitent
      and some Arbites riot-control contexts, its swinging heads and
      crackling charge making it as much an instrument of intimidation as
      of subjugation; less common than the shock maul and depicted as
      harder to control.
    design: >
      Standard Basic Set flail design logic (extra reach when extended, more damage than a rigid
      weapon of similar weight for the whipping strike) applied one step above the shock maul
      (sw+2 cr vs. sw+1 cr) since a multi-headed flail carries more striking mass, plus the same
      HT-3 stun note. As with the shock maul, raw damage is unaffected by the armour-DR rescale:
      this is a subdual weapon whose job is done by the Stun rule, not by beating DR. TL/LC
      match the shock maul's bracket.
      Handling: parry 0U, the Basic Set Flail and Morningstar figure (the Basic Set lists both
