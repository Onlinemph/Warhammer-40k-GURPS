      more than portability - riot lines, cell-block patrols, and some
      Ecclesiarchy or penal-world guards; less iconic than the shock maul
      but built on the same principle.
    design: >
      A quarterstaff profile (sw+1 cr/thr+1 cr, reach 1,2) carrying the
      same electro-stun note as the shock maul and electro-flail rather
      than a new mechanic; the two-handed reach trades the flail's extra
      damage for the Staff skill's superior defensive profile. Raw damage
      is left unchanged by the Rescale for the same reason as the rest of
      the shock-weapon family (it's a mundane, Stun-rule weapon, not one
      derived from any armour DR anchor). TL/LC match the rest of the
      shock-weapon family.
      Handling: Staff is the one Basic Set skill family whose whole point is
      a superior, uncorrected parry (it gets its own +2 defense bonus at
      high skill per B208), so parry 0 with no U is correct here and is
      left unchanged, unlike the Axe/Mace-family shock weapons above.
      Weight (4 lb) and min ST (8) are unchanged.

