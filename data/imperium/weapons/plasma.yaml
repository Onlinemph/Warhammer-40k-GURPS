kind: equipment
output: Imperium/Weapons/Plasma Weapons.eqp
items:

  - name: Plasma Pistol
    tl: 11
    lc: 1
    cost: 2200
    weight: 6
    tags: [Missile Weapon, Imperium, Adeptus Astartes, Inquisition]
    weapons:
      - usage: Standard
        damage: 4dx4(3) burn ex
        acc: 2
        range: 100/300
        rof: 1
        shots: 6(20)
        st: 9†
        bulk: -2
        rcl: 2
        skill: Beam Weapons (Pistol)
        notes: >
          Malf 16 (older, less stable pattern). On a malfunction the containment coil fails: the
          firer immediately takes 2d×4(3) burn ex and the weapon is disabled until a Tech-Priest
          or Armoury roll repairs it.
      - usage: Supercharged
        damage: 4dx5(3) burn ex
        acc: 2
        range: 100/300
        rof: 1
        shots: 6(20)
        st: 9†
        bulk: -2
        rcl: 2
        skill: Beam Weapons (Pistol)
        notes: >
          Malf 14. On a malfunction the containment coil fails: the firer immediately takes
          2d×4(3) burn ex and the weapon is disabled until a Tech-Priest or Armoury roll repairs it.
    lore: >
      Widely carried by Inquisitors, veteran officers and Astartes as a compact answer to armour a
      bolt pistol cannot beat; Black Library and Codex background repeatedly show plasma pistols
      overheating and injuring or killing careless users, a trait long associated with older,
      unstable patterns especially.
    design: >
      Scaled down two dice from the plasma gun anchor (6dx4(3) burn ex) to 4dx4(3) burn ex for the
      standard, safe firing mode, keeping the same x4 standard / x5 supercharged multiplier pair
      used across every weapon in this file; the ×5 supercharged mode trades a Malf 14 risk for
      another 25% of damage, and the standard mode carries a lesser Malf 16 because this is an older,
      less stable pattern. Checked with the exact dice distribution: standard mode averages 56
      damage and penetrates Astartes power armour (DR 100, effective DR 33) 95% of the time and a
      Terminator (DR 200, effective DR 66) 24% of the time; supercharged raises Terminator
      penetration to 56%. A pistol-class charge clears flak and carapace with no meaningful chance
      of failure either way.
      Handling: 6 lb loaded for the containment coil, capacitor and cooling fins a plasma weapon
      needs even at pistol scale - heavier than a bolt pistol's mechanically simpler cartridge
      action. Min ST 9† (√(10×6)≈7.7, bumped for the bulky coil housing and the two-handed brace
      most depictions show even for a "pistol") is below the plasma gun's ST 12, reflecting the
      smaller charge; the † still lets it be fired two-handed at the listed ST. RoF 1, not a
      pistol's usual 3: a plasma weapon must let its containment
      field cycle and vent excess heat between shots (framework.md's plasma-weapons rule), so even
      a pistol-format coil cannot be fired semi-automatically like a solid-slug or las sidearm.
      Shots 6(20): a small charge cell good for six shots before a slow 20-second swap, in line
      with the plasma gun's own scaled-down cell. Bulk -2 and Rcl 2 are ordinary pistol figures.
      Overheat: the malfunction is a fraction of the weapon's own charge, 2d×4(3) burn ex (avg 28):
      it kills an unarmoured user, badly hurts one in flak (97% penetrates), and mostly spares Astartes
      plate (28% penetrates) and Terminators (0%). Exact figures by dice distribution.

  - name: Plasma Gun
    tl: 11
    lc: 1
    cost: 3200
    weight: 14
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Standard
        damage: 6dx4(3) burn ex
        acc: 3
        range: 150/450
        rof: 1
        shots: 8(20)
        st: 12
        bulk: -4
        rcl: 2
        skill: Beam Weapons (Rifle)
        notes: >
          Malf 16 (older, less stable pattern). On a malfunction the containment coil fails: the
          firer immediately takes 3d×4(3) burn ex and the weapon is disabled until a Tech-Priest
          or Armoury roll repairs it.
      - usage: Supercharged
        damage: 6dx5(3) burn ex
        acc: 3
        range: 150/450
        rof: 1
        shots: 8(20)
        st: 12
        bulk: -4
        rcl: 2
        skill: Beam Weapons (Rifle)
        notes: >
          Malf 14. On a malfunction the containment coil fails: the firer immediately takes
          3d×4(3) burn ex and the weapon is disabled until a Tech-Priest or Armoury roll repairs it.
    lore: >
      The plasma gun is the Guard's and the Astartes' standard answer to power armour and light
      vehicles alike; fiction from Gaunt's Ghosts to Space Marine Battles depicts it killing
      power-armoured targets outright while carrying a real chance of cooking its own wielder,
      especially on older, less stable patterns - the origin of the tabletop and RPG "gets hot"/
      overheat mechanic this entry represents mechanically as Malf 16 (standard) and Malf 14 (supercharged).
    design: >
      This is the project's fixed plasma anchor: 6dx4(3) burn ex, treated as the weapon's standard mode, which the framework states kills Marines through
      power armour without needing to invoke overheating; it carries only a Malf 16 as an older,
      less stable pattern (the supercharged mode is Malf 14). Checked with the exact dice
      distribution, not just the average: Astartes power armour is torso DR 100; armour divisor (3)
      drops effective DR to 33, and 6dx4 averages 84, penetrating essentially every hit (99.9%), so
      it kills reliably as required. Against a Terminator's DR 200 (effective DR 66) it still
      penetrates 86% of hits, matching the framework's explicit statement that plasma "penetrates
      Terminators more often than not." The supercharged mode (6dx5(3), Malf 14) bumps the
      multiplier one step further for harder targets (Mk X Gravis, multiple Terminators, light
      vehicles) at the cost of a real chance of the coil failing and burning the firer, matching the
      fiction's running theme of plasma weapons being feared by their own side almost as much as by
      the enemy. A malfunction does 3d×4(3) burn ex to the firer (avg 42): it kills an unarmoured or
      flak-armoured user outright, penetrates Astartes Mk VII 74% of the time (a wounded but living
      Marine, not a dead one), Gravis 50% and a Terminator 2%. The cannon and heavy incinerator
      (4d×4(3), avg 56) are worse: Terminator 24%.
      Shared pattern: Astartes carry this same weapon (Deathwatch shows the same guns), so it is one
      stat block, not a human/Astartes split.
      Handling: 14 lb loaded, per Only War/Rogue Trader's consistent depiction of a plasma gun as
      noticeably heavier than a lasgun for its coil, coolant jacket and capacitor bank. Min ST 12
      (√(10×14)≈11.8, matching the framework's own worked figure for a weapon this weight almost
      exactly) needs both hands and real upper-body strength to control, well above a lasgun's ST 9
      despite similar bulk, reflecting the reinforced housing a live plasma reaction demands. RoF 1
      is the framework's explicit rule for plasma weapons - the coil has to recharge and vent heat
      between shots, so it cannot fire faster no matter how fast the trigger is pulled; a
      faster rate would ignore the weapon's actual mechanism. Shots 8(20): an 8-shot cell (Only War-style capacity) and a slow
      20-second reload for a reservoir that has to be handled carefully. Bulk -4 and Rcl 2 (low, per
      framework.md's "beams: 1" figure nudged up slightly for the coil's own kick) are ordinary
      rifle-class figures.

  - name: Plasma Cannon
    tl: 11
    lc: 1
    cost: 6500
    weight: 45
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Standard
        damage: 8dx4(3) burn ex
        acc: 4
        range: 250/750
        rof: 1
        shots: 5(20)
        st: 13M
        bulk: -7
        rcl: 3
        skill: Gunner (Beams)
      - usage: Supercharged
        damage: 8dx5(3) burn ex
        acc: 4
        range: 250/750
        rof: 1
        shots: 5(20)
        st: 13M
        bulk: -7
        rcl: 3
        skill: Gunner (Beams)
        notes: >
          Malf 15. Heavier cooling and shielding on a support weapon make the coil somewhat more
          forgiving than a man-portable plasma weapon's, but a failure is correspondingly larger:
          the gunner takes 4d×4(3) burn ex and the weapon is disabled until repaired.
    lore: >
      A tripod- or vehicle-mounted heavy weapon fielded by Astra Militarum heavy weapon teams and
      Devastator squads, background consistently treats it as a slow-firing but devastating answer
      to Astartes-scale infantry and light vehicles at range, at the price of a low rate of fire
      while the reactor cycles.
    design: >
      Two dice over the plasma gun anchor (8dx4(3) vs 6dx4(3), supercharged 8dx5(3)), matching the
      standard progression used for the bolt and melta families in this project. Checked against
      the vehicle table: standard mode averages 112 and, even against AV12 (DR 200, effective DR
      66), penetrates 99% of hits, comfortably beating the light and medium vehicles the fiction
      shows it killing.
      Handling: 45 lb loaded puts it well beyond man-portable weight, and it is marked ST 13M
      (mounted): the tripod or pintle bears the bulk of that weight, so the ST figure covers
      recoil and aim rather than the raw √(10×45)≈21 a shoulder-fired weapon this heavy would need
      - the same weight as the Multi-laser (ST 9M) elsewhere in this project, pitched four points
      higher for the plasma reactor's own recoil kick, and a point under the 80 lb Lascannon's
      14M because the Lascannon's barrel and power plant weigh far more. RoF 1 (unchanged from
      every other plasma weapon here - the reactor's cycle time, not the mount, is the limiting
      factor) and Malf 15 rather than the man-portable weapons' 14 reflect a crew-served weapon's
      better cooling and shielding, at correspondingly higher stakes for the crew when it does
      fail. Bulk -7 and Rcl 3 mark a genuine support weapon.

  - name: Plasma Incinerator, Primaris Pattern
    tl: 11
    lc: 1
    cost: 3400
    weight: 13
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Standard
        damage: 6d+1x4(3) burn ex
        acc: 4
        range: 200/600
        rof: 1
        shots: 10(20)
        st: 11
        bulk: -4
        rcl: 2
        skill: Beam Weapons (Rifle)
      - usage: Supercharged
        damage: 6d+1x5(3) burn ex
        acc: 4
        range: 200/600
        rof: 1
        shots: 10(20)
        st: 11
        bulk: -4
        rcl: 2
        skill: Beam Weapons (Rifle)
        notes: >
          Malf 15. Codex background credits Primaris-pattern containment coils with being safer
          than legacy plasma weapons; on a malfunction the firer takes 3d×4(3) burn ex and the
          weapon is disabled until repaired.
    lore: >
      Standard-issue Primaris plasma weapon (Hellblaster squads and others), Codex background
      describes it as an improved, more reliable containment design over the legacy plasma gun
      rather than a fundamentally different weapon.
    design: >
      One pip over the plasma gun anchor (6d+1x4(3) vs 6dx4(3), supercharged 6d+1x5(3); GCS reads the multiplier as applying to the whole
      roll, so (6d+1)x4) for the
      "improved" cartridge, on a lighter, easier-handling frame with better range (200/600) for
      the improved optics. Against a Terminator (DR 200, effective DR 66) the extra pip nudges
      standard-mode penetration from the plasma gun's 86% to 90%; the higher Malf 15 on its
      supercharged mode reflects the claimed better containment without pretending overheating risk
      is eliminated.
      Handling: 13 lb loaded, slightly under the legacy plasma gun's 14 lb for Codex's "improved
      containment design" claim; min ST 11 (√(10×13)≈11.4) follows accordingly - an easier-handling
      frame than the plasma gun's ST 12, matching an Astartes-issue weapon that a strong human could
      still shoulder at a penalty. RoF 1, same as every plasma weapon in this file (the containment
      coil still has to cycle and vent, improved design or not). Shots 10(20): a slightly bigger
      cell than the plasma gun's 8, per the "improved" reactor Codex text describes. Bulk -4 and
      Rcl 2 match the plasma gun's figures.

  - name: Heavy Plasma Incinerator, Primaris Pattern
    tl: 11
    lc: 1
    cost: 4200
    weight: 20
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Standard
        damage: 8dx4(3) burn ex
        acc: 4
        range: 250/700
        rof: 1
        shots: 8(20)
        st: 14
        bulk: -5
        rcl: 2
        skill: Beam Weapons (Rifle)
      - usage: Supercharged
        damage: 8dx5(3) burn ex
        acc: 4
        range: 250/700
        rof: 1
        shots: 8(20)
        st: 14
        bulk: -5
        rcl: 2
        skill: Beam Weapons (Rifle)
        notes: >
          Malf 15. On a malfunction the firer takes 4d×4(3) burn ex and the weapon is disabled
          until repaired.
    lore: >
      The two-handed, un-mounted heavy weapon carried by Primaris Hellblaster squads' heavy-weapon
      troopers, background treats it as a genuine step up in output over the standard plasma
      incinerator, manageable only because of a Primaris Marine's greater strength, not because the
      weapon itself is lighter.
    design: >
      Matches the Plasma Cannon's damage (8dx4(3)/8dx5(3)) since both fire a cannon-class charge,
      but drops the tripod requirement entirely, reflecting that this is a man-portable weapon for
      a superhuman user rather than a crew-served support gun.
      Handling: 20 lb loaded - much lighter than the tripod-mounted Plasma Cannon's 45 lb, since
      this is a shoulder-fired weapon meant to be carried and fired by a single Astartes rather
      than braced on a mount. Min ST 14 (√(10×20)≈14.1) is set below the Plasma Cannon's mounted
      figure but well above the standard Plasma Incinerator's ST 11, reflecting real handling
      difficulty for anyone but an Astartes - a human could not reasonably shoulder it at all. RoF
      1 (unchanged, per the family-wide plasma rule); the cell (8 shots) sits between the
      standard Incinerator's 10 and the Plasma Cannon's 5, and Malf 15 matches both, matching a weapon built as a scaled-
      down cannon rather than a scaled-up rifle. Bulk -5 and Rcl 2 reflect its real size without a
      mount to steady it.
