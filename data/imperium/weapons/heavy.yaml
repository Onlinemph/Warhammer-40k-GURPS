  - name: Mortar
    tl: 6
    lc: 2
    cost: 2000
    weight: 40
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Indirect fire, HE bomb
        damage: 6dx2 cr ex [12d cut]
        acc: 3
        range: 100/3600
        rof: 1
        shots: 1(4)
        st: 8
        bulk: -6
        rcl: 1
        skill: Artillery (Cannon)
    notes: Baseplate, bipod and tube break down for a three-man crew to carry; minimum range about 20 yd (the bomb's arming distance, not a targeting limit). Uses the indirect-fire rules under Artillery, not a direct line of sight.
    lore: >
      The mortar is the Guard's simplest and most ubiquitous indirect-fire
      support weapon, issued down to platoon level in Guard fiction for
      exactly the reason real-world mortars are: cheap, rugged, easy to
      manufacture on almost any forge world, and effective against dug-in
      infantry and soft targets beyond line of sight.
    design: >
      No framework anchor, so it's placed at the bottom of the TL table
      deliberately - mortar tube technology is older and simpler than
      lasguns, stubbers or rockets, which is exactly why every regiment
      from a hive world to a feral-world levy can field one. Damage is
      built the same way as the missile launcher's frag warhead (B414
      fragmentation, "big frag grenade" scaling) with the fragmentation
      doubled again over a hand grenade's 6d (12d cut, against the missile's 9d),
      since a mortar bomb is not weight-constrained by a rocket motor and
      can devote more of its mass to filler and casing, giving 6dx2 cr ex
      [12d cut]. Basic Set Artillery specialties have no Mortar entry, so it uses
      Artillery (Cannon). It carries no armor divisor and is not intended to be checked
      against the vehicle AV table at all - its role in the fiction is
      area denial and infantry suppression, not armour-killing, so unlike
      the autocannon, krak missile or lascannon above it has no reliably/
      sometimes/cannot-beat line against AV10-14.

