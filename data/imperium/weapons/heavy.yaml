kind: equipment
output: Imperium/Weapons/Heavy Weapons.eqp
items:
  - name: Lascannon
    tl: 10
    lc: 2
    cost: 15000
    weight: 80
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Braced/mounted
        damage: 8dx8(5) burn
        acc: 14
        range: 1500/4500
        rof: 1
        shots: 5(5)
        st: 14M
        bulk: -8
        rcl: "1L"
        skill: Gunner (Beams)
    notes: >
      Needs a tripod or vehicle pit mount (ST 14M): an unmounted human cannot
      brace it, though Astartes ST lets a Space Marine fire it standing
      (treat as braced at ST 14 rather than mounted, GM's call). The 80 lb
      is the weapon alone; the tripod (Heavy Weapon Tripod, 20 lb) is extra. Draws from
      a dedicated power cell (see Lascannon Power Cell); swapping cells
      takes the 5-turn reload noted in shots.
    lore: >
      The definitive Imperial anti-tank weapon: Guard heavy weapons squads,
      Space Marine Devastators and Predator/Razorback/Land Raider sponsons and
      turrets all mount it, and Black Library fiction (Gaunt's Ghosts,
      Horus Heresy novels) consistently has a well-placed lascannon shot
      cripple or kill a battle tank, and treats it as one of the few
      man-portable weapons that can bring down a Terminator or walker.
    design: >
      Damage is the fixed anchor from framework.md: 8dx8(5) burn ("kills
      tanks and Terminators"). Checked against the vehicle AV table with the
      exact dice distribution: average 224 burn through an armor divisor of
      5 gives an effective DR of 25 (AV10) to 88 (AV14). The minimum roll
      (8 dice all at 1, x8 = 64) clears AV10-12; AV13 (eff. 68) stops only
      that all-ones roll (1 in 1.7 million) and AV14 (eff. 88) only a total
      of 11 or less (about 1 in 10,000), so the lascannon beats AV10 through
      AV14 (DR 125-440) essentially every time with the anchor's divisor doing
      almost all the work. A Leman Russ front or a Land Raider (DR 1350, eff.
      270) is the exception: it gets through 13% of the time. Against
      a Terminator (DR 200, effective DR 40) or Astartes power armor (DR
      100, effective DR 20) it is a guaranteed penetration (minimum roll 64), matching
      "kills tanks and Terminators" short of the heaviest glacis. Acc, range, RoF, shots, Bulk and
      Rcl are not anchored by framework.md, so they're built from first
      principles: RoF 1 and Rcl 1 because a beam weapon has no recoil and
      the capacitor cycle time is the limiting factor; Acc 14 and a long
      1500/4500 range because the weapon's entire battlefield role is
      precision fire on distant armor, which demands better optics than a
      lasgun (Acc 6); Bulk -8 and ST 14M (sqrt(10x80)=28, mostly carried by the mount) because the weapon and its
      cooling housing are backpack-sized and unwieldy without a brace.
      Cost and LC follow "military-issue heavy weapons" (LC2) and are
      priced well above a lasgun to reflect scarcity of the long-barrel
      focusing crystal.

  - name: Lascannon Power Cell
    tl: 10
    lc: 2
    cost: 2000
    weight: 15
    tags: [Imperium, Astra Militarum, Adeptus Astartes, Ammunition]
    notes: Good for 5 shots per the lascannon's shots rating. A spent cell must be sent back to an armoury or Tech-Priest for recharging; it isn't a field-rechargeable pack like a lasgun's.
    lore: Described in Guard logistics fiction as a heavy, closely-guarded item; a heavy weapons team is only as good as its ammo carrier's supply of charged cells.
    design: Weight and cost scaled up from a lasgun power pack (a small, cheap, common item) by roughly the same ratio as the lascannon's damage output over a lasgun's, since it stores far more energy in a denser, more dangerous cell. No anchor fixes this number; it exists to make ammunition resupply a logistics concern in play.

  - name: Heavy Weapon Tripod
    tl: 8
    lc: 3
    cost: 300
    weight: 20
    tags: [Imperium, Astra Militarum, Gear]
    notes: Required to fire a mounted-only (M) heavy weapon without an Astartes-grade ST score. Setup/breakdown takes about a minute (Fast-Draw or GM discretion can shorten this). Weapons whose entry says the weight already includes the mount (Autocannon, Multi-laser) do not need a second tripod; the Lascannon, Plasma Cannon and Multi-Melta weights exclude it.
    lore: Guard heavy weapons squads are built around a two- or three-man team - gunner, loader, and often an ammo carrier - who move the tripod between firing positions, a staple of Astra Militarum fiction from Gaunt's Ghosts onward.
    design: Not anchored; a generic piece of gear so lascannon, multi-laser, autocannon and mortar entries can all reference the same mount rather than each inventing one. Cost and weight are a plausible generic tripod, not derived from any weapon-specific figure.

  - name: Multi-laser, Tripod-Mounted
    tl: 10
    lc: 2
    cost: 8000
    weight: 45
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Braced/mounted
        damage: 6dx2(2) burn
        acc: 8
        range: 900/2700
        rof: 9
        shots: 100(5)
        st: 9M
        bulk: -6
        rcl: "1L"
        skill: Gunner (Beams)
    notes: More commonly seen as a Sentinel, Chimera or Land Speeder weapon than carried into the field; this is the static defensive-emplacement or bunker version issued to line regiments guarding a position. The 45 lb includes its tripod.
    lore: Multi-lasers are the standard secondary and light-vehicle turret weapon across the Astra Militarum (Sentinels, Chimeras; Astartes Land Speeders carry it too); fiction and background consistently treat them as good infantry-shredders that struggle to hurt anything with real armour plate.
    design: >
      No framework anchor covers the multi-laser. It is several linked
      lasgun-grade emitters cycling far faster and harder than any infantry
      weapon, and the fiction treats it as a heavier anti-infantry weapon
      than the heavy bolter, so each shot sits level with a bolter round at
      6dx2(2) burn (avg 42). Exact odds per hit: penetrates carapace (DR 70,
      eff. 35) 79%; Sororitas plate (DR 85, eff. 42.5) 45%; Astartes power
      armour (DR 100, eff. 50) 14%, same as a bolter; AV10 (DR 125, eff. 62)
      0.5%, so it barely scratches even a Chimera's flank and no tank.
      Handling: RoF 9 follows framework.md's "multi-lasers
      are rapid emitters (8-10)" rule, matching the "several linked lasgun-grade
      emitters cycling far faster... than any infantry weapon" description above. Acc,
      range and Bulk sit between the lasgun and lascannon; ST 9M (mounted)
      is unchanged, the tripod bearing the 45 lb weight.

  - name: Autocannon
    tl: 8
    lc: 2
    cost: 6000
    weight: 85
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Braced/mounted
        damage: 6dx3(3) pi++
        acc: 8
        range: 1000/3000
        rof: 5
        shots: 20(3)
        st: 14M
        bulk: -8
        rcl: 3
        skill: Gunner (Cannon)
    notes: Weight includes the tripod mount; a Heavy Weapons Squad crews it as gunner plus loader. The Predator battle tank's turret gun is the same weapon on a stabilised vehicle mount.
    lore: >
      The autocannon is the Guard heavy weapons squad's and the Predator
      tank's main anti-light-vehicle gun throughout the fiction: reliably
      described tearing through Ork trukks, light xenos raiders and
      Sentinel-class walkers, denting Rhinos and Chimeras, and bouncing or
      only chipping a Leman Russ or Land Raider's frontal glacis.
    design: >
      Not covered by a framework anchor, so it's built as a solid-projectile
      "stub" weapon per the TL table (autogun/stubber bracket, scaled to
      artillery-grade tolerances) rather than borrowed from any GURPS
      catalogue cannon: a single heavy AP penetrator per round gives pi++
      (full wound multiplier, no follow-up), with a moderate armor divisor
      (3) for the hardened long-rod core. Checked with the exact
      dice distribution (6dx3(3) pi++, avg 63) against the vehicle AV
      table: it penetrates AV10 (DR 125, eff. DR 41) 96% of the time -
      reliably beats a Sentinel, a Trukk or any tank's rear; AV11 (DR 185,
      eff. DR 61, a Rhino's front/sides) only 55% of the time, about half;
      against AV12 (DR 250, eff. DR 83, a Chimera's front) that drops to
      6% - it rarely cracks a Chimera head-on; and against AV13 (DR 340,
      eff. DR 113) and AV14 (DR 440, eff. DR 146) it never penetrates - it
      does not beat a Leman Russ or Land Raider's armour, matching every
      source that has autocannon fire shrug off a main battle tank's
      frontal plate.
      Handling: RoF 5 - a real chain-driven or revolver-cannon
      autoloader cycles noticeably faster than a bolter's semi/burst RoF 3,
      but this project keeps it well under the true chain-gun rate of the
      Assault Cannon (RoF 20) and the rapid-emitter Multi-laser (RoF 9), so
      the autocannon reads as a burst-fire cannon rather than a
      spray-weapon, matching its lore role of putting a few large,
      accurate rounds into a specific target rather than hosing an area.
      ST 14M (mounted) and Bulk -8 are unchanged.

  - name: Autocannon Ammunition, Solid Shot (20)
    tl: 8
    lc: 2
    cost: 150
    weight: 12
    tags: [Imperium, Astra Militarum, Ammunition]
    notes: One full magazine load per the autocannon's shots rating.
    lore: Depicted as belted or clipped heavy-calibre shells, hauled by the loader in a Heavy Weapons Squad.
    design: Generic ammunition line so autocannon resupply has a weight and cost; not separately anchored.

  - name: Missile Launcher
    tl: 8
    lc: 2
    cost: 5000
    weight: 22
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Frag missile
        damage: 6d cr ex [9d cut]
        acc: 10
        range: 100/1800
        rof: 1
        shots: 1(4)
        st: 9
        bulk: -7
        rcl: 1
        skill: Gunner (Rockets)
      - usage: Krak missile
        damage: 6dx6(5) cr ex
        acc: 10
        range: 100/1800
        rof: 1
        shots: 1(4)
        st: 9
        bulk: -7
        rcl: 1
        skill: Gunner (Rockets)
      - usage: Flakk missile (vs. aircraft, proximity-fused)
        damage: 5d cr ex [8d cut]
        acc: 10
        range: 100/1800
        rof: 1
        shots: 1(4)
        st: 9
        bulk: -7
        rcl: 1
        skill: Gunner (Rockets)
    notes: Shoulder-fired, one missile loaded at a time; the gunner (or a loader) carries spares separately (see the missile entries below). Flakk missiles trade blast for a proximity fuze and are wasted against ground targets.
    lore: >
      The Guard's man-portable answer to armour and aircraft when a
      lascannon isn't to hand: fiction repeatedly has missile teams crack
      light and medium vehicles and occasionally cripple a Leman Russ,
      while frag loads are the squad's answer to entrenched infantry and
      light structures.
    design: >
      No single framework anchor covers this launcher as a whole, but Krak
      is itself one of the project's fixed anchors: 6dx6(5) cr, a one-shot,
      disposable shaped charge (exact dice distribution, checked by
      tools/sim/test/rules.test.js; avg. 126). Against the AV table it beats
      AV10-11 (DR 125/185) always, AV12 (DR 250, eff. 50) 99.9%, AV13 (DR
      340, eff. 68) 99.0% and AV14 (DR 440, eff. 88) 93.9%: reliable against
      anything short of the heaviest glacis. A Leman Russ front or a Land
      Raider (DR 1350, eff. 270) it never beats, where a lascannon gets 13%,
      which is why the fiction sends lascannons and meltas at those. It was
      6dx6(3) until the vehicle armour rise left it 21% against AV14 (user
      direction: reliable against AV14 again). The divisor rather than the
      dice went up so the blast around the target, which takes no armour
      divisor (B414), is the same size as before. Frag:
      scaled from the B414 fragmentation rules as a "big frag grenade" per
      the framework's own description - double the concussion dice and
      1.5x the fragmentation dice of a standard hand grenade (3d cr ex
      [6d cut]) to reflect a much larger warhead, giving 6d cr ex [9d cut]; it has no armor divisor
      and is not intended to threaten anything on the vehicle AV table,
      only infantry and light cover.
      Flakk: the frag warhead's dice with a proximity fuze instead of
      impact/frag optimisation, at one die less on each figure (5d cr ex [8d cut]) since more
      of the casing goes into the fuze and less into the frag liner; it is not rated
      against ground DR at all. Acc/range/RoF/Bulk are shared across
      usages since they describe the launcher, not the warhead, and are
      built as a shoulder-fired tube (lower ST and Bulk penalty than the
      tripod weapons above, since one Guardsman carries and fires it
      solo).

