kind: equipment
output: Imperium/Weapons/Heavy Weapons.eqp
items:
  - name: Lascannon
    tl: 10
    lc: 2
    cost: 15000
    weight: 80
    tags: [Missile Weapon, Imperium, Astra Militarum, Adeptus Astartes]
    weapons:
      - usage: Braced/mounted
        damage: 8dx4(5) burn
        acc: 14
        range: 1500/4500
        rof: 1
        shots: 5(5)
        st: 12M
        bulk: -8
        rcl: 1
        skill: Gunner (Beams)
    notes: >
      Needs a tripod or vehicle pit mount (ST 12M): an unmounted human cannot
      brace it, though Astartes ST lets a Space Marine fire it standing
      (treat as braced at ST 12 rather than mounted, GM's call). Draws from
      a dedicated power cell (see Lascannon Power Cell); swapping cells
      takes the 5-turn reload noted in shots.
    lore: >
      The definitive Imperial anti-tank weapon: Guard heavy weapons squads,
      Space Marine Devastators and Predator/Rhino/Razorback sponsons and
      turrets all mount it, and Black Library fiction (Gaunt's Ghosts,
      Horus Heresy novels) consistently has a well-placed lascannon shot
      cripple or kill a battle tank, and treats it as one of the few
      man-portable weapons that can bring down a Terminator or walker.
    design: >
      Damage is the fixed anchor from framework.md: 8dx4(5) burn ("kills
      tanks and Terminators"). Checked against the vehicle AV table: average
      112 burn through an armor divisor of 5 gives an effective DR of 10
      (AV10) to 50 (AV14). Even a worst-case minimum roll (8 dice all at
      1, x4 = 32) clears every effective DR on the table, so the lascannon
      reliably beats AV10 through AV14 (DR50-250) with the anchor's
      divisor doing almost all the work; only the same DR80 that stops
      most other man-portable weapons (Astartes power armor, Tactical
      Dreadnought DR80) is trivial for it, matching "kills tanks and
      Terminators" without exception. Acc, range, RoF, shots, Bulk and
      Rcl are not anchored by framework.md, so they're built from first
      principles: RoF 1 and Rcl 1 because a beam weapon has no recoil and
      the capacitor cycle time is the limiting factor; Acc 14 and a long
      1500/4500 range because the weapon's entire battlefield role is
      precision fire on distant armor, which demands better optics than a
      lasgun (Acc 10); Bulk -8 and ST 12M because the weapon and its
      cooling housing are backpack-sized and unwieldy without a brace.
      Cost and LC follow "military-issue heavy weapons" (LC2) and are
      priced well above a lasgun to reflect scarcity of the long-barrel
      focusing crystal.

  - name: Lascannon Power Cell
    tl: 10
    lc: 2
    cost: 2000
    weight: 15
    tags: [Imperium, Astra Militarum, Adeptus Astartes, Ammunition]
    notes: Good for 5 shots per the lascannon's shots rating. A spent cell must be sent back to an armoury or Tech-Priest for recharging; it isn't a field-rechargeable pack like a lasgun's.
    lore: Described in Guard logistics fiction as a heavy, closely-guarded item; a heavy weapons team is only as good as its ammo carrier's supply of charged cells.
    design: Weight and cost scaled up from a lasgun power pack (a small, cheap, common item) by roughly the same ratio as the lascannon's damage output over a lasgun's, since it stores far more energy in a denser, more dangerous cell. No anchor fixes this number; it exists to make ammunition resupply a logistics concern in play.

  - name: Heavy Weapon Tripod
    tl: 8
    lc: 3
    cost: 300
    weight: 20
    tags: [Imperium, Astra Militarum, Gear]
    notes: Required to fire a mounted-only (M) heavy weapon without an Astartes-grade ST score. Setup/breakdown takes about a minute (Fast-Draw or GM discretion can shorten this).
    lore: Guard heavy weapons squads are built around a two- or three-man team - gunner, loader, and often an ammo carrier - who move the tripod between firing positions, a staple of Astra Militarum fiction from Gaunt's Ghosts onward.
    design: Not anchored; a generic piece of gear so lascannon, multi-laser, autocannon and mortar entries can all reference the same mount rather than each inventing one. Cost and weight are a plausible generic tripod, not derived from any weapon-specific figure.

  - name: Multi-laser, Tripod-Mounted
    tl: 10
    lc: 2
    cost: 8000
    weight: 45
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Braced/mounted
        damage: 5d burn
        acc: 8
        range: 900/2700
        rof: 3
        shots: 100(5)
        st: 9M
        bulk: -6
        rcl: 1
        skill: Gunner (Beams)
    notes: More commonly seen as a Sentinel or Rhino turret weapon than carried into the field; this is the static defensive-emplacement or bunker version issued to line regiments guarding a position.
    lore: Multi-lasers are the standard secondary and light-vehicle turret weapon across the Astra Militarum (Sentinels, Chimeras, Rhinos); fiction and background consistently treat them as good infantry-shredders that struggle to hurt anything with real armour plate.
    design: >
      No framework anchor covers the multi-laser, so it's built by
      extrapolating from the lasgun anchor (4d burn) rather than any
      catalogue "laser cannon" entry: a multi-laser is several linked
      lasgun-grade emitters cycling fast, so damage per shot only steps up
      a little (5d, roughly one step above the lasgun the way a hellgun
      steps up for penetration instead) while RoF 3 represents the linked
      barrels. Checked against the vehicle AV table: even a maximum roll
      (5d = 30) never reaches the AV10/DR50 effective threshold, so the
      multi-laser cannot reliably beat any vehicle on that table - it has
      no armor divisor to help it, unlike the lascannon or krak missile.
      This matches the fiction, where multi-laser-armed Sentinels and
      Rhinos support infantry and duel light, often open-topped raiders
      and buggies (DR well under the AV10 line) rather than trade blows
      with tanks. Acc, range and Bulk sit between the lasgun and lascannon
      since the weapon is a scaled-up rifle on a mount, not a dedicated
      tank-killer.

  - name: Autocannon
    tl: 8
    lc: 2
    cost: 6000
    weight: 85
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Braced/mounted
        damage: 6dx2(2) pi++
        acc: 8
        range: 1000/3000
        rof: 3
        shots: 20(3)
        st: 14M
        bulk: -8
        rcl: 3
        skill: Gunner (Cannon)
    notes: Weight includes the tripod mount; a Heavy Weapons Squad crews it as gunner plus loader. The Predator battle tank's turret gun is the same weapon on a stabilised vehicle mount.
    lore: >
      The autocannon is the Guard heavy weapons squad's and the Predator
      tank's main anti-light-vehicle gun throughout the fiction: reliably
      described tearing through Ork trukks, light xenos raiders and
      Sentinel-class walkers, denting Rhinos and Chimeras, and bouncing or
      only chipping a Leman Russ or Land Raider's frontal glacis.
    design: >
      Not covered by a framework anchor, so it's built as a solid-projectile
      "stub" weapon per the TL table (autogun/stubber bracket, scaled to
      artillery-grade tolerances) rather than borrowed from any GURPS
      catalogue cannon: a single heavy AP penetrator per round gives pi++
      (full wound multiplier, no follow-up), with a light armor divisor
      (2) for the hardened long-rod core, and a real cannon's low-teens
      RoF is dialed back to RoF 3 to keep it a burst weapon rather than a
      chain-gun (that's the assault cannon's niche). Checked shot-by-shot
      against the vehicle AV table using the average (6dx2 = 42) and the
      full 6-36 spread of 6d before doubling: it clears AV10 (DR50, eff.
      DR25) on the large majority of rolls - reliably beats; splits close
      to even against AV11 (DR80, eff. DR40, needs 6d > 20 against a mean
      of 21) - Rhino sides, matching "dents a Rhino"; only the top of the
      6d range clears AV12 (DR120, eff. DR60, needs 6d > 30) - rarely
      beats a Chimera's front; and it mathematically cannot clear AV13 or
      AV14 (needs 6d > 45, impossible on 6d) - cannot beat a Leman Russ or
      Land Raider's armour, matching every source that has autocannon fire
      shrug off a main battle tank's frontal plate.

  - name: Autocannon Ammunition, Solid Shot (20)
    tl: 8
    lc: 2
    cost: 150
    weight: 12
    tags: [Imperium, Astra Militarum, Ammunition]
    notes: One full magazine load per the autocannon's shots rating.
    lore: Depicted as belted or clipped heavy-calibre shells, hauled by the loader in a Heavy Weapons Squad.
    design: Generic ammunition line so autocannon resupply has a weight and cost; not separately anchored.

  - name: Missile Launcher
    tl: 8
    lc: 2
    cost: 5000
    weight: 22
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: Frag missile
        damage: 6d cr ex [6d]
        acc: 10
        range: 100/1800
        rof: 1
        shots: 1(4)
        st: 9
        bulk: -7
        rcl: 1
        skill: Gunner (Rockets)
      - usage: Krak missile
        damage: 6dx2(5) cr
        acc: 10
        range: 100/1800
        rof: 1
        shots: 1(4)
        st: 9
        bulk: -7
        rcl: 1
        skill: Gunner (Rockets)
      - usage: Flakk missile (vs. aircraft, proximity-fused)
        damage: 5d cr ex [5d]
        acc: 10
        range: 100/1800
        rof: 1
        shots: 1(4)
        st: 9
        bulk: -7
        rcl: 1
        skill: Gunner (Rockets)
    notes: Shoulder-fired, one missile loaded at a time; the gunner (or a loader) carries spares separately (see the missile entries below). Flakk missiles trade blast for a proximity fuze and are wasted against ground targets.
    lore: >
      The Guard's man-portable answer to armour and aircraft when a
      lascannon isn't to hand: fiction repeatedly has missile teams crack
      light and medium vehicles and occasionally cripple a Leman Russ,
      while frag loads are the squad's answer to entrenched infantry and
      light structures.
    design: >
      No single framework anchor, so each warhead is derived separately.
      Krak: built as a one-shot, disposable shaped charge, using the same
      armor-divisor family as the lascannon's beam (5) rather than a
      catalogue HEAT rocket, but with far fewer raw dice (6dx2, avg. 42)
      since it's a single expendable warhead, not a capacitor weapon - the
      framework's own description of it as "lascannon-lite vs. armour."
      Checked against the AV table: it reliably beats AV10 (DR50, eff.
      DR10) through AV12 (DR120, eff. DR24, needs only 6d > 12 against a
      mean of 21); splits roughly even against AV13 (DR180, eff. DR36,
      needs 6d > 18); and only the top of the 6d range clears AV14 (DR250,
      eff. DR50, needs 6d > 25) - so it can reliably wreck Chimeras and
      Rhinos, sometimes hurts a Leman Russ, and only rarely alone cracks a
      Land Raider, which is why the fiction has missile teams engage such
      targets in numbers rather than solo. Frag: scaled from the B414
      fragmentation rules as a "big frag grenade" per the framework's own
      description - roughly double the blast and fragmentation dice of a
      standard hand grenade (3d[3d]) to reflect a much larger warhead,
      giving 6d cr ex [6d]; it has no armor divisor and is not intended to
      threaten anything on the vehicle AV table, only infantry and light
      cover. Flakk: the frag warhead's dice with a proximity fuze instead
      of impact/frag optimisation, at one die less since more of the
      casing goes into the fuze and less into the frag liner; it is not
      rated against ground DR at all. Acc/range/RoF/Bulk are shared
      across usages since they describe the launcher, not the warhead,
      and are built as a shoulder-fired tube (lower ST and Bulk penalty
      than the tripod weapons above, since one Guardsman carries and fires
      it solo).

