  - name: Battle Cannon
    tl: 10
    lc: 1
    cost: 120000
    weight: 6000
    tags: [Missile Weapon, Imperium, Astra Militarum]
    weapons:
      - usage: HE shell
        damage: 6dx10 cr ex [6d cut]
        acc: 6
        range: 1500/6000
        rof: 1
        shots: 1(6)
        st: 60M
        bulk: -10
        rcl: 3
        skill: Gunner (Cannon)
    notes: >
      Vehicle mount only (the Leman Russ turret). One shell at a time from a
      loader's hands: 6 seconds to reload alone, half that with the loader at
      work. A direct hit does full damage and bursts; everyone nearby takes the
      blast (B414) and the fragments (B414).
    lore: >
      The Leman Russ's main gun, a heavy smooth-bore cannon firing high-explosive
      shells: in the wargame a Strength 8, AP3 large blast that flattens
      infantry, kills Space Marines outright and punches through the side and
      rear armour of most tanks but bounces off a Leman Russ's own front.
    design: >
      6dx10 cr ex (avg 210): enough to kill a Marine through power armour (DR
      100) on a direct hit, to go through AV10 (DR 125) almost always and AV11
      (DR 185) about 70% of the time, AV12 (250) about one hit in seven, and
      never AV13 (340) or AV14 (440), close to the wargame's Strength 8
      against those values. The [6d] fragments are the
      Basic Set's ratio for a shell this size (B414). Acc 6 and 1500/6000
      for a stabilised tank sight on a long gun; Rcl 3 for the recoil of a
      single heavy round on a 63-tonne hull.
