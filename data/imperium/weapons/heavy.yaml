  - name: Assault Cannon (Soulreaper Pattern)
    tl: 10
    lc: 1
    cost: 20000
    weight: 55
    tags: [Missile Weapon, Imperium, Adeptus Astartes]
    weapons:
      - usage: Sustained fire
        damage: 5d(2) pi+
        acc: 5
        range: 500/1500
        rof: 10
        shots: 200(20)
        st: 15
        bulk: -6
        rcl: 2
        skill: Gunner (Machine Gun)
    notes: Arm- or hip-socket mounted on Terminator armour, or carried and fired one-handed by an Astartes on a stabilising harness; ST 15 assumes Astartes-grade strength rather than a tripod.
    lore: >
      Devastator squads and Terminators use the multi-barrelled assault
      cannon (also fielded by Chaos as the Soulreaper cannon) as a
      close-to-mid-range storm of solid shot for shredding infantry,
      light vehicles and swarms; it is fired solid rounds rather than
      bolts, which is why it sits outside the bolt-weapon family, and
      fiction almost always pairs it with a melee specialist (power fist,
      thunder hammer) on the same Terminator rather than relying on it
      against tanks.
    design: >
      No framework anchor, so it's built parallel to the heavy bolter
      anchor (8d(2) pi+, follow-up 4d cr ex) rather than copied from it:
      the assault cannon fires solid rotary-autocannon-style rounds with
      no explosive follow-up, so it drops the follow-up term and scales
      the base damage down one step (5d instead of 8d) in exchange for a
      much higher RoF (10 vs. the heavy bolter's typical squad-support
      RoF), matching its fluff role as a horde-clearing hail of fire
      rather than a hard-hitting single line of shots. Checked against the
      vehicle AV table: even at RoF 10, no single round (max 5d(2) = 30,
      eff. DR halved) reliably clears AV10's effective DR25, so it cannot
      reliably beat any vehicle on the table - consistent with Astartes
      fiction, where the assault cannon is a horde/infantry weapon and its
      wielder relies on a paired melee weapon (power fist, thunder hammer)
      or a squadmate's lascannon/missile launcher against real armour.
      LC1 follows the framework's Astartes-gear bracket (alongside
      bolters and plasma) rather than the Guard's LC2 heavy-weapon
      bracket.

