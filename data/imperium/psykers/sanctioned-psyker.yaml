kind: template
output: Imperium/Templates/Sanctioned Psyker.gct
notes: >
  A Sanctioned Astra Militarum Primaris Psyker: Delta-grade on the Adeptus
  Astra Telepathica's Assignment scale (Psyker Talent 3), issued a force
  staff and trained in Pyromancy as a battlefield specialty. Built on the
  Thaumatology: Sorcery model (see framework.md and Imperium/Traits/Psykers
  and the Warp.adq): Psyker (Talent, the Sorcery Talent analogue) sharpens
  skills, while Warp Empowerment (Sorcerous Empowerment analogue) gates
  which powers can be known. This loadout's costliest known power is Molten
  Beam (full modified cost 9), so it only needs Warp Empowerment level 1
  (cap 20, points 20) — well under Delta's theoretical ceiling of level 3
  (cap 40); a GM growing this psyker into costlier Pyromancy or a different
  discipline should raise Warp Empowerment's level (and points) to match
  whatever they buy next, up to Delta's cap.

  Point math: 80 (attributes) + 10 (Unusual Background) + 30 (Psyker 3) + 20
  (Warp Empowerment 1) - 15 (Sanctioned Psyker) + 8 (Witch-sight, 10 base x
  0.8 Warp Sorcery) + 20 (Pyromancy discipline at each power's default
  starting level: Fire Bolt 4 + Inferno/Molten Beam alt 9+1 + Flame Breath 6)
  + 15 (skills) = 168 points, landing in framework.md's "Elite human
  (200-350)" tier's lower half once personal equipment is added — well above
  a plain Guardsman, matching how rare and valuable a Sanctioned Psyker is to
  a regiment, and comfortably inside the 150-250 range expected of a Guard
  Primaris psyker. For a weaker Wyrdvane conscript-psyker (Epsilon grade),
  drop Psyker to level 2 and Warp Empowerment stays at level 1 (Epsilon's
  cap of 30 isn't needed by this discipline either), remove the discipline's
  higher-level purchases (keep each power at its base/level-1 cost), and add
  a Reputation or Social Stigma reflecting how nervously line troopers treat
  them. Swap the Pyromancy include for any other discipline in Imperium/
  Traits/Psykers and the Warp.adq for a different specialty — remember to
  re-check Warp Empowerment's level against the new discipline's costliest
  power.
traits:
  - name: ST
    points: 0
    tags: [Attribute]
    lore: A Sanctioned Psyker is an ordinary, unaugmented human body — the gift is mental, not physical.
    design: ST 10 (human baseline), 10 pts/level (B15).
  - name: DX
    points: 20
    tags: [Attribute]
    lore: Basic training and battlefield survival instincts, roughly on par with a line Guardsman.
    design: DX 11 (+1 from baseline), 20 pts/level (B15).
  - name: IQ
    points: 40
    tags: [Attribute]
    lore: Psychic potential correlates loosely with a sharp mind in Astra Telepathica selection; candidates are picked from the more capable conscripts and hive-scholam washouts alike.
    design: IQ 12 (+2 from baseline), 20 pts/level (B15).
  - name: HT
    points: 10
    tags: [Attribute]
    lore: Average endurance; the gift, not the body, is what marks a Sanctioned Psyker.
    design: HT 11 (+1 from baseline), 10 pts/level (B15).
  - name: Will
    points: 10
    per_level: 5
    levels: 2
    tags: [Attribute]
    lore: A strong will is what lets a psyker resist Perils of the Warp and hold a working steady under fire.
    design: Will+2 (Basic's Increased Will, 5 pts/level, B15).
  - include: "imperium/psykers/warp.yaml#Unusual Background (Latent Psychic Potential)"
  - include: "imperium/psykers/warp.yaml#Psyker"
    levels: 3
  - include: "imperium/psykers/warp.yaml#Warp Empowerment"
    levels: 1
  - include: "imperium/psykers/warp.yaml#Sanctioned Psyker"
  - include: "imperium/psykers/warp.yaml#Witch-sight"
  - include: "imperium/psykers/warp.yaml#Pyromancy"
skills:
  - include: "imperium/common/skills.yaml#Psyniscience"
    points: 4
  - name: Meditation
    diff: IQ/H
    points: 2
    tags: [Imperium, Psyker]
    lore: How a psyker learns to control, rather than merely survive, the gift.
    design: IQ-2 (10) for 2 points, Hard (B ability skill list).
  - name: Hidden Lore
    spec: the Warp
    diff: IQ/A
    points: 2
    tags: [Imperium, Psyker]
    lore: Doctrinal and practical knowledge of the immaterium taught at the Scholastia Psykana.
    design: IQ-1 (11) for 2 points, Average.
  - name: Soldier
    diff: IQ/A
    points: 2
    tags: [Imperium, Astra Militarum]
    lore: Enough general military knowledge to operate attached to a Guard unit.
    design: IQ-1 (11) for 2 points, Average.
  - name: Theology
    spec: Imperial Creed
    diff: IQ/H
    points: 1
    tags: [Imperium]
    lore: The same basic catechisms drilled into every Imperial soldier, doubly important for a psyker who must prove their faith.
    design: IQ-2 (10) for 1 point, Hard.
  - name: Staff
    diff: DX/A
    points: 4
    tags: [Imperium, Psyker]
    lore: Basic proficiency with the issued force staff.
    design: DX+0 (11) for 4 points, Average.
equipment:
  - include: "imperium/psykers/psychic-gear.yaml#Force Staff"
