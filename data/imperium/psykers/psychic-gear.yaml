kind: equipment
output: Imperium/Gear/Psychic Gear.eqp
items:
  - name: Psychic Hood
    tl: "10^"
    lc: 1
    cost: 4000
    weight: 3
    tags: [Imperium, Psyker]
    conditional:
      - situation: to resist Warp Sorcery-tagged Affliction, Mind Control, Mind Probe, and Fear effects directed at the wearer or their unit
        amount: 2
    lore: >
      A warded circlet built around a tiny, heavily sanctioned psychic node
      (sometimes a bound, lobotomised psyker's brain-stem), worn by Astra
      Militarum officers and Inquisitorial staff to blunt enemy sorcery
      directed at their command. Consistent with Dark Heresy/Rogue Trader's
      psychic hood/psy-focus items and Codex background on Imperial
      command-squad wargear.
    design: >
      Modelled as a flat +2 conditional bonus (Basic's conditional_modifier
      feature) to resist Warp Sorcery-tagged mental attacks — comparable in size to
      Basic's own Power Defense-type items, cheap enough to matter but never
      a substitute for a trained anti-psyker.

  - name: Force Sword
    tl: "10^"
    lc: 1
    cost: 8000
    weight: 4
    tags: [Melee Weapon, Imperium, Psyker]
    weapons:
      - usage: Field off
        damage: sw+1 cut
        reach: "1"
        parry: 0
        st: 10
        skill: Broadsword
      - usage: Field on
        damage: sw+3d+1(10) cut
        reach: "1"
        parry: 0
        st: 10
        skill: Broadsword
      - usage: Force Strike (charged, vs. Warp-touched)
        damage: sw+3d+1 cut (ignores DR)
        notes: >
          Add +1d per level of Psyker Talent to this line (GCS can't scale
          it automatically; edit the damage on the sheet). Usable only by a
          psyker (Psyker Talent 1+), field on. Requires a
          Perils of the Warp check (see "Psykers and the Warp") as it is
          channelled through the wielder's own gift; the ignores-DR
          component only applies against daemons, Chaos Spawn, and other
          Warp-touched creatures, representing a strike at the target's
          soul rather than its body — an ordinary flak-armoured guardsman
          still only takes the field-on line's armour divisor (10).
        reach: "1"
        parry: 0
        st: 10
        skill: Broadsword
    notes: Human-scale pattern, for Inquisitors and other unaugmented psykers. Astartes Librarians use the Astartes pattern below.
    lore: >
      A disruption-field blade further warded and psychically attuned so a
      trained mind can channel force directly through it — standard wargear
      for Inquisitors and for Sisters of the Ordo Hereticus with psychic
      gifts. Depicted throughout Black Library (Eisenhorn's own force
      sword; Grey Knights' force weapons) and Dark Heresy/Rogue Trader's
      force-weapon rules.
    design: >
      Built directly on the framework's power-field rule: field off is the
      mundane fine blade (sw+1 cut), field on adds +3d and armour divisor
      (10) ("Bladed/mace power weapons add +3d over the mundane weapon"),
      landing exactly on the Power Sword anchor (sw+3d+1(10) cut) — a force
      sword is mechanically a power sword that a trained mind can also
      channel psychic force through. The Force Strike line shows that
      channelling: same dice as field-on minus the armour divisor, but its
      ignores-DR component only applies against Warp-touched targets, so it
      never trivialises ordinary armour. Its damage scales with the
      wielder's Psyker Talent level (+1d per level on top of the base 3d)
      rather than as a fixed number, since the build tool's damage syntax
      cannot encode a variable.
      Handling: 4 lb, min ST 10 and parry 0 match the human Power Sword
      anchor exactly (Broadsword, a guarded blade rather than an axe/mace
      weapon).

  - name: Force Sword, Astartes Pattern
    tl: "10^"
    lc: 1
    cost: 8500
    weight: 9
    tags: [Melee Weapon, Imperium, Psyker, Adeptus Astartes]
    weapons:
      - usage: Field off
        damage: sw+1 cut
        reach: "1"
        parry: 0
        st: 16
        skill: Broadsword
      - usage: Field on
        damage: sw+3d+1(10) cut
        reach: "1"
        parry: 0
        st: 16
        skill: Broadsword
      - usage: Force Strike (charged, vs. Warp-touched)
        damage: sw+3d+1 cut (ignores DR)
        notes: As the human-scale Force Sword's Force Strike; +1d per level of Psyker Talent, requires field on and a Perils of the Warp check.
        reach: "1"
        parry: 0
        st: 16
        skill: Broadsword
    lore: >
      The blade of the Astartes Librarian: a Chapter-armoury power sword
      built to a Marine's grip and reach, with the psychic warding and focus
      crystals of a force weapon. Librarians of most Chapters favour a
      sword or staff, in Codex Space Marines background and Black Library
      Space Marine fiction.
    design: >
      The human Force Sword's damage formula unchanged (sw+3d+1(10) field
      on, sw+1 field off), for the same reason the Astartes Power Sword is:
      "sw" resolves from the wielder's own ST, so a Marine (ST 30, sw 5d+2)
      rolls far more dice than a human without the weapon's line changing.
      Field-on is 8d+3(10), average 31, which penetrates Astartes plate
      always and Terminator plate (eff. DR 20) 98.6% of the time.
      Handling: the same heavier housing as the Astartes Power Sword: 9 lb
      and min ST 16, out of an unaugmented human's reach. Parry 0 (Broadsword).
      Cost $500 above the human pattern, as the Astartes Power Sword is above the human one.

  - name: Force Staff
    tl: "10^"
    lc: 1
    cost: 7000
    weight: 5
    tags: [Melee Weapon, Imperium, Psyker]
    weapons:
      - usage: Field off, swing
        damage: sw+2 cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
      - usage: Field off, thrust
        damage: thr+2 cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
      - usage: Field on, swing
        damage: sw+3d+2(10) cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
      - usage: Field on, thrust
        damage: thr+3d+2(10) cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
      - usage: Force Strike, swing (charged, vs. Warp-touched)
        damage: sw+3d+2 cr (ignores DR)
        notes: As Force Sword's Force Strike; +1d per level of Psyker Talent, requires field on and a Perils of the Warp check.
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
      - usage: Force Strike, thrust (charged, vs. Warp-touched)
        damage: thr+3d+2 cr (ignores DR)
        notes: As the swing Force Strike above.
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
    notes: Human-scale pattern, for Inquisitors and Astra Telepathica psykers; see the Astartes pattern below.
    lore: >
      Many psykers prefer a staff to a blade: easier to carry openly as a
      badge of office, and a familiar focus for channelling telekinetic and
      biomantic workings. Common across Dark Heresy/Rogue Trader's force-weapon
      options and depicted for Inquisitorial and Adeptus Astra Telepathica
      psykers throughout Black Library.
    design: >
      The mundane Power Stave's exact profile (melee.yaml): field off is a
      hardwood-and-metal quarterstaff (sw+2 cr / thr+2 cr), field on adds
      +3d and armour divisor (10) per the power-field rule, giving
      sw+3d+2(10) cr and thr+3d+2(10) cr, with the same charged Force
      Strike option and scaling note as the Force Sword.
      Handling: 5 lb and min ST 10 match the Power Stave. Staff keeps its
      parry 0 with no U, the same convention as the Power Stave and Shock
      Staff in melee.yaml; the skill's own defensive bonus is what a
      quarterstaff trades raw damage for.

