      - usage: Field on
        damage: sw+3d+2(10) cut
        reach: "1"
        parry: "-1U"
        st: 12
        skill: Axe/Mace
      - usage: Force Strike (charged, vs. Warp-touched)
        damage: sw+3d+2 cut (ignores DR)
        notes: As Force Sword's Force Strike; +1d per level of Psyker Talent, requires field on and a Perils of the Warp check.
        reach: "1"
        parry: "-1U"
        st: 12
        skill: Axe/Mace
    notes: Human-scale pattern; see the Astartes pattern below.
    lore: >
      A heavier disruption weapon, favoured by psykers who fight as heavily
      as they cast — some Ordo Malleus interrogators in Black Library
      material, and offered as a standard force-weapon option in Dark
      Heresy/Rogue Trader.
    design: >
      Scaled up from the Force Sword the same way the framework scales
      chainaxes from chainswords: heavier mundane baseline (sw+2 cut), the
      same power-field math (+3d over the mundane weapon, armour divisor
      (10)), and a parry penalty for the unbalanced swing.
      Handling: 6 lb and min ST 12 match the human Power Axe. Parry -1U, the
      Basic Set Axe/Mace figure applied to every one-handed axe in this
      project (Power Axe and Chainaxe carry the same).

