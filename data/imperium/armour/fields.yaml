kind: equipment
output: Imperium/Armour/Force Fields.eqp

# Personal force fields use the regenerating-shield rules in framework.md
# ("Personal force fields"). The GCS Uses counter tracks current Shield Points.

items:
  - name: Refractor Field
    tl: 11
    lc: 1
    cost: 8000
    weight: 2
    uses: 40
    tags: [Force Field, Energy Shield, Imperium, Inquisition]
    notes: >-
      Shield 40 SP. Recharge: after 2 seconds without taking damage, regains 10 SP per second.
      Ranged attacks only: melee blows and thrown objects pass through at walking speed. A
      faint shimmer surrounds the wearer while active (-1 to Holdout, Stealth in darkness -1).
    lore: >-
      The personal field most associated with Inquisitors, Rogue Traders and senior Imperial
      agents in Black Library fiction (Eisenhorn and Ravenor among others) and the Dark Heresy
      and Rogue Trader lines: a shimmering field that scatters incoming fire. Shown as good
      against a stream of small-arms fire and poor against one heavy hit.
    design: >-
      Small pool, fastest recharge of the Imperial fields, which reproduces the lore: it eats two
      lasgun hits (avg 17.5 each) and is back to full a few seconds after the shooting pauses,
      but one bolt (avg 42, plus its 6d follow-up detonating on the field) breaks it. Ranged-only follows the fiction
      of fields that stop fast projectiles but not slow objects.

  - name: Rosarius
    tl: 12
    lc: 2
    cost: 6000
    weight: 1
    uses: 60
    tags: [Force Field, Energy Shield, Imperium, Ecclesiarchy]
    notes: >-
      Shield 60 SP. Recharge: after 3 seconds without taking damage, regains 10 SP per second.
      Blocks ranged and melee attacks. Worn as an amulet; the field is invisible until struck.
    lore: >-
      Protection for Ministorum priests, Confessors and Canonesses who fight without full
      Sororitas plate. Ecclesiarchy background presents it as a blessed relic as much as a
      device: the faithful credit the Emperor's favour when it holds.
    design: >-
      Three lasgun hits are absorbed; one bolt (avg 42 plus ~21 follow-up) about breaks it,
      and plasma (avg 84) goes through. Ranked below the conversion field and iron halo, matching its role as the
      field for mortal clergy rather than Astartes officers.

  - name: Conversion Field
    tl: 12
    lc: 1
    cost: 25000
    weight: 3
    uses: 80
    tags: [Force Field, Energy Shield, Imperium, Inquisition]
    notes: >-
      Shield 80 SP. Recharge: after 3 seconds without taking damage, regains 10 SP per second.
      Blocks ranged and melee attacks. Flash: any single hit that removes 20+ SP converts into
      a burst of light; everyone within 5 yards facing the wearer (not the wearer) rolls HT or
      is blinded for 1d seconds. Photo-visors and auto-senses negate the flash.
    lore: >-
      Signature protection of high-ranking Inquisitors and Rogue Traders in Black Library
      fiction: it turns a chainsword stroke or a point-blank shot into a blinding flare. A rare
      relic rather than standard Imperial manufacture.
    design: >-
      Absorbs a bolt with room to spare, a plasma bolt (6dx4, avg 84) a bit under half the
      time, and nearly any hand weapon wielded by an unaugmented human. The flash is its defining lore
      trait and makes heavy hits on the wearer dangerous to bystanders.

  - name: Iron Halo
    tl: 12
    lc: 0
    cost: 20000
    weight: 2
    uses: 120
    tags: [Force Field, Energy Shield, Imperium, Adeptus Astartes]
    notes: >-
      Shield 120 SP. Recharge: after 3 seconds without taking damage, regains 20 SP per second.
      Blocks ranged and melee attacks. Mounted on the backpack of Astartes power armour; needs
      the armour's power supply.
    lore: >-
      A relic field worn by Chaplains, Captains and Chapter Masters, per Codex: Space Marines
      background and Black Library fiction. An honour as well as protection: a Marine is
      granted one, not issued it.
    design: >-
      Holds against a plasma bolt (avg 84) and a power-fist blow (thr+8d(10), ~34 in Astartes
      hands) and recovers quickly, so an Astartes hero can walk through small-arms fire as in
      the fiction. A lascannon (8dx8, avg 224) still breaks it and continues into the armour.

  - name: Storm Shield (Field Component)
    tl: 11
    lc: 0
    cost: 15000
    weight: 4
    uses: 160
    tags: [Force Field, Energy Shield, Imperium, Adeptus Astartes]
    notes: >-
      Shield 160 SP. Recharge: after 2 seconds without taking damage, regains 20 SP per second.
      Covers only attacks from the front and the shield-arm side (the arcs a shield covers);
      attacks from behind or the off side bypass it. The physical shield's Defense Bonus and
      melee stats are on the Storm Shield entry in Melee Weapons.
    lore: >-
      Astartes and Terminator storm shields pair a solid shield with a kinetic dispersion
      field, shown in Codex: Space Marines background and Black Library fiction shrugging off
      blows that would kill a Marine, including the occasional lascannon or plasma hit.
    design: >-
      Largest pool of any personal field, limited to its arc. Plasma (avg 84) is stopped
      outright; a lascannon (8dx8, avg 224) is stopped only when it rolls 160 or less (8d of
      20 or less, about 6% of shots), matching "occasionally" in the fiction.

  - name: Displacer Field
    tl: 12
    lc: 1
    cost: 35000
    weight: 3
    tags: [Force Field, Imperium, Inquisition]
    notes: >-
      Not a shield: it has no Shield Points. When the wearer would take damage that penetrates their
      worn armour, the GM may rule that the field instead teleports them 2d yards in a random
      direction (as the Teleport advantage, B90), taking no damage from that attack — treat this
      as usable a limited number of times before the field needs to recharge (recommended: once
      per few seconds of combat, i.e. about once per turn at most), and note the risk of
      teleporting into solid matter, off a ledge, or into a worse position is a real one the GM
      should apply per the Teleport rules.
    lore: >-
      Displacer fields are archeotech/xenos-derived teleportation wards, most associated in the
      fiction with Aeldari (Eldar) Farseers and Autarchs, but occasionally captured, reverse-
      engineered, or gifted relics carried by high-ranking Inquisitors or Rogue Traders in Black
      Library fiction and Rogue Trader-line background — rather than blocking a killing blow, the
      wearer simply isn't where the blow lands anymore.
    design: >-
      Deliberately not modelled as DR at all, since the lore mechanic is avoidance rather than
      resistance: this uses GURPS's existing Teleport advantage (B90) as its design basis rather
      than any force-field or armour catalogue entry, triggered defensively instead of at will.
      Marked as TL12^-equivalent xenotech in spirit (warp-adjacent teleportation, per
      framework.md's "Warp-dependent" category) even though it's issued as an Imperial-held relic
      rather than built by the Imperium; cost and LC reflect extreme rarity and the Inquisition's
      wariness of xenotech in mortal hands.
