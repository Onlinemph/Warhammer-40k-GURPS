kind: equipment
output: Imperium/Armour/Force Fields.eqp
items:
  - name: Refractor Field
    tl: 11
    lc: 1
    cost: 8000
    weight: 2
    tags: [Force Field, Imperium, Inquisition]
    dr: [{locations: all, amount: 6, vs: burn}]
    notes: >-
      Worn as a small emitter on a belt, collar or ring; the shimmer is faint but visible up close
      (-2 to Holdout while active). Stacks with worn armour's own DR. Provides no protection
      against blunt/crushing or edged/impaling attacks, only against energy-type (burning) damage,
      since it works by scattering and diffusing incoming energy rather than physically stopping
      mass.
    lore: >-
      The refractor field is the personal deflector shield most commonly associated with
      Inquisitors, Rogue Traders and other senior Imperial agents in Black Library fiction (the
      Eisenhorn and Ravenor novels, among others) and Dark Heresy/Rogue Trader-line background: a
      shimmering energy field that scatters and diffuses incoming fire, notably better against
      sustained or lower-powered energy attacks than against a single massive blow.
    design: >-
      No fixed DR anchor exists for force fields, so this is built from first principles using
      GURPS's own force-field logic (a DR bonus layered on top of worn armour) rather than an
      Ultra-Tech catalogue entry. The DR is restricted to `vs: burn` specifically to encode the
      lore's "diffuses energy" framing — a refractor field does nothing against a blade or a fist —
      and set well below the Carapace anchor (20) since fiction consistently shows refractor
      fields as a useful edge, not a suit of armour in their own right.

  - name: Conversion Field
    tl: 12
    lc: 1
    cost: 25000
    weight: 3
    tags: [Force Field, Imperium, Inquisition]
    dr: [{locations: all, amount: 12}]
    notes: >-
      Unlike the refractor field, this works against any attack type, not just energy weapons: it
      converts the kinetic or thermal energy of a blow that fails to penetrate into a blinding
      flash of light around the wearer (treat anyone within a few yards with line of sight as
      making an immediate Vision-based check to avoid being dazzled, GM's discretion). It does not
      distinguish "big" hits from "small" ones the way its lore reputation for stopping bolter
      rounds and chainblades alike suggests — model that reputation as the flat DR below, which is
      already high enough to usually stop small-arms and blades outright; only weapons that punch
      through DR 12 (heavy weapons, power weapons' armour divisor, etc.) get past it.
    lore: >-
      Conversion fields are the signature protection of high-ranking Inquisitors and Rogue Traders
      in Black Library fiction (Eisenhorn/Ravenor again, and Rogue Trader-line background material)
      — famously able to turn aside a chainsword blow or point-blank pistol shot in a flash of
      light, at the cost of being rare, expensive archeotech-adjacent relics rather than standard
      Imperial manufacture.
    design: >-
      Built independently from GURPS's DR-plus-special-effect toolkit rather than any catalogue
      item: a flat, type-independent DR (no `vs` restriction, unlike the refractor field) reflects
      "converts any incoming energy," set noticeably higher than the refractor field's 6 to
      reflect its superior reputation in the fiction, while remaining below the Sororitas power
      armour anchor (32) so it reads as a strong personal ward rather than a substitute for a suit
      of plate. The blinding-flash effect is flavour text for the GM to adjudicate rather than a
      GCS-native mechanic.

  - name: Rosarius
    tl: 12
    lc: 2
    cost: 6000
    weight: 1
    tags: [Force Field, Imperium, Ecclesiarchy]
    dr: [{locations: all, amount: 8}]
    notes: A holy icon (usually a stylised aquila or Ecclesiarchy seal) worn openly around the neck; the field is a lesser, mass-produced descendant of the conversion field principle.
    lore: >-
      The rosarius is standard-issue protection for Ministorum priests, confessors and other
      Ecclesiarchy clergy who serve on active warzones without a Battle Sister's power armour,
      depicted across Adepta Sororitas and Ecclesiarchy background and Black Library fiction
      (the Sisters of Battle and Warhammer Crime lines feature priest characters wearing them) as
      humbler but functionally similar to a conversion field.
    design: >-
      Same conversion-field mechanic (flat, type-independent DR) as the Conversion Field entry
      above, but at a lower value (8) and lower cost/rarity, reflecting the rosarius's status as a
      mass-produced, lesser version of the same underlying principle rather than a one-of-a-kind
      Inquisitorial relic.

  - name: Iron Halo
    tl: 12
    lc: 1
    cost: 20000
    weight: 2
    tags: [Force Field, Imperium, Adeptus Astartes]
    dr: [{locations: all, amount: 16}]
    notes: >-
      Worn as a halo-shaped emitter, traditionally mounted at the collar or above the helm of a
      Chaplain or senior officer; stacks with the wearer's power armour DR.
    lore: >-
      The iron halo is a relic conversion field reserved for Space Marine Chaplains, Chapter
      Masters and other senior officers, per Codex Space Marines background and Black Library
      fiction — visually iconic (the mounted halo) and mechanically framed the same way as an
      Inquisitor's conversion field, just built for and issued to the Adeptus Astartes.
    design: >-
      Same flat-DR conversion-field mechanic as the Conversion Field and Rosarius entries, scaled
      between the two: better than a common rosarius, short of a bespoke Inquisitorial relic,
      reflecting the iron halo's status as a valued but still Chapter-manufactured piece of
      wargear rather than a unique archeotech find.

  - name: Storm Shield (Field Component)
    tl: 11
    lc: 0
    cost: 15000
    weight: 4
    tags: [Force Field, Imperium, Adeptus Astartes]
    dr: [{locations: all, amount: 10}]
    notes: >-
      This entry covers only the shield's integrated dispersion field, layered on top of the
      shield's own physical block/parry value and the wearer's armour DR; the shield as a melee
      item (block bonus, weight as carried equipment) belongs with this project's weapons/shields
      material, not here.
    lore: >-
      Terminator and Astartes storm shields are depicted (Codex Space Marines background, Black
      Library Terminator-focused fiction) as combining a solid physical shield with a kinetic
      dispersion field able to shrug off blows — including, famously, occasional lascannon or
      plasma hits — that would kill an Astartes outright without it.
    design: >-
      Modelled the same way as the other conversion-family fields in this file: a flat, type-
      independent DR bonus, pitched below the standalone Conversion Field (12) since in the
      fiction the storm shield's toughness comes as much from the physical shield underneath as
      from its field, and this entry is explicitly only the field component.

  - name: Displacer Field
    tl: 12
    lc: 1
    cost: 35000
    weight: 3
    tags: [Force Field, Imperium, Inquisition]
    dr: [{locations: all, amount: 0}]
    notes: >-
      Provides no passive DR. Instead: when the wearer would take damage that penetrates their
      worn armour, the GM may rule that the field instead teleports them 2d yards in a random
      direction (as the Teleport advantage, B90), taking no damage from that attack — treat this
      as usable a limited number of times before the field needs to recharge (recommended: once
      per few seconds of combat, i.e. about once per turn at most), and note the risk of
      teleporting into solid matter, off a ledge, or into a worse position is a real one the GM
      should apply per the Teleport rules.
    lore: >-
      Displacer fields are archeotech/xenos-derived teleportation wards, most associated in the
      fiction with Aeldari (Eldar) Farseers and Autarchs, but occasionally captured, reverse-
      engineered, or gifted relics carried by high-ranking Inquisitors or Rogue Traders in Black
      Library fiction and Rogue Trader-line background — rather than blocking a killing blow, the
      wearer simply isn't where the blow lands anymore.
    design: >-
      Deliberately not modelled as DR at all, since the lore mechanic is avoidance rather than
      resistance: this uses GURPS's existing Teleport advantage (B90) as its design basis rather
      than any force-field or armour catalogue entry, triggered defensively instead of at will.
      Marked as TL12^-equivalent xenotech in spirit (warp-adjacent teleportation, per
      framework.md's "Warp-dependent" category) even though it's issued as an Imperial-held relic
      rather than built by the Imperium; cost and LC reflect extreme rarity and the Inquisition's
      wariness of xenotech in mortal hands.
