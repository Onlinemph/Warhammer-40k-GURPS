    lore: >-
      Mark X "Gravis Armour" is described in current Codex Space Marines background as
      heavy-assault plate for Primaris Aggressors, Eradicators, and similar close-support roles:
      thicker than any other power-armour pattern short of Terminator plate, explicitly a step
      between standard power armour and Tactical Dreadnought armour.
    design: >-
      Torso DR deliberately breaks the +/-5 spread that governs every other power-armour Mark in
      this file, because the lore explicitly places Gravis between the Mark VII baseline (40) and
      the Tactical Dreadnought anchor (80): 55 sits roughly a third of the way up that gap,
      reflecting "heavier than standard plate, well short of Terminator plate." Servo ST bonus is
      raised well above every other power-armour Mark for the same reason, and a small Basic Move
      penalty is added since the suit trades mobility for that extra plate.

  - name: Scout Armour
    tl: 10
    lc: 1
    cost: 8000
    weight: 40
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 22, leg: 10, "skull,face,eye,neck,arm,hand,foot": 0}
    notes: >-
      Unpowered partial plate: chestpiece, backplate and a groin/thigh guard worn over fatigues,
      with no helmet, gauntlets or servo-motors. Does not require the black carapace interface,
      since most Chapters implant it later in a Scout's development (widely depicted; the exact
      order of implantation varies by Chapter).
    lore: >-
      Scout Marines — Astartes neophytes who have not yet completed the full gene-seed
      implantation and elevation to the battle-brotherhood — fight in simpler, partial plate over
      fatigues rather than full power armour, consistent with their depiction across Black
      Library's Scout-focused fiction (the Raven Guard and Space Wolves Scout novels among others)
      and current Codex Space Marines background.
    design: >-
      No power-armour anchor applies here since this is explicitly not full plate; torso DR is
      reasoned as roughly Carapace-tier (the anchor's 20) plus a small premium for Astartes-grade
      materials, at 22. Coverage is deliberately incomplete (no head, arm, hand or foot protection,
      partial leg only) to reflect the "half-armoured, half-fatigues" silhouette Scouts are
      consistently drawn with, and there is no servo-motor ST bonus because the suit carries no
      powered assistance.

  # ---------------------------------------------------------------- Tactical Dreadnought (Terminator) armour
  - name: Tactical Dreadnought Armour, Indomitus Pattern
    tl: 11
    lc: 0
    cost: 120000
    weight: 300
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 80, arm: 70, leg: 70, neck: 55, skull: 80, face: 60, eye: 30, hand: 50, foot: 60}
    attributes: {lifting_st: 20, striking_st: 10, sm: 1, basic_move: -1}
    notes: >-
      Effective SM +1 while worn (bigger target, but also greater reach and a larger surface for
      called shots); on top of the usual rigid heavy armour penalties, treat DX-based fine work as
      at an extra -2 due to the suit's thick, servo-assisted gauntlets. Life support allows
      unaided teleportation and short vacuum/void operations. Requires the black carapace
      interface.
    lore: >-
      "Terminator" plate — modern Indomitus-pattern Tactical Dreadnought Armour — is the heaviest
      power armour a Space Marine can wear and fight in, reserved for a Chapter's most veteran
      warriors and for the most desperate close-quarters actions (teleport assaults into enemy
      strongholds, boarding actions). Current Codex Space Marines background and countless Black
      Library depictions describe it as effectively a one-Astartes tank: it shrugs off small-arms
      and bolter fire and is brought down only by heavy weapons, power fists, or comparable threats.
    design: >-
      Torso DR taken directly from the fixed anchor ("Tactical Dreadnought (Terminator) | 80,
      Ignores bolters. Plasma, lascannon, power fist and thunder hammer still kill.",
      framework.md). Limb/head DR use the same proportional offsets as the rest of the Astartes
      power-armour family, scaled up from this heavier base. SM +1 is taken directly from
      framework.md's "a Terminator can be SM +1" note; the Basic Move penalty and extra DX note
      represent the suit's bulk in mechanical terms the anchor doesn't itself specify.
    children:
      - name: Auto-senses Suite (Terminator Pattern)
        weight: 6
        cost: 10000
        skill_bonuses: {Observation: 2}
        notes: Enhanced sensor package feeding a wider helm display; functionally similar to the Mark VII suite but built into a much larger helm.
        lore: Terminator squads are consistently shown operating with excellent situational awareness despite the suit's bulk.
        design: Same bonus as the Mark VII Auto-senses Suite; no lore basis for a numeric difference, only a cosmetic one (bigger helm, same sensor doctrine).
      - name: Vox-Link (Integrated)
        weight: 3
        cost: 3000
        notes: Long-range, high-power vox suited to boarding actions and teleport strikes where a squad may be cut off from wider support.
        lore: Teleport assault doctrine (Codex background, Black Library boarding-action fiction) depends on reliable vox once a squad is deep inside enemy territory.
        design: Flavour/utility subsystem; no DR or attribute effect.
      - name: Storm Bolter Mag-Lock Mount
        weight: 10
        cost: 5000
        notes: Combined weapon-mount and ammunition feed hardware for the suit's signature storm bolter/power fist loadout; the weapons themselves are not part of this file.
        lore: Terminators are almost always depicted armed with a storm bolter and power fist or matched pair of lightning claws, integrated into the suit's forearms.
        design: Flavour/mounting-hardware subsystem, priced separately from the weapons it carries.
      - name: Respirator & Full Void Seal
        weight: 10
        cost: 6000
        notes: Complete atmospheric independence, including extended vacuum survival for teleport strikes directly into voidborne hulks and enemy ships.
        lore: A staple of boarding-action fiction across the setting.
        design: Heavier/more thorough version of the Mark VII equivalent, priced up accordingly; no separate anchor.
      - name: Recyclers (Extended)
        weight: 8
        cost: 4000
        notes: Extended-endurance air and water reclamation for long teleport-strike or void-war deployments.
        lore: Consistent with Astartes endurance background.
        design: Flavour subsystem, no mechanical bonus.
      - name: Servo-Motor Actuators (Terminator Pattern)
        weight: 143
        cost: 62000
        attributes: {lifting_st: 20, striking_st: 10}
        notes: The largest and most powerful servo package in this file; the bulk of the suit's weight and cost.
        lore: Terminators are depicted punching through bulkheads and grappling with things no unarmoured human could touch, consistent with a major step up in raw powered strength over standard plate.
        design: ST bonus set well above every standard power-armour Mark, reflecting both the heavier plate the motors need to move and the suit's role fighting things far tougher than the standard's baseline.

  - name: Tactical Dreadnought Armour, Cataphractii Pattern
    tl: 11
    lc: 0
    cost: 130000
    weight: 340
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 88, arm: 75, leg: 75, neck: 60, skull: 88, face: 65, eye: 30, hand: 55, foot: 65}
    attributes: {lifting_st: 22, striking_st: 11, sm: 1, basic_move: -2}
    notes: >-
      Effective SM +1 while worn, as Indomitus pattern, but heavier still: an extra -1 Basic Move
      (net -2 total) and treat DX-based fine work at an extra -2, as Indomitus. Requires the black
      carapace interface.
    lore: >-
      Cataphractii is the older, Horus Heresy-era Terminator pattern: even more heavily armoured
      and correspondingly slower than the later Indomitus pattern that superseded it, per Forge
      World's Horus Heresy background and Black Library's Horus Heresy series, where Cataphractii-
      armoured Terminators are repeatedly described as nigh-unstoppable but ponderous.
    design: >-
      Torso DR set above the Tactical Dreadnought anchor (88 vs. the anchor's 80), justified by the
      lore's explicit framing of Cataphractii as heavier than modern Terminator plate — the anchor
      value is treated as the Indomitus/modern baseline, with this older pattern scaled up the same
      way individual power-armour Marks are scaled around the Mark VII baseline. An extra point of
      Basic Move penalty (net -2) represents the pattern's greater ponderousness relative to
      Indomitus plate.
