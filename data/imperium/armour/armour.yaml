      Not full plate, so no power-armour anchor applies. Torso DR 77: the carapace anchor (70)
      plus a small premium for Astartes-grade materials. Coverage is deliberately partial (legs
      36; no head, arm, hand or foot plate) for the half-armoured silhouette Scouts are drawn
      with. No servo-motor ST bonus: the suit is unpowered.

  # ---------------------------------------------------------------- Tactical Dreadnought (Terminator) armour
  - name: Tactical Dreadnought Armour, Indomitus Pattern
    tl: 11
    lc: 0
    cost: 120000
    weight: 300
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 180, arm: 140, leg: 140, neck: 110, skull: 180, face: 135, eye: 135, hand: 100, foot: 120}
    weak_points: 3
    attributes: {sm: 1, basic_move: -1}
    notes: >-
      Effective SM +1 while worn (bigger target, but also greater reach and a larger surface for
      called shots); on top of the usual rigid heavy armour penalties, treat DX-based fine work as
      at an extra -2 due to the suit's thick, servo-assisted gauntlets. Life support lets the wearer survive
      teleport-assault insertion and short vacuum/void operations. Requires the black carapace
      interface.
    lore: >-
      "Terminator" plate — modern Indomitus-pattern Tactical Dreadnought Armour — is the heaviest
      power armour a Space Marine can wear and fight in, reserved for a Chapter's most veteran
      warriors and for the most desperate close-quarters actions (teleport assaults into enemy
      strongholds, boarding actions). Current Codex Space Marines background and countless Black
      Library depictions describe it as effectively a one-Astartes tank: it shrugs off small-arms
      and bolter fire and is brought down only by heavy weapons, power fists, or comparable threats.
    design: >-
      Torso DR taken directly from the fixed anchor ("Tactical Dreadnought (Terminator) | 200,
      Ignores bolters. Plasma, lascannon, power fist and thunder hammer still kill.",
      framework.md). Limbs sit lower than torso by 25 (arms and legs), 50 (face and feet), 62
      (neck) and 75 (hands); eye lenses 150. SM +1 is taken directly from
      framework.md's "a Terminator can be SM +1" note; the Basic Move penalty and extra DX note
      represent the suit's bulk in mechanical terms the anchor doesn't itself specify. GCS adds
      a container's children to its own weight and cost, so the shell carries only the plate
      (300 lb, $120,000); with the children (180 lb, $90,000) the assembled suit is 480 lb and
      $210,000. The servo bonus (lifting +20, striking +10) lives on the Servo-Motor Actuators
      child only, so it is counted once.
    children:
      - name: Auto-senses Suite (Terminator Pattern)
        weight: 6
        cost: 10000
        skill_bonuses: {Observation: 2}
        notes: Enhanced sensor package feeding a wider helm display; functionally similar to the Mark VII suite but built into a much larger helm.
        lore: Terminator squads are consistently shown operating with excellent situational awareness despite the suit's bulk.
        design: Same bonus as the Mark VII Auto-senses Suite; no lore basis for a numeric difference, only a cosmetic one (bigger helm, same sensor doctrine).
      - name: Vox-Link (Integrated)
        weight: 3
        cost: 3000
        notes: Long-range, high-power vox suited to boarding actions and teleport strikes where a squad may be cut off from wider support.
        lore: Teleport assault doctrine (Codex background, Black Library boarding-action fiction) depends on reliable vox once a squad is deep inside enemy territory.
        design: Flavour/utility subsystem; no DR or attribute effect.
      - name: Storm Bolter Mag-Lock Mount
        weight: 10
        cost: 5000
        notes: Combined weapon-mount and ammunition feed hardware for the suit's signature storm bolter/power fist loadout; the weapons themselves are not part of this file.
        lore: Terminators are almost always depicted armed with a storm bolter and power fist or matched pair of lightning claws, integrated into the suit's forearms.
        design: Flavour/mounting-hardware subsystem, priced separately from the weapons it carries.
      - name: Respirator & Full Void Seal
        weight: 10
        cost: 6000
        notes: Complete atmospheric independence, including extended vacuum survival for teleport strikes directly into voidborne hulks and enemy ships.
        lore: A staple of boarding-action fiction across the setting.
        design: Heavier/more thorough version of the Mark VII equivalent, priced up accordingly; no separate anchor.
      - name: Recyclers (Extended)
        weight: 8
        cost: 4000
        notes: Extended-endurance air and water reclamation for long teleport-strike or void-war deployments.
        lore: Consistent with Astartes endurance background.
        design: Flavour subsystem, no mechanical bonus.
      - name: Servo-Motor Actuators (Terminator Pattern)
        weight: 143
        cost: 62000
        attributes: {lifting_st: 20, striking_st: 10}
        notes: The largest and most powerful servo package in this file; the bulk of the suit's weight and cost.
        lore: Terminators are depicted punching through bulkheads and grappling with things no unarmoured human could touch, consistent with a major step up in raw powered strength over standard plate.
        design: ST bonus set well above every standard power-armour Mark, reflecting both the heavier plate the motors need to move and the suit's role fighting things far tougher than the standard's baseline.

  - name: Tactical Dreadnought Armour, Tartaros Pattern
    tl: 11
    lc: 0
    cost: 100000
    weight: 250
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 171, arm: 132, leg: 132, neck: 102, skull: 171, face: 126, eye: 128, hand: 92, foot: 112}
    weak_points: 3
    attributes: {lifting_st: 18, striking_st: 9, sm: 1, basic_move: -1}
