      Effective SM +1 while worn. Lighter and faster than Cataphractii plate: Basic Move -1 like
      Indomitus, but the gauntlets are less clumsy, so treat DX-based fine work as an extra -1
      rather than -2. Requires the black carapace interface.
    lore: >-
      Tartaros is the Horus Heresy-era Terminator pattern built for boarding actions and fast
      assault: lighter and more mobile than the older Cataphractii plate, with a lower profile and
      a more integrated weapon mount, per Forge World's Horus Heresy background and Black Library's
      Horus Heresy series. It sits between the Mark VII power armour and the later Indomitus plate
      in protection.
    design: >-
      Torso DR 190, 10 under the Tactical Dreadnought anchor (200) and 30 under Cataphractii (220):
      the lore places it as the lightest of the Terminator patterns. Limbs sit lower than torso by
      25 (arms and legs), 50 (face and feet), 62 (neck) and 75 (hands), the Indomitus offsets;
      eye lenses 142 and Weak Points 3 as every Terminator plate. Servo bonus (lifting +18,
      striking +9) sits between the Mark VII's (9/5) and the Indomitus's (20/10). Weight 250 lb
      (Mark VII 150, Indomitus 300) and cost $100,000 ($120,000 for Indomitus) follow the same
      interpolation. SM +1 and Basic Move -1 as Indomitus. Built as a single item with the servo
      bonus on the parent and no children, like Cataphractii, so nothing is counted twice.

