      than torso by 17 (arms and legs), 24 (face), 31 (feet), 35 (neck) and 47 (hands), with
      eye-lens DR 98, three-quarters of the helmet's 130 (framework.md eye-lens rule), between the Mark VII (75) and Terminator (150) lenses. Servo ST bonus is raised well
