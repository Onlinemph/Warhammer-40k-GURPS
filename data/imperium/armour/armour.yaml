kind: equipment
output: Imperium/Armour/Imperial Armour.eqp
items:
  # ---------------------------------------------------------------- Flak
  - name: Flak Vest
    tl: 10
    lc: 3
    cost: 200
    weight: 8
    tags: [Body Armor, Imperium, Astra Militarum]
    dr: {"torso,vitals,groin": 30, "skull,face,eye,neck,arm,hand,leg,foot": 0}
    weak_points: 7
    notes: Covers torso only. Worn over fatigues; does not interfere with Stealth the way rigid plate does.
    lore: >-
      The standard-issue ballistic vest of the Astra Militarum: overlapping plasteel or ceramic
      plates sewn into a fabric carrier. Depicted throughout Guard-focused Black Library fiction
      (e.g. the Gaunt's Ghosts and Ciaphas Cain series) as adequate against shrapnel and stubber
      fire but routinely shrugged past by las-weapons at range and always by bolt weapons.
    design: >-
      Torso DR 30, the framework's flak anchor (raised from 12 at the user's direction to make
      Guard armour tougher). Exact odds per hit: lasgun 7d(2) 98%, laspistol 4d(2) 34%, autogun 7d
      9%, autopistol 0%. Flak now stops most solid-slug fire, matching the original lore line that
      flak stops stub rounds, while las still gets through. No coverage elsewhere: a vest stops at
      the shoulders and waist. Cost and weight are estimates scaled below mesh and well below
      carapace.
  - name: Flak Jacket
    tl: 10
    lc: 3
    cost: 250
    weight: 10
    tags: [Body Armor, Imperium, Astra Militarum]
    dr: {"torso,vitals,groin": 30, arm: 23, "skull,face,eye,neck,hand,leg,foot": 0}
    weak_points: 7
    notes: Sleeved version of the flak vest; partial arm coverage from the short armoured sleeves.
    lore: >-
      A sleeved variant of the vest, common where regiments expect close-quarters or urban combat
      and want some forearm protection against shrapnel and blades. Seen in Imperial Guard art and
      background across multiple Codex Astra Militarum editions.
    design: >-
      Torso DR 30 (flak anchor). Arms 23, a few points below torso per the framework's limb
      convention, keeping the 3:4 limb-to-torso ratio.
  - name: Flak Coat, Death Korps Pattern
    tl: 10
    lc: 3
    cost: 320
    weight: 15
    tags: [Body Armor, Imperium, Astra Militarum]
    dr: {"torso,vitals,groin": 30, arm: 23, leg: 23, "skull,face,eye,neck,hand,foot": 0}
    weak_points: 7
    notes: >-
      Ankle-length greatcoat with a quilted flak liner; often worn with a Death Korps gas-hood
      (see Respirator, Imperial Field Gear) rather than a separate helmet.
    lore: >-
      The Death Korps of Krieg's iconic heavy greatcoat is depicted in Forge World's Imperial
      Armour background and in Black Library's Krieg-focused fiction as a full-length, gas-sealed
      coat rather than a vest, reflecting the regiment's siege-warfare and toxic-battlefield
      doctrine.
    design: >-
      Torso DR 30 (flak anchor); the coat's extra length buys leg coverage, not thicker plate.
      Arms and legs 23, matching the Flak Jacket.
  - name: Flak Armour, Full Suit (Cadian Pattern)
    tl: 10
    lc: 3
    cost: 420
    weight: 18
    tags: [Body Armor, Imperium, Astra Militarum]
    dr: {"torso,vitals,groin": 30, arm: 23, leg: 23, "skull,face,eye,neck,hand,foot": 0}
    weak_points: 7
    notes: >-
      Vest, pauldrons and leggings worn as a matched set; pairs with the Flak Helmet below for full
      coverage. The Cadian pattern (moulded breastplate over a grey bodyglove) is the Munitorum's
      most widely issued flak set and the visual template most Guard regiments are equipped from.
    lore: >-
      Cadian Shock Troops are the Munitorum's default visual and doctrinal template for Guard
      infantry across Codex Astra Militarum background and Black Library fiction (Cadian-focused
      novels). Other regiments field their own cut of the same flak
      principle: Mordian dress-pattern jackets, Vostroyan quilted coats, Tallarn wraps, Catachan
      shirtless carapace-less troopers who often forgo the torso plate altogether for heat and
      mobility.
    design: >-
      Same profile as the Flak Coat: torso 30 (flak anchor), arms and legs 23. The full suit buys
      a matched, fitted kit rather than a higher number; regimental variation is flavour, not
      stats.
  - name: Flak Helmet, Cadian Pattern
    tl: 10
    lc: 3
    cost: 60
    weight: 3
    tags: [Body Armor, Imperium, Astra Militarum]
    dr: {skull: 25, "face,eye,neck,torso,vitals,groin,arm,hand,leg,foot": 0}
    weak_points: 7
    notes: Open-faced; no eye or face protection. Some patterns (Mordian, Death Korps) add a neck flap worth a point or two of DR at the GM's discretion.
    lore: >-
      The classic Guard helmet: a domed plasteel/ceramite shell with a chinstrap and no visor,
      seen across nearly every piece of Astra Militarum art and background from the Uplifting
      Primer excerpts onward.
    design: >-
      Skull DR 25, the framework's flak helmet anchor. Open face is a lore call: Guard helmets are
      consistently drawn without a visor.

  # ---------------------------------------------------------------- Mesh
  - name: Mesh Armour
    tl: 10
    lc: 2
    cost: 1600
    weight: 6
    tags: [Body Armor, Imperium]
    dr: {"torso,vitals,groin": 36, arm: 29, leg: 29, neck: 21, "skull,face,eye,hand,foot": 0}
    weak_points: 6
    notes: >-
      Flexible armour: treat blunt/crushing damage that fails to penetrate as normal per the
      flexible-armour rule (blunt trauma still applies even when DR stops the attack).
    lore: >-
      Fine metal-weave armour worn under fashionable clothing by hive nobility, Officio Assassinorum
      operatives, and Inquisitorial agents who need protection without looking armoured. Described
      across Dark Heresy/Rogue Trader-line background and hive-noble scenes in Black Library
      fiction (the Eisenhorn and Ravenor series) as concealable and comfortable but not rigid.
    design: >-
      Torso DR 36, the framework's mesh anchor, flexible (GURPS flexible-armour rules: stops
      penetration, not blunt trauma; see notes). Arms and legs 29, neck 21, keeping the earlier
      limb ratios. Hands, feet and head uncovered: a bodysuit worn under clothes.

  # ---------------------------------------------------------------- Carapace
  - name: Carapace Armour, Guard Pattern
    tl: 10
    lc: 2
    cost: 1800
    weight: 30
    tags: [Body Armor, Imperium, Astra Militarum]
    dr: {"torso,vitals,groin": 70, arm: 52, leg: 52, neck: 52, skull: 64, face: 36, eye: 48, hand: 0, foot: 36}
    weak_points: 5
    notes: Rigid plate over a padded underlayer; imposes the usual GURPS bulky-armour DX/Stealth penalties for rigid heavy armour.
    lore: >-
      Moulded plasteel plate issued to elite Guard formations (storm troopers historically, tank
      crew, and veteran squads) and worn as a full body shell with integral or paired helmet.
      Only War and Dark Heresy background consistently place carapace a clear step above flak and
      a clear step below power armour, which the anchor table encodes directly.
    design: >-
      Torso DR 70, the framework's carapace anchor (raised from 45 at the user's direction). Exact
      odds per hit: lasgun 7d(2) 0.6%, long-las 8d(2) 6%, hellgun 8d(3) 82%, bolter 79%. Carapace
      is close to immune to standard las fire; hellguns and bolters are what beat it. Arms, legs
      and neck 52, skull 64, face and feet 36, eye 48 (three-quarters of the helmet, framework.md eye-lens rule), keeping the earlier location ratios; hands
      uncovered (gauntlets are separate).
  - name: Carapace Armour, Tempestus Pattern
    tl: 10
    lc: 1
    cost: 2600
    weight: 32
    tags: [Body Armor, Imperium, Astra Militarum]
    dr: {"torso,vitals,groin": 70, arm: 64, leg: 64, neck: 64, skull: 70, face: 42, eye: 52, hand: 36, foot: 42}
    weak_points: 4
    notes: Void-sealed; can be worn in vacuum or toxic atmosphere for short periods without a separate rebreather. Rigid heavy armour DX/Stealth penalties apply.
    lore: >-
      The maroon-and-grey carapace of the Tempestus Scions (and their forerunners, Storm Troopers)
      is depicted across Codex Astra Militarum and Only War background and in Black Library
      fiction (widely depicted; no single source) as better-fitted and more complete than line-Guard carapace, closing the gaps at
      the hands, feet and joints that standard-issue kit leaves open, and rated for drop-pod and
      high-altitude insertion.
    design: >-
      Torso DR 70 (carapace anchor). Elite carapace isn't a thicker category; its edge is
      coverage: hands and feet protected, and limbs and neck (64) sit closer to torso than the
      Guard pattern's, for tighter, better-forged fit. Skull 70, face and feet 42, hands 36,
      eye 52.
  - name: Carapace Armour, Arbites Pattern
    tl: 10
    lc: 2
    cost: 2400
    weight: 34
    tags: [Body Armor, Imperium, Adeptus Arbites]
    dr: {"torso,vitals,groin": 70, arm: 56, leg: 56, neck: 64, skull: 70, face: 52, eye: 52, hand: 36, foot: 42}
    weak_points: 4
    notes: >-
      Full-face armoured mask standard; the enclosed helm and shoulder guards read as unmistakably
      Arbites on sight, which the GM may use for Intimidation or Fast-Talk reaction penalties
      against criminal or hive-ganger NPCs. Rigid heavy armour DX/Stealth penalties apply.
    lore: >-
      Adeptus Arbites Judges wear a distinct black or grey carapace pattern built for riot control
      and room-clearing rather than open-field war: an enclosed, masked helm (unlike the Guard's
      open one), shoulder guards, and a design meant to intimidate a hab-block as much as protect
      the wearer. Depicted in Black Library's Warhammer Crime line and in Codex and
      Necromunda background (widely depicted; no single source).
    design: >-
      Torso DR 70 (carapace anchor). Like the Tempestus pattern it adds full head enclosure and
      hand/foot coverage for close-quarters hab clearance: limbs 56, neck 64, skull 70, face 52,
      feet 42, hands 36, eye 52 (three-quarters of the helmet, framework.md eye-lens rule).

  # ---------------------------------------------------------------- Sororitas
  - name: Power Armour, Adepta Sororitas
    tl: 11
    lc: 0
    cost: 30000
    weight: 53
    tags: [Body Armor, Imperium, Adepta Sororitas]
    dr: {"torso,vitals,groin": 76, arm: 51, leg: 51, neck: 55, skull: 72, face: 48, eye: 54, hand: 30, foot: 34}
    weak_points: 5
    notes: >-
      Built and rigged for an unaugmented human body: no black carapace or other neural interface
      is required, and a Sister of Battle suffers none of the fit/control penalties a
      non-Astartes wearer would face in Astartes plate. Rigid heavy armour DX/Stealth penalties
      apply; treat as one step lighter than Astartes plate for encumbrance purposes.
    lore: >-
      Adepta Sororitas power armour is consistently described (Codex Adepta Sororitas background,
      Black Library's Sisters of Battle fiction such as Ephrael Stern: The Heretic Saint) as
      true powered plate — lighter and less overbuilt than Astartes armour,
      because it's engineered from the outset for a baseline (if exceptionally devout and
      disciplined) human body rather than a post-human one.
    design: >-
      Torso DR 85, the framework's Sororitas anchor: raised from 70 when carapace went to 70,
      so power armour stays clearly above the best unpowered plate while remaining well under
      Astartes plate (100). Exact odds per hit: bolter 45%, hellgun 8d(3) 46%, plasma 100%.
      Limbs 64, neck 69, skull 80, face 53, feet 42, hands 38, eye 60 (three-quarters of the helmet, framework.md eye-lens rule), keeping the earlier
      location ratios. Weight and cost are reasoned: the assembled suit is 80 lb and $52,000 (shell 53 lb plus subsystems),
      about a third of an Astartes suit's weight at a fraction of the price, since it needs
      no genetic modification of its wearer. GCS adds a container's children to its own weight
      and cost, so the plate shell carries only its own remainder (13 lb, $8,000) and the
      children carry the rest (27 lb, $22,000).
    children:
      - name: Auto-senses Suite (Sororitas Pattern)
        weight: 3
        cost: 3000
        skill_bonuses: {Observation: 1}
        notes: Basic audio filtering and low-light optics; simpler than the Astartes suite, no auto-cueing threat display.
        lore: A modest sensory package, adequate for a human's reaction speed rather than a post-human's.
        design: Small flat skill bonus in place of the fuller Astartes package below; no anchor, kept deliberately weaker than the Astartes version per the framework's "lighter than Astartes plate" note.
      - name: Vox-Link (Integrated)
        weight: 2
        cost: 1500
        notes: Short-to-medium range encrypted vox built into the gorget; functions as a Vox-Caster with reduced range (see Imperial Field Gear).
        lore: Every Battle Sister fights as part of a squad and chapter of communication discipline; integrated comms are standard across Imperial power armour.
        design: Flavour/utility subsystem; no DR or attribute effect, priced as a fraction of a standalone vox-caster.
      - name: Respirator & Void Seal
        weight: 5
        cost: 2000
        notes: Full atmospheric seal; grants immunity to inhaled toxins and gas while sealed, and short-duration vacuum survival.
        lore: Depicted whenever Sisters fight in space hulks, plague zones, or void war, consistent with Astartes-style sealed plate.
        design: No anchor; standard sealed-armour assumption carried over from the Astartes suit's equivalent subsystem.
      - name: Recyclers
        weight: 3
        cost: 1500
        notes: Reclaims water and scrubs air, extending sealed endurance to several days.
        lore: Rarely dwelt on in fiction but implied whenever characters in sealed plate operate for extended periods without resupply.
        design: Minor flavour subsystem, no mechanical bonus; present for completeness of the container breakdown.
      - name: Servo-Motor Actuators (Sororitas Pattern)
        weight: 14
        cost: 14000
        attributes: {lifting_st: 6, striking_st: 3}
        notes: Powered assistance sized for a human frame; noticeably weaker than an Astartes suit's motors.
        lore: Sisters of Battle are shown out-muscling unarmoured humans effortlessly but never matching a Space Marine's raw strength; the suit's motors reflect that ceiling.
        design: ST bonus set well below the Astartes figures (see Mark VII) to keep the human-scale Sororitas suit clearly weaker in raw power while still far above an unarmoured human, consistent with lore depictions.

  # ---------------------------------------------------------------- Astartes power armour marks
  - name: Power Armour, Mark II (Crusade Pattern)
    tl: 11
    lc: 0
    cost: 30000
    weight: 140
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 83, arm: 64, leg: 64, neck: 44, skull: 83, face: 60, eye: 62, hand: 44, foot: 54}
    weak_points: 6
    attributes: {lifting_st: 8, striking_st: 4}
    notes: >-
      Requires the black carapace interface to move and fight at full efficiency (see design
      note). Early plate with poorer seals and joints than later marks (Weak Points 6). Rigid heavy armour DX/Stealth penalties apply.
    lore: >-
      Mark II "Crusade Armour" was the first pattern produced in the numbers needed to arm the
      Great Crusade's expanding Legions: simplified, mass-producible plate that replaced the
      ornate, hand-fitted Mark I suits. Horus Heresy-era Black Library fiction (the Horus Heresy
      novel series) depicts it as solid but unremarkable — the workhorse suit of the early
      Crusade, superseded once heavier and then more mobile patterns entered production.
    design: >-
      Torso DR 92, 8 below the Mark VII baseline (100), inside the framework's "Marks vary
      ±10–15 around this" spread and a little under Mark IV (95): an early, mass-produced pattern
      with poorer seals, hence Weak Points 6 against Mark IV's 5 (Mark VII is 4). Limbs use the
      Mark VII offsets from torso (arms and legs -12, face and feet -25, neck and hands -37).
      Eye lenses 69, three-quarters of the helmet's 92 (framework.md eye-lens rule). Servo ST bonus (lifting 8, striking 4) a step
      under the Mark VII's, typical of the early suits. Cost $30,000, $10,000 under the Mark VII
      because it is the simpler, cheaper plate.

  - name: Power Armour, Mark III (Iron Armour)
    tl: 11
    lc: 0
    cost: 45000
    weight: 160
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 102, arm: 80, leg: 80, neck: 60, skull: 102, face: 79, eye: 76, hand: 60, foot: 70}
    weak_points: 4
    attributes: {lifting_st: 9, striking_st: 5}
    notes: >-
      Heaviest of the Heresy-era patterns; the design prioritises frontal protection over mobility
      (treat as an extra -1 to Dodge or an extra step of encumbrance at the GM's discretion, on top
      of the usual rigid heavy armour penalties). Requires the black carapace interface.
    lore: >-
      Mark III "Iron Armour" is described in Horus Heresy-era Black Library fiction and Forge
      World's Horus Heresy background as heavy, front-loaded plate designed for close assault and
      breaching actions — thick chest and shoulder plate at the cost of speed, issued for grinding,
      attritional fighting rather than manoeuvre warfare.
    design: >-
      Torso DR 113, 13 above the Mark VII baseline (100), near the top of the framework's
      "±10–15" spread, reflecting Mark III's reputation as the single heaviest mainline pattern.
      Limbs use the Mark VII offsets from torso (arms and legs -13, face and feet -25, neck and
      hands -38). Eye lenses 85, three-quarters of the helmet's 113 (framework.md eye-lens rule). The extra bulk is also
      flagged qualitatively in `notes` as a mobility cost, since the DR anchor spread has no
      separate mechanism for encoding "heavier but slower" beyond the number itself.

  - name: Power Armour, Mark IV (Maximus Pattern)
    tl: 11
    lc: 0
    cost: 38000
    weight: 135
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 86, arm: 66, leg: 66, neck: 46, skull: 86, face: 63, eye: 64, hand: 46, foot: 56}
    weak_points: 5
    attributes: {lifting_st: 8, striking_st: 4}
    notes: >-
      Interlocking plate sections reduce the usual bulky-armour penalty by 1 relative to other
      Marks at the GM's discretion (still requires the black carapace interface).
    lore: >-
      Mark IV "Maximus Armour" introduced overlapping, interlocking plates and improved
      articulation partway through the Horus Heresy, trading a little of Mark III's raw frontal
      thickness for a suit Legion armourers could produce faster and Astartes could fight in more
      freely — the pattern most associated with the war's mid-to-late battles in Black Library's
      Horus Heresy series.
    design: >-
      Torso DR 95, 5 below the Mark VII baseline and 3 above the Mark II: the fiction frames
      Mark IV as a mobility improvement over Mark III, not a protection one, so the DR number sits
      at the "lighter" end of the spread — the improvement is represented instead as a
      reduced bulk penalty called out in `notes`. Eye lenses 71, three-quarters of the helmet's 95 (framework.md eye-lens rule).

  - name: Power Armour, Mark V (Heresy Pattern)
    tl: 11
    lc: 0
    cost: 37000
    weight: 133
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 84, arm: 64, leg: 64, neck: 44, skull: 84, face: 61, eye: 63, hand: 44, foot: 54}
    weak_points: 5
    attributes: {lifting_st: 7, striking_st: 4}
    notes: >-
      A hybrid/composite suit: individual pieces may visibly mismatch (Mark II vambraces on a
      Mark IV chestpiece, etc.) with no mechanical effect beyond what's already priced in below.
      Requires the black carapace interface.
    lore: >-
      Mark V "Heresy Armour" is the composite pattern that emerged as Legion forges struggled to
      keep pace with attrition during the war's later years: earlier-mark components refitted and
      combined with whatever a forge or salvage crew had on hand. Horus Heresy-era Black Library
      fiction repeatedly shows Astartes wearing visibly patchwork plate by this stage of the war.
    design: >-
      Torso DR set just below the general -5-from-baseline cluster (93) to reflect inconsistent
      manufacture and scavenged parts — the framework's Mark spread is ±10–15, and a composite suit
      built from mismatched salvage is reasoned to sit at the lower edge of that range rather than
      the middle. Eye lenses 70, three-quarters of the helmet's 93 (framework.md eye-lens rule).

  - name: Power Armour, Mark VI (Corvus Pattern)
    tl: 11
    lc: 0
    cost: 36000
    weight: 125
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 79, arm: 60, leg: 60, neck: 40, skull: 79, face: 57, eye: 59, hand: 40, foot: 50}
    weak_points: 5
    attributes: {lifting_st: 7, striking_st: 3}
    notes: Reduced bulk penalty (as Mark IV) reflecting the pattern's emphasis on speed. Requires the black carapace interface.
    lore: >-
      Mark VI "Corvus Armour" — the famous "beaky" helm pattern — is depicted across Horus Heresy
      background and later flashback fiction as deliberately lighter and faster than its
      predecessors, developed by the Raven Guard's Corvus Corax and adopted widely for its
      mobility, at a real cost in raw protection compared to heavier Heresy-era plate.
    design: >-
      Torso DR set at the bottom of the framework's ±10–15 spread (88, -12), the lightest of the
      Heresy-era marks modelled here, directly reflecting the "lighter" framing consistently
      attached to this pattern in the lore. Eye lenses 66, three-quarters of the helmet's 88 (framework.md eye-lens rule); the
      reduced-bulk note mirrors Mark IV's for the same reason (both patterns are explicitly about
      trading plate for speed).

  - name: Power Armour, Mark VII (Aquila Pattern)
    tl: 11
    lc: 0
    cost: 40000
    weight: 150
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 90, arm: 70, leg: 70, neck: 50, skull: 90, face: 68, eye: 68, hand: 50, foot: 60}
    weak_points: 4
    notes: >-
      This is the framework's baseline pattern; treat its numbers as the reference point every
      other Mark is compared against. Requires the black carapace interface: an Astartes without
      one (very rare; the implant is standard by the time a Scout is elevated) fights at -4 DX and
      half Basic Move in this suit and cannot use its auto-senses or weapon interlocks. A
      non-Astartes human forced into Mark VII plate (e.g. by an Inquisitor's agent testing a relic
      suit) suffers the same penalties and additionally cannot engage the suit's fine motor
      control at all for tasks finer than walking and gross gestures — the black carapace is what
      translates a wearer's nervous system directly into the suit's servo response, and nothing
      else substitutes for it.
    lore: >-
      Mark VII "Aquila Armour" is the standardised post-Heresy pattern issued across the newly
      re-formed Chapters and remains, per current Codex Space Marines background and countless
      41st-millennium Black Library novels, the most commonly depicted Astartes plate to this day.
    design: >-
      Torso DR is the fixed anchor ("Astartes power armour (Mk VII baseline) | 90 torso, 70 arms
      and legs, 50 neck", framework.md); every other Mark in this file is derived relative to this
      entry. The anchor was 100 with limbs 88 and neck 63; by user direction (plate whose weak
      places matter) torso, skull, face and eye lenses went to 0.9 of that and arms, legs, hands,
      feet and neck to 0.8, and every power and Terminator suit got the same scaling. The Mark VII's own servo bonus (lifting +9, striking +5) is the
      reference value the other marks scale from. GCS adds a container's children to its own
      weight and cost, so the shell entry is the plate itself (150 lb, $40,000); with its subsystems (90 lb, $30,000) the assembled suit is 240 lb and $70,000. The servo bonus lives on the
      Servo-Motor Actuators child only, so it is counted once.
    children:
      - name: Auto-senses Suite
        weight: 4
        cost: 6000
        skill_bonuses: {Observation: 2}
        notes: >-
          Threat auto-cueing, low-light and audio filtering, and passive proximity warning feeding
          directly into the wearer's helmet display. Requires the black carapace interface to use
          at full effect.
        lore: Depicted throughout Astartes-viewpoint fiction (the Horus Heresy series, Space Marine Battles line) as a constant background hum of tactical data most Astartes barely consciously notice.
        design: No numeric anchor; modelled as a flat Observation bonus, deliberately larger than the Sororitas suite's, reflecting the fuller sensor package and the neural bandwidth the black carapace provides to use it.
      - name: Vox-Link (Integrated)
        weight: 2
        cost: 2000
        notes: Squad- and Chapter-band encrypted vox built into the gorget.
        lore: Every depiction of Astartes small-unit tactics assumes constant, reliable vox discipline.
        design: Flavour/utility subsystem; no DR or attribute effect.
      - name: Autoreactive Shoulder Plates
        weight: 8
        cost: 3000
        notes: >-
          Pauldrons that shift and stiffen a fraction of a second before an incoming blow lands;
          this reactive behaviour is already folded into the suit's listed arm and torso DR above,
          not an additional bonus.
        lore: A detail repeatedly mentioned in Astartes armour background as part of what makes the suit "fight with" its wearer rather than merely cover them.
        design: Modelled as flavour/explanation for part of the parent item's existing DR rather than a separate bonus, to avoid double-counting protection.
      - name: Respirator & Void Seal
        weight: 6
        cost: 3000
        notes: Full atmospheric independence; immune to inhaled toxins and gas while sealed, vacuum-rated for extended operations.
        lore: Astartes routinely fight in void war, toxic hive-scum, and daemon-tainted atmospheres in sealed plate across the setting's fiction.
        design: Standard sealed-armour assumption; no separate anchor.
      - name: Recyclers
        weight: 5
        cost: 2000
        notes: Reclaims water and scrubs air, and in conjunction with an Astartes's own physiology allows sealed operation for many days.
        lore: Consistent with Astartes physiology background (framework.md notes Astartes "no need to sleep for weeks"); the suit's recyclers are the mundane counterpart to that endurance.
        design: Flavour subsystem, no mechanical bonus.
      - name: Servo-Motor Actuators
        weight: 65
        cost: 14000
        attributes: {lifting_st: 9, striking_st: 5}
        notes: The bulk of the suit's weight and cost; converts the wearer's black-carapace-transmitted movements into full-body powered assistance.
        lore: The core of what makes power armour "powered" rather than simple plate, referenced constantly wherever Astartes strength in combat is described.
        design: ST bonus is the reference figure every other Astartes-pattern suit in this file scales from.

  - name: Power Armour, Mark VIII (Errant Pattern)
    tl: 11
    lc: 0
    cost: 42000
    weight: 155
    tags: [Body Armor, Imperium, Adeptus Astartes]
    dr: {"torso,vitals,groin": 94, arm: 74, leg: 74, neck: 74, skull: 94, face: 72, eye: 71, hand: 54, foot: 64}
    weak_points: 4
    attributes: {lifting_st: 9, striking_st: 5}
    notes: >-
      The reinforced collar gives this pattern far better neck coverage than other Marks (see DR
      above). Requires the black carapace interface, as Mark VII.
    lore: >-
      Mark VIII "Errant Armour" refined Mark VII with a distinctive high, armoured collar guard
      and improved external cabling/power-routing meant to better survive void and jump-pack
      operations; current Codex Space Marines background places it as a slightly later, incremental
      pattern rather than a wholesale redesign.
    design: >-
      Torso DR set 5 above the Mark VII baseline (105), within the framework's ±10–15 spread. The
      pattern's signature feature — its reinforced collar — is modelled as a large jump in neck DR
      specifically (93, matching the arm DR rather than the usual lower neck figure, versus 63 on
      Mark VII) rather than a torso change, since that's exactly where the lore says the
      improvement lives. Eye lenses 79, three-quarters of the helmet's 105 (framework.md eye-lens rule).

