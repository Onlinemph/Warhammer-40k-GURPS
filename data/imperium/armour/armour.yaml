    design: >-
      Torso DR 220, 20 above the Tactical Dreadnought anchor (200), justified by the lore's
      explicit framing of Cataphractii as heavier than modern Terminator plate; the anchor value is
      treated as the Indomitus/modern baseline. Limbs sit lower than torso by 32 (arms and legs),
      57 (face and feet), 69 (neck) and 82 (hands); eye lenses 165. Weak Points
      3 as every Terminator plate. An extra point of Basic Move penalty (net -2) represents
      the pattern's greater ponderousness relative to Indomitus plate.
