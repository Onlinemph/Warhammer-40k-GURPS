kind: traits
output: Imperium/Traits/Imperial Traits.adq
items:
  # ------------------------------------------------------------ Faith and fanaticism
  - name: Fanaticism (The God-Emperor)
    points: -15
    tags: [Disadvantage, Mental, Imperium]
    ref: B136
    lore: >
      Unshakeable belief that the Emperor is a god and that His will
      justifies anything done in His name — the baseline psychology Black
      Library gives almost every loyal Imperial citizen and soldier, from a
      Cadian trooper's last prayer to a Sororitas' battle-hymn. Distinct
      from mere piety (Theology skill, Sense of Duty): this is doctrinal
      certainty strong enough to override self-preservation.
    design: >
      Basic Set Fanaticism (B136), flat -15, taken for "the Emperor/the
      Imperial Creed" as the group/ideal. Not leveled in Basic Set.
  - name: Intolerance (Xenos)
    points: -10
    tags: [Disadvantage, Mental, Imperium]
    ref: B140
    lore: >
      "The alien is the enemy" as baseline Imperial doctrine — not personal
      bigotry but state religion. Universal across Black Library fiction;
      only a minority of xenos-sympathetic characters (some Rogue Traders,
      Ordo Xenos radicals) lack it.
    design: >
      Basic Set Intolerance (B140). Costed at -10, the "very broad category"
      end of the range the book allows, since "all non-human sapient
      species" is about as broad a target as Intolerance can name.
  - name: Intolerance (Mutants)
    points: -10
    tags: [Disadvantage, Mental, Imperium]
    ref: B140
    lore: >
      "The mutant is the enemy": Imperial law treats unsanctioned mutation
      as heresy, and ordinary citizens are shown reporting or lynching
      mutants on sight (Ciaphas Cain, Gaunt's Ghosts, Necromunda material).
    design: Basic Set Intolerance (B140), broad-category cost as above.
  - name: Intolerance (Psykers)
    points: -10
    tags: [Disadvantage, Mental, Imperium]
    ref: B140
    lore: >
      "The witch is the enemy": fear of untrained or unsanctioned psykers
      runs through Imperial culture (mobs burning suspected witches before
      the Black Ships arrive is a recurring Black Library beat).
    design: Basic Set Intolerance (B140), broad-category cost.
  - name: Intolerance (Heretics)
    points: -5
    tags: [Disadvantage, Mental, Imperium]
    ref: B140
    lore: >
      Hostility toward the openly faithless or Chaos-tainted specifically,
      as opposed to xenos or mutants generally — a narrower target (a
      behaviour/allegiance, not a whole species), so cheaper under B140's
      guidance for a less sweeping category.
    design: Basic Set Intolerance (B140), narrow-category cost (-5).
  # ------------------------------------------------------------ Discipline
  - name: Fearlessness
    per_level: 2
    levels: 5
    tags: [Advantage, Mental, Imperium]
    ref: B55
    lore: >
      The iron nerve drilled (or chemically/surgically reinforced) into
      Commissars, veteran Guard NCOs, and Astartes alike; Ciaphas Cain's
      narration repeatedly contrasts genuine Fearlessness against his own
      merely well-hidden terror.
    design: Basic Set Fearlessness (B55), 2/level, max 5 levels as usual; buy the level that fits the character.
  - name: Unfazeable
    points: 15
    tags: [Advantage, Mental, Imperium]
    ref: B95
    lore: >
      Nothing shocks or horrifies this character: the mark of a Commissar
      or veteran Inquisitor who has seen enough warp-touched horror that a
      daemon incursion barely raises an eyebrow.
    design: Basic Set Unfazeable (B95), flat 15 points.
  # ------------------------------------------------------------ Duty
  - name: Duty (Astra Militarum)
    points: -15
    tags: [Disadvantage, Social, Imperium, Astra Militarum]
    ref: B133
    lore: >
      Guardsmen do not resign; the Munitorum owns their service until death,
      discharge, or reassignment. Extremely hazardous, almost always
      active — front-line Guard regiments are shown fighting until they are
      no longer regiments.
    design: >
      Basic Set Duty (B133): almost-always-on-duty, hazardous, involuntary
      military service, at the top of the disadvantage's standard cost
      range.
  - name: Duty (Inquisition)
    points: -15
    tags: [Disadvantage, Social, Imperium, Inquisition]
    ref: B133
    lore: >
      An acolyte or Interrogator serves at an Inquisitor's word, and an
      Inquisitor answers to their Ordo and (nominally) the wider
      Inquisition; refusal is itself grounds for suspicion of heresy.
    design: Basic Set Duty (B133), hazardous and frequent, as above.
  - name: Duty (Ecclesiarchy)
    points: -10
    tags: [Disadvantage, Social, Imperium, Ecclesiarchy]
    ref: B133
    lore: >
      A Battle Sister's or priest's obligation to the Ministorum's chain of
      command — frequent and binding, but less constantly lethal than
      Guard or Inquisition service on average (a Sororitas' hazard comes
      from her *mission*, not baseline garrison duty).
    design: Basic Set Duty (B133), one tier below the fully hazardous, always-on entries above.
  - name: Sense of Duty (Squadmates)
    points: -5
    ref: B153
    tags: [Disadvantage, Mental, Imperium]
    lore: >
      Small combat units live and die by cohesion; abandoning a wounded
      comrade is the one thing that reliably gets a soldier shunned by
      their own side, per how Guard squads and Sororitas/Militarum
      Tempestus kill-teams are consistently written in Black Library
      fiction.
    design: Basic Set Sense of Duty (B153), small-group scope, -5.
  - name: Overconfidence
    points: -5
    ref: B148
    tags: [Disadvantage, Mental, Imperium]
    lore: >
      A common trait of the Imperium's acknowledged elites (Scions,
      rising Inquisitorial stars), who are written as knowing exactly how
      good they are relative to line troops.
    design: Basic Set Overconfidence (B148), -5.
  - name: Callous
    points: -5
    ref: B125
    tags: [Disadvantage, Mental, Imperium]
    lore: >
      Willingness to spend subordinates', bystanders', or entire
      populations' lives against the mission — a recurring trait of
      Commissars and Inquisitors alike in Black Library fiction (played
      straight in most Inquisitor protagonists, deliberately subverted by
      Ciaphas Cain).
    design: Basic Set Callous (B125), -5.
  # ------------------------------------------------------------ Authority
  - name: Legal Enforcement Powers (Adeptus Arbites)
    per_level: 5
    levels: 2
    tags: [Advantage, Social, Imperium]
    ref: B65
    lore: >
      Full Arbites police powers: arrest, search, and use of lethal force
      under the Lex Imperialis, backed by a precinct-house and Arbites
      armoury. Depicted throughout Black Library (Necromunda's Arbites,
      the Eisenhorn books' encounters with precinct Arbitrators) as
      "the law" on any Imperial world they're posted to.
    design: >
      Basic Set Legal Enforcement Powers (B65), 5/level; costed at level 2
      (10 points) for a working Arbitrator with real jurisdiction, below
      the maximum the trait allows.
  - name: Legal Enforcement Powers (Inquisitorial Rosette)
    per_level: 5
    levels: 4
    tags: [Advantage, Social, Imperium, Inquisition]
    ref: B65
    lore: >
      "I have the authority of the Emperor Himself" — an Inquisitor can
      commandeer Imperial Guard regiments, override a planetary
      governor's orders, or execute an Astartes Chapter Master's aide
      without trial, per repeated scenes across Eisenhorn, Ravenor, and
      countless codex vignettes.
    design: >
      Basic Set Legal Enforcement Powers (B65) at its maximum, 4 levels
      (20 points): the trait's own ceiling. Note the honest mismatch —
      fiction gives an Inquisitor authority well beyond what 20 points of
      LEP models (they can, in principle, override anyone up to and
      including a Space Marine Chapter). That narrative scope isn't
      something a point-bought trait should try to fully price; GMs run it
      as near-absolute in-fiction authority backed by this trait for the
      mechanical bits (arrest, search, requisition) and by roleplaying
      otherwise, exactly as Dark Heresy handles it with a non-numeric
      "Inquisitorial authority" rule instead of a stat.
  - name: Secret (Works for the Inquisition)
    points: -10
    ref: B152
    tags: [Disadvantage, Social, Imperium, Inquisition]
    lore: >
      Inquisitorial agents routinely operate under cover identities; being
      identified as Inquisition staff can get an agent killed by exactly
      the people they are investigating, or by a hostile Imperial official
      who resents being investigated at all.
    design: Basic Set Secret (B152), moderate exposure risk, -10.
  - name: Legal Enforcement Powers (Commissariat)
    per_level: 5
    levels: 3
    tags: [Advantage, Social, Imperium, Astra Militarum]
    ref: B65
    lore: >
      A Commissar's authority to enforce discipline within their attached
      regiment up to and including summary execution for cowardice,
      desertion, or heresy — a narrower grant than an Inquisitorial
      rosette (it stops at the regiment's edge) but exercised far more
      routinely; Ciaphas Cain's narration treats a drawn bolt pistol and
      the words "for the Emperor" as a Commissar's standard response to
      a wavering line.
    design: >
      Basic Set Legal Enforcement Powers (B65), 5/level, at 3 levels
      (15 points) — one tier below an Inquisitorial rosette's maximum,
      reflecting authority that is real and lethal but scoped to a single
      command rather than the whole Imperium.
  - name: Military Rank
    per_level: 5
    levels: 6
    tags: [Advantage, Social, Imperium, Astra Militarum]
    ref: B29
    lore: >
      Astra Militarum officer rank, from a newly-brevetted Lieutenant up
      through a Lord General commanding an army group. Levels are a rough
      fit, not a lore-exact rank chart: use as many levels as the
      character's actual seniority needs.
    design: Basic Set Rank (B29), 5/level, generic "Military Rank" naming per that trait's own convention.
  - name: Religious Rank
    per_level: 5
    levels: 6
    tags: [Advantage, Social, Imperium, Ecclesiarchy]
    ref: B29
    lore: >
      Ecclesiarchy hierarchy from parish preacher to Cardinal, or Adepta
      Sororitas rank from Sister to Canoness/Palatine; both use the same
      generic Rank trait per Basic Set's own convention of one Rank trait
      per hierarchy a character belongs to.
    design: Basic Set Rank (B29), 5/level.
  # ------------------------------------------------------------ Social standing
  - name: Status (Underhive Scum)
    points: -10
    tags: [Advantage, Social, Imperium]
    ref: B28
    lore: >
      Hab-block ganger, underhive scavenger, or unregistered menial — below
      even the baseline hive worker in the Imperium's brutal social order.
    design: Basic Set Status (B28) fixed at level -2 (5 pts/level x -2 = -10).
  - name: Status (Hab-Worker)
    points: -5
    tags: [Advantage, Social, Imperium]
    ref: B28
    lore: Registered menial or hive worker — the Imperium's baseline "someone," barely.
    design: Basic Set Status (B28) fixed at level -1.
  - name: Status (Guard Officer / Senior Adept)
    points: 10
    tags: [Advantage, Social, Imperium]
    ref: B28
    lore: A commissioned officer, senior tech-adept, or comparable — enough standing to give orders and be obeyed without question by the rank and file.
    design: Basic Set Status (B28) fixed at level 2.
  - name: Status (Planetary Noble / Cardinal)
    points: 20
    tags: [Advantage, Social, Imperium]
    ref: B28
    lore: Hive-noble house scion, planetary governor's court, or a Ministorum Cardinal — power that reaches across a world.
    design: Basic Set Status (B28) fixed at level 4.
  - name: Status (Planetary Governor)
    points: 30
    tags: [Advantage, Social, Imperium]
    ref: B28
    lore: Absolute (if Administratum-supervised) ruler of an Imperial world.
    design: Basic Set Status (B28) fixed at level 6.
  - name: Status (High Lord of Terra)
    points: 40
    tags: [Advantage, Social, Imperium]
    ref: B28
    lore: >
      One of the handful of officials who govern the Imperium in the
      Emperor's silent name from the Senatorum Imperialis — as high as
      unaugmented Imperial status goes without stepping into "beyond play"
      territory (a Primarch, a Living Saint).
    design: Basic Set Status (B28) fixed at level 8, a high but not absurd value befitting a human administrator rather than a demigod.
  - name: Social Regard (Ecclesiarchy)
    per_level: 2
    levels: 2
    tags: [Advantage, Social, Imperium, Ecclesiarchy]
    lore: >
      Being visibly favoured within Ecclesiarchy circles specifically —
      preachers and the faithful defer, but it means nothing to a Munitorum
      quartermaster or an ork.
    design: >
      Not a Basic Set trait (no certain GURPS page reference is known for
      "Social Regard" as such; some supplements use the name for a
      reaction bonus narrower than Reputation). Built here from first
      principles as a scaled-down Reputation: a flat reaction bonus valid
      with one specific group only, so it is priced below Good Reputation's
      5/level (which applies to a whole class of people who might
      recognise you on sight) — 2/level, 2 levels max, reaction_bonus
      feature scoped to the Ecclesiarchy.
    reactions: [{situation: from the Ecclesiarchy and the devout, amount: 1}]
  # ------------------------------------------------------------ Sororitas Acts of Faith
  - name: Act of Faith
    per_level: 6
    levels: 3
    tags: [Advantage, Imperium, Adepta Sororitas]
    lore: >
      A Sister of Battle's prayer answered at the worst possible moment for
      her enemies: wounds that don't drop her, a bolter that never jams
      when it matters, a miraculous shrug-off of a wound that should have
      killed her. Black Library (the Sisters of Battle novels, Dan Abnett's
      and others' Sororitas fiction) treats these as real and
      faith-triggered, not psychic — the Orders explicitly reject
      psychic power as unclean.
    design: >
      Built, not borrowed, per framework.md: based on Serendipity's shape
      (B83, "something goes providentially right when you need it") but
      priced down and given an activation cost, because the fictional
      trigger is "spend Faith in a moment of crisis," which is a real
      restriction a GM can enforce (limited uses per session/scene, GM's
      call on the specific effect) rather than Serendipity's unlimited,
      GM-adjudicated free use. 6 points/level (40% of Serendipity's 15)
      reflects that Restricted Use / limited-frequency limitation; buy
      multiple levels for a Sister who can call on this more than once a
      session. Does not touch the psyker power library — Sororitas Faith
      is explicitly not psychic power in the fiction, and this trait is
      built independently of it.
    notes: >
      Suggested use: once per session per level, the player declares an
      Act of Faith and the GM narrates a small miracle appropriate to the
      moment (see lore). Not a substitute for a psychic power; do not
      stack with psyker abilities from the psyker power library.
  # ------------------------------------------------------------ World-of-origin lenses
  - name: Hive World Origin
    container: group
    tags: [Imperium]
    lore: >
      Born and raised inside a hive's vertical city-machine: gang
      territories, recycled air, and a horizon that is always a wall.
      Calibrated against Only War's Hive World home-world package
      (bonus to Fellowship/streetwise-type skills, poor grasp of open
      terrain) and against Necromunda's depiction throughout Black
      Library.
    design: >
      A small optional container (net 0 points) rather than a full racial
      template: two Basic Set perks/quirks bought as a set, per
      framework.md's instruction to keep origin lenses lore-flavoured
      rather than mechanically heavy. Disabled by default in templates;
      the GM/player enables the one that fits.
    children:
      - name: Hive-Bred
        points: 1
        tags: [Perk, Imperium]
        lore: A lifetime spent reading crowds, gangs, and hab-block politics.
        design: Perk (B9), +1 to Streetwise.
        skill_bonuses: {Streetwise: 1}
      - name: Never Seen an Open Sky
        points: -1
        tags: [Quirk, Imperium]
        lore: Hivers are famously unsettled by true horizons and weather.
        design: Quirk (B9), roleplaying flag only, no mechanical effect.
  - name: Death World Origin
    container: group
    tags: [Imperium]
    lore: >
      Raised on a world that actively tries to kill its population — the
      Catachan/Krieg-adjacent archetype. Only War's Death World package
      (bonus to combat/survival skills, penalty to Fellowship from a
      lifetime of mistrust) is the calibration source.
    design: Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.
    children:
      - name: Death World Instincts
        points: 1
        tags: [Perk, Imperium]
        lore: A childhood spent not being eaten teaches attentiveness other worlds don't.
        design: Perk (B9), +1 to Survival.
        skill_bonuses: {Survival: 1}
      - name: Contempt for Soft Living
        points: -1
        tags: [Quirk, Imperium]
        lore: Hive worlds and their comforts look like weakness from a death world's perspective.
        design: Quirk (B9), roleplaying flag only.
  - name: Feral World Origin
    container: group
    tags: [Imperium]
    lore: >
      A pre-industrial or tribal Imperial world (the kind that furnishes
      the Imperium with superstitious but ferocious Guard regiments and
      occasional Space Marine recruits, as with Fenris or Chogoris in
      Astartes lore). Only War's Feral World package (combat/melee bonus,
      Tech-Use penalty) is the calibration source.
    design: Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.
    children:
      - name: Warrior's Upbringing
        points: 1
        tags: [Perk, Imperium]
        lore: Trained from childhood to fight with whatever the tribe carries.
        design: Perk (B9), +1 to Survival.
        skill_bonuses: {Survival: 1}
      - name: Machine-Spirits Are Sorcery
        points: -1
        tags: [Quirk, Imperium]
        lore: Reflexive unease around advanced technology, treated as witchcraft by tribal custom.
        design: Quirk (B9), roleplaying flag only.
  - name: Forge World Origin
    container: group
    tags: [Imperium, Adepta Mechanicus]
    lore: >
      Raised in a Mechanicus-dominated manufactorum world, among servitors
      and the liturgies of the Cult Mechanicus from birth, whether or not
      the character ever takes vows to the Priesthood.
    design: Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.
    children:
      - name: Forge-Born
        points: 1
        tags: [Perk, Imperium]
        lore: Grew up around machines and the rites that keep them running.
        design: Perk (B9), +1 to Mechanic (any).
        skill_bonuses: {Mechanic: 1}
      - name: Uneasy Far From the Machine-God's Halls
        points: -1
        tags: [Quirk, Imperium]
        lore: Forge-world natives find purely organic, unindustrialised places subtly wrong.
        design: Quirk (B9), roleplaying flag only.
  - name: Agri World Origin
    container: group
    tags: [Imperium]
    lore: >
      Raised on one of the vast farming worlds that feed the hives —
      wide horizons, hard physical labour, and a much smaller population
      than a hive world's.
    design: Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.
    children:
      - name: Agri-Born
        points: 1
        tags: [Perk, Imperium]
        lore: A working knowledge of land, weather, and beasts of burden.
        design: Perk (B9), +1 to Survival (Plains) or the local terrain equivalent.
        skill_bonuses: {"Survival (Plains)": 1}
      - name: City Naif
        points: -1
        tags: [Quirk, Imperium]
        lore: Hive-city customs and crowds are alien and overwhelming at first.
        design: Quirk (B9), roleplaying flag only.
  - name: Shrine World Origin
    container: group
    tags: [Imperium, Ecclesiarchy]
    lore: >
      Raised on a world that exists to host a major Imperial shrine or
      relic — a childhood steeped in pilgrimage traffic and daily liturgy.
    design: Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.
    children:
      - name: Shrine-Born
        points: 1
        tags: [Perk, Imperium]
        lore: Liturgy absorbed since infancy from the endless pilgrim traffic.
        design: Perk (B9), +1 to Theology (Imperial Creed).
        skill_bonuses: {"Theology (Imperial Creed)": 1}
      - name: Scandalised by Impiety
        points: -1
        tags: [Quirk, Imperium]
        lore: Open blasphemy or casual disregard for ritual visibly unsettles a shrine-world native.
        design: Quirk (B9), roleplaying flag only.
  - name: Void-Born Origin
    container: group
    tags: [Imperium]
    lore: >
      Born aboard a voidship, space station, or Rogue Trader vessel and
      never planetside until adulthood, if ever — a background Rogue
      Trader-line fiction and Only War's Void Born package both use, with
      the same trade-off: comfortable in zero-g and cramped spaces,
      unsettled by open planetary horizons.
    design: Net 0 points, two Basic Set perks/quirks. Disabled by default; GM/player enables it.
    children:
      - name: Void-Born
        points: 1
        tags: [Perk, Imperium]
        lore: A lifetime in zero-g and vacuum-rated corridors.
        design: Perk (B9), +1 to Free Fall.
        skill_bonuses: {Free Fall: 1}
      - name: Planetsick
        points: -1
        tags: [Quirk, Imperium]
        lore: Open sky and true gravity wells feel wrong after a life spent in the void.
        design: Quirk (B9), roleplaying flag only.
