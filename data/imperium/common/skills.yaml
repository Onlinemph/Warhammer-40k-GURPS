kind: skills
output: Imperium/Skills/Imperial Skills.skl
items:
  # ------------------------------------------------------------ Theology
  - name: Theology
    spec: Imperial Creed
    diff: IQ/H
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium]
    ref: B226
    lore: >
      The Ecclesiarchy's dogma, liturgy, saint-cults and the countless local
      rites of Imperial Cult worship, from a hab-block shrine's litanies to a
      Cardinal-Astra's sermons. Depicted throughout Black Library fiction
      (Ciaphas Cain, Gaunt's Ghosts, the Eisenhorn/Ravenor books) as the
      working theology every Imperial citizen absorbs in some form.
    design: Basic Set Theology (B226), specialised as it already allows.
  - name: Theology
    spec: Cult Mechanicus
    diff: IQ/H
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium, Adeptus Mechanicus]
    ref: B226
    lore: >
      The Cult of the Machine God: the Motive Force catechisms, the binary
      liturgies, the theology that says a machine's spirit must be placated,
      not merely fixed. Framework note: this is the Mechanicus's *faith*,
      distinct from the technical skill of maintaining machines (Engineer /
      Mechanic / Armoury), matching how Black Library depicts Tech-Priests
      as both engineers and priests of a religion.
    design: Basic Set Theology (B226) as a separate specialisation from Theology (Imperial Creed); the two cults' dogmas do not cross-default.
  # ------------------------------------------------------------ Hidden Lore
  - name: Hidden Lore
    spec: Daemons
    diff: IQ/A
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium]
    ref: B199
    lore: >
      What the Inquisition and the more paranoid chaplains know of daemonic
      nature, names, and countermeasures: pict-evidence, interrogation
      transcripts and forbidden grimoires rather than fieldcraft. Widely
      depicted as dangerous knowledge in the Eisenhorn/Ravenor and Gaunt's
      Ghosts novels; Dark Heresy/Only War use an equivalent Forbidden Lore
      (Daemonology) skill for calibration.
    design: Basic Set Hidden Lore (B199), specialisation per framework.md.
  - name: Hidden Lore
    spec: Xenos
    diff: IQ/A
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium]
    ref: B199
    lore: >
      Cross-referenced xenology from an Inquisitorial or Departmento
      Munitorum angle: what a given alien species is, not how to fight it
      (that's Expert Skill (Xenology) or Tactics). Covers everything from
      ork biology to eldar craftworld politics as known to Imperial
      intelligence, which is often wrong or incomplete by design.
    design: Basic Set Hidden Lore (B199).
  - name: Hidden Lore
    spec: Heresy
    diff: IQ/A
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium]
    ref: B199
    lore: >
      Recognising the signs of Chaos corruption, forbidden cults, and
      heretical doctrine before it is too late — or, for an Inquisitor,
      knowing enough heresy to hunt it. Central to Eisenhorn and the
      Ravenor trilogy.
    design: Basic Set Hidden Lore (B199).
  - name: Hidden Lore
    spec: The Warp
    diff: IQ/A
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium]
    ref: B199
    lore: >
      Scholarly (not psychic) knowledge of the Immaterium: what the
      Astronomican is, why Navigators need a Geller field, what a warp
      storm does to a fleet. This is book-learning available to non-psykers;
      actual perception of the warp is Psyniscience or a psychic power.
    design: Basic Set Hidden Lore (B199).
  - name: Hidden Lore
    spec: Inquisition
    diff: IQ/A
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium, Inquisition]
    ref: B199
    lore: >
      What is known, or safely rumoured, about the Inquisition itself: its
      ordos, its methods, which rosettes mean what. Most citizens who have
      this at all have it because they survived an interrogation.
    design: Basic Set Hidden Lore (B199).
  - name: Hidden Lore
    spec: Adeptus Astartes
    diff: IQ/A
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium]
    ref: B199
    lore: >
      Chapter markings, organisation, and the fragments of Chapter lore that
      leak to outsiders (a Guardsman recognising a Chapter's colours, an
      Inquisitor's grasp of Chapter politics). Full gene-seed and Chapter
      cult secrets go well beyond this skill.
    design: Basic Set Hidden Lore (B199).
  - name: Hidden Lore
    spec: Archeotech
    diff: IQ/A
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium, Adeptus Mechanicus]
    ref: B199
    lore: >
      Recognising and cataloguing STC fragments and Dark Age relics without
      necessarily being able to use or repair them (that's Engineer/TL12^).
      A staple of rogue trader and explorator fiction, and of Only War's
      Forbidden Lore (Archeotech) for calibration.
    design: Basic Set Hidden Lore (B199).
  # ------------------------------------------------------------ Area/Current Affairs
  - name: Area Knowledge
    spec: Segmentum Obscurus
    diff: IQ/E
    defaults: ["IQ-4"]
    tags: [Mental, Knowledge, Imperium]
    ref: B176
    lore: >
      One of the Imperium's five segmenta; used generically for any of them
      (Solar, Obscurus, Pacificus, Tempestus, Ultima) or for a specific
      sub-sector, hive, or home world when that is more relevant to a
      character's background.
    design: Basic Set Area Knowledge (B176); pick the specialisation the character actually knows.
  - name: Area Knowledge
    spec: Segmentum Solar
    diff: IQ/E
    defaults: ["IQ-4"]
    tags: [Mental, Knowledge, Imperium]
    ref: B176
    lore: The Throneworld's own segmentum; Terra, Mars, and the Imperium's administrative core.
    design: Basic Set Area Knowledge (B176).
  - name: Current Affairs
    spec: Imperium
    diff: IQ/E
    defaults: ["IQ-4"]
    tags: [Mental, Knowledge, Imperium]
    ref: B186
    lore: >
      What passes for Imperium-wide news: Munitorum bulletins, Ecclesiarchy
      pronouncements, and whatever rumours of war and heresy filter down
      through a thousand relay stations, usually months stale and already
      propaganda by the time they arrive.
    design: Basic Set Current Affairs (B186).
  # ------------------------------------------------------------ Law / Navigation
  - name: Law
    spec: Imperial
    diff: IQ/H
    defaults: ["IQ-6"]
    tags: [Mental, Knowledge, Imperium]
    ref: B204
    lore: >
      The Lex Imperialis and its planetary variations as enforced by the
      Adeptus Arbites: due process is whatever an Arbitrator, Inquisitor, or
      Commissar with the authority to act says it is.
    design: Basic Set Law (B204).
  - name: Navigation
    spec: Warp
    diff: IQ/A
    tags: [Mental, Knowledge, Imperium, Restricted]
    ref: B211
    lore: >
      Charting a course through the Immaterium by the light of the
      Astronomican, correcting for warp storms and translation drift. In
      practice this is inseparable from the Navigator Houses' mutant
      third eye; without it the skill cannot be used at all (see
      framework.md, "Skills"). A ship's Navigator plots by this skill;
      the Warp-jump itself is the Navigator's psychic gift, not the roll.
    design: >
      Basic Set Navigation (Hyperspace) (B211) renamed per framework.md.
      No default given: unlike terrestrial navigation, nothing else
      sensibly defaults into it, and GMs should restrict purchase to
      characters with the Navigator racial trait (handled elsewhere).
  # ------------------------------------------------------------ Savoir-Faire
  - name: Savoir-Faire
    spec: Military
    diff: IQ/E
    defaults: ["IQ-4"]
    tags: [Mental, Imperium]
    ref: B218
    lore: Knowing how to behave, address superiors, and not get shot for insubordination in an Imperial military hierarchy.
    design: Basic Set Savoir-Faire (B218).
  - name: Savoir-Faire
    spec: High Society
    diff: IQ/E
    defaults: ["IQ-4"]
    tags: [Mental, Imperium]
    ref: B218
    lore: Hive noble and rogue trader dynasty etiquette; who outranks whom, and which insults are duel-worthy.
    design: Basic Set Savoir-Faire (B218).
  - name: Savoir-Faire
    spec: Ecclesiarchy
    diff: IQ/E
    defaults: ["IQ-4"]
    tags: [Mental, Imperium]
    lore: >
      Ecclesiarchy protocol: forms of address for Cardinals, Confessors and
      Canonesses, precedence between Orders of the Adepta Sororitas, and
      the rites of a shrine world's court. Not attested in fiction as a
      named "skill", but the Ecclesiarchy is repeatedly shown (Sisters of
      Battle novels, Black Library's Sabbat Worlds material) to have as
      rigid a court culture as any noble house or general staff.
    design: >
      New specialisation of Basic Set Savoir-Faire (B218), by direct
      analogy with the existing Military and High Society specialisations
      — same skill, same difficulty, applied to a third hierarchy the game
      needs and the catalogue doesn't name.
  # ------------------------------------------------------------ Expert Skill / Heraldry
  - name: Expert Skill
    spec: Xenology
    diff: IQ/H
    tags: [Mental, Knowledge, Imperium]
    ref: B193
    lore: >
      The rigorous, empirical study of xenos biology, technology and
      society — Explorator and Ordo Xenos work, not folk rumour (that's
      Hidden Lore (Xenos)). No default, as Basic Set's Expert Skill never
      has one: this is specialist training only.
    design: Basic Set Expert Skill (B193).
  - name: Heraldry
    spec: Adeptus Astartes
    diff: IQ/A
    defaults: ["IQ-5", "Savoir-Faire (Military)-3"]
    tags: [Mental, Imperium]
    ref: B199
    lore: Chapter badges, squad markings, and honours worn on power armour; a skill Guard liaison officers and Inquisitors alike need to not give offence.
    design: Basic Set Heraldry (B199); Savoir-Faire (Military) default in place of the Basic Set's High Society default, matching how this heraldry is actually learned.
  - name: Heraldry
    spec: Regimental
    diff: IQ/A
    defaults: ["IQ-5", "Savoir-Faire (Military)-3"]
    tags: [Mental, Imperium, Astra Militarum]
    ref: B199
    lore: >
      Astra Militarum regimental colours, honorifics and campaign
      battle-honours — a Cadian's shoulder flash, a Krieg death mask, a
      Catachan's tattoos, all legible to someone who knows what they're
      looking at.
    design: Basic Set Heraldry (B199).
  # ------------------------------------------------------------ Psyniscience (new)
  - name: Psyniscience
    diff: Per/H
    tags: [Mental, Imperium, Psionic]
    lore: >
      The trained (or instinctive) sense of "something wrong" in a
      presence, place, or object touched by the warp — a chill in a
      corridor, a servitor's dead eyes going wrong. Named for the Dark
      Heresy/Only War skill of the same purpose (Psyniscience), used here
      for calibration only; the GURPS build is original.
    design: >
      New skill per framework.md ("New skills only when nothing fits").
      Per/H, Talent-affected: characters with a Psyker Talent (see the
      psyker power library — not part of this file) get it at a discount
      per that trait's rules and may default it from Per at a penalty;
      an unaugmented human without any psychic Talent cannot default into
      it at all (there is nothing latent to sense with) and must buy it
      as an unusual background purchase, if a GM allows it at all — most
      unaugmented Imperial citizens simply never take this skill.
  # ------------------------------------------------------------ Scholarship
  - name: Research
    diff: IQ/A
    defaults: ["IQ-5"]
    tags: [Mental, Imperium]
    ref: B217
    lore: >
      Digging through cogitator archives, dusty manuscript-cells and
      Administratum record-stacks — the Inquisitorial acolyte's and
      Mechanicus adept's basic scholarship skill, unglamorous and constant.
    design: Basic Set Research (B217), used as-is; no Imperial-specific rules needed.
  - name: Cryptography
    spec: Inquisitorial Ciphers
    diff: IQ/H
    tags: [Mental, Imperium, Inquisition]
    ref: B186
    lore: >
      Breaking (or setting) the rotating cant-ciphers Inquisitorial cells
      use to keep acolyte reports and warrant chains secret from each other
      as much as from heretics — Inquisitors are famously as suspicious of
      their own kind as of their prey (Eisenhorn, Ravenor).
    design: >
      Basic Set Cryptography (B186), specialised; defaults from Mathematics
      (Cryptology) as normal, so no explicit default is listed here (it
      depends on whether the character has that skill at all).
  - name: Forced Entry
    diff: DX/E
    tags: [Physical, Imperium]
    ref: B196
    lore: >
      Breaking down a heretic's door, a xenos hab-block hatch, or a
      barricaded cell — standard fieldcraft for Arbites, Militarum Tempestus
      breach teams and Inquisitorial storm squads alike.
    design: Basic Set Forced Entry (B196), no default per the Basic Set entry.
