kind: equipment
output: Imperium/Gear/Imperial Field Gear.eqp
items:
  - name: Rebreather
    tl: 8
    lc: 3
    cost: 60
    weight: 1
    tags: [Gear, Imperium, Astra Militarum]
    notes: A light filter mask covering nose and mouth; grants a bonus to HT rolls to resist inhaled toxins, smoke and dust, but is not a full atmospheric seal.
    lore: >-
      Basic breathing protection issued wherever the Munitorum expects toxic atmospheres, ash
      storms or gas warfare short of a full hazmat environment — seen throughout Astra Militarum
      background art and Black Library fiction set on hive or forge worlds.
    design: >-
      No armour/damage anchor applies; built as a simple GURPS filter mask (a HT-roll bonus vs.
      inhaled hazards) at a TL appropriate to "stub tech"-era mass production, since a rebreather is
      mechanically simple and produced across the Imperium regardless of a world's exact tech base.

  - name: Respirator
    tl: 10
    lc: 3
    cost: 220
    weight: 3
    tags: [Gear, Imperium, Astra Militarum]
    notes: >-
      A full sealed mask with filter canisters, worn as a hood or integrated into a helmet;
      grants full protection from inhaled toxins and gas (not just a resistance bonus) while
      canisters last, and is the standard companion piece to the Death Korps Flak Coat.
    lore: >-
      Full-face gas-sealed respirators, most iconically the Death Korps of Krieg's ubiquitous
      gas-hoods, are depicted in Forge World's Imperial Armour background and Krieg-focused Black
      Library fiction as standard kit for regiments that expect chemical, biological or simply
      toxic battlefield conditions as a matter of course.
    design: >-
      Sits a clear step above the Rebreather: full immunity rather than a resistance bonus, priced
      and weighted higher to reflect the canister filtration system, at the same "standard Imperial
      manufacture" TL as flak and carapace per framework.md's TL table.

  - name: Photo-Visor / Photo-Contacts
    tl: 10
    lc: 3
    cost: 150
    weight: 1
    tags: [Gear, Imperium, Astra Militarum]
    notes: >-
      Low-light image intensification, worn as a visor/goggle unit or, in the surgically-fitted
      "photo-contacts" variant, as lenses with no external bulk (same effect, -1 Holdout only for
      the visor version, none for contacts). Treat as granting Night Vision for game purposes while
      worn/active; does not help in absolute darkness.
    lore: >-
      Photo-visors (and their subtler photo-contact lens equivalent) are common-issue night-fighting
      gear across Astra Militarum and Inquisitorial-agent background, letting the wearer fight
      effectively in low light without a powered searchlight giving away their position.
    design: >-
      No anchor; modelled narratively as the GURPS Night Vision effect (Basic Set) for the GM to
      apply, since equipment-level features in this schema don't have a direct "grant an
      advantage" hook. Priced as inexpensive, widely issued optics rather than a rare relic.

  - name: Magnoculars
    tl: 10
    lc: 3
    cost: 300
    weight: 2
    tags: [Gear, Imperium, Astra Militarum]
    notes: Long-range magnifying optics with image stabilisation and, on most patterns, a basic infrared overlay for spotting heat sources at range.
    lore: >-
      Standard-issue field optics for officers, snipers and scouts across Astra Militarum
      background, functionally binoculars with a targeting and threat-marking overlay fed to a
      user's other gear (vox, auspex) where available.
    design: >-
      No anchor; treated as GURPS binoculars (Basic Set) with an infrared spotting note added for
      setting flavour, at Imperial-standard TL10 manufacture.

  - name: Auspex
    tl: 10
    lc: 2
    cost: 900
    weight: 4
    tags: [Gear, Imperium, Astra Militarum]
    skill_bonuses: {Search: 3}
    notes: Handheld multi-sensor unit reading motion, heat, atmosphere and (on some patterns) psychic disturbance; the bonus above applies specifically to actively scanning an area, not passive Perception.
    lore: >-
      The auspex is the Imperium's ubiquitous field scanner, seen in nearly every piece of
      Inquisitorial, Astra Militarum and Adeptus Mechanicus fiction and background as the standard
      tool for detecting hidden enemies, structural hazards, or (in Inquisitorial hands) warp
      taint.
    design: >-
      No damage/armour anchor applies; modelled as a flat Search skill bonus (Basic Set's
      "instruments help" convention) rather than lifted from any Ultra-Tech scanner entry, priced
      as valuable, restricted military-grade kit (LC2) consistent with its usefulness and relative
      scarcity outside the Guard and Inquisition.

  - name: Vox-Caster
    tl: 10
    lc: 3
    cost: 400
    weight: 12
    tags: [Gear, Imperium, Astra Militarum]
    notes: Backpack-mounted long-range radio, typically crewed by a dedicated vox-operator; range measured in miles rather than the short range of a micro-bead.
    lore: >-
      The vox-caster is the standard heavy communications set of Astra Militarum platoons and
      companies, a recurring detail in Guard-focused Black Library fiction (a vox-operator is a
      near-universal squad role) and Codex Astra Militarum background.
    design: >-
      No anchor; built as a straightforward GURPS long-range radio (Basic Set), weighted and priced
      to reflect a dedicated backpack set rather than a personal comm-bead.

  - name: Micro-bead
    tl: 10
    lc: 3
    cost: 80
    weight: 0.25
    tags: [Gear, Imperium, Astra Militarum]
    notes: Short-range personal earpiece/throat-mic comm unit for squad-level chatter; does not reach vox-caster range.
    lore: >-
      The micro-bead is standard personal-issue comms for individual Guardsmen and many other
      Imperial servants, referenced constantly in Black Library fiction as the earpiece through
      which squad orders and chatter travel.
    design: >-
      Short-range GURPS radio (Basic Set) at minimal weight and cost, deliberately much cheaper and
      shorter-ranged than the Vox-Caster to reflect the personal-vs-squad-support distinction the
      lore consistently draws between the two.

  - name: Preysense Goggles
    tl: 10
    lc: 3
    cost: 350
    weight: 2
    tags: [Gear, Imperium, Astra Militarum]
    notes: Combined thermal/motion overlay goggles, worn under a gas-hood visor; grants the same narrative Night Vision benefit as a photo-visor, plus motion-detection against concealed or camouflaged targets at the GM's discretion.
    lore: >-
      Preysense goggles are a signature piece of Death Korps of Krieg kit in Forge World's Imperial
      Armour background, combining thermal imaging with motion sensing to let Krieg troopers fight
      effectively through the toxic smoke and fog typical of their siege warfare.
    design: >-
      Built as an upgraded Photo-Visor (adds motion detection on top of low-light vision) rather
      than copied from any catalogue scanner; priced and weighted similarly to the Photo-Visor with
      a modest premium for the added sensor mode.

  - name: Grapnel Launcher
    tl: 10
    lc: 3
    cost: 250
    weight: 5
    tags: [Gear, Imperium, Astra Militarum]
    notes: Compressed-gas or micro-charge grapnel and line, used for scaling walls, boarding actions and rapid descent; treat as a GURPS grapnel-gun/pneumatic harpoon under Climbing rules.
    lore: >-
      Grapnel lines and launchers appear throughout Imperial special-operations depictions — Scions
      and other elite Guard, Sisters of Battle strike teams and Inquisitorial agents alike are shown
      using them for boarding actions and rapid vertical assault.
    design: >-
      No anchor; modelled as a standard GURPS grapnel tool (Basic Set climbing gear) rather than any
      catalogue "descent device," priced and weighted for a compact personal-issue unit.

  - name: Jump Pack (Astartes)
    tl: 11
    lc: 0
    cost: 45000
    weight: 60
    tags: [Gear, Imperium, Adeptus Astartes]
    notes: >-
      Rocket-propelled flight/leap pack used for short powered jumps and controlled descents in
      combat (the tabletop "Assault"/deep-strike leap); treat mechanically as a short-burst Flight
      capability the GM adjudicates per scene rather than sustained flight, with a real risk of
      burn damage to anyone caught in the exhaust wash on landing. Sized and rigged for the
      Astartes frame and its power-armour interface; an unaugmented human cannot use one safely.
    lore: >-
      Jump packs equip Assault Marines and Vanguard veterans across Codex Space Marines background
      and Black Library fiction, covering the ground between a standard Astartes's leap and true
      flight in short, thunderous bursts, at the cost of a very conspicuous, fuel-limited profile.
    design: >-
      No damage/armour anchor applies; the jump pack is deliberately left as a narrative/maneuver
      capability (short powered leaps, GM-adjudicated) rather than an automated GCS Flight bonus,
      since GURPS models tactical jump-pack flight as a maneuver, not a passive trait, and this
      schema has no clean equipment-level hook for that. Weight and cost scaled to sit well above
      mundane Guard equipment, in line with other Astartes-exclusive wargear in this file.

  - name: Grav-chute
    tl: 10
    lc: 2
    cost: 500
    weight: 8
    tags: [Gear, Imperium, Astra Militarum]
    notes: Anti-grav-assisted parachute harness used for high-altitude insertion; converts what would otherwise be a lethal fall into a controlled descent.
    lore: >-
      Grav-chutes equip Guard airborne/drop formations (Elysian and similar regiments in Codex and
      Black Library background) for high-altitude, low-opening insertions from Valkyrie and
      Aquila lander drops.
    design: >-
      No anchor; modelled as a GURPS parachute/descent device (Basic Set) with a "grav-assisted"
      label for setting flavour, priced and weighted as specialist rather than universal Guard
      kit, hence the more restrictive LC2.

  - name: Medi-kit
    tl: 10
    lc: 3
    cost: 180
    weight: 4
    tags: [Gear, Imperium, Astra Militarum]
    skill_bonuses: {First Aid: 2}
    notes: Standard combat first-aid kit; the bonus above applies to First Aid rolls made using it, per its contents (counter-septic, sealant foam, stimm shots, basic surgical tools).
    lore: >-
      Combat medi-kits are standard issue to Guard medicae and squad "doc" characters throughout
      Astra Militarum background and fiction, from field dressings to combat stimms.
    design: >-
      Direct translation of GURPS's standard first-aid kit bonus (Basic Set) rather than a
      Chirurgeon's full surgery kit, since this is field-carried personal gear rather than a
      hospital set.

  - name: Guardsman's Kit
    tl: 10
    lc: 4
    cost: 60
    weight: 20
    tags: [Gear, Imperium, Astra Militarum]
    notes: The standard web-gear/pack loadout carried by an Astra Militarum trooper on campaign.
    lore: >-
      The contents below are drawn from how Guard kit is consistently depicted across Black
      Library fiction (the Gaunt's Ghosts and Ciaphas Cain series in particular) and Astra
      Militarum background: unglamorous, faith-adjacent, and built around long marches and worse
      rations.
    design: A container grouping the small items below into one carried loadout, rather than tracking each separately; total weight/cost is the sum of the parts.
    children:
      - name: Uplifting Primer
        weight: 1
        cost: 5
        notes: The Munitorum-issue catechism and basic-literacy primer given to every Guardsman; also a minor icon of faith.
        lore: A recurring, near-universal detail of Guard life in Black Library fiction — often quoted, occasionally mocked by veterans, carried by nearly everyone regardless.
        design: Flavour item; no mechanical effect.
      - name: Lho-sticks (pack)
        weight: 0.25
        cost: 10
        notes: A pack of rolled lho-leaf cigarettes, the Guard's ubiquitous off-duty vice.
        lore: Referenced constantly in Guard-focused fiction as shared currency, a nerve-settler before battle, and a habit officers alternately tolerate and ban.
        design: Flavour item; no mechanical effect.
      - name: Ration Packs (week's supply)
        weight: 10
        cost: 15
        notes: Preserved, nutritionally complete but famously unpleasant field rations.
        lore: A running joke and occasional plot point across Guard fiction, where rations are barely tolerable and traded for anything better.
        design: Standard GURPS travel rations (Basic Set) by another name, priced accordingly.
      - name: Bedroll
        weight: 4
        cost: 15
        notes: Standard-issue sleeping roll.
        lore: Unremarkable but universal Guard kit.
        design: Flavour item; no mechanical effect.
      - name: Mess Kit & Canteen
        weight: 2
        cost: 10
        notes: Collapsible mess tin, utensils and a water canteen.
        lore: Standard Guard kit, occasionally a plot detail when water runs short.
        design: Flavour item; no mechanical effect.
      - name: Entrenching Tool
        weight: 2.5
        cost: 10
        notes: Folding spade for digging in; usable in a pinch as an improvised weapon (treat as a small axe/shovel, sw-1 cut or thr cr).
        lore: A staple of trench-warfare-flavoured Guard depictions.
        design: Standard GURPS entrenching tool (Basic Set); the improvised-weapon note is a reasoned estimate, not a formal weapon anchor.
      - name: Aquila Icon
        weight: 0.25
        cost: 5
        notes: A small icon of the Imperial faith worn or carried by most Guardsmen.
        lore: Nearly universal across Imperial citizenry, referenced throughout Black Library fiction regardless of a character's actual devoutness.
        design: Flavour item; no mechanical effect.

  - name: Chrono
    tl: 8
    lc: 4
    cost: 40
    weight: 0.25
    tags: [Gear, Imperium, Imperium]
    notes: A rugged wrist or pocket chronometer.
    lore: Unremarkable but near-universal personal timekeeping across the Imperium, mentioned in passing across Black Library fiction rather than dwelt on.
    design: No anchor; a plain GURPS wristwatch (Basic Set) equivalent, at a low TL since timekeeping is mechanically trivial regardless of setting.

  - name: Glow-globe / Stablight
    tl: 8
    lc: 4
    cost: 25
    weight: 1
    tags: [Gear, Imperium, Imperium]
    notes: Handheld or hung electric light; the glow-globe is a softer, room-lighting sphere, the stablight a focused beam torch.
    lore: Standard Imperial lighting, mentioned throughout Black Library fiction wherever characters move through unlit corridors, hab-blocks or underhive tunnels.
    design: No anchor; a plain GURPS flashlight/lantern (Basic Set) under Imperial naming, at a low TL since it's mechanically simple household/field tech.

  - name: Cameleoline Cloak
    tl: 8
    lc: 2
    cost: 600
    weight: 3
    tags: [Gear, Imperium, Astra Militarum]
    skill_bonuses: {Stealth: 2, Camouflage: 3}
    notes: A light-bending, pattern-disrupting cloak fabric; the bonuses above apply while the cloak is worn and the wearer is stationary or moving slowly enough to keep it effective (GM's call on faster movement).
    lore: >-
      Cameleoline cloaks are the signature camouflage gear of Imperial snipers and scout troops
      (Catachan and Tanith patterns both appear in Black Library fiction, most notably the Tanith
      First-and-Only's scouts in the Gaunt's Ghosts series) — a fabric that bends light and breaks
      up a wearer's outline rather than simple colour-matched cloth.
    design: >-
      No anchor; modelled as flat Stealth/Camouflage skill bonuses (a common GURPS convention for
      camouflage gear in Basic Set/Ultra-Tech-style items, applied here as an independently-reasoned
      value rather than copied from a specific catalogue entry) with no DR, since the cloak's whole
      function is concealment rather than protection. Restricted to LC2 to reflect its status as
      specialist rather than universal-issue kit.
