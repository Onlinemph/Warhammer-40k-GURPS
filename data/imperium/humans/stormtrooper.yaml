kind: template
output: Imperium/Templates/Militarum Tempestus Scion.gct
notes: >
  A Militarum Tempestus Scion: Schola Progenium-raised, hot-shot lasgun
  ("hellgun") armed, an elite special-operations trooper rather than a
  line Guardsman. Point math: ST 12 (+20), DX 14 (+80), IQ 11 (+20), HT 13
  (+30) = 150; advantages +40; disadvantages -55; skills +71. Total 206
  points, inside framework.md's "Elite human (200-350)" tier, toward its
  lower end (a veteran Inquisitorial acolyte or Battle Sister should sit
  higher). No psychic abilities here; add from the separate psyker power
  library if a GM wants a Scion with sanctioned psyker support attached.
traits:
  - name: ST
    points: 20
    tags: [Attribute]
    lore: Schola Progenium physical conditioning is harder than ordinary Guard basic training.
    design: ST 12 (+2 from baseline), 10 pts/level (B15).
  - name: DX
    points: 80
    tags: [Attribute]
    lore: >
      Scions are drilled from childhood in the Schola Progenium
      specifically for weapons proficiency and small-unit special
      operations; Only War and Dark Heresy both model Tempestus Scions
      with noticeably better combat stats than a line Guardsman, used here
      for relative calibration.
    design: DX 14 (+4 from baseline), 20 pts/level (B15).
  - name: IQ
    points: 20
    tags: [Attribute]
    lore: Schola Progenium education is broader and more rigorous than Guard basic training's rote drilling.
    design: IQ 11 (+1 from baseline), 20 pts/level (B15).
  - name: HT
    points: 30
    tags: [Attribute]
    lore: Selected and conditioned for endurance under Schola Progenium's harsher regimen.
    design: HT 13 (+3 from baseline), 10 pts/level (B14).
  - name: Combat Reflexes
    points: 15
    ref: B43
    tags: [Advantage, Mental, Imperium]
    lore: Special-operations conditioning against freezing under fire.
    design: Basic Set Combat Reflexes (B43), 15 points.
  - name: Very Fit
    points: 15
    ref: B55
    tags: [Advantage, Physical, Imperium]
    lore: Schola Progenium physical training exceeds ordinary Guard fitness standards.
    design: Basic Set Very Fit (B55), 15 points.
  - name: High Pain Threshold
    points: 10
    ref: B59
    tags: [Advantage, Physical, Imperium]
    lore: Conditioning and selection produce troopers who keep fighting through wounds that would drop a conscript.
    design: Basic Set High Pain Threshold (B59), 10 points.
  - include: "imperium/common/imperial-traits.yaml#Fanaticism (The God-Emperor)"
    lore: Schola Progenium indoctrination is, if anything, more thorough than a regular Guard upbringing.
  - include: "imperium/common/imperial-traits.yaml#Duty (Astra Militarum)"
    lore: Militarum Tempestus is an Astra Militarum special-operations arm; the same near-absolute service obligation applies.
  - include: "imperium/common/imperial-traits.yaml#Sense of Duty (Squadmates)"
    lore: Scion kill-teams are small and tight-knit; Schola Progenium "siblings" bonds are a recurring Black Library and Only War beat.
  - include: "imperium/common/imperial-traits.yaml#Intolerance (Xenos)"
  - include: "imperium/common/imperial-traits.yaml#Intolerance (Heretics)"
    lore: Schola-raised Scions are frequently used against internal Imperial threats (rogue PDF, cultists), and are indoctrinated accordingly.
  - include: "imperium/common/imperial-traits.yaml#Overconfidence"
    lore: >
      Scions are the Guard's acknowledged elite and are written (Only War's
      Tempestus material, and their portrayal as an intervention force
      called in when line infantry fails) as knowing it.
