    design: IQ+2 (17) for 8 points, Average.
  - name: Law
    spec: Imperial
    diff: IQ/H
    points: 12
    tags: [Imperium]
    lore: An Inquisitor bends the Lex Imperialis deliberately and needs to know exactly how far.
    design: IQ+2 (17) for 12 points, Hard.
  - name: Cryptography
    spec: Inquisitorial Ciphers
    diff: IQ/H
    points: 8
    tags: [Imperium, Inquisition]
    lore: See Imperium/Skills/Imperial Skills.skl.
    design: IQ+1 (16) for 8 points, Hard.
  - name: Disguise
    diff: IQ/A
    points: 8
    tags: [Imperium]
    lore: Undercover identity work, still occasionally necessary even with a rosette in hand.
    design: IQ+2 (17) for 8 points, Average.
  - name: Shadowing
    diff: IQ/A
    points: 4
    tags: [Imperium]
