kind: template
output: Imperium/Templates/Inquisitor.gct
notes: >
  A working field Inquisitor — Eisenhorn or Ravenor in their prime, not a
  centuries-old Lord Inquisitor running whole sub-sectors (that belongs in
  framework.md's "Heroes and legends" tier, well above this template).
  Point math: ST 11 (+10), DX 14 (+80), IQ 15 (+100), HT 12 (+20) = 210,
  plus Will +2 (+10) = 220; advantages +40; disadvantages -37; skills
  +251. Total 474 points. Framework.md's tier table has a gap between
  "Elite human (200-350)" and "Heroes and legends (1,000-3,000)" with
  nothing named in between; a veteran field Inquisitor genuinely belongs
  in that gap — clearly beyond an elite specialist, well short of a
  living legend — so this template deliberately sits there rather than
  being forced into either tier. Flagged in this project's report as a
  possible anchor gap worth a deliberate decision (see framework.md,
  "Changing an anchor") if more Inquisition-tier templates are built.

  Puritan vs. Radical: this template is written Puritan-neutral. A
  strict Puritan build should add Intolerance (Xenos) (-10, Imperium/
  Traits/Imperial Traits.adq) and lean on the Ordo Hereticus/Malleus
  lenses; a Radical build (xenotech users, daemonhosts, etc.) should
  drop or reinterpret Intolerance (Heretics) and is otherwise unrestricted
  by this template — Radicalism is a stance on methods and sanctioned
  lore, not a separate stat block, per how Eisenhorn's own arc treats it.

  No psychic abilities here; many Inquisitors are sanctioned psykers, but
  that is a separate purchase from the psyker power library, not part of
  this baseline.

  Enable at most one Ordo lens (all disabled by default); an Inquisitor
  belongs to exactly one Ordo. They are small flavor packages, not full
  specialisations — a real Ordo Malleus Inquisitor's daemon-hunting
  expertise should mostly show up as bought-up Hidden Lore (Daemons) and
  Hidden Lore (The Warp) levels, not a lens.
traits:
  - name: ST
    points: 10
    tags: [Attribute]
    lore: Inquisitors survive long enough to reach this rank partly through personal fitness.
    design: ST 11 (+1), 10 pts/level (B15).
  - name: DX
    points: 80
    tags: [Attribute]
    lore: A veteran of countless personal confrontations, armed and otherwise.
    design: DX 14 (+4), 20 pts/level (B15).
  - name: IQ
    points: 100
    tags: [Attribute]
    lore: >
      Eisenhorn and Ravenor are both written as formidably intelligent,
      solving cases that defeat entire Arbites precincts and Ordo cells.
    design: IQ 15 (+5), 20 pts/level (B15).
  - name: HT
    points: 20
    tags: [Attribute]
    lore: Decades of fieldwork, often ending in violence, demand real endurance.
    design: HT 12 (+2), 10 pts/level (B14).
  - name: Will
    points: 10
    tags: [Attribute]
    lore: An Inquisitor's will has to outlast interrogation, daemonic influence, and their own doubts.
    design: Will 17 (+2 above the IQ-derived default of 15), 5 pts/level (B16).
  - name: Fit
    points: 5
    ref: B55
    tags: [Advantage, Physical, Imperium]
    lore: Kept sharp by a career that regularly turns violent.
    design: Basic Set Fit (B55), 5 points.
  - name: Combat Reflexes
    points: 15
    ref: B43
    tags: [Advantage, Mental, Imperium]
    lore: A survivor of more ambushes and firefights than almost anyone outside the Astartes.
    design: Basic Set Combat Reflexes (B43), 15 points.
  - name: Legal Enforcement Powers (Inquisitorial Rosette)
    points: 20
    ref: B65
    tags: [Advantage, Social, Imperium, Inquisition]
    lore: See Imperium/Traits/Imperial Traits.adq for full sourcing and the honest note on where this undersells the fiction.
    design: Basic Set Legal Enforcement Powers (B65), 4 levels (the trait's maximum), 20 points.
  - name: Sense of Duty (The Imperium)
    points: -10
    ref: B153
    tags: [Disadvantage, Mental, Imperium]
    lore: >
      Unlike an acolyte's enforced Duty, an Inquisitor answers mostly to
      their own conscience and their Ordo's mandate — but that mandate
      ("protect humanity, whatever it costs") is still a real, large-scope
      obligation, per how both Eisenhorn and Ravenor are written as unable
      to simply walk away from a case.
    design: Basic Set Sense of Duty (B153), very large scope (humanity/the Imperium), -10.
  - name: Fanaticism (The God-Emperor)
    points: -15
    ref: B136
    tags: [Disadvantage, Mental, Imperium]
    lore: >
      The default assumption for a loyalist Inquisitor. A Radical build
      that has drifted from orthodox faith (rare, but present in the
      fiction) may drop this with GM agreement — see the Puritan/Radical
      note above.
    design: Basic Set Fanaticism (B136), -15.
  - name: Intolerance (Heretics)
    points: -5
    ref: B140
    tags: [Disadvantage, Mental, Imperium]
    lore: Even a Radical Inquisitor is still, definitionally, opposed to Chaos.
    design: Basic Set Intolerance (B140), narrow-category, -5.
  - name: Callous
    points: -5
    ref: B125
    tags: [Disadvantage, Mental, Imperium]
    lore: >
      "The Emperor Protects" is frequently shown, in Eisenhorn especially,
      to mean acolytes, bystanders, and whole populations are expendable
      against the mission.
    design: Basic Set Callous (B125), -5.
  - name: Trusts No One Completely, Including Their Own Retinue
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: A recurring Eisenhorn/Ravenor beat — even loyal acolytes get investigated eventually.
  - name: Carries the Weight of Every Call Made Alone
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: Inquisitorial authority is effectively unchecked in the field, which both novels treat as a burden as much as a privilege.
  # ------------------------------------------------ Ordo lenses (flavor only, disabled by default)
  - name: "Ordo: Hereticus"
    container: group
    disabled: true
    tags: [Imperium, Inquisition]
    lore: The Ordo Hereticus roots out heresy, corruption, and unsanctioned faith within the Imperium's own population and institutions.
    design: Net 0 points, per-Ordo flavor lens (see framework.md, origin lenses).
    children:
      - name: Witch Hunter's Eye
        points: 1
        tags: [Perk, Imperium]
        design: Perk (B9), +1 to Hidden Lore (Heresy).
        lore: A career built around finding heresy before it spreads.
        skill_bonuses: {"Hidden Lore (Heresy)": 1}
      - name: Sees Taint Everywhere
        points: -1
        tags: [Quirk, Imperium]
        design: Quirk (B9), roleplaying flag only.
        lore: Hereticus Inquisitors are written as suspicious of even their own allies' loyalty.
  - name: "Ordo: Malleus"
    container: group
    disabled: true
    tags: [Imperium, Inquisition]
    lore: The Ordo Malleus hunts daemonic incursion and Chaos worship at its most dangerous, and trains extensively in countermeasures most Inquisitors never learn.
    design: Net 0 points, per-Ordo flavor lens.
    children:
      - name: Daemonhunter's Training
        points: 1
        tags: [Perk, Imperium]
        design: Perk (B9), +1 to Hidden Lore (Daemons).
        lore: Ordo Malleus training is built entirely around understanding and countering the warp's worst predators.
        skill_bonuses: {"Hidden Lore (Daemons)": 1}
      - name: Never Lets Their Guard Down Near the Warp
        points: -1
        tags: [Quirk, Imperium]
        design: Quirk (B9), roleplaying flag only.
        lore: Ordo Malleus agents are written as unable to fully relax around anything warp-touched, including sanctioned psykers.
  - name: "Ordo: Xenos"
    container: group
    disabled: true
    tags: [Imperium, Inquisition]
    lore: The Ordo Xenos studies and counters alien threats and Imperial-xenos contact, from open invasion to quiet infiltration.
    design: Net 0 points, per-Ordo flavor lens.
    children:
      - name: Xenos Threat Assessment
        points: 1
        tags: [Perk, Imperium]
        design: Perk (B9), +1 to Expert Skill (Xenology).
        lore: Ordo Xenos work demands real, working xenology, not folklore.
        skill_bonuses: {"Expert Skill (Xenology)": 1}
      - name: Studies the Enemy Too Closely for Some Tastes
        points: -1
        tags: [Quirk, Imperium]
        design: Quirk (B9), roleplaying flag only.
        lore: >
          Ordo Xenos Inquisitors are the ones most often suspected (fairly
          or not) of Radical sympathies, simply for taking xenos
          capability seriously enough to study it in depth.
