kind: template
output: Imperium/Templates/Inquisitorial Acolyte.gct
notes: >
  A rank-and-file agent of an Inquisitor's retinue: ex-Guardsman,
  ex-Arbitrator, scholar, rogue trader scion, or reformed criminal —
  Inquisitorial acolytes are drawn from anywhere the Inquisition finds a
  useful skill set, per Eisenhorn's and Ravenor's ensemble casts. This is
  a generalist investigator/field-agent baseline; individual acolytes
  should reskin the skill list toward their actual background. Point
  math: ST 10 (+0), DX 12 (+40), IQ 13 (+60), HT 11 (+10) = 110;
  advantages +20; disadvantages -32; skills +100. Total 198 points, the
  low end of framework.md's "Elite human (200-350)" tier. No psychic
  abilities here — an acolyte with a sanctioned psyker gift should add
  traits from the separate psyker power library on top of this base.
traits:
  - name: ST
    points: 0
    tags: [Attribute]
    lore: Acolytes are chosen for skills and usefulness, not physical extremes.
    design: ST 10 (baseline), 10 pts/level (B15).
  - name: DX
    points: 40
    tags: [Attribute]
    lore: Competent but not elite combatants — most acolytes' real value is investigative, not martial.
    design: DX 12 (+2), 20 pts/level (B15).
  - name: IQ
    points: 60
    tags: [Attribute]
    lore: >
      The Inquisition recruits for intelligence and initiative above all;
      Eisenhorn's and Ravenor's retinues are consistently written as sharp,
      resourceful people.
    design: IQ 13 (+3), 20 pts/level (B15).
  - name: HT
    points: 10
    tags: [Attribute]
    lore: Fieldwork for the Inquisition is hard on the body, if less uniformly brutal than front-line Guard service.
    design: HT 11 (+1), 10 pts/level (B14).
  - name: Fit
    points: 5
    ref: B55
    tags: [Advantage, Physical, Imperium]
    lore: Kept in reasonable shape by an active, dangerous job.
    design: Basic Set Fit (B55), 5 points.
  - name: Combat Reflexes
    points: 15
    ref: B43
    tags: [Advantage, Mental, Imperium]
    lore: An acolyte who freezes under fire does not remain an acolyte for long.
    design: Basic Set Combat Reflexes (B43), 15 points.
  - include: "imperium/common/imperial-traits.yaml#Duty (Inquisition)"
  - include: "imperium/common/imperial-traits.yaml#Intolerance (Heretics)"
    lore: An acolyte's entire job is hunting heresy; most come to share their Inquisitor's zeal for it.
  - include: "imperium/common/imperial-traits.yaml#Secret (Works for the Inquisition)"
  - name: Nobody Trusts an Inquisitor's Agent
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: Even loyal Imperial citizens tend to clam up around anyone connected to the Inquisition.
  - name: Suspicious of Everyone, Eventually
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: The job trains acolytes out of taking anyone at face value for long.
skills:
  - name: Guns
    spec: Pistol
    diff: DX/E
    points: 12
    tags: [Imperium, Inquisition]
    lore: A concealable sidearm (autopistol, laspistol, or stub revolver) is standard acolyte kit.
    design: DX+4 (16) for 12 points, Easy (B170).
  - name: Stealth
    diff: DX/A
    points: 12
    tags: [Imperium]
    lore: Investigative fieldwork depends on not being noticed until the acolyte chooses to be.
    design: DX+3 (15) for 12 points, Average.
  - name: Streetwise
    diff: IQ/A
    points: 12
    tags: [Imperium]
    lore: Working informant networks and the underworld is core acolyte tradecraft.
    design: IQ+3 (16) for 12 points, Average.
  - name: Fast-Talk
    diff: IQ/A
    points: 8
    tags: [Imperium]
