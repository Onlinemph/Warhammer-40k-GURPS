kind: template
output: Imperium/Templates/Interrogator.gct
notes: >
  An Interrogator: an Inquisitor's chosen second, one step from being
  invested with a rosette of their own — Eisenhorn's and Ravenor's own
  Interrogators (before their eventual promotions) are the model. Built
  as a more capable, more independent Inquisitorial Acolyte (Imperium/
  Templates/Inquisitorial Acolyte.gct) rather than a separate archetype.
  Point math: ST 10 (+0), DX 13 (+60), IQ 14 (+80), HT 11 (+10) = 150,
  plus Will +1 (+5) = 155; advantages +30 plus Inquisitorial Rank 3
  (+30) and Status 2 (+10); disadvantages -37; skills +182. Total 370
  points, in framework.md's "Senior agents" tier: functionally nearly an
  Inquisitor already. No psychic abilities here; add from the separate
  psyker power library if the Interrogator is also a sanctioned psyker.
traits:
  - name: ST
    points: 0
    tags: [Attribute]
    lore: Chosen for judgment and capability, not physical extremes.
    design: ST 10 (baseline), 10 pts/level (B15).
  - name: DX
    points: 60
    tags: [Attribute]
    lore: A veteran field agent's honed reflexes, a clear step above a rank-and-file acolyte's.
    design: DX 13 (+3), 20 pts/level (B15).
  - name: IQ
    points: 80
    tags: [Attribute]
    lore: An Interrogator is entrusted with independent judgment calls an ordinary acolyte never makes.
    design: IQ 14 (+4), 20 pts/level (B15).
  - name: HT
    points: 10
    tags: [Attribute]
    lore: Years of fieldwork take their toll but also build endurance.
    design: HT 11 (+1), 10 pts/level (B14).
  - name: Will
    points: 5
    tags: [Attribute]
    lore: Years spent staring down heretics and worse without flinching.
    design: Will 15 (+1 above the IQ-derived default of 14), 5 pts/level (B16).
  - name: Fit
    points: 5
    ref: B55
    tags: [Advantage, Physical, Imperium]
    lore: Kept sharp by a dangerous job and, often, an Inquisitor's exacting standards.
    design: Basic Set Fit (B55), 5 points.
  - name: Combat Reflexes
    points: 15
    ref: B43
    tags: [Advantage, Mental, Imperium]
    lore: A veteran of more firefights than an ordinary acolyte survives to see.
    design: Basic Set Combat Reflexes (B43), 15 points.
  - name: Legal Enforcement Powers (Interrogator's Seal)
    points: 10
    ref: B65
    tags: [Advantage, Social, Imperium, Inquisition]
    lore: >
      An Interrogator carries a lesser seal of office that grants real,
      if narrower, authority than a full Inquisitorial rosette — enough
      to compel Imperial officials' cooperation in their Inquisitor's
      name, though not to act wholly independently of them.
    design: Basic Set Legal Enforcement Powers (B65), 2 levels, 10 points — below the Inquisitorial Rosette's 15-point maximum (Imperium/Traits/Imperial Traits.adq).
  - include: "imperium/common/imperial-traits.yaml#Duty (Inquisition)"
  - include: "imperium/common/imperial-traits.yaml#Inquisitorial Rank"
    levels: 3
  - include: "imperium/common/imperial-traits.yaml#Status (Inquisitor)"
    name: Status (Interrogator)
    points: 10
    design: Basic Set Status (B28) level 2 (10 points), borrowed from their Inquisitor master.
  - include: "imperium/common/imperial-traits.yaml#Intolerance (Heretics)"
    lore: Years of hunting heresy sharpen this into something close to reflex.
  - include: "imperium/common/imperial-traits.yaml#Secret (Works for the Inquisition)"
  - include: "imperium/common/imperial-traits.yaml#Overconfidence"
    lore: A rising star's confidence in their own judgment, not always warranted.
  - name: Measures Everyone Against Their Inquisitor's Standards
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: An Interrogator's judgment of competence, loyalty, and piety is shaped by whoever mentored them.
  - name: Impatient With Lesser Authority
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: Used to invoking an Inquisitor's name and having doors open; less patient with people who can't or won't open them.
