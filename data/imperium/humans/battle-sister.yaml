    lore: Conditioning for prolonged combat in heavy armour.
    design: HT-1 (11) for 1 point, Average.
  - name: Area Knowledge
    spec: (home Convent / Order's chapter house)
    diff: IQ/E
    points: 1
    tags: [Imperium]
    lore: Knowledge of the character's home Convent or Order chapter house.
    design: IQ+0 (11) for 1 point, Easy.
  - name: Current Affairs
    spec: Imperium
    diff: IQ/E
