kind: template
output: Imperium/Templates/Adepta Sororitas Battle Sister.gct
notes: >
  A Sister of Battle of the Adepta Sororitas: an unaugmented but
  rigorously trained and utterly devout human warrior-nun, wearing power
  armour but carrying none of the Astartes' gene-seed enhancements. Point
  math: ST 12 (+20), DX 13 (+60), IQ 11 (+20), HT 12 (+20) = 120, plus
  Will +2 (+10) = 130; advantages +54; disadvantages -72; skills +102.
  Total 214 points, inside framework.md's "Elite human (200-350)"
  tier, a little above a Tempestus Scion. No psychic abilities here: Sororitas Faith is explicitly not
  psychic power in Black Library fiction and this template does not
  touch the separate psyker power library. Add Military/Religious Rank
  levels for a Sister Superior or Canoness built from this base.
traits:
  - name: ST
    points: 20
    tags: [Attribute]
    lore: Sororitas training is physically demanding, producing soldiers a step above an ordinary Guardsman.
    design: ST 12 (+2), 10 pts/level (B15).
  - name: DX
    points: 60
    tags: [Attribute]
    lore: Extensive combat drill from a young age in the Order's schola.
    design: DX 13 (+3), 20 pts/level (B15).
  - name: IQ
    points: 20
    tags: [Attribute]
    lore: Sororitas education is thorough but doctrinally narrow compared to, say, an Inquisitorial acolyte's.
    design: IQ 11 (+1), 20 pts/level (B15).
  - name: HT
    points: 20
    tags: [Attribute]
    lore: Conditioned for endurance in power armour and prolonged campaigns.
    design: HT 12 (+2), 10 pts/level (B14).
  - name: Will
    points: 10
    tags: [Attribute]
    lore: Faith translates mechanically into exceptional force of will as much as raw intellect.
    design: Will 13 (+2 above the IQ-derived default of 11), 5 pts/level (B16).
  - name: Fit
    points: 5
    ref: B55
    tags: [Advantage, Physical, Imperium]
    lore: Convent training and a life in power armour keep a Sister in top condition.
    design: Basic Set Fit (B55), 5 points.
  - include: "imperium/common/imperial-traits.yaml#Fearlessness"
    levels: 2
    lore: A Sister's faith steadies her against the horrors she is sent to face; +2 to Fright Checks on top of her Will.
  - name: Combat Reflexes
    points: 15
    ref: B43
    tags: [Advantage, Mental, Imperium]
    lore: Drilled reactions under fire.
    design: Basic Set Combat Reflexes (B43), 15 points.
  - name: High Pain Threshold
    points: 10
    ref: B59
    tags: [Advantage, Physical, Imperium]
    lore: Sororitas are consistently written as fighting on through wounds that would stop lesser soldiers.
    design: Basic Set High Pain Threshold (B59), 10 points.
  - include: "imperium/common/imperial-traits.yaml#Act of Faith"
    levels: 2
  - include: "imperium/common/imperial-traits.yaml#Religious Rank"
    levels: 1
    lore: A Sister of Battle holds rank within her Order's hierarchy from the day she takes vows.
  - include: "imperium/common/imperial-traits.yaml#Fanaticism (The God-Emperor)"
    lore: >
      Sororitas devotion is, if anything, the most absolute in the
      Imperium — the Orders are the Ecclesiarchy's own military arm and
      recruit specifically for unshakeable faith.
  - include: "imperium/common/imperial-traits.yaml#Duty (Ecclesiarchy)"
  - name: Vow (Chastity and Poverty)
    points: -10
    ref: B160
    tags: [Disadvantage, Mental, Imperium]
    lore: >
      Adepta Sororitas Orders are explicitly convents as much as regiments;
      Sisters take vows on joining, consistently depicted across Black
      Library's Sisters of Battle fiction.
    design: >
      Basic Set Vow (B160), Major (-10, B161): the Order's rule of chastity
      and self-denial. Poverty is not taken literally, since the Order
      issues her armour and arms, so it reads as "owns nothing personally"
      and is folded into the same -10 rather than priced as a separate
      Great vow.
  - include: "imperium/common/imperial-traits.yaml#Intolerance (Xenos)"
  - include: "imperium/common/imperial-traits.yaml#Intolerance (Mutants)"
  - include: "imperium/common/imperial-traits.yaml#Intolerance (Heretics)"
  - include: "imperium/common/imperial-traits.yaml#Intolerance (Psykers)"
    name: Intolerance (Unsanctioned Psykers)
    lore: >
      Sororitas doctrine is openly hostile to unsanctioned psychic power;
      Sisters are shown tolerating and working alongside psykers who
      operate under Inquisitorial or Ministorum mandate, while treating
      rogue and untrained ones as a temptation to corruption (Sisters of
      Battle fiction, Faith and Fire).
  - name: Marked by the Order's Habit
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: A Sororitas is recognisable on sight by her Order's habit and iconography, wherever she goes.
  - name: Never Backs Down From a Fight Against the Unclean
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: Retreat from daemons, xenos or heretics is not a Sororitas instinct.
skills:
  - name: Guns
    spec: Rifle
    diff: DX/E
    points: 16
    tags: [Imperium, Adepta Sororitas]
    lore: The bolter is the Order Militant's standard weapon, per framework.md's weapon-skill table.
    design: DX+5 (18) for 16 points, Easy (B170).
  - name: Broadsword
    diff: DX/A
    points: 12
    tags: [Imperium, Adepta Sororitas]
    lore: Many Sisters carry a power sword or combat blade for close-quarters work.
    design: DX+3 (16) for 12 points, Average.
  - name: Theology
    spec: Imperial Creed
    diff: IQ/H
    points: 12
    tags: [Imperium, Adepta Sororitas]
    lore: A Sister of Battle is a warrior-cleric first; deep command of the Creed is expected, not optional.
    design: IQ+2 (13) for 12 points, Hard.
  - name: Savoir-Faire
    spec: Ecclesiarchy
    diff: IQ/E
    points: 1
    tags: [Imperium, Ecclesiarchy]
    lore: Order and Ecclesiarchy protocol; see Imperium/Skills/Imperial Skills.skl.
    design: IQ+0 (11) for 1 point, Easy.
  - name: Intimidation
    diff: Will/A
    points: 8
    tags: [Imperium]
    lore: A visor-faced, bolter-carrying Sister of Battle in power armour is a genuinely frightening sight.
    design: Will+2 (15) for 8 points, Average.
  - name: Leadership
    diff: IQ/A
    points: 8
    tags: [Imperium]
    lore: Squad-level command within a Sororitas Battle Sister Squad.
    design: IQ+2 (13) for 8 points, Average.
  - name: Soldier
    diff: IQ/A
    points: 8
    tags: [Imperium]
    lore: General military competence.
    design: IQ+2 (13) for 8 points, Average.
  - name: Tactics
    diff: IQ/H
    points: 8
    tags: [Imperium]
    lore: Squad and detachment tactics.
    design: IQ+1 (12) for 8 points, Hard.
  - name: Interrogation
    diff: IQ/A
    points: 4
    tags: [Imperium]
    lore: Sororitas field units frequently secure and question suspected heretics and cultists directly.
    design: IQ+1 (12) for 4 points, Average.
  - name: First Aid
    diff: IQ/E
    points: 2
    tags: [Imperium]
    lore: Combat first aid.
    design: IQ+1 (12) for 2 points, Easy.
  - name: Hidden Lore
    spec: Daemons
    diff: IQ/A
    points: 4
    tags: [Imperium]
    lore: See Imperium/Skills/Imperial Skills.skl; Sororitas doctrine takes daemonic threats extremely seriously.
    design: IQ+1 (12) for 4 points, Average.
  - name: Hidden Lore
    spec: Heresy
    diff: IQ/A
    points: 4
    tags: [Imperium]
    lore: See Imperium/Skills/Imperial Skills.skl.
    design: IQ+1 (12) for 4 points, Average.
  - name: Guns
    spec: Pistol
    diff: DX/E
    points: 4
    tags: [Imperium, Adepta Sororitas]
    lore: The bolt pistol is the Sister Superior's and Celestian's sidearm, and many Sisters carry a spare.
    design: DX+2 (15) for 4 points, Easy (B170).
  - name: Throwing
    diff: DX/A
    points: 2
    tags: [Imperium]
    ref: B226
    lore: Hand-thrown frag and krak grenades.
    design: DX+0 (13) for 2 points, Average (B226).
  - name: Stealth
    diff: DX/A
    points: 2
    tags: [Imperium]
    lore: Basic fieldcraft, secondary to a Sororitas' preference for direct confrontation.
    design: DX+0 (13) for 2 points, Average.
  - name: Climbing
    diff: DX/A
    points: 1
    tags: [Imperium]
    lore: Assault and boarding-action fitness.
    design: DX-1 (12) for 1 point, Average.
  - name: Jumping
    diff: DX/E
    points: 1
    tags: [Imperium]
    lore: Obstacle and assault fitness.
    design: DX+0 (13) for 1 point, Easy.
  - name: Running
    diff: HT/A
    points: 1
