# Lore squads for the combat simulator: each is a set of member units that deploy side by side, take their
# casualty Fright Checks together and follow one leader (Leadership, B204). A member names a template and a
# count, and may override that template's default loadout (data/sim/loadouts.yaml) field by field: armour,
# ranged, melee, grenades, knife, stance. Flags: leader (gives orders), vox (carries the leader's orders to the
# whole squad), commissar (summary execution, a house rule; set for any Commissar template). skills: levels a
# specialist has trained his weapon's skill to, where the template only defaults it (a heavy-weapon gunner at
# his line skill, e.g. a Battle-Brother's Gunner (Rockets) at his Guns (Rifle) 20).
#   short: the name the squad's members are logged under ("Guard Squad Sergeant #1").
Astra Militarum Infantry Squad:
  short: Guard Squad
  note: "Ten Cadian-pattern troopers: sergeant with laspistol and chainsword, vox-caster, a flamer, a heavy bolter team (gunner and loader) and five lasguns (Codex: Astra Militarum)."
  members:
    - {role: Sergeant, template: Astra Militarum Sergeant, count: 1, leader: true, ranged: {item: "Laspistol, Common Pattern", mode: "Standard"}, melee: {item: "Chainsword", mode: "Swing"}}
    - {role: Vox-caster, template: Astra Militarum Guardsman, count: 1, vox: true}
    - {role: Flamer, template: Astra Militarum Guardsman, count: 1, ranged: {item: "Flamer", mode: "Cone attack (5 yards)"}, stance: advance, skills: {"Liquid Projector (Flamethrower)": 13}}
    - {role: Heavy Bolter, template: Astra Militarum Guardsman, count: 1, team: 1, crew: gunner, ranged: {item: "Heavy Bolter", mode: "Standard bolt"}, stance: shoot, grenades: [], skills: {"Gunner (Machine Gun)": 13}}
    - {role: Loader, template: Astra Militarum Guardsman, count: 1, team: 1, crew: loader, stance: shoot}
    - {role: Guardsman, template: Astra Militarum Guardsman, count: 5}
Astra Militarum Infantry Squad with Commissar:
  short: Commissar's Squad
  note: "The infantry squad with a Commissar attached: he executes the first man to run and keeps the rest in the fight (a house rule built on Intimidation, B202)."
  members:
    - {role: Commissar, template: Commissar, count: 1, commissar: true}
    - {role: Sergeant, template: Astra Militarum Sergeant, count: 1, leader: true, ranged: {item: "Laspistol, Common Pattern", mode: "Standard"}, melee: {item: "Chainsword", mode: "Swing"}}
    - {role: Vox-caster, template: Astra Militarum Guardsman, count: 1, vox: true}
