  members:
    - {role: Sergeant, template: Astartes Battle-Brother, count: 1, leader: true, ranged: {item: "Bolt Pistol, Godwyn-De'az Pattern", mode: "Standard bolt"}, melee: {item: "Chainsword, Astartes Pattern", mode: "Swing"}}
    - {role: Flamer, template: Astartes Battle-Brother, count: 1, ranged: {item: "Flamer", mode: "Cone attack (5 yards)"}, skills: {"Liquid Projector (Flamethrower)": 20}}
    - {role: Missile Launcher, template: Astartes Battle-Brother, count: 1, ranged: {item: "Missile Launcher", mode: "Krak missile"}, stance: shoot, skills: {"Gunner (Rockets)": 20}}
    - {role: Battle-Brother, template: Astartes Battle-Brother, count: 7}
