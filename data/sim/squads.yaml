    - {role: Heavy Bolter, template: Astra Militarum Guardsman, count: 1, team: 1, crew: gunner, ranged: {item: "Heavy Bolter", mode: "Standard bolt"}, stance: shoot, grenades: [], skills: {"Gunner (Machine Gun)": 13}}
    - {role: Loader, template: Astra Militarum Guardsman, count: 1, team: 1, crew: loader, stance: shoot}
    - {role: Guardsman, template: Astra Militarum Guardsman, count: 5}
