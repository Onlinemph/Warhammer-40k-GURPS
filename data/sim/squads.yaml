    - {role: Rokkit, template: Ork Boy, count: 1, ranged: {item: "Rokkit Launcha", mode: "Standard"}, stance: shoot, skills: {"Gunner (Rockets)": 11}}
    - {role: Boy, template: Ork Boy, count: 18}
Fire Warrior Strike Team:
  short: Strike Team
  note: "A Shas'ui leading nine Fire Warriors, with two gun drones (Codex: T'au Empire)."
  members:
