# Facts a weapon's stat line does not carry (read by tools/sim.js; contract in docs/simulator.md).
# Keys: exact equipment `name`, then exact weapon-line `usage` (or `_item` for item-level facts).
#   malf      base Malf (B407); Ork values are the base, the engine adds +1 in a WAAAGH! (framework.md)
#   overheat  damage to the firer on a malfunction / critical failure, as the item's notes state it
#   cone      cone length in yards (usage text, or the line's range when the notes say "cone out to the listed range")
#   db        shield Defense Bonus (B287), from the item's `block` attribute
#   dr, hp    the shield's own DR and HP under Damage to Shields (B484; Homogeneous, HT 12). Simulator values
#             scaled to this project's armour (Astartes plate DR 100), not in the item data: to be confirmed
#   field     the shield's energy field (its Force Field entry): SP, delay and recharge; covers the front and shield side
#   blast     radius in yards for an area line whose damage string has no "ex" / [frag]
# Only numbers the data states are recorded.
Plasma Pistol:
  Standard: {malf: 16, overheat: 2dx4(3) burn ex}
  Supercharged: {malf: 14, overheat: 2dx4(3) burn ex}
Plasma Gun:
  Standard: {malf: 16, overheat: 3dx4(3) burn ex}
  Supercharged: {malf: 14, overheat: 3dx4(3) burn ex}
