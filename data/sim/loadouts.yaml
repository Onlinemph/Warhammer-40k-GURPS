# Default battle loadouts for the combat simulator (one entry per character template; Add-Ons skipped).
# Keys are the Library/**/*.gct file stems. Item / trait names and modes resolve against data/**.
# grenades: [{item, mode, count}] thrown grenades carried (lore-standard issue; most templates omit them from their equipment).
# ranged2: {item|trait, mode} a second ranged weapon that needs no hands (a bio-weapon in the maw); its own shots, no reload.
# skills: {name: level} a skill level the template lacks under that name (a weapon fired with a differently named skill).
# mags: spare magazines for the main gun besides the loaded one (default 4); none left and the gun is empty for good.
# knife: {item, mode} a combat knife carried besides the main melee weapon, drawn for close combat (reach C, no long-weapon penalty).
# body: upright (default), horizontal, legless or flying: posture for height in melee (Pyramid 3/77 p. 4-5, B402-403).

