# Psychic attack and defence powers per template (read by tools/sim.js; contract in docs/simulator.md).
# Keys are Library/**/*.gct file stems. Numbers come from the psyker traits under the project's Sorcery model
# (data/imperium/psykers/warp.yaml, data/xenos/*/traits.yaml, data/xenos/tyranids/psychic.yaml) at the levels each template buys.
#
# Fields: name (exact trait name), kind (ranged | melee | shield), damage (weapon damage string), acc, range (half-D/max),
#   rof, skill (effective roll), fp (FP per use), concentrate (turns of Concentrate first), blast (radius in yards for a non-explosive area power),
#   malediction (level, B106: a Quick Contest against `resist` (Will or HT) instead of a defence; -1/yard at 1, normal range penalties at 2, none inside 200 yd at 3), explosion (Explosion level, B107), cone (yards), perils, note.
#
# skill: the effective Innate Attack roll (DX + relative level) from the built template: Sanctioned Psyker Beam DX+2 = 13,
#   Farseer Projectile DX+3 = 17, Warlock Beam DX+2 = 16, Ork Weirdboy Projectile DX+2 = 13, Cryptek Beam DX+3 = 15
#   (Plasmancy enabled), Zoanthrope Beam DX+2 = 12. Psyker (Talent) helps only Psyniscience, Meditation, Hidden Lore
#   (the Warp) and the Perils Will roll, so it does not raise these rolls.
# fp: Warp Sorcery costs 1 FP per casting (framework.md "Psykers and the warp"). Powers without Warp Sorcery cost 0.
# concentrate: no attack power in the data carries Preparation Required or a Concentrate rule, so 0 throughout.
# range/acc/rof: Innate Attack defaults (B61): Acc 3, range 10/100, RoF 1; no trait overrides them.
# perils: Perils of the Warp (warp.yaml) is a Will roll made whenever the power is used, not a threshold on the attack roll.
#   will = the roll (Will + Psyker Talent levels, which the Talent adds to this roll). Success: no effect. Failure by margin:
#   1-2 minor (lose 1 FP), 3-5 moderate (1d damage ignoring DR, power fizzles), 6-9 major (2d ignoring DR, stunned, power
#   fizzles), 10+ or an unmodified 18 catastrophic (rift or possession; the power still fires out of control). No Pushing is assumed.
Sanctioned Psyker:
- name: Fire Bolt
  kind: ranged
  damage: 12d burn
  acc: 3
  range: 10/100
  rof: 1
  skill: 13
  fp: 1
  concentrate: 0
  perils:
    will: 17
    minor: {fp: 1}
    moderate: {damage: 1d, fizzle: true}
    major: {damage: 2d, stun: true, fizzle: true}
    catastrophic: {margin: 10, natural: 18}
  note: Fire Bolt 12 levels (Innate Attack burning, 5/die), bolter-class against flak. Skill is the template's Innate Attack (Beam) at DX+2 = 13 (DX 11, 4 points). Perils Will 14 + Psyker Talent 3.
