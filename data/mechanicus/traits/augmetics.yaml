kind: traits
output: Adeptus Mechanicus/Traits/Augmetics and the Cult Mechanicus.adq
items:
  # ------------------------------------------------------------------ limbs
  # Convention used throughout this section: a Damage Resistance bonus
  # confined to a single limb is priced as Partial (single limb), which we
  # treat as a steeper discount than the Partial (torso and vitals) used for
  # the Astartes Ossmodula (Imperium/Traits/Astartes Gene-Seed.adq, -10%):
  # a single arm or leg is a much smaller fraction of the hit-location table
  # and is rarely a called shot, so we price it at -60% (both legs together,
  # covering two full limbs and rather more of the body's mass, at -50%).
  # This is this project's own extrapolation of B47's Partial guidance, not
  # a quoted number from the book.

  - &augmetic_arm_menial
    name: Augmetic Arm, Menial Pattern
    points: 14
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B40
    notes: >
      Arm ST +2 (applies to lifting and to thrust/swing damage with this arm
      only); DR 2 on this arm only.
    lore: >
      The cheap, mass-produced limb replacement issued to menial serfs,
      manufactorum labourers and low-ranking Mechanicus staff who have lost
      an arm to an industrial accident: a servo-motor and a counterweight
      under a metal or plastek shell, strong enough for its job and no more.
    design: >
      Arm ST +2 (B40, 5/level, 10 points) for the servo-assisted grip and
      lift, plus DR 2, Partial (single limb) -60% (2x5=10, x0.4=4). 14
      points. This is a trait built from Basic Set abilities, not a
      renamed Ultra-Tech/Bio-Tech catalogue "bionic arm."
  - &augmetic_arm_combat
    name: Augmetic Arm, Combat Pattern
    points: 42
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus, Skitarii]
    ref: B40
    notes: >
      Arm ST +6 (lifting and thrust/swing damage with this arm only); DR 6
      on this arm only.
    lore: >
      The heavier pattern carried by Skitarii, veteran Enginseers, and any
      Tech-Priest expecting to use the limb itself as a weapon: cabled
      myomer bundles under an armoured casing, powerful enough to break a
      man's grip or punch through a hab door.
    design: >
      Arm ST +6 (B40, 5/level, 30) + DR 6, Partial (single limb) -60%
      (6x5=30, x0.4=12) = 42 points.
  - &augmetic_leg_menial
    name: Augmetic Leg, Menial Pattern
    points: 5
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B46
    notes: DR 2 on this leg only; the prosthetic joint doesn't fatigue or cramp.
    lore: >
      A basic replacement leg for a menial or low-ranking adept: functional,
      unglamorous, and common wherever industrial accidents are common.
    design: >
      DR 2, Partial (single limb) -60% (2x5=10, x0.4=4) + a 1-point Perk
      (B9) for a joint that never tires or cramps the way a natural knee
      does over a long shift. 5 points. (Basic Set has no dedicated "Leg
      ST" advantage the way it has Arm ST for arms; a single prosthetic leg
      does not meaningfully raise Move or damage on its own, so this entry
      is DR plus a flavor Perk rather than an invented attribute bonus.)
  - &augmetic_legs_combat
    name: Augmetic Legs, Combat Pattern (Matched Pair)
    points: 20
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus, Skitarii]
    ref: B46
    notes: DR 6 on both legs; Basic Move +1 from servo-assisted stride.
    lore: >
      Skitarii Rangers and Vanguard are routinely fielded with both legs
      replaced outright rather than one at a time; the matched pair's
      synchronized actuators give a longer, steadier stride than a single
      prosthetic bolted onto an otherwise natural gait.
    design: >
      DR 6, Partial (both legs, a larger fraction of the body than a single
      limb) -50% (6x5=30, x0.5=15) + Basic Move +1 (B17, 5 points/level) =
      20 points. Buying only one leg from this pair does not grant the Move
      bonus; use Augmetic Leg, Menial Pattern for a single prosthetic
      instead.

  # ------------------------------------------------------------------ eyes
  - &auto_senses_skitarii
    name: Auto-senses, Skitarii Pattern
    points: 14
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B60
    notes: Infravision; Acute Vision +2.
    lore: >
      The standard-issue ocular augmetic fitted to almost every Skitarii and
      forge-world menial: crude compared to a Magos' oculars, but enough to
      fight in smoke, dust, and near-total darkness without a lumen pack.
    design: Infravision (B60, 10) + Acute Vision +2 (B35, 2/level, 4) = 14 points.
  - &auto_senses_ballistic
    name: Ballistic Auto-senses, Sicarian/Ranger Pattern
    points: 24
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus, Skitarii]
    ref: B60
    notes: Infravision; Acute Vision +2; Telescopic Vision +2.
    lore: >
      Longer-focus oculars issued to Skitarii Rangers and Sicarian pattern
      infiltrators for target marking at range — the same augmetic family
      as the standard pattern, with an added zoom lens train.
    design: >
      Infravision (B60, 10) + Acute Vision +2 (B35, 4) + Telescopic Vision
      +2 (B92, 5/level, 10) = 24 points.
  - &multi_lens_oculars
    name: Multi-lens Oculars, Magos Pattern
    points: 44
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B60
    notes: Infravision; Dark Vision; Acute Vision +2; Protected Sense (Vision).
    lore: >
      A senior Tech-Priest's full ocular replacement: banks of interchangeable
      lenses that between them see by heat, by full dark, and by ordinary
      light with equal clarity, behind housings hardened against flash and
      glare — the source of the characteristic red or augmetic-lensed stare
      Black Library repeatedly gives high-ranking Magi.
    design: >
      Infravision (B60, 10) + Dark Vision (B60, 25) + Acute Vision +2 (B35,
      4) + Protected Sense (Vision) (B78, 5) = 44 points.

  # -------------------------------------------------------------- cognitive
  - &cranial_circuitry
    name: Cranial Circuitry
    points: 1
    tags: [Advantage, Mental, Imperium, Adeptus Mechanicus, Perk]
    lore: >
      A basic subcutaneous data-port and skull-mounted junction box, common
      to nearly every ordained Tech-Priest: the hardware prerequisite for
      plugging into a standard Mechanicus cogitator terminal or picter-feed,
      rather than any enhancement to the mind behind it.
    design: >
      1-point Perk (B9): waives the unfamiliarity penalty for operating a
      Mechanicus-standard terminal, by direct analogy with how Black
      Carapace (Imperium/Traits/Astartes Gene-Seed.adq) is priced as the
      interface hardware rather than the capability it plugs into.
  - &cortex_implant
    name: Cortex Implant, Logis Pattern
    points: 7
    tags: [Advantage, Mental, Imperium, Adeptus Mechanicus]
    notes: Eidetic Memory; Lightning Calculator.
    lore: >
      A cogitator wafer grafted directly to the parietal cortex, banking
      perfect recall of anything the adept has read or witnessed and
      running arithmetic as fast as a slate abacus — the piece of kit behind
      a Tech-Priest's habit of reciting exact figures and quoting obscure
      STC clauses from memory.
    design: Eidetic Memory (B51, 5) + Lightning Calculator (B66, 2) = 7 points.

  # ------------------------------------------------------------ life support
  - &respirator_plugs
    name: Respirator Plugs (Filtration Lungs)
    points: 5
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B55
    lore: >
      Grille-covered intake valves set into the throat or chest, scrubbing
      forge smog, promethium fumes, and toxic industrial atmosphere before
      it reaches the lungs — near-universal among Mechanicus adepts who
      spend their working lives on a forge-world's surface.
    design: Basic Set Filter Lungs (B55), 5 points.
  - &subdermal_armour
    name: Subdermal Armour Plating
    per_level: 5
    levels: 2
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B46
    notes: DR, all locations; stacks with worn armor.
    lore: >
      Ceramite or plasteel weave grafted beneath the skin across the whole
      body, rather than replacing a specific organ or limb — the augmetic
      equivalent of the Astartes' Ossmodula, bought by Tech-Priests who
      expect to take a hit.
    design: >
      Plain Damage Resistance (B46), 5 points/level, no location
      restriction since it covers the whole body. Bought here at a default
      2 levels (DR 10, 10 points); raise or lower the level to taste.

  # ----------------------------------------------------------- neural links
  - &mind_impulse_unit
    name: Mind Impulse Unit
    points: 1
    tags: [Advantage, Mental, Imperium, Adeptus Mechanicus, Perk]
    lore: >
      A direct neural tap threaded into the spine and motor cortex, letting
      its bearer drive a war machine, servo-harness, or Dreadnought
      sarcophagus as an extension of their own body rather than through
      manual controls. Fitted to Techmarines, Dreadnought-interred Ancients,
      and Titan princeps alike.
    design: >
      A 1-point Perk (B9): the prerequisite hardware for using MIU-linked
      equipment, priced the same way as Black Carapace (Imperium/Traits/
      Astartes Gene-Seed.adq) — the actual mechanical payoff (no penalty
      for driving an MIU-linked machine, full reflexes through it) belongs
      on that equipment's own entry, since the implant does nothing for a
      bearer with nothing to plug it into.
  - &noospheric_link
    name: Noospheric Link
    points: 8
    tags: [Advantage, Mental, Imperium, Adeptus Mechanicus]
    ref: B91
    notes: >
      Short-to-medium range wireless data-link to the Cult Mechanicus'
      noosphere: other Noospheric Link-bearing adepts and compatible
      cogitators/machine spirits only.
    lore: >
      A subcutaneous vox-and-data transceiver that lets a Tech-Priest read
      and post to the layered, half-mystical data-cloud the Mechanicus
      calls the noosphere — status runes, binharic liturgy, and tactical
      chatter overlaid on the world for anyone plugged in, and gibberish
      static to anyone who isn't.
    design: >
      Basic Set Telecommunication (Radio type, B91, 10 points) with the
      Racial limitation (B91, -20%, restricted to others who share the
      trait — here, other noosphere-linked adepts and machine spirits):
      10 x 0.8 = 8 points. Pairs with the Language (Binharic) skill
      (Adeptus Mechanicus/Skills/Mechanicus Skills.skl) for the liturgical
      cant spoken over the link; the link itself is the hardware, the
      language is the learned code riding on it.
  - &rapport_machine_spirits
    name: Rapport with Machine-Spirits
    points: 5
    tags: [Advantage, Mental, Imperium, Adeptus Mechanicus]
    ref: B40
    notes: >
      As Animal Empathy, but for machines: a +2 reaction bonus from
      machine spirits (GM's call on what that means for an unintelligent
      device), and the ability to sense a machine's "mood" and calm or
      unsettle it as if it were an animal.
    lore: >
      The Cult Mechanicus teaches that every machine, however humble, is
      inhabited by a spirit that must be placated, not merely serviced;
      some adepts are, by temperament or training, unusually good at
      reading and soothing that spirit — coaxing a failing plasma reactor
      to hold together a little longer, or a balky servitor to obey. This
      project does not model an outright "talk to any machine" power (that
      belongs to Ultra-Tech's Machine Empathy advantage, which this project
      does not use); this is Basic Set's own animal-handler's knack,
      reapplied to machines instead of beasts.
    design: >
      Built as a direct structural copy of Basic Set Animal Empathy (B40,
      5 points) with "animals" replaced by "machine spirits" throughout —
      same narrow scope, same cost, not a renamed Ultra-Tech/Bio-Tech
      advantage.

  # --------------------------------------------------------- mechadendrites
  # All four patterns are Extra Arm (B53, 10 points/level) with a Basic Set
  # Extra Arm modifier applied for the pattern's specialty. A Tech-Priest or
  # Enginseer typically mounts two to four of these on a back-harness; pick
  # per character rather than bundling them into one trait, so a sheet shows
  # exactly which mechadendrites a given adept carries.
  - &mechadendrite_manipulator
    name: Mechadendrite, Manipulator Pattern
    points: 15
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B53
    notes: Extra Arm, Extra-Flexible.
    lore: >
      A slender, many-jointed limb tipped with fine manipulator digits and
      micro-tools — the classic image of a Tech-Priest's back-mounted
      "third and fourth hands," used for delicate work a human hand can't
      manage: micro-soldering, data-slate transcription, surgery.
    design: >
      Extra Arm (B53, 10) with the Extra-Flexible modifier (B53, +50%):
      10 x 1.5 = 15 points.
  - &mechadendrite_utility
    name: Mechadendrite, Utility Pattern
    points: 9
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B53
    notes: Extra Arm (Weak, half body ST), Payload 1.
    lore: >
      A general tool-limb: a socketed head that swaps between screwdriver,
      clamp, laslock loader, and a dozen other fittings a field Tech-Priest
      needs on hand, plus a small internal magazine for spare parts.
    design: >
      Extra Arm (B53, 10) with the Weak modifier (half body ST, -25%; a
      slender tool-limb, not a lifting limb): 10 x 0.75 = 7.5, plus Payload
      1 (B74, 1 point, for the internal parts magazine) = 8.5, rounded to 9.
  - &mechadendrite_medicae
    name: Mechadendrite, Medicae Pattern
    points: 9
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B53
    notes: Extra Arm (Weak, half body ST), Payload 1.
    lore: >
      Fitted with surgical grippers, synth-flesh dispensers, and injector
      ampoules instead of general tools — the limb an Apothecary-trained
      Tech-Priest or a battlefield chirurgeon-adept uses to work on a
      patient with both hands still free for something else.
    design: >
      Identical build to the Utility Pattern above (Extra Arm, Weak -25%,
      plus Payload 1 for the injector/synth-flesh reservoir instead of
      spare parts): 9 points. Kept as a separate entry per framework.md's
      instruction to list each mechadendrite pattern individually, since a
      character sheet should show which tools a given limb actually
      carries.
  - &mechadendrite_ballistic
    name: Mechadendrite, Ballistic Pattern
    points: 2
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B53
    notes: >
      Extra Arm, Weapon Mount: can aim and fire a mounted weapon (bought
      separately as equipment) but do nothing else — no fine manipulation,
      no unarmed use.
    lore: >
      A rigid, gyro-stabilized mount rather than a true limb, built to
      carry a phosphor blaster, flamer, or similar sidearm slaved to its
      bearer's targeting cortex and fired independently of the hands.
    design: >
      Extra Arm (B53, 10) with the Weapon Mount modifier (B53, -80%):
      10 x 0.2 = 2 points. The weapon it carries is a separate equipment
      purchase, not part of this trait.

  # --------------------------------------------------------------- toolkit
  - &servo_arm
    name: Servo-Arm
    points: 50
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B53
    notes: Extra Arm; Lifting ST +8; Striking ST +3; Payload 1.
    lore: >
      The heavy, back-mounted tool-arm carried by Enginseers and Techmarines:
      strong enough to tear open a sealed hatch or wrench a fused component
      free, and — as more than one heretic has learned the hard way —
      strong enough to crush a skull if its bearer chooses.
    design: >
      Extra Arm (B53, 10) + Lifting ST +8 (B65, 3/level, 24) for heavy
      lifting/grappling work + Striking ST +3 (B88, 5/level, 15) for its use
      as an improvised weapon + Payload 1 (B74, 1) for a small tool
      magazine = 50 points.

  - &logis_cogitator
    name: Logis Cogitator
    per_level: 5
    levels: 1
    tags: [Advantage, Mental, Imperium, Adeptus Mechanicus]
    ref: B90
    notes: >
      +1/level to Mathematics, Navigation, Engineer, and Computer
      Programming/Operation.
    lore: >
      A heavier processing implant than a simple Cortex Implant: a bank of
      logic-engines fused to the adept's own thought, running calculations,
      trajectory solutions, and STC cross-references far faster than an
      unaugmented mind — the hardware behind a Magos' habit of answering a
      complex calculation before the question is finished.
    design: >
      Built as a custom Talent per B89-91's costing table: a "small" group
      of four related skills (Mathematics, Navigation, Engineer, Computer
      Programming/Operation) costs 5 points/level. Not a renamed
      Ultra-Tech implant — a Basic Set Talent construction, same as any
      other in-setting Talent.
  - &potentia_coil
    name: Potentia Coil
    per_level: 2
    levels: 1
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B80
    notes: Reduced Consumption, applied to powering augmetic systems rather than food.
    lore: >
      A subcutaneous capacitor bank that trickle-charges off the bearer's
      own biotic processes and background energy, letting heavily-augmented
      adepts go far longer between visits to a recharge shrine than their
      augmetics would otherwise need.
    design: >
      Reduced Consumption (B80, 2 points/level) reflavored from food/fuel
      intake to augmetic power draw — same mechanical shape (needing an
      external resource only a fraction as often), different resource.

  # ---------------------------------------------------- Electro-Priest gear
  - &electoo_inductors
    name: Electoo Inductors
    per_level: 3
    levels: 2
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus, Electro-Priest]
    ref: B61
    notes: >
      Innate Attack (Burning, reflavored electrical), 1d/level, melee reach
      C only.
    lore: >
      Circuit-tattoos inlaid with conductive metal, threaded through the
      whole nervous system: the baseline weapon and mark of every
      Electro-Priest, discharging a jolt through bare skin or a carried
      conductor (an electro-flail, a pair of live wires).
    design: >
      Innate Attack (Burning) (B61, 5 points/die) reflavored as an
      electrical discharge, with the Melee Attack (Reach C, Cannot Parry)
      limitation (B112, an estimated -40% per that limitation's standard
      value): 5 x 0.6 = 3 points/die.
  - &luminen_capacitor
    name: Luminen Capacitor
    per_level: 2
    levels: 2
    tags: [Advantage, Physical, Imperium, Adeptus Mechanicus, Electro-Priest]
    ref: B61
    notes: >
      Add-on to Electoo Inductors: extra Innate Attack dice, same type,
      usable only after spending a Ready maneuver to charge.
    lore: >
      A reservoir capacitor bank layered on top of the base Electoo
      Inductors, letting a Fulgurite Electro-Priest bank a much heavier
      charge for one crippling discharge, at the cost of a moment spent
      visibly building up a crackling static field first.
    design: >
      Innate Attack (Burning) (B61, 5/die) with the same Melee Attack
      (Reach C, Cannot Parry) limitation as Electoo Inductors (-40%,
      B112) plus Preparation Required, roughly 1 turn (B114, an estimated
      -20%): 5 x (1 - 0.40 - 0.20) = 5 x 0.4 = 2 points/die. Add its levels
      to Electoo Inductors' only while the charge is held.

  # -------------------------------------------------------------- lobotomy
  - &servitor_lobotomy
    name: Servitor Lobotomy (Neural Excision)
    container: meta_trait
    tags: [Disadvantage, Mental, Imperium, Adeptus Mechanicus, Servitor]
    children:
      - name: Slave Mentality
        points: -40
        ref: B154
      - name: Low Empathy
        points: -20
        ref: B142
      - name: Cannot Speak (Mute)
        points: -25
        ref: B145
        notes: >
          Some Servitor patterns retain a handful of vox-triggered stock
          responses at the GM's discretion; treat this as flavor, not a
          mechanical exception.
    lore: >
      The surgical and chemical process that turns a criminal, debtor, or
      unfit citizen into a Servitor: swathes of the frontal cortex and
      speech centers are excised or chemically silenced, leaving a body
      that follows binharic command-cant and simple standing orders with
      total, uncomplaining obedience and nothing recognizable as a person
      behind the eyes.
    design: >
      Slave Mentality (B154, -40, cannot disobey or act against orders) +
      Low Empathy (B142, -20, cannot read or care about others' feelings)
      + Cannot Speak (B145, -25, mute but for binharic response codes) =
      -85 points. Reduced IQ itself is bought on the character sheet (an
      attribute purchase, not an implant trait) — see
      Adeptus Mechanicus/Templates/Combat Servitor.gct for a worked
      example.

  # ---------------------------------------------------------- Cult faith
  - &fanaticism_omnissiah
    name: Fanaticism (The Omnissiah)
    points: -15
    tags: [Disadvantage, Mental, Imperium, Adeptus Mechanicus]
    ref: B136
    lore: >
      Doctrinal certainty that the Machine God — the same Emperor, in the
      Cult Mechanicus' own theology, understood as a being of pure
      technological perfection — must be served without question, and that
      His will (as interpreted by the Priesthood's hierarchy) justifies
      whatever it demands. Distinct from the Imperial Creed's Fanaticism
      (The God-Emperor) in Imperium/Traits/Imperial Traits.adq: the same
      shape of belief, aimed at a different reading of the same divinity.
    design: Basic Set Fanaticism (B136), flat -15, as the existing Imperial Fanaticism entry is built.
  - &disciplines_of_the_cult
    name: Disciplines of the Cult Mechanicus
    points: -10
    tags: [Disadvantage, Mental, Imperium, Adeptus Mechanicus]
    ref: B127
    notes: >
      As Code of Honor: obey the ritual forms and chain of command of the
      Priesthood, never share proscribed knowledge outside sanctioned
      channels, never act against a superior adept's direct instruction
      without Martian sanction.
    lore: >
      The Cult Mechanicus runs on ritual precision and a rigid hierarchy of
      knowledge: an adept who improvises outside sanctioned procedure, or
      who shares forbidden data with the unworthy, has broken discipline in
      a way their peers will report on sight.
    design: >
      Basic Set Code of Honor (B127), moderate severity, -10 — the same
      cost this project already uses for Code of Honor (Codex Astartes) in
      Imperium/Traits/Astartes Gene-Seed.adq.
  - &distrust_of_flesh
    name: Distrust of Flesh
    points: -10
    tags: [Disadvantage, Mental, Imperium, Adeptus Mechanicus]
    ref: B140
    lore: >
      Cult doctrine holds that unaugmented flesh is weak, corruptible, and
      an obstacle to the Machine God's perfection; many adepts, especially
      the more heavily augmented, come to regard baseline humans (even
      loyal Imperial citizens) with the same doctrinal contempt other
      Imperial institutions reserve for mutants or heretics.
    design: >
      Basic Set Intolerance (B140), broad-category cost, -10 — built the
      same way this project's existing Intolerance (Xenos)/(Mutants)
      entries are (Imperium/Traits/Imperial Traits.adq).
  - &dependency_on_maintenance
    name: Dependency (Maintenance Rites and Sacred Unguents)
    points: -10
    tags: [Disadvantage, Physical, Imperium, Adeptus Mechanicus]
    ref: B131
    notes: >
      Common substance (sanctified oils, incense, replacement components),
      needed roughly daily; 1d damage if a maintenance cycle is missed
      entirely.
    lore: >
      A body carrying real augmetic load needs its joints oiled, its
      cabling checked, and its power cells topped up on a strict ritual
      schedule, or it seizes, shorts, or bleeds power — a problem the Cult
      Mechanicus dresses in liturgy, but a real, physical maintenance
      dependency underneath.
    design: >
      An own-estimate application of Basic Set Dependency's guidelines
      (B131): a substance that's common and easy to obtain anywhere the
      Mechanicus has a presence, needed about daily, doing moderate (1d)
      damage if missed entirely. -10 points; a specific character with
      much rarer parts (an isolated relic-tech Servitor, say) should cost
      this disadvantage higher per the same table.
  - &duty_adeptus_mechanicus
    name: Duty (Adeptus Mechanicus)
    points: -10
    tags: [Disadvantage, Social, Imperium, Adeptus Mechanicus]
    ref: B133
    lore: >
      A sworn Tech-Priest, Enginseer, or Skitarii answers first to their
      Forge World and its Fabricator-General, not to any Guard officer or
      Administratum functionary they happen to be attached to — a
      binding, frequent, but not universally life-threatening obligation
      (unlike a Guardsman's), since a Mechanicus posting is at least as
      often archival or industrial as it is a battlefield one.
    design: >
      Basic Set Duty (B133), fairly frequent but not "almost always
      hazardous" the way Duty (Astra Militarum) is (Imperium/Traits/
      Imperial Traits.adq) — pegged one tier below that entry, at -10, to
      reflect the Priesthood's broader range of postings. A Skitarii or a
      field-attached Enginseer/Techmarine should reasonably use -15
      instead; -10 is this template's baseline for a workshop- or
      forge-based adept.
  - &social_stigma_augmetics
    name: Social Stigma (Heavily Augmented)
    points: -5
    tags: [Disadvantage, Social, Imperium, Adeptus Mechanicus]
    ref: B155
    lore: >
      Past a certain point of visible augmetic replacement, ordinary
      Imperial citizens stop reading a Tech-Priest as a person wearing
      machinery and start reading them as a machine wearing a person's
      shape — unease and minor deference-avoidance rather than outright
      hostility, but real, and consistent with how Black Library repeatedly
      writes civilian reactions to a fully-vested Magos.
    design: >
      Basic Set Social Stigma (B155), minor-category cost, -5. A GM running
      a near-fully-mechanical Archmagos with almost no flesh left may
      reasonably price this at the "Monster" tier (-15) instead; this entry
      covers the ordinary working Tech-Priest or Skitarii.

  - &mechanicus_rank
    name: Mechanicus Rank
    per_level: 5
    levels: 1
    max_levels: 9
    tags: [Advantage, Social, Imperium, Adeptus Mechanicus]
    ref: B29
    notes: >
      Levels: 1 Skitarii Alpha/menial overseer, 2-3 Enginseer, 4-5 Magos,
      6-7 Archmagos, 8 Fabricator-Locum, 9 Fabricator-General of a Forge
      World.
    lore: >
      The Priesthood's own hierarchy, parallel to (and largely independent
      of) any Imperial Guard or Administratum rank a Tech-Priest might also
      hold — a Magos answers to Mars and their Forge World's hierarchy
      first, an Imperial governor's authority a distant second.
    design: >
      Basic Set Rank (B29), 5 points/level, by direct analogy with this
      project's existing Military Rank and Religious Rank entries
      (Imperium/Traits/Imperial Traits.adq).

  # -------------------------------------------------- Doctrina imperatives
  - &skitarii_doctrina
    name: Skitarii Doctrina Imperatives
    container: alternative_abilities
    tags: [Advantage, Mental, Imperium, Adeptus Mechanicus, Skitarii]
    children:
      - name: Protector Imperative
        points: 10
        ref: B51
        notes: Enhanced Parry (All Parries) +1.
      - name: Conqueror Imperative
        points: 5
        ref: B90
        notes: "+1 to Guns and Gunner skills (Talent-style construction)."
      - name: Hunter Imperative
        points: 5
        ref: B17
        notes: Basic Move +1.
    lore: >
      A Skitarii Maniple's cranial implants take a battle-doctrina uploaded
      before an engagement, biasing every Skitarii in the maniple toward
      one combat posture at a time: Protector for a defensive cordon,
      Conqueror for an all-out firing advance, Hunter for pursuit and
      encirclement. A Skitarii can only run one imperative at a time and
      must be re-flashed (a Ready maneuver, or a scene break, at the GM's
      call) to switch.
    design: >
      Basic Set Alternative Abilities (B61): buy the most expensive ability
      at full price and the rest at 1/5 cost (round up), since only one can
      be active. Full prices: Enhanced Parry, All Parries (B51, 10),
      Conqueror Imperative as a narrow +1 combat Talent (B90-style, 5),
      Hunter Imperative as Basic Move +1 (B17, 5). GCS applies the
      Alternative Abilities discount natively for this container type;
      worked by hand, the effective total is 10 + ceil(5/5) + ceil(5/5) =
      12 points.

  # -------------------------------------------------------- Vanguard field
  - &vanguard_rad_saturation
    name: Rad-Saturation Field
    container: meta_trait
    tags: [Advantage, Disadvantage, Physical, Imperium, Adeptus Mechanicus, Skitarii]
    children:
      - name: Ambient Radium Field
        points: 6
        ref: B61
        notes: >
          Innate Attack (Toxic), 1 die, always on, affecting everyone
          adjacent (including allies) each turn they're in reach; HT to
          resist as normal for toxic damage.
      - name: Unfit
        points: -5
        ref: B160
        notes: The same field that saturates the air nearby also cooks its bearer slowly.
    lore: >
      Skitarii Vanguard carry radium weapons whose ammunition and support
      systems bleed a low but constant field of ionizing radiation, harmless
      to the fully-sealed Skitarii themselves in the short term but a real
      hazard to anyone standing near one unprotected — and, over a long
      enough campaign, a hazard to the Vanguard too, one more reason
      Skitarii service so rarely ends in old age.
    design: >
      Innate Attack (Toxic) (B61, 4/die) with Aura (B102, an estimated
      +80%, so it affects everyone in reach without an attack roll),
      Always On (B110, an estimated -20%, it can't be switched off) and
      Emanation (B112, an estimated -20%, it can't be aimed or withheld
      from allies): net +40%, 4 x 1.4 = 5.6, rounded to 6. Paired with
      Unfit (B160, -5) for the field's slow toll on its own bearer. Net 1
      point: deliberately close to zero, since this is simultaneously a
      minor hazard-weapon and a curse, not a purchase anyone takes for the
      points.

  # ------------------------------------------------------ Skitarii psyche
  - &skitarii_conditioning
    name: Skitarii Conditioning
    container: meta_trait
    tags: [Disadvantage, Mental, Imperium, Adeptus Mechanicus, Skitarii]
    children:
      - name: Low Empathy
        points: -20
        ref: B142
      - name: No Sense of Humor
        points: -10
        ref: B146
      - name: Speaks Only in Clipped Binharic-Inflected Report
        points: -1
        tags: [Quirk]
    lore: >
      Skitarii undergo extensive neural conditioning and cybernetic
      replacement of their own that, while far short of a Servitor's total
      lobotomy, strips away most of the emotional affect and small-talk
      that would otherwise mark them as still fully human — codex and
      Black Library background alike describe them as unnervingly flat and
      literal even next to other Mechanicus adepts.
    design: >
      Low Empathy (B142, -20) + No Sense of Humor (B146, -10) + a 1-point
      Quirk (B9) for clipped, ritualized speech patterns = -31 points.
      Deliberately short of Servitor Lobotomy (Neural Excision) above:
      Skitarii still hold rank, opinions, and (per some Codex background)
      occasional flickers of the person they were, where a Servitor has
      none of that left.
