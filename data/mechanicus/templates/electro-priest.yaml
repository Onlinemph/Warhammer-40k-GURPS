kind: template
output: Adeptus Mechanicus/Templates/Electro-Priest.gct
notes: >
  An Electro-Priest: a fanatical warrior-priest of the Motive Force who
  chose this transformation to serve the Cult Mechanicus body and soul
  (Codex: Adeptus Mechanicus background) -- devoted, doctrinally certain,
  and dangerous in a fight, not the near-mindless temple slave a Servitor
  is (Adeptus Mechanicus/Templates/Combat Servitor.gct is that template
  instead). Baseline below is the Corpuscarii pattern (ranged electrostatic
  gauntlets); enable the disabled "Lens: Fulgurite Conversion" for the
  melee electroleech-staff pattern instead. Point math: ST 12 (+20), DX 11
  (+20), IQ 10 (+0), HT 12 (+20) = 60, plus Will +2 (+10) = 70; advantages
  +127 (Electoo Inductors 1 + Voltagheist Field 49 + Electrostatic Gauntlets, Corpuscarii Pattern
  56 + Respirator Plugs 5 + Potentia Coil 2 + High Pain Threshold 10 +
  Fearlessness x2 4); disadvantages -40; skills +28. Total 185 points,
  just above framework.md's "Trained soldier (100-175)" tier and just
  under "Elite human (200-350)" -- a devoted zealot-warrior, tougher
  and better-defended than a Guardsman but not as broadly trained as a
  Battle Sister or Inquisitorial acolyte. The electro-flail/staff itself
  (the physical weapon a Fulgurite carries) and any other equipment are not
  covered here; the attack traits below are the augmetic/bio-electric
  ability, not a separate weapon purchase.
traits:
  - name: ST
    points: 20
    tags: [Attribute]
    lore: The augmentation process and the physical rigors of temple service both select for real strength.
    design: ST 12 (+2), 10 pts/level (B15).
  - name: DX
    points: 20
    tags: [Attribute]
    lore: Enough reflex to fight in melee or land a gauntlet-arc on a moving target.
    design: DX 11 (+1), 20 pts/level (B15).
  - name: IQ
    points: 0
    tags: [Attribute]
    lore: >
      An Electro-Priest is a trained, willing initiate of the Cult, not a
      lobotomized construct -- average intelligence, doctrinally narrow
      rather than diminished.
    design: IQ 10 (baseline), 20 pts/level (B15).
  - name: HT
    points: 20
    tags: [Attribute]
    lore: The augmentation process and a body that runs a permanent bio-electric field both demand real endurance.
    design: HT 12 (+2), 10 pts/level (B14).
  - name: Will
    points: 10
    tags: [Attribute]
    lore: Doctrinal fanaticism translates into real, measurable force of will.
    design: Will 12 (+2 above the IQ-derived default of 10), 5 pts/level (B16).
  - include: "mechanicus/traits/augmetics.yaml#Electoo Inductors"
  - include: "mechanicus/traits/augmetics.yaml#Voltagheist Field"
  - include: "mechanicus/traits/augmetics.yaml#Electrostatic Gauntlets, Corpuscarii Pattern"
  - include: "mechanicus/traits/augmetics.yaml#Respirator Plugs (Filtration Lungs)"
  - include: "mechanicus/traits/augmetics.yaml#Potentia Coil"
    levels: 1
  - name: High Pain Threshold
    points: 10
    ref: B59
    tags: [Advantage, Physical, Imperium]
    lore: Between the augmentation process and temple discipline, an Electro-Priest has learned to fight through pain that would stop most people cold.
    design: Basic Set High Pain Threshold (B59), 10 points.
  - name: Fearlessness
    per_level: 2
    levels: 2
    ref: B55
    tags: [Advantage, Mental, Imperium]
    lore: Doctrinal certainty and a body that shrugs off small-arms fire both feed a real disregard for danger.
    design: Basic Set Fearlessness (B55), 2/level, 2 levels bought.
  - include: "mechanicus/traits/augmetics.yaml#Fanaticism (The Omnissiah)"
  - include: "mechanicus/traits/augmetics.yaml#Disciplines of the Cult Mechanicus"
  - include: "mechanicus/traits/augmetics.yaml#Duty (Adeptus Mechanicus)"
  - name: Odious Personal Habit (Visibly Crackles and Sparks)
    points: -5
    ref: B22
    tags: [Disadvantage, Social, Imperium]
    lore: >
      An active Electro-Priest is never quite silent or still: their
      electoo-lined skin hums, sparks, and occasionally arcs, which
      unnerves almost everyone who isn't Mechanicus-trained.
    design: Basic Set Odious Personal Habit (B22), minor, -5.
  - name: "Lens: Fulgurite Conversion"
    container: group
    disabled: true
    tags: [Imperium, Adeptus Mechanicus, Electro-Priest]
    lore: >
      Fulgurite Electro-Priests trade the Corpuscarii's ranged electrostatic
      gauntlets for a melee electroleech staff that drains a target's own
      vitality to fuel the wielder -- a different weapon pattern built on
      the same Voltagheist Field and Cult conditioning, not a stronger
      version of the same thing.
    design: >
      Disable Electrostatic Gauntlets, Corpuscarii Pattern (-56 points) and
      enable this lens's Electroleech Staff, Fulgurite Pattern (+52 points)
      instead: a net -4 points on traits, +4 more on skills once Staff is
      raised to 12 (the same total as the baseline template). Also move the 8 points this template spends on Innate
      Attack (Beam) onto the Staff skill instead, raised to 12 (see below) (see this template's
      skill list), since the Fulgurite pattern's staff is a melee weapon
      resolved with its own weapon skill, not the Innate Attack skill a
      ranged gauntlet-bolt needs.
    children:
      - include: "mechanicus/traits/augmetics.yaml#Electroleech Staff, Fulgurite Pattern"
skills:
  - name: Innate Attack
    spec: Beam
    diff: DX/E
    points: 8
    tags: [Imperium, Adeptus Mechanicus, Electro-Priest]
    lore: >
      The skill that resolves an Electrostatic Gauntlets shot (B61); a
      Fulgurite build should move these points to Staff instead (see the
      Fulgurite lens above).
    design: DX+3 (14) for 8 points, Easy (B170).
  - name: Theology
    spec: Cult Mechanicus
    diff: IQ/H
    points: 12
    tags: [Imperium, Adeptus Mechanicus]
    lore: >
      Deep, willingly-embraced doctrine of the Motive Force -- an
      Electro-Priest's whole identity is built on this, unlike a Skitarii's
      much lighter catechism; see Imperium/Skills/Imperial Skills.skl.
    design: IQ+2 (12) for 12 points, Hard.
  - include: "mechanicus/skills/skills.yaml#Savoir-Faire"
    spec: Adeptus Mechanicus
    points: 1
    design: IQ+0 (10) for 1 point, Easy.
  - name: Intimidation
    diff: Will/A
    points: 2
    tags: [Imperium]
    lore: A crackling, sparking, doctrinally certain zealot needs no words to be threatening.
    design: Will+0 (12) for 2 points, Average.
  - name: Brawling
    diff: DX/E
    points: 1
    tags: [Imperium]
    lore: Unarmed and improvised fighting.
    design: DX+0 (11) for 1 point, Easy.
  - name: Climbing
    diff: DX/A
    points: 1
    tags: [Imperium]
    lore: Basic temple-guard fitness.
    design: DX-1 (10) for 1 point, Average.
  - name: Running
    diff: HT/A
    points: 1
    tags: [Imperium]
    lore: Basic conditioning.
    design: HT-1 (11) for 1 point, Average.
  - name: Meditation
    diff: IQ/H
    points: 2
    tags: [Imperium]
    lore: The trance-discipline that keeps a permanently electrified body and an equally charged faith both under control.
    design: IQ-1 (9) for 2 points, Hard.
  - name: Staff
    diff: DX/A
    points: 0
    tags: [Imperium, Adeptus Mechanicus, Electro-Priest]
    lore: >
      The electroleech staff's weapon skill, per framework.md's
      weapon-skill table (Staff covers polearm-length two-handed staves).
      Bought at 0 points in the Corpuscarii baseline; a Fulgurite build
      moves the 8 points off Innate Attack (Beam) above onto this skill,
      raised to 12 points (DX+3, 14, Average), leaving the Fulgurite total
      at the baseline figure.
    design: >
      Listed here so a Fulgurite conversion has an obvious line to raise;
      contributes 0 points to this template's baseline total.
