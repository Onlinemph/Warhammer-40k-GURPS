kind: template
output: Adeptus Mechanicus/Templates/Skitarii Ranger.gct
notes: >
  A Skitarii Ranger: rank-and-file line infantry of a Forge World's Legio
  Cybernetica-adjacent Skitarii maniples, armed with galvanic rifles and
  built for sustained firefights at range (their Vanguard counterparts,
  Adeptus Mechanicus/Templates/Skitarii Vanguard.gct, favor close-range
  radium weapons instead). Point math: ST 12 (+20), DX 13 (+60), IQ 10
  (+0), HT 12 (+20) = 100; advantages +102 (Combat Reflexes 15 + Ballistic
  Auto-senses 24 + Augmetic Legs, Combat Pattern 29 + Respirator Plugs 5 +
  Subdermal Armour Plating (3 levels, DR 3) 15 + Noospheric Link 8 + Skitarii Doctrina
  Imperatives, effective 6 once GCS applies its native Alternative
  Abilities discount rather than the 10 its full-price children would sum
  to in a plain container); disadvantages -72; skills +63. Mechanicus Rank
  is included disabled by default (see that trait for when to enable it).
  Total 193 points: just above framework.md's "Trained soldier (100-175)" tier and
  below "Elite human (200-350)", matching Skitarii's place in the fiction
  as tougher and better-equipped than a Guardsman but still treated as
  expendable line infantry by their own Priesthood. Weapons (galvanic
  rifle, radium carbine, etc.) are equipment, not covered here.
traits:
  - name: ST
    points: 20
    tags: [Attribute]
    lore: Skitarii physical conditioning and augmetic reinforcement together produce a soldier stronger than an ordinary Guardsman.
    design: ST 12 (+2), 10 pts/level (B15).
  - name: DX
    points: 60
    tags: [Attribute]
    lore: Cybernetic reflex conditioning and constant live-fire drilling.
    design: DX 13 (+3), 20 pts/level (B15).
  - name: IQ
    points: 0
    tags: [Attribute]
    lore: Average intelligence; Skitarii conditioning narrows initiative and affect, not raw intellect.
    design: IQ 10 (baseline), 20 pts/level (B15).
  - name: HT
    points: 20
    tags: [Attribute]
    lore: Augmetic reinforcement and conditioning produce real battlefield endurance.
    design: HT 12 (+2), 10 pts/level (B14).
  - name: Combat Reflexes
    points: 15
    ref: B43
    tags: [Advantage, Mental, Imperium]
    lore: Drilled, doctrina-reinforced reactions under fire.
    design: Basic Set Combat Reflexes (B43), 15 points.
  - include: "mechanicus/traits/augmetics.yaml#Ballistic Auto-senses, Sicarian/Ranger Pattern"
  - include: "mechanicus/traits/augmetics.yaml#Augmetic Legs, Combat Pattern (Matched Pair)"
  - include: "mechanicus/traits/augmetics.yaml#Respirator Plugs (Filtration Lungs)"
  - include: "mechanicus/traits/augmetics.yaml#Subdermal Armour Plating"
    levels: 3
  - include: "mechanicus/traits/augmetics.yaml#Noospheric Link"
  - include: "mechanicus/traits/augmetics.yaml#Skitarii Doctrina Imperatives"
  - include: "mechanicus/traits/augmetics.yaml#Mechanicus Rank"
    levels: 1
    disabled: true
    lore: >
      Disabled by default: most Rangers hold no formal Mechanicus rank at
      all. Enable at level 1 (+5 points) for a Skitarii Alpha or veteran
      squad leader.
  - include: "mechanicus/traits/augmetics.yaml#Skitarii Conditioning"
  - include: "mechanicus/traits/augmetics.yaml#Fanaticism (The Omnissiah)"
  - include: "mechanicus/traits/augmetics.yaml#Duty (Adeptus Mechanicus)"
    points: -15
    notes: >
      Overridden to -15 (almost always hazardous) rather than this trait's
      -10 baseline: a Skitarii's Duty is combat service, not a workshop
      posting.
  - include: "imperium/common/imperial-traits.yaml#Intolerance (Xenos)"
  - name: Doesn't Question a Doctrina Imperative
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: A Skitarii obeys the uploaded battle-doctrina without hesitation, for good or ill.
