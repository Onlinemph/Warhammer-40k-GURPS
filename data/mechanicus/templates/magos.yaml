    design: IQ+2 (17) for 8 points, Average.
  - name: Hidden Lore
    spec: Xenos
    diff: IQ/A
    points: 4
    tags: [Imperium]
    lore: Xenotech familiarity, useful and doctrinally suspect in equal measure; see Imperium/Skills/Imperial Skills.skl.
    design: IQ+1 (16) for 4 points, Average.
  - name: Research
    diff: IQ/A
    points: 4
    tags: [Imperium]
    lore: Archive work across Administratum and Mechanicus record-stacks.
    design: IQ+1 (16) for 4 points, Average.
  - name: Administration
    diff: IQ/A
    points: 4
    tags: [Imperium]
    lore: Running a manufactorum wing's staff, output quotas, and requisitions.
    design: IQ+1 (16) for 4 points, Average.
  - name: Chemistry
    diff: IQ/H
    points: 4
    tags: [Imperium]
    lore: Promethium refining, unguent synthesis, and the occasional forensic question.
    design: IQ+0 (15) for 4 points, Hard.
  - name: Physics
    diff: IQ/H
    points: 4
    tags: [Imperium]
    lore: Theoretical grounding for plasma, void shield, and reactor work.
    design: IQ+0 (15) for 4 points, Hard.
  - include: "mechanicus/skills/skills.yaml#Language"
    spec: Binharic
    points: 8
    design: IQ+2 (17) for 8 points, Average — fluent, Magos-grade command of the cant.
  - include: "mechanicus/skills/skills.yaml#Savoir-Faire"
    spec: Adeptus Mechanicus
    points: 2
    design: IQ+1 (16) for 2 points, Easy.
  - name: Leadership
    diff: IQ/A
    points: 4
    tags: [Imperium]
    lore: Commanding a manufactorum's Skitarii guard, servitors, and junior adepts.
    design: IQ+1 (16) for 4 points, Average.
  - include: "imperium/common/skills.yaml#Current Affairs"
