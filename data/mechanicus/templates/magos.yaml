kind: template
output: Adeptus Mechanicus/Templates/Magos.gct
notes: >
  A Magos: a senior Tech-Priest running a manufactorum wing, an Explorator
  fleet vessel, or a specialist attachment to an Inquisitorial or Militarum
  force, decades past an Enginseer's field-repair role and correspondingly
  more heavily augmented, ranked, and educated. Point math: ST 10 (+0),
  DX 12 (+40), IQ 15 (+100), HT 11 (+10) = 150, plus Will +2 (+10) = 160;
  advantages +176; disadvantages -50; skills +119. Total 405 points,
  comfortably inside framework.md's "Senior agents (350-600)" tier. An
  Archmagos or Fabricator-General should raise Mechanicus Rank further and
  add more augmetics/skills on top of this baseline rather than replace it.
traits:
  - name: ST
    points: 0
    tags: [Attribute]
    lore: A Magos spends their career at a lectern and a cogitator bank, not on a firing range.
    design: ST 10 (baseline), 10 pts/level (B15).
  - name: DX
    points: 40
    tags: [Attribute]
    lore: Enough manual precision for delicate augmetic and cogitator work.
    design: DX 12 (+2), 20 pts/level (B15).
  - name: IQ
    points: 100
    tags: [Attribute]
    lore: A working Magos commands a formidable breadth of engineering, archival, and theological learning.
    design: IQ 15 (+5), 20 pts/level (B15).
  - name: HT
    points: 10
    tags: [Attribute]
    lore: Augmetic life support compensates for a body that otherwise spends little time in the field.
    design: HT 11 (+1), 10 pts/level (B14).
  - name: Will
    points: 10
    tags: [Attribute]
    lore: Decades of doctrinal certainty and command responsibility.
    design: Will 17 (+2 above the IQ-derived default of 15), 5 pts/level (B16).
  - name: Fit
    points: 5
    ref: B55
    tags: [Advantage, Physical, Imperium]
    lore: What field fitness remains after decades in a forge is maintained as much by augmetics as exercise.
    design: Basic Set Fit (B55), 5 points.
  - include: "mechanicus/traits/augmetics.yaml#Cranial Circuitry"
  - include: "mechanicus/traits/augmetics.yaml#Cortex Implant, Logis Pattern"
  - include: "mechanicus/traits/augmetics.yaml#Multi-lens Oculars, Magos Pattern"
  - include: "mechanicus/traits/augmetics.yaml#Respirator Plugs (Filtration Lungs)"
  - include: "mechanicus/traits/augmetics.yaml#Subdermal Armour Plating"
    levels: 2
  - include: "mechanicus/traits/augmetics.yaml#Servo-Arm"
  - include: "mechanicus/traits/augmetics.yaml#Mechadendrite, Utility Pattern"
  - include: "mechanicus/traits/augmetics.yaml#Noospheric Link"
  - include: "mechanicus/traits/augmetics.yaml#Logis Cogitator"
    levels: 2
  - include: "mechanicus/traits/augmetics.yaml#Potentia Coil"
    levels: 1
  - include: "mechanicus/traits/augmetics.yaml#Mechanicus Rank"
    levels: 5
    lore: A Magos in good standing, several ranks above an Enginseer and below an Archmagos.
  - include: "mechanicus/traits/augmetics.yaml#Disciplines of the Cult Mechanicus"
  - include: "mechanicus/traits/augmetics.yaml#Duty (Adeptus Mechanicus)"
  - include: "mechanicus/traits/augmetics.yaml#Distrust of Flesh"
  - include: "mechanicus/traits/augmetics.yaml#Dependency (Maintenance Rites and Sacred Unguents)"
  - include: "mechanicus/traits/augmetics.yaml#Social Stigma (Heavily Augmented)"
  - include: "imperium/common/imperial-traits.yaml#Callous"
    lore: >
      Data and the Machine God's work outweigh any single life, including
      (a Magos will tell you) their own — a working assumption behind a
      great deal of what the Mechanicus does to and with its Servitors.
  - name: Speaks of People the Way Others Speak of Components
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: Decades of augmetic replacement and cogitator logic have a way of flattening a Magos' language.
  - name: Never Without a Data-Slate or Servo-Skull in Attendance
    points: -1
    tags: [Quirk, Imperium]
    design: Quirk (B9), roleplaying flag only.
    lore: A Magos' authority is bound up in visible ritual and record-keeping.
skills:
  - name: Engineer
    spec: Combat Engineering
    diff: IQ/H
    points: 8
    tags: [Imperium, Adeptus Mechanicus]
    lore: Field and forge-level repair, modification, and fabrication of matériel.
    design: IQ+1 (16) for 8 points, Hard (B170).
  - name: Engineer
    spec: Powered Armor
    diff: IQ/H
    points: 8
    tags: [Imperium, Adeptus Mechanicus]
    lore: Power armour and exoskeleton maintenance and modification, at TL10-11.
    design: IQ+1 (16) for 8 points, Hard.
  - name: Engineer
    spec: Starships
    diff: IQ/H
    points: 8
    tags: [Imperium, Adeptus Mechanicus]
    lore: Void-hull and drive-core engineering, a Magos' route to an Explorator or Navy attachment.
    design: IQ+1 (16) for 8 points, Hard.
  - name: Mechanic
    spec: Ground Vehicles
    diff: IQ/A
    points: 8
    tags: [Imperium, Adeptus Mechanicus]
