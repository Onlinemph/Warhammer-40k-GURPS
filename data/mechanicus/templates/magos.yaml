    design: IQ+1 (16) for 4 points, Average.
  - name: Physician
    diff: IQ/H
    points: 8
    tags: [Imperium]
    lore: Biological (as opposed to augmetic) medicine, kept current for supervising augmentation surgery.
    design: IQ+1 (16) for 8 points, Hard.
  - name: Surgery
    diff: IQ/VH
    points: 8
    tags: [Imperium]
    lore: The surgical half of augmetic implantation.
    design: IQ+0 (15) for 8 points, Very Hard.
  - name: Theology
