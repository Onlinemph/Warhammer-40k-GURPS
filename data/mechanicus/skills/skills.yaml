kind: skills
output: Adeptus Mechanicus/Skills/Mechanicus Skills.skl
items:
  # Framework note (docs/framework.md, "Skills"): Mechanicus rites are
  # already covered by Engineer/Mechanic/Armoury at the item's TL for the
  # technical side, and by Theology (Cult Mechanicus) (Imperium/Skills/
  # Imperial Skills.skl) for the faith side; Hidden Lore (Archeotech) also
  # already exists in that same file. None of those are duplicated here.
  # Only genuinely new skills go in this file.
  - name: Language
    spec: Binharic
    diff: IQ/A
    tags: [Mental, Imperium, Adeptus Mechanicus]
    ref: B23
    lore: >
      The Cult Mechanicus' machine-cant: a clipped, heavily compressed
      binary/logical language spoken and sub-vocalized between adepts,
      servitors, and machine spirits alike, ranging from a few ritual
      phrases a menial picks up to the dense technical liturgy a Magos
      trades with another Magos.
    design: >
      Basic Set Language (B23), a new specialization; not a new skill in
      its own right. Buy levels (Broken/Accented/Native) exactly as any
      other Language, per B23's own rules.
  - name: Savoir-Faire
    spec: Adeptus Mechanicus
    diff: IQ/E
    defaults: ["IQ-4"]
    tags: [Mental, Imperium, Adeptus Mechanicus]
    ref: B218
    lore: >
      Court protocol inside the Priesthood: correct forms of address for a
      Magos or Archmagos, ritual precedence between Forge Worlds and
      Explorator fleets, and which questions are simply never asked of a
      superior adept. Not attested under this exact name in the fiction,
      but the Mechanicus is consistently shown (across Black Library and
      codex background) to run on a court culture at least as rigid as the
      Ecclesiarchy's own.
    design: >
      New specialization of Basic Set Savoir-Faire (B218), by the same
      reasoning and construction this project already used for Savoir-Faire
      (Ecclesiarchy) in Imperium/Skills/Imperial Skills.skl: same skill,
      same difficulty, applied to a hierarchy the game needs and the
      catalogue doesn't name.
  # Expert Skill (Rites of Maintenance) and similar were considered and
  # skipped: per framework.md, the actual technical work of keeping a
  # machine running is already Engineer/Mechanic/Armoury at the item's TL,
  # and the ritual/liturgical side of that work is already Theology (Cult
  # Mechanicus). A separate "Rites of Maintenance" skill would duplicate
  # both without covering anything they don't.
