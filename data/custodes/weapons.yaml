kind: equipment
output: Adeptus Custodes/Weapons/Custodes Weapons.eqp
# Weapon handling stats (weight, min ST, RoF, Shots, Bulk, Recoil, Acc) are
# each derived individually per weapon per framework.md's "Weapon handling
# stats" section: weight from lore first, min ST from roughly
# sqrt(10 x loaded weight) adjusted for balance/recoil, RoF from the actual
# firing mechanism, Bulk/Recoil/Acc from length, mass and mechanism. Nothing
# here is copied from a neighbouring entry's stat line; every weapon's
# `design` field shows its own derivation. All Custodes power weapons use
# the framework's Custodes-specific power-field rule (mundane baseline +4d,
# Armor Divisor (10) - one step above the general +3d Astartes/human power-
# field rule in Imperium/Weapons/Melee Weapons.eqp) and all bolt casters use
# the fixed boltgun anchor (6dx2(2) pi++, follow-up 6d cr ex), per
# framework.md's Adeptus Custodes physiology table.
items:

  # -------------------------------------------------------------- Guardian Spear

  - name: Guardian Spear
    tl: 12
    lc: 0
    cost: 50000
    weight: 55
    tags: [Melee Weapon, Missile Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Spearhead, field on
        damage: thr+4d+3(10) imp
        reach: "1,2*"
        parry: 0
        st: 23†
        skill: Spear
      - usage: Spearhead, field off (as plain blade)
        damage: thr+3 imp
        reach: "1,2*"
        parry: 0
        st: 23†
        skill: Spear
      - usage: Bolt caster
        damage: 6dx2(2) pi++
        acc: 3
        range: 150/600
        rof: 3
        shots: 12(3)
        st: 23†
        bulk: -6
        rcl: 3
        skill: Guns (Rifle)
      - usage: Bolt caster, follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 3
        range: 150/600
        rof: 3
        shots: 12(3)
        st: 23†
        bulk: -6
        rcl: 3
        skill: Guns (Rifle)
    notes: >
      The signature Custodian sidearm: a master-crafted disruption-field
      spear with a bolt caster built into the haft below the blade. Field
      toggle is a free action, as any power weapon.
    lore: >
      The guardian spear is the standard wargear of the rank-and-file
      Custodian Guard across current Codex: Adeptus Custodes background and
      Chris Wraight's novels (chiefly Watchers of the Throne: The
      Emperor's Legion), combining a disruption-field blade with an integral bolt
      weapon so a Custodian never has to choose between melee and ranged
      threats. Named Custodians are repeatedly shown fighting one-handed
      with it despite its size.
    design: >
      Weight: 55 lb loaded, reasoned up from the framework's own Astartes
      boltgun figure (35-40 lb) for the added mass of a full polearm haft,
      an integrated blade, and a Custodian-scale gun mechanism on a weapon
      built for a 2.5-3 m wielder. Min ST: sqrt(10x55) = 23.5, rounded to
      23, marked two-handed (†); Custodian ST 40 is 1.7x that minimum, past
      the standard 1.5x threshold for one-handed use, which is exactly why
      the fiction shows Custodians one-handing it. Melee: reach 1,2* and
      Spear skill as a two-handed thrusting polearm (Basic Set convention);
      parry 0 as a balanced weapon rather than a clumsy one. Mundane
      baseline thr+3 imp (one step above the human/Astartes Power Lance's
      braced thr+2 baseline, reflecting a heavier, Custodes-forged
      spearhead); field on adds the Custodes power-field bonus (+4d,
      Armor Divisor 10) for thr+4d+3(10) imp. At Custodian ST 40 (thr =
      4d+1 per the Basic Set high-ST damage table) this totals 8d+4 (avg
      32): by exact dice distribution it penetrates carapace (DR 70, eff.
      7), Astartes power armour (DR 100, eff. 10) and Auramite (DR 150,
      eff. 15) essentially always (100%), Terminator plate (DR 200, eff.
      20) 99.3% of the time, and even Allarus plate (DR 250, eff. 25) 90.9%
      of the time - comfortably beating an armoured Space Marine in melee
      "most of the time" as the assignment requires, and remaining a real
      threat to the very heaviest infantry armour in the setting. Bolt
      caster: fixed boltgun anchor (6dx2(2) pi++ / 6d cr ex follow-up,
      framework.md). RoF 3 (semi-automatic mechanism, matching the boltgun
      convention rather than a slower single-shot action). Acc 3 and range
      150/600, both below the dedicated Umbra/Godwyn boltgun's Acc 4 and
      200/1000, since the barrel is shorter and buried in the spear haft
      rather than built as a dedicated long gun. Shots 12(3): a smaller
      integral magazine than a backpack-fed boltgun's 24, reflecting the
      space the blade mechanism and haft take up. Bulk -6: bulkier than
      even an Astartes boltgun's already-heavy -4, since the whole weapon
      is spear-length and carried as a polearm first, a gun second. Rcl 3,
      unchanged from the standard bolt round's kick regardless of mount.
      Against Astartes power armour (eff. 50) the bolt caster penetrates
      14.5% of hits, identical to a standard boltgun's own figure, as the
      framework specifies for its bolt casters.

  # -------------------------------------------------------------- Sentinel Blade

  - name: Sentinel Blade
    tl: 12
    lc: 0
    cost: 42000
    weight: 20
    tags: [Melee Weapon, Missile Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Blade, field on
        damage: sw+4d+2(10) cut
        reach: 1
        parry: 0
        st: 17
        skill: Broadsword
      - usage: Blade, field off (as plain blade)
        damage: sw+2 cut
        reach: 1
        parry: 0
        st: 17
        skill: Broadsword
      - usage: Bolt caster
        damage: 6dx2(2) pi++
        acc: 2
        range: 120/400
        rof: 3
        shots: 10(3)
        st: 17
        bulk: -3
        rcl: 3
        skill: Guns (Pistol)
      - usage: Bolt caster, follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 2
        range: 120/400
        rof: 3
        shots: 10(3)
        st: 17
        bulk: -3
        rcl: 3
        skill: Guns (Pistol)
    notes: >
      A one-handed alternative to the guardian spear, pairing the blade
      with a praesidium shield or a second sentinel blade. Field toggle is
      a free action.
    lore: >
      Carried by Custodian Wardens and other Custodians who favour a
      one-handed blade over the spear, often alongside a praesidium
      shield; consistently depicted in current Codex background as no
      less deadly than the guardian spear, trading reach for a free hand.
    design: >
      Weight: 20 lb, reasoned as roughly the combined mass of an Astartes
      bolt pistol (4-4.5 lb) and Astartes chainsword (14 lb) fused into one
      Custodes-scale hilt, since it packs a full boltgun-anchor mechanism
      (see below) and a broadsword-length blade into a single one-handed
      unit. Min ST: sqrt(10x20) = 14.1, adjusted up to 17 for the
      leverage/balance penalty of a very dense, front-heavy one-handed
      weapon (the same kind of upward adjustment the framework's Astartes
      chainsword takes over its own raw sqrt(10x14)=11.8). Melee: reach 1,
      Broadsword skill, parry 0 (a well-balanced blade despite its bulk).
      Mundane baseline sw+2 cut - heavier than the human/Astartes Power
      Sword's sw+1 baseline, for a Custodes-forged blade with more mass
      behind the edge; field on adds the Custodes +4d(10) to that mundane
      baseline for sw+4d+2(10) cut. At Custodian ST 40 (sw = 5d-1) this totals 9d+1
      (avg 32.5): penetrates carapace, Astartes power armour and Auramite
      at 100%, Terminator plate 99.1%, and Allarus plate 91.3% (exact dice
      distribution) - essentially identical performance to the guardian
      spear's own melee mode, as befits two patterns of the same
      underlying Custodes power weapon. Bolt caster: the framework is
      explicit that Custodes bolt casters use the full boltgun anchor
      (6dx2(2) pi++ / 6d cr ex) even in this one-handed sidearm, not a
      reduced pistol-scale round - a deliberate lore point that a
      Custodian's sidearm hits as hard as an Astartes' primary weapon.
      RoF 3 (semi-auto, as any bolt weapon on this file). Acc 2 and range
      120/400 match the human-scale bolt pistol anchor's own figures,
      since this is fired one-handed despite the full-power round. Shots
      10(3): slightly more than a standard bolt pistol's 8, for a larger
      Custodes-grade magazine. Bulk -3: worse than a plain bolt pistol's
      -2 for the added blade housing, better than the guardian spear's -6
      since it's still a one-handed sidearm, not a polearm. Rcl 3,
      unchanged bolt-round kick.

  # -------------------------------------------------------------- Castellan Axe

  - name: Castellan Axe
    tl: 12
    lc: 0
    cost: 44000
    weight: 45
    tags: [Melee Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Field on
        damage: sw+4d+4(10) cut
        reach: 1
        parry: -1
        st: 22†
        skill: Two-Handed Axe/Mace
      - usage: Field off (as plain axe)
        damage: sw+4 cut
        reach: 1
        parry: -1
        st: 22†
        skill: Two-Handed Axe/Mace
    notes: Field toggle is a free action, as any Custodes power weapon.
    lore: >
      An alternative to the guardian spear for Custodian Guard who favour
      raw cleaving power over reach, usually paired with a heater/
      praesidium shield; current Codex background depicts it as slower to
      bring to bear than a spear but hitting harder per blow.
    design: >
      Weight: 45 lb, lighter than the guardian spear's 55 lb spearhead-
      plus-boltgun assembly (which carries a gun mechanism this axe lacks),
      so it is reasoned from the Astartes chainaxe (15 lb, a Marine-scale
      two-handed-capable axe) scaled up roughly three-fold for a Custodes-
      scale two-handed axe-head plus power-field generator. Min ST:
      sqrt(10x45) = 21.2, rounded up to 22 (marked two-handed, †) for the
      extra leverage penalty axes traditionally carry over swords of
      similar weight. Reach 1, Two-Handed Axe/Mace skill, parry -1 (the
      standard axe defensive penalty). Mundane baseline sw+4 cut, the
      highest field-off baseline of any melee weapon on this file,
      reflecting a genuinely heavy axe-head rather than a blade;
      field on adds the Custodes +4d(10) for sw+4d+4(10) cut. At Custodian
      ST 40 (sw = 5d-1) this totals 9d+3 (avg 34.5): penetrates carapace,
      Astartes power armour and Auramite at 100%, Terminator plate 99.8%,
      and Allarus plate 96.1% (exact dice distribution) - the single
      hardest-hitting Custodes power weapon in this file, matching its
      "hits harder, handles clumsier" reputation.

  # -------------------------------------------------------------- Misericordia

  - name: Misericordia
    tl: 12
    lc: 0
    cost: 20000
    weight: 5
    tags: [Melee Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Field on
        damage: thr+4d+1(10) imp
        reach: C,1
        parry: 0
        st: 9
        skill: Shortsword
      - usage: Field off (as plain blade)
        damage: thr+1 imp
        reach: C,1
        parry: 0
        st: 9
        skill: Shortsword
    notes: >
      A Custodian's personal sidearm/backup blade and traditional
      execution weapon - drawn to finish a fight the spear or axe can't,
      or to deliver a clean death to a beaten foe. Field toggle is a free
      action.
    lore: >
      Codex background and Custodes iconography both show a small,
      ornate power dagger worn at a Custodian's side alongside the primary
      weapon, named for the mercy-blades of real medieval knights (a
      misericorde delivered a coup de grace through an armoured opponent's
      joints) - this project reads the name as deliberately evoking that
      real-world weapon rather than any single cited in-universe passage.
    design: >
      Weight: 5 lb - small by Custodes standards but still a substantial
      blade at their scale, following the same logic as the framework's
      Astartes combat knife (built on the human Shortsword profile rather
      than a scaled-up knife, since a "small" blade in a Custodian's hand
      still reads as a functional shortsword). Min ST: sqrt(10x5) = 7.1,
      rounded up to 9 to account for the dense power-field generator built
      into the hilt of an otherwise light blade. Reach C,1, Shortsword
      skill, parry 0. Mundane baseline thr+1 imp, matching the Astartes
      combat knife's own thrust baseline; field on adds the Custodes
      +4d(10) to that baseline for thr+4d+1(10) imp. At Custodian ST 40 (thr = 4d+1) this
      totals 8d+2 (avg 30): penetrates carapace, Astartes power armour and
      Auramite at 99.9-100%, Terminator plate 97.6%, and Allarus plate
      82.1% (exact dice distribution) - a shade behind the full-size
      Custodes power weapons above, appropriate for a backup blade rather
      than a primary one, but still lethal even against the heaviest
      infantry plate in a Custodian's hand.

  # -------------------------------------------------------------- Pyrithite Spear

  - name: Pyrithite Spear
    tl: 12
    lc: 0
    cost: 48000
    weight: 58
    tags: [Melee Weapon, Missile Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Spearhead, field on
        damage: thr+4d+3(10) imp
        reach: "1,2*"
        parry: 0
        st: 24†
        skill: Spear
      - usage: Spearhead, field off (as plain blade)
        damage: thr+3 imp
        reach: "1,2*"
        parry: 0
        st: 24†
        skill: Spear
      - usage: Pyrithite cone (6 yards)
        damage: 6d+2 burn
        range: 6
        rof: 1
        shots: 5(20)
        st: 24†
        bulk: -6
        skill: Liquid Projector (Flamethrower)
        notes: >
          No Acc bonus and no aiming roll needed against a target inside
          the cone (B412); treat cover as halved, per the framework's
          flame-weapon rules.
      - usage: Pyrithite cone, follow-up (per turn while ablaze)
        damage: 1d+1 burn
        range: 6
        rof: 1
        shots: 5(20)
        st: 24†
        bulk: -6
        skill: Liquid Projector (Flamethrower)
        notes: >
          Ignores DR against anything not hermetically sealed; see the
          Imperium Flame Weapons file for the shared sealed-armour
          exemption this follow-up carries.
    notes: >
      A guardian spear pattern that replaces the bolt caster with a
      pyrithite promethium-analogue projector; used where an area
      incendiary effect matters more than a single penetrating round.
    lore: >
      Codex: Adeptus Custodes background lists the pyrithite spear among
      the Custodian Guard's ranged wargear options as a spear-mounted fire
      weapon; this project has not found a page-precise technical
      description of the pyrithite compound itself beyond "burns hotter
      and clings worse than standard promethium," which is the detail this
      build leans on.
    design: >
      Melee mode is identical in derivation to the Guardian Spear above
      (same spearhead, same power field): weight is 3 lb heavier (58 lb)
      for the fuel reservoir replacing the bolt mechanism's ammunition
      feed, so min ST rises to sqrt(10x58)=24.1, rounded to 24†; all melee
      figures otherwise match the Guardian Spear exactly for the same
      reasons. Ranged mode is built one clear step above the Imperium
      Flame Weapons file's Heavy Flamer (5d burn, 8-yard cone, ST 12) to
      reflect pyrithite's "burns hotter" reputation and Custodes-grade
      manufacture, at 6d+2 burn: average 23 penetrates flak (DR 30) only 3.6%
      of the time and mesh (DR 36) never (exact dice distribution): it
      burns unarmoured and lightly-armoured infantry and is stopped by any
      real armour, like the flame family generally, and does nothing to
      rigid plate (0% vs carapace DR 70). Its real threat against armoured
      targets is the ignition follow-up, which ignores DR. Cone range (6 yards) sits between the Flamer (5)
      and Heavy Flamer (8), and the fuel reservoir (5 charges) is smaller
      than the Heavy Flamer's 6 for the reduced space left by the spear
      haft. RoF 1 and no Acc follow the shared flame-weapon convention
      (B412); Bulk -6 matches the Guardian Spear's own polearm-length
      bulk. The DR-ignoring follow-up is 1d+1, matching the Heavy
      Flamer's follow-up (the follow-up scaling in the Imperium file
      plateaus at that rate), and keeps the same sealed-armour exemption used
      throughout that file.

  # -------------------------------------------------------------- Adrasite Spear

  - name: Adrasite Spear
    tl: 12
    lc: 0
    cost: 55000
    weight: 60
    tags: [Melee Weapon, Missile Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Spearhead, field on
        damage: thr+4d+3(10) imp
        reach: "1,2*"
        parry: 0
        st: 24†
        skill: Spear
      - usage: Spearhead, field off (as plain blade)
        damage: thr+3 imp
        reach: "1,2*"
        parry: 0
        st: 24†
        skill: Spear
      - usage: Adrathic discharge, short range
        damage: 8dx6(10) burn
        acc: 1
        range: 5/20
        rof: 1
        shots: 4(10)
        st: 24†
        bulk: -6
        rcl: 1
        skill: Beam Weapons (Rifle)
      - usage: Adrathic discharge, beyond ½D
        damage: 4dx6(3) burn
        acc: 1
        range: 5/20
        rof: 1
        shots: 4(10)
        st: 24†
        bulk: -6
        rcl: 1
        skill: Beam Weapons (Rifle)
    notes: >
      A rarer guardian spear pattern mounting a short-ranged melta-class
      thermal projector instead of a bolt caster, for boarding actions and
      anti-armour work.
    lore: >
      This project has not located a confident Black Library or current
      Codex citation for the "adrasite spear" specifically (as distinct
      from the widely-documented pyrithite spear); it is included here as
      a plausible archeotech Custodes spear pattern, following the same
      naming convention as Custodes wargear generally. GM-optional and
      low-confidence: treat it as a re-skinned meltagun (its ranged lines
      are the meltagun anchor, borrowed on purpose) until a firmer source
      turns up.
    design: >
      Melee mode is identical to the Guardian Spear (same weight-driven
      ST derivation, same power field), at 60 lb / ST 24† for the extra
      mass of a thermal reservoir and focusing array replacing the bolt
      mechanism. The ranged mode reuses the framework's own Meltagun
      anchor outright (8dx6(10) burn short range, 4dx6(3) burn beyond -
      see framework.md's weapon table) rather than inventing new
      penetration numbers for an uncertain weapon: "adrathic" is read as
      the same short-ranged, armour-melting principle as a meltagun,
      simply built into a Custodes-scale spear rather than a rifle, which
      is why this entry borrows the anchor's exact figures instead of
      deriving its own. Range (5/20) is shorter than a standalone
      meltagun's typical use case, reflecting the shorter, spear-integrated
      nozzle; RoF 1, Acc 1 and Rcl 1 follow the same single-shot,
      short-ranged beam-weapon convention the framework specifies for
      melta-class weapons. Checked by exact dice distribution against both
      tables: at short range the anchor's 8dx6(10) burn (avg 168, eff. DR
      never above 25 for anything modelled in this project) penetrates
      every personal or vehicle armour anchor here at 99.99%+, matching
      the framework's own claim that a meltagun "kills AV14 (eff DR 35) at
      short range" outright. Beyond ½D, 4dx6(3) burn (avg 84) is far less
      certain: it penetrates carapace (eff. 20) 100%, Astartes power
      armour (eff. 33.3) 99.6%, Auramite (eff. 50) 94.6%, Terminator plate
      (eff. 66.7) 76.1%, and Allarus plate (eff. 83.3) 55.6%; against
      vehicles, AV12 (eff. 66.7) 76.1%, AV13 (eff. 91.7) 33.6%, and AV14
      (eff. 116.7) only 5.4% - identical to the framework's own stated
      meltagun-beyond-½D figures, so this weapon is a guaranteed kill up
      close and a real but unreliable threat at range, exactly like the
      rifle-form meltagun it borrows from.

  # -------------------------------------------------------------- Interceptor Lance

  - name: Interceptor Lance
    tl: 12
    lc: 0
    cost: 60000
    weight: 50
    tags: [Melee Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Field on, mounted charge
        damage: thr+4d+4(10) imp
        reach: "1,2*,3*"
        parry: -1
        st: 24
        skill: Spear
      - usage: Field on, braced (dismounted)
        damage: thr+4d+3(10) imp
        reach: "1,2"
        parry: -1
        st: 24
        skill: Spear
      - usage: Field off, mounted charge
        damage: thr+4 imp
        reach: "1,2*,3*"
        parry: -1
        st: 24
        skill: Spear
    notes: >
      Carried one-handed by Vertus Praetors riding Dawneagle jetbikes for
      mounted charges; this entry is the lance only. A Vertus Praetor's
      jetbike mounts its own separate hull weapons, not covered here.
    lore: >
      Codex: Adeptus Custodes background describes the interceptor lance
      as the signature weapon of jetbike-mounted Vertus Praetors, used in
      high-speed charges; this project has deliberately not extended the
      entry to cover jetbike-mounted guns, since it has no confident,
      specific source for those weapons' own numbers.
    design: >
      Weight: 50 lb, comparable to the Guardian Spear's 55 lb since it is
      a similarly-sized power spear, slightly lighter for a design meant
      to be swung one-handed at speed rather than braced two-handed. Min
      ST: sqrt(10x50) = 22.4, adjusted up to 24 (no † - it is used
      one-handed, at the cost of a poorer parry) to reflect the extra
      difficulty of controlling such a long weapon one-handed while
      riding. Reach and mounted-charge structure follow the human-scale
      Power Lance's own three-line pattern (mounted charge / braced
      dismounted / field-off mounted charge) from Imperium/Weapons/Melee
      Weapons.eqp, scaled to the Custodes power-field rule: mundane
      baseline thr+3 imp braced (as the Guardian Spear) with the lance's
      usual +1 mounted-charge momentum bonus, field on adding +4d(10).
      Mounted charge, field on: thr+4d+4(10) imp (mundane baseline thr+4, +4d) = 8d+5
      at Custodian ST 40 (avg 33), penetrating carapace, Astartes power
      armour and Auramite at 100%, Terminator plate 99.6%, and Allarus
      plate 93.9% (exact dice distribution) - the single most reliable
      Custodes weapon against the very heaviest infantry plate in this
      file, fitting its role as a dedicated shock-cavalry weapon. Braced
      (dismounted) drops to the same thr+4d+3(10) imp as the Guardian
      Spear's own thrust, since the field itself doesn't care whether the
      wielder is moving.

  # -------------------------------------------------------------- Vexilla

  - name: Lastrum Bolt Gun (Sagittarum Pattern)
    tl: 12
    lc: 0
    cost: 46000
    weight: 42
    tags: [Missile Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Lastrum bolt
        damage: 6dx2(2) pi++
        acc: 5
        range: 250/1200
        rof: 3
        shots: 24(3)
        st: 21†
        bulk: -6
        rcl: 3
        skill: Guns (Rifle)
      - usage: Lastrum bolt, follow-up (if bolt penetrates)
        damage: 6d cr ex
        acc: 5
        range: 250/1200
        rof: 3
        shots: 24(3)
        st: 21†
        bulk: -6
        rcl: 3
        skill: Guns (Rifle)
    notes: >
      The long-range bolt weapon of the Sagittarum Guard, the ranged
      wing of the Custodian Guard. Lower-confidence entry: the role is
      well attested, the exact technical detail is not.
    lore: >
      The Sagittarum Guard are the Custodes' ranged specialists, drawn
      from Custodians who favour the lastrum bolt gun (a Custodes-grade
      bolt weapon) over the melee-and-caster spear. This project has no
      page-precise source for the weapon's specifications beyond its role
      in current Codex: Adeptus Custodes background, and treats it as a
      GM-optional entry.
    design: >
      Uses the fixed Custodes boltgun anchor (6dx2(2) pi++, 6d cr ex
      follow-up), as every Custodes bolt caster on this file. Handling is
      set from its role as a precision long gun: weight 42 lb (a little
      above the Astartes boltgun's 35-40 lb for a longer barrel and
      Custodes-scale receiver), min ST sqrt(10x42) = 20.5, rounded to 21
      and two-handed (†). Acc 5 and range 250/1200 are a step above the
      Godwyn boltgun's Acc 4, 200/1000 for the longer barrel and
      dedicated sighting. RoF 3 (semi-automatic, as any bolt weapon),
      shots 24(3), Bulk -6 and Rcl 3 for a full-length rifle. A
      Sagittarum jetbike's own guns (hurricane bolters, salvo launchers)
      are deliberately not modelled: no confident source for their
      numbers.

  - name: Vexilla
    tl: 10
    lc: 0
    cost: 8000
    weight: 15
    tags: [Imperium, Adeptus Custodes]
    skill_bonuses: {Leadership: 1}
    reactions:
      - situation: from Imperial forces who see it raised in battle
        amount: 2
    notes: >
      Carried two-handed as a standard/banner, not wielded as a weapon; a
      GM may allow an improvised-weapon strike with the pole at the usual
      improvised-weapon penalties, with no bonus from this entry.
    lore: >
      A Custodian vexillary carries a vexilla - an ornate banner or
      standard - into battle as a rallying point and a mark of the
      formation's importance; current Codex background frames this as
      primarily a morale and ceremonial role rather than a combat one.
    design: >
      Modelled as a small Leadership skill bonus (+1) and a modest
      reaction bonus for allies who see it raised, rather than any weapon
      profile, per its lore role as a standard rather than a wargear item;
      no framework anchor applies since it deals no damage.

  # -------------------------------------------------------------- Shields

  - name: Praesidium Shield
    tl: 12
    lc: 0
    cost: 18000
    weight: 25
    tags: [Melee Weapon, Imperium, Adeptus Custodes]
    attributes: {block: 3}
    weapons:
      - usage: Shield bash
        damage: sw+2 cr
        reach: C,1
        parry: 0
        st: 16
        skill: Shield
    notes: >
      The physical shield only (Basic Set Large Shield stats, DB 3): most
      Custodian Guard carry a plain praesidium shield rather than a
      Storm Shield's added energy field, per current Codex background.
    lore: >
      A round or kite-shaped ceremonial-yet-functional shield carried by
      Custodian Guard alongside a sentinel blade or castellan axe,
      consistently depicted across Codex: Adeptus Custodes art and
      background as a plain (if beautifully made) physical shield rather
      than an energy-shielded item.
    design: >
      Weight: 25 lb, heavier than the Astartes Boarding Shield (15 lb) for
      Custodes scale and materials; min ST: sqrt(10x25)=15.8, rounded to
      16 - trivial for a Custodian at ST 40, matching the ease with which
      they're shown carrying one one-handed alongside a blade. Basic Set
      Large Shield stats (DB 3, +3 Block) as the Astartes Storm Shield's
      own physical component; bash damage sw+2 cr, one step above that
      Storm Shield's sw+1 cr for the heavier Custodes-grade plate.

  - name: Storm Shield, Custodes Pattern (Field Component)
    tl: 12
    lc: 0
    cost: 28000
    weight: 6
    uses: 220
    tags: [Force Field, Energy Shield, Imperium, Adeptus Custodes]
    notes: >
      Shield 220 SP. Recharge: after 2 seconds without taking damage,
      regains 25 SP per second. Covers only attacks from the front and the
      shield-arm side, as the Astartes storm shield. The physical shield's
      Defense Bonus and bash are the Praesidium Shield entry above; a
      Custodes storm shield combines that physical shield with this field.
    lore: >
      Custodian storm shields use the same front-and-side energy
      dispersion field as an Astartes Terminator's, per current Codex
      background, but built to Custodes-grade archeotech standards -
      background repeatedly shows them shrugging off blows (including
      heavy weapons fire) that would break an Astartes' own storm shield
      outright.
    design: >
      Built on the same regenerating-shield rules as the Astartes Storm
      Shield (Field Component) in Imperium/Armour/Force Fields.eqp (160
      SP, 2s delay, 20 SP/s), scaled up per the framework's instruction
      that Custodes tech clearly outclasses Astartes equivalents: 220 SP
      (+37.5%) and a faster 25 SP/s recharge. Checked against a lascannon
      (8dx8, avg 224): the Astartes storm shield's 160 SP stops it
      outright only 6.1% of the time (needs a roll of 20 or less on 8d);
      this Custodes pattern's 220 SP stops it 46.0% of the time (needs 27
      or less) - "clearly outclasses" in concrete terms, turning an
      occasional save into a coin-flip, while still not making a
      Custodian invulnerable to the heaviest weapons in the setting. A
      plasma bolt (6dx4, avg 84) is stopped outright by either shield
      essentially always.

  # -------------------------------------------------------------- Balistus Grenade Launcher

  - name: Balistus Grenade Launcher
    tl: 12
    lc: 0
    cost: 12000
    weight: 30
    tags: [Missile Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Frag shell
        damage: 6d cr ex [3d cr]
        acc: 3
        range: 150/500
        rof: 1
        shots: 6(3)
        st: 20
        bulk: -6
        rcl: 2
        skill: Guns (Grenade Launcher)
        notes: Anti-personnel fragmentation shell; no armour divisor.
      - usage: Krak shell
        damage: 6dx4(3) cr
        acc: 3
        range: 150/500
        rof: 1
        shots: 6(3)
        st: 20
        bulk: -6
        rcl: 2
        skill: Guns (Grenade Launcher)
        notes: Shaped-charge anti-armour shell.
    notes: >
      A rotary-fed, multi-role grenade launcher carried and fired one-
      handed by a Custodian; each shell type is loaded in its own rotary
      cylinder rather than mixed in one magazine.
    lore: >
      Codex: Adeptus Custodes background lists the balistus grenade
      launcher as squad-level Custodian Guard wargear, firing both
      anti-personnel and anti-armour shells; treated as a support option
      rather than every Custodian's default loadout.
    design: >
      Weight: 30 lb, reasoned as a Custodes-scale support weapon roughly
      twice the mass of the Astartes Heavy Bolt Pistol family (6 lb) for
      a full rotary-cylinder launcher, still light enough to fire
      one-handed at Custodian ST. Min ST: sqrt(10x30)=17.3, adjusted up to
      20 for the awkward mass distribution of a rotary-fed launcher versus
      a slender rifle of similar weight. RoF 1 (single shell per trigger
      pull, cylinder rotates between shots rather than firing
      automatically); Shots 6(3) for a six-chamber cylinder with a fast
      Custodian reload. Bulk -6 (as bulky as a genuine support weapon);
      Rcl 2 (a braced, high-mass launcher absorbs recoil better than a
      rifle). Frag shell reuses the standard bolt-family fragmentation
      bracket logic (6d cr ex [3d cr], no armour divisor, anti-personnel
      only) rather than inventing a new mechanic. Krak shell is scaled
      one clear step below the framework's Krak Missile anchor (6dx6(3)
      cr, full missile-launcher scale) at 6dx4(3) cr (avg 84) for an
      infantry-portable shaped charge: by exact dice distribution it
      penetrates carapace (DR 70, eff. 23.3) 100%, Astartes power armour
      (DR 100, eff. 33.3) 99.9%, Auramite (DR 150, eff. 50) 98.0%,
      Terminator plate (DR 200, eff. 66.7) 85.5%, and Allarus plate (DR
      250, eff. 83.3) 54.6% - genuinely dangerous to any infantry target,
      as a shaped charge should be. Against vehicles it drops off faster
      than the full Krak Missile anchor: AV12 (DR 200, eff. 66.7) 85.5%,
      AV13 (DR 275, eff. 91.7) 36.3%, and AV14 (DR 350, eff. 116.7) only
      2.0% - a real threat up to medium armour, not a substitute for a
      dedicated krak missile or lascannon against the heaviest tanks.

  # -------------------------------------------------------------- Twin Adrathic Destructor

  - name: Twin Adrathic Destructor
    tl: 12
    lc: 0
    cost: 220000
    weight: 380
    tags: [Missile Weapon, Imperium, Adeptus Custodes]
    weapons:
      - usage: Standard discharge (per barrel)
        damage: 8dx8(5) burn
        acc: 4
        range: 200/800
        rof: 1x2
        shots: 6(10)
        st: 28M
        bulk: -8
        rcl: 2
        skill: Gunner (Beams)
    notes: >
      Twin-mounted heavy energy weapon carried by Custodes Contemptor- and
      Telemon-pattern dreadnoughts (Allarus/Aquilon-adjacent heavy armour)
      rather than by an infantry Custodian; both barrels fire together per
      the twin-linked convention.
    lore: >
      The adrathic destructor is Codex-listed heavy dreadnought armament
      for Custodes armoured assets; background describes it in the same
      breath as a lascannon for lethality against vehicles and
      monstrous targets, without giving a precise technical breakdown of
      the beam itself.
    design: >
      A deliberate direct use of the framework's Lascannon anchor (8dx8(5)
      burn) per barrel, not an independent derivation, on the reasoning that "same order of lethality as
      a lascannon" is the most concrete claim the lore supports, twin-
      linked ("rof: 1x2") for two simultaneous shots as the Storm Bolter
      entry models twin boltguns. By exact dice distribution (avg 224 per
      barrel, min possible roll 64) it penetrates every target this
      project anchors, from AV10 (DR 100, eff. 20) up through AV14 (DR
      350, eff. 70) and Allarus plate (DR 250, eff. 50), at 99.99%+ per
      barrel - the framework's own Lascannon anchor is stated flatly to
      "kill tanks (AV14 eff DR 70) and Terminators" with no exception
      carved out, and the exact dice distribution bears that out: only
      the single worst possible roll (all eight dice showing 1) falls
      short of AV14's threshold. Twin-linking two such barrels together is
      therefore redundant against any one target and is better read as
      either engaging two targets at once or as the kind of margin a
      dreadnought-grade weapon is built with against the toughest xenos
      war-engines this project doesn't model numerically. Weight (380 lb)
      and ST (28M, mount-only) reflect genuine vehicle/dreadnought
      armament rather than anything a Custodian carries by hand; Bulk -8
      and Rcl 2 follow the same convention as other braced/mounted heavy
      weapons in this project.

  # -------------------------------------------------------------- Sisters of Silence

  - name: Executioner Greatblade
    tl: 11
    lc: 1
    cost: 9000
    weight: 9
    tags: [Melee Weapon, Imperium, Sisters of Silence]
    weapons:
      - usage: Field on
        damage: sw+3d+3(10) cut
        reach: "1,2"
        parry: -1
        st: 12
        skill: Two-Handed Sword
      - usage: Field off (as plain blade)
        damage: sw+3 cut
        reach: "1,2"
        parry: -1
        st: 12
        skill: Two-Handed Sword
    notes: An ordinary (human-scale) disruption-field weapon; field toggle is a free action.
    lore: >
      Sisters of Silence are depicted (Codex: Adeptus Custodes background,
      which covers the Sisterhood, and The Master of Mankind) wielding
      large two-handed power blades as their signature weapon; this
      project has no page-precise technical citation beyond that
      consistent visual and narrative depiction.
    design: >
      Weight: 9 lb, following the framework's Relic Blade (8 lb, an
      Astartes-strength two-handed blade) scaled slightly heavier for a
      dedicated two-handed executioner's sword rather than a duelling
      blade. Min ST: sqrt(10x9)=9.5, adjusted up to 12 to keep it a
      genuine two-handed weapon for an unaugmented (if exceptional) human,
      in the same range as the Eviscerator (13) and Blessed Blade
      (10 one-handed) already in the Imperium armoury. Reach 1,2, parry
      -1, Two-Handed Sword skill. This is the general human power-field
      rule (+3d, Armor Divisor 10 - not the Custodes-specific +4d, since
      Sisters of Silence are unaugmented humans, not Custodians) applied
      to a two-handed greatsword's Basic Set baseline (sw+3 cut, as the
      Relic Blade's own mundane baseline): field on gives sw+3d+3(10) cut.
      At the Sister of Silence template's ST 12 (sw = 1d+2) this totals
      4d+5 (avg 19): by exact dice distribution it penetrates carapace
      (DR 70, eff. 7) 100%, Astartes power armour (DR 100, eff. 10) 99.6%,
      Auramite (DR 150, eff. 15) 84.1%, Terminator plate (DR 200, eff.
      20) 33.6%, and Allarus plate (DR 250, eff. 25) 2.7% - a mortal
      woman's power blade reliably beating even Astartes plate, which
      matches the framework's general "the disruption field shears power
      armour whoever holds it" instruction and the fiction's own
      depiction of Sisters of Silence as extremely dangerous melee
      combatants despite carrying no Astartes- or Custodes-grade
      augmentation.

  - name: "Psyk-Out Grenade"
    tl: 12
    lc: 0
    cost: 400
    weight: 1
    tags: [Missile Weapon, Imperium, Sisters of Silence]
    weapons:
      - usage: Fragmentation burst
        damage: 4d cr ex [1d cr]
        acc: 0
        range: 10/20
        rof: 1
        shots: 1(3)
        st: 8
        bulk: -2
        skill: Throwing
        notes: Thrown weapon; minor conventional anti-personnel effect.
      - usage: Warp-suppression pulse
        damage: 1d(0.2) tox
        acc: 0
        range: 10/20
        rof: 1
        shots: 1(3)
        st: 8
        bulk: -2
        skill: Throwing
        notes: >
          Affects only psykers, daemons and other warp-touched creatures
          within the same burst radius as the fragmentation above; treat
          as an occasional-scope Affliction (HT roll or lose the round's
          action and suffer the listed toxic damage from psychic backlash)
          for a psyker, and as ordinary toxic damage for anything
          daemonic/warp-spawned. Has no effect at all on an unaugmented,
          non-psychic human or on a Pariah.
    notes: A small anti-personnel grenade with a secondary anti-psyker/anti-daemon payload.
    lore: >
      Psyk-out grenades are Codex-listed Sisters of Silence wargear,
      described as disrupting psykers and harming daemons on top of their
      ordinary anti-personnel fragmentation effect; the exact game
      mechanism behind the anti-warp payload isn't detailed in the sources
      this project drew on beyond "hurts psykers and daemons especially."
    design: >
      Fragmentation component built the same way as the bolt family's
      Metal Storm round (a bracketed frag effect, no armour divisor),
      scaled down to hand-grenade size (4d cr ex [1d cr]) rather than a
      rifle round's higher base. The anti-warp payload reuses the same
      underlying idea as the Pariah Gene's Null Aura/Soul-Static Discharge
      traits (Imperium/Psykers and the Warp) rather than inventing a new
      mechanic: a burst of anti-psychic "static" that staggers a psyker
      (an Affliction-style HT roll) and does the toxic-style harm a
      Pariah's touch does to daemons, at a low (0.2) armour divisor since
      it's a field effect rather than a physical penetrator - it is not
      meant to be a primary damage weapon, only the specialist tool this
      project's Sisters of Silence wargear needs.

  - name: Witchseeker Flamer (Vratine Pattern)
    tl: 8
    lc: 2
    cost: 550
    weight: 14
    tags: [Missile Weapon, Imperium, Sisters of Silence]
    weapons:
      - usage: Cone attack (5 yards)
        damage: 4d burn
        range: 5
        rof: 1
        shots: 4(5)
        st: 9
        bulk: -3
        skill: Liquid Projector (Flamethrower)
        notes: >
          Identical mechanics to the standard Flamer entry in Imperium/
          Weapons/Flame Weapons.eqp (see that file for the full
          cover/cone rules); this is a Sisters of Silence-manufactured
          pattern of the same weapon, not a separate stat line.
      - usage: Follow-up (per turn while ablaze)
        damage: 1d burn
        range: 5
        rof: 1
        shots: 4(5)
        st: 9
        bulk: -3
        skill: Liquid Projector (Flamethrower)
        notes: Ignores DR; see Imperium/Weapons/Flame Weapons.eqp for the sealed-armour exemption.
    notes: See Imperium/Weapons/Flame Weapons.eqp's Flamer entry for the full cover and ignition rules this weapon shares.
    lore: >
      The Witchseeker flamer (this file also calls it the Vratine pattern)
      is the Sisters of Silence's standard-issue flame
      weapon per current Codex: Adeptus Custodes background, used
      alongside their executioner greatblades for close-quarters purging;
      no source this project consulted claims the Vratine pattern differs
      ballistically from a standard Imperial flamer.
    design: >
      Per the assignment's own instruction, this entry reuses the
      Imperium Flame Weapons file's standard Flamer values outright
      (4d burn cone, 5-yard range, 1d burn follow-up, ST 9, Bulk -3)
      rather than re-deriving new numbers: nothing in the lore suggests
      the Vratine pattern is ballistically different, only that it is the
      Sisterhood's own manufacture, so restating the Flamer's own
      derivation here would just duplicate that file rather than add
      anything.
