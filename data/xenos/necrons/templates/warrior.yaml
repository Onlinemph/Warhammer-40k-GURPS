kind: template
output: Xenos/Necrons/Templates/Necron Warrior.gct
notes: >
  NPC template. A Necron Warrior: the mass-produced rank-and-file soldier
  of a dynasty's legions, a mindless automaton that fights only as
  ordered. Point math: Necron Physiology 174 + Body Lens: Warrior 382 +
  Mind: Slave Mentality -41 + skills 10 + Sensor Array 20 = 545 points. Stats: ST 26, DX 10,
  IQ 6, HT 14, HP 32, Will 6, Per 10, natural torso DR 50 (Weak Points 4,
  eye DR 25) — framework.md's Warrior anchor line exactly. This sits in
  the upper half of framework.md's Senior Agents tier (350-600), short of the
  Astartes band (550-800): costly for what its body alone is worth (DR 50
  natural armour is not cheap in points), but with no personality and no
  independent tactical ability to show for it. Do not treat this total as
  a measure of individual threat the way a similarly-costed human
  character would be — a lone Warrior with no orders and no support is a
  much smaller problem than its point total suggests; the danger is in
  the numbers and the Reanimation Protocols, not the individual.
traits:
  - name: Sensor Array
    points: 20
    attributes: {per: 4}
    tags: [Mental]
    notes: Per +4 (Per 10).
    lore: >-
      Its awareness comes from machine senses, not a quick mind: auspex-grade optics and sensors that pick out movement whether or not anything behind them could reason about it.
    design: >-
      Per +4 at 5 points a level (B16), from Per 6 to Per 10: user direction that low-IQ creatures should
      still perceive at 10-12, so a swarm can spot an enemy in the simulator instead of walking blind into its fire.
  - include: "xenos/necrons/traits.yaml#Necron Physiology"
  - include: "xenos/necrons/traits.yaml#Body Lens: Warrior"
  - include: "xenos/necrons/traits.yaml#Mind: Slave Mentality"
skills:
  - name: Beam Weapons
    spec: Rifle
    diff: DX/E
    points: 8
    tags: [Xenos, Necrons]
    lore: >
      A Warrior's gauss flayer is issued, not chosen, and drilled into
      muscle memory (such as it is) rather than mastered.
    design: >
      Treated as Beam Weapons (Rifle) (DX/E) per this project's weapon-
      skill table: gauss is a directed molecular-disassembly beam, not a
      solid-projectile weapon, so it uses the beam-weapons family rather
      than Guns. DX+3 (13) for 8 points, Easy.
  - name: Brawling
    diff: DX/E
    points: 2
    tags: [Xenos, Necrons]
    lore: A Warrior falls back on its own fists or a swipe of its weapon's stock when reanimation catches it mid-melee.
    design: DX+1 (11) for 2 points, Easy.
