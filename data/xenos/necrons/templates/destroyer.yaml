kind: template
output: Xenos/Necrons/Templates/Skorpekh Destroyer.gct
notes: >
  NPC template. A Skorpekh Destroyer: a Necron mind broken into a
  consuming hatred of all organic life, fused permanently into a heavy,
  scything mechanised war-form. Point math: Necron Physiology 224 + Body
  Lens: Destroyer 806 + Mind: Destroyer Cult -35 + skills 18 = 1,013 points.
  Stats: ST 36, DX 12, IQ 6, HT 16, HP 44, Will 6, Per 6, Move 9 (Basic Move +2), natural torso DR
  100 (Weak Points 3, eye DR 50). Not one of framework.md's own anchor
  rows -- see Body Lens: Destroyer's design note for the extrapolation
  this template rests on. This lands well past the top of framework.md's
  Astartes tier (550-800): a Destroyer is built to solo-wreck infantry
  lines and shrug off return fire that would kill a Battle-Brother, at
  the cost of any usefulness beyond killing organic life and no
  reliability under central command.
traits:
  - include: "xenos/necrons/traits.yaml#Necron Physiology"
  - include: "xenos/necrons/traits.yaml#Body Lens: Destroyer"
  - include: "xenos/necrons/traits.yaml#Mind: Destroyer Cult"
skills:
  - name: Two-Handed Sword
    diff: DX/A
    points: 8
    tags: [Xenos, Necrons]
    lore: The scything reap-blade a Skorpekh Destroyer fights with in melee is built into the war-form itself.
    design: Two-Handed Sword (DX/A), the skill the Hyperphase Reap-blade weapon line uses. DX+2 (14) for 8 points, Average.
  - name: Broadsword
    diff: DX/A
    points: 8
    tags: [Xenos, Necrons]
    lore: The threshing talons on the Destroyer's other arm are swung alongside the reap-blade.
    design: Broadsword (DX/A), the skill the Threshing Talons weapon line uses. DX+2 (14) for 8 points, Average.
  - name: Brawling
    diff: DX/E
    points: 2
    tags: [Xenos, Necrons]
    lore: A last resort if both its main weapon systems are somehow disabled.
    design: DX+1 (13) for 2 points, Easy.
