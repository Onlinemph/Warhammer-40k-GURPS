kind: template
output: Xenos/Necrons/Templates/Flayed One.gct
notes: >
  A Flayed One: a Necron whose reanimation matrix degenerated into the
  Flayer Curse, a compulsion to stalk, kill and flay the living. Point
  math: Necron Physiology 134 + Body Lens: Flayed One 342 + Mind: Flayer
  Curse -35 + skills 18 = 459 points. Stats: ST 18, DX 12, IQ 6, HT 14, HP
  24, Will 6, Per 6, natural torso DR 50 (Weak Points 4, eye DR 25) —
  framework.md's Flayed One anchor line exactly. This sits in
  framework.md's Senior Agents tier (350-600): a Warrior-grade body made
  considerably more dangerous in a straight ambush by DX, stealth and
  raw compulsion, but with none of the discipline, formation or command
  structure a Warrior at least nominally has.
traits:
  - include: "xenos/necrons/traits.yaml#Necron Physiology"
  - include: "xenos/necrons/traits.yaml#Body Lens: Flayed One"
  - include: "xenos/necrons/traits.yaml#Mind: Flayer Curse"
skills:
  - name: Brawling
    diff: DX/E
    points: 8
    tags: [Xenos, Necrons]
    lore: A Flayed One's built-in bladed claws are its whole reason for closing to melee at all.
    design: Brawling (DX/E), the skill the Flayed One Claws weapon line uses. DX+3 (15) for 8 points, Easy.
  - name: Stealth
    diff: DX/A
    points: 8
    tags: [Xenos, Necrons]
    lore: A Flayed One stalks a victim for as long as it takes, unseen.
    design: DX+2 (14) for 8 points, Average.
  - name: Climbing
    diff: DX/A
    points: 2
    tags: [Xenos, Necrons]
    lore: Flayed Ones are consistently described dropping on prey from above, out of ducts, rafters or ruined upper floors.
    design: DX+0 (12) for 2 points, Average.
