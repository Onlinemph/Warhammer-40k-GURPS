kind: equipment
output: Xenos/Necrons/Weapons/Necron Melee Weapons.eqp
items:

  - name: Warscythe
    tl: "12^"
    lc: 0
    cost: 18000
    weight: 30
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Swing, two-handed (field on)
        damage: sw+4d(10) cut
        reach: "1,2"
        parry: "-1"
        st: 20
        skill: Two-Handed Sword
      - usage: Swing, two-handed (field off)
        damage: sw+1d cut
        reach: "1,2"
        parry: "-1"
        st: 20
        skill: Two-Handed Sword
    notes: >-
      Field on carries armour divisor (10), per the framework's power-field rule; the field is a
      free-action toggle, and with it off the weapon is a heavy necrodermis blade (sw+1d cut).
    lore: >-
      The signature weapon of Necron Lychguard and many Overlords: a scythe-bladed, disruption-
      field-edged polearm that Codex: Necrons background, Black Library's Necron fiction (the
      Twice-Dead King trilogy in particular gives Lychguard and their warscythes real page time)
      and every RPG-line Necron-armoury write-up agree can shear straight through a Space Marine's
      power armour and, in enough hands, cut down even a Terminator - the closest thing the
      Necron armoury has to the Imperium's thunder hammer or power fist in terms of what it is
      known to be able to kill.
    design: >-
      Framework.md's own anchor: "Warscythe | Two-handed power-field blade: sw+4d(10) cut."
      Built on the project's own power-field rule (armour divisor (10) with the field on), one
      die heavier than the Imperium Power Axe/Astartes weapons' own two-handed baseline per the
      anchor's explicit dice, reflecting a weapon this project treats as this armoury's clear
      Terminator-killer. Checked by exact dice distribution at a Lychguard's own ST 32 (sw=6d+2,
      giving a full swing of 10d+2(10)): average 37 damage clears flak, carapace, Sororitas plate
      and Astartes power armour at 100% and a Terminator (DR 200, eff. 20) 99.9% of the time -
      matching the fiction's own claim that a warscythe cuts down even the most heavily armoured
      target it meets, not merely a Space Marine.
      Field-off line: the mundane baseline is sw+1d cut (a 30 lb necrodermis blade), so the +3d
      field step gives the anchor's sw+4d.
      Handling: 30 lb, a genuinely massive two-handed weapon even set against the rest of this
      armoury, per every depiction of a warscythe as a tall, imposing polearm rather than a
      sword; min ST 20 (heavier than the Imperium's own two-handed Eviscerator's ST 15, for the
      same "Necron weapons run heavier" convention this project's ranged file establishes) sits
      comfortably under a Lychguard's own ST 32 and an Overlord's ST 34. Reach 1,2 and parry
      -1 follow Basic Set's own Two-Handed Sword conventions for a long, primarily offensive
      blade - not the deeper -1U some Imperium chain weapons carry, since a warscythe's disruption
      field doesn't foul or jam the way a physical chain edge does.

  - name: Hyperphase Sword
    tl: "12^"
    lc: 0
    cost: 14000
    weight: 8
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Swing (field on)
        damage: sw+3d(10) cut
        reach: "1"
        parry: 0
        st: 14
        skill: Broadsword
      - usage: "Thrust (field on)"
        damage: thr+3d+1(10) imp
        reach: "1"
        parry: 0
        st: 14
        skill: Broadsword
      - usage: Swing (field off, plain blade)
        damage: sw cut
        reach: "1"
        parry: 0
        st: 14
        skill: Broadsword
      - usage: "Thrust (field off, plain blade)"
        damage: thr+1 imp
        reach: "1"
        parry: 0
        st: 14
        skill: Broadsword
    notes: >-
      Field on carries armour divisor (10), per the framework's power-field rule; with the field
      off it is a plain necrodermis blade (sw cut).
    lore: >-
      A one-handed disruption-field blade carried by Necron Lords and Overlords, most often paired with a sidearm or a dispersion shield rather than wielded
      two-handed like a warscythe; Codex: Necrons background and the RPG-line Necron-armoury
      material both treat it as this armoury's standard one-handed power weapon, mechanically
      equivalent in what it does to armour to the Imperium's own power sword.
    design: >-
      Framework.md's own anchor: "Hyperphase sword | Phase blade: sw+3d(10) cut." Built on the
      same power-field rule as the Warscythe, one die lighter for a one-handed blade rather than
      a two-handed polearm - the identical "bladed power weapon adds +3d" figure the framework
      gives the Imperium Power Sword, since the underlying disruption-field mechanic is the same
      regardless of who built it. Checked by exact dice distribution at a Lychguard's ST 32 (sw=6d+2, giving 9d+2
      (10)): average 33.5 damage clears flak through Sororitas plate at 100%, Astartes power
      armour (DR 100, eff. 10) 100% of the time, and a Terminator (DR 200, eff. 20) 99.5% of
      the time - a genuinely fearsome one-handed weapon, well ahead of the Imperium Power Sword's
      own ST-30 figures against a Terminator (which this project's Imperium file puts lower),
      matching Necron hyperphase technology's reputation as at least the equal of Imperial
      disruption fields.
      Field-off line: the mundane baseline is sw cut, so the +3d field step gives sw+3d.
      Handling: 8 lb, twice the weight of the Imperium Power Sword's 4 lb for the same "Necron
      gear runs heavier" convention; min ST 14 (above the Imperium sword's ST 10, for the denser
      necrodermis blade and hilt) still leaves it comfortably one-handed for any Necron noble at
      ST 20+. Reach 1 and parry 0 (Broadsword) are unchanged, the standard figures for a guarded,
      one-handed blade.

  - name: Voidblade
    tl: "12^"
    lc: 0
    cost: 20000
    weight: 6
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Swing, charged strike (ignores DR)
        damage: sw+2d cut (ignores DR)
        reach: "1"
        parry: 0
        st: 13
        skill: Broadsword
      - usage: "Thrust, charged strike (ignores DR)"
        damage: thr+2d+1 imp (ignores DR)
        reach: "1"
        parry: 0
        st: 13
        skill: Broadsword
      - usage: Swing, uncharged strike
        damage: sw+1 cut
        reach: "1"
        parry: 0
        st: 13
        skill: Broadsword
      - usage: "Thrust, uncharged strike"
        damage: thr+2 imp
        reach: "1"
        parry: 0
        st: 13
        skill: Broadsword
    notes: >-
      The charged line may be used three times before the blade's entropic reservoir needs a
      short pause (about ten seconds without swinging it) to rebuild; further charged strikes in
      that window fall back to the uncharged line until it recovers, tracked on the item's Uses
      counter like the regenerating-shield items in Gear.yaml.
    lore: >-
      A rare entropic blade, most associated in Codex: Necrons background and Black Library's
      Necron fiction with Triarch Praetorians and named Necron relic-bearers, whose edge doesn't
      merely cut but unravels whatever it touches at a fundamental level - background and the
      RPG-line Necron-armoury material both describe it passing through armour of any kind as if
      it weren't there, at the cost of the weapon needing a moment to build the charge behind
      each such strike rather than sustaining the effect indefinitely.
    design: >-
      Framework.md's own anchor: "Voidblade | Entropic blade that ignores armour: sw+2d
      (ignores DR) cut, but only for a limited number of charged strikes." Built exactly to the
      anchor's dice and its own stated limitation, using this project's honest "(ignores DR)"
      armour-divisor notation (as the DMG_RE grammar already supports, per the Diresword and
      Force Sword precedents in the Aeldari and Imperium files) rather than a numerically huge
      divisor standing in for infinity. The uncharged fallback line (sw+1 cut, no divisor) is a
      new design element this entry needs that the anchor doesn't spell out: an entropic blade
      that has spent its charge should still cut like a very good mundane sword rather than do
      nothing at all, matching the fiction's occasional depiction of a voidblade's wielder still
      fighting on between charged strikes. At ST 13 (sw=2d-1) the charged line already ignores
      DR outright by definition, so no dice-distribution check against armour is meaningful; the
      uncharged line (sw+1 = 2d) rounds to 0% against carapace or better by exact dice
      distribution, matching a fine but otherwise unremarkable blade.
      Handling: 6 lb and min ST 13, both above the Imperium Power Sword's own one-handed figures
      for a denser, more exotic necrodermis-and-crystal construction, but well below the
      Hyperphase Sword's 8 lb/ST 14 since this is built as a lighter, faster weapon in the
      fiction's own telling - speed, not mass, is the voidblade's signature. Reach 1 and parry 0
      (Broadsword) are unchanged.

  - name: Dispersion Shield
    tl: "12^"
    lc: 0
    cost: 12000
    weight: 15
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Bash
        damage: thr+1 cr
        reach: "1"
        parry: 2
        st: 16
        skill: Shield
    notes: >-
      This entry is the shield's physical bulk and bash only. Its kinetic dispersion field -
      the part of the item that actually stops incoming fire and reflects some of it back - is a
      separate regenerating-shield item, the Dispersion Shield Field entry in Gear.yaml, tracked
      with its own Shield Points; a Lychguard is issued both together but they are modelled as
      two items exactly the way the Imperium Storm Shield splits its physical block/parry stats
      from its Force Field-file shield-point entry.
    lore: >-
      Carried by Necron Lychguard as their signature paired defensive weapon (usually alongside
      a warscythe or a hyperphase sword and a second dispersion shield), the shield's own kinetic
      field is described throughout Codex: Necrons background and Black Library's Necron fiction
      as capable of shrugging off a bolter round or a power weapon's blow and, on occasion,
      hurling a portion of that force straight back at whoever struck it.
    design: >-
      Split into a physical component (this entry) and a field component (Gear.yaml), the same
      structure this project's own Imperium Storm Shield already uses for exactly the same
      reason: a shield's Defense Bonus and bash are ordinary melee-weapon stats, while its energy
      field is a regenerating-shield pool that doesn't fit the `weapons` schema at all.
      Handling: 15 lb (heavier than the Imperium's own Storm Shield at a comparable size, for
      solid necrodermis rather than adamantium-plated ceramite) and min ST 16 (above the Storm
      Shield's own figure, for the same reason) give parry 2 - the Basic Set Shield bonus for a
      medium shield, unchanged by the field it also carries, since the field's own defensive
      value is tracked separately as Shield Points rather than folded into the parry number.
      thr+1 cr is the ordinary "bash with the shield's edge" attack every shield in this
      project's other files carries as a secondary option, not this item's real purpose.

  - name: Hyperphase Reap-blade
    tl: "12^"
    lc: 0
    cost: 21000
    weight: 40
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Swing, two-handed (field on)
        damage: sw+5d(10) cut
        reach: "1,2"
        parry: "-1"
        st: 24
        skill: Two-Handed Sword
      - usage: Swing, two-handed (field off)
        damage: sw+2d cut
        reach: "1,2"
        parry: "-1"
        st: 24
        skill: Two-Handed Sword
    notes: >-
      Field on carries armour divisor (10), per the framework's power-field rule; with the field
      off it is a huge plain scythe-blade (sw+2d cut).
    lore: >-
      One of the paired weapon-arms built into a Skorpekh Destroyer's own hunting-construct
      chassis, a massive scythe-bladed hyperphase weapon fought alongside the same construct's
      threshing talons; Codex: Necrons background describes the Skorpekh Destroyer cult as some
      of the deadliest close-combat troops the Necron armoury fields, built specifically to
      close with and butcher living targets in a whirling, all-consuming melee.
    design: >-
      Built one die heavier than the Warscythe above, the same "Destroyer-cult chassis weapon
      hits harder than the equivalent hand-carried pattern" relationship: sw+5d(10) cut. Checked by
      exact dice distribution at a Skorpekh's own construct-scale ST 36 (sw=7d+2, giving 12d+2(10)):
      average 44 damage clears every personal-armour DR at 100%, including a Terminator (DR
      200, eff. 20) - the single hardest-hitting melee weapon in this file, matching the
      Skorpekh Destroyer's own reputation as the Necron armoury's premier close-combat killer.
      Field-off line: baseline sw+2d cut (a 40 lb chassis-scale blade), +3d field step = sw+5d.
      Handling: 40 lb and min ST 24, both built into the Skorpekh's own weapon-arm rather than a
      carried grip (heavier again than the hand-wielded Warscythe's 30 lb/ST 20, for the bigger
      scythe-blade and its own integral chassis mounting); reach 1,2 and parry -1 are unchanged
      from the Warscythe's own two-handed figures, the same weapon class on a bigger frame.

  - name: Threshing Talons
    tl: "12^"
    lc: 0
    cost: 17000
    weight: 18
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Claw strike (field on)
        damage: sw+3d(10) cut
        reach: "1"
        parry: -1
        st: 22
        skill: Broadsword
      - usage: Claw strike (field off)
        damage: sw cut
        reach: "1"
        parry: -1
        st: 22
        skill: Broadsword
    notes: >-
      Field on carries armour divisor (10), per the framework's power-field rule; field off is a
      plain claw (sw cut).
      A Skorpekh Destroyer's paired weapon-arm to its own Hyperphase Reap-blade above; the
      construct fights with both, and the GM should let it make a genuine two-weapon attack each
      turn (GURPS Basic's Dual-Weapon Attack, B417) rather than treating the talons as a purely
      decorative second arm.
    lore: >-
      The Skorpekh Destroyer's other weapon-arm: a set of hyperphase-edged claws fought alongside
      the reap-blade rather than instead of it, per Codex: Necrons background's consistent
      depiction of Skorpekh Destroyers tearing into an enemy line with both arms at once rather
      than favouring one over the other.
    design: >-
      Built at the same disruption-field math as the Hyperphase Sword above (sw+3d(10) cut) since
      the talons are a one-handed-equivalent hyperphase weapon in their own right, just shaped as
      claws rather than a blade, mounted on a construct-scale arm: checked by exact dice
      distribution at the Skorpekh's own ST 36 (sw=7d+2, giving 10d+2(10)): average 37, 100% through Sororitas plate
      and Astartes power armour and 99.9% vs. a Terminator - the honest result of the talons sharing
      the same hyperphase-edge technology and a Destroyer's wielder strength, not a separate
      derivation for its own sake. Parry is corrected to -1 (rather than the sword's 0) since a
      claw-shaped weapon-arm is built for offense, not defensive fencing, the same logic this
      project's Imperium Axe/Mace-class weapons use for a less sword-like profile.
      Field-off line: baseline sw cut, +3d field step = sw+3d.
      Handling: 18 lb and min ST 22, lighter than the reap-blade for a claw-cluster rather than a
      full scythe-blade on the same construct chassis; reach 1 (shorter than the reap-blade's
      polearm reach, a close-in claw rather than a long blade) is the only other point of
      difference.

  - name: Flayed One Claws
    tl: "12^"
    lc: 0
    cost: 3000
    weight: 4
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Claw strike
        damage: thr+2d(3) cut
        reach: C,1
        parry: -1
        st: 18
        skill: Brawling
    notes: >-
      Hooked necrodermis claws that peel flesh from bone. Armour divisor (3) is written into the
      damage; the claws are wounding tools, not a power-field weapon.
    lore: >-
      Flayed Ones fight with wickedly hooked bone-metal claws grown from their own corrupted
      necrodermis, tearing the flesh from their victims in a compulsion the Codex: Necrons
      background and Black Library's Necron fiction both attribute to the "flayer virus" that
      corrupted their reanimation matrices during biotransference. The Flayer Curse is a
      degradation of the Necron's own mind, not a disease it passes on: the claws simply cut, and
      the horror of a Flayed One lies in what it does with the skin afterwards. The Twice-Dead
      King trilogy and The Infinite and the Divine both use Flayed Ones for body-horror,
      skin-taking dread.
    design: >-
      Built so the signature Necron ambusher can actually hurt a Guardsman in flak: thr+2d(3) cut
      at ST 26 (thr 2d+2, giving 4d+2(3)), average 16. Checked by exact dice distribution:
      penetrates flak (DR 30, eff. 10) 94.6% of the time, carapace (DR 70, eff. 23.3) barely
      ever (1.2%), and Astartes power armour never. That leaves the claws a flesh-and-flak killer,
      not an armour-breaker, which suits an ambusher that relies on stealth and the victim's
      terror. An earlier draft added a DR-ignoring toxic "flayer virus" follow-up; that mechanic
      is not in the fiction and has been removed. If dread is wanted at the table, use a Fright
      Check on the Flayed One's appearance rather than a wound effect.
      Handling: 4 lb (light, built-in claws, not a carried weapon in the usual sense) and min ST
      18 matching a Flayed One's own base ST exactly, since these are part of the creature's body
      rather than an armoury-issued item; reach C,1 and parry -1 (Brawling's own convention for
      an unarmed-style claw weapon) are the standard figures for a close-in natural weapon.

  - name: Gauntlet of Fire
    tl: "12^"
    lc: 0
    cost: 24000
    weight: 12
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Punch
        damage: thr+1 cr
        reach: C
        parry: -1
        st: 20
        skill: Brawling
      - usage: Point-blank flame burst (3 charges)
        damage: 6d(2) burn ex
        acc: 0
        range: C,2
        rof: 1
        shots: "3(1800)"
        st: 20
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Pistol)
        notes: >-
          No Acc bonus applies against a target within reach C, per B412; against reach 2 use
          the listed Acc 0 with no range penalty inside that short a distance. A relic gauntlet
          rather than standard issue - background material shows very few named Necron
          characters carrying one.
    lore: >-
      A rare relic gauntlet, referenced in older Necron background and the RPG-line Necron-
      armoury material as an Overlord's personal weapon that can unleash a short-ranged gout of
      disintegrating fire at point-blank range in addition to its crushing punch, more a badge of
      a particular Necron Lord's own individuality than a mass-produced pattern - Necron relics
      in general skew toward single named pieces rather than uniform kit, and this is one of the
      less consistently documented ones, so the calibration below leans on its RPG-line
      description rather than a single Codex passage.
    design: >-
      Built as a dual-mode close-combat item on the same "one item, two weapon lines" pattern
      this project already uses for the Aeldari Mandiblasters and the Imperium's own combined
      melee/thrown entries: an ordinary heavy Necron punch (thr+1 cr, negligible against armour
      by the same logic as the Flayed One Claws above) plus a genuinely dangerous short-ranged
      burst option built from the Gauss Flayer's own dice at the family's standard (2) divisor
      rather than the flayer's own bumped (4) - a point-blank gout of fire spent in three sharp
      bursts rather than a sustained beam reads as less refined than a proper rifle's aimed
      shot, so it is given the gentler divisor. Checked by exact dice distribution: 6d(2) burn ex
      averages 21 and penetrates flak (DR 30, eff. 15) 90.4% of the time but rounds to 0% against
      carapace or better - a real short-range killing burst against unarmoured or lightly
      armoured targets, not a rifle-class threat to power armour, appropriate for a relic that
      is fundamentally a melee weapon with a nasty trick rather than a dedicated ranged tool.
      Handling: 12 lb and min ST 20 for a heavy, gauntlet-mounted relic device built onto (not
      merely held in) an Overlord's own hand; the flame line's Bulk -2 and Rcl 1 are new
      derivations for a compact, integrated emitter rather than a carried weapon, and Shots
      3(1800) - three point-blank bursts before a half-hour recharge - reflects the relic's own
      limited reserve rather than a standard reactor-fed weapon's larger figure.

  - name: Rod of Covenant
    tl: "12^"
    lc: 0
    cost: 16000
    weight: 10
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Swing
        damage: sw+1 cr
        reach: "1"
        parry: 0
        st: 16
        skill: Staff
    notes: >-
      Command aura: while the bearer is conscious and active, every ordinary (non-Nemesor,
      non-Overlord) Necron construct within 10 yards adds +1 to its Reanimation Protocols HT
      roll (see the Necron ancestry's own Reanimation Protocols trait) and gets +1 to resist
      Fright Checks and any morale-equivalent roll, representing the Rod steadying nearby
      obedience-circuits and reinforcing the tactical link back to a Tomb World's command
      hierarchy. This does not stack with the Resurrection Orb's own HT bonus (Gear.yaml); use
      whichever single figure is higher if a unit is somehow under the effect of both.
    lore: >-
      A ceremonial staff of office carried by Triarch Praetorians and Royal Wardens (and by any Overlord who claims one) -
      Codex: Necrons background and older Necron material both frame it primarily as a symbol of
      authority and a tactical relay to the Tomb World's own command protocols rather than a
      dedicated weapon, though every depiction still shows an Overlord using it to brutal effect
      in melee when the fighting reaches its bearer directly.
    design: >-
      No framework anchor names this item, so it is built as a plain, unenhanced Necron staff
      weapon (sw+1 cr, no power field or armour divisor at all - this project reserves the +3d/
      divisor(10) treatment for weapons the lore actually calls disruption- or hyperphase-edged,
      and nothing in the Rod's own background does) whose real value is the command aura, modelled
      as a flat HT/Fright bonus to nearby Necron constructs rather than a numeric combat bonus of
      its own - the same honest choice this project's Banshee War-Mask entry makes for a lore
      effect (there, a scream; here, a tactical-command signal) that doesn't map onto a damage or
      defence roll. Checked by exact dice distribution at ST 16 (sw=2d+2, giving 3d+3): average
      13.5 rounds to 0% against flak or better - deliberately unremarkable in a straight fight,
      matching its role as a badge of command an Overlord happens to also swing rather than a
      combat relic in its own right.
      Handling: 10 lb and min ST 16, a plain staff-class weight and strength requirement with no
      "Necron gear runs heavy" bump, since nothing in the lore singles the Rod out as an unusually
      dense construct - it is meant to be carried and displayed as much as fought with. Reach 1
      and parry 0 (Staff's own Basic Set convention) are standard.

  - name: Voidscythe
    tl: "12^"
    lc: 0
    cost: 55000
    weight: 32
    tags: [Melee Weapon, Xenos, Necrons]
    weapons:
      - usage: Swing, two-handed (ignores DR)
        damage: sw+3d cut (ignores DR)
        reach: "1,2"
        parry: "-1"
        st: 22
        skill: Two-Handed Sword
      - usage: Swing, two-handed, uncharged
        damage: sw+2 cut
        reach: "1,2"
        parry: "-1"
        st: 22
        skill: Two-Handed Sword
    notes: >-
      As the Voidblade above, the ignores-DR line is a charged strike good for three uses before
      the entropic reservoir needs about ten seconds without swinging it to rebuild; further
      strikes in that window use the uncharged line. A one-of-a-kind relic (a Necron Lord's or
      Nemesor's own weapon, not standard Lychguard or noble issue), GM-reference tier alongside
      this project's other single-named relics (the Imperium Solar Atomiser, the Aeldari
      Executioner and Star Glaive).
    lore: >-
      Referenced only sparingly in Necron background and the RPG-line Necron-armoury material as
      a singular relic weapon combining a warscythe's reach and cutting power with an entropic
      blade's ability to unmake matter outright - accounts differ on whether it was forged for a
      specific named Overlord or salvaged from an older, pre-biotransference age of Necrontyr
      craftsmanship, and that question isn't settled here as a single canonical answer.
    design: >-
      Built as the Warscythe and Voidblade's own combined hero-tier relic, the same "take the
      project's two family anchors and combine their signature mechanics on a bigger frame"
      approach the Aeldari Diresword/Executioner relics use against the Power Sword anchor: the
      Warscythe's own two-handed reach and grip, the Voidblade's DR-ignoring charged strike, at
      one die over the Voidblade's own sw+2d for the bigger, two-handed frame (sw+3d ignores DR),
      with the same uncharged fallback line one step heavier than the Voidblade's own (sw+2 vs.
      sw+1) to match. As with the Voidblade, the charged line ignores DR by definition and needs
      no dice-distribution check against armour; the uncharged line at a Lychguard/Overlord-class
      ST 32 (sw=6d+2, giving 6d+4) rounds to 0% against carapace or better by exact dice
      distribution, a very good but still mundane two-handed blade between charges.
      Handling: 32 lb and min ST 22, heavier than the Warscythe's own 30 lb/ST 20 for the denser
      entropic-crystal core built into the blade, but lighter than the Hyperphase Reap-blade's
      construct-scale 40 lb/ST 24 since this remains a weapon a living Necron noble wields, not a
      Skorpekh's own chassis-integrated arm. Reach 1,2 and parry -1 are unchanged from the
      Warscythe's own two-handed figures.

