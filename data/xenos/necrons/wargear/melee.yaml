        skill: Staff
      - usage: Ranged bolt
        damage: 6d(3) burn
        acc: 5
        range: 150/450
        rof: 2
        shots: "100(1800)"
        st: 10
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
    notes: >-
      Melee field-on line carries armour divisor (10), per the framework's power-field rule; with
      the field off it is a plain staff (sw cr). This is one
      physical weapon with both a ranged and a melee mode; it is included wholesale into the
      Ranged Weapons file per data-format.md's `include` convention (the same pattern the
      Aeldari Singing Spear uses across melee.yaml and ranged.yaml) rather than defined twice.
    lore: >-
      A dual-purpose energy staff carried by Necron Lords, Overlords and Crypteks as both a
      badge of authority and a working weapon: Codex: Necrons background and older Necron
      material both describe it firing a bolt of disintegrating energy at range, then serving as
      a power-field melee weapon when its wielder is forced into close combat - a generalist's
      tool rather than either family's dedicated specialist.
    design: >-
      Framework.md's own anchor: "Staff of light | Energy staff: ranged 6d(3) burn and a power-
      field melee strike." The ranged line is held at the anchor's literal dice and divisor (3)
      rather than the Gauss Flayer's bumped (4), since this is deliberately a generalist's badge
      weapon rather than a front-line infantry rifle - checked by exact dice distribution, 6d(3)
      burn averages 21 and penetrates flak (DR 30, eff. 10) 99.6% of the time but only 27.9%
      against carapace (DR 70, eff. 23.3) and 0.06% against Astartes power armour, a real anti-
      infantry weapon and a poor anti-Astartes one, exactly what a Lord's sidearm should be next
      to a dedicated Warrior or Immortal weapon. The melee line applies this project's own power-
      field rule (divisor (10) written into the damage string, with a field-off line at the plain
      staff's sw cr) but with a smaller field step (+2d rather than the usual +3d), one die lighter
      than the Hyperphase Sword's own sw+3d, since a staff's melee mode is a secondary function of a primarily ranged
      item rather than a dedicated blade: checked by exact dice distribution at ST 10 (sw=1d,
      giving 3d(10)): average 10.5 damage penetrates flak/carapace/Sororitas at 100%/99.6%/98.8%
      and Astartes power armour (DR 100, eff. 10) 94.6% of the time, and a Terminator (DR 200,
      eff. 20) 9.7% - genuinely dangerous in a pinch, well below the Hyperphase Sword's own
      figures at the higher ST a dedicated melee wielder would bring, an honest consequence of a
      Lord's own more modest ST when caught fighting with a badge weapon rather than a proper
      blade in hand.
      Handling: 10 lb and min ST 10 for a staff meant to be genuinely comfortable in a Necron
      Lord's hand rather than built heavy like a rank-and-file trooper's weapon - the one item in
      this file with no "no ergonomic concession" bump, since a Lord's own staff is exactly the
      item a Necron would bother to make comfortable. RoF 2 and Shots 100(1800) (a half-hour
      recharge) sit between the Tesla Carbine's rapid pulses and the Gauss Cannon's slow single
      shots, matching a generalist weapon's middling cycle rate. Bulk -4 and Rcl 1 are unchanged
      from the rest of this armoury; Acc 5 sits at the low end of the rifle bracket for a weapon
      not built primarily as a marksman's tool. Reach 1 and parry 0 (Staff's own Basic Set
      convention) fit the melee mode.
