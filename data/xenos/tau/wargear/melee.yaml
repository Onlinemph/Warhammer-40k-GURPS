kind: equipment
output: Xenos/Tau/Weapons/T'au Melee Weapons.eqp
items:

  - name: "Ethereal Honour Blade"
    tl: 8
    lc: 0
    cost: 3000
    weight: 4
    tags: ["Melee Weapon", "Xenos", "T'au", "Ethereal"]
    weapons:
      - usage: "Swing, two-handed"
        damage: "sw+2 cut"
        st: "8†"
        reach: "1,2"
        parry: 2
        skill: "Staff"
      - usage: "Thrust, two-handed"
        damage: "thr+2 imp"
        st: "8†"
        reach: "1,2"
        parry: 2
        skill: "Staff"
    notes: >-
      Mundane: no power field and no armour divisor. Parry +2 as the Basic Set Quarterstaff (the
      blade sits on a long two-handed haft). At an Ethereal's ST 9 (sw 1d-1, thr 1d-2) it swings
      1d+1 cut and thrusts 1d imp. It is a badge of rank first and a weapon last.
    lore: >-
      Codex: T'au Empire background shows Ethereals carrying honour blades as marks of their caste
      and authority, and treats them as ceremonial weapons that an Ethereal will nonetheless wield
      if he must; the Ethereal caste's real power is that the T'au obey them, not that they can
      fight. I hold the two-handed staff-like form from the framework's brief and do not have a
      source for its exact length or weight.
    design: >-
      Framework: 'two-handed staff/polearm style, mundane'. Built as a Basic Set quarterstaff-length
      haft with a blade (glaive family): swing sw+2 cut, thrust thr+2 imp, reach 1,2, parry +2
      (framework: quarterstaff-type weapons parry +2), skill Staff. Exact dice at ST 9: the swing is
      1d+1 (average 4.5, cut x1.5 wounding): penetrates flak (DR 30) 0.0% of hits, carapace 0.0%,
      Astartes plate 0.0%. Against an unarmoured person it does about 7 injury, enough to wound a
      T'au or human but never to cut through armour. That is deliberate: an Ethereal is not built to
      duel, and the framework's Ethereal (ST 9, DX 11) is a leader, not a fighter. Handling: 4 lb,
      Min ST 8, two-handed (dagger). TL 8: a mundane blade (framework: mundane, so no TL 11
      superscience), cost $3,000 for a ceremonial object of fine make.

  - name: "Equalisers (pair)"
    tl: 8
    lc: 0
    cost: 2400
    weight: 3
    tags: ["Melee Weapon", "Xenos", "T'au", "Ethereal"]
    weapons:
      - usage: "Swing, each blade"
        damage: "sw+1 cut"
        st: 8
        reach: "1"
        parry: 0
        skill: "Shortsword"
      - usage: "Thrust, each blade"
        damage: "thr+1 imp"
        st: 8
        reach: "1"
        parry: 0
        skill: "Shortsword"
    notes: >-
      A matched pair: wield one in each hand with the Dual-Weapon Attack technique (B230) or fight
      with one and parry with the other. Each blade parries separately (Parry 0 on Shortsword).
      Mundane: no armour divisor.
    lore: >-
      Paired Ethereal blades: the framework's brief lists equalisers as Ethereal fighting swords in
      pairs. I hold the name and the paired form with low confidence and have no source for lengths
      or weights, so this entry is deliberately plain.
    design: >-
      A pair of light one-handed blades of the Shortsword family (Basic Set: sw cut, thr imp), given
      the modest +1 of a good weapon. At an Ethereal's ST 9: swing 1d cut (average 3.5, x1.5
      wounding), which goes through flak 0.0% of the time and nothing armoured. Weight 3 lb the pair
      (1.5 lb each), Min ST 8 (a set at ST 9 hands is a light load, and a ritual pair has some
      length; the pure weight rule sqrt(10x1.5)=3.9 would allow less, so 8 is a design floor). TL 8
      and cost $2,400 for the pair, as for the honour blade. Dual-Weapon Attack is the Basic Set
      technique for two blades.

