kind: equipment
output: Xenos/Tau/Armour/T'au Armour and Gear.eqp
items:

  # ------------------------------------------------------------ Infantry armour

  - name: "Fire Warrior Combat Armour"
    tl: 11
    lc: 0
    cost: 3000
    weight: 25
    tags: ["Body Armor", "Xenos", "T'au", "Fire Caste"]
    dr: {"torso,vitals,groin": 70, "arm,leg": 58, "neck": 52, "skull": 64, "face": 36, "eye": 48, "hand": 36, "foot": 42}
    weak_points: 5
    notes: >-
      Rigid composite plates: no blunt-trauma rule. Weak Points 5. Full coverage; the helmet carries
      the comm-link and display. Not vacuum-rated: a sealed void suit is a separate item.
    lore: >-
      The Fire Warrior's plate: Codex: T'au Empire background describes shas'la wearing light
      composite armour with a helmet display and comm-link, protective enough to survive a
      battlefield of small arms but not built for the melee the T'au avoid. The lore fixes the
      class, not the numbers.
    design: >-
      Anchor (framework): composite plates, DR 70 (carapace class), Weak Points 5, eye 48. Torso DR
      and eye lens are held exactly. The limbs follow carapace: arms and legs 58 (12 under the
      torso, as Astartes plate), neck 52 (as Guard carapace), helmet 64 (as Guard carapace), face
      36, and hands and feet 36 and 42 (the Tempestus pattern's gauntlets and boots; the Guard's
      carapace leaves hands bare). Exact odds against the torso (DR 70, WP 5): lasgun 7d(2) 0.6%
      (4.9% with WP 5); autogun 7d 0.0%; boltgun or pulse rifle 6dx2(2) 79.4% (80.4% with WP 5);
      heavy bolter (8d+2)x2(2) 99.6%; plasma gun 6dx4(3) 100.0%. So it is carapace
      exactly: lasgun 0.6% (4.9% with the Weak Points chance), a pulse rifle 79.4% (T'au fire on
      T'au) and a Marine's bolter 79.4%; a shuriken catapult hit (5d(3) cut) gets through 5.9%
      (10.0% with WP). Arms and legs (DR 58): pulse rifle 93.9%, lasgun 13.7%. Eye lens (DR 48, three-quarters of the
      helmet's 64; effective DR 24 against a (2) divisor): a lasgun hit penetrates 50.0% of the
      time, a pulse rifle 98.0%; an eye hit is a brain hit for
      piercing and tight-beam burning damage (B399), and a random face hit strikes an eye on 1 in 6
      (about 0.5% of random hits). Weight 25 lb against the Guard carapace's 30 lb (T'au composite
      is lighter), cost $3,000 against $1,800, priced above the Guard's carapace for its integrated
      helmet display and comm-link (design numbers). LC 0: xenos-made.

  - name: "Recon Armour, Pathfinder Pattern"
    tl: 11
    lc: 0
    cost: 2200
    weight: 12
    tags: ["Body Armor", "Xenos", "T'au", "Fire Caste", "Pathfinder"]
    dr: {"torso,vitals,groin": 36, "arm,leg": 29, "neck": 21, "skull": 30, "face": 25, "eye": 22, "hand": 18, "foot": 18}
    weak_points: 5
    notes: >-
      Flexible armour (B47): a hit that fails to penetrate still delivers (damage/10, rounded down,
      minimum 1) crushing injury. The helmet carries a sensor suite and comm-link (background). No
      DX or Stealth penalty.
    lore: >-
      The light armour of the T'au scout: Codex: T'au Empire background shows Pathfinders in lighter
      armour than a Fire Warrior, since they scout ahead of the line and rely on cover, camouflage
      and their markerlights rather than plate.
    design: >-
      Anchor (framework): flexible, DR 36, Weak Points 5, the mesh anchor. Torso DR and Weak Points
      are held exactly, the same protection as Guardian and Kabalite mesh. Exact odds against the
      torso (DR 36, WP 5): lasgun 7d(2) 90.6% (91.0% with WP 5); autogun 7d 0.3% (4.5% with WP 5);
      boltgun or pulse rifle 6dx2(2) 99.8%; heavy bolter (8d+2)x2(2) 100.0%; plasma gun 6dx4(3) 100.0%.
      So a lasgun goes through 90.6% of the time and a pulse rifle always; only slug-throwers such
      as the autogun (0.3%), light blades and shrapnel are stopped. Limbs 29, neck 21, as mesh;
      helmet 30, face 25 and eye 22 for a light helm with a sensor visor, hands and feet 18. Eye
      lens (DR 22, three-quarters of the helmet's 30): lasgun 99.9%. Weight 12 lb (mesh is 6 lb; recon armour also carries the helmet
      and boots), cost $2,200 (mesh $1,600; the sensor helmet is the difference).

  - name: "Kroot Hide and Scavenged Plate"
    tl: 4
    lc: 0
    cost: 150
    weight: 12
    tags: ["Body Armor", "Xenos", "T'au", "Kroot"]
    dr: {"torso,vitals,groin": 15, "arm,leg": 8}
    weak_points: 8
    notes: >-
      Flexible armour (B47): blunt-trauma rules apply. Covers torso, arms and legs only; head, hands
      and feet are bare. Crude and patched: Weak Points 8. Kroot are not slowed by it: no DX or Move
      penalty.
    lore: >-
      Kroot fight in hide and whatever they have picked off the dead: background shows them in
      light, cobbled-together protection, sometimes scavenged plates and scraps of enemy armour,
      never in formal issue. This entry stands for the typical kit; no source gives its exact
      contents.
    design: >-
      The framework fixes only 'light' for Kroot armour, so it sits well under flak (30): torso DR
      15, arms and legs 8, and no protection elsewhere. Weak Points 8 (like Ork scrap plate, which
      the framework gives 7-8) for its gaps. Exact odds against the torso (DR 15, WP 8): lasgun
      100.0%, autogun 97.8%, pulse rifle 100.0%: it stops light blades, pistol rounds and shrapnel
      and little else. Weight 12 lb, cost $150, TL 4 (hide and hammered scrap: the gear itself is
      low-tech even when the plate was scavenged from a high-tech source).

  # ------------------------------------------------------------ Battlesuits (containers; servo ST on the servo child only)

  - name: "XV25 Stealth Battlesuit"
    tl: 11
    lc: 0
    cost: 40000
    weight: 95
    tags: ["Body Armor", "Xenos", "T'au", "Battlesuit", "Stealth"]
    dr: {"torso,vitals,groin": 85, "arm,leg": 73, "neck": 55, "skull": 85, "face": 63, "eye": 64, "hand": 50, "foot": 63}
    weak_points: 4
    attributes: {"sm": 0, "hp": 10}
    notes: >-
      Battlesuit rules. Sealed pilot: the suit is airtight against hostile atmospheres; extended
      vacuum operation is the GM's call. It needs trained handling: an untrained wearer is at -4 to
      all DX rolls and cannot use linked fire or the support systems. Linked fire (house rule, since
      GURPS lets one Attack maneuver fire one weapon): the pilot may fire all mounted weapons in one
      Attack maneuver at one target, rolling separately for each at -1 per weapon beyond the first
      that turn. A Multi-tracker removes that penalty and a Target Lock lets weapons fire at
      different targets (see those items). Size: about 2 m, SM 0 (framework gives no size; a stealth
      suit is slighter than a Crisis). One weapon hardpoint and one support hardpoint. GCS adds a
      container's children to its own weight and cost: the shell alone is 95 lb and $40,000; with
      its five children (119 lb, $77,000) the assembled suit is 214 lb and $117,000. The servo bonus
      lives on the Servo-Motor child only, so it is counted once. Structure HP: +10 HP for the wearer while the suit is worn (the container's `hp` bonus; the servos, plates and redundant systems absorb damage before the pilot is hurt, and it is why a battlesuit pilot is far harder to kill than a Fire Warrior on foot). The stealth field and jump jets
      are separate children, so they can be damaged or removed separately.
    lore: >-
      The T'au scout-suit: Codex: T'au Empire background describes the XV25 Stealth battlesuit as a
      light infiltration suit that hides its wearer with a stealth field and jumps in on jump jets,
      carrying a burst cannon or fusion blaster, for hit-and-run strikes behind the enemy line. The
      framework fixes its DR and features; sizes and weights are design numbers.
    design: >-
      Structure HP +10 (a light scout-suit, thin structure): built as extra HP for the wearer while the suit is worn, since the pilot's own HP is what the combat rules track, from combat testing where pilots died to one penetrating bolt. Anchor (framework): DR 85, Weak Points 4, stealth field (a large visual-concealment bonus, not
      DR), jump jets. Torso DR 85, WP 4 held exactly; limbs 73 (12 under the torso, as Astartes
      plate), neck 55, helmet 85, face 63 (25 under), hands 50 and feet 63; eye lens 64 (three-quarters of the
      helmet's 85). Exact odds against the
      torso (DR 85, WP 4): lasgun 7d(2) 0.0% (1.4% with WP 4); autogun 7d 0.0%; boltgun or pulse
      rifle 6dx2(2) 45.4% (46.4% with WP 4); heavy bolter (8d+2)x2(2) 96.1% (96.2% with WP 4); plasma
      gun 6dx4(3) 100.0%; autocannon 6dx3(3) 99.8%; krak missile 6dx6(3) 100.0%; lascannon 8dx8(5)
      100.0%; meltagun, short range 8dx6(10) 100.0%; Astartes power sword at ST 30, 8d+3(10) 100.0%.
      So it is Sororitas-grade plate (DR 85): a lasgun is stopped (1.4% with the Weak Points
      chance), a pulse rifle or a bolter goes through 45.4% of the time (the framework's Sororitas
      figure) and a heavy bolter 96%, and it does not stop plasma or anti-armour weapons. Eye lens
      (DR 64, three-quarters of the helmet's 85): lasgun 3.8%, boltgun 85.5%, plasma 100.0% (those are per eye hit; a random face hit
      is 1 in 6 an eye). Weight: shell 95 lb, 1.1 lb per DR point (Mk VII's shell is 1.5 lb per
      point; the Stealth suit's plates are thinner and it relies on the field), children 119 lb.
      Servo bonus Lifting +10 and Striking +5: enough to bring the pilot (ST 11) to 21 for the 45 lb
      burst cannon (Min ST 21M) and no more. Cost $40,000 for the shell, level with a Mk VII's
      plate; the stealth field is the expensive part, $45,000 as its own child.
    children:
      - name: "Servo-Motor Actuators (Stealth Pattern)"
        tl: 11
        lc: 0
        cost: 16000
        weight: 60
        attributes: {"lifting_st": 10, "striking_st": 5}
        notes: >-
          Powered strength for the suit: Lifting ST +10 and Striking ST +5. Counted only here; the
          parent has no ST bonus.
        lore: >-
          The suit's servos let its pilot carry a heavy weapon and jump with it; no source gives
          figures.
        design: >-
          Sized to just meet the burst cannon's Min ST 21M (11 + 10). A lighter package than the
          Crisis's (+18/+9) since a stealth suit is smaller and lighter.

      - name: "Stealth Field Generator"
        tl: 11
        lc: 0
        cost: 45000
        weight: 12
        skill_bonuses: {"Stealth": 6}
        notes: >-
          Scatters and bends light around the wearer: +6 to Stealth, and Vision rolls to spot the
          suit are at -6. Once the wearer is spotted, ranged attackers beyond 10 yards who rely on
          sight alone are at -3 to hit. It is a visual effect only: thermal, motion, audio and
          non-visual sensors see the suit normally, and it fails within 2 yards. Firing does not
          break it. No DR.
        lore: >-
          The stealth field is the XV25's defining feature in background, a large visual-concealment
          bonus, not armour; the exact ranges are not fixed in the sources.
        design: >-
          Framework: 'a large visual-concealment bonus, not DR'. +6 Stealth (a large bonus: an
          Invisibility-lite of the Aeldari kind), -6 to spot, a further -3 to be hit at range when
          the wearer is spotted but only seen by sight; the 10-yard threshold and 2-yard failure are
          design choices to keep it from being an invisibility cloak.

      - name: "Jump Jets (Stealth Pattern)"
        tl: 11
        lc: 0
        cost: 5000
        weight: 25
        notes: >-
          Flight, in short hops: Air Move 10, 4 seconds of thrust per fuel load (each turn of thrust
          uses 1), no hover: the pilot climbs on burn turns and must be descending or landing when
          the fuel is gone. A burning jump carries the suit about 30 yards up and 50 across. Refuel
          about 10 minutes. Exhaust wash 1d burn to anyone within 2 yards of a landing.
        lore: >-
          Jump jets, per framework: the stealth suit hops in and out of cover on them rather than
          flying.
        design: >-
          Scaled from the Astartes jump pack (Air Move 15, 6 s, 60 lb) and Sororitas pack (Air Move
          10, 4 s, 30 lb) since a Stealth suit is lighter than either wearer.

      - name: "Cockpit Interface, Sensors and Life Support (Stealth Pattern)"
        tl: 11
        lc: 0
        cost: 8000
        weight: 12
        skill_bonuses: {"Observation": 1}
        notes: >-
          Sealed cockpit, comm-link, display and sensor suite. +1 to Observation.
        lore: >-
          Battlesuit pilots fight by instruments; the suit's interface is the reason a T'au can
          fight in it.
        design: >-
          Flat +1, less than an Astartes auto-senses suite's +2 since it is a basic package. Flavour
          subsystem.

      - name: "Hardpoint Mounts (Stealth Pattern)"
        tl: 11
        lc: 0
        cost: 3000
        weight: 10
        notes: >-
          One weapon hardpoint (burst cannon or fusion blaster) and one support-system hardpoint.
          The weapons and systems are separate items and are not included.
        lore: >-
          Battlesuits are modular: the weapon and support items fitted are the pilot's choice.
        design: >-
          The mounting hardware, priced apart from what it carries.


  - name: "XV8 Crisis Battlesuit"
    tl: 11
    lc: 0
    cost: 45000
    weight: 165
    tags: ["Body Armor", "Xenos", "T'au", "Battlesuit", "Crisis"]
    dr: {"torso,vitals,groin": 110, "arm,leg": 98, "neck": 75, "skull": 110, "face": 85, "eye": 82, "hand": 68, "foot": 85}
    weak_points: 3
    attributes: {"sm": 1, "hp": 30}
    notes: >-
      Battlesuit rules. Sealed pilot: the suit is airtight against hostile atmospheres; extended
      vacuum operation is the GM's call. It needs trained handling: an untrained wearer is at -4 to
      all DX rolls and cannot use linked fire or the support systems. Linked fire (house rule, since
      GURPS lets one Attack maneuver fire one weapon): the pilot may fire all mounted weapons in one
      Attack maneuver at one target, rolling separately for each at -1 per weapon beyond the first
      that turn. A Multi-tracker removes that penalty and a Target Lock lets weapons fire at
      different targets (see those items). Size: about 2.5 m, SM +1 while worn (a bigger target, +1
      to be hit; also the larger reach of its stride). Three hardpoints, each carrying one weapon or
      one support system (see the Hardpoint Mounts child); no weapons are pre-loaded. GCS adds a
      container's children to its own weight and cost: the shell alone is 165 lb and $45,000; with
      its five children (261 lb, $71,000) the assembled suit is 426 lb and $116,000. Structure HP: +30 HP for the wearer while the suit is worn (the container's `hp` bonus; the servos, plates and redundant systems absorb damage before the pilot is hurt, and it is why a battlesuit pilot is far harder to kill than a Fire Warrior on foot). Servo ST lives
      on the Servo-Motor child only, so it is counted once.
    lore: >-
      The T'au's signature battlesuit: Codex: T'au Empire background shows the XV8 Crisis as a
      jet-pack-equipped assault suit, armed by choice from a list of burst cannons, plasma, fusion,
      missile and flamer weapons on three hardpoints and piloted by a Shas'ui or Shas'vre, and as
      the suit in which the T'au best show their doctrine of fast, heavily-armed hit-and-shoot
      mobile warfare. The framework fixes DR, Weak Points, eye lens, size, servo ST, jet pack and
      hardpoints; weights and costs are design numbers.
    design: >-
      Structure HP +30 (a Crisis is several times as hard to kill as a Fire Warrior in the lore, HP 11 pilot plus 30): built as extra HP for the wearer while the suit is worn, since the pilot's own HP is what the combat rules track, from combat testing where pilots died to one penetrating bolt. Anchor (framework): DR 110, Weak Points 3, eye 82, about 2.5 m (SM +1), servo ST as a child,
      jet pack, three hardpoints. Torso 110, WP 3 and eye 82 held exactly. Limbs 98 (12 under, as
      Astartes plate), neck 75, helmet 110, face 85 (25 under), hands 68, feet 85. Exact odds
      against the torso (DR 110, WP 3): lasgun 7d(2) 0.0% (0.1% with WP 3); autogun 7d 0.0%; boltgun
      or pulse rifle 6dx2(2) 6.1% (6.5% with WP 3); heavy bolter (8d+2)x2(2) 69.5% (69.6% with WP 3);
      plasma gun 6dx4(3) 99.8%; autocannon 6dx3(3) 98.0%; krak missile 6dx6(3) 100.0%; lascannon
      8dx8(5) 100.0%; meltagun, short range 8dx6(10) 100.0%; Astartes power sword at ST 30, 8d+3(10)
      100.0%. So it is a shade over Astartes plate: a lasgun almost never hurts it (0.1% with the
      Weak Points chance), a pulse rifle or bolter gets through 6.1% of the time (Astartes plate
      14.5%), a heavy bolter 69.5%; anti-armour weapons (autocannon 98%, plasma 99.8%, meltagun,
      lascannon, krak 100%) go through, so massed pulse and bolter fire is a real threat and heavy
      weapons kill it. Eye lens (DR 82, three-quarters of the helmet's 110): lasgun 0.0%, boltgun 54.6%, plasma 100.0%: a boltgun hit
      strikes a Crisis eye lens through 54.6% of the time, a brain hit for piercing/burn damage
      (B399), the suit's honest weak spot; a random face hit strikes an eye on 1 in 6. Weight: shell
      165 lb, 1.5 lb per DR point (the Astartes and Terminator shells are 1.5 lb per point),
      children 261 lb. Servo Lifting +18 / Striking +9: with a pilot ST 11 the suit lifts as ST 29
      and swings as ST 20, enough for a missile pod (21M), a plasma rifle (17M) or a cyclic ion
      blaster (21M) with room to spare. Cost: shell $45,000, servos $38,000, jets $18,000,
      hardpoints $6,000, cockpit $9,000: $116,000 assembled.
    children:
      - name: "Servo-Motor Actuators (Crisis Pattern)"
        tl: 11
        lc: 0
        cost: 38000
        weight: 150
        attributes: {"lifting_st": 18, "striking_st": 9}
        notes: >-
          Powered strength for the suit: Lifting ST +18 and Striking ST +9. Counted only here; the
          parent has no ST bonus. Min ST of mounted weapons is checked against pilot ST + Lifting
          ST.
        lore: >-
          Battlesuit servos let a T'au of ordinary strength carry weapons that a Marine would find
          heavy.
        design: >-
          Sized for the heaviest common Crisis weapon (46 lb missile pod, Min ST 21M: 11+18 = 29)
          with a margin. Well above the Astartes Mk VII's +9/+5 because a T'au pilot starts at ST 11
          rather than ST 30: the suit has to supply most of the strength (29 lifting against a
          Marine in Mk VII's 39).

      - name: "Jet Pack (Crisis Pattern)"
        tl: 11
        lc: 0
        cost: 18000
        weight: 55
        notes: >-
          Flight, in short bursts: Air Move 12, 8 seconds of thrust per fuel load (each turn of
          thrust uses 1). It can hover briefly (a turn spent hovering costs one turn of thrust) but
          cannot sustain flight: the pilot must be landed when the fuel is gone. A full-burn hop
          carries the suit about 60 yards up and 90 across. Refuel about 10 minutes. Exhaust wash 1d
          burn to anyone within 2 yards of a landing.
        lore: >-
          The Crisis suit's jet pack is its trademark: framework, jet pack for short flight bursts.
        design: >-
          Scaled from the Astartes jump pack (Air Move 15, 6 s, 60 lb) and the Sororitas Seraphim
          pack: a heavier suit (about 4x the Sororitas's) gets Air Move 12 and 8 s for a 55 lb pack;
          hovering is allowed briefly where the Astartes pack forbids it.

      - name: "Hardpoint Mounts (Crisis Pattern, 3)"
        tl: 11
        lc: 0
        cost: 6000
        weight: 30
        notes: >-
          Three hardpoints: each carries one weapon or one support system (for example two weapons
          and a shield generator). Weapons and systems are separate items and are not included; the
          suit is not pre-loaded.
        lore: >-
          Framework: three hardpoints for weapon and support systems.
        design: >-
          The mounting, feed and power hardware for three fittings, priced apart from what they
          carry.

      - name: "Cockpit Interface, Sensors and Life Support (Crisis Pattern)"
        tl: 11
        lc: 0
        cost: 9000
        weight: 26
        skill_bonuses: {"Observation": 1}
        notes: >-
          Sealed cockpit, comm-link, display, targeting sensors and air recycling (about a day). +1
          to Observation.
        lore: >-
          Battlesuit pilots fight by instruments; the suit's interface is why a T'au can fight in
          it.
        design: >-
          Flat +1, as the Stealth suit. Weight includes sensors and air supply (14 lb + 12 lb);
          flavour subsystem.


  - name: "XV88 Broadside Battlesuit"
    tl: 11
    lc: 0
    cost: 65000
    weight: 255
    tags: ["Body Armor", "Xenos", "T'au", "Battlesuit", "Broadside"]
    dr: {"torso,vitals,groin": 170, "arm,leg": 152, "neck": 118, "skull": 170, "face": 132, "eye": 128, "hand": 105, "foot": 132}
    weak_points: 3
    attributes: {"sm": 1, "basic_move": -1, "hp": 40}
    notes: >-
      Battlesuit rules. Sealed pilot: the suit is airtight against hostile atmospheres; extended
      vacuum operation is the GM's call. It needs trained handling: an untrained wearer is at -4 to
      all DX rolls and cannot use linked fire or the support systems. Linked fire (house rule, since
      GURPS lets one Attack maneuver fire one weapon): the pilot may fire all mounted weapons in one
      Attack maneuver at one target, rolling separately for each at -1 per weapon beyond the first
      that turn. A Multi-tracker removes that penalty and a Target Lock lets weapons fire at
      different targets (see those items). Size: about 3 m, SM +1. Heavy and slow: Basic Move -1
      while worn (a T'au's Move 5 becomes 4). No jet pack. Two weapon hardpoints (one heavy) and one
      support hardpoint. GCS adds a container's children to its own weight and cost: the shell alone
      is 255 lb and $65,000; with its three children (306 lb, $76,000) the assembled suit is 561 lb
      and $141,000. Structure HP: +40 HP for the wearer while the suit is worn (the container's `hp` bonus; the servos, plates and redundant systems absorb damage before the pilot is hurt, and it is why a battlesuit pilot is far harder to kill than a Fire Warrior on foot). Servo ST lives on the Servo-Motor child only, so it is counted once.
    lore: >-
      The T'au heavy-weapons suit: Codex: T'au Empire background describes the XV88 Broadside as a
      heavily armoured, slow platform for the heavy rail rifle and secondary missile weapons, the
      T'au long-range anti-armour line, positioned behind the front and fed by markerlight
      coordinates. The framework fixes DR, Weak Points, weight class and lack of a jet pack; the
      rest is design.
    design: >-
      Structure HP +40 (the heaviest frame, most redundancy): built as extra HP for the wearer while the suit is worn, since the pilot's own HP is what the combat rules track, from combat testing where pilots died to one penetrating bolt. Anchor (framework): DR 170, Weak Points 3; heavy and slow, no jet pack. Torso 170 and WP 3
      held exactly; limbs 152 (the same 0.89 ratio to torso as the Crisis and Astartes limbs), neck
      118, helmet 170, face 132, eye lens 128 (three-quarters of the helmet's 170, between the Crisis 82 and
      Terminator 150 lenses), hands 105, feet 132. Exact odds against the torso (DR 170, WP 3): lasgun 7d(2)
      0.0%; autogun 7d 0.0%; boltgun or pulse rifle 6dx2(2) 0.0% (0.2% with WP 3); heavy bolter
      (8d+2)x2(2) 0.4% (0.8% with WP 3); plasma gun 6dx4(3) 93.9%; autocannon 6dx3(3) 72.1% (72.2% with
      WP 3); krak missile 6dx6(3) 99.8%; lascannon 8dx8(5) 100.0%; meltagun, short range 8dx6(10)
      100.0%; Astartes power sword at ST 30, 8d+3(10) 99.8%. So it is Terminator-adjacent, a little
      under: bolters and pulse rifles are stopped (0.0%, 0.1% with WP), a heavy bolter 0.4% (0.8%
      with WP), an autocannon 72.1%, a plasma gun 93.9% (Terminator plate 85.5%), a krak missile
      99.8%, a lascannon and meltagun always. Eye lens (DR 128, three-quarters of the helmet's 170): lasgun 0.0%, boltgun 0.2%, plasma
      99.5%. Weight: shell 255 lb, 1.5 lb per DR point, children 306 lb. Servo Lifting +26 /
      Striking +13: a pilot of ST 11 is a 37-ST lifter, meeting the 90 lb heavy rail rifle's Min ST
      30M. Cost: shell $65,000, servos $60,000, hardpoints $6,000, cockpit $10,000: $141,000
      assembled. Basic Move -1, as Gravis armour: a heavy, jetless frame.
    children:
      - name: "Servo-Motor Actuators (Broadside Pattern)"
        tl: 11
        lc: 0
        cost: 60000
        weight: 250
        attributes: {"lifting_st": 26, "striking_st": 13}
        notes: >-
          Powered strength for the suit: Lifting ST +26 and Striking ST +13. Counted only here; the
          parent has no ST bonus. Min ST of mounted weapons is checked against pilot ST + Lifting
          ST.
        lore: >-
          Broadside servos let a T'au carry the biggest gun a T'au infantry unit fields.
        design: >-
          Sized so a Broadside's ST 11 + 26 = 37 handles the 90 lb heavy rail rifle (Min ST 30M)
          with margin, and so the pair of arms can swing as ST 24 if forced into melee.

      - name: "Hardpoint Mounts (Broadside Pattern)"
        tl: 11
        lc: 0
        cost: 6000
        weight: 30
        notes: >-
          Two weapon hardpoints (one able to carry a heavy weapon such as the heavy rail rifle) and
          one support hardpoint. Weapons and systems are separate items and are not included.
        lore: >-
          Broadsides pair a heavy rail rifle with a secondary missile weapon and support systems.
        design: >-
          Mounting, feed and power hardware, priced apart from what it carries.

      - name: "Cockpit Interface, Sensors and Life Support (Broadside Pattern)"
        tl: 11
        lc: 0
        cost: 10000
        weight: 26
        skill_bonuses: {"Observation": 1}
        notes: >-
          Sealed cockpit, comm-link, display, targeting sensors, air recycling. +1 to Observation.
        lore: >-
          Battlesuit pilots fight by instruments.
        design: >-
          As the Crisis suit; a little more for the Broadside's larger sensors and air supply.
          Flavour subsystem.


  # ------------------------------------------------------------ Support systems and other gear

  - name: "Shield Generator"
    tl: 11
    lc: 0
    cost: 30000
    weight: 20
    uses: 120
    tags: ["Xenos", "T'au", "Battlesuit", "Force Field", "Energy Shield"]
    notes: >-
      Regenerating shield (framework, Personal force fields): 120 SP, 3 seconds without damage
      before it recharges, then 20 SP per second, covering all attacks. Damage from an attack the
      field covers comes off SP first; armour divisors do not apply to SP. If an attack does more
      damage than the SP remaining, the field drops to 0 and the excess passes to worn armour with
      the attack's full armour divisor. A bolt stopped by the field detonates on it: its follow-up
      damage also comes off SP. A field knocked to 0 needs double its delay (6 seconds) before
      recharging. Track current SP with the Uses counter (max 120). Fitted to a battlesuit support
      hardpoint.
    lore: >-
      A staple support system of Crisis and Broadside battlesuits: Codex: T'au Empire background
      shows shield generators as a common fitting on battlesuits and Commanders, projecting a
      protective energy field around the suit.
    design: >-
      Anchor (framework): 'regenerating shield, iron-halo class (120 SP, 3 s, 20/s)'. Held exactly.
      The Imperial iron halo's own table row is 120 SP, delay 3 s, 20 SP/s, covering all; so a T'au
      shield generator is an iron halo in every number: a plasma gun hit (average 84) takes 84 of
      120 SP; a bolter hit (42) plus its follow-up takes about 63 SP, so two bolts drop it; a lasgun
      hit averages 24.5, so five; a lascannon hit (average 224) breaks it and drives about 100 into
      the armour with divisor (5). Weight 20 lb and cost $30,000: a heavy support system sized to
      fit a battlesuit hardpoint (design numbers).

  - name: "Multi-tracker"
    tl: 11
    lc: 0
    cost: 6000
    weight: 8
    tags: ["Xenos", "T'au", "Battlesuit"]
    notes: >-
      Fire-control link for a battlesuit's weapons: the -1 per extra weapon for linked fire (see the
      battlesuit notes) is removed, so a pilot can fire all mounted weapons in one Attack maneuver
      at one target with no penalty. Occupies one support hardpoint. It does not let weapons fire at
      different targets: that is Target Lock.
    lore: >-
      Codex: T'au Empire background lists a multi-tracker among battlesuit support systems; its
      exact effect varies between editions of the rules and I do not hold a firm version, so this is
      a modelled effect.
    design: >-
      No anchor. The house linked-fire rule sets a -1 per weapon beyond the first when several
      weapons fire in one maneuver, since GURPS otherwise allows one weapon per Attack maneuver. The
      multi-tracker's role, as a system that improves how a suit's fire is managed, is honestly
      modelled as removing that penalty (worth at most -2 on a three-weapon suit). Weight 8 lb, cost
      $6,000.

  - name: "Target Lock"
    tl: 11
    lc: 0
    cost: 8000
    weight: 10
    tags: ["Xenos", "T'au", "Battlesuit"]
    notes: >-
      Independent weapon aiming: when linked-fire weapons are fired in one Attack maneuver, each may
      be assigned to a different target. Each additional target beyond the first costs -2 to that
      weapon's roll (this does not stack with the -1 per extra weapon, which a Multi-tracker
      removes). Occupies one support hardpoint.
    lore: >-
      Codex: T'au Empire background lists target lock among battlesuit support systems; the wording
      of its effect changes between editions, so the numbers here are the modeller's, not the
      Codex's.
    design: >-
      No anchor. Each extra target costs -2 to its weapon's roll: a design number, kept simple.
      Weight 10 lb, cost $8,000.

  - name: "Drone Controller"
    tl: "11^"
    lc: 0
    cost: 9000
    weight: 12
    tags: ["Xenos", "T'au", "Battlesuit"]
    notes: >-
      A command link for up to two drones: the pilot can order them (attack, guard, follow, spot,
      shield) as a free action on the pilot's turn; drones act on the pilot's initiative and use
      their own stats (a template matter). Radio range about one mile. Without a controller a
      battlesuit cannot direct drones. Occupies one support hardpoint.
    lore: >-
      Codex: T'au Empire background lists a drone controller among the Crisis suit's supports;
      drones (gun, marker, shield) are the T'au's cheap, expendable auxiliaries.
    design: >-
      Framework: drones are small flying AI units built as templates, like the servitor. The
      controller is the link. TL 11^ because drone AI is ^ in the framework. Two drones is the
      standard load; weight 12 lb, cost $9,000.

  - name: "Early Warning Override"
    tl: 11
    lc: 0
    cost: 5000
    weight: 8
    tags: ["Xenos", "T'au", "Battlesuit"]
    notes: >-
      Proximity sensors and a reflex link: +3 to Per rolls to notice enemies approaching or arriving
      within 20 yards, and once per fight the pilot may interrupt to fire one hardpoint weapon (no
      penalty) at the first hostile that comes within 12 yards before it acts. Occupies one support
      hardpoint.
    lore: >-
      Codex: T'au Empire background lists an early warning override among battlesuit support
      systems; as I recall, the tabletop version is an out-of-turn shot at arriving enemies, which
      is what I have modelled.
    design: >-
      No anchor. The tabletop effect is a reaction fire at an enemy that arrives; +3 to notice and a
      once-per-fight interrupt is the minimum honest GURPS rendering. Weight 8 lb, cost $5,000.

  - name: "Velocity Tracker"
    tl: 11
    lc: 0
    cost: 4000
    weight: 8
    tags: ["Xenos", "T'au", "Battlesuit"]
    notes: >-
      Tracking sensors for fast targets: +2 to hit with mounted weapons against flyers and against
      targets whose speed penalty is -5 or worse. It does nothing against slow or stationary
      targets. Occupies one support hardpoint.
    lore: >-
      Codex: T'au Empire background lists a velocity tracker among battlesuit support systems, for
      shooting fast aircraft and skimmers.
    design: >-
      No anchor. A flat +2 against the hardest targets in GURPS speed/range terms (speed penalty -5
      is a fast vehicle or aircraft at range). Weight 8 lb, cost $4,000.

  - name: "Advanced Targeting System"
    tl: 11
    lc: 0
    cost: 7000
    weight: 10
    tags: ["Xenos", "T'au", "Battlesuit"]
    notes: >-
      A targeting computer: +1 to hit with all mounted weapons (in addition to the weapon's own
      Acc). Occupies one support hardpoint.
    lore: >-
      Codex: T'au Empire background lists an advanced targeting system among battlesuit supports; it
      improves the accuracy of fire. Its exact rule differs between editions, so +1 is the
      modeller's choice.
    design: >-
      No anchor. A +1 to hit is the smallest meaningful GURPS bonus, an honest rendering of an
      improved-accuracy system. Weight 10 lb, cost $7,000.

  - name: "Ethereal Hover Drone"
    tl: "11^"
    lc: 0
    cost: 20000
    weight: 60
    tags: ["Xenos", "T'au", "Ethereal"]
    notes: >-
      Grav platform: Flight (hover, grav-lift) at Air Move 8, altitude to 20 yards, can carry an
      Ethereal (and up to 250 lb in all) standing on it, and can hover indefinitely. No jet-pack
      fuel limit: it is grav-lift. The platform is a small vehicle: HP 30, DR 25, SM 0. It follows
      the Ethereal's orders as a drone (see the drone templates).
    lore: >-
      Codex: T'au Empire background shows Ethereals attended by hover drones and moving on grav
      platforms; I hold the exact form (a platform the Ethereal stands on, versus a drone that
      attends) with low confidence, so this entry is a flight platform with drone control.
    design: >-
      The framework asks for a flight platform; T'au grav systems are the ^ TL exception. Air Move 8
      (about 16 mph, slow: a dignitary's progress rather than a jet), 20-yard altitude, 250 lb load,
      60 lb. HP 30 and DR 25 make it a small vehicle: a lasgun hit (7d(2)) penetrates it 99.7% of
      the time. All numbers are design choices; no source gives them.

