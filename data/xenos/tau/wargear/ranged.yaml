      Hardpoint weapon: a battlesuit uses the suit's strength, not the pilot's. Minimum ST is
      checked against the pilot's ST plus the suit's Lifting ST bonus (Crisis 11+18=29, Stealth
      11+10=21, Broadside 11+26=37), so the M in Min ST is met by the suit's servos and the weapon
      cannot be fired by an unaided T'au. Beyond the first range bracket the burn diffuses and loses
      its armour divisor, as for any meltagun-class weapon.
    lore: >-
      The T'au anti-armour close-range weapon: Codex: T'au Empire background places fusion blasters
      on Crisis, Stealth and Commander battlesuits and gives them a short-range melta role. It is
      the weapon T'au commanders use to kill tanks and heavy elite infantry that their long-range
      guns cannot stop.
    design: >-
      Anchor (framework): meltagun. Exact dice: short range 8dx6(10), average 168.0, penetrates
      flak, carapace, Astartes plate and Terminator plate 100.0% of hits, and every vehicle AV10-14
      100.0% (AV10 100.0%, AV11 100.0%, AV12 100.0%, AV13 100.0%, AV14 100.0%); beyond short range
      4dx6(3), average 84.0, flak 100.0%, carapace 100.0%, Astartes 99.6%, Terminator plate 76.1%
      (76.2% with WP 3), Tartaros (190) 84.1%; vehicles AV10 99.6%, AV11 94.6%, AV12 76.1%, AV13
      33.6%, AV14 5.4%. So 'kills AV14 at short range' and 'wrecks AV12 (76%) but almost never AV14
      (5%)' hold exactly. Handling: 22 lb loaded (a meltagun is 17 lb; a suit weapon carries a
      bigger cell), Min ST sqrt(220)=14.8, 15M. RoF 1, Shots 4(5) (as the meltagun: a T'au fusion
      cell of the same class). Acc 3: the meltagun's 2, plus 1 for the suit's targeting. Range 10/50
      as the meltagun (the framework treats the two as the same class); Bulk -4, Rcl 1.

  - name: "Missile Pod"
    tl: 11
    lc: 0
    cost: 6000
    weight: 46
    tags: ["Missile Weapon", "Xenos", "T'au", "Battlesuit", "Crisis"]
    weapons:
      - usage: "Standard, mounted"
        damage: "6dx3(3) cr ex"
        acc: 6
        range: "1000/3000"
        rof: 3
        shots: "12(6)"
        st: "21M"
        bulk: -6
        rcl: 2
        skill: "Gunner (Rockets)"
    notes: >-
      Hardpoint weapon: a battlesuit uses the suit's strength, not the pilot's. Minimum ST is
      checked against the pilot's ST plus the suit's Lifting ST bonus (Crisis 11+18=29, Stealth
      11+10=21, Broadside 11+26=37), so the M in Min ST is met by the suit's servos and the weapon
      cannot be fired by an unaided T'au. Unguided: the pod's small rockets do not need a
      markerlight and gain no bonus from one beyond the ordinary networked attack bonus.
    lore: >-
      A pod of small rockets in a rapid-firing pod: Codex: T'au Empire background lists the missile
      pod as an anti-infantry and light-armour option on Crisis suits, and as the sort of weapon one
      Broadside or Crisis carries in quantity.
    design: >-
      Anchor (framework): 6dx3(3) cr ex, autocannon class. Exact dice: average 63.0; penetrates flak
      100.0%, carapace 100.0%, Astartes 99.0%, Terminator plate 36.3% (36.6% with WP 3), Tartaros
      (190) 45.4%; vehicles AV10 99.0%, AV11 85.5%, AV12 36.3%, AV13 1.0%, AV14 0.0%, the Imperial
      autocannon's figures exactly (AV10 99%, AV11 85%, AV12 36%, AV13 1%). It kills flak and
      carapace, kills a Marine 99% of the time, and cracks a Terminator 36%. Handling: 46 lb loaded
      (a pod of rockets and their feed; an autocannon is 85 lb with its tripod), Min ST
      sqrt(460)=21.4, 21M. RoF 3 (a rocket every third of a second; a pod, not a gun). Acc 6, a
      mounted rocket pod with the suit's guidance; range 1000/3000, the autocannon's. Shots 12(6), a
      pod's worth. Bulk -6, Rcl 2 (rocket launch, but the propellant is in the rocket).

  - name: "Smart Missile System"
    tl: 11
    lc: 0
    cost: 9500
    weight: 50
    tags: ["Missile Weapon", "Xenos", "T'au", "Battlesuit", "Broadside"]
    weapons:
      - usage: "Standard, self-guided"
        damage: "5dx2(2) cr ex"
        acc: 6
        range: "1000/3000"
        rof: 4
        shots: "20(10)"
        st: "22M"
        bulk: -7
        rcl: 2
        skill: "Gunner (Rockets)"
        notes: >-
          The missiles seek a target that any networked T'au can see (a markerlight mark, a drone,
          an ally's sights): the firer needs no line of sight, ignores cover and concealment
          penalties, and rolls at -2 if the target is sensed only by the network. A target that has
          left the network's sight cannot be fired at.
    notes: >-
      Hardpoint weapon: a battlesuit uses the suit's strength, not the pilot's. Minimum ST is
      checked against the pilot's ST plus the suit's Lifting ST bonus (Crisis 11+18=29, Stealth
      11+10=21, Broadside 11+26=37), so the M in Min ST is met by the suit's servos and the weapon
      cannot be fired by an unaided T'au.
    lore: >-
      A mass of small self-guided missiles: Codex: T'au Empire background describes smart missile
      systems on Broadside battlesuits and on vehicles as an anti-infantry weapon that can strike
      targets the firer cannot see, using T'au network data; the missiles are guided by sensors on
      each rocket.
    design: >-
      Anchor (framework): 5dx2(2) cr ex, self-guided, no line of sight. Exact dice: average 35.0;
      penetrates flak 99.7%, carapace 50.0% (52.3% with WP 5), Astartes 1.6% (3.3% with WP 4),
      Terminator plate 0.0%, Tartaros (190) 0.0%; vehicles AV10 1.6%, AV11 0.0%, AV12 0.0%, AV13
      0.0%, AV14 0.0%. So it is anti-infantry: about half of hits go through carapace and almost all
      through flak, and nothing gets through Astartes plate except on a Weak Point (3.3%). The
      guidance rule (no line of sight, cover ignored, -2 if only network-sensed) is a design
      mechanic to express 'needs no line of sight' at the table. Handling: 50 lb loaded, Min ST
      sqrt(500)=22.4, 22M. RoF 4 (a salvo of four small missiles). Acc 6 (guided, but small
      seekers), range 1000/3000. Shots 20(10) (the magazine on the Broadside's back). Bulk -7, Rcl
      2.

  - name: "Seeker Missile"
    tl: 11
    lc: 0
    cost: 1800
    weight: 22
    tags: ["Missile Weapon", "Xenos", "T'au", "Battlesuit", "Broadside"]
    weapons:
      - usage: "Markerlight-guided"
        damage: "6dx6(3) cr ex"
        acc: 8
        range: "1500/4500"
        rof: 1
        shots: "1(10)"
        st: "15M"
        bulk: -6
        rcl: 1
        skill: "Gunner (Rockets)"
        notes: >-
          Fire only at a target with at least one markerlight mark: no line of sight is needed,
          cover and concealment penalties do not apply. Without a mark the missile has no guidance
          and cannot be aimed. Each missile is one shot.
    notes: >-
      Hardpoint weapon: a battlesuit uses the suit's strength, not the pilot's. Minimum ST is
      checked against the pilot's ST plus the suit's Lifting ST bonus (Crisis 11+18=29, Stealth
      11+10=21, Broadside 11+26=37), so the M in Min ST is met by the suit's servos and the weapon
      cannot be fired by an unaided T'au. One item is one missile; the launch rail is part of the
      battlesuit hardpoint or vehicle.
    lore: >-
      A one-shot guided anti-armour missile: Codex: T'au Empire background places seeker missiles on
      Broadside battlesuits and on vehicles (Skyray, Hammerhead), fired at targets marked by a
      Pathfinder's markerlight.
    design: >-
      Anchor (framework): krak-missile anchor 6dx6(3) cr ex, fired by a markerlight lock. Exact
      dice: average 126.0; penetrates flak 100.0%, carapace 100.0%, Astartes 100.0%, Terminator
      plate 99.0%, Tartaros (190) 99.5%; vehicles AV10 100.0%, AV11 99.9%, AV12 99.0%, AV13 90.4%,
      AV14 63.7%, the krak missile's figures exactly (AV12 99%, AV13 90%, AV14 64%: reliable vs
      AV12-13, two in three vs AV14). Handling: a whole missile plus its launch rail fitting weighs
      22 lb (a krak missile is 10 lb), Min ST sqrt(220)=14.8, 15M. RoF 1, Shots 1(10) (a reload of a
      fresh missile by a crew). Acc 8: the missile flies the laser, so the roll is for a clean
      launch rather than aim. Range 1500/4500: a rocket's reach, better than the launcher's 100/1800
      because of the seeker. Bulk -6, Rcl 1.

  # ------------------------------------------------------------ Flame, frag and designators

  - name: "Flamer, T'au Pattern"
    tl: 11
    lc: 0
    cost: 700
    weight: 12
    tags: ["Missile Weapon", "Xenos", "T'au", "Battlesuit", "Crisis"]
    weapons:
      - usage: "Cone attack (5 yards)"
        damage: "4d burn"
        range: 5
        shots: "4(5)"
        st: "11M"
        bulk: -3
        skill: "Liquid Projector (Flamethrower)"
        notes: >-
          No Acc bonus applies and no aiming roll is needed against a target inside the cone (B281):
          the skill roll is only to avoid intervening obstacles and keep the cone off friendly
          targets. Cover bonuses are halved (round down) against the cone, not ignored.
      - usage: "Follow-up (per turn while ablaze)"
        damage: "1d burn"
        range: 5
        shots: "4(5)"
        st: "11M"
        bulk: -3
        skill: "Liquid Projector (Flamethrower)"
        notes: >-
          A target who fails an HT roll on being hit catches fire and takes this every turn until
          extinguished (B433); DR does not reduce it. It does not apply at all against a
          hermetically sealed suit whose seal has not been breached: T'au battlesuits and Astartes
          power armour are sealed (GM's call).
    notes: >-
      Hardpoint weapon: a battlesuit uses the suit's strength, not the pilot's. Minimum ST is
      checked against the pilot's ST plus the suit's Lifting ST bonus (Crisis 11+18=29, Stealth
      11+10=21, Broadside 11+26=37), so the M in Min ST is met by the suit's servos and the weapon
      cannot be fired by an unaided T'au. A cone attack needs no Acc or Rcl.
    lore: >-
      A pressurised fire weapon: Codex: T'au Empire background lists the flamer as a Crisis
      battlesuit option for clearing trenches, buildings and dense cover where their long-range fire
      is blocked. The sources give no more than that it produces a jet of burning fuel; a small,
      compact unit.
    design: >-
      Anchor (framework): Imperial flamer parity. Same 4d burn, 5-yard cone and 1d burn follow-up as
      the Imperial Flamer, so the same odds apply: 4d burn (average 14) goes through nothing
      armoured (0.0% vs flak; 5.4% with the Weak Points chance) and is an unarmoured-target killer;
      the burning follow-up is the real threat and ignores DR. The sealed-armour exemption is
      carried over from the Imperial entry. Handling: 12 lb loaded (the Imperial flamer is 14 lb; a
      smaller tank), Min ST sqrt(120)=11, 11M, derived from weight and suit-mounted (the Imperial
      flamer's lower ST 9 for 14 lb is not copied). Shots 4(5) as the Imperial flamer. Bulk -3. TL
      11 (T'au tech): a small integrated unit, so I have not dropped it to the simple TL of the
      Imperial tank-and-igniter.

  - name: "Airbursting Fragmentation Projector"
    tl: 11
    lc: 0
    cost: 5000
    weight: 24
    tags: ["Missile Weapon", "Xenos", "T'au", "Battlesuit", "Crisis"]
    weapons:
      - usage: "Airburst, mounted"
        damage: "4d cr ex [7d cut]"
        acc: 4
        range: "250/900"
        rof: 3
        shots: "9(5)"
        st: "16M"
        bulk: -5
        rcl: 2
        skill: "Gunner (Cannon)"
        notes: >-
          Each burst detonates over the target: hard cover between the firer and the target does not
          stop the fragments unless the target also has overhead cover (a roof, a heavy canopy).
          Otherwise fragments are as B414, with no armour divisor.
    notes: >-
      Hardpoint weapon: a battlesuit uses the suit's strength, not the pilot's. Minimum ST is
      checked against the pilot's ST plus the suit's Lifting ST bonus (Crisis 11+18=29, Stealth
      11+10=21, Broadside 11+26=37), so the M in Min ST is met by the suit's servos and the weapon
      cannot be fired by an unaided T'au. The frag cloud is rolled as fragmentation (B414): the
      bracketed dice are the cut damage; the 4d cr ex is the blast.
    lore: >-
      An anti-infantry launcher: Codex: T'au Empire background lists the airbursting fragmentation
      projector as a Crisis battlesuit weapon that shoots shells fused to burst above hidden
      infantry, the T'au answer to entrenched troops.
    design: >-
      No framework number beyond the frag anchors: Imperial frag grenade 3d cr ex [6d cut] and
      missile launcher frag 6d cr ex [9d cut]. It sits between them: a cluster of small charges, 4d
      cr ex [7d cut], with no armour divisor. Exact dice for the fragments: 7d cut (average 24.5)
      penetrates flak 9.4% (23.7% with WP 7), carapace 0.0%, Astartes plate 0.0%; it is a weapon
      against the unarmoured and the lightly armoured, not against armour, exactly like the Imperial
      frag. The airburst rule is the only thing that distinguishes it. Handling: 24 lb loaded, Min
      ST sqrt(240)=15.5, 16M. RoF 3, Shots 9(5), Acc 4 (fused shells with a fire-control range
      gate), range 250/900 (a grenade launcher's 170/650, stretched), Bulk -5, Rcl 2 (a shell
      launcher). Skill Gunner (Cannon): a suit-mounted shell projector, not a hand-held grenade
      launcher.

  - name: "Markerlight"
    tl: 11
    lc: 0
    cost: 6000
    weight: 4.5
    tags: ["Missile Weapon", "Xenos", "T'au", "Fire Caste", "Pathfinder"]
    weapons:
      - usage: "Designate"
        damage: "spec"
        acc: 9
        range: "1500/4500"
        rof: 1
        shots: "60(3)"
        st: 7
        bulk: -4
        rcl: 1
        skill: "Beam Weapons (Rifle)"
        notes: >-
          Does no damage. A hit places one mark on the target. Marks last until the end of the
          marker's next turn, and a target may carry up to three. While a target is marked, every
          networked T'au (troops, drones and battlesuits sharing a data link; network range is the
          GM's call, roughly line of sight to the marker's transmissions) who attacks it gains +1
          per mark (maximum +3) to hit and ignores cover and concealment penalties, and a seeker
          missile may be fired at it with no line of sight. The target may see the dot: a marked
          target that notices has -1 to any Stealth roll to hide again.
    notes: >-
      A designator, not a weapon. Uses no ammunition apart from a small pack.
    lore: >-
      The Pathfinder's tool and the basis of T'au fire coordination: Codex: T'au Empire background
      gives markerlights to Pathfinders, some Fire Warrior teams, drones and battlesuit systems, and
      treats the mark as what turns their long-range weapons into a networked killing zone; seekers
      are fired at marked targets.
    design: >-
      Anchor (framework): laser designator, no damage. A marked target gives networked T'au shooters
      +1 per mark (max +3) and removes cover penalties; seekers fire on a mark without line of
      sight. There is no damage line: the 'spec' damage is a zero-damage designate line, with all
      rules in the notes. The mark's duration (until the marker's next turn) and the -1 to hide are
      design choices; the framework fixes only the +1 per mark, the cap of +3, the removal of cover
      penalties and seeker use. Handling: 4.5 lb (a designator with its pack), Min ST 7
      (sqrt(45)=6.7). RoF 1 (each mark is one aimed hit). Acc 9: a laser designator's flat
      trajectory (beam +2), rifle 4 and a designator optic +3. Range 1500/4500. Bulk -4, Rcl 1 (none
      really: beam).

  # ------------------------------------------------------------ Grenades

  - name: "Photon Grenade"
    tl: 11
    lc: 0
    cost: 60
    weight: 0.8
    tags: ["Missile Weapon", "Xenos", "T'au", "Fire Caste", "Pathfinder"]
    weapons:
      - usage: "Flash"
        damage: "spec"
        skill: "Throwing"
        notes: >-
          Everyone within 5 yards facing the grenade when it goes off must roll HT-6 or be blinded
          for 1d minutes; anyone looking away or wearing eye protection is unaffected. No HP damage.
          The same charge is fired from a pulse carbine's underslung launcher.
    notes: >-
      A flash charge. It can be thrown, or launched from the pulse carbine's grenade launcher.
    lore: >-
      A blinding-flash grenade: Codex: T'au Empire background lists photon grenades among the
      wargear of Pathfinders and Fire Warriors, used to blind and stall an enemy at close quarters
      so the T'au can fall back and shoot; consistent with a people who avoid melee.
    design: >-
      Anchor (framework): blinding flash, affliction, no damage. Built at parity with the Imperial
      Photon Flash Grenade, an Affliction-style blinding flash resolved on an HT roll rather than
      damage: the same 5-yard radius, HT-6, 1d minutes. The T'au version differs in TL (11) and cost
      only. 'spec' is the schema's no-damage marker, with the effect in notes.

  - name: "EMP Grenade"
    tl: 11
    lc: 0
    cost: 250
    weight: 1.2
    tags: ["Missile Weapon", "Xenos", "T'au", "Fire Caste"]
    weapons:
      - usage: "EMP burst"
        damage: "spec"
        skill: "Throwing"
        notes: >-
          No effect on living flesh. Vehicles, robots, drones and servitors within 2 yards have all
          active systems (weapons, engines, vox) disabled for 2d turns unless the GM rules the
          target shielded; against a war engine, an unusually harsh HT roll instead.
    notes: >-
      Machines only.
    lore: >-
      An anti-vehicle electromagnetic-pulse charge: Codex: T'au Empire background lists EMP grenades
      among Fire Caste anti-vehicle wargear. Which units carry them I hold with low confidence; the
      weapon's function (a disabling pulse against machines, nothing to flesh) is clear.
    design: >-
      Anchor (framework): haywire-like, machines only. Built at parity with the Imperial Haywire
      Grenade (no HP damage, a 2-yard systems disable of 2d turns), with T'au TL 11 and cost 250. It
      is never a damage roll: a machine's armour is irrelevant. Vehicles that are sealed or shielded
      are the GM's call, as for the Imperial grenade.

  # ------------------------------------------------------------ Kroot and Vespid

  - name: "Kroot Rifle"
    tl: 11
    lc: 0
    cost: 800
    weight: 10
    tags: ["Missile Weapon", "Melee Weapon", "Xenos", "T'au", "Kroot"]
    weapons:
      - usage: "Standard"
        damage: "7d(2) pi"
        acc: 5
        range: "500/1500"
        rof: 3
        shots: "20(3)"
        st: 10
        bulk: -5
        rcl: 2
        skill: "Guns (Rifle)"
      - usage: "Blade stock (rifle reversed, two-handed)"
        damage: "sw+1 cut"
        st: 10
        reach: "1"
        parry: "0"
        skill: "Staff"
        notes: >-
          A blade fitted to the stock of the rifle. A Kroot at ST 12 swings 1d+3 cut with it. No
          Parry bonus.
    notes: >-
      Charged-slug rifle built by the Kroot around T'au induction coils.
    lore: >-
      The Kroot Carnivore's weapon: Codex: T'au Empire background describes Kroot rifles as
      slug-throwing long guns built by the Kroot to their own tastes, with T'au tech at the core,
      and fitted with a blade at the stock for the melee the Kroot like. Kroot fight more willingly
      in melee than the T'au, which is why the blade is there.
    design: >-
      Anchor (framework): T'au-made charged slug in a Kroot-built long gun, 7d(2) pi; blade-fitted
      stock. Exact dice: average 24.5; penetrates flak 97.8% (98.1% with WP 7), carapace 0.6% (4.9%
      with WP 5), Astartes 0.0% (0.8% with WP 4), Terminator plate 0.0%, Tartaros (190) 0.0%;
      vehicles: nothing. That is a lasgun's punch (7d(2) burn: flak 98%, carapace 0.6%) in a slug,
      so a Kroot squad is as good as a Guard squad against flak and is stopped by carapace except on
      a Weak Point. Handling: 10 lb loaded, Min ST 10 (sqrt(100)=10; a Kroot has ST 12). RoF 3:
      semi-automatic. Acc 5, range 500/1500 (a lasgun's 400/1200, longer for a rail-accelerated
      slug), Bulk -5, Rcl 2 (a slug). Shots 20(3). Blade line: sw+1 cut at reach 1: a rifle butt
      with a blade, using Staff (a long haft), no parry bonus.

  - name: "Kroot Gun"
    tl: 11
    lc: 0
    cost: 2400
    weight: 28
    tags: ["Missile Weapon", "Xenos", "T'au", "Kroot"]
    weapons:
      - usage: "Braced"
        damage: "9d(2) pi+"
        acc: 6
        range: "800/2400"
        rof: 2
        shots: "10(4)"
        st: "17B"
        bulk: -7
        rcl: 3
        skill: "Guns (Rifle)"
    notes: >-
      A heavy Kroot slug gun. B: bipod-braced; a Krootox can carry and steady it.
    lore: >-
      A heavier, larger-bore weapon of the Kroot: background places the Kroot gun with the Krootox
      riders, the big beasts the Kroot breed as living gun platforms. I am reasonably, not
      perfectly, sure of the carrier; sources give no numbers.
    design: >-
      No framework anchor beyond 'Kroot rifle'. Built as the rifle's bigger sibling: two more dice
      and a larger slug, 9d(2) pi+ (x1.5). Exact dice: average 31.5; penetrates flak 100.0%,
      carapace 22.0% (25.6% with WP 5), Astartes 0.0% (1.6% with WP 4), Terminator plate 0.0%,
      Tartaros (190) 0.0%. It goes through flak always and carapace about one hit in four, but not
      Astartes plate except a Weak Point. Handling: 28 lb loaded, Min ST sqrt(280)=16.7, 17B: a
      Kroot at ST 12 must brace it, or fire from a Krootox. RoF 2 (a heavy slug, semi-automatic but
      slow). Acc 6, range 800/2400, Bulk -7, Rcl 3, Shots 10(4). Design numbers throughout.

  - name: "Neutron Blaster"
    tl: 11
    lc: 0
    cost: 3500
    weight: 6
    tags: ["Missile Weapon", "Xenos", "T'au", "Vespid"]
    weapons:
      - usage: "Standard"
        damage: "5dx2(4) burn"
        acc: 3
        range: "100/300"
        rof: 2
        shots: "12(4)"
        st: 8
        bulk: -4
        rcl: 1
        skill: "Beam Weapons (Rifle)"
    notes: >-
      Crystal-linked to a Vespid's own crystal: it cannot be fired by a non-Vespid without a crystal
      link (GM's call; a T'au at -4).
    lore: >-
      The Vespid Stingwing's weapon: Vespid background gives the winged Vespid a short-range neutron
      blaster linked to a crystal each carries; the crystal-link is the part I recall with
      confidence, and the rest is design.
    design: >-
      Anchor (framework): 5dx2(4) burn, short range. Exact dice: average 35.0; penetrates flak
      100.0%, carapace 99.3%, Astartes 90.2% (90.4% with WP 4), Terminator plate 1.6% (2.0% with WP
      3), Tartaros (190) 5.9%; vehicles AV10 90.2%, AV11 40.0%, AV12 1.6%, AV13 0.0%, AV14 0.0%. The
      (4) divisor gives it one of the best T'au infantry hit rates against Marine plate (90%, behind
      only the ion weapons), but the damage is low: a hit through Astartes plate averages 11 points
      of injury, so a Marine takes three or four hits to drop. Handling: 6 lb, Min ST 8
      (sqrt(60)=7.7). RoF 2 (a Vespid's short burst), Acc 3, range 100/300 (anchor: short range),
      Bulk -4, Rcl 1, Shots 12(4).

