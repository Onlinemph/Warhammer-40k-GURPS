kind: template
output: Xenos/Tau/Templates/Water Caste Envoy (Por).gct
notes: >-
  A Water caste envoy (Por): a diplomat, trader and administrator who carries the Greater
  Good to other species. Light-boned and quick with words, he is very poor with a gun.
  Point math (see Xenos/Tau/Traits/T'au Traits.adq): T'au Physiology (17) + Water Caste
  Lens (65) + The Greater Good (-15) + Devotion to the Ethereals (-1) = 66 points of traits,
  plus skills (57 points) = 123 points. Stats: ST 9, DX 10, IQ 13, HT 10, HP 9, Will 13,
  Per 12, Speed 5.0, Move 5, Dodge 8. Tier: trained soldier (100-175).


  Language Talent and Cultural Adaptability carry the 'tongue as weapon' line from the
  framework. Specific languages are not listed (campaign-dependent, and cheap once Language
  Talent is bought).
traits:
