kind: template
output: Xenos/Tau/Templates/Commander (Shas'o).gct
notes: >-
  A Shas'o: a Fire caste commander of decades' standing, a master of Kauyon and Mont'ka,
  who leads a cadre of Shas'la, Shas'ui and Shas'vre and their drones. Most command from
  a battlesuit. Point math (see Xenos/Tau/Traits/T'au Traits.adq): T'au Physiology (17)
  + Fire Caste Lens (70) + Fire Warrior Training (6) + Commander Lens (Shas'o) (147) +
  Military Rank (Fire Caste) (25) + The Greater Good (-15) + Devotion to the Ethereals
  (-1) = 249 points of traits, plus skills (146 points) = 395 points. Stats: ST 11, DX
  15, IQ 14, HT 12, HP 11, Will 15, Per 14, Speed 6.75, Move 6, Dodge 9. Tier: senior
  agent (350-600).


  Commander Lens carries the two doctrines as Perks (see the trait). Military Rank 5 (25
  points) is the Shas'o rung. Weapon skills as for the Shas'vre; suit and drone are equipment.
traits:
- {include: xenos/tau/traits.yaml#T'au Physiology}
- {include: xenos/tau/traits.yaml#Fire Caste Lens}
- {include: xenos/tau/traits.yaml#Fire Warrior Training}
