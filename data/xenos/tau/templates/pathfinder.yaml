kind: template
output: Xenos/Tau/Templates/Pathfinder.gct
notes: >-
  A Pathfinder: a Fire caste scout and forward observer who walks ahead of the army, avoids
  the enemy, and paints targets with a markerlight so the guns behind can find them. Wears
  recon armour and works with a recon drone. Point math (see Xenos/Tau/Traits/T'au Traits.adq):
  T'au Physiology (17) + Fire Caste Lens (70) + Fire Warrior Training (6) + Pathfinder
  Training (31) + The Greater Good (-15) + Devotion to the Ethereals (-1) = 108 points
  of traits, plus skills (66 points) = 174 points. Stats: ST 10, DX 13, IQ 11, HT 11,
  HP 10, Will 11, Per 13, Speed 6.0, Move 6, Dodge 9. Tier: trained soldier (100-175).


  The markerlight is a Beam Weapons (Rifle) roll per the framework's gear table; it does
  no damage, so the skill point is well spent on Stealth and Observation. Steady Designator
  (+1 with the designator) is the only training trait beyond the attributes.
traits:
- {include: xenos/tau/traits.yaml#T'au Physiology}
- {include: xenos/tau/traits.yaml#Fire Caste Lens}
- {include: xenos/tau/traits.yaml#Fire Warrior Training}
- {include: xenos/tau/traits.yaml#Pathfinder Training}
- {include: xenos/tau/traits.yaml#The Greater Good}
- {include: xenos/tau/traits.yaml#Devotion to the Ethereals}
