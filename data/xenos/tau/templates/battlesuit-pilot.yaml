kind: template
output: Xenos/Tau/Templates/Battlesuit Pilot (Shas'vre).gct
notes: >-
  A Shas'vre: a veteran Fire caste pilot who wears a battlesuit. This is the pilot's stat
  line; the suit (DR, servo ST, jump jets, hardpoints) is equipment and is not counted
  here, nor is his drone escort. Point math (see Xenos/Tau/Traits/T'au Traits.adq): T'au
  Physiology (17) + Fire Caste Lens (70) + Fire Warrior Training (6) + Battlesuit Pilot
  Training (86) + Military Rank (Fire Caste) (10) + The Greater Good (-15) + Devotion
  to the Ethereals (-1) = 173 points of traits, plus skills (72 points) = 245 points.
  Stats: ST 11, DX 14, IQ 12, HT 12, HP 11, Will 13, Per 12, Speed 6.5, Move 6, Dodge
  9. Tier: elite human (200-350).


  Framework.md lists Move 5 for the Shas'vre line; that is not honestly reachable. DX
  14 and HT 12 give Basic Speed 6.5, so the pilot's Move is 6, the same as a Shas'ui;
  only a paid Decreased Basic Move would lower it, and nothing in the fiction warrants
  one. Every other stat is exact. Suit weapons are Gunner (Beams) and Gunner (Rockets),
  following the framework's rule for mounted guns; Battlesuit (B192) is the only Basic
  Set skill for the suit itself. The Basic Set gives Battlesuit at B192 (not B184).
traits:
- {include: xenos/tau/traits.yaml#T'au Physiology}
- {include: xenos/tau/traits.yaml#Fire Caste Lens}
- {include: xenos/tau/traits.yaml#Fire Warrior Training}
- {include: xenos/tau/traits.yaml#Battlesuit Pilot Training}
- {include: xenos/tau/traits.yaml#Military Rank (Fire Caste), levels: 2}
- {include: xenos/tau/traits.yaml#The Greater Good}
- {include: xenos/tau/traits.yaml#Devotion to the Ethereals}
