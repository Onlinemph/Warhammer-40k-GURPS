notes: >-
  A Vespid Stingwing: a winged insectoid mercenary who strafes and skirmishes for the
  T'au with a neutron blaster, under its Strain Leader. Point math (see Xenos/Tau/Traits/T'au
  Traits.adq): Vespid Physiology (235, including Chitin 125) + Vespid Strain (-5) = 230 points of traits, plus
  skills (54 points) = 284 points. Stats: ST 11, DX 13, IQ 8, HT 11, HP 11, Will 10, Per
  12, Speed 6.0, Move 6, Dodge 9. Tier: elite human (200-350).


  The neutron blaster is a Beam Weapons (Rifle) skill. Vespid natural armour is Chitin (DR 25, Weak Points 7,
  eye DR 12), see the Vespid Physiology trait. Flight is bought at
  HT/A (B195), rated at HT 11.
