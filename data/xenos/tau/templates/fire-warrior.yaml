kind: template
output: Xenos/Tau/Templates/Fire Warrior (Shas'la).gct
notes: >-
  A Fire Warrior (Shas'la): the rank-and-file soldier of the Fire caste, drilled to fight
  as part of a networked fire team and trained to stand off and shoot, not to close. Armed
  in the field with a pulse rifle or carbine and combat armour. Point math (see Xenos/Tau/Traits/T'au
  Traits.adq): T'au Physiology (17) + Fire Caste Lens (70) + Fire Warrior Training (6)
  + The Greater Good (-15) + Devotion to the Ethereals (-1) = 77 points of traits, plus
  skills (53 points) = 130 points. Stats: ST 10, DX 12, IQ 11, HT 11, HP 10, Will 11,
  Per 11, Speed 5.75, Move 5, Dodge 8. Tier: trained soldier (100-175).


  The framework calls Fire Warriors 'better drilled than a Guardsman; poor in melee'.
  The drill shows in Beam Weapons (Rifle) 17 (Guardsman 15) and Tactics; the melee gap
  shows in Brawling at DX. Unlike the Guardsman there is no Combat Reflexes: T'au doctrine
  is to fall back and let the guns work, not to fight through surprise. Weapon skills
  follow the T'au armoury as framework.md's Skills table reads it: pulse weapons are Beam
  Weapons (Pistol/Rifle), burst cannons and other mounted guns are Gunner (Beams), rail
  rifles are Guns (Rifle) and are not carried by the rank and file. Language and Cultural
  Familiarity are left to the campaign.
traits:
