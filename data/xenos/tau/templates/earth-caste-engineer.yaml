kind: template
output: Xenos/Tau/Templates/Earth Caste Engineer (Fio).gct
notes: >-
  An Earth caste engineer (Fio): a stocky, practical technician who builds and tends the
  Empire's drones, vehicles and battlesuits, and sometimes deploys with the army as a
  field engineer. Point math (see Xenos/Tau/Traits/T'au Traits.adq): T'au Physiology (17)
  + Earth Caste Lens (100) + The Greater Good (-15) + Devotion to the Ethereals (-1) =
  101 points of traits, plus skills (46 points) = 147 points. Stats: ST 11, DX 11, IQ
  13, HT 12, HP 11, Will 11, Per 12, Speed 5.75, Move 5, Dodge 8. Tier: trained soldier
  (100-175).


  Drone AI is Computer Programming (AI) (IQ/H). Earth caste weapon skill is a sidearm
  at DX only: the caste supports the army, it does not fight in it.
traits:
- {include: xenos/tau/traits.yaml#T'au Physiology}
- {include: xenos/tau/traits.yaml#Earth Caste Lens}
- {include: xenos/tau/traits.yaml#The Greater Good}
- {include: xenos/tau/traits.yaml#Devotion to the Ethereals}
