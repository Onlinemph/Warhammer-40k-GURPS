kind: template
output: Xenos/Tau/Templates/Air Caste Pilot (Kor).gct
notes: >-
  An Air caste pilot (Kor): a tall, light-boned pilot and navigator at home in a cockpit
  or in free fall, who flies the Empire's aircraft and grav vehicles. Point math (see
  Xenos/Tau/Traits/T'au Traits.adq): T'au Physiology (17) + Air Caste Lens (62) + The
  Greater Good (-15) + Devotion to the Ethereals (-1) = 63 points of traits, plus skills
  (50 points) = 113 points. Stats: ST 8, DX 13, IQ 12, HT 10, HP 8, Will 11, Per 12, Speed
  5.75, Move 5, Dodge 8. Tier: trained soldier (100-175).


  Hollow bones are built as Skinny and ST 8 / HP 8; G-Intolerance gives the 'poor in high
  gravity' of the framework (see the Air Caste Lens for the caveat on the exact B137 penalty).
  The Flight skill (HT/A) is deliberately not bought: the T'au fly craft, not wings.
traits:
- {include: xenos/tau/traits.yaml#T'au Physiology}
- {include: xenos/tau/traits.yaml#Air Caste Lens}
- {include: xenos/tau/traits.yaml#The Greater Good}
- {include: xenos/tau/traits.yaml#Devotion to the Ethereals}
