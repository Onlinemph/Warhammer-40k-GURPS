kind: template
output: Xenos/Tau/Templates/Ethereal (Aun).gct
notes: >-
  An Ethereal (Aun): a member of the ruling caste: physically frail, mentally formidable,
  and treated by the other castes with reverence. Rarely armed; his weapon is Inspiring
  Presence, and a Fire caste Honour Guard stands around him. Point math (see Xenos/Tau/Traits/T'au
  Traits.adq): T'au Physiology (17) + Ethereal Caste Lens (141) + The Greater Good (-15)
  = 143 points of traits, plus skills (156 points) = 299 points. Stats: ST 9, DX 11, IQ
  13, HT 10, HP 9, Will 17, Per 12, Speed 5.25, Move 5, Dodge 8. Tier: elite human (200-350).


  The Ethereal is built without Devotion to the Ethereals (he is its object) and without
  weapon skills: an Ethereal is not a fighter, and a GM who needs one can add Beam Weapons
  (Pistol) at DX. Honour Guard and starting wealth are not priced here; a GM who wants
  the Honour Guard as an Ally Group can add it.
