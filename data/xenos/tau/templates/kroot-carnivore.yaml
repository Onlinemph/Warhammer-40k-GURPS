kind: template
output: Xenos/Tau/Templates/Kroot Carnivore.gct
notes: >-
  A Kroot Carnivore: a lean, beaked, quilled mercenary who tracks and ambushes for the
  T'au, armed with a Kroot rifle whose stock ends in a blade. Point math (see Xenos/Tau/Traits/T'au
  Traits.adq): Kroot Physiology (112) + Kroot Kindred (-10) = 102 points of traits, plus
  skills (57 points) = 159 points. Stats: ST 12, DX 13, IQ 9, HT 11, HP 12, Will 10, Per
  13, Speed 6.0, Move 8, Dodge 9. Tier: trained soldier (100-175).


  Weapon skills as framework.md's Skills table and the Kroot rifle entry: Guns (Rifle)
  for the rifle, Staff for the blade-fitted stock. The Kroot's culture is not priced (no
  Low TL): the Kroot use T'au technology and their own long guns competently, and the
  drafter is not confident enough of a technology penalty. No T'au traits (no Greater
  Good, no Warp-Faint): the Kroot are not T'au, and there is no evidence they share the
  T'au's thin warp presence.
traits:
- {include: xenos/tau/traits.yaml#Kroot Physiology}
- {include: xenos/tau/traits.yaml#Kroot Kindred}
