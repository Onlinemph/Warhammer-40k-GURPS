kind: template
output: Xenos/Tau/Templates/Fire Warrior Veteran (Shas'ui).gct
notes: >-
  A Shas'ui: a Fire Warrior who has survived enough war to lead a fire team, and who may
  be chosen to pilot a battlesuit. Same armour and weapons as a Shas'la, and a team's-worth
  of drones. Point math (see Xenos/Tau/Traits/T'au Traits.adq): T'au Physiology (17) +
  Fire Caste Lens (70) + Fire Warrior Training (6) + Veteran Lens (Shas'ui) (50) + Military
  Rank (Fire Caste) (5) + The Greater Good (-15) + Devotion to the Ethereals (-1) = 132
  points of traits, plus skills (62 points) = 194 points. Stats: ST 11, DX 13, IQ 11,
  HT 12, HP 11, Will 12, Per 12, Speed 6.25, Move 6, Dodge 9. Tier: between trained soldier
  (100-175) and elite human (200-350).


  Framework.md: 'team leader; often a battlesuit pilot' (Shas'ui who pilot are built as
  a Shas'vre, below). Military Rank 1 (5 points) marks the team-leader step. Weapon skills
  as for the Shas'la.
traits:
- {include: xenos/tau/traits.yaml#T'au Physiology}
- {include: xenos/tau/traits.yaml#Fire Caste Lens}
- {include: xenos/tau/traits.yaml#Fire Warrior Training}
