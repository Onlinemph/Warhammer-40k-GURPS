kind: template
output: Xenos/Tau/Templates/Kroot Shaper.gct
notes: >-
  A Kroot Shaper: the leader of a kindred, who decides what it eats and so what it becomes.
  Larger and sharper than its kin, armed like them. Point math (see Xenos/Tau/Traits/T'au
  Traits.adq): Kroot Physiology (112) + Kroot Kindred (-10) + Kroot Shaper Lens (55) =
  157 points of traits, plus skills (101 points) = 258 points. Stats: ST 13, DX 13, IQ
  11, HT 12, HP 13, Will 12, Per 13, Speed 6.25, Move 8, Dodge 9. Tier: elite human (200-350).


  Framework.md: 'Kindred leader; decides what the kindred eats.' Genetic Absorption is
  a 0-point feature of the ancestry and the Shaper is its steward; Hidden Lore (Xenos)
  is the mechanical proxy.
traits:
- {include: xenos/tau/traits.yaml#Kroot Physiology}
- {include: xenos/tau/traits.yaml#Kroot Kindred}
- {include: xenos/tau/traits.yaml#Kroot Shaper Lens}
