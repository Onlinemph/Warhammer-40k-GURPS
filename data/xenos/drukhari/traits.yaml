- name: Haemonculus Regrowth
  points: 25
  tags: [Advantage, Physical, Xenos, Drukhari]
  ref: B55
  modifiers:
  - name: Accessibility
    cost: -40%
    ref: B110
    notes: >-
      Needs a body fragment (at least the head or a torso) recovered to a Haemonculus
      and a Coven paid for the work; lasts one life.
  notes: >-
    One Extra Life. On death, if a fragment reaches a Coven and the price is met,
    the character is regrown and returns, changed a little (GM's choice of small
    physical or mental side effect).
  lore: >-
    Haemonculi can regrow the dead from little more than a scrap, and the Covens
    sell that service to the powerful. Archons and their favoured servants are the
    ones who can afford the price, in coin, slaves or service. Codex: Drukhari background.
  design: >-
    Extra Life (B55, 25 points) with Accessibility (B110) -40% for the recovered-fragment
    and coven-fee requirements. 25 x 0.6 = 15 points. Reserved for Archons, favoured
    servants and Haemonculi; ordinary Kabalites and Wyches do not have it.
- name: Sadism
  points: -15
  cr: 12
  tags: [Disadvantage, Mental, Xenos, Drukhari]
  ref: B152
  notes: >-
    Takes pleasure in others' suffering and seeks chances to inflict it; roll self-control
    when the chance arises.
  lore: >-
    Cruelty is Commorragh's native culture, not a deviance. Most Drukhari, and every
    Haemonculus, take an openly aesthetic interest in others' pain (Codex: Drukhari
    and background across editions). The self-control 12 default represents someone
    who can hold off when it would cost them, e.g. in front of a superior.
  design: Sadism (B152, -15) with self-control 12.
- name: Callous
  points: -5
  tags: [Disadvantage, Mental, Xenos, Drukhari]
  ref: B125
  notes: Indifferent to others' pain; -3 reaction when it shows.
  lore: >-
    Even a Drukhari who does not enjoy suffering treats it as currency. Background.
  design: Callous (B125, -5).
- name: Megalomania
  points: -10
  tags: [Disadvantage, Mental, Xenos, Drukhari]
  notes: >-
    Believes they are destined to rule, and plans and boasts accordingly; -5 to
    resist flattery about their greatness.
  lore: >-
    Every Archon is scheming at the top of a Kabal and every Kabal is one betrayal
    from the next Archon. Background across Codex editions.
  design: Megalomania, -10 points (ref left out).
- name: Paranoia
  points: -10
  tags: [Disadvantage, Mental, Xenos, Drukhari]
  ref: B148
  notes: Assumes hidden plots against them; trusts nobody, with reason.
  lore: >-
    In Commorragh most of the plots against an Archon are real. Paranoia is a survival
    skill here, not a delusion.
  design: Paranoia (B148, -10).
- name: Overconfidence
  points: -5
  cr: 12
  tags: [Disadvantage, Mental, Xenos, Drukhari]
  ref: B148
  notes: >-
    Overrates their own ability and underrates opposition; self-control roll to
    hold back from a risky show of strength.
  lore: >-
    Arena stars, aerial raiders and Kabal nobles all believe themselves the best
    in the room. Background.
  design: Overconfidence (B148, -5) with self-control 12.
- name: Selfish
  points: -5
  cr: 12
  tags: [Disadvantage, Mental, Xenos, Drukhari]
  ref: B153
  notes: >-
    Puts own gain over the group's; self-control roll to share loot or hold a post.
  lore: A Kabalite's loyalty is to their own advancement first. Background.
  design: Selfish (B153, -5) with self-control 12.
- name: Duty (Coven)
  points: -10
  tags: [Disadvantage, Mental, Xenos, Drukhari]
  ref: B133
  notes: >-
    Bound to a Haemonculus's Coven: 12 or less on a frequency roll each session
    that the Coven requires service.
  lore: >-
    Wracks serve their Haemonculus because they cannot leave. Some were bought as
    slaves, some sold themselves in the hope of a better fate, and few are free
    to walk away. Background.
  design: Duty (B133) 12 or less, -10 points, not extremely hazardous.
- name: 'Combat Drug: Adrenalight'
  container: meta_trait
  tags: [Advantage, Physical, Xenos, Drukhari]
  notes: >-
    One dose per combat. Enable the trait for the fight; lasts the whole fight (about
    ten minutes at most). Roll HT after the fight ends; on a failure lose 1 FP and
    take -1 on all rolls for an hour (the comedown).
  lore: >-
    Adrenalight is the Wych Cults' basic fighting stimulant: it makes a warrior
    faster, lets her strike more often, and is favoured for its low risk. Background:
    Codex: Drukhari's Wych Cult combat drugs list; the tabletop effect is one extra
    attack, translated here as more speed.
  design: >-
    Modest boost, no more than Aspect Training's own speed edge. Net cost 7 - 5
    = 2 points when enabled.
  children:
  - name: Adrenalight Surge
    points: 10
    tags: [Advantage, Physical, Xenos, Drukhari]
    attributes: {basic_speed: 0.5}
    modifiers:
    - {name: Accessibility, cost: -30%, ref: B110, notes: 'One dose per combat;
        effect lasts the fight, then the comedown. '}
    notes: Basic Speed +0.5.
    lore: >-
      A stimulant that speeds reactions and pushes the body to strike more often.
    design: >-
      Increased Basic Speed +0.5 (B17, 10 points) with the one-dose Accessibility
      -30%: 7 points.
  - name: Dependency (Adrenalight)
    points: -5
    tags: [Disadvantage, Physical, Xenos, Drukhari]
    ref: B130
    notes: >-
      Roll HT after the fight ends; on a failure lose 1 FP and take -1 on all rolls
      for an hour (the comedown).
    lore: >-
      Combat drugs are habit-forming; regular users need a dose or suffer the comedown.
    design: >-
      Dependency (B130), a Common substance in Commorragh, milder than Soul Thirst,
      priced at -5 as a judgement on B130's method.
- name: 'Combat Drug: Grave Lotus'
  container: meta_trait
  tags: [Advantage, Physical, Xenos, Drukhari]
  notes: >-
    One dose per combat. Enable the trait for the fight; lasts the whole fight (about
    ten minutes at most). Roll HT after the fight ends; on a failure lose 1 FP and
    take -1 on all rolls for an hour (the comedown).
  lore: >-
    Grave Lotus is the Wych's blade-fighting drug: it slows the world so that a
    strike is seen coming. Background: Codex: Drukhari's Wych Cult combat drug list;
    tabletop effect is +1 Weapon Skill.
  design: Hits skill, not damage. Net 6 - 5 = 1 point when enabled.
  children:
  - name: Lotus Focus
    points: 20
    tags: [Advantage, Physical, Xenos, Drukhari]
    attributes: {dx: 1}
    modifiers:
    - {name: Accessibility, cost: -30%, ref: B110, notes: 'One dose per combat;
        effect lasts the fight, then the comedown. '}
    - {name: Accessibility, cost: -40%, ref: B110, notes: Applies only to melee
        attack and parry rolls.}
    notes: DX +1, melee attacks and parries only.
    lore: >-
      A concentrate that heightens perception and reflexes, sharpening a Wych's
      blows and parries.
    design: >-
      Increased DX +1 (B15, 20 points) with Accessibility -30% (one dose) and -40%
      (melee attack and parry rolls only): 20 x 0.3 = 6 points.
  - name: Dependency (Grave Lotus)
    points: -5
    tags: [Disadvantage, Physical, Xenos, Drukhari]
    ref: B130
    notes: >-
      Roll HT after the fight ends; on a failure lose 1 FP and take -1 on all rolls
      for an hour (the comedown).
    lore: >-
      Combat drugs are habit-forming; regular users need a dose or suffer the comedown.
    design: >-
      Dependency (B130), a Common substance in Commorragh, milder than Soul Thirst,
      priced at -5 as a judgement on B130's method.
- name: 'Combat Drug: Hypex'
  container: meta_trait
  tags: [Advantage, Physical, Xenos, Drukhari]
  notes: >-
    One dose per combat. Enable the trait for the fight; lasts the whole fight (about
    ten minutes at most). Roll HT after the fight ends; on a failure lose 1 FP and
    take -1 on all rolls for an hour (the comedown).
  lore: >-
    Hypex is the drug of the charging Wych: raw speed for crossing a killing field.
    Background: Codex: Drukhari's Wych Cult drug list.
  design: Modest; +2 Move on a base of 10-12. Net 7 - 5 = 2 points when enabled.
  children:
  - name: Hypex Sprint
    points: 10
    tags: [Advantage, Physical, Xenos, Drukhari]
    attributes: {basic_move: 2}
    modifiers:
    - {name: Accessibility, cost: -30%, ref: B110, notes: 'One dose per combat;
        effect lasts the fight, then the comedown. '}
    notes: Basic Move +2.
    lore: A fast-acting stimulant that floods the legs with speed.
    design: >-
      Increased Basic Move +2 (B17, 5 points/level, 10) with the one-dose Accessibility:
      7 points.
  - name: Dependency (Hypex)
    points: -5
    tags: [Disadvantage, Physical, Xenos, Drukhari]
    ref: B130
    notes: >-
      Roll HT after the fight ends; on a failure lose 1 FP and take -1 on all rolls
      for an hour (the comedown).
    lore: >-
      Combat drugs are habit-forming; regular users need a dose or suffer the comedown.
    design: >-
      Dependency (B130), a Common substance in Commorragh, milder than Soul Thirst,
      priced at -5 as a judgement on B130's method.
- name: 'Combat Drug: Painbringer'
  container: meta_trait
  tags: [Advantage, Physical, Xenos, Drukhari]
  notes: >-
    One dose per combat. Enable the trait for the fight; lasts the whole fight (about
