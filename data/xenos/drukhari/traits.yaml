- name: Power from Pain (Stage I)
  points: 10
  tags: [Advantage, Physical, Xenos, Drukhari]
  ref: B59
  modifiers:
  - name: Accessibility
    cost: -30%
    ref: B110
    notes: >-
      Only after the Drukhari, or a comrade in the same unit, has drawn blood or
      caused real suffering in this scene.
  notes: >-
    High Pain Threshold, once feeding has begun. Stage I of three; each later stage
    needs the one before it. A stage lapses at the end of the scene.
  lore: >-
    Every Drukhari fights harder for the taste of blood. Codex background describes
    the Dark Eldar as growing bolder and stronger as the killing goes on, feeding
    on the pain they cause; the exact stages differ between Kabals, Wych Cults and
    Covens.
  design: >-
    High Pain Threshold (B59, 10 points) with Accessibility (B110) -30% for its
    trigger: 10 x 0.7 = 7 points. Deliberately no `attributes` feature: the bonus
    is conditional and must not raise the sheet's stats before the trigger.
- name: Power from Pain (Stage II)
  container: meta_trait
  tags: [Advantage, Physical, Xenos, Drukhari]
  notes: >-
    Stage II: melee and Fright Check bonuses (requires Stage I), lapses at the end
    of the scene.
  lore: >-
    By the time a fight has really turned, a Drukhari hits harder and cannot be
    frightened. Background: the Power from Pain rule in Codex: Drukhari (per unit,
    by kills scored).
  design: >-
    Melee and morale bonuses only; the real weight is small (5 + 2 = 7 points).
    Not `attributes`: the bonuses are conditional.
  children:
  - name: Bloodied Strength
    per_level: 5
    levels: 2
    tags: [Advantage, Physical, Xenos, Drukhari]
    ref: B88
    modifiers:
    - name: Accessibility
      cost: -50%
      ref: B110
      notes: >-
        Only after Stage I plus at least one enemy dropped or seriously hurt in
        this scene by the Drukhari's unit.
    notes: 'Striking ST +2: melee damage as if ST 2 higher.'
    lore: The Kabalite's cruelty in melee sharpens as the blood flows.
    design: Striking ST 2 (B88, 5/level, 10) with Accessibility -50% = 5 points.
  - name: Bloodied Nerve
    per_level: 2
    levels: 2
    tags: [Advantage, Mental, Xenos, Drukhari]
    ref: B55
    modifiers:
    - {name: Accessibility, cost: -50%, ref: B110, notes: Same trigger as Bloodied
        Strength.}
    notes: Fearlessness +2 to Fright Checks.
    lore: >-
      A feeding Drukhari does not flinch from the things that break other people.
    design: Fearlessness 2 (B55, 2/level, 4) with Accessibility -50% = 2 points.
- name: Power from Pain (Stage III)
  points: 50
  tags: [Advantage, Physical, Xenos, Drukhari]
  ref: B80
  modifiers:
  - name: Accessibility
    cost: -60%
    ref: B110
    notes: >-
      Only after Stages I and II and at least three enemies dropped or badly hurt
      in this scene by the Drukhari's unit.
  notes: >-
    Regeneration (Fast): 1 HP per minute (roughly 1 HP per 6 combat turns of 10
    seconds when tracking turns).
  lore: >-
    The height of the feed: wounds close as fast as the killer can reopen new ones
    in other people. Codex: Drukhari's third stage is the strongest bonus a unit
    can earn.
  design: >-
    Regeneration, Fast tier (B80, 50 points, 1 HP per minute) with Accessibility
    -60%: 50 x 0.4 = 20 points. Kept at Fast rather than faster because the lore
    effect is 'hard to put down', not 'cannot be killed'.
- name: Power from Pain
  container: meta_trait
  tags: [Advantage, Physical, Xenos, Drukhari]
  lore: >-
    All three stages together: the full Power from Pain a Drukhari of rank earns
    in a long fight.
  design: >-
    7 + 7 + 20 = 34 points. Lower-tier templates include the single stages above
    instead.
