kind: traits
output: Xenos/Drukhari/Traits/Drukhari Physiology.adq
# Drukhari (Dark Eldar) racial traits. Calibrated to framework.md's "Xenos >
# Drukhari" anchor table and point targets. The shared Aeldari body comes by
# include from xenos/aeldari/traits.yaml (Attribute Modifiers, Enhanced Move,
# Acute Senses, Aeldari Grace, Slender Frame) so a fix there updates every
# Drukhari on rebuild; the psychic chassis (Psyker talent, Warp Empowerment,
# spirit stones, Paths) is deliberately NOT pulled in. Sources: Codex: Dark
# Eldar and Codex: Drukhari background across editions; Black Library only
# where noted. Where the lore is thin or contradictory (Arhra, Mandrake
# mechanism, drug effects) the entry says so.
items:
- name: Soul Thirst
  points: -15
  tags: [Disadvantage, Physical, Xenos, Drukhari]
  ref: B130
  notes: >-
    Dependency on the suffering of others. The Drukhari must feed about once a week:
    a session of torture, a raid's slaughter, a night in the arena, or a bloody
    fight they took part in all count. Track it as a Dependency that comes due weekly.
    On a missed feeding roll HT at the start of each following day; on a failure
    lose 1 FP that cannot be regained until the Drukhari feeds (adapt the missed-dose
    procedure at B130 to this weekly tempo). After a full month unfed, Unaging While
    Fed lapses and normal aging rolls apply until the next feeding, but does not
    undo any aging already suffered. No spirit stone is worn and none would help:
    a Drukhari killed with no Haemonculus to call them back is food for Slaanesh.
  lore: >-
    Every Drukhari soul is being drained by Slaanesh, and they have no craftworld's
    Infinity Circuit and no spirit stone to catch it. They keep the dark god at
    bay by keeping their souls full of borrowed life: the pain and death of others.
    Nothing else in Commorragh's culture makes sense without this: the arenas, the
    slave raids, the torture-arts of the Haemonculi and the Kabals' constant reaving
    are all, at bottom, farming. Consistent, foundational background across every
    edition of Codex: Dark Eldar / Drukhari.
  design: >-
    Dependency (B130) with the substance being fresh suffering. B130 prices a Dependency
    from how easy the substance is to find and how often it must be taken, and this
    is neither rare (a raider always has slaves and enemies) nor daily (a week is
    comfortable), while lack ages and weakens rather than killing outright. This
    is a house judgement on that method, set at -15, the same price as the Aeldari
    Slaanesh's Hunger it replaces; check it against the book's table if a GM wants
    a stricter count. The aging rider is a house rule: the Basic Set's Dependency
    has no aging clause, so the loss of Unaging While Fed carries it.
- name: Unaging While Fed
  points: 15
  tags: [Advantage, Physical, Xenos, Drukhari]
  ref: B95
  modifiers:
  - name: Accessibility
    cost: -40%
    ref: B110
    notes: >-
      Works only while the Soul Thirst dependency is satisfied. Lapses after a month
      unfed (see Soul Thirst).
  notes: >-
    No aging rolls while fed. Replaces the Aeldari Extended Lifespan; a fed Drukhari
    has no natural end date at all.
  lore: >-
    Drukhari are as long-lived as any Aeldari, and the fed ones do not visibly age
    at all. The eldest Archons and Haemonculi are older than most craftworlds' oldest
    Exarchs, kept young by a steady diet of other people's agony. Starved Drukhari,
    by contrast, are described as withered and grey (Codex: Dark Eldar / Drukhari
    background).
  design: >-
    Unaging (B95, 15 points) with Accessibility (B110) -40%: it works only while
    the Soul Thirst dependency is met. 15 x 0.6 = 9 points. It stands in for the
    Aeldari Extended Lifespan (12 points) rather than adding to it.
- name: Drukhari Physiology
  container: ancestry
  tags: [Advantage, Physical, Xenos, Drukhari]
  lore: >-
    The Drukhari are the Aeldari who never left: raiders and slavers of Commorragh,
    the Dark City hidden in the webway. Their bodies are the same fine-boned, fast,
    sharp-eyed Aeldari bodies the craftworlds field. What differs is the soul. With
    no spirit stone to shelter it, Slaanesh drains it continually, and they hold
    the hunger off by feeding on suffering. This trait is the baseline shared by
    every Drukhari template; the training, cult and coven lenses below layer on
    top of it, exactly as the Aeldari Physiology's Path and Aspect lenses do.
  design: >-
    Pulls in, by include, the shared Aeldari body: Attribute Modifiers (140), Enhanced
    Move (Ground) 1/2 (10), Acute Senses (8), Aeldari Grace (4) and Slender Frame
    (0), so a fix there updates the Drukhari on rebuild. Adds Soul Thirst (-15)
    and Unaging While Fed (+9). 140 + 10 + 8 + 4 + 0 - 15 + 9 = 156 points, landing
    ST 10, DX 14, IQ 12, HT 10, HP 10, Will 12, Per 12, Basic Speed 6.25, Move 9,
    the Kabalite Warrior's physical line before its own package (framework.md, Drukhari).
    Deliberately left out: Aeldari Psychic Sensitivity, Aeldari Psyker (Talent),
    Warp Empowerment, Spirit Stone and every Path lens (the Drukhari shun the warp
    and have no Paths), plus Emotional Intensity, Arrogance Towards Younger Races,
    Slaanesh's Hunger and Extended Lifespan, each of which Soul Thirst, the Drukhari
    mental traits below or Unaging While Fed replace. Emotional excess is a Drukhari
    trait too, but it shows up as the cruelty and vanity below, not as Path-restrained
    rapture.
  children:
  - {include: xenos/aeldari/traits.yaml#Attribute Modifiers}
  - {include: xenos/aeldari/traits.yaml#Enhanced Move (Ground)}
  - {include: xenos/aeldari/traits.yaml#Acute Senses}
  - {include: xenos/aeldari/traits.yaml#Aeldari Grace}
  - {include: xenos/aeldari/traits.yaml#Slender Frame}
