kind: template
output: Xenos/Drukhari/Templates/Wrack.gct
notes: >-
  A Wrack: a coven servant, surgically bulked and dulled, serving a Haemonculus
  as torturer's assistant and bodyguard. Point math (see Xenos/Drukhari/Traits/Drukhari
  Physiology.adq): Drukhari Physiology (156) + Wrack Surgery (23) + Duty (Coven)
  (-10) + Sadism (-15) + Callous (-5) + Power from Pain Stages I and II (14) = 163
  points of traits, plus skills (37 points) = 200 points. Stats: ST 14, DX 12, IQ
  10, HT 14, HP 16, Will 11, Per 10, Speed 6.75, Move 8, Dodge 9 (6 + 3): exactly
  framework.md's Wrack line. This lands slightly short of the framework's 'about
  250' Wrack target; see the last paragraph.


  Weapon skills: scissorhand and hexrifle-type tools are Knife and Guns; the liquifier
  is Liquid Projector (Sprayer). Weapon skills follow the Drukhari armoury as framework.md's
  Skills table reads it: splinter weapons fire solid crystal shards, so they use
  Guns (Pistol/Rifle), the same choice the Aeldari Guardian makes for the shuriken
  catapult; blasters and dark lances are beam weapons (Beam Weapons); heavy splinter
  and disintegrator cannons are Gunner.
