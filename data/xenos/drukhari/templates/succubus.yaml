kind: template
output: Xenos/Drukhari/Templates/Succubus.gct
notes: >-
  A Succubus: the champion of a Wych Cult, the arena queen who has outlived a thousand
  fights. Point math (see Xenos/Drukhari/Traits/Drukhari Physiology.adq): Drukhari
  Physiology (156) + Keen Battle-Sense (5) + Wych Training (115) + Succubus's Mastery
  (155) + Wych Cult Lens (2) + Sadism (-15) + Callous (-5) + Overconfidence (-5)
  + Power from Pain, all three stages (34) = TBD points of traits, plus skills (TBD
  points) = TBD points. Stats: ST 12, DX 18, IQ 13, HT 12, HP 12, Will 14, Per 14,
  Speed 7.75, Move 12 (sprint x1.5), Dodge 14 (7 + 3 + Enhanced Dodge 3 + Combat
  Reflexes): exactly framework.md's Succubus line. This lands inside the framework's
  Haemonculus, Succubus and Archon band (600-850) as the top of the Wych chain,
  above an Exarch (616) in raw skill, with no armour worth the name.


  The Combat Drug traits are included disabled. Haemonculus Regrowth is included
  disabled: a Succubus may be a favoured servant of a Kabal or Coven, but not by
  default. Weapon skills follow the Drukhari armoury as framework.md's Skills table
  reads it: splinter weapons fire solid crystal shards, so they use Guns (Pistol/Rifle),
  the same choice the Aeldari Guardian makes for the shuriken catapult; blasters
  and dark lances are beam weapons (Beam Weapons); heavy splinter and disintegrator
  cannons are Gunner. Succubi fight with the agoniser (a whip-like field weapon),
  so Whip covers it; razorflails Flail; hydra gauntlets Brawling; shardnet Net.
