kind: template
output: Xenos/Drukhari/Templates/Haemonculus.gct
notes: >-
  A Haemonculus: a flesh-sculptor of a Coven, an ancient torturer-surgeon who has
  rebuilt himself many times. Point math (see Xenos/Drukhari/Traits/Drukhari Physiology.adq):
  Drukhari Physiology (145) + Haemonculus's Self-Sculpted Body (150) + Haemonculus's
  Composure (15) + Haemonculus's Estate (30) + Haemonculus Regrowth (15) + Power
  from Pain, all three stages (34) + Sadism (-15) + Callous (-5) + Obsession (-10)
  = 359 points of traits, plus skills (242 points) = 601 points. Stats: ST 13, DX
  13, IQ 16, HT 15, HP 18, Will 17, Per 14, Speed 7.25, Move 8, Dodge 10 (7 + 3):
  exactly framework.md's Haemonculus line. This lands at the bottom of the framework's
  600-850 band for Haemonculus, Succubus and Archon (Astartes tier, 550-850): the
  skill points are what put it there, a millennium of practice in Surgery, Physiology
  and Poisons.


  A Haemonculus is slow and clumsy but nearly impossible to put down: HP 18 with
  High Pain Threshold, Hard to Kill 2, Injury Tolerance (No Vitals), DR 2 and Slow
  Regeneration, plus Extra Life. Weapon skills: the stinger pistol and hexrifle
  fire toxic darts or crystal (Guns), close work with the scissorhand is Knife-class.
  Weapon skills follow the Drukhari armoury as framework.md's Skills table reads
  it: splinter weapons fire solid crystal shards, so they use Guns (Pistol/Rifle),
  the same choice the Aeldari Guardian makes for the shuriken catapult; blasters
  and dark lances are beam weapons (Beam Weapons); heavy splinter and disintegrator
  cannons are Gunner.
