kind: template
output: Xenos/Drukhari/Templates/Scourge.gct
notes: >-
  A Scourge: a winged Drukhari raider who paid a Haemonculus for the wings and takes
  to the air as a skirmisher. Point math (see Xenos/Drukhari/Traits/Drukhari Physiology.adq):
  Drukhari Physiology (156) + Keen Battle-Sense (5) + Scourge Conditioning (45)
  + Scourge Wings (40) + Callous (-5) + Selfish (-5) + Overconfidence (-5) + Power
  from Pain Stage I (7) = TBD points of traits, plus skills (TBD points) = TBD points.
  Stats: ST 11, DX 15, IQ 12, HT 11, HP 11, Will 12, Per 14, Speed 6.75, Move 9
  on the ground, Air Move 18 (27 at top speed with Enhanced Move (Air) 1/2), Dodge
  9 (6 + 3): matching framework.md's Scourge line (Air Move 20+ is satisfied by
  the top speed, not the base Air Move). This lands inside the framework's Wych
  and Scourge target of 250-350.


  Weapon skills: splinter rifles, shardcarbines and haywire blasters (Guns, Rifle
  and Beam Weapons for energy weapons like the dark lance). Weapon skills follow
  the Drukhari armoury as framework.md's Skills table reads it: splinter weapons
  fire solid crystal shards, so they use Guns (Pistol/Rifle), the same choice the
  Aeldari Guardian makes for the shuriken catapult; blasters and dark lances are
  beam weapons (Beam Weapons); heavy splinter and disintegrator cannons are Gunner.
traits:
- {include: xenos/drukhari/traits.yaml#Drukhari Physiology}
- {include: xenos/aeldari/traits.yaml#Keen Battle-Sense}
