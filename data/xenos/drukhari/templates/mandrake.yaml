kind: template
output: Xenos/Drukhari/Templates/Mandrake.gct
notes: >-
  A Mandrake: a shadow-killer of the dimension Aelindrach, half in this world, hired
  to strike from the dark. Point math (see Xenos/Drukhari/Traits/Drukhari Physiology.adq):
  Drukhari Physiology (156) + Keen Battle-Sense (5) + Mandrake Conditioning (85)
  + Mandrake Shadow Nature (85) + Unnatural Features (-5) + Callous (-5) + Sadism
  (-15) + Power from Pain Stages I and II (14) = 320 points of traits, plus skills
  (83 points) = 403 points. Stats: ST 11, DX 16, IQ 11, HT 11, HP 11, Will 12, Per
  14, Speed 7.0, Move 10 (sprint x1.5), Dodge 11 (7 + 3 + Enhanced Dodge 1 + Combat
  Reflexes): exactly framework.md's Mandrake line. This lands in the framework's
  Mandrake and Incubus band (400-550) at its low end.


  The shadow-form trait is built from the Basic Set's Shadow Form (see the trait's
  own notes). No Mandrake weapon (glimmersteel blade, Baleblast) is a trait here:
  they are wargear. The blade is treated as a Shortsword; a GM who prefers Knife
  or Broadsword should swap it. Weapon skills follow the Drukhari armoury as framework.md's
  Skills table reads it: splinter weapons fire solid crystal shards, so they use
  Guns (Pistol/Rifle), the same choice the Aeldari Guardian makes for the shuriken
  catapult; blasters and dark lances are beam weapons (Beam Weapons); heavy splinter
  and disintegrator cannons are Gunner.
traits:
