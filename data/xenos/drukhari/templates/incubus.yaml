kind: template
output: Xenos/Drukhari/Templates/Incubus.gct
notes: >-
  An Incubus: a mercenary blade-cultist sworn to Arhra, fighting in a heavy warsuit
  with a two-handed klaive. Point math (see Xenos/Drukhari/Traits/Drukhari Physiology.adq):
  Drukhari Physiology (145) + Keen Battle-Sense (5) + Incubus Training (185) + Path
  of Arhra (-15) + Callous (-5) + Power from Pain Stages I and II (14) = 329 points
  of traits, plus skills (84 points) = 413 points. Stats: ST 12, DX 17, IQ 12, HT
  12, HP 12, Will 14, Per 13, Speed 7.5, Move 10 (sprint x1.5), Dodge 11 (7 + 3
  + Combat Reflexes): exactly framework.md's Incubus line. This lands inside the
  framework's Mandrake and Incubus band (400-550): the framework's senior-agents
  tier (350-600), a master duellist built on Trained By A Master, Weapon Master
  and Enhanced Parry rather than raw stats.


  Sadism is deliberately left out: Incubi are ascetic and disciplined, not indulgent.
  The klaive is a power-field two-handed blade, Two-Handed Sword; the framework's
  Skills table treats power swords as swords. Weapon skills follow the Drukhari
  armoury as framework.md's Skills table reads it: splinter weapons fire solid crystal
  shards, so they use Guns (Pistol/Rifle), the same choice the Aeldari Guardian
  makes for the shuriken catapult; blasters and dark lances are beam weapons (Beam
  Weapons); heavy splinter and disintegrator cannons are Gunner.
