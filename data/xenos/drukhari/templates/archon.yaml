kind: template
output: Xenos/Drukhari/Templates/Archon.gct
notes: >-
  An Archon: an ancient, paranoid, well-fed tyrant who rules a Kabal, armed with
  a blast pistol and a huskblade, protected by ghostplate and a shadow field. Point
  math (see Xenos/Drukhari/Traits/Drukhari Physiology.adq): Drukhari Physiology
  (156) + Archon's Mastery (230) + Archon's Estate (50) + Kabal Lens (-4) + Haemonculus
  Regrowth (15) + Power from Pain, all three stages (34) + Sadism (-15) + Callous
  (-5) + Megalomania (-10) + Paranoia (-10) + Overconfidence (-5) = TBD points of
  traits, plus skills (TBD points) = TBD points. Stats: ST 12, DX 18, IQ 15, HT
  12, HP 12, Will 17, Per 15, Speed 7.75, Move 10, Dodge 14 (7 + 3 + Enhanced Dodge
  1 + Combat Reflexes): exactly framework.md's Archon line (no Keen Battle-Sense:
  Per equals IQ). This lands inside the 600-850 band of the framework for Haemonculus,
  Succubus and Archon.


  Haemonculus Regrowth is enabled: an Archon can afford it. Weapon skills follow
  the Drukhari armoury as framework.md's Skills table reads it: splinter weapons
  fire solid crystal shards, so they use Guns (Pistol/Rifle), the same choice the
  Aeldari Guardian makes for the shuriken catapult; blasters and dark lances are
  beam weapons (Beam Weapons); heavy splinter and disintegrator cannons are Gunner.
  The blast pistol is a beam weapon, Beam Weapons (Pistol); the huskblade is a power-field
  sword, Broadsword.
