kind: template
output: Xenos/Drukhari/Templates/Kabalite Warrior.gct
notes: >-
  A Kabalite Warrior: the rank-and-file raider of a Kabal, armoured in light segmented
  plate and armed with a splinter rifle, fast and precise like a Guardian but with
  a cruel, shallow discipline. Point math (see Xenos/Drukhari/Traits/Drukhari Physiology.adq):
  Drukhari Physiology (156) + Keen Battle-Sense (5) + Kabalite Conditioning (-5)
  + Kabal Lens (-4) + Callous (-5) + Power from Pain Stage I (7) = 154 points of
  traits, plus skills (34 points) = 188 points. Stats: ST 10, DX 14, IQ 12, HT 10,
  HP 10, Will 11, Per 13, Speed 6.25, Move 9 (sprint x1.5 with Enhanced Move 1/2),
  Dodge 9: exactly framework.md's Kabalite Warrior line, the Guardian's physical
  equal. This lands inside the framework's Drukhari target for a Kabalite Warrior
  (about a Guardian, 180-220) and just above the trained-soldier tier, matching
  the Aeldari Guardian's own 187.


  Sadism is included but disabled: many Kabalites relish suffering, but for the
  raider tier the framework's Guardian-equivalent budget allows only Callous; enable
  Sadism to build a true cruel one, and drop 15 points of skills or accept the total
  moving to about 173. Kabalites carry no Extra Life (Haemonculus Regrowth is for
  Archons and favoured servants) and no psychic talent (no Drukhari template has
  one). Weapon skills follow the Drukhari armoury as framework.md's Skills table
  reads it: splinter weapons fire solid crystal shards, so they use Guns (Pistol/Rifle),
  the same choice the Aeldari Guardian makes for the shuriken catapult; blasters
  and dark lances are beam weapons (Beam Weapons); heavy splinter and disintegrator
  cannons are Gunner.
traits:
- {include: xenos/drukhari/traits.yaml#Drukhari Physiology}
- {include: xenos/aeldari/traits.yaml#Keen Battle-Sense}
- {include: xenos/drukhari/traits.yaml#Kabalite Conditioning}
- {include: xenos/drukhari/traits.yaml#Kabal Lens}
- {include: xenos/drukhari/traits.yaml#Callous}
- {include: xenos/drukhari/traits.yaml#Sadism, disabled: true}
- {include: xenos/drukhari/traits.yaml#Power from Pain (Stage I)}
