kind: template
output: Xenos/Drukhari/Templates/Wych.gct
notes: >-
  A Wych: an arena gladiator of a Wych Cult, fighting in almost no armour on speed
  and dodge, hyped on combat drugs and the crowd's noise. Point math (see Xenos/Drukhari/Traits/Drukhari
  Physiology.adq): Drukhari Physiology (145) + Keen Battle-Sense (5) + Wych Training
  (115) + Wych Cult Lens (2) + Sadism (-15) + Callous (-5) + Overconfidence (-5)
  + Power from Pain Stages I and II (14) = 256 points of traits, plus skills (57
  points) = 313 points. Stats: ST 11, DX 16, IQ 12, HT 11, HP 11, Will 12, Per 13,
  Speed 7.0, Move 12 (sprint x1.5), Dodge 12 (7 + 3 + Enhanced Dodge 2): exactly
  framework.md's Wych line. This lands inside the framework's Wych and Scourge target
  of 250-350, in the upper half of the framework's elite-human tier (200-350), comparable
  to an Aspect Warrior (295) and a little above, on the strength of extra dodge
  and acrobatics.


  The six Combat Drug traits are included disabled: one dose per combat, taken from
  Xenos/Drukhari/Traits/Drukhari Physiology.adq; enable one for the fight. Weapon
  skills follow the Drukhari armoury as framework.md's Skills table reads it: splinter
  weapons fire solid crystal shards, so they use Guns (Pistol/Rifle), the same choice
  the Aeldari Guardian makes for the shuriken catapult; blasters and dark lances
  are beam weapons (Beam Weapons); heavy splinter and disintegrator cannons are
  Gunner. Wych weapons are mundane blades made lethal by skill: hydra gauntlets
  Brawling, razorflails Flail, the shardnet Net, the splinter pistol Guns (Pistol).
  Impaler-type polearms, if used, need Spear or Polearm, not bought here.
