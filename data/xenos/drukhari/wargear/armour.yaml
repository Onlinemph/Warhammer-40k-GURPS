    notes: >-
      Worn on the arm or harness; injects the chosen drug as a free action at the start of a fight.
      Only one drug per combat: the dispenser does not open a second vial in the same fight. The
      drugs are the traits Combat Drug: Adrenalight, Combat Drug: Grave Lotus, Combat Drug: Hypex,
      Combat Drug: Painbringer, Combat Drug: Serpentin and Combat Drug: Splintermind. Their effects
      are defined there; this item only holds and delivers them. Each has its own Dependency (see
      the traits), which is what makes regular use a hazard.
    lore: >-
      A device of the Wych Cults that delivers combat drugs by a needle into the arm, giving the
      Wych a burst of speed, strength or resistance for the length of a fight (Codex: Drukhari
      background names the six drugs Adrenalight, Grave Lotus, Hypex, Painbringer, Serpentin and
      Splintermind). The drugs are habit-forming and are the mark of Wych Cult discipline.
    design: >-
      The framework says: 'Wych Cult dispensers: one drug per combat; each a modest, temporary boost
      to one attribute or skill set, with a Dependency'. The dispenser is a container (GCS sums the
      children's weight and cost) holding the six vials as separate 1-use children, so the sheet
      shows which have been used. The rules of each drug live in the traits, not here, so a trait
      edit updates all users. Weight 1 lb, cost 3000 for the dispenser and 150 per vial (about 3900
      for a full set).

  - name: "Soul-Trap"
    tl: "12^"
    lc: 0
    cost: 20000
    weight: 1
    tags: ["Xenos", "Drukhari", "Kabal"]
    notes: >-
      Worn on the harness. The wearer treats each killing within 10 yards of him (by his own hand or
      a squad-mate's) as a feeding for Soul Thirst purposes, at the GM's discretion, and the death
      also counts toward advancing Power from Pain in the scene. No effect on the wearer's combat
      rolls.
    lore: >-
      A Drukhari device for capturing and holding the soul-essence of the slain so it can be
      consumed later and the wearer's own soul kept from Slaanesh a little longer (background
      generally; I recall the name from Drukhari wargear lists but hold the exact mechanism and who
      carries it with low confidence, so the rules here are a design choice rather than a quotation
      of any rule).
    design: >-
      The framework's Drukhari overview gives no soul-trap anchor and the sources are thin, so it is
      written as rules text for the GM to apply rather than a combat statistic, in the way the
      Aeldari spirit stone is. It ties directly to the Drukhari traits: it feeds Soul Thirst and
      Power from Pain (the disadvantage and the staged bonus defined in the traits library). Cost
      20000 makes it a rare relic. Handling: 1 lb, no ST requirement, no DR.
