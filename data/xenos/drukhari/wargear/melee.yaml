        st: 9
        skill: "Broadsword"
      - usage: "Thrust"
        damage: "thr+2 imp"
        reach: "1"
        parry: 0
        st: 9
        skill: "Broadsword"
      - usage: "Toxin follow-up (if blade penetrates)"
        damage: "3d tox"
        reach: "1"
        parry: 0
        st: 9
        skill: "Broadsword"
        notes: >-
          Only if the blade penetrates DR. Living targets only. The poison reservoir holds 6 doses;
          refill takes a turn and an Armoury (Poisons) or similar roll.
    notes: >-
      Mundane blade with a hollow edge fed from a poison reservoir.
    lore: >-
      A poisoned blade carried by Archons and by some Kabal elites such as the winged Scourges as a
      close-range weapon (Codex: Drukhari background; the pairing with Scourges I hold with less
      certainty). The Drukhari's penchant for toxins makes it a natural companion to the splinter
      weapons.
    design: >-
      Not a power weapon: a sword-class blade with a poison follow-up, the melee counterpart of the
      splinter rifle's toxin. Swing sw+1 cut, thrust thr+2 imp, no divisor. At an Archon's ST 12 (sw
      1d+2, so 1d+3) it averages 6.5 and never penetrates flak or better (0.0%); against an
      unarmoured or lightly armoured target that it does penetrate, the 3d tox follow-up (average
      10.5) is what kills. Handling: 3 lb, min ST 9, reach 1, parry 0, Broadsword.
