items:

  # ------------------------------------------------------------ Power-field weapons

  - name: "Power Sword, Drukhari Pattern"
    tl: "11^"
    lc: 0
    cost: 5000
    weight: 3.5
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Kabal", "Wych Cult"]
    weapons:
      - usage: "Field on"
        damage: "sw+3d+1(10) cut"
        reach: "1"
        parry: 0
        st: 10
        skill: "Broadsword"
      - usage: "Thrust, field on"
        damage: thr+3d+2(10) imp
        reach: "1"
        parry: 0
        st: 10
        skill: "Broadsword"
      - usage: "Field off"
        damage: "sw+1 cut"
        reach: "1"
        parry: 0
        st: 10
        skill: "Broadsword"
      - usage: "Thrust, field off"
        damage: thr+2 imp
        reach: "1"
        parry: 0
        st: 10
        skill: "Broadsword"
    notes: >-
      Field-on line carries armour divisor (10), per the framework's power-field rule.
    lore: >-
      The disruption-field blade of the Drukhari elite: Archons, Succubi and Sybarites carry power
      swords as symbols of rank as much as weapons (Codex: Drukhari background). It is the same
      weapon in principle as an Imperial or Aeldari power sword, built with the barbed, cruel
      styling of Commorragh.
    design: >-
      Built on the power-field rule exactly: mundane blade sw+1 cut (field off), field on adds +3d
      and armour divisor (10), sw+3d+1(10) cut, the same as every other power sword in the project
      since the disruption field does not care who forged the blade. Exact dice at an Archon's ST 12
      (sw 1d+2, so 4d+3 with the field on): penetrates flak 100.0%, carapace 99.9%, Astartes plate
      (effective 10) 97.3% and Terminator plate (effective 19) 23.9% (24.3% with the WP chance). At
      a Kabalite's ST 10 (sw 1d, so 4d+1) the figures are 100.0/98.8/90.3/9.7%: a Kabalite officer
      can still cut down a Marine, but not a Terminator. Handling: 3.5 lb, a little heavier than the
      Aeldari pattern's 3 lb for its barbed, more elaborate guard, min ST 10 (the Aeldari weapon is
      ST 9), reach 1, parry 0, Broadsword.

  - name: "Huskblade"
    tl: "11^"
    lc: 0
    cost: 16000
    weight: 4
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Kabal"]
    weapons:
      - usage: "Field on"
        damage: "sw+3d+2(10) cut"
        reach: "1"
        parry: 0
        st: 10
        skill: "Broadsword"
      - usage: "Thrust, field on"
        damage: thr+3d+3(10) imp
        reach: "1"
        parry: 0
        st: 10
        skill: "Broadsword"
      - usage: "Field off"
        damage: "sw+2 cut"
        reach: "1"
        parry: 0
        st: 10
        skill: "Broadsword"
      - usage: "Thrust, field off"
        damage: thr+3 imp
        reach: "1"
        parry: 0
        st: 10
        skill: "Broadsword"
      - usage: "Desiccation follow-up (if blade penetrates)"
        damage: "2d tox"
        reach: "1"
        parry: 0
        st: 10
        skill: "Broadsword"
        notes: >-
          Only when the field is on and the blade penetrates DR. Living targets only: undead,
          Necrons and machines are unaffected. The wounded body dries and shrivels: the target's
          flesh is drained, not poisoned in the usual sense (toxin resistance may not help, GM's
          call).
    notes: >-
      Field-on line carries armour divisor (10). The follow-up line is used only with the field on
      (the drain is carried by the disruption field).
    lore: >-
      A power sword particular to Archons that, in Codex: Drukhari background, drains the vitality
      of what it wounds, leaving a dried husk. It is a personal weapon of the Kabal's greatest lords
      and is not carried by their warriors.
    design: >-
      Built on the power-field rule (framework: 'power-field rule plus a follow-up'): mundane sw+2
      cut, field on adds +3d (sw+3d+2(10) cut), one point over the standard Drukhari power sword to
      reflect a master-crafted lord's weapon, plus a 2d tox follow-up (average 7) if the blade
      penetrates, representing the desiccating drain. Exact dice at an Archon's ST 12 (4d+4 field
      on): flak 100.0%, carapace 100.0%, Astartes plate 98.8%, Terminator plate 33.6% (33.9% with WP
      3). The follow-up is small in Space Marine terms (HP 34) but ends most human-scale targets.
      Handling: 4 lb, min ST 10, reach 1, parry 0, Broadsword.

  - name: "Incubus Klaive"
    tl: "11^"
    lc: 0
    cost: 9000
    weight: 6.5
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Incubi"]
    weapons:
      - usage: "Field on, two-handed"
        damage: "sw+3d+3(10) cut"
        reach: "1,2"
        parry: 0
        st: "11†"
        skill: "Two-Handed Sword"
      - usage: "Field off, two-handed"
        damage: "sw+3 cut"
        reach: "1,2"
        parry: 0
        st: "11†"
        skill: "Two-Handed Sword"
    notes: >-
      Field-on line carries armour divisor (10). Two-handed only.
    lore: >-
      The Incubus's two-handed power blade: a long, heavy, elegantly barbed weapon, wielded with
      terrifying skill by the mercenary swordsmen of Arhra (Codex: Drukhari background). It is the
      tool of the master duellist and is used one-handed by no Incubus.
    design: >-
      Power-field rule again: the mundane baseline for a two-handed sword-length blade is sw+3 cut
      (a greatsword), and the field adds +3d and (10): sw+3d+3(10) cut. Exact dice at an Incubus's
      ST 12 (sw 1d+2, so 4d+5): flak 100.0%, carapace 100.0%, Astartes plate 99.6%, Terminator plate
      44.4% (44.6% with WP 3). It is the best power-field weapon in Drukhari hands at range 1-2, and
      the best of the two Incubus patterns against a Terminator; the Incubi are the Drukhari's
      answer to heavy armour in melee. Handling: 6.5 lb, min ST 11 two-handed, reach 1,2, parry 0,
      Two-Handed Sword.

  - name: "Incubus Demiklaives (pair)"
    tl: "11^"
    lc: 0
    cost: 12000
    weight: 6
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Incubi"]
    weapons:
      - usage: "Field on, each blade"
        damage: "sw+3d+1(10) cut"
        reach: "1"
        parry: 0
        st: 10
        skill: "Shortsword"
      - usage: "Field off, each blade"
        damage: "sw+1 cut"
        reach: "1"
        parry: 0
        st: 10
        skill: "Shortsword"
    notes: >-
      Field-on line carries armour divisor (10). Sold and weighed as a pair; each blade is a
      one-handed weapon. Fighting with both blades gives two attacks a turn, the second at the usual
      off-hand penalty unless the wielder is Ambidextrous; each blade parries separately.
    lore: >-
      A pair of shorter one-handed power blades carried by Incubi who fight with two weapons rather
      than one (Codex: Drukhari background). The paired blades give up reach and raw power for
      speed, in line with the Incubi's role as elite duellists.
    design: >-
      Each blade uses the standard Drukhari power-field line, sw+3d+1(10) cut (field off sw+1), at 3
      lb apiece. Exact dice at ST 12: 4d+3(10), so flak 100.0%, carapace 99.9%, Astartes plate
      97.3%, Terminator plate 23.9% per blade: half the klaive's 44.4% on the toughest armour, the
      price for two blades and two attacks. Handling: 3 lb each (6 lb the pair), min ST 10 each,
      reach 1, parry 0, Shortsword.

  # ------------------------------------------------------------ Agonisers

  - name: "Agoniser (Whip)"
    tl: "11^"
    lc: 0
    cost: 10000
    weight: 2.5
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Wych Cult", "Haemonculus Coven"]
    weapons:
      - usage: "Field on"
        damage: "sw+1d-1(10) cut"
        reach: "1-3"
        parry: "No"
        st: 8
        skill: "Whip"
        defaults: ["DX-5", "Flail-3"]
      - usage: "Field off"
        damage: "sw-2 cut"
        reach: "1-3"
        parry: "No"
        st: 8
        skill: "Whip"
        defaults: ["DX-5", "Flail-3"]
      - usage: "Agony follow-up (if the lash penetrates)"
        damage: "spec"
        reach: "1-3"
        parry: "No"
        st: 8
        skill: "Whip"
        notes: >-
          Agony follow-up: if the field-on strike penetrates DR, roll HT-3 or suffer Severe Pain (-4
          to all IQ- and DX-based rolls, B428) for a number of minutes equal to the margin of
          failure; a critical failure also stuns the victim. High Pain Threshold gives +3 to the
          roll (GM's call for other pain resistance). No effect on machines or on anything that does
          not feel pain.
        defaults: ["DX-5", "Flail-3"]
    notes: >-
      Field-on line carries armour divisor (10). Agony follow-up: if the field-on strike penetrates
      DR, roll HT-3 or suffer Severe Pain (-4 to all IQ- and DX-based rolls, B428) for a number of
      minutes equal to the margin of failure; a critical failure also stuns the victim. High Pain
      Threshold gives +3 to the roll (GM's call for other pain resistance). No effect on machines or
      on anything that does not feel pain.
    lore: >-
      The signature torture-weapon of the Wych Cults (Succubi and Hekatrixes) and a common
      Haemonculus tool: a whip or lash whose field is tuned to overload the pain nerves rather than
      cut the flesh, so that the victim suffers agony out of proportion to the wound (Codex:
      Drukhari background). It is at least as much an instrument of torture as of war.
    design: >-
      The framework's anchor: 'neural-whip or blade: a field weapon (10) plus a pain affliction;
      agony rather than cutting power'. The field is on the power-field rule (armour divisor (10),
      field-off mundane baseline) but the damage is deliberately low: sw+1d-1 field on (2d at a
      Wych's ST 11), well under the +3d power weapons, since the field is tuned to pain rather than
      to shearing (a mundane whip is sw-2 cut). The (10) divisor is what lets the pain reach the
      victim through armour, and the pain, not the wound, is the weapon. Exact dice: at a Succubus's
      ST 12 (sw 1d+2, so 2d+1 field on) it penetrates flak 97.2%, carapace 58.3%, Astartes plate
      16.7% (18.0% with WP 4) and never Terminator plate; at a Wych's ST 11 (2d) 91.7/41.7/8.3%. It
      is not a Marine-killer and not meant to be; a Marine's High Pain Threshold gives +3 against
      the affliction anyway. Affliction rules follow the project's other pain-based items:
      penetration gates the follow-up, and the HT roll resists it. Handling: 2.5 lb (a slim handle
      with the field generator), min ST 8, reach 1-3, parry 'No' (a whip cannot parry), Whip skill
      (defaults DX-5, Flail-3).

