    design: >-
      Same principle as the whip: a field weapon (10) whose real weapon is the pain affliction. A
      blade can carry a little more damage than a whip: sw+1d+1(10) cut (2d+3 at a Succubus's ST
      12), still 2d under the power sword's +3d. Exact dice at ST 12: flak 100.0%, carapace 83.3%,
      Astartes plate 41.7% (42.7% with WP 4), Terminator plate 0.0% (0.3% with WP 3): a duellist's
      weapon that reaches through carapace far more reliably than a whip but is no threat to
      Terminators. Handling: 3 lb, min ST 8, reach 1, parry 0, Shortsword.

  # ------------------------------------------------------------ Wych Cult arena weapons (no power fields)

  - name: "Wych Hydra Gauntlets (pair)"
    tl: "10^"
    lc: 0
    cost: 3000
    weight: 3
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Wych Cult"]
    weapons:
      - usage: "Claw strike, each gauntlet"
        damage: "sw+2d(3) cut"
        reach: "C,1"
        parry: 0
        st: 8
        skill: "Brawling"
    notes: >-
      Worn as a pair: the Wych may attack with both in one turn (second attack at the usual off-hand
      penalty unless she is Ambidextrous). Parry uses Brawling/2+3 as for any hand weapon. Blades
      are hyper-keen Commorraghan edges (armour divisor (3)), not a power field.
    lore: >-
      Clawed gauntlets worn by Hekatrixes and Wyches: a pair of hand-blades bonded to the forearm
      that let a Wych rake, slash and parry at close quarters with tremendous speed (Codex: Drukhari
      background). Wych weapons are consistently shown as monofilament-sharp rather than power-field
      weapons; the tabletop gives them armour penetration but no field, and that is the reading used
      here.
    design: >-
      No framework anchor beyond 'mundane weapons made lethal by the Wych's skill; no power fields'.
      The edge is set by the same reasoning as the Aeldari shuriken (monomolecular edge, divisor
      (3)) and the Imperial chainsword (sw+2d(2)): a hyper-sharp edge with no motor or field gets
      the shuriken's (3) at the chainsword's two extra dice, sw+2d(3) cut. Exact dice at a Wych's ST
      11 (sw 1d+1, so 3d+1(3), average 11.5): penetrates flak (effective 10) 62.5% of hits (68.5%
      with the Weak Points chance), carapace (effective 23.3) 0.0% (2.3% with WP 5) and Astartes
      plate 0.0% (0.1% with WP 4). Flak is therefore a coin-flip-plus for each blow, which with a
      Wych's many attacks a turn is how she butchers Guardsmen, while carapace and power armour
      still turn her aside except on gaps. Handling: 3 lb the pair, min ST 8, reach C,1, parry 0,
      Brawling. TL 10 with the ^ mark for the Commorragh edge.

  - name: "Razorflails (pair)"
    tl: "10^"
    lc: 0
    cost: 2800
    weight: 5
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Wych Cult"]
    weapons:
      - usage: "Swing, each flail"
        damage: "sw+2d(3) cut"
        reach: "1,2"
        parry: "0U"
        st: 9
        skill: "Flail"
    notes: >-
      Ordinary flail rules apply: the U in 0U means the flail is unbalanced (it cannot parry after
      it has attacked that turn), and a defender's parry against a flail is at -4. Carried as a
      pair.
    lore: >-
      A pair of chain-flails studded with razor-edged blades, favoured by Wyches who fight at a
      range that makes a blade user's guard difficult (Codex: Drukhari background). The arena
      fighters use them in a whirling, almost dancing style; the edges are Commorragh-keen, not
      power-field.
    design: >-
      Same edge reasoning as the hydra gauntlets: a razor-bladed chain flail is a cutting weapon
      with a monomolecular-class edge, sw+2d(3) cut, kept at reach 1,2 and parry 0U (framework:
      flails 0U). Exact dice at a Wych's ST 11 (3d+1(3)): flak 62.5% (68.5% with Weak Points),
      carapace 0.0% (2.3%), Astartes 0.0% (0.1%). What the flail adds over the gauntlets is reach
      and the -4 to parry it. Handling: 2.5 lb each (5 lb the pair), min ST 9, reach 1,2, parry 0U,
      Flail.

  - name: "Shardnet and Impaler"
    tl: "10^"
    lc: 0
    cost: 2200
    weight: 7
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Wych Cult"]
    weapons:
      - usage: "Impaler, thrust"
        damage: "thr+2d(3) imp"
        reach: "1,2*"
        parry: 0
        st: 9
        skill: "Spear"
        defaults: ["DX-5", "Polearm-4", "Staff-2"]
      - usage: "Shardnet, thrown"
        damage: "spec"
        acc: 0
        range: "3/6"
        rof: 1
        shots: "1(T)"
        st: 8
        bulk: -3
        skill: "Net"
        defaults: ["DX-6"]
        notes: >-
          A hit entangles the target: Binding (advantage, ST 12, DR 2). While bound, each turn spent
          struggling the wire and crystals cut for 1d cut (no attack roll). Recovering a thrown net
          takes 1d turns and the Wych's next Ready. Cannot parry while it is thrown.
    notes: >-
      The impaler is used one-handed while the net is held, or two-handed for the thr line's usual
      reach. Roughly a gladiator's trident-and-net kit.
    lore: >-
      The arena kit of the Wych Cult's net-and-spear fighters: a crystal-studded net to bind an
      opponent and a barbed trident or spear to finish them (Codex: Drukhari background, Wych arena
      weapons). The impaler's head is a Commorragh-keen point; the net is unchanged.
    design: >-
      Two weapons in one item. The impaler is a spear-class thrusting weapon with the same
      hyper-keen edge as the other Wych blades, thr+2d(3) imp (the shuriken's (3), two extra dice
      over the thrust as for the flail and gauntlets), reach 1,2*, min ST 9. Exact dice at a Wych's
      ST 11 (thr 1d-1, so 3d-1(3), average 9.5): flak 37.5% (46.7% with WP), carapace 0.0% (1.2%),
      Astartes 0.0%. Thrusts are weaker than swings against armour because thr is lower than sw at
      this ST, but the impaling wound multiplier makes each penetrating hit hurt. The shardnet is
      unchanged: thrown (range 3/6, ST 8, 3 lb), Binding rather than damage, to bring the target
      down to a defenceless state for the impaler. Handling: 4 lb impaler + 3 lb net, min ST 9 and
      8.

  - name: "Wych Blade"
    tl: "10^"
    lc: 0
    cost: 900
    weight: 1.5
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Wych Cult"]
    weapons:
      - usage: "Swing"
        damage: "sw+1d(3) cut"
        reach: "1"
        parry: 0
        st: 7
        skill: "Shortsword"
      - usage: "Thrust"
        damage: "thr+1d(3) imp"
        reach: "1"
        parry: 0
        st: 7
        skill: "Shortsword"
    notes: >-
      Also stands for the shorter Wych knife: use the same profile at reach C,1 if the GM wants a
      concealed dagger.
    lore: >-
      The basic close-combat blade of the Wych Cults, carried by Wyches as a side-arm alongside more
      specialised weapons. The sources do not give it a distinct canonical profile; this entry is
      built to give Wych characters an ordinary Commorraghan blade.
    design: >-
      A shortsword-class blade with the Commorragh hyper-keen edge: one die over the plain sword's
      sw / thr+1 and the (3) divisor, sw+1d(3) cut and thr+1d(3) imp (a lighter blade than the
      gauntlets and flails, so one die of edge rather than two). Exact dice at a Wych's ST 11: the
      swing (2d+1(3), average 8) penetrates flak 16.7% (27.9% with WP), carapace 0.0% (0.4%),
      Astartes 0.0%; the thrust (2d-1(3)) 2.8% flak (12.0% with WP). It cuts ordinary clothing and
      light armour readily and only worries flak on a lucky roll. Handling: 1.5 lb, min ST 7, reach
      1, parry 0, Shortsword.

  # ------------------------------------------------------------ Haemonculus tools

  - name: "Scissorhand"
    tl: "10^"
    lc: 0
    cost: 3500
    weight: 4
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Haemonculus Coven"]
    weapons:
      - usage: "Swing"
        damage: "sw+1d(3) cut"
        reach: "1"
        parry: 0
        st: 11
        skill: "Broadsword"
        defaults: ["DX-5", "Shortsword-2", "Knife-3"]
    notes: >-
      Two blades pivoting on a joint like shears. A Haemonculus with a scissorhand on each arm may
      attack with both, the second at the usual off-hand penalty unless Ambidextrous.
    lore: >-
      A giant pair of shears worn as a glove or bonded to the arm by Haemonculi and used as surgical
      and torture implements (Codex: Drukhari background gives a scissorhand as a Haemonculus's
      melee weapon). Its shear-edges are Commorragh-keen.
    design: >-
      No framework anchor; a mundane heavy cutting weapon with the hyper-keen edge used across the
      Drukhari blades: sw+1d(3) cut, no field. Exact dice at a Haemonculus's ST 13 (sw 2d-1, so
      3d-1(3), average 9.5): flak 37.5% (46.7% with WP 7), carapace 0.0% (1.2% with WP 5), Astartes
      0.0%. A surgeon's tool that goes through a flak jacket about as often as not. Handling: 4 lb,
      min ST 11, reach 1, parry 0.

  - name: "Flesh Gauntlet"
    tl: "10^"
    lc: 0
    cost: 3500
    weight: 5
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Haemonculus Coven"]
    weapons:
      - usage: "Punch"
        damage: "thr+3 cr"
        reach: "C,1"
        parry: 0
        st: 10
        skill: "Brawling"
      - usage: "Toxin follow-up (if the punch penetrates)"
        damage: "2d tox"
        reach: "C,1"
        parry: 0
        st: 10
        skill: "Brawling"
        notes: >-
          Only if the crushing damage penetrates DR: the grafted spurs inject a coven toxin. Living
          targets only.
    notes: >-
      Grown, not built: the gauntlet is fused into the wearer's arm by surgery. Removing or
      replacing it takes a Haemonculus (Surgery roll). The crushing damage is mundane; the toxin is
      the sting.
    lore: >-
      A brutish grafted gauntlet used by Haemonculi as a melee weapon (Codex: Drukhari background).
      The sources say little about its exact working, so it is built as a heavy gauntlet with a
      coven toxin follow-up, a design choice consistent with the Haemonculus's trade.
    design: >-
      No framework anchor; a heavy fist-weapon of the Basic Set type, kept mundane as the
      coordinator asked: thr+3 cr at a Haemonculus's ST 13 (thr 1d, so 1d+3, average 6.5), no
      divisor, so it penetrates flak 0.0% and the toxin never fires against armour; against bare
      flesh it adds 2d tox (average 7). That makes it a weapon for unarmoured victims, the surgeon's
      usual subjects. Handling: 5 lb, min ST 10, reach C,1, parry 0, Brawling.

  - name: "Electrocorrosive Whip"
    tl: "10^"
    lc: 0
    cost: 3000
    weight: 2
    tags: ["Melee Weapon", "Xenos", "Drukhari", "Haemonculus Coven"]
    weapons:
      - usage: "Lash"
        damage: "sw(2) cor"
        reach: "1-3"
        parry: "No"
        st: 7
        skill: "Whip"
        defaults: ["DX-5", "Flail-3"]
      - usage: "Discharge follow-up (if lash penetrates)"
        damage: "2d burn"
        reach: "1-3"
        parry: "No"
        st: 7
        skill: "Whip"
        defaults: ["DX-5", "Flail-3"]
    notes: >-
      A whip that is also a wire of corrosive acid and electric charge. Does not parry.
    lore: >-
      A Haemonculus's whip that both corrodes and shocks its victim (Codex: Drukhari background). A
      tool of the flesh-sculptor's torture chamber more than a battlefield arm.
    design: >-
      A mundane whip with a follow-up and no field: lash sw(2) cor (corrosion wounds x1, and the
      acid coating gives it the (2) divisor) plus a 2d burn discharge if the lash penetrates. Exact
      dice at a Haemonculus's ST 13 (sw 2d-1, average 6): flak 0.0% (4.5% with WP 7), carapace 0.0%,
      Astartes 0.0%. A whip's low damage cannot make use of even a (2) edge against armour; it is a
      weapon for exposed flesh. Handling: 2 lb, min ST 7, reach 1-3, parry 'No', Whip.

