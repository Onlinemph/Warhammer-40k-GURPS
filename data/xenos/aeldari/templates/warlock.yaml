kind: template
output: Xenos/Aeldari/Templates/Warlock.gct
notes: >
  A Warlock: a Guardian or former Aspect Warrior who has stepped onto the
  Path of the Seer far enough to work the Runes of Battle in the middle of
  a fight, without being lost to prophecy the way a Farseer is — Codex
  background is explicit that Warlocks remain warriors and squad leaders
  first. Built on the same Thaumatology: Sorcery chassis as every other
  psyker in this project (Imperium/Psykers and the Warp.adq), with the
  milder Aeldari Runes Perils variant (Xenos/Aeldari/Traits/Aeldari
  Physiology.adq): Perils of the Warp (Aeldari Runes) is -5%/-10% where the
  human variant is -10%/-20%.

  Point math: Aeldari Physiology + Keen Battle-Sense + Seer's Apprenticeship
  + Aeldari Psyker (Talent) 2 + Aeldari Warp Empowerment 6 (70) + Aeldari
  Soul-Sense + Runes of Battle (all traits, 326 points, Destructor 7d(2)
  burn ex being 62 of them) + skills (36 points) = 445 points. Stats:
  ST 10, DX 14, IQ 13, HT 10, HP 10, Will 14, Per 14 (Keen Battle-Sense
  included: a Warlock still fights the line), Speed 6.25, Move 9, Dodge 9.
  This sits in framework.md's "Senior agents" tier
  (350-600), matching Codex background's treatment of a Warlock as a
  genuinely dangerous specialist squad leader, distinctly short of a
  Farseer's own reach into the Astartes tier.

  Aeldari Warp Empowerment is bought at level 6 (cap 70): Destructor at its
  full 7 dice costs 61.25, rounded up to 62, and every other Rune of Battle
  (Reveal, Jinx, Drain at 19 each) is well under that. Level 6 is the
  lowest level that covers Destructor; a Warlock who buys fewer dice can
  drop back toward level 2 (cap 30, which covers 19-point Runes and
  Destructor up to 4 dice). Rune Armour's ward scaling by Empowerment level
  (see that entry's notes) was not rescaled.
traits:
  - include: "xenos/aeldari/traits.yaml#Aeldari Physiology"
  - include: "xenos/aeldari/traits.yaml#Keen Battle-Sense"
  - include: "xenos/aeldari/traits.yaml#Seer's Apprenticeship"
  - include: "xenos/aeldari/traits.yaml#Path of the Seer"
  - include: "xenos/aeldari/traits.yaml#Aeldari Psyker (Talent)"
    levels: 2
  - include: "xenos/aeldari/traits.yaml#Aeldari Warp Empowerment"
    levels: 6
  - include: "xenos/aeldari/traits.yaml#Aeldari Soul-Sense"
  - include: "xenos/aeldari/traits.yaml#Runes of Battle"
skills:
  - include: "imperium/common/skills.yaml#Psyniscience"
    points: 4
  - name: Meditation
    diff: Will/H
    ref: B207
    points: 4
    tags: [Xenos, Aeldari, Psyker]
    lore: The discipline that keeps a Warlock's gift steady under fire, without which no Aeldari psyker lasts long.
    design: Will+0 for 4 points, Hard; Meditation is Will-based (B207).
  - name: Hidden Lore
    spec: (the Warp)
    diff: IQ/A
    points: 4
    tags: [Xenos, Aeldari, Psyker]
    lore: A Warlock's real, Seer-Council-taught understanding of the immaterium, well beyond a Guardian's folk knowledge.
    design: IQ+1 (14) for 4 points, Average.
  - name: Guns
    spec: Rifle
    diff: DX/E
    points: 4
    tags: [Xenos, Aeldari]
    lore: A Warlock still carries and uses a shuriken catapult like any other Guardian.
    design: DX+2 (16) for 4 points, Easy.
  - name: Broadsword
    diff: DX/A
    points: 8
    tags: [Xenos, Aeldari]
    lore: The witchblade, a Warlock's own force weapon, carried and drilled with as seriously as any Aspect Warrior's blade.
    design: DX+2 (16) for 8 points, Average; the framework's las/plasma/melta and chainsword/power-sword weapon-skill table places force weapons on Broadsword/Staff/Axe, matched here to Broadsword.
  - name: Leadership
    diff: IQ/A
    points: 4
    tags: [Xenos, Aeldari]
    lore: A Warlock is typically the senior figure attached to a Guardian defense force or Aspect warhost detachment.
    design: IQ+1 (14) for 4 points, Average.
  - name: Tactics
    diff: IQ/H
    points: 4
    tags: [Xenos, Aeldari]
    lore: Enough battlefield sense to know when to spend a Rune of Battle and when to hold it.
    design: IQ+0 (13) for 4 points, Hard.
  - name: Innate Attack
    spec: Beam
    diff: DX/E
    points: 4
    tags: [Xenos, Aeldari, Psyker]
    lore: Aiming a Destructor through the press of a firefight, drilled alongside the Guardian's catapult.
    design: Innate Attack (Beam) (DX/E, B201) at DX+2 (16) for 4 points, Easy; the skill Destructor's Burning Innate Attack build calls for.
