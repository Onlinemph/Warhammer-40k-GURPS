    design: IQ+1 (13) for 4 points, Average.
  - name: Observation
    diff: Per/A
    points: 8
    tags: [Xenos, Aeldari]
    lore: Sighting trouble, or a target, before anyone else on the field does.
    design: Per+2 (14) for 8 points, Average.
  - name: Jumping
    diff: DX/E
    points: 1
    tags: [Xenos, Aeldari]
