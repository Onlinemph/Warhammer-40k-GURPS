kind: template
output: Xenos/Aeldari/Templates/Autarch.gct
notes: >
  An Autarch: a craftworld's warmaster, drawn from those rare Aeldari who
  have walked several Paths — Warrior, Outcast, sometimes Artisan — far
  enough to master each without being lost to any of them, and trusted in
  consequence to command a warhost drawn from every Aspect Shrine and
  Guardian defense force at once. Point math (see Xenos/Aeldari/Traits/
  Aeldari Physiology.adq for the full derivation of every trait below):
  Aeldari Physiology + Keen Battle-Sense + Aspect Training + Autarch's
  Mastery (all traits, 475 points) + skills (281 points) = 756 points.
  Stats: ST 12, DX 18, IQ
  14, HT 12, HP 12, Will 17, Per 15, Speed 7.75, Move 12 (sprint x1.5 with
  Enhanced Move 1/2), Dodge 13 (7 + 3 + Enhanced Dodge 2 + Combat Reflexes) — matching an Exarch's own DX 18 and Enhanced Dodge, but
  with higher IQ than the Exarch anchor line and higher ST/DX/HP than the
  Farseer anchor line, per framework.md's explicit direction that an
  Autarch sits higher than both. This lands solidly inside framework.md's
  Astartes tier (550-800),
  above both the Exarch (616 points) and Farseer (622 points)
  templates: a master of many arts and a warhost's actual commander, built
  from breadth (Weapon Master across an Aspect-weapon group, Charisma,
  Reputation, and a wide skill spread across tactics, diplomacy, and
  several weapon-forms at once) rather than any single narrower mastery.

  Unlike Exarch and Farseer, this template carries no "Lost to the Path"
  disadvantage: per framework.md and Codex background, an Autarch is
  precisely the Aeldari who has not been consumed by a single Path, which
  Autarch's Mastery's Master of Many Paths perk flags directly.
traits:
  - include: "xenos/aeldari/traits.yaml#Aeldari Physiology"
  - include: "xenos/aeldari/traits.yaml#Keen Battle-Sense"
  - include: "xenos/aeldari/traits.yaml#Aspect Training"
  - include: "xenos/aeldari/traits.yaml#Autarch's Mastery"
  - include: "xenos/aeldari/traits.yaml#Path of the Warrior"
    disabled: true
  - include: "xenos/aeldari/traits.yaml#Path of the Outcast"
    disabled: true
