kind: equipment
output: Xenos/Aeldari/Weapons/Aeldari Ranged Weapons.eqp
items:

  # ---------------------------------------------------------------- Shuriken weapons

  - name: Shuriken Pistol
    tl: "10^"
    lc: 0
    cost: 900
    weight: 2
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 3d(3) cut
        acc: 1
        range: 60/150
        rof: 6
        shots: 30(3)
        st: 5
        bulk: -2
        rcl: 1
        skill: Guns (Pistol)
    lore: >-
      A compact sidearm version of the shuriken catapult, carried by Autarchs, Exarchs and
      Aeldari who want a monomolecular-disc weapon that clears a hand for a blade; Codex:
      Craftworlds and Gav Thorpe's Path novels show it as a common Autarch and Warlock sidearm
      rather than a rank-and-file Guardian's weapon.
    design: >-
      A pistol-scale cousin of the shuriken catapult anchor (5d(3) cut), not a shrunken copy of
      it: a smaller rotor-drum spins fewer discs to a lower velocity, so this drops two dice
      rather than carrying the catapult's dice across unchanged, exactly the same "genuinely
      smaller mechanism" principle the Imperium bolt pistol entry uses against the boltgun.
      Checked with the exact dice distribution: 3d(3) averages 10.5 damage; against flak (DR 30,
      effective 10) it penetrates 50% of hits, against carapace (DR 70, effective 23.3) 0% —
      a real threat to unarmoured or flak-class targets at pistol range, never to rigid plate.
      Handling: 2 lb loaded, light even by Aeldari standards for a one-handed drum-fed sidearm;
      min ST 5 (√(10×2)≈4.5, rounded up) needs almost no strength, matching the framework's note
      that Aeldari weapons are built for ST 10–11 hands and so are trivially light for a human,
      let alone an Aeldari. RoF 6 (a spinning rotor-drum firing faster than any human sidearm's
      trigger pull, but well under the catapult's full-auto rate) and Rcl 1 (the disc launcher is
      gas-cycled with almost no kick, per the framework's "low recoil" note) are new derivations,
      not copied from the catapult below. Acc 1 and Bulk -2 are ordinary pistol figures.

  - name: Shuriken Catapult
    tl: "10^"
    lc: 0
    cost: 1800
    weight: 5.5
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 5d(3) cut
        acc: 5
        range: 60/300
        rof: 10
        shots: 80(3)
        st: 7
        bulk: -4
        rcl: 1
        skill: Guns (Rifle)
    lore: >-
      The standard-issue weapon of the Guardian militia and Dire Avenger Aspect Warriors: a
      rotary launcher that spins razor-edged monomolecular discs to lethal velocity. Codex:
      Craftworlds and Codex: Aeldari background, and Gav Thorpe's Path of the Eldar novels
      all agree it shreds unarmoured and lightly-armoured targets and struggles against a Space Marine's plate — exactly the anchor framework.md
      fixes for it.
    design: >-
      This is the project's fixed Aeldari anchor: 5d(3) cut, "shreds flesh and flak; bites
      carapace sometimes; can't hurt power armour except on a Weak Point." Checked with the exact
      dice distribution: average roll 17.5 penetrates flak (DR 30, effective 10) 96.8% of the
      time and carapace (DR 70, effective 23.3) 5.9% of the time — genuinely "sometimes," not
      "usually" — while Sororitas plate (DR 85, effective 28.3) drops to 0.08% and Astartes power
      armour (DR 100, effective 33.3) and Terminator plate (DR 200) round to 0% outright, matching
      "can't hurt power armour except on a Weak Point" precisely.
      Handling: 5.5 lb loaded, as the catapult is consistently depicted
      as noticeably lighter than a lasgun (8 lb) for the same silhouette — Aeldari wraithbone and
      psychoplastic construction is lighter than Imperial ceramite and steel. Min ST 7
      (√(10×5.5)≈7.4, rounded down) sits two points below the lasgun's ST 9 for a lighter, more
      elegant weapon built for an Aeldari's own build. Acc 5 (one better than the lasgun's Acc 6
      is not warranted by a short-range disc weapon with no scope, so it sits a point below the
      lasgun, still well above an Ork shoota's Acc 1 — an honest reflection of "accurate for its
      size," not an unearned bonus) and a shorter half/max range (60/300 vs. the lasgun's 300/900)
      match the anchor's own "short range" note; RoF 10 (a spinning rotary drum, the fastest-
      cycling small arm in this file bar the Avenger below) and Rcl 1 (near-recoilless disc
      launch, per the framework's "low recoil" note) are both derived fresh, not copied from any
      Imperium weapon. Shots 80(3): a dense high-capacity drum, per the weapon's constant "never
      seems to run dry in a firefight" depiction. Bulk -4 is an ordinary rifle figure.

  - name: Avenger Shuriken Catapult
    tl: "10^"
    lc: 0
    cost: 2400
    weight: 8
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 5d(3) cut
        acc: 6
        range: 80/400
        rof: 16
        shots: 120(4)
        st: 9
        bulk: -5
        rcl: 1
        skill: Guns (Rifle)
    lore: >-
      The Dire Avenger's own signature weapon: a heavier-barrelled, higher-capacity version of
      the standard shuriken catapult, issued only to Aspect Warriors who have walked the Path of
      the Warrior on the Aspect Shrine of the Avenger. Codex: Craftworlds and Path of the Eldar
      consistently frame it as hitting exactly as hard as a Guardian's catapult but reaching
      farther and spraying discs faster.
    design: >-
      The framework's own anchor entry says the Avenger keeps the catapult's 5d(3) cut and adds
      "longer range, higher RoF" — so the dice are unchanged from the Shuriken Catapult above
      (the same 96.8%/5.9%/0.08%/0%/0% penetration profile against flak/carapace/Sororitas/
      Astartes/Terminator applies unchanged) and every handling figure is instead re-derived from
      a heavier weapon built to fire faster and farther, never copied wholesale from the plain
      catapult. Weight up to 8 lb for the reinforced barrel shroud and bigger rotor motor Dire
      Avenger iconography consistently shows; min ST 9 (√(10×8)≈8.9, rounded up) sits at the
      lasgun's own figure — appropriate for a heavier support-pattern weapon even by Aeldari
      standards, still trivial for an Aspect Warrior's ST 11. Acc 6 (one point over the plain
      catapult, for the longer sight radius the bigger frame allows) and an 80/400 half/max range
      (up from 60/300) are the "longer range" the anchor calls for; RoF 16 (up from 10, "higher
      RoF") reflects a faster rotor rather than a different mechanism. Shots 120(4), a bigger
      drum for a weapon issued to warriors who expect to hold a firing line, not skirmish. Bulk -5
      (one step bulkier for the reinforced housing) and Rcl 1 (unchanged — the launch principle is
      identical) round out the entry.

  - name: Shuriken Cannon
    tl: "10^"
    lc: 0
    cost: 6000
    weight: 32
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 7d(3) cut
        acc: 6
        range: 150/600
        rof: 15
        shots: 150(5)
        st: 12
        bulk: -6
        rcl: 1
        skill: Guns (Light Machine Gun)
    lore: >-
      A heavy support weapon carried by Aspect support squads and mounted on War Walkers, Wave
      Serpents and Falcons: a scaled-up rotary shuriken launcher throwing far larger, faster
      discs. Codex: Craftworlds background agrees it can open up carapace and light vehicle plating that the man-portable catapult
      family cannot touch.
    design: >-
      This is the framework's own fixed anchor for the weapon: 7d(3) cut, RoF 15. Checked with
      the exact dice distribution: average roll 24.5 penetrates flak (DR 30, effective 10)
      99.96% of the time, carapace (DR 70, effective 23.3) 58.6% of the time — a real, common
      threat rather than a lucky exception — Sororitas plate (DR 85, effective 28.3) 19.2%,
      Astartes power armour (DR 100, effective 33.3) 2.2%, and Terminator plate rounds to 0%.
      That profile matches the lore's "opens up carapace" claim precisely while keeping it well
      below the plasma- and fusion-class weapons that are supposed to be the real answer to power
      armour.
      Handling: 32 lb loaded, a genuine heavy weapon (comparable in class to the Imperium's
      Multi-laser at 45 lb, lighter for the same reason every Aeldari weapon in this file runs
      lighter than its Imperial counterpart). Min ST 12 (√(10×32)≈17.9, reduced for a mount-
      braced weapon the same way the framework treats "M"/braced weapons, then set a further step
      down for Aeldari engineering — a two-Aspect-Warrior support team, not a tripod, usually
      carries and braces it) reflects a crew-served weapon two Aspect Warriors can still shoulder
      between them rather than one requiring a literal tripod. RoF 15 (the anchor's own figure,
      matching the framework's "rapid emitters/cyclic weapons" bracket for a rotary weapon this
      size) and Rcl 1 (unchanged mechanism, near-recoilless disc launch even scaled up) round out
      the build. Acc 6, an 150/600 range and Bulk -6 sit between the Avenger catapult and a
      genuine vehicle-mount weapon, and Shots 150(5) reflects a proper ammunition drum for a
      support-squad weapon.

  # ---------------------------------------------------------------- Las and plasma

  - name: Lasblaster
    tl: "10^"
    lc: 0
    cost: 1200
    weight: 5.5
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 7d(2) burn
        acc: 6
        range: 300/900
        rof: 12
        shots: 80(3)
        st: 7
        bulk: -4
        rcl: "1L"
        skill: Beam Weapons (Rifle)
    lore: >-
      The standard laser rifle of the Aeldari Corsairs and some Craftworld auxiliaries, and the
      weapon most consistently associated with Aeldari "las" fire rather than the shuriken weapons that dominate Guardian and Aspect
      wargear; framework.md's own Aeldari anchor calls it "7d(2) burn, rapid."
    design: >-
      The anchor fixes the dice: 7d(2) burn, identical wounding to the Imperium lasgun (which
      shares the same penetration profile by exact dice distribution — 97.8% vs. flak, 0.6% vs.
      carapace, 0% at Sororitas plate and above) because a las weapon's lasing chemistry and
      focusing coil don't change with who built the housing; what makes it a distinct weapon is
      handling, built fresh rather than copied from the Kantrael lasgun. "Rapid" is read literally
      as a higher cyclic rate than a lasgun's own RoF 10: RoF 12, near the top of the framework's
      "lasguns and autoguns on auto around 10-12" bracket. Weight drops to 5.5 lb (from the
      lasgun's 8 lb) for the same lighter Aeldari construction the Shuriken Catapult above uses,
      giving min ST 7 (√(10×5.5)≈7.4) against the lasgun's ST 9 — a genuinely lighter, easier-
      handling weapon, matching the framework's "light, elegant, accurate for their size" note.
      Acc, range, shots, Bulk and Rcl are otherwise held at the lasgun's own figures (Acc 6,
      300/900, 80(3) shots, Bulk -4, Rcl 1) since nothing in the lore singles those out as
      different — only weight, ST and RoF are actually re-derived here.

  - name: Long Rifle, Ranger Pattern
    tl: "10^"
    lc: 0
    cost: 2600
    weight: 9
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 8d(2) burn
        acc: 11
        range: 1000/3000
        rof: 1
        shots: 8(4)
        st: 8
        bulk: -6
        rcl: 1
        skill: Beam Weapons (Rifle)
    lore: >-
      The Ranger's long rifle: a precision laser weapon carried by Aeldari who have taken the
      lonely, wandering Path of the Outcast, hunting alone far from their craftworld. Codex:
      Craftworlds and Path of the Eldar (Thorpe's Ranger-focused chapters) agree it is the single most accurate small arm any Aeldari carries, built to
      put one shot exactly where it is needed from extreme range rather than to sustain fire.
    design: >-
      One die over the lasblaster, matching the framework's long-las-over-lasgun relationship
      (8d(2) burn vs. 7d(2) burn) rather than inventing a new wounding mechanic: same lasing
      chemistry, one more die of stored charge for a longer, more deliberate shot. Checked by
      exact dice distribution: average roll 28 penetrates flak (DR 30, effective 15) 99.6% of the
      time and carapace (DR 70, effective 35) 6.1% of the time — identical to the Imperium
      long-las's own figures, since the underlying dice are the same; this is a sniper weapon
      that kills unarmoured and lightly-armoured targets outright and can occasionally punch
      carapace at extreme range, never a Marine-killer.
      Handling: the assignment calls for "very high Acc" specifically, so Acc is set to 11 — five
      over the lasblaster's 6 and one better than the Imperium's own heavy Transuranic
      Arquebus-class sniper weapons, representing a masterwork Aeldari scope-and-stabiliser
      system rather than a bolted-on optic; range extends to 1000/3000 (over the lasblaster's
      300/900) for the same reason. Weight 9 lb and min ST 8 (√(10×9)≈9.5, reduced by one for the
      lightweight Aeldari stock and barrel) reflect a long two-handed rifle a Ranger carries for
      days at a time, not a support weapon. RoF 1 (a sniper weapon fired for one deliberate,
      aimed shot, not sprayed) and a small 8(4) charge cell (a Ranger travels light and recharges
      rather than carrying bulk reserves) are both new derivations; Bulk -6 (long-barrelled,
      cameleoline-wrapped) and Rcl 1 (a beam weapon) round out the build.

  # ---------------------------------------------------------------- Fusion (melta-class)

  - name: Fusion Pistol
    tl: "11^"
    lc: 0
    cost: 3200
    weight: 4
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Short range (up to ½D)
        damage: 6dx6(10) burn
        acc: 1
        range: 5/25
        rof: 1
        shots: 4(4)
        st: 7
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Pistol)
      - usage: Beyond ½D
        damage: 3dx6(3) burn
        acc: 1
        range: 5/25
        rof: 1
        shots: 4(4)
        st: 7
        bulk: -2
        rcl: 1
        skill: Beam Weapons (Pistol)
        notes: >-
          Half damage past ½D and the armour divisor falls from (10) to (3) as the fusion
          reaction loses cohesion, exactly as the Imperium Inferno Pistol's own beyond-½D line.
    lore: >-
      A one-handed fusion weapon carried by Autarchs and Fire Dragon Exarchs who want a point-
      blank anti-armour answer without giving up a blade or a second weapon; Codex: Craftworlds
      background treats it as the sidearm
      cousin of the fusion gun below, exactly as devastating at arm's length and exactly as
      short-ranged.
    design: >-
      Scaled down from the Fusion Gun anchor the same way the Imperium's own Inferno Pistol is
      scaled down from the Meltagun in melta.yaml: two dice off the full weapon's short-range
      figure (6dx6(10) burn vs. the Fusion Gun's 8dx6(10)), same very short 5/25 range band, same
      halved-damage/divisor-(3) beyond-½D line. At short range 6dx6 averages 126 and clears every
      personal armour and vehicle DR on the framework's tables outright, by exact dice
      distribution, identical to the Imperium Inferno Pistol's own figures — a fusion weapon
      wins or loses entirely on range, not calibre.
      Handling: 4 lb loaded, two pounds lighter than the Imperium Inferno Pistol's 6 lb — the same
      lighter-construction relationship every weapon in this file has to its Imperial counterpart
      — giving min ST 7 (√(10×4)≈6.3, bumped for the coil and reservoir a fusion weapon needs even
      one-handed, the same treatment the Imperium Plasma Pistol and Inferno Pistol both get). RoF
      1 (the fusion reaction must recharge between shots, unchanged from every melta-class weapon
      in this project) and Shots 4(4) (a small charge cell, one shot below the Inferno Pistol's
      3(5) — Aeldari energy cells are denser but this is still a pistol-scale reservoir). Bulk -2
      and Rcl 1 are ordinary pistol figures for a beam weapon.

  - name: Fusion Gun
    tl: "11^"
    lc: 0
    cost: 5000
    weight: 11
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Short range (up to ½D)
        damage: 8dx6(10) burn
        acc: 2
        range: 10/50
        rof: 1
        shots: 6(4)
        st: 8
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
      - usage: Beyond ½D
        damage: 4dx6(3) burn
        acc: 2
        range: 10/50
        rof: 1
        shots: 6(4)
        st: 8
        bulk: -4
        rcl: 1
        skill: Beam Weapons (Rifle)
        notes: >-
          Half damage past ½D and the armour divisor falls from (10) to (3), exactly as the
          Imperium Meltagun's own beyond-½D line.
    lore: >-
      The signature weapon of the Fire Dragons: framework.md's Aeldari anchor table places it
      squarely on the meltagun anchor, and Codex: Craftworlds, Path of the Eldar and every RPG-
      line Aeldari armoury list agree it is the Aeldari's dedicated tank-killer, flash-vaporising
      armour at point-blank range and doing next to nothing at any real distance — the same
      short-range specialist role the Imperium meltagun fills.
    design: >-
      Held exactly at the meltagun anchor per framework.md's explicit "Melta class (meltagun
      anchor)" instruction: 8dx6(10) burn to ½D, 4dx6(3) beyond. Checked with the exact dice
      distribution against the vehicle AV table: at short range the average roll of 168 clears
      every AV10-14 DR (100-350) outright under the (10) divisor, exactly matching the Imperium
      Meltagun's own verified figures in melta.yaml; beyond ½D the average of 84 still wrecks
      AV10-12 (94-100%) but falls to 34% at AV13 and 5% at AV14, the identical "wrecks light
      and medium vehicles, almost never beats the heaviest tanks beyond range" profile. This is a
      deliberate case of matching an Imperium weapon's numbers exactly rather than varying them
      for variety's sake — the anchor calls for it directly, and the underlying physics (a fusion
      reaction) doesn't care who built the housing.
      Handling: 11 lb loaded, six pounds lighter than the Imperium Meltagun's 17 lb for the
      lighter wraithbone-and-crystal housing every Aeldari weapon in this file gets over its
      Imperial counterpart; min ST 8 (√(10×11)≈10.5, reduced for the lighter frame, well below the
      Meltagun's ST 13) matches an Aeldari Fire Dragon's own ST 11 comfortably. RoF 1 (unchanged —
      melta-class weapons must vent and recharge between shots) and Shots 6(4) (two more shots
      than the Meltagun's 4(5), for a denser Aeldari power cell, with a faster 4-second swap).
      Bulk -4 and Rcl 1 match the Meltagun's own figures, since nothing in the lore calls for the
      weapon to handle any differently in that respect.

  - name: Firepike
    tl: "11^"
