    weapons:
      - usage: Short range (up to ½D)
        damage: 8dx6(10) burn
        acc: 3
        range: 20/100
        rof: 1
        shots: 6(4)
        st: 10
        bulk: -6
        rcl: 1
        skill: Beam Weapons (Rifle)
      - usage: Beyond ½D
        damage: 4dx6(3) burn
        acc: 3
        range: 20/100
