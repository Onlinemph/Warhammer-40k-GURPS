      The Fusion Gun above with the same dice and divisor (8dx6(10) to ½D, 4dx6(3) beyond, so
      every penetration figure in the Fusion Gun entry carries over) and the extra length spent
      on range: ½D doubles from 10 to 20 and max from 50 to 100, with Acc 3. The longer barrel
      and larger power core weigh 22 lb, min ST 10, Bulk -6.

  # ---------------------------------------------------------------- Plasma-class

  - name: Starcannon
    tl: "11^"
    lc: 0
    cost: 9000
    weight: 26
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 6dx4(3) burn ex
        acc: 6
        range: 250/750
        rof: 3
        shots: 10(4)
        st: 11
        bulk: -6
        rcl: 2
        skill: Gunner (Beams)
    lore: >-
      A heavy plasma-class weapon mounted on War Walkers, Wave Serpents and Falcons and carried
      by Aspect support squads; Codex: Craftworlds background is explicit that Aeldari plasma
      containment technology is far safer than Imperial coils and never depicted overheating or
      cooking its own crew, in contrast to the Imperium plasma gun and cannon family — exactly
      the "no overheating" note in framework.md's Aeldari anchor table.
    design: >-
      Damage held at the plasma gun anchor per the framework's explicit "Plasma class (plasma gun
      anchor) with no overheating" instruction: 6dx4(3) burn ex, no supercharged/Malf line at all
      — the "no overheating" note isn't just flavour text here, it's the reason this entry has
      one weapon line where every Imperium plasma weapon in plasma.yaml has two. Checked by exact
      dice distribution: average 84 penetrates Astartes power armour (DR 100, effective 33.3)
      99.9% of the time and a Terminator (DR 200, effective 66.7) 85.5% of the time, identical to
      the Imperium Plasma Gun's own verified standard-mode figures.
      Handling: because the coil never needs to vent between shots, RoF is set to 3 rather than
      the Imperium plasma family's uniform RoF 1 — this is the one place in this file where
      Aeldari technology is mechanically faster than its Imperial counterpart, not just lighter,
      and it follows directly from the anchor's own "no overheating" clause rather than being
      copied from any other weapon. 26 lb loaded (well under the Imperium Plasma Cannon's 45 lb)
      gives min ST 11M (√(10×26)≈16.1, reduced for the vehicle/tripod mount the way every mounted
      weapon in this project is): built as a genuine support weapon rather than easily shoulder-
      fired, per its depiction almost always as a vehicle or support-squad weapon rather than a
      single Aspect Warrior's personal arm. Shots 10(4), Bulk -6 and Rcl 2 sit between the
      Imperium Plasma Gun and Plasma Cannon, matching its own place between rifle and cannon
      scale; Acc 6 and a 250/750 range are the framework's ordinary heavy-weapon figures.

  # ---------------------------------------------------------------- Scatter laser

  - name: Scatter Laser
    tl: "10^"
    lc: 0
    cost: 3200
    weight: 12
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 6dx2(2) burn
        acc: 5
        range: 900/2700
        rof: 14
        shots: 100(4)
        st: 10
        bulk: -5
        rcl: "1L"
        skill: Beam Weapons (Rifle)
    lore: >-
      A rapid-firing anti-infantry laser weapon mounted on Wave Serpents, War Walkers and Falcons
      and occasionally carried by Guardian Defender heavy-weapon platforms; Codex: Craftworlds
      background frames it as trading the lasblaster's single-shot punch for sheer volume of
      fire, a "scattering" spray of individually weaker las-bolts meant to saturate a firing arc
      rather than land one precise hit.
    design: >-
      Multi-laser parity: 6dx2(2) burn, the Imperial multi-laser's damage, because the scatter
      laser fills the same role (a multi-emitter heavy support laser on grav-platforms and
      vehicles) and is stronger per bolt than the handheld lasblaster in every edition's
      ordering. An earlier draft had it at 6d(2), weaker than the lasblaster. Exact odds per bolt:
      flak (eff. 15) 100%; carapace (eff. 35) 79%; Sororitas (eff. 42.5) 45%; Astartes (eff. 50)
      14%; Terminator 0%. Volume of fire is what makes it dangerous to power armour.
      Handling: 12 lb loaded and min ST 10 (√(10×12)≈11, matching the framework's own formula
      almost exactly) for a weapon that is almost always vehicle- or platform-mounted rather than
      shoulder-fired by a lone Guardian; RoF 14 (near the top of the framework's "rapid emitters"
      bracket, faster than the lasblaster's 12, "several linked emitters" being the scatter
      laser's whole point per its name and role) and Shots 100(4) (a large cell to feed that rate
      of fire) are both derived fresh from the weapon's actual saturation-fire role, not copied
      from the lasblaster. Acc 5 and Bulk -5 sit between the lasblaster and the full starcannon; range 900/2700
      matches the Imperial multi-laser, since both reach the same distance in every edition, and Rcl 1 is unchanged — still a beam weapon with no real kick.

  # ---------------------------------------------------------------- Bright lance

  - name: Bright Lance
    tl: "11^"
    lc: 0
    cost: 14000
    weight: 28
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 6dx4(10) burn
        acc: 9
        range: 1200/3600
        rof: 1
        shots: 6(6)
        st: 13
        bulk: -7
        rcl: 1
        skill: Gunner (Beams)
    lore: >-
      The Aeldari's dedicated tank-killing lance weapon, mounted on Falcons, War Walkers and
      Fire Prisms and occasionally carried by an Autarch or Exarch as a personal weapon; Codex:
      Craftworlds background consistently shows it drilling a clean,
      focused beam straight through a vehicle's frontal glacis or a Terminator's plate with equal
      ease, unlike the Imperium lascannon's brute-force burn.
    design: >-
      Held exactly at framework.md's own Aeldari anchor: "its focused beam penetrates any armour
      to the same depth, so give it a high armour divisor (10) and moderate damage: about
      6dx4(10) burn." Checked with the exact dice distribution against both tables: average 84
      damage under divisor (10) gives an effective DR that never exceeds 35 against anything on
      either the personal-armour or the AV10-14 vehicle tables, so it penetrates every target in
      this file's tables at 99.9%+, including a Terminator (DR 200, effective 20) and a Land
      Raider's frontal glacis (AV14, DR 350, effective 35) — precisely the anchor's own claim
      that it "penetrates any armour to the same depth," where the Imperium lascannon (divisor 5,
      moderate at best against the lightest AVs) has to rely on raw damage instead.
      Handling: 28 lb loaded, lighter than the Imperium Lascannon's 80 lb for the same Aeldari
      construction advantage every weapon in this file carries, giving min ST 13 (√(10×28)≈16.7,
      reduced for the lighter focusing crystal housing, well under the Lascannon's mounted ST
      12M): built to be genuinely shoulder-fired by an Autarch or Exarch rather than requiring a
      vehicle mount, matching its occasional depiction as a personal weapon in the lore. Acc 9
      (below the Lascannon's Acc 14 — a shoulder weapon's sights, not a vehicle fire-control
      system) and a long 1200/3600 range fit its role as a precision anti-armour weapon; RoF 1 and
      Rcl 1 (a beam weapon, capacitor-cycle-limited) and Shots 6(6), Bulk -7 round out a genuine
      heavy weapon that is nonetheless man-portable.

  # ---------------------------------------------------------------- Reaper launcher

  - name: Reaper Launcher
    tl: "10^"
    lc: 0
    cost: 4500
    weight: 22
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Starswarm missile (anti-personnel)
        damage: 3d cr ex [6d cut]
        acc: 4
        range: 150/600
        rof: 1
        shots: 4(4)
        st: 12
        bulk: -6
        rcl: 1
        skill: Gunner (Rockets)
      - usage: Starshot missile (anti-armour)
        damage: 6dx6(3) cr ex
        acc: 4
        range: 150/600
        rof: 1
        shots: 4(4)
        st: 12
        bulk: -6
        rcl: 1
        skill: Gunner (Rockets)
        notes: >-
          Shaped-charge anti-armour warhead with a tiny (roughly 1-yard) blast radius, built for
          a single hard target rather than an area effect — the same "cr ex plus armour divisor"
          logic as the Imperium's own anti-tank ordnance, at a step up from the hand-thrown Krak
          Grenade to match a guided missile's bigger warhead.
    lore: >-
      The Dark Reaper's signature twin-linked launcher, firing a mix of starswarm anti-personnel
      warheads and starshot anti-armour warheads from the same drum; Codex: Craftworlds and Path
      of the Eldar consistently show Dark Reaper squads breaking infantry blobs and cracking
      light vehicles alike, switching warheads between targets in the same engagement.
    design: >-
      No single framework anchor covers a twin-warhead launcher, so each round is built from the
      nearest matching Imperium ordnance rather than invented from nothing, exactly the way the
      Grenade Launcher in grenades.yaml reuses its own hand-thrown warheads' damage lines.
      Starswarm keeps the Imperium Frag Grenade's own damage (3d cr ex [6d cut]) unchanged — the
      anti-personnel principle (concussion plus a fragmentation cloud) doesn't need reinventing
      for an Aeldari warhead, only the delivery system does. Starshot is built one step up from
      the Imperium Krak Grenade's armour-divisor logic to a missile-sized warhead, landing
      exactly on the framework's own Krak Missile anchor (6dx6(3) cr ex): checked with the exact dice
      distribution, average 126 damage penetrates flak through Astartes power armour at 100% and
      a Terminator (DR 200, effective 66.7) 99.0% of the time; against the vehicle AV table it
      is "reliable" against AV12-13 (99.0%/90.4%) and about two in three against AV14 (63.7%) —
      matching the Krak Missile anchor's own stated behaviour word for word, which is the honest
      reason the two entries land on identical dice: a guided Aeldari anti-tank rocket and an
      Imperial anti-tank rocket warhead should do comparable damage, and framework.md already
      fixes what that damage is.
      Handling: 22 lb loaded and min ST 12 puts it in Dark Reaper territory (a heavy Aspect
      Warrior in bulkier armour, per the assignment's own Dark Reaper heavy-Aspect-armour note),
      lighter than the Imperium's own Grenade Launcher-class weapons scaled to missile size. RoF 1
      and Shots 4(4) (a compact twin-linked drum, one missile fired and chambered at a time) and
      Acc 4, Bulk -6, Rcl 1 are new derivations for a genuinely shoulder-fired guided-missile
      launcher, not copied from either warhead's own thrown-grenade cousin.

  # ---------------------------------------------------------------- Deathspinner

  - name: Deathspinner
    tl: "10^"
    lc: 0
    cost: 2800
    weight: 9
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 3d(3) cut
        acc: 3
        range: 40/120
        rof: 8
        shots: 100(5)
        st: 8
        bulk: -4
        rcl: 1
        skill: Guns (Rifle)
        notes: >-
          Fires a spool of monomolecular filament rather than solid discs. A target the filament
          wraps (any hit that fails to do enough damage to drop the target still tangles them) is
          Entangled (B428, no roll to escape needed to avoid further wraps): each turn spent
          fighting the filament while entangled inflicts 1d(3) cut automatically as the wire
          saws deeper, with no attack roll required, until cut or burned free.
    lore: >-
      The Warp Spider Aspect Warrior's own weapon: a device that spins out a near-invisible
      thread of monomolecular filament rather than firing solid shuriken discs, built to snare and
      shred rather than to punch through armour outright. Codex: Craftworlds background
      describes it as slicing anything that struggles
      against it and being more feared for what it does to a trapped target over time than for
      any single hit.
    design: >-
      No framework anchor covers a wire weapon, so this is built independently: the shuriken
      catapult's own (3) armour divisor is kept (still a monomolecular cutting edge, just spooled
      out as thread rather than launched as discs) but the base dice are cut to 3d — a thin wire
      carries far less kinetic energy per contact than a solid shuriken disc — while the actual
      threat is modelled as an entangle-and-bleed effect rather than a single hard-hitting shot,
      matching the lore's own framing. Checked by exact dice distribution: 3d(3) averages 10.5 and
      penetrates flak (DR 30, effective 10) 50% of the time on the initial hit but rounds to 0%
      against carapace (DR 70, effective 23.3) or heavier — the entangle-and-bleed follow-up,
      not the launching shot, is this weapon's real lethality against anything better-armoured
      than flak, the same "the follow-up carries the real threat" design already used for the
      Imperium flame-weapon family in flame.yaml.
      Handling: 9 lb loaded for the spool mechanism and reel motor; min ST 8 (√(10×9)≈9.5,
      trimmed by one for a lighter Aeldari housing) is unchanged from a rifle-class weapon of
      this weight. RoF 8 and Rcl 1 (near-recoilless, the spool has no real launch charge) and
      Shots 100(5), a long single reel rather than discrete rounds; Acc 3 and a short 40/120 range
      fit a snare weapon meant for close-in ambush work, not long-range engagement, and Bulk -4
      matches an ordinary rifle-class frame.

  # ---------------------------------------------------------------- D-weapons

  - name: Wraithcannon
    tl: "12^"
    lc: 0
    cost: 40000
    weight: 34
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Standard
        damage: 6dx10(10) burn
        acc: 4
        range: 40/120
        rof: 1
        shots: 1(15)
        st: 18M
        bulk: -7
        rcl: 1
        skill: Beam Weapons (Rifle)
        notes: >-
          A D-weapon: the shot tears a rift into the warp around the point of impact rather than
          simply burning or blasting it, per framework.md's "build as an honest special effect
          with extreme damage, short range" instruction. On a penetrating hit the GM may rule the
          wound cannot be regenerated, healed by anything short of the most drastic means, or (for
          a killing blow) that nothing recognisable of the target is left to recover at all — a
          narrative special effect layered on top of the damage roll, not a separate numeric rule.
    notes: >-
      On an activation critical failure, the wielder (and anyone adjacent, GM's discretion) risks
      the rift briefly opening the wrong way; treat as an unusually harsh Perils of the Warp
      check for a non-psyker (a straight HT-4 roll) rather than a guaranteed casualty — the
      weapon is dangerous specifically because it borrows the warp's own violence, not because
      Wraithguard are careless with it.
    lore: >-
      Carried by Wraithguard, the wraithcannon tears its target apart at a sub-atomic level by
      briefly opening a rift into the warp itself; Codex: Craftworlds background is explicit that
      a hit leaves nothing recognisable behind, and Black Library's Aeldari-focused fiction
      treats it as one of the single most feared
      weapons in the setting specifically because it kills through warp violence rather than
      conventional force, at the price of a very short effective range.
    design: >-
      framework.md's own instruction for D-weapons is to "build as an honest special effect with
      extreme damage, short range" rather than deriving one from any existing anchor, so this
      entry does exactly that: a massive 6dx10(10) burn figure (average 210) that clears every
      DR on both the personal-armour and AV10-14 tables at 100% by exact dice distribution — even
      a Terminator (DR 200, effective 20) or a Land Raider's frontal glacis (AV14, DR 350,
      effective 35) cannot resist it in any meaningful number of hits — paired with a genuinely
      short 40/120 range band, so the weapon's lethality is bought entirely at the cost of reach,
      never at the cost of raw stopping power, matching "leaves nothing recognisable" and "much
      feared" without exception. The warp-rift special effect (irreversible wounds, a killing
      blow leaving no body) is written as flavour text layered on the damage roll, the same
      approach this project already takes for the Force Sword's ignores-DR Force Strike line and
      the Null Rod's anti-psychic field — a mechanic GURPS's own damage system cannot literally
      encode gets written as an honest GM-adjudicated rule instead of a fabricated numeric bonus.
      Handling: 34 lb and min ST 18M (√(10×34)≈18.4) reflects a weapon built into a Wraithguard's
      own massive wraith-construct chassis rather than a human- or Aeldari-scale arm — it is
      listed here as a stocked armoury item (for Wraithblade/Wraithguard squads and the rare
      relic carried by a living Aeldari) rather than assuming a living wielder, hence the mounted
      "M" and the heavy ST figure despite the weapon's otherwise-modest weight. RoF 1 and a very
      slow 1(15) shot/recharge reflect a warp-rift weapon that cannot be fired rapidly by its own
      nature, not a magazine limitation; Bulk -7 and Rcl 1 (a beam-class weapon, no recoil) round
      out the entry.

  - name: D-scythe
    tl: "12^"
    lc: 0
    cost: 32000
    weight: 30
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Cone attack (8 yards)
        damage: 4dx10(10) burn
        range: 8
        shots: 3(15)
        st: 16M
        bulk: -7
        skill: Beam Weapons (Rifle)
        notes: >-
          No Acc bonus applies and no aiming roll is needed against a target inside the cone
          (B412), per the same convention as the Imperium flame-weapon family. The same warp-rift
          special effect as the Wraithcannon applies to anything the cone kills outright.
    lore: >-
      The Wraithblade's close-assault D-weapon: rather than the Wraithcannon's single focused
      bolt, the D-scythe opens its warp-rift effect as a short cone, gutting everything in front
      of the wielder at once. Codex: Craftworlds background places it specifically on
      Wraithblades built for melee-range work rather than the Wraithguard's longer-ranged
      Wraithcannon, trading range for the ability to hit several targets in one blast.
    design: >-
      Built as a cone-attack cousin of the Wraithcannon rather than as its own anchor, the same
      relationship the Imperium Heavy Flamer has to the Flamer: two dice down from the
      Wraithcannon's 6d for a genuinely short 8-yard cone rather than a single aimed shot, keeping
      the same x10 multiplier and (10) armour divisor since it is the identical warp-rift
      mechanism, just delivered as an area effect. Checked with the exact dice distribution: 4dx10
      averages 140 and still clears every DR on the personal-armour and AV10-14 tables outright at
      100%, exactly as devastating per hit as the Wraithcannon within its much shorter reach — a
      Wraithblade trades the Wraithguard's range for hitting an entire enemy line at once.
      Handling: 30 lb and min ST 16M, slightly lighter and easier to bear than the Wraithcannon's
      own figures since the cone-emitter housing is more compact than a focused-bolt weapon's
      full lance assembly; no Acc, RoF or Rcl figures apply to a cone attack per B412, matching
      every cone weapon in flame.yaml. Shots 3(15), a shorter charge run than the Wraithcannon's
      single-shot figure since each activation only opens the rift briefly rather than sustaining
      a bolt, and Bulk -7 is unchanged.

  # ---------------------------------------------------------------- Grenades

  - name: Plasma Grenade, Aeldari Pattern
    tl: "11^"
    lc: 0
    cost: 1400
    weight: 1.5
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Thrown
        damage: 3dx4(3) burn ex
        skill: Throwing
    lore: >-
      A hand-thrown plasma charge occasionally carried by Aeldari raiding parties and Harlequin
      troupes wanting a burst of anti-armour firepower without a starcannon's bulk; a minor item
      that Codex background does not single out (with no specific rules entry cited), since it favours the fusion gun and
      starcannon as the faction's dedicated anti-armour tools.
    design: >-
      Built independently from the Starcannon's own plasma-class dice, not copied from the
      Imperium's Plasma Grenade entry in grenades.yaml even though the two land on the same
      numbers: half the Starcannon anchor's 6d at the same x4 multiplier and (3) divisor, the
      identical "half the parent weapon's dice, same multiplier and divisor" relationship the
      Imperium entry uses against its own Plasma Gun. Checked by exact dice distribution: average
      42 damage clears carapace (DR 70, effective 23.3) 95.4% of the time, Sororitas plate
      (DR 85, effective 28.3) 83.8%, and Astartes power armour (DR 100, effective 33.3) 74.1% of
      the time — a rare grenade dangerous even to a Space Marine, exactly matching plasma's role
      throughout this project as the one small-arms-scale family that reliably threatens power
      armour.
      Handling: 1.5 lb, half a pound over the Imperium version for a bulkier Aeldari containment
      shell around the same charge; no Acc/RoF/ST/Bulk/Rcl figures apply to a hand-thrown weapon,
      per the same schema the Imperium grenades use.

  - name: Hawk Grenade Pack
    tl: "11^"
    lc: 0
    cost: 4200
    weight: 4.5
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Dropped or thrown plasma grenade
        damage: 3dx4(3) burn ex
        skill: Throwing
        notes: >-
          Three grenades in the pack, each the Aeldari Plasma Grenade's own damage. A Swooping
          Hawk drops one in flight on a target beneath them, at no extra penalty for being
          airborne; it is purchased instead of separate plasma grenades because the pack lets the
          wearer release them one-handed in a single Ready.
    lore: >-
      The Swooping Hawk's grenade pack: a harness of plasma grenades dropped onto a foe from
      above as the Hawk swoops past (Codex: Craftworlds Swooping Hawk wargear; moderate
      confidence).
    design: >-
      Built from the Aeldari Plasma Grenade above (3dx4(3) burn ex, so all its penetration
      figures apply) rather than a new weapon; the pack is only the housing, 3 grenades at
      1.5 lb each with a 0 lb release rack (4.5 lb), priced at three grenades ($1400 each) plus a
      little for the rack.

  - name: Haywire Grenade, Aeldari Pattern
    tl: "10^"
    lc: 0
    cost: 400
    weight: 1
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: EMP burst
        damage: spec
        skill: Throwing
        notes: >-
          No effect on living flesh. Vehicles, robots and servitors within 2 yards have all
          active systems disabled for 2d turns unless the GM rules the target is shielded — the
          identical effect to the Imperium's own Haywire Grenade, since both charges disrupt the
          same thing (electronic and mechanical systems) by the same principle regardless of who
          built the coil.
    lore: >-
      Aeldari raiding forces, especially Harlequin troupes and Corsairs boarding a target vessel
      or facility, carry haywire charges of their own for exactly the reason Imperial tank-hunter
      teams do — disabling armoured vehicles, servitors and automated defences without a direct
      firefight; it sits alongside the plasma grenade above for precisely this niche (no specific
      rules entry is cited).
    design: >-
      Deals no HP damage, modelled purely as a systems-disable effect exactly like the Imperium
      Haywire Grenade in grenades.yaml — the underlying principle (an electromagnetic pulse
      against active electronics) doesn't change with who assembled the coil, so this entry
      reuses that design logic rather than inventing a distinct Aeldari mechanic where none is
      attested in the lore. Weight and cost are set slightly below the Imperium item (denser
      Aeldari coil-work), the only real point of difference.

  # ---------------------------------------------------------------- Singing spear (thrown mode)

  - include: "xenos/aeldari/wargear/melee.yaml#Singing Spear"

  # ---------------------------------------------------------------- Mandiblasters

  - name: Mandiblasters
    tl: "10^"
    lc: 0
    cost: 1800
    weight: 0
    tags: [Missile Weapon, Xenos, Aeldari]
    weapons:
      - usage: Bite (built into helmet, reach C only)
        damage: thr-2 pi
        acc: 0
        range: C
        rof: 1
        shots: "6(0)"
        st: 11
        bulk: -1
        rcl: 1
        skill: Guns (Pistol)
        notes: >-
          Fires automatically as a free action whenever the wearer lands a successful unarmed or
          close-combat attack against a target at reach C, representing the helmet's mandible-
          like stingers lunging in alongside the strike rather than being aimed and fired in their
          own right; the listed skill/Acc/RoF/St line exists only so the build tool has a weapon
          block to attach the toxin follow-up to. A target hit must roll HT or take 1d toxic
          damage (ignores DR) and be Stunned (B420) for 1 turn as the neurotoxin takes hold; a
          second hit in the same fight forces the HT roll at a cumulative -1.
    lore: >-
      Built into the war-mask of every Striking Scorpion Aspect Warrior, mandiblasters are short,
      insect-like stinger mechanisms that lash out and inject a fast-acting neurotoxin the instant
      a Scorpion closes to melee range; Codex: Craftworlds background is consistent that this is
      what lets a Striking Scorpion drop even a well-armoured, unsuspecting target in one
      ambush strike, and it is treated throughout as a close-range shock effect rather than a
      raw-damage weapon.
    design: >-
      Framework.md gives no Aeldari anchor for a built-in helmet stinger, so this is built from
      GURPS's own toxic-attack and affliction conventions rather than any weapon's damage dice:
      the direct physical bite is deliberately negligible (thr-2 pi, checked by exact dice
      distribution to do essentially nothing against flak or better — this was never meant to be
      a wounding attack in its own right) and the actual lethality is the DR-ignoring toxin
      follow-up and its Stun effect, the same "the follow-up carries the real threat" logic this
      file already applies to the Deathspinner and this project applies to the Imperium flame
      family. Modelling it as an automatic, no-roll-of-its-own trigger on a successful melee hit
      (rather than a weapon the wearer aims and fires) matches the lore's description of the
      mandibles lunging in "alongside" a Scorpion's blade strike, not as a separate attack a
      player declares.
      Handling: weight 0 (it is part of the war-mask, already accounted for in the helmet's own
      listing) and the weapon-block fields (ST 11, matching an Aspect Warrior's own ST; Bulk -1;
      Rcl 1; Shots 6(0), a limited number of stings before the toxin reservoir needs replacing at
      an armoury, no field reload) exist only to give the build tool a place to attach the toxin
      note, per the schema's requirement that a `weapons` entry carry handling fields.
