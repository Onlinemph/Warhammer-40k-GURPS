kind: equipment
output: Xenos/Aeldari/Weapons/Aeldari Melee Weapons.eqp
items:

  - name: Power Sword, Aeldari Pattern
    tl: "11^"
    lc: 0
    cost: 6000
    weight: 3
    tags: [Melee Weapon, Xenos, Aeldari]
    weapons:
      - usage: Field on
        damage: sw+3d+1(10) cut
        reach: "1"
        parry: 0
        st: 9
        skill: Broadsword
      - usage: Field off
        damage: sw+1 cut
        reach: "1"
        parry: 0
        st: 9
        skill: Broadsword
    notes: >-
      Field-on line carries armour divisor (10) in its damage string, per the framework's power-field rule.
    lore: >-
      Carried by Autarchs, Exarchs and Aeldari of high standing, the Aeldari power sword uses the
      same disruption-field principle as the Imperium power sword but in a far lighter, more
      elegant blade; Codex: Craftworlds and Path of the Eldar depict it as an Autarch's personal
      weapon of choice; in what it does to armour it is the equal of a human power sword, just
      built for a slighter hand.
    design: >-
      Built on the framework's power-field rule exactly as the Imperium Power Sword is: field on
      adds +3d over the mundane field-off baseline at armour divisor (10) ("bladed power weapons
      add +3d over the mundane weapon"). The mundane baseline is sw+1 cut, matching the Imperium
      Power Sword's own field-off line (a disruption field doesn't care about the blade's mass,
      only its edge), so field-on is sw+3d+1(10) cut, the same as the Imperium entry's line.
      Checked with the exact dice distribution at an Aspect Warrior's own ST 11 (sw = 1d+1, giving
      a full field-on roll of 4d+2(10)): average 16 damage penetrates flak, carapace and
      Sororitas plate essentially every time (100%/99.6%/98.8%) and Astartes power armour (DR
      100, effective 10) 94.6% of the time — an Aeldari power sword genuinely can cut down a
      Space Marine, matching the anchor's "shears power armour" line — but only 9.7% of the time
      against a Terminator (DR 200, effective 20), well below what the same weapon does in an
      Astartes's own ST 30 hands (94%+), since the field's own divisor is identical but an
      Aeldari's lighter swing puts far less raw dice behind it. This is the honest cost of a
      lighter, human/Aeldari-scale wielder using an armour divisor (10) weapon, not a weaker
      field.
      Handling: 3 lb, a full pound lighter than the Imperium Power Sword's 4 lb for a slighter,
      wraithbone-hilted blade; min ST 9 (below the Imperium weapon's ST 10, matching the
      framework's "built for Aeldari hands (ST 10-11)" note) still leaves it usable one-handed at
      an Aspect Warrior's own ST 11 with no penalty. Reach 1 and parry 0 (Broadsword, a guarded
      blade) are unchanged from the Imperium anchor — nothing in the lore calls for those to
      differ.

  - name: Chainsword, Aeldari Pattern ("Scorpion Chainsword")
    tl: "10^"
    lc: 0
    cost: 2200
    weight: 4
    tags: [Melee Weapon, Xenos, Aeldari]
    weapons:
      - usage: Swing
        damage: sw+2d(2) cut
        reach: "1"
        parry: 0
        st: 8
        skill: Broadsword
    lore: >-
      The Striking Scorpion Aspect Warrior's signature blade: a chainsword built along the same
      motorised-tooth-edge principle as the Imperium's chainsword, but lighter and quieter, meant
      for an ambush predator who closes in near-silence rather than the Imperium weapon's
      grinding roar. Codex: Craftworlds background specifically calls out the Scorpion's blade as
      quieter than a human chainsword; the mechanism and lethality it describes are otherwise the
      same motorised-tooth cutting edge.
    design: >-
      Held at the Imperium Chainsword's own anchor dice (sw+2d(2) cut) rather than invented from
      scratch — the lore is explicit that this is the same grinding-tooth-edge mechanism, only
      quieter and lighter-built, so the wounding mechanism (and its (2) armour divisor for the
      motorised edge) is unchanged; what's genuinely different is the housing, and that's where
      every handling figure below is re-derived from. Checked with the exact dice distribution at
      an Aspect Warrior's own ST 11 (sw = 1d+1, giving a full swing of 3d+1(2)): average 11.5
      damage penetrates flak (DR 30, effective 15) 9.3% of the time and rounds to 0% against
      carapace or better — a real if uncommon threat to flak-armoured infantry and no threat at
      all to rigid plate, matching "tears flesh and flak; bites carapace; skids off power armour"
      from the framework's chainsword anchor, at the lower end since an Aspect Warrior's ST 11
      swing carries less force than a human's typical ST 10-13 or an Astartes's ST 30.
      Handling: 4 lb, two pounds under the Imperium Chainsword's 6 lb for a genuinely quieter,
      lighter motor and edge, per the lore's own "quieter" claim (a smaller motor is also a
      lighter one); min ST 8 (below the Imperium weapon's ST 9, matching the framework's Aeldari
      ST 10-11 note). Reach 1 and parry 0 are unchanged, the same Broadsword-class figures the
      Imperium Chainsword uses.

  - name: Biting Blade
    tl: "10^"
    lc: 0
    cost: 1600
    weight: 2.5
    tags: [Melee Weapon, Xenos, Aeldari]
    weapons:
      - usage: Swing
        damage: sw+1d+1(2) cut
        reach: "1"
        parry: 0
        st: 7
        skill: Broadsword
    lore: >-
      A shorter, faster chain-edged sidearm carried by some Striking Scorpions alongside their
      full scorpion chainsword, and occasionally by other Aspect Warriors who favour speed over
      reach; the Codex: Craftworlds background describes it as a lighter cousin of the scorpion
      chainsword, and "biting blade" is used here as its descriptive label. It is the weapon
      the Scorpion's Claw (below) is paired with on a Scorpion Exarch, and is not a named Codex
      weapon in its own right.
    design: >-
      One die down from the Scorpion Chainsword above (sw+1d+1(2) cut vs. sw+2d(2) cut), the same
      "shorter, lighter blade, same motorised-edge divisor" relationship the Imperium Combat Knife
      has to a full sword — a real chain-edge, just a smaller one, so the (2) divisor carries
      over unchanged. Checked by exact dice distribution at ST 11 (sw = 1d+1, giving 2d+2(2)):
      average 9 damage rounds to 0% against flak (DR 30, effective 15) or anything heavier — a
      fast, close-in finishing weapon that adds real damage to an unarmoured target in a flurry of
      blows but is not expected to threaten armour at all on its own, unlike the full chainsword's
      occasional flak penetration.
      Handling: 2.5 lb and min ST 7, both under the biting blade's parent weapon, for a shorter
      blade and a smaller motor housing sized for a fast side-arm rather than a primary weapon.
      Reach 1 and parry 0 are unchanged, the same Broadsword-class figures as the full chainsword.

  - name: Diresword
    tl: "11^"
    lc: 0
    cost: 15000
    weight: 3.5
    tags: [Melee Weapon, Xenos, Aeldari]
    weapons:
      - usage: Field on
        damage: sw+3d+2(10) cut
        reach: "1"
        parry: 0
        st: 10
        skill: Broadsword
      - usage: Field off
        damage: sw+2 cut
        reach: "1"
        parry: 0
        st: 10
        skill: Broadsword
    notes: >-
      Field-on line carries armour divisor (10). A diresword holds a captured, malevolent soul
      bound into its blade rather than being psychically channelled by its wielder — it is not a
      force weapon and grants no Force Strike line, but the GM may rule its bound soul reacts of
      its own accord in extremity (whispering, resisting an unworthy hand, or the like) as a
      narrative effect rather than a numeric one.
    lore: >-
      An Exarch-only relic weapon, most associated with the Dire Avenger Exarch, that has a
      soul — sometimes willing, sometimes a defeated enemy's, accounts differ — bound into the
      blade at its forging; Codex: Craftworlds background and Path of the Eldar are consistent
      that a diresword is exceptionally dangerous and individually unique per weapon, distinct
      from an ordinary Exarch power weapon, though exactly whose soul and by what rite varies
      between sources and isn't settled here as a single canonical answer.
    design: >-
      Built as an Exarch-grade power weapon one step above the standard Aeldari Power Sword: a
      heavier mundane baseline (sw+2 cut, matching the framework's Power Axe-class step up from a
      plain blade) with the same +3d/divisor(10) power-field math, landing on sw+3d+2(10) cut
      field on. Checked with the exact dice distribution at an Exarch's own
      ST 12 (sw = 1d+2, giving a full field-on roll of 4d+4(10)): average 18 damage penetrates
      flak/carapace/Sororitas at 100%/100%/99.9% and Astartes power armour (DR 100, effective 10)
      98.8% of the time, and even a Terminator (DR 200, effective 20) 23.9% - a genuine step above
      the standard Power Sword's own 94.6%/9.7% figures against the same two targets, matching an
      Exarch's greater strength and a relic weapon's greater menace without inventing a soul-bound
      damage bonus GURPS has no field for. The bound-soul lore element is deliberately left as a
      GM-adjudicated narrative note rather than a numeric bonus, the same honest choice this
      project already makes for the Null Rod and the Wraithcannon's warp-rift effect, since
      nothing in the sources gives it a consistent, quantifiable mechanical effect.
      Handling: 3.5 lb and min ST 10, both a half-step over the standard Power Sword to match the
      heavier mundane blade it's built from; reach 1 and parry 0 are unchanged.

