    notes: Field-on line carries armour divisor (10).
    lore: >-
      The Howling Banshee Exarch's own relic weapon: a long, two-handed power blade granted to an
      Exarch who has led their shrine long enough to earn it. Codex: Craftworlds background frames
      it as a badge of the Exarch's mastery of the Path of the Warrior as much as a weapon, wielded
      two-handed for a heavier, more decisive blow than a Banshee's own one-handed power sword.
    design: >-
      Built as a two-handed relic step above the Diresword: the same Exarch-grade mundane
      baseline pushed one class heavier for a two-handed blade (sw+3 cut, the framework's
      Eviscerator-class two-handed baseline) plus the standard +3d/divisor(10) power-field math,
      landing on sw+3d+3(10) cut field on.
      Checked with the exact dice distribution at an Exarch's own ST 12 (sw = 1d+2, giving a full
      field-on roll of 4d+5(10)): average 19 damage clears flak/carapace/Sororitas at 100% and
      Astartes power armour (DR 100, effective 10) 99.6% of the time, and a Terminator (DR 200,
      effective 20) 33.6% - the hardest-hitting Aeldari melee weapon in this file against a
      Terminator (tied with the Star Glaive on damage), matching its status as the Howling
      Banshee Exarch's signature relic rather than a rank-and-file weapon.
      Handling: 8 lb and min ST 11 for a genuine two-handed blade, per the Imperium Eviscerator's
      own two-handed weight class scaled down for lighter Aeldari construction; Two-Handed Sword
      skill and parry -1 (unbalanced by its own length and two-handed grip, the standard GURPS
      penalty for a long two-handed blade) and reach 1,2 reflect the longer weapon directly.

  - name: Mirrorswords (pair)
    tl: "11^"
    lc: 0
    cost: 14000
    weight: 5
    tags: [Melee Weapon, Xenos, Aeldari]
    weapons:
      - usage: Field on, each blade
        damage: sw+3d+1(10) cut
        reach: "1"
        parry: 0
        st: 8
        skill: Broadsword
      - usage: Field off, each blade
        damage: sw+1 cut
        reach: "1"
        parry: 0
        st: 8
        skill: Broadsword
    notes: >-
      Field-on line carries armour divisor (10). Fought as a matched pair (GURPS Basic's Dual-
      Weapon Attack, B417): a Howling Banshee Exarch attacks with both blades, and their mirror-
      bright finish is part of the Banshee's own disorienting fighting style, alongside the
      Banshee mask below.
    lore: >-
      The Howling Banshee Exarch's relic weapon: two matched, mirror-polished power blades fought
      one in each hand rather than a single sword; Codex: Craftworlds background describes the
      dazzling, disorienting flicker of the paired blades as part of the Banshee's whole fighting
      art alongside the scream of their war-mask, meant to unnerve a foe as much as to cut them.
    design: >-
      Each blade is built exactly like the standard Aeldari Power Sword above (sw+3d+1(10) cut field
      on, sw+1 cut field off) rather than inventing a heavier or lighter relic figure for it — the
      lore singles out the pairing and the mirror finish as what makes this weapon distinct, not a
      different edge or field strength, so duplicating the Power Sword's own already-checked
      figures (94.6% vs. Astartes plate, 9.7% vs. a Terminator, per blade, at an Aspect Warrior's
      ST 11) is the honest build here rather than a cosmetic doubling of damage. What actually
      makes the pair dangerous in play is Dual-Weapon Attack (B417) letting the Exarch land two
      such hits in one turn, which the build tool has no separate field for and is instead called
      out directly in `notes`.
      Handling: 5 lb for the pair (2.5 lb each, half a pound lighter per blade than the standard
      Power Sword for a slimmer, purely offensive relic profile with no cross-guard); min ST 8 per
      blade, one point under the standard Power Sword, reflecting a weapon balanced for speed in
      each hand rather than a single two-handed grip. Reach 1 and parry 0 per blade are unchanged.

