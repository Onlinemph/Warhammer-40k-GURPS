    design: >-
      The Imperium Power Fist's own damage (thr+8d(10) cr, the framework's power-fist anchor),
      made lighter (12 lb against 40 lb) and less demanding (ST 12, for an Exarch's own ST 12)
      because it is wraithbone and psychoplastic rather than servo-driven Astartes plate; a power
      fist's damage comes from the field and not the mass, so the dice stay. At ST 12 (thr = 1d-1)
      the full roll is 9d-1(10) (average 30): well above the 10 damage needed to beat Astartes
      power armour at effective DR 10, so a claw hit is a kill against nearly anything short of a
      Terminator. Field-off is a plain gauntlet punch at thr+2 cr. Parry -2 as for the Imperium
      power fist.

  - name: Banshee War-Mask
    tl: "10^"
    lc: 0
    cost: 2000
    weight: 2
    tags: [Xenos, Aeldari]
    dr: {"skull,face": 60, "eye": 30}
    weak_points: 4
    notes: >-
      Once per fight (or once per encounter at the GM's discretion, to avoid it becoming a
      spammable stun-lock), the wearer may loose the Banshee's keening war-scream as a free
      action against everyone within 5 yards who can hear it and isn't deafened, in place of an
      attack that turn: each target must roll HT or be Stunned (B420) for 1 turn and suffer -2 to
      active defences against the Howling Banshee's own next attack that same turn. Wearing the
      mask grants no bonus to the wearer's own attacks — its entire effect is on those who hear
      it.
    lore: >-
      Every Howling Banshee Aspect Warrior wears a war-mask that amplifies their own killing
      scream into a psychologically (and, background suggests, subtly psychically) disorienting
      shriek, loosed as the Banshees charge; Codex: Craftworlds background is explicit that the
      scream itself, not just the blade, is what makes a Banshee assault so devastating in the
      opening seconds of an engagement, and it is a constant visual and narrative element of
      Howling Banshee depictions throughout the fiction.
    design: >-
      Modelled as a helmet-format piece of armour (DR 60 on skull and face, eye lenses 30 as with any helmet
      lens, between the standard Aspect Armour's own helmet coverage and a full Exarch helm, since a Banshee mask is
      described as protective as well as ceremonial) carrying an Affliction-style stun effect
      exactly like the Imperium Stun Grenade's own HT-roll-plus-Stun mechanic, rather than a coded
      numeric bonus — the same honest choice this project makes whenever a lore effect (a scream,
      a scent, a light) doesn't map onto a GURPS damage or defence roll directly. Limiting it to
      once per fight and pairing it with an explicit defence penalty on the Banshee's own
      follow-up attack (rather than a flat, repeatable stun-lock) keeps it from trivialising
      every fight it appears in, matching the lore's own framing of the scream as an opening shock
      rather than a weapon a Banshee can lean on indefinitely.
      Handling: 2 lb and Weak Points 4, matching the standard Aspect Armour helmet's own rating in
      armour.yaml (a Banshee's mask is built to the same Aspect-armour standard as any other
      Aspect Warrior's helm, the scream generator being an addition to it, not a replacement for
      its protection).
