    design: >-
      Built as an Exarch-grade relic exactly like the Diresword above but on a long haft instead
      of a hand-and-a-half blade: the same heavier sw+2 cut mundane baseline and +3d/divisor(10)
      power-field math (landing on sw+3d+2(10) cut field on), reusing the Diresword's own
      penetration figures at Exarch ST 12 (98.8% vs. Astartes plate, 23.9% vs. a Terminator)
      rather than inventing new dice for what is mechanically the same power field on a different
      haft. Polearm skill and reach 1,2 (rather than the Diresword's Broadsword/reach 1) are the
      actual point of difference: a glaive fights at a step of distance a sword cannot.
      Handling: 9 lb and min ST 10, heavier than the one-handed Diresword for the long haft but
      lighter than the two-handed Executioner (which carries a full blade's mass, not a glaive's
      light head); parry 0 (Polearm's own convention for a glaive rather than a swung axe/mace
      head, per the Basic Set skill's own defaults) rather than the -1U this project gives axe-
      and-mace-class weapons.

  - name: Witchblade
    tl: "11^"
    lc: 0
    cost: 12000
    weight: 3
    tags: [Melee Weapon, Xenos, Aeldari, Psyker]
    weapons:
      - usage: Field off
        damage: sw+1 cut
        reach: "1"
        parry: 0
        st: 9
        skill: Broadsword
      - usage: Field on
        damage: sw+3d+1(10) cut
        reach: "1"
        parry: 0
        st: 9
        skill: Broadsword
      - usage: Force Strike (charged, vs. Warp-touched)
        damage: sw+3d+1 cut (ignores DR)
        notes: >-
          Add +1d per level of Psyker Talent to this line (GCS can't scale it automatically; edit
          the damage on the sheet). Usable only by a psyker (Psyker Talent 1+), field on. Requires
          a Perils of the Warp check per "Psykers and the Warp," though an Aeldari's own runic
          discipline makes that check markedly safer than a human's, per framework.md's Aeldari
          psychic-power note. The ignores-DR component only applies against daemons, Chaos Spawn
          and other Warp-touched creatures — an ordinary flak-armoured foe still only takes the
          field-on line's armour divisor (10).
        reach: "1"
        parry: 0
        st: 9
        skill: Broadsword
    lore: >-
      The witchblade is the Aeldari psyker's own force weapon: carried by Warlocks, Farseers and
      Spiritseers as both badge of office and weapon, letting a trained mind channel psychic force
      directly through the blade exactly as an Imperium force sword does for a Librarian or
      Inquisitor. Codex: Craftworlds background and Path of the Eldar are explicit that a Warlock's
      witchblade is a genuine weapon, not merely a focus, and an Aeldari force weapon does
      just what an Imperium force sword does.
    design: >-
      Built directly on this project's own Force Sword entry in psychic-gear.yaml, per the
      assignment's instruction that witchblades and singing spears follow "the psychic-gear.yaml
      rules": mundane field-off baseline sw+1 cut, field on adds +3d and armour divisor (10), written
      sw+3d+1(10) cut, per the framework's power-field rule, and a Force Strike line that adds the wielder's own
      Psyker Talent level in dice and ignores DR only against Warp-touched targets — identical in
      every particular to the Imperium Force Sword, because both are the same design (a trained
      mind channelling force through a disruption-field blade) built on the same chassis, not two
      different weapons that happen to share numbers. Checked with the exact dice distribution at
      a Farseer's own ST 10 (sw = 1d, giving a full field-on roll of 4d+1(10)): average 15 damage
      penetrates flak/carapace/Sororitas at 100%/98.8%/97.3% and Astartes power armour (DR 100,
      effective 10) 90.3% of the time, and a Terminator (DR 200, effective 20) 5.4% — noticeably
      below the Aspect Warrior-wielded Power Sword's own figures (94.6%/9.7%) because a Farseer's
      ST 10 swing carries less force than an Aspect Warrior's ST 11, an honest consequence of who
      is actually swinging the blade rather than a deliberately weaker weapon.
      Handling: 3 lb and min ST 9, matching the Aeldari Power Sword above almost exactly (one
      pound and one ST point lighter than the Imperium Force Sword's own 4 lb/ST 10, the same
      lighter-construction relationship every weapon in this file carries against its Imperial
      counterpart). Reach 1 and parry 0 (Broadsword) are unchanged.

  - name: Singing Spear
    tl: "11^"
    lc: 0
    cost: 13000
    weight: 4
    tags: [Melee Weapon, Xenos, Aeldari, Psyker]
    weapons:
      - usage: Field off, thrust
        damage: thr+1 imp
        reach: "1,2*"
        parry: "-1"
        st: 9
        skill: Spear
      - usage: Field on, thrust
        damage: thr+3d+1(10) imp
        reach: "1,2*"
        parry: "-1"
        st: 9
        skill: Spear
      - usage: Thrown, field on
        damage: thr+3d+1(10) imp
        acc: 2
        range: 15/40
        rof: 1
        shots: "1(T)"
        st: 9
        bulk: -3
        skill: Spear
        defaults: ["DX-5", "Polearm-4", "Staff-2", "Throwing-3"]
        notes: >-
          The psychic charge follows the spear in flight exactly as it does on a melee thrust; a
          thrown singing spear keeps the field-on figure and armour divisor (10), unlike a mundane
          thrown weapon losing force with distance. Recovering a thrown spear (or attuning a
          fresh one) takes the noted reload; a Farseer or Autarch who throws their singing spear
          is deliberately trading their melee weapon for one decisive ranged strike.
      - usage: Force Strike (charged, vs. Warp-touched)
        damage: thr+3d+1 imp (ignores DR)
        notes: >-
          As Witchblade's Force Strike; +1d per level of Psyker Talent, requires field on and a
          Perils of the Warp check, applies whether thrust or thrown.
        reach: "1,2*"
        parry: "-1"
        st: 9
        skill: Spear
    notes: >-
      Field-on lines carry armour divisor (10).
    lore: >-
      Carried especially by Autarchs and by Farseers who favour a spear over a blade, the singing
      spear is a force weapon built as a thrusting spear rather than a sword, and it is
      consistently depicted able to be thrown as well as fought with in hand — the "sings" in its
      name refers to the keening note the psychically-charged head makes in flight. Path of the
      Eldar and Codex: Craftworlds background both describe Autarchs throwing a singing spear to
      open an engagement before closing with a second weapon.
    design: >-
      Built on the same Force Sword/Witchblade chassis in psychic-gear.yaml as the assignment
      specifies, adapted to a thrusting spear's own thr-based damage instead of a blade's sw-based
      damage, per Basic Set's own Spear entry: mundane field-off thr+1 imp, field on adds +3d and
      armour divisor (10), written thr+3d+1(10) imp, with the identical Force Strike line (Psyker Talent scaling,
      Warp-touched-only ignores-DR) as the Witchblade. The thrown-mode line is the genuinely new
      design element the assignment calls for: rather than following a mundane thrown weapon's
      usual loss of force with range, the psychic field is ruled to travel with the spearhead
      exactly as the melee thrust does, so the thrown line keeps the full field-on figure rather
      than a diminished one — an honest modelling choice given the lore's own "sings in flight"
      framing of a psychically-charged weapon, not a loophole for extra free damage, since it still
      costs the wielder their melee weapon for the throw. Checked with the exact dice distribution
      at an Autarch's own ST 11 (thr = 1d-1, giving a full field-on roll of 4d(10) either thrust
      or thrown): average 14 damage penetrates flak/carapace at 100%/97.3% and Astartes power
      armour (DR 100, effective 10) 84.1% of the time, and a Terminator (DR 200, effective 20)
      2.7% — a strong but slightly lower figure than the Witchblade's own sw-based line, since a
      spear's thrust carries less raw force than a full swing at the same ST, exactly the trade a
      reach weapon makes for its own longer reach and thrown option.
      Handling: 4 lb and min ST 9, a half-step over the Witchblade for the longer haft; reach
      1,2* (the * marking it as usable to Reach 2 only when not adjacent, per the Basic Set Spear
      entry's own convention) and parry -1 are the standard spear-class figures. The thrown line's
      Acc 2, 15/40 range and Bulk -3 are new derivations for a weapon that is a melee weapon first
      and a throwable one second, not a dedicated javelin.

