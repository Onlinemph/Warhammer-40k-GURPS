        st: 10
        skill: Polearm
    notes: Field-on line carries armour divisor (10).
    lore: >-
      A long-hafted power weapon carried by some Aeldari Exarchs and Autarchs who favour reach
      over a sword's speed; a relic option alongside the diresword and executioner, without the
      singular Codex prominence either of those two weapons has (sources here are the Codex:
