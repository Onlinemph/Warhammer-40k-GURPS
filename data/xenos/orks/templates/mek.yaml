kind: template
output: Xenos/Orks/Templates/Ork Mek.gct
notes: >
  A Mek: the Ork instinctive engineer, keeping shootas firing, trukks
  running and the occasional walker lurching forward on belief and scrap
  alone. Built on the standard Boy chassis, not a growth lens — most Meks
  are ordinary-sized Orks whose gift is in the hands and head, not the
  muscle; a GM building a "Big Mek" should add the Growth Lens: Nob from
  Xenos/Orks/Traits/Ork Physiology.adq on top of this template. Point
  math: Ork Physiology 179 + Mek Instinct (level 2) 20 + skills 16 = 215
  points, comfortably inside framework.md's Elite human tier (200-350) —
  a genuine specialist, not just a Boy with a wrench.
traits:
  - include: "xenos/orks/traits.yaml#Ork Physiology"
  - include: "xenos/orks/traits.yaml#Mek Instinct"
    levels: 2
skills:
  - name: Engineer
    spec: (Ork Tech)
    diff: IQ/H
    points: 4
    tags: [Xenos, Orks]
    lore: Designing (in the loosest sense) new Ork contraptions from scrap and scavenge.
    design: IQ+0 (8) for 4 points, Hard; +2 more in practice from Mek Instinct 2.
  - name: Mechanic
    spec: (Ork Tech)
    diff: IQ/A
    points: 4
    tags: [Xenos, Orks]
    lore: Keeping shootas, trukks and walkers running between battles.
    design: IQ+1 (9) for 4 points, Average; +2 more in practice from Mek Instinct 2.
  - name: Armoury
    spec: (Ork Tech)
    diff: IQ/A
    points: 2
    tags: [Xenos, Orks]
    lore: Building and repairing Ork weapons specifically.
    design: IQ+0 (8) for 2 points, Average; +2 more in practice from Mek Instinct 2.
  - name: Explosives
    spec: Demolition
    diff: IQ/A
    points: 2
    tags: [Xenos, Orks]
    lore: Blowing things up is half of Ork engineering.
    design: IQ+0 (8) for 2 points, Average; +2 more in practice from Mek Instinct 2.
  - name: Guns
    spec: Rifle
    diff: DX/E
    points: 2
    tags: [Xenos, Orks]
    lore: A Mek still fights like any other Ork when the wrench isn't enough.
    design: DX+1 (12) for 2 points, Easy.
  - name: Brawling
    diff: DX/E
    points: 1
    tags: [Xenos, Orks]
    lore: See the Ork Boy template.
    design: DX+0 (11) for 1 point, Easy.
  - name: Scrounging
    diff: Per/E
    points: 1
    tags: [Xenos, Orks]
    lore: A Mek is always hunting for the one part that will make the next contraption work.
    design: Per+0 (8) for 1 point, Easy.
