kind: template
output: Xenos/Orks/Templates/Ork Kommando.gct
notes: >
  An Ork Kommando: the rare Ork who has actually learned patience,
  camouflage and demolitions — Ork special forces, built on the standard
  Boy chassis with a stealth/sabotage skill package instead of a Boy's
  straightforward brawl-and-shoot kit. Point math: Ork Physiology 179 +
  skills 28 = 207 points, inside framework.md's Elite human tier
  (200-350). Enable the Stormboy lens below (disabled by default) to build
  a Stormboy instead: a Kommando-adjacent specialist who straps a crude
  rokkit pack on and jumps into the fight from above, at the cost of
  occasionally not landing where, or how, intended.
traits:
  - include: "xenos/orks/traits.yaml#Ork Physiology"
  - name: "Lens: Stormboy Rokkit Pack"
    container: group
    disabled: true
    tags: [Xenos, Orks]
    lore: >
      Stormboyz strap a crude, Mek-built rokkit pack to their backs and
      launch themselves at the enemy from height — a spectacular, popular
      and genuinely dangerous way to get into a fight fast, since the packs
      are exactly as reliable as the rest of Ork technology.
    design: Net 7 points; disabled by default so the base Kommando template stays a pure ground specialist.
    children:
      - name: Super Jump
        points: 0
        per_level: 10
        levels: 1
        ref: B99
        tags: [Advantage, Physical, Xenos, Orks]
        modifiers:
          - {name: "Accessibility, only while wearing a working rokkit pack", cost: "-20%"}
        notes: Vertical leap distance per B99, used here for a rokkit-boosted jump into or across a fight rather than a natural ability.
        lore: A single good burst from a rokkit pack throws a Stormboy well over the heads of the enemy line.
        design: "Super Jump 1 (B99, 10/level) with Accessibility (only while the pack works, -20%). Full modified cost: 10 x 0.8 = 8 points."
      - name: Rokkit Malfunctions
        points: -1
        tags: [Quirk, Xenos, Orks]
        notes: Roleplaying/GM-hazard flag only.
        lore: >
          Rokkit packs are built by the same Meks and to the same standards
          as every other piece of Ork tech, which is to say: they work, up
          until the moment they spectacularly don't. Codex background and
          Black Library both play a botched Stormboy landing for comedy
          about as often as they play the charge itself for menace.
        design: "Quirk (B9): a GM is free to call for an occasional bad landing on unlucky rolls, at no further point cost."
skills:
  - name: Guns
    spec: Rifle
    diff: DX/E
    points: 4
    tags: [Xenos, Orks]
    lore: A Kommando still carries a shoota, just fires it less often than a Boy would.
    design: DX+2 (13) for 4 points, Easy.
  - name: Axe/Mace
    spec: Choppa
    diff: DX/A
    points: 2
    tags: [Xenos, Orks]
    lore: The close-in finish to a Kommando ambush.
    design: DX+0 (11) for 2 points, Average.
  - name: Stealth
    diff: DX/A
    points: 8
    tags: [Xenos, Orks]
    lore: A Kommando's whole job is not being seen until it's too late — unusual, prized, and actively trained-for patience by Ork standards.
    design: DX+2 (13) for 8 points, Average.
  - name: Camouflage
    diff: IQ/E
    points: 2
    tags: [Xenos, Orks]
    lore: Breaking up a Kommando's already-green silhouette further with mud, leaves and scrap.
    design: IQ+1 (9) for 2 points, Easy.
  - name: Traps
    diff: IQ/A
    points: 2
    tags: [Xenos, Orks]
    lore: Rigging an ambush or a booby-trapped position ahead of the main mob's arrival.
    design: IQ+0 (8) for 2 points, Average.
  - name: Survival
    spec: (Ork Worlds)
    diff: Per/A
    points: 4
    tags: [Xenos, Orks]
    lore: Kommandos operate well ahead of the main Waaagh, often for days.
    design: Per+1 (9) for 4 points, Average.
  - name: Tracking
    diff: Per/A
    points: 2
    tags: [Xenos, Orks]
    lore: Following an enemy patrol back to a position worth ambushing.
    design: Per+0 (8) for 2 points, Average.
  - name: Explosives
    spec: Demolition
    diff: IQ/A
    points: 2
    tags: [Xenos, Orks]
    lore: A Kommando is often the mob's own sapper, rigging charges under an enemy's nose.
    design: IQ+0 (8) for 2 points, Average.
  - name: Brawling
    diff: DX/E
    points: 1
    tags: [Xenos, Orks]
    lore: See the Ork Boy template.
    design: DX+0 (11) for 1 point, Easy.
  - name: Climbing
    diff: DX/A
    points: 1
    tags: [Xenos, Orks]
    lore: See the Ork Boy template.
    design: DX-1 (10) for 1 point, Average.
