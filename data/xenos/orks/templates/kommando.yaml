kind: template
output: Xenos/Orks/Templates/Ork Kommando.gct
notes: >
  An Ork Kommando: the rare Ork who has actually learned patience,
  camouflage and demolitions — Ork special forces, built on the standard
  Boy chassis with a stealth/sabotage skill package instead of a Boy's
  straightforward brawl-and-shoot kit. Point math: Ork Physiology 311 +
  skills 41 = 352 points, just past the top of framework.md's Elite human tier
  (200-350). The Stormboy rokkit-pack lens lives on the Ork Boy template,
  since Stormboyz are fast young Boyz, not Kommando derivatives.
traits:
  - include: "xenos/orks/traits.yaml#Ork Physiology"
skills:
  - name: Guns
    spec: Rifle
    diff: DX/E
    points: 4
    tags: [Xenos, Orks]
    lore: A Kommando still carries a shoota, just fires it less often than a Boy would.
    design: DX+2 (13) for 4 points, Easy.
  - name: Axe/Mace
    spec: Choppa
    diff: DX/A
    points: 12
    tags: [Xenos, Orks]
    lore: The close-in finish to a Kommando ambush.
    design: DX+3 (14) for 12 points, Average. Raised after combat-simulator testing (user direction); Orks outfight Guardsmen in the lore, hitting on 3+ where the Guard hit on 4+, and the old DX+0 choppa lost every close fight to a retreating Guardsman.
  - name: Stealth
    diff: DX/A
    points: 8
    tags: [Xenos, Orks]
    lore: A Kommando's whole job is not being seen until it's too late — unusual, prized, and actively trained-for patience by Ork standards.
    design: DX+2 (13) for 8 points, Average.
  - name: Camouflage
    diff: IQ/E
    points: 2
    tags: [Xenos, Orks]
    lore: Breaking up a Kommando's already-green silhouette further with mud, leaves and scrap.
    design: IQ+1 (9) for 2 points, Easy.
  - name: Traps
    diff: IQ/A
    points: 2
    tags: [Xenos, Orks]
    lore: Rigging an ambush or a booby-trapped position ahead of the main mob's arrival.
    design: IQ+0 (8) for 2 points, Average.
  - name: Survival
    spec: (Ork Worlds)
    diff: Per/A
    points: 4
    tags: [Xenos, Orks]
    lore: Kommandos operate well ahead of the main Waaagh, often for days.
    design: Per+1 (9) for 4 points, Average.
  - name: Tracking
    diff: Per/A
    points: 2
    tags: [Xenos, Orks]
    lore: Following an enemy patrol back to a position worth ambushing.
    design: Per+0 (8) for 2 points, Average.
  - name: Explosives
    spec: Demolition
    diff: IQ/A
    points: 2
    tags: [Xenos, Orks]
    lore: A Kommando is often the mob's own sapper, rigging charges under an enemy's nose.
    design: IQ+0 (8) for 2 points, Average.
  - name: Brawling
    diff: DX/E
    points: 4
    tags: [Xenos, Orks]
    lore: See the Ork Boy template.
    design: DX+2 (13) for 4 points, Easy. Raised after combat-simulator testing (user direction); Orks outfight Guardsmen in the lore, hitting on 3+ where the Guard hit on 4+, and the old DX+0 choppa lost every close fight to a retreating Guardsman.
  - name: Climbing
    diff: DX/A
    points: 1
    tags: [Xenos, Orks]
    lore: See the Ork Boy template.
    design: DX-1 (10) for 1 point, Average.
