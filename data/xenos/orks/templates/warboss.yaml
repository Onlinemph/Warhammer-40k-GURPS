kind: template
output: Xenos/Orks/Templates/Ork Warboss.gct
notes: >
  A Warboss: the biggest, meanest, canniest Ork running a Waaagh. Point
  math: Ork Physiology 179 + Growth Lens: Warboss 277 + skills 100 = 556
  points. Stats: ST 32, DX 12, IQ 10, HT 15, HP 40, Will 10, Per 10, SM +1
  — framework.md's Warboss anchor line exactly. This lands at the low end
  of framework.md's Astartes tier (550-800): a solid, competent Warboss
  who genuinely out-muscles a Space Marine, built mostly from sheer
  physical scale, battlefield toughness and raw command presence (see
  Charisma and Wealth in the Growth Lens) rather than the breadth of
  skill and equipment a Chapter gives its Battle-Brothers. A legendary,
  named Warboss (a Ghazghkull Thraka-tier figure) should be built as a
  bespoke NPC well above this template, in framework.md's Heroes and
  Legends tier (1,000-3,000) — this is the "typical, dangerous Warboss"
  baseline, not the biggest name in the setting. Enable at most one Klan
  lens for flavor.
