kind: template
output: Xenos/Orks/Templates/Ork Boy.gct
notes: >
  Baseline Ork infantry: the rank-and-file greenskin, a match for two or
  three Guardsmen in a straight fight and utterly indifferent to the odds.
  Point math (see Xenos/Orks/Traits/Ork Physiology.adq for the full
  derivation of every trait below): Ork Physiology 251 (incl. Injury Tolerance
  (Damage Reduction) 2, 50) + skills 30 = 281 points. Stats: ST 22, DX 11, IQ 8, HT 13, HP 26, Will 8, Per 8, Move 9, SM 0 —
  landing exactly on framework.md's Boy anchor line. This sits well above
  framework.md's "Trained soldier" tier (100-175) and in the middle of
  "Elite human" territory (200-350) almost entirely on the strength of
  raw ST, HP and the injury divisor (Injury Tolerance 2: a Boy shrugs off
  half of every wound that gets through his hide):
  the framework's own Ork anchor table asks for a body that outclasses a
  trained human soldier before a single skill point is spent, so the
  point total reflects that rather than any special training or
  intellect — this is a crude, low-IQ brawler who happens to be built
  like a small tank, not a disciplined veteran. Enable at most one Klan
  lens (from Xenos/Orks/Traits/Ork Physiology.adq, all disabled by
  default) for clan flavor; they are net-zero-point packages, not full
  sub-templates, per this project's Guardsman regimental-lens precedent.
  Culture: Freebooterz is a way of life rather than a Klan and may be
  combined with one Klan lens. Enable the Stormboy Rokkit Pack lens (17
  points, disabled by default) to build a Stormboy: a young, fast Boy with
  a jump pack.
