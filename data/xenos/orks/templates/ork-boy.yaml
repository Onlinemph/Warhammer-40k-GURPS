skills:
  - name: Axe/Mace
    spec: Choppa
    diff: DX/A
    points: 2
    tags: [Xenos, Orks]
    lore: The choppa is the Ork's universal melee sidearm, crude and always to hand.
    design: DX+0 (11) for 2 points, Average (B208).
  - name: Guns
    spec: Rifle
    diff: DX/E
    points: 4
    tags: [Xenos, Orks]
    lore: Framework's weapon-skill table: shootas are heavy autogun-pattern weapons, so they use Guns (Rifle) like their Imperial counterparts.
    design: DX+2 (13) for 4 points, Easy (B170).
  - name: Guns
    spec: Pistol
    diff: DX/E
    points: 1
    tags: [Xenos, Orks]
    lore: The slugga is a Boy's backup or off-hand piece, paired with a choppa.
    design: DX+0 (11) for 1 point, Easy.
  - name: Brawling
    diff: DX/E
    points: 1
    tags: [Xenos, Orks]
    lore: When the choppa breaks or the fight gets close enough, an Ork just uses its fists, head and teeth.
    design: DX+0 (11) for 1 point, Easy.
  - name: Intimidation
    diff: Will/A
    points: 4
    tags: [Xenos, Orks]
    lore: A Boy's size and temper do most of the work; the skill just channels it.
    design: Will+1 (9) for 4 points, Average. GURPS Intimidation (B202) lets ST substitute for Will on the roll itself, which matters far more for an Ork than the raw skill level does.
  - name: Survival
    spec: (Ork Worlds)
    diff: Per/A
    points: 2
    tags: [Xenos, Orks]
    lore: Rough field survival, picked up living on the move with a Waaagh.
    design: Per+0 (8) for 2 points, Average.
  - name: Carousing
    diff: HT/E
    points: 1
    tags: [Xenos, Orks]
    lore: Orks drink, brawl and sing between fights as enthusiastically as they fight.
    design: HT+0 (13) for 1 point, Easy.
  - name: Climbing
    diff: DX/A
    points: 1
    tags: [Xenos, Orks]
    lore: Scrambling over wreckage and trenches is routine.
    design: DX-1 (10) for 1 point, Average.
  - name: Jumping
    diff: DX/E
    points: 1
    tags: [Xenos, Orks]
    lore: Basic battlefield mobility.
    design: DX+0 (11) for 1 point, Easy.
