kind: equipment
output: Xenos/Orks/Armour/Ork Armour and Gear.eqp
items:

  # ---------------------------------------------------------------- armour

  - name: Ork Scrap Flak
    tl: 4
    lc: 0
    cost: 40
    weight: 10
    tags: [Body Armor, Xenos, Orks]
    dr: {"torso,vitals,groin": 20, arm: 14, leg: 14, "skull,face,eye,neck,hand,foot": 0}
    weak_points: 8
    notes: >-
      A patchwork of scavenged plate, tin and leather straps; no two suits
      look alike, and a GM may reasonably rule that a given salvaged
      pauldron or plate has already been dented, holed or is simply missing
      on any individual figure.
    lore: >-
      The armour of Gretchin, unproven Boyz, and any Ork too poor or too new
      to have earned better kit: whatever scrap plate, riveted tin and
      leather a Boy can scavenge or is issued by a Nob who doesn't want him
      dying quite that easily. Codex: Orks background and army art both
      depict most rank-and-file Boyz in exactly this kind of light,
      mismatched protection rather than a proper suit.
    design: >-
      No framework anchor names this item directly, so it is built as a
      lighter cousin of the 'Eavy Armour anchor below rather than an
      independent figure: roughly half the anchor's DR 45, giving DR 20, per
      the same "lighter, gappier version of the heavier pattern" logic this
      project uses for the Imperium's own Scout Armour relative to full
      power armour. Exact dice distribution (updated to match the Ranged
      Weapons file's own corrected Slugga and Shoota dice): a Slugga (7d
      pi+) penetrates it 80.8% of the time and a Shoota (9d pi+) 98.5% of
      the time - genuinely poor protection against Ork small arms
      themselves, let alone Imperial weapons, matching its place as the
      worst armour in either army's roster. Weak Points 8, worse (gappier)
      than the 'Eavy Armour's own already-poor 7, per the framework's Ork
      rule that Ork armour "is thick scrap plate with many gaps," taken to
      its logical extreme for the cheapest tier of that armour. Coverage is
      deliberately partial - arms only, no head or hand protection - matching
      the scavenged, mismatched look the lore describes.

  - name: "'Eavy Armour"
    tl: 5
    lc: 0
    cost: 300
    weight: 45
    tags: [Body Armor, Xenos, Orks]
    dr: {"torso,vitals,groin": 45, arm: 34, leg: 34, neck: 30, skull: 40, face: 27, eye: 15, hand: 0, foot: 27}
    weak_points: 7
    notes: >-
      Rigid, riveted plate over a padded underlayer; imposes the usual GURPS
      bulky-armour DX/Stealth penalties for rigid heavy armour, on top of
      which most 'Eavy Armour is loud, mismatched and covered in Ork
      decoration that does the wearer's Stealth no additional favours (GM's
      discretion on a further penalty for a particularly garish suit).
    lore: >-
      Standard-issue heavy plate for veteran Boyz and Nobz: welded and
      riveted metal plate, thick enough to shrug off small-arms fire, worn
      openly as a mark of status as much as protection. Codex: Orks
      background and Deathwatch's Mark of the Xenos both place it clearly
      above the scrap armour worn by lesser Boyz and clearly below a
      Meganob's mega armour.
    design: >-
      Matches the framework's Ork anchor exactly ("'Eavy armour | Torso DR
      45, Weak Points 7"). Exact dice distribution against the Imperium
      weapon anchors: a lasgun (7d(2) burn) penetrates 66.8% of the time -
      'Eavy Armour is not remotely las-proof the way Astartes plate is - an
      autogun (7d pi, no divisor) penetrates 0% of the time - it stops solid
      slugs outright, matching the framework's general "flak/carapace-class
      armour stops stub rounds" logic at a scrap-built DR 45 - and a bolter
      (6dx2(2) pi++) penetrates 99.0% of the time, confirming that a boltgun
      shreds even an Ork's best rigid plate almost every time, exactly the
      one-sided matchup every piece of Astartes-vs-Ork fiction depicts.
      Limb/head DR use the same proportional offsets as the project's other
      rigid-plate entries (roughly torso x0.75-0.9 for limbs and head, torso
      x0.6 for the eye slit before the Weak Points-driven eye reduction), and
      the eye DR (15) is set low deliberately - 'Eavy Armour helmets are
      depicted as crude, ill-fitting affairs with poor vision slits, and the
      framework's own eye-lens/Weak Points logic rewards exactly this kind
      of gap. Weight 45 lb, heavier for its DR than any comparable Imperium
      armour (Guard carapace is DR 70 at 30 lb) - Ork armour is thick and
      crude rather than efficiently engineered, trading weight for the DR
      it does deliver.

  - name: Mega Armour
    tl: 7
    lc: 0
    cost: 12000
    weight: 220
    tags: [Body Armor, Xenos, Orks]
    dr: {"torso,vitals,groin": 150, arm: 131, leg: 131, neck: 104, skull: 150, face: 112, eye: 45, hand: 90, foot: 112}
    weak_points: 6
    attributes: {lifting_st: 15, striking_st: 8}
    notes: >-
      Servo-assisted plate, worn almost exclusively by Meganobz; imposes
      rigid heavy armour DX/Stealth penalties as any suit this bulky would,
      and a GM may add an extra Basic Move penalty for its sheer mass (the
      framework does not fix one, unlike the Imperium's own Mk X Gravis and
      Terminator suits, since no source gives Mega Armour a consistent
      mobility figure the way Codex Space Marines background does for those
      patterns).
    lore: >-
      The Ork answer to Terminator plate: a massive, welded suit of servo-
      assisted armour built almost entirely by hand for a single Meganob,
      thick enough to shrug off small-arms and bolter fire and strong enough
      to swing a power klaw one-handed. The framework's own anchor table
      cites it by name as "an Ork answer to Terminator plate," and Codex:
      Orks background consistently shows Meganobz wading through the kind
      of fire that would kill an ordinary Boy outright.
    design: >-
      Matches the framework's Ork anchor exactly ("Mega armour | Torso DR
      150, Weak Points 6: an Ork answer to Terminator plate"). Exact dice
      distribution: a bolter (6dx2(2) pi++) penetrates 0% of the time and
      even a heavy bolter (7dx2(2) pi++) only 0.1% - Mega Armour is
      effectively bolter-proof, matching the Terminator-tier role the
      anchor names directly - while a lascannon (8dx8(5) burn, 100%), krak
      missile (6dx6(3) cr, 99.9%) and a power fist at Astartes strength
      (thr+8d(10) cr, 99.99%) all still go through reliably, the same
      "only real anti-armour or anti-Terminator weapons beat this" profile
      the Imperium's own Terminator plate carries. Weak Points 6 (worse -
      gappier - than the Imperium Terminator's own WP 3) is taken directly
      from the anchor and encodes exactly what "Ork answer to" should mean
      mechanically: comparable raw DR, meaningfully worse fit and finish,
      so massed fire finds the welded seams of a hand-built Ork suit far
      more often than the mass-produced, black-carapace-fitted plate of a
      Space Marine. Limb/head DR scale from the torso figure using the same
      proportions this project's Imperium Terminator entries use (roughly
      x0.875 for limbs, x0.75 for face, x0.69 for neck); eye DR (45) sits
      below the Imperium Terminator's 60, again reflecting cruder
      construction at comparable bulk. Servo ST (lifting_st 15, striking_st
      8) is set below the Imperium Terminator suit's own servo bonus
      (lifting 20, striking 10) for the same "comparable but cruder"
      reasoning, while still being what actually lets a Meganob swing a
      power klaw or killsaw one-handed. Weight 220 lb sits between the
      Imperium's Gravis (220 lb) and full Terminator plate (300-340 lb),
      reasoned as "as heavy as the most armoured non-Terminator human-scale
      suit, for a smaller (if far stronger) wearer than an Astartes."

  # ---------------------------------------------------------------- fields

  - name: Kustom Force Field
    tl: 7
    lc: 0
    cost: 15000
    weight: 60
    tags: [Body Armor, Xenos, Orks]
    notes: >-
      A regenerating shield per framework.md's personal-force-field rules,
      but built and sized for a mob rather than a single wearer: every Ork
      (and only Orks and their vehicles - the field does not recognise or
      protect anything it doesn't believe is "one of da boyz") within 5
      yards of the Mek carrying the projector is covered against all
      incoming damage, not just the Mek himself. Shield Points: 250. Delay:
      4 seconds after last taking damage before it starts recharging.
      Recharge: 15 SP/second once it starts. Collapse (SP hits 0): needs
      double the normal delay (8 seconds) before it starts recharging
      again, as any regenerating shield. Track current SP with the item's
      Uses counter in GCS, shared across every Ork it is currently covering.
      Erratic: this is a Mek's kustom bodge, not a refined Imperial
      pattern - each time the field would absorb an attack, roll 1d first;
      on a 1, the field simply fails to activate for that hit ("it wasn't
      lookin'"), and the attack proceeds against the wearer's armour and DR
      as if the field weren't there at all, with no SP lost either way.
    lore: >-
      A Big Mek's bubble-shield generator, projecting a crackling energy
      dome over himself and every Ork fighting nearby; Codex: Orks
      background describes it as capable of shrugging off small-arms fire
      and even heavier weapons across an entire mob at once, at the cost of
      being wildly inconsistent - the same background material notes that
      Kustom Force Fields have an infamous habit of interfering with
      teleporters and deep-strike landings near them, a detail left here as
      colour for a GM running such a scene rather than a new mechanic this
      project would need to invent whole-cloth.
    design: >-
      Built on the framework's own regenerating-shield table (Refractor 40
      SP/Rosarius 60/Conversion 80/Iron Halo 120/Storm Shield 160, all at
      2-3 second delays and 10-20 SP/second recharge) rather than as a flat
      DR bonus, per the framework's explicit instruction to use those rules
      for personal force fields; a KFF is deliberately built above every
      entry on that table (250 SP) since it is covering an entire mob's
      worth of incoming fire rather than one wearer, the same logic that
      makes a Storm Shield's 160 the table's current ceiling for a
      single-target field. The "erratic" instruction is modelled as a flat
      1-in-6 chance the field simply doesn't answer a given hit at all -
      not a reduced SP pool or a worse recharge rate, both of which would
      just make it a smaller, slower version of an Imperial field rather
      than a genuinely unreliable one - directly serving the assignment's
      request for "a large, erratic pool" without inventing a new class of
      shield mechanic the framework doesn't already support. Delay (4s) and
      Collapse (8s) are one full second slower than the Storm Shield's own
      2s/4s figures, reflecting a hand-built Mek generator's slower recovery
      compared to Imperial-manufactured fields. Weight 60 lb and a five-
      figure cost reflect a genuinely major, backpack-scale piece of Mek
      engineering, priced and weighted above any single-wearer field in
      this project's Imperium armour file.

  # ---------------------------------------------------------------- augmetics

  - name: Cybork Body
    tl: 6
    lc: 0
    cost: 2000
    weight: 8
    tags: [Body Armor, Xenos, Orks]
    dr: {"torso,vitals,groin": 5, arm: 5, leg: 5, "skull,face,eye,neck,hand,foot": 0}
    notes: >-
      A worn-gear stand-in only; see design for why this project's own
      conventions say a Cybork Body is better built as a trait.
    lore: >-
      Orks who lose limbs or organs to the fortunes of war and survive their
      Painboy's attention often come back with crude bionic replacements -
      a metal arm, a mechanical eye, a riveted plate over a healed skull
      wound. Codex: Orks background treats "going cybork" as a badge of
      survival as much as a practical fix, and a sufficiently rebuilt Ork
      Nob or Warboss may be more machine than meat.
    design: >-
      Per framework.md's own Adeptus Mechanicus precedent ("Model augmetics
      as traits... one per implant, so a character sheet lists what has been
      replaced"), a Cybork Body is genuinely better built as a set of GURPS
      cybernetic advantage traits (an Injury Tolerance/DR combination and
      whatever limb-replacement or Payload traits fit a given Ork's actual
      injuries) than as a single piece of equipment, exactly the same
      reasoning the framework already applies to Tech-Priest and Skitarii
      augmetics. This entry exists as a simple, optional at-the-table
      stand-in for a GM who doesn't want to build a bespoke trait package on
      the spot: a flat, modest DR overlay (torso/arm/leg 5, stacking with
      worn armour) representing scattered plates and reinforced bone rather
      than a coherent suit, priced and weighted as a rough abstraction, not
      a considered anchor figure. A campaign that expects to field named,
      recurring cyborked Orks (a Warboss, a veteran Nob) should build them
      the trait-file way instead, per the framework's own stated preference.

  # ---------------------------------------------------------------- gear

  - name: Bosspole
    tl: 4
    lc: 0
    cost: 50
    weight: 8
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Swing
        damage: sw+1 cr
        reach: 1
        parry: "-1U"
        st: 10
        skill: Axe/Mace
    notes: >-
      A Nob or Boss carrying a bosspole into a mob adds +1 to his own
      Leadership-equivalent rolls to keep that mob fighting (GM's discretion
      on the exact roll used, per whatever leadership/morale rules the
      campaign runs) - Ork mobs rally, or get beaten back into line, at the
      sight and sound of the pole as much as at the Boss's voice.
    lore: >-
      A tall pole topped with trophies, totems, the skulls of the Boss's
      defeated rivals, and (in Ork Freebooter and Speed Freek variants) an
      assortment of scrap-metal decoration, carried by any Nob or Warboss
      who leads a mob; Codex: Orks background is explicit that a bosspole is
      as much a rallying standard as it is a club for beating faltering
      Boyz back into the fight, and it is rarely put down even when its
      owner has a choppa or klaw in the other hand.
    design: >-
      Not a framework anchor; built as a plain, long-hafted club (sw+1 cr,
      reach 1, parry -1U, Axe/Mace - the same baseline the Imperium
      Guardsman's Club uses) since nothing in the lore suggests a bosspole
      out-hits an ordinary length of decorated wood and scrap in a fight,
      with its real value represented as a flat Leadership-style bonus per
      the "rallying standard" half of its description rather than as extra
      damage - the same design choice this project makes for the Imperium
      Commissar's Sabre, whose value is largely symbolic and social rather
      than mechanical. Handling: 8 lb (heavier than the Guardsman's Club for
      the trophies and decoration bolted to it), min ST 10, ordinary for any
      Ork.

  - name: Gitfinda
    tl: 6
    lc: 0
    cost: 150
    weight: 2
    tags: [Xenos, Orks, Gear]
    notes: >-
      A crude optical sight, fitted to a shoota-family weapon (Shoota,
      Kustom Shoota, Big Shoota, Deffgun or a Kombi-Weapon's shoota barrel):
      grants +1 to that weapon's listed Acc. It does nothing for a pistol,
      rokkit tube or energy weapon - there's no housing on this project's
      Ork pistols and launchers for a Mek to bolt one onto.
    lore: >-
      A salvaged or Mek-built optical sight bolted onto a shoota, letting an
      Ork actually aim rather than simply point and spray; Codex: Orks
      background treats gitfindas as an uncommon but real upgrade some Boyz
      and Nobz scrounge or are issued, distinct from the plain iron sights
      every other Ork gun makes do with.
    design: >-
      No framework anchor covers accessories, so this is built the same way
      the Imperium's own scopes and sights work in GURPS terms - a flat +1
      Acc bonus to the host weapon, the smallest meaningful step on the Acc
      scale, reflecting a genuinely crude optic rather than a proper scoped
      sight (which would call for +2 or more, per the framework's own "sniper
      and scoped weapons +1 to +3" guidance - a gitfinda earns the bottom of
      that range, not the top). Restricted to shoota-family long arms since
      every other Ork ranged weapon in this file either has no obvious
      mounting rail (pistols, the rokkit tubes) or is already built around
      its own targeting quirk (the Zzap Gun's crackling charge, the Shokk
      Attack Gun's warp field) that a bolt-on sight wouldn't meaningfully
      improve. Handling: 2 lb, a small accessory; TL6 and LC0 match the rest
      of this file's Ork-tech entries.

  - name: Ammo Runt
    tl: 4
    lc: 0
    cost: 30
    weight: 0
    tags: [Xenos, Orks, Gear]
    notes: >-
      Represents a Gretchin attached to a Boy or Nob specifically to lug
      spare ammunition, not an inanimate item - the weight above is 0
      because the runt, not the gunner, carries the load. Mechanically: any
      one weapon the gunner carries with a shots line ending in a reload
      time in parentheses (e.g. "30(5)") treats that reload as one full
      second faster, to a minimum of 1 second, since the runt has the next
      drum or belt ready to hand rather than making the gunner dig for it
      himself. A runt this close to the fighting is exactly as fragile as
      the framework's Gretchin template (ST 8, HP 8, no armour worth the
      name) and will flee, hide, or simply vanish at the first serious sign
      of danger, per Gretchin cowardice - a GM should treat losing an ammo
      runt mid-fight as a real and recurring risk, not a one-time purchase
      that then always works.
    lore: >-
      Gretchin are routinely pressed into service as ammunition bearers,
      loaders and general dogsbodies for Boyz and Nobz who can't be bothered
      carrying their own spare drums; Codex: Orks background treats this as
      one of the more mundane, constant uses Orks have for their Gretchin
      underlings, alongside minding squigs and other equally thankless
      jobs.
    design: >-
      Not a piece of equipment in the normal sense - a hired or press-ganged
      Gretchin is a creature, not gear - but included here per the
      assignment's own framing, in the same spirit as the Imperium's
      generic support-gear entries (the Heavy Weapon Tripod, the Assault
      Cannon Ammunition Hopper) that exist to give a logistics detail a
      concrete cost and effect rather than leaving it purely narrative.
      Mechanically it's built as a small, capped reload-time discount rather
      than an unlimited-ammo effect, since "a second pair of hands passing
      you drums faster" is a real but modest logistics benefit, not a
      reason to remove reload time from the game entirely, and the note is
      explicit that the runt himself is a liability, not a fire-and-forget
      purchase - true to a Gretchin's place in Ork background as expendable,
      unreliable and prone to running.

  - name: Stikkbomb Belt
    tl: 4
    lc: 0
    cost: 30
    weight: 6
    tags: [Xenos, Orks]
    notes: A webbing belt or bandolier holding 6 Stikkbombs (Frag), carried ready to throw.
    lore: >-
      The standard way a Boy carries his stikkbombs into a fight - a
      bandolier or belt of tin-can bombs slung across the chest, as
      ubiquitous in Ork army art as the choppa and slugga themselves.
    design: >-
      A pure carrying-capacity item, built the same way this project's
      Imperium files handle spare-magazine and ammunition entries (e.g. the
      Autogun Magazine, spare): it exists to give a Boy's grenade loadout a
      weight and cost rather than assuming an unlimited supply, with the
      actual Stikkbomb (Frag) entry above carrying the weapon's damage and
      design derivation.
