    tl: 9
    lc: 2
    cost: 60000
    weight: 12000
    tags: [Vehicle, Xenos, Orks]
    vehicle:
      st_hp: 92
      hnd: 0
      sr: 3
      ht: 9
      ht_code: f
      move: [3, 30]
      lwt: 6
      load: 1.5
      sm: 4
      occ: "2+12"
      dr: {front: 100, side: 100, rear: 100, top: 0, under: 100}
      locations: O4WX
      control: Driving (Heavy Wheeled)
      crew_template: Ork Boy
      skills: {"Driving (Heavy Wheeled)": 11, "Guns (Light Machine Gun)": 11}
      crew:
        - {role: Driver, station: driver}
        - {role: Gunner, station: pintle, arc: pintle, weapon: {item: Big Shoota, mode: "Dakka (full auto)"}}
