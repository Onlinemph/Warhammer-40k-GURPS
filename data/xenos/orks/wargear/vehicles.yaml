    design: >
      HP 4 x cube root of 12,000 lb = 92. DR 100 (AV10) front, sides and rear;
      no roof. About 6 m long (6.6 yd): SM +3, +1 for the box: +4. Move 3/30,
      a light, overpowered truck. Hnd/SR 0/3 from the Basic Set's jeep and
      pickup. HT 9 for the Orks' build quality.
