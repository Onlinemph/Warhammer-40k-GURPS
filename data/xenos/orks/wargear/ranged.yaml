kind: equipment
output: Xenos/Orks/Weapons/Ork Ranged Weapons.eqp
items:

  # ---------------------------------------------------------------- pistols

  - name: Slugga
    tl: 5
    lc: 0
    cost: 70
    weight: 5
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Standard
        damage: 7d pi+
        acc: 1
        range: 90/220
        rof: 3
        shots: 14(3)
        st: 9
        bulk: -2
        rcl: 3
        skill: Guns (Pistol)
        notes: Malf 14. Ork weapons never explode on the wielder's roll of 3; treat any Critical Failure as a jam instead (a Ready maneuver clears it).
    lore: >-
      The slugga is the Ork sidearm: a stamped, riveted, big-bore auto-pistol
      every Boy carries alongside his choppa. Codex: Orks background and
      Deathwatch's Mark of the Xenos both describe it as crude but powerful -
      an oversized handgun firing a round more akin to a rifle cartridge than
      a pistol round - and it is a constant visual in Black Library Ork
      fiction (Nate Crowley's Ghazghkull Thraka: Prophet of the Waaagh! among
      others) as the "boom" half of "choppa and shoota" Ork close-combat
      doctrine.
    design: >-
      REVISED (lore fix): the framework's Ork anchor reads "about 5d pi+,"
      but at that dice count the slugga penetrated flak (DR 30) 0% of the
      time by exact dice distribution - flatly at odds with Ork dakka being
      able to chew through Guard lines at all, since even the sidearm should
      threaten flak-armoured infantry when Ork small arms are consistently
      described firing rounds far bigger than a human pistol's. Bumped two
      dice to 7d pi+ (avg 24.5) to actually earn "big-bore": exact dice
      distribution now penetrates flak 9.4% of the time (a real, if
      unreliable, threat rather than none at all) while still failing
      outright against carapace or better (0%), keeping the slugga clearly
      below the shoota in this file's own family and nowhere near a threat
      to real Imperial plate - a sidearm should hit meaningfully harder than
      "no threat whatsoever," not compete with the family's own rifle.
      Handling re-derived for the bigger cartridge: weight up from 4 lb to 5
      lb for the heavier case and stiffer frame; min ST 9 (raw formula
      sqrt(10x5)=7.1, bumped for a genuinely punishing pistol-frame round,
      the same logic the Imperium Bolt Pistol's ST bump uses) - still
      trivial for a Boy (ST 22) but a serious handful for an unaugmented
      human. Shots trimmed to 14(3) (a bigger cartridge means fewer rounds
      in the same drum) and Rcl bumped to 3 (up from 2) for the harder kick,
      both real handling consequences of the bigger round rather than
      cosmetic changes. Bulk -2 and Acc 1 are unchanged - the frame and
      sights aren't any different, only the ammunition. Malf 14 and the
      no-explosion house rule are unchanged from before.

  - name: Rokkit Pistol
    tl: 6
    lc: 0
    cost: 500
    weight: 10
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Standard
        damage: 4dx4(3) cr ex
        acc: 0
        range: 100/300
        rof: 1
        shots: 1(6)
        st: 12
        bulk: -4
        rcl: 1
        skill: Guns (Pistol)
        notes: Malf 14.
    lore: >-
      A rarer, one-handed rokkit tube favoured by Kommando Nobz and Freebooter
      captains who want an anti-armour punch without giving up a choppa or
      power klaw in the other hand; smaller and shorter-ranged than the
      shoulder-fired rokkit launcha, and correspondingly less common in
      background art, but a recurring "big pistol" silhouette in Ork Kommando
      and Freebooter illustrations.
    design: >-
      Scaled down one size class from the rokkit launcha anchor (6dx4(3) cr
      ex) the same way this project scales a pistol from its parent rifle
      family elsewhere: two dice down, same mechanism and armour divisor,
      giving 4dx4(3) cr ex (avg 56). Exact dice distribution: penetrates
      carapace (DR 70, eff. 23.3) 99.6% of the time and Astartes power armour
      (DR 100, eff. 33.3) 94.6% - still a real Marine-killer at short range -
      but drops off hard against a Terminator (DR 200, eff. 66.7) to 23.9%,
      and against vehicles clears AV10/AV11 (66.4%) but fails AV12 upward
      (23.9%/0.4%/0%) - a real but weaker cousin of the full rokkit launcha,
      matching its rarer, smaller-warhead depiction. Handling: 10 lb loaded
      (a stubby tube and single warhead, no shoulder stock); min ST 12
      (heavier than a slugga for the rocket motor and blast shield, light
      work for a Nob at ST 26); RoF 1 and Shots 1(6) - a single-shot tube that
      needs a fresh rocket socketed in by hand, slower even than the full
      launcha's reload since there's no shoulder brace to steady the reload.
      Bulk -4 (bulkier than any pistol, still one-handable) and Rcl 1 (the
      rocket motor, not the launch charge, does the accelerating). Acc 0, per
      the framework's Ork Acc bracket, worse even than the full launcha for
      the shorter sighting length. Malf 14, standard Ork gear.

  # ------------------------------------------------------------------ rifles

  - name: Shoota
    tl: 5
    lc: 0
    cost: 220
    weight: 20
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Dakka (full auto)
        damage: 9d pi+
        acc: 1
        range: 150/500
        rof: 10
        shots: 24(5)
        st: 16
        bulk: -5
        rcl: 4
        skill: Guns (Rifle)
        notes: Malf 14. Ork critical failures jam (Ready to clear) rather than exploding; see Slugga.
    lore: >-
      The shoota is the Ork long arm: a heavy, crudely-stamped automatic
      weapon built to spray "dakka" rather than aim, consistently described
      across Codex: Orks and Deathwatch's Mark of the Xenos as more effective
      in volume than in precision, and a constant background weapon in every
      piece of Ork art and Black Library Ork fiction from the Waaagh!-era
      novels onward. Ork tech-lore holds that a shoota fires better the
      louder its owner shouts at it - a detail played for both humour and
      genuine menace in the fiction, since the effect (whatever its cause)
      is real in-universe.
    design: >-
      REVISED (lore fix): the framework's Ork anchor's own dice ("about 7d
      pi+") made the shoota ballistically identical to the Imperium autogun,
      penetrating flak (DR 30) only 9.4% of the time - flatly wrong for the
      weapon the fiction shows mowing down entire Guard lines under weight
      of fire. The anchor's own text calls shootas "heavy slugs," and Ork
      background consistently describes shoota rounds as far bigger than a
      human rifle's, so the dice are corrected upward rather than treated as
      fixed: 9d pi+ (avg 31.5). Exact dice distribution now penetrates flak
      57.6% of the time - genuinely dangerous to flak-armoured infantry, as
      "dakka mows down Guard lines" requires - while still failing outright
      against carapace or better (0%) and every vehicle AV on the table
      (checked AV10-14), so a shoota still cannot threaten real Imperial
      plate or armour, only unarmoured and flak-class targets, keeping the
      family's own internal escalation (shoota < kustom shoota/snazzgun <
      big shoota < deffgun) intact. Acc, RoF, Malf and the "dakka not
      precision" identity are all unchanged, per the coordinator's
      instruction - only the calibre moved. Handling re-derived for the
      bigger round: weight up from 16 lb to 20 lb for a genuinely heavier
      cartridge and reinforced receiver; min ST 16 (raw formula
      sqrt(10x20)=14.1, bumped for the harder-kicking action, the same
      recoil-handling logic used throughout this file) - a Boy (ST 22)
      still fires it without difficulty, an unaugmented human now struggles
      even more than before. Shots trimmed to 24(5) (fewer of the bigger
      cartridges fit the same drum) and Rcl bumped to 4 (up from 3, a
      genuinely heavier-calibre kick, matching the framework's own "heavy
      bolter/heavy stubber 3-4" bracket) - real consequences of the bigger
      round, not free changes. Bulk -5, RoF 10 and Acc 1 are unchanged: the
      weapon's size class and its "dakka not precision" identity haven't
      moved, only its stopping power. Malf 14 per the framework's explicit
      Ork-gear rule, unchanged.

  - name: Kustom Shoota
    tl: 6
    lc: 0
    cost: 400
    weight: 22
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Dakka (full auto)
        damage: 10d pi+
        acc: 1
        range: 150/500
        rof: 12
        shots: 24(5)
        st: 17
        bulk: -5
        rcl: 4
        skill: Guns (Rifle)
        notes: Malf 13 (kustom job; see design). Jams rather than explodes on a critical failure, as the Slugga.
    lore: >-
      A Mekboy-tuned shoota, its receiver welded over with extra plating,
      a bigger ammo hopper and (usually) at least one more barrel than it
      needs: Ork background material is consistent that a Mek's "kustom" work
      makes a weapon hit harder at the direct cost of reliability, since the
      Mek's improvements are guided by instinct and belief rather than any
      real engineering discipline.
    design: >-
      REVISED (lore fix): rebuilt one die over the now-corrected plain
      Shoota (9d pi+, see that entry) rather than the old, too-weak baseline,
      keeping the same relative "Mek's overbuilt action hits a step harder"
      relationship: 10d pi+ (avg 35). Exact dice distribution: 79.5% through
      flak (DR 30), a clear step up from the plain Shoota's own 57.6% and
      genuinely closing on "beats flak easily," while still failing outright
      against carapace or better (0%) - a harder-hitting Shoota, not a
      different class of weapon, exactly as before. Handling re-derived for
      the bigger charge: weight up from 18 lb to 22 lb (extra plating and a
      bigger drum over the now-heavier plain Shoota's own 20 lb); min ST 17
      (raw formula sqrt(10x22)=14.8, bumped to match the heavier housing and
      harder kick, the same margin over the plain Shoota's own ST 16 as
      before); Rcl bumped to 4, matching the plain Shoota's own correction.
      RoF stays at 12 (the reworked action cycling faster than stock) and
      Bulk stays at -5 - neither the mechanism nor the silhouette changed,
      only the calibre, per the coordinator's instruction to keep Acc, Malf
      and the "dakka not precision" identity intact. Shots trimmed to 24(5)
      to match the plain Shoota's own bigger-cartridge correction. Malf
      stays at 13, per the framework's explicit "13 for kustom jobs" rule,
      unchanged by the rescale.

  - name: Snazzgun
    tl: 6
    lc: 0
    cost: 1000
    weight: 21
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Dakka (full auto)
        damage: 10d pi+
        acc: 2
        range: 180/550
        rof: 10
        shots: 24(4)
        st: 15
        bulk: -5
        rcl: 4
        skill: Guns (Rifle)
        notes: >-
          Malf 15 (see design). Every snazzgun is individually built and
          often carries an idiosyncratic extra effect (a muzzle flare that
          briefly blinds, a second hidden barrel, a built-in gitfinda) left
          to the GM to add for a specific named weapon rather than statted
          generically here.
    lore: >-
      The snazzgun is the signature weapon of a Flash Git: a shoota rebuilt
      from looted, salvaged and traded-for parts of real quality by an Ork
      with more teef than sense, gaudily decorated and prized as much for
      status as for firepower. Codex: Orks background is explicit that Flash
      Gits' snazzguns are the best-made Ork small arms in general
      circulation, precisely because Flash Gits can afford to demand a Mek
      use good parts rather than whatever scrap is at hand.
    design: >-
      REVISED (lore fix): kept at the Kustom Shoota's now-corrected damage
      (10d pi+, avg 35, see that entry) rather than the old, too-weak
      baseline, since both still represent the same "improved shoota" tier -
      the difference this entry models is reliability and finish, not raw
      power. Exact dice distribution is identical to the Kustom Shoota
      (79.5% vs flak, 0% vs carapace or better). Handling re-derived for the
      bigger charge: weight up from 17 lb to 21 lb (lighter than the Kustom
      Shoota's 22 lb welded-on plating, since a snazzgun's quality comes from
      good components, not extra bulk); min ST 15 (raw formula
      sqrt(10x21)=14.5, essentially unmodified - a well-balanced weapon
      doesn't need the extra recoil-handling bump a cruder gun does, keeping
      it two points below the Kustom Shoota's ST 17); Rcl bumped to 4,
      matching the family-wide correction for the bigger round. Acc stays at
      2 (the top of the framework's Ork bracket, for genuinely better sights
      than any other entry on this page), Bulk stays at -5, RoF stays at 10
      and Malf stays at 15 - the coordinator's instruction was to keep Acc,
      Malf and the "dakka not precision" identity intact, and nothing about
      a snazzgun's actual craftsmanship changed, only its cartridge. Shots
      trimmed to 24(4), matching the family's bigger-cartridge correction
      while keeping the snazzgun's faster reload edge over the Kustom
      Shoota's 24(5).

  - name: Big Shoota
    tl: 6
    lc: 0
    cost: 800
    weight: 45
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Dakka (full auto)
        damage: 13d pi+
        acc: 1
        range: 200/600
        rof: 15
        shots: 50(6)
        st: 24
        bulk: -7
        rcl: 4
        skill: Guns (Rifle)
        notes: Malf 14. Jams rather than explodes on a critical failure, as the Slugga.
    lore: >-
      A heavy-stubber-class weapon carried two-handed by a big Ork rather
      than tripod-mounted by a human crew, common as a Nob's personal
      weapon, a trukk or battlewagon pintle gun, and standard wargear for the
      biggest Boyz in a mob. Codex: Orks background places it squarely in
      the heavy-stubber weight class, and it is a recurring silhouette on
      Ork vehicle art throughout the game's background material.
    design: >-
      REVISED (lore fix): the framework's own anchor text calls this a
      "heavy stubber class and up" weapon, but at the old anchor dice
      ("about 9d pi+") it penetrated flak (DR 30) only 57.6% of the time -
      a real threat, but well short of the "and up" and short of what a Boy
      mowing down a Guard firing line with a genuine heavy machine gun
      should manage against flak-class infantry, especially once the plain
      Shoota itself was corrected upward to that same 57.6% figure and a Big
      Shoota needs real daylight above its own little brother. Set to 13d
      pi+ (avg 45.5), the top of the coordinator's requested 12-13d range:
      exact dice distribution now clears flak 99.3% of the time - it "beats
      flak easily," exactly as instructed - while still failing against
      carapace or better for all practical purposes (0.0006%, negligible -
      "bounces off... mostly," per the instruction, read as "essentially
      always") and against every vehicle AV on the table (checked AV10-14,
      all 0%), so it still cannot hurt power armour or a vehicle, keeping
      the Imperium Heavy Stubber's own "never once shown killing a tank"
      reputation intact for the Ork equivalent. Handling re-derived for the
      much heavier round: weight up from 32 lb to 45 lb for a genuinely
      bigger receiver and ammunition (the "heavy machine gun" reading the
      coordinator asked for, not a slightly-bigger shoota); min ST bumped to
      24, above a bare Boy's own 22 (raw formula sqrt(10x45)=21.2, bumped
      for the much harder recoil of a true heavy-calibre weapon) - any Boy
      can still heft it with real effort, but it now genuinely favours a big
      Boy or a Nob (ST 26), matching a heavier weapon class than before.
      Shots trimmed to 50(6) for the bigger cartridges in the same drum;
      Rcl bumped to 4 (up from 3) for the heavier kick, matching the
      framework's own "heavy stubbers ... 3-4" bracket at its top end. RoF
      15, Bulk -7 and Acc 1 are all unchanged, per the coordinator's
      instruction to keep Acc and the "dakka not precision" identity intact
      - only the calibre and its handling consequences moved. Malf 14,
      standard Ork gear, unchanged.

  - name: Twin Big Shoota
    tl: 6
    lc: 0
    cost: 1500
    weight: 85
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Dakka (both barrels)
        damage: 13d pi+
        acc: 1
        range: 200/600
        rof: 15x2
        shots: 100(8)
        st: 26
        bulk: -8
        rcl: 4
        skill: Guns (Rifle)
        notes: Malf 14 per barrel (roll separately if a GM wants one barrel to jam and not the other). Jams rather than explodes on a critical failure, as the Slugga.
    lore: >-
      Two big shootas bolted to a shared frame and fired together, most often
      seen as a Deff Dread or battlewagon weapon mount but occasionally
      wielded by an especially large Ork; Codex: Orks background treats
      twin-linking as the standard Ork answer to "the first gun wasn't
      enough dakka."
    design: >-
      REVISED (lore fix): follows the Big Shoota's own corrected dice (13d
      pi+, see that entry) rather than the old, too-weak baseline, since a
      twin-link is still built as two of the same barrel, not a
      re-derivation. "rof: 15x2" continues to capture the doubled volume of
      fire per the standard GURPS convention for linked weapons (used
      identically for the Imperium Storm Bolter). Penetration odds per hit
      match the single Big Shoota exactly (99.3% vs flak, negligible vs
      carapace or better, 0% vs every vehicle AV). Handling re-derived from
      the heavier single gun: 85 lb, roughly double the single Big Shoota's
      new 45 lb for the shared mount and doubled ammunition feed; min ST
      bumped to 26 (above the single gun's own 24, matching the framework's
      Nob figure exactly - built for the very biggest Boyz and Nobz, or a
      vehicle mount) with Rcl matching the single gun's corrected 4. Shots
      set to 100(8) (not simply double the single gun's 50, since a shared
      twin feed is more cramped than two independent drums) with the same
      slower per-shot reload as before for the more awkward twin feed. Bulk
      -8, one step worse than the single gun's -7 for the doubled frame, is
      unchanged. Malf 14 as the single gun, unchanged; the note on rolling
      per barrel remains a GM option, not a mechanical requirement.

  - name: Deffgun
    tl: 6
    lc: 0
    cost: 2200
    weight: 75
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Braced/mounted
        damage: 15d pi+
        acc: 1
        range: 250/800
        rof: 10
        shots: 60(8)
        st: 22M
        bulk: -8
        rcl: 4
        skill: Gunner (Machine Gun)
        notes: Malf 14. Jams rather than explodes on a critical failure, as the Slugga.
    lore: >-
      A heavy support gun above the Big Shoota's weight class, mounted on
      Gunwagons, Deff Dreads and Big Meks' own heavy-support loadouts;
      background material (Codex: Orks, Forge World's Ork background) treats
      it as the Ork parallel to a human heavy machine gun proper - bigger,
      slower-cycling and harder-hitting than a shoota-family weapon, without
      crossing into rokkit or zzap-gun anti-armour territory.
    design: >-
      REVISED (lore fix): not covered by name in the framework's Ork anchor
      table, so it remains built one clear step above the Big Shoota on the
      same pi+ solid-slug family rather than copied from it, per the
      framework's "each weapon's dice derived individually" rule - but "one
      step above" now means one step above the Big Shoota's own corrected
      13d pi+ (see that entry), not the old, too-weak 9d baseline. Set to
      15d pi+ (avg 52.5): exact dice distribution clears flak (DR 30) 100%
      of the time and even opens a small, genuine crack in carapace (DR 70)
      at 0.3% of hits - still overwhelmingly an infantry-killer, but
      correctly sitting a clear notch above the Big Shoota's own negligible
      carapace chance, matching "above the Big Shoota" as instructed. Still
      0% against every vehicle AV on the table (checked AV10-14), keeping it
      an infantry-killer rather than a vehicle-killer, the role Rokkits and
      the Zzap Gun fill instead - a genuine heavy machine gun, not a
      light autocannon. Handling re-derived for the heavier round: weight up
      from 55 lb to 75 lb for a genuinely bigger receiver and ammunition;
      the raw ST formula gives sqrt(10x75)=27.4, but the weapon is mounted
      on a pintle or Deff Dread arm in every depiction rather than carried
      loose, so it takes the M suffix, bumped to ST 22 (up from 20) to
      reflect the heavier mount and feed mechanism the mount itself now has
      to manage - the mount still bears the weight, not the gunner's back.
      RoF 10, below the Big Shoota's 15, is unchanged for the same
      heavier-calibre-but-slower-cycling reasoning as before. Shots trimmed
      to 60(8) for the bigger cartridges in the same belt/hopper. Bulk -8
      unchanged; Rcl bumped to 4, matching the family-wide correction for
      the bigger round. Acc 1, unchanged Ork-gear figure, per the
      coordinator's instruction. Malf 14, standard Ork gear, unchanged.

  # -------------------------------------------------------------- rokkits

  - name: Rokkit Launcha
    tl: 6
    lc: 0
    cost: 900
    weight: 20
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Standard
        damage: 6dx4(3) cr ex
        acc: 1
        range: 150/450
        rof: 1
        shots: 1(6)
        st: 14
        bulk: -7
        rcl: 1
        skill: Guns (Rifle)
        notes: Malf 14.
    lore: >-
      The Ork anti-armour weapon of choice: a crude, shoulder-fired
      rocket tube that Codex: Orks and Deathwatch's Mark of the Xenos both
      describe as good enough to crack open light and medium Imperial armour
      despite (or because of) its total lack of finesse - fiction across the
      Ork range consistently shows rokkits cracking Chimeras, Sentinels and
      Rhinos while struggling against a main battle tank's frontal glacis.
    design: >-
      Matches the framework's Ork anchor exactly ("Rokkit launcha |
      Anti-armour, about 6d×4(3) cr ex, Acc 0-1, Malf 14"). Checked by exact
      dice distribution against the personal-armour and vehicle-AV tables:
      avg 84, penetrating every personal armour up to and including
      Astartes power armour (100%, 100%, 100%, 99.9%) and even a Terminator
      85.5% of the time - a real Marine- and Terminator-killer in enough
      numbers, matching the fiction's Ork mobs grinding down Astartes
      squads by weight of rokkit fire. Against the vehicle table it clears
      AV10-11 (99.9%/98.0%) reliably, AV12 (85.5%) usually, but falls to
      36.3% at AV13 and 2.0% at AV14 - reliably wrecks a Chimera, Rhino or
      Sentinel, sometimes cracks a Predator-weight hull, and rarely beats a
      Leman Russ or Land Raider outright, exactly the "crack open light and
      medium armour" reputation the lore consistently gives it. Handling: 20
      lb loaded (tube plus one rocket), min ST 14 (raw formula
      sqrt(10x20)=14.1, unmodified - a Boy at ST 22 fires it one-handed in a
      pinch, as the art shows). RoF 1 and Shots 1(6): single-shot, hand-
      loaded between shots, slower than the Imperium Missile Launcher's 1(4)
      for the cruder loading mechanism. Bulk -7 and Rcl 1 (the rocket motor
      ignites clear of the tube, so felt recoil is light) match a shoulder-
      fired tube weapon. Acc 1, the top of the anchor's 0-1 bracket - Orks
      aim rokkits about as well as anything else they own. Malf 14, standard
      Ork gear.

  # -------------------------------------------------------------- kustom energy weapons

  - name: Kustom Mega-Slugga
    tl: 6
    lc: 0
    cost: 650
    weight: 16
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Standard
        damage: 10d pi+
        acc: 1
        range: 100/300
        rof: 3
        shots: 10(4)
        st: 19
        bulk: -4
        rcl: 4
        skill: Guns (Pistol)
        notes: Malf 13 (kustom job).
    lore: >-
      A Meganob's sidearm: a slugga rebuilt to Meganob scale and Mekboy
      "improvement," fired one-handed from inside a suit of mega armour
      alongside a power klaw. Background material treats it as simply a
      bigger, meaner slugga rather than a distinct weapon family, in keeping
      with how a Meganob's entire loadout is everything a Boy carries, scaled
      up and overbuilt.
    design: >-
      REVISED (lore fix): rebuilt to match the Kustom Shoota's own corrected
      damage tier (10d pi+, see that entry) rather than the old, too-weak
      baseline, since both represent the same "kustom, one tier up" class of
      Ork weapon regardless of pistol or rifle profile - the same
      relationship the Snazzgun already shares with the Kustom Shoota.
      Exact dice distribution matches the Kustom Shoota exactly (79.5% vs
      flak, 0% vs carapace or better), delivered as a pistol-profile weapon
      a Meganob can fire one-handed alongside a power klaw. Handling
      re-derived for the bigger charge: weight up from 14 lb to 16 lb,
      heavier than the plain Slugga's own corrected 5 lb for the Meganob-
      scale frame (the same weight jump the Astartes-pattern bolt pistol
      takes over the human one); min ST bumped to 19 (raw formula
      sqrt(10x16)=12.6, bumped for the punishing recoil of a genuinely big
      cartridge on a pistol frame, the same logic the Imperium Bolt Pistol's
      own ST bump and the plain Slugga's own correction both use) - well
      within a mega-armoured Meganob's servo-assisted strength, out of reach
      for a bare Boy. Shots trimmed to 10(4) for the bigger cartridge; Rcl
      bumped to 4, matching the family-wide correction for the heavier
      round. RoF 3 and Bulk -4 are unchanged pistol figures. Malf 13, the
      framework's kustom-job rating, unchanged.

  - name: Kustom Mega-Blasta
    tl: 7
    lc: 0
    cost: 4000
    weight: 30
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Standard
        damage: 6dx4(2) burn ex
        acc: 1
        range: 100/300
        rof: 1
        shots: 4(10)
        st: 22
        bulk: -6
        rcl: 2
        skill: Beam Weapons (Rifle)
        notes: >-
          Malf 13 (kustom job). On a malfunction the containment coil fails
          catastrophically: the wielder immediately takes 3d(5) burn ex, and
          the weapon is disabled until a Mek repairs it (Mechanic (Ork Tech)
          roll, GM's discretion on time and difficulty).
    lore: >-
      The Big Mek's own signature weapon: a hand-built, unstable energy gun
      that Codex: Orks background repeatedly describes in the same breath as
      "as likely to explode as to work," yet devastating when it doesn't.
      Widely depicted (Codex art, Black Library's Ghazghkull Thraka: Prophet
      of the Waaagh!) as a one-of-a-kind weapon specific to the Mek who built
      it, rather than a mass-produced pattern.
    design: >-
      No framework anchor covers this item by name, so it is built as an Ork
      answer to the Imperium's plasma family - the closest real-world
      analogue to "unstable energy weapon that occasionally kills its own
      user" this project already has a design pattern for (see the Plasma
      Gun's supercharged-mode Malf 14 rule) - but pushed further into Ork
      unreliability territory. Checked by exact dice distribution: 6dx4(2)
      burn ex averages 84 and penetrates Astartes power armour (DR 100, eff.
      50) 98.0% of the time and even a Terminator (DR 200, eff. 100) 14.5% of
      the time, putting it in the same tier as the Imperium Plasma Gun
      against Astartes plate while falling well short of a lascannon against
      the heaviest armour on the table - a Big Mek's toy is a real
      Marine-killer, not a tank-killer. Against vehicles it clears AV10
      (98.0%) and usually AV11 (72.1%) but fails AV12 upward. Handling: 30
      lb, a genuinely heavy hand weapon reflecting a bulky, improvised
      containment vessel; min ST 22 (a Boy's own strength, per the
      framework's "built for Ork hands" rule, though in practice usually a
      Big Mek or a burly Boy carries it). RoF 1 and Shots 4(10): a slow,
      unstable capacitor that must fully recharge between shots and holds
      only a handful of charges before needing a lengthy re-arm. Bulk -6 and
      Rcl 2 fit a heavy two-handed energy weapon. Acc 1, the standard Ork
      figure - a Mek's genius goes into raw power, never sights. Malf 13
      (kustom job) with the explicit misfire-injury note, since "as likely
      to explode as to work" is exactly the fiction's own description and
      deserves a real mechanical consequence, not just a jam.

  - name: Zzap Gun
    tl: 7
    lc: 0
    cost: 6000
    weight: 70
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Braced/mounted
        damage: 6dx5(3) burn
        acc: 0
        range: 150/450
        rof: 1
        shots: 3(15)
        st: 20M
        bulk: -8
        rcl: 1
        skill: Gunner (Beams)
        notes: >-
          Malf 12, the worst reliability rating this project assigns to any
          weapon. On a malfunction, the accumulated charge discharges
          backward through the gubbinz: the gun is destroyed and every Ork
          within 2 yards (including the gunner) takes 3d(5) burn ex. Some
          Mekboyz claim a bigger Waaagh! nearby makes a Zzap Gun behave; a GM
          running a large Ork force in full cry may rule that Malf improves
          by 1 for every ten-plus Orks fighting within earshot, as pure
          battlefield colour rather than a tracked mechanic.
    lore: >-
      A capacitor-and-lightning-rod contraption built by Meks who barely
      understand the archeotech-adjacent principles they're copying, the
      Zzap Gun charges up over a long, crackling moment before discharging a
      bolt Codex: Orks background credits with punching clean through tank
      armour and Terminator plate alike - when it doesn't simply detonate in
      the crew's faces first, a risk the same background treats as an
      accepted cost of owning one.
    design: >-
      No framework anchor covers this item by name, but the framework's
      Ork-tech table explicitly calls out the Zzap Gun as a worked example
      of "Malf 12, huge damage." Built as the single hardest-hitting
      Ork energy weapon in this file: 6dx5(3) burn (avg 105, no "ex" -
      it is a single coherent bolt, not a bursting warhead) clears every
      personal armour on the table essentially always (100%/100%/100%/100%)
      and still beats a Terminator 96.4% of the time - a genuine
      Terminator-killer, as the anchor and lore both demand. Against
      vehicles it clears AV10-12 at or above 96% and remains a real threat
      even at AV13 (72.1%), only tailing off against AV14 (27.9%) -
      "punches through tank armour," exactly as described, short of
      guaranteeing a Land Raider kill the way a lascannon does. Handling: 70
      lb, a genuinely huge weapon built around a charge coil and accumulator
      rather than a compact reactor; the raw ST formula gives
      sqrt(10x70)=26.5, but every depiction shows it braced on a mount or a
      Big Mek's own reinforced frame, so it takes the M suffix at ST 20 the
      way the Imperium Lascannon does. RoF 1 and a slow Shots 3(15): the
      accumulator needs a genuinely long charge-up between shots, the
      longest reload in this file, matching its "crackling for a long
      moment before it fires" depiction. Bulk -8 and Rcl 1 (an energy
      discharge, no propellant kick) fit a heavy support weapon. Acc 0: no
      Ork ever built decent sights for this thing. Malf 12 is the
      framework's own explicit worked figure for this weapon, with a real
      misfire consequence (rather than a mere jam) reflecting "as likely to
      kill the crew as the target," and the WAAAGH!-bonus note is written up
      exactly as the assignment specifies: optional GM colour, not a tracked
      mechanic.

  # -------------------------------------------------------------- flame weapons

  - name: Burna
    tl: 6
    lc: 0
    cost: 400
    weight: 15
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Flame jet (single burst)
        damage: 3d burn
        range: 4
        rof: 1
        shots: 1(4)
        st: 12
        bulk: -5
        skill: Liquid Projector (Flamethrower)
        notes: Malf 13 (kustom job). Cone attack out to the listed range; no Acc applies, per the Imperium flame-weapon rules this entry follows.
      - usage: Flame jet, follow-up (per turn if target catches fire)
        damage: 1d burn
        range: 4
        rof: 1
        shots: 1(4)
        st: 12
        bulk: -5
        skill: Liquid Projector (Flamethrower)
        notes: Ignores DR; see Flame Weapons (Imperium) for the ignition rule.
      - usage: Cutting torch (melee)
        damage: thr+1d(2) burn
        reach: C,1
        parry: "No"
        st: 12
        skill: Axe/Mace
        notes: >-
          A Mek's actual tool: burnas are built to cut plate and weld
          wreckage as much as to burn infantry, and Ork Boyz press them into
          melee use constantly. Cannot parry with the lit torch head.
    lore: >-
      Originally a Mekboy's cutting and welding tool, the burna is pressed
      into service as a crude flamethrower by any Ork strong enough to carry
      one - background material (Codex: Orks) is explicit that its two uses
      are the same piece of kit, not two separate items, and Ork fiction
      shows Burna Boyz using the torch head to carve through both bulkheads
      and enemies interchangeably.
    design: >-
      The flame-jet mode reuses the Imperium Flamer's own damage and
      follow-up profile unchanged (3d burn / 1d burn ignoring DR - see the
      Imperium flame-weapon file), since nothing in Ork background suggests
      its raw output differs from a human-portable flamer's promethium jet,
      only its build quality and reliability. The cutting-torch mode is
      built as a short-range, DR-piercing melee tool rather than a weapon
      with an anchor: thr+1d(2) burn represents a focused cutting flame at
      point-blank range, armour divisor (2) for the way a torch head
      concentrates heat through a seam rather than across a broad hit,
      cannot parry since the wielder is holding a lit torch, not a blade.
      Handling: 15 lb loaded, a heavy hand tool with an integral fuel tank;
      min ST 12 for the ranged mode (a Boy manages it without difficulty).
      Range 4, shorter than the Imperium flamer's, for a smaller, cruder
      nozzle; Shots 1(4), one fuel charge per burst with a slow, jury-rigged
      reload. Bulk -5 fits a bulky two-part device. Malf 13, the kustom-job
      rating, since every burna is a Mek's individual, hand-modified tool
      rather than a mass-produced pattern.

  - name: Skorcha
    tl: 6
    lc: 0
    cost: 1200
    weight: 35
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Flame jet (single burst)
        damage: 5d burn
        range: 7
        rof: 1
        shots: 1(6)
        st: 18
        bulk: -6
        skill: Liquid Projector (Flamethrower)
        notes: Malf 14. Cone attack out to the listed range; no Acc applies.
      - usage: Flame jet, follow-up (per turn if target catches fire)
        damage: 1d+1 burn
        range: 7
        rof: 1
        shots: 1(6)
        st: 18
        bulk: -6
        skill: Liquid Projector (Flamethrower)
        notes: Ignores DR; see the Burna's follow-up note.
    lore: >-
      A heavier, vehicle-scale burna carried by especially big Orks or
      mounted as a Battlewagon and Deff Dread weapon; Codex: Orks background
      places it a clear step above the hand-held burna in both reach and
      fuel capacity, used for clearing entrenched infantry ahead of an Ork
      advance rather than as a Mek's personal tool.
    design: >-
      One size class up from the Burna's flame-jet mode (no cutting-torch
      mode - this is a dedicated infantry-clearing weapon, not a Mek's
      multitool): 5d burn (avg 17.5) and a proportionally bigger follow-up
      (1d+1 vs. the Burna's 1d). Like every flame weapon in this project it
      has no armour divisor and is not checked against DR-heavy targets;
      its role is unarmoured and lightly-armoured infantry, matching the
      lore's "clearing entrenched infantry" framing. Handling: 35 lb, a
      genuinely heavy two-handed or mounted weapon with a much bigger fuel
      tank than the Burna's; min ST 18 (raw formula sqrt(10x35)=18.7,
      essentially unmodified) sits above a Boy's own 22... no, below it -
      comfortably within a Boy's strength and easy for a Nob. Range 7,
      longer than the Burna's 4 for a proper nozzle rather than a
      cutting-torch head. Shots 1(6), a bigger tank than the Burna's with a
      correspondingly slower refill. Bulk -6 fits its size. Malf 14, plain
      Ork-issue rather than a Mek's individual kustom job, since Skorchas
      are built to a more consistent (if still crude) pattern for
      squad-level issue.

  # -------------------------------------------------------------- grot & kombi

  - name: Grot Blasta
    tl: 5
    lc: 0
    cost: 25
    weight: 3
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Standard
        damage: 2d+1 pi
        acc: 0
        range: 50/150
        rof: 3
        shots: 10(4)
        st: 5
        bulk: -2
        rcl: 2
        skill: Guns (Pistol)
        notes: Malf 14.
    lore: >-
      A cut-down, simplified slugga built to a Gretchin's much smaller hands
      and much smaller strength; Codex: Orks background and Ork army art
      consistently show armed Grots carrying an obviously scaled-down,
      even-more-slapdash version of Ork small arms rather than a full-sized
      weapon they couldn't hope to lift or aim.
    design: >-
      Not simply scaled down from the Slugga - even the corrected Slugga (7d
      pi+, see that entry) would make a Gretchin's own gun a real threat to
      flak, which contradicts every depiction of an armed Grot as expendable
      support fire rather than a combat threat in its own right. Built
      instead for a Gretchin's own frame (ST 8 per the framework's Ork
      table) from a genuinely smaller, lighter cartridge a Grot can actually
      cycle: 2d+1 pi (avg 8), dropping the pi+ wounding bonus the bigger Ork
      small arms all share. Exact dice distribution: 0% against flak (DR 30)
      or better - a real threat only to an unarmoured target, keeping the
      Grot Blasta the one deliberately weak entry in this file rather than a
      miniature Slugga, per the coordinator's explicit "grot blasta a weak
      pistol" instruction. Handling: 3 lb, a genuinely small pistol; min ST
      5 (raw formula sqrt(10x3)=5.5, rounded down to sit within a Grot's own
      ST 8, since even a poorly-made pistol this light needs little
      strength) - a Grot fires it with no difficulty, though the same crude
      Ork engineering that makes every entry on this page unreliable still
      applies. RoF 3, Shots 10(4), Bulk -2 and Rcl 2 are all scaled-down
      pistol figures, unchanged. Acc 0, since even the shoota family's
      already-low sights are further degraded on a Grot-built copy. Malf 14,
      unchanged - Ork tech doesn't get more reliable just because a Grot is
      holding it.

  - name: Kombi-Weapon, Shoota/Rokkit
    tl: 6
    lc: 0
    cost: 1200
    weight: 40
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Shoota barrel
        damage: 9d pi+
        acc: 1
        range: 150/500
        rof: 10
        shots: 16(5)
        st: 18
        bulk: -6
        rcl: 4
        skill: Guns (Rifle)
        notes: Malf 14.
      - usage: Rokkit barrel (single shot)
        damage: 6dx4(3) cr ex
        acc: 1
        range: 150/450
        rof: 1
        shots: 1(8)
        st: 18
        bulk: -6
        skill: Guns (Rifle)
        notes: Malf 14. One rocket before the auxiliary tube must be reloaded by hand.
    lore: >-
      An Ork answer to the Imperium's combi-weapons: a shoota with a single
      rokkit tube welded underneath or alongside the barrel, letting a Nob
      or Mek carry an anti-armour answer without giving up a rifle's worth of
      dakka; Ork army art and Codex background both show these improvised
      combination weapons as a recurring, if unofficial, field modification.
    design: >-
      REVISED (lore fix): the shoota barrel now follows the plain Shoota's
      own corrected profile (9d pi+, avg 31.5, see that entry - 57.6% vs
      flak, 0% vs carapace or better) rather than the old, too-weak 7d
      baseline, with a slightly reduced magazine (16 vs. the plain Shoota's
      24) to make room for the rokkit tube's mounting hardware; the rokkit
      barrel reuses the Rokkit Launcha's damage line unchanged (6dx4(3) cr
      ex) for a single shot, since welding a second tube onto a shoota
      doesn't change the warhead inside it. Handling: both barrels share one
      stock, so both usage lines carry the same figures. 40 lb loaded,
      heavier than before for the plain Shoota's own corrected 20 lb housing
      plus the Rokkit Launcha's 20 lb tube, trimmed for a shared stock
      rather than two complete weapons; min ST 18 (above the plain Shoota's
      own corrected ST 16, for the added mass and unbalancing rocket tube,
      but well within a Boy's or Nob's strength); Rcl 4, matching the plain
      Shoota's own corrected figure. RoF is per-mechanism, not copy-pasted:
      the shoota barrel keeps RoF 10 (dakka), the rokkit barrel RoF 1 (a
      single warhead that must be hand-loaded). Bulk -6, one step worse than
      the plain Shoota's -5, for the awkward extra tube, unchanged. Malf 14
      on both barrels, standard Ork gear - this is a field-welded
      combination, not a Mek's individually kustom job.

