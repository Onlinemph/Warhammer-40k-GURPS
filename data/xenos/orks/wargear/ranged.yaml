      weapons were not part of the coordinator's rescale and are unaffected.
      Handling: 36 lb, lighter than the Shoota/Rokkit's 40 lb for a fuel
      tank instead of a heavier rocket tube, both up from before to reflect
      the plain Shoota's own corrected, heavier housing; min ST 18, Bulk -6
      and Rcl 4 as the Shoota/Rokkit, since both kombi patterns share the
      same basic shoota-plus-auxiliary-tube construction and the same
      corrected shoota barrel. Malf is per-barrel: the shoota half stays at
      plain Ork-issue 14, while the burna half keeps the standalone Burna's
      kustom rating of 13, since the flame nozzle is still an individual
      Mek's hand-fitted work even when welded onto someone else's shoota.

  # -------------------------------------------------------------- thrown

  - name: Stikkbomb (Frag)
    tl: 4
    lc: 0
    cost: 15
    weight: 1
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Thrown
        damage: 4d cr ex [4d]
        acc: 0
        range: "x1/x1.5 x ST"
        rof: 1
        shots: 1(3)
        st: 8
        skill: Throwing
        notes: >-
          A crude pin-and-tin-can bomb; GM's discretion whether a natural 17
          on the throw roll represents a genuinely early or dud fuse rather
          than simply a bad throw, in keeping with Ork gear's general
          unreliability, though this project does not assign it a formal
          Malf rating since it's a thrown weapon, not a mechanism that can
          jam.
    lore: >-
      The Ork hand grenade: a tin can packed with whatever explosive and
      scrap-metal shrapnel a Boy could get his hands on, thrown rather than
      launched, and depicted throughout Codex: Orks and Ork army background
      as a standard-issue Boy weapon alongside the choppa and slugga.
    design: >-
      Scaled from this project's own established "standard hand grenade"
      baseline (3d cr ex [3d], used as the reference point for the Imperium
      Missile Launcher's frag warhead) up by one die for a bigger, less
      carefully packed charge - crude Ork munitions favour more explosive
      filler over precision engineering - giving 4d cr ex [4d]. It carries no
      armour divisor and is not checked against the personal-armour or
      vehicle-AV tables, matching every other frag-grenade entry in this
      project: its job is infantry and light cover, not armour. Handling:
      thrown per Basic Set rules from the wielder's own ST and Throwing
      skill rather than a weapon profile of its own; 1 lb per bomb, a
      generic thrown-weapon weight. TL4 reflects that a fused explosive
      charge in a tin can needs no real industry behind it, matching the
      framework's "primitive/feral worlds" TL bracket even though it's
      built and carried by a spacefaring greenskin empire.

  - name: Tankbusta Bomb
    tl: 6
    lc: 0
    cost: 120
    weight: 6
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Thrown or planted
        damage: 6dx3(3) cr ex
        acc: 0
        range: "x1/x1.5 x ST"
        rof: 1
        shots: 1(10)
        st: 12
        skill: Throwing
        notes: >-
          Planting the bomb directly against a vehicle's hull (a Committed
          Attack against an adjacent or grappled target, GM's discretion)
          removes the throwing roll's range and Acc penalties entirely -
          Tankbustas favour sticking a bomb to the plate over lobbing it.
    lore: >-
      The signature weapon of Tankbusta mobs: a heavy, shaped-charge satchel
      bomb thrown or slapped directly onto a vehicle's hull, magnetic clamps
      and all; Codex: Orks background is explicit that Tankbustas exist
      specifically to close with and personally wreck Imperial armour this
      way when rokkits alone aren't enough.
    design: >-
      Built as a hand-thrown shaped charge between the Rokkit Launcha and
      the Imperium Krak Missile on the anti-armour scale, sharing the same
      armour divisor (3) as both: 6dx3(3) cr ex (avg 63). Checked by exact
      dice distribution against the vehicle table: clears AV10 (99.0%) and
      AV11 (85.5%) reliably, drops to 36.3% at AV12 and 1.0% at AV13,
      failing outright at AV14 - a real threat to Chimeras, Rhinos and
      Sentinels, an even bet against a Predator-weight hull, and no real
      threat to a Leman Russ or Land Raider without a whole mob's worth of
      charges, matching the fiction's Tankbusta mobs swarming a vehicle
      rather than relying on one bomb. Against personal armour it also
      clears Astartes power armour 99.0% of the time and a Terminator 36.3%
      of the time - a genuine Marine-killer at melee range, matching its
      "get close and blow it up" doctrine. Handling: thrown per Basic Set
      rules; 6 lb per bomb (heavier than a stikkbomb for the real
      shaped-charge liner and magnetic clamp); min ST 12 is the practical
      minimum to throw the extra weight effectively, per Basic Set thrown-
      weapon convention, though a Boy or Nob manages it easily. Shots 1(10):
      a single-use charge with the long fuse-and-clamp setup counted as the
      "reload" between uses in a squad's shared satchel.

  # -------------------------------------------------------------- weird weapon

  - name: Shokk Attack Gun
    tl: "6^"
    lc: 0
    cost: 20000
    weight: 90
    tags: [Missile Weapon, Xenos, Orks]
    weapons:
      - usage: Standard (see design)
        damage: 6dx3 cr [4d cr]
        acc: 0
        range: 200/600
        rof: 1
        shots: 1(10)
        st: 24M
        bulk: -8
        rcl: 1
        skill: Gunner (Beams)
        notes: >-
          Not a normal ranged weapon: see design for the full randomiser
          rule. Malf 13, but a malfunction here does not merely jam the gun -
          roll on the misfire table below instead of a normal malfunction
          result.
    lore: >-
      Perhaps the strangest weapon in the Ork arsenal: a Mek jams a live
      Snotling into a chamber, opens a hole into (or through) the warp with
      a crude Waaagh!-powered field generator, and the Snotling is flung -
      still alive, and usually furious about it - directly into the enemy at
      the far end, materialising with enough violent, uncontrolled kinetic
      energy to flatten whatever it lands on or near. Codex: Orks background
      is explicit that the weapon is as dangerous to the Ork operating the
      readied hopper of Snotlings as to the enemy, since a snatched Snotling
      can just as easily reappear in the gun's own crew, or not reappear at
      all, or reappear as something other than a Snotling, and older Ork
      lore openly credits the whole process as barely-understood even by
      the Meks who build it.
    design: >-
      No framework anchor exists for this weapon and none of the framework's
      normal per-shot derivations (fixed Acc/RoF/Shots/Bulk figures feeding a
      clean to-hit-then-damage resolution) actually fit its own fiction, so
      this entry is built honestly as a deliberately weird weapon rather than
      forced into the standard mould: the "damage" line above is a working
      baseline for a Snotling's violent, uncontrolled materialisation (a
      solid, unarmoured-scale impact, no armour divisor - the Snotling itself
      does the hitting, not a penetrator) with a fragmentation-style spread
      bracket standing in for "sometimes it lands short, or off to the side,
      or on top of something else nearby" rather than a literal frag pattern.
      A GM is expected to actually run the following table on the attack
      roll rather than a plain hit/miss, per the fiction's own description
      of the gun as unpredictable in principle, not merely low-Acc in
      practice: on a normal hit, the Snotling appears on the target as the
      damage line states; on a miss, roll 1d - on 1-2 the Snotling
      materialises 1d yards short in a random direction and the attack still
      resolves against whatever (or whoever) is there instead; on 3-4 it
      fails to cross over at all (a wasted shot); on 5 it reappears
      somewhere near the gun itself instead (treat the gunner's own mob as
      the target); on 6 something other than the intended Snotling comes
      through - a chunk of terrain, a very surprised animal, or worse, at the
      GM's discretion, with no guaranteed damage at all. This is offered as
      one honest, playable version of "warp-teleporting snotlings," not a
      claim to a single canonical mechanic; no source this project uses gives
      exact numbers for how the effect actually resolves, so none are
      invented here beyond what's needed to put the weapon on a table.
      Handling: 90 lb loaded (a heavy, backpack-and-hopper rig feeding live
      Snotlings into the chamber) with the M suffix and a raw
      sqrt(10x90)=30-adjacent ST 24, since it is always shown mounted on a
      dedicated frame or carried by an unusually large Ork rather than
      shouldered like a rifle. RoF 1 and Shots 1(10): one Snotling at a time,
      with a slow, awkward reload as the next one is wrestled into the
      chamber. Bulk -8 and Rcl 1 (there is no propellant charge, only the
      warp-field discharge) fit a heavy, backpack-scale weapon. Acc 0: by
      design, nobody aims a Shokk Attack Gun so much as points it and hopes.
      Malf 13 with its own misfire table rather than a plain malfunction
      result, since "it works 'cos we fink it does" is stretched to its
      breaking point by a weapon that is trying to open a hole in reality -
      a failure here should read as stranger and more dangerous than an
      ordinary jam, without this project inventing a full warp-rift subsystem
      the framework doesn't otherwise support.
