kind: equipment
output: Xenos/Orks/Weapons/Ork Melee Weapons.eqp
items:

  - name: Choppa
    tl: 4
    lc: 0
    cost: 30
    weight: 10
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Swing
        damage: sw+3 cut
        reach: 1
        parry: "-1U"
        st: 11
        skill: Axe/Mace
    notes: >-
      Ork blades are all edge and mass, not balance; a choppa is never
      "sharp" in the fine sense, but a Boy's own strength does the real
      work.
    lore: >-
      The choppa is the other half of every Boy's standard loadout alongside
      the slugga: a heavy, crudely-forged cleaver, machete or cut-down sword
      welded from scrap and scavenged plate, and the single most common Ork
      melee weapon in Codex: Orks background, Deathwatch's Mark of the
      Xenos, and every piece of Ork army art the game has ever produced.
    design: >-
      Matches the framework's Ork anchor exactly ("Choppa | Crude cleaver,
      sw+3 cut, parry -1U"). At a Boy's own ST 22 (sw approx. 3d+2) this
      averages roughly sw+3=3d+5, comparable in raw power to an Imperium
      chainsword in Astartes hands despite having no motor or armour
      divisor at all - the framework's own point that Ork weapons
      "compensate for crude construction with a Boy's raw strength," not
      with mechanism. Handling: weight 10 lb, heavier than any human-scale
      cutting weapon on this project's Imperium melee page (the Chainaxe,
      at 15 lb, is the closest comparison) for the crude, over-thick,
      badly-balanced blade every choppa depiction shows; min ST 11 (a real,
      if rough, forged blade this heavy needs genuine strength to swing with
      any control) is trivial for a Boy and out of easy reach for an
      unaugmented human, matching the constant depiction of looted choppas
      being unwieldy in human hands. Skill Axe/Mace and parry -1U, per the
      anchor directly and consistent with every other heavy chopping weapon
      on the project's Imperium melee page (the Chainaxe, Power Axe, etc.).

  - name: Big Choppa
    tl: 4
    lc: 0
    cost: 60
    weight: 18
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Swing, two-handed
        damage: sw+4 cut
        reach: "1,2"
        parry: "-1U"
        st: 15
        skill: Two-Handed Axe/Mace
    notes: A big two-handed cleaver, often favoured by Nobz who forgo a shield hand.
    lore: >-
      A two-handed, oversized choppa favoured by Nobz and mob bosses who want
      more reach and more raw hitting power than a one-handed choppa without
      going as far as a power klaw; a recurring silhouette in Codex: Orks
      Nob artwork and background, distinguished from the standard choppa
      mainly by size and the two-handed grip.
    design: >-
      One step up the same Basic Set two-handed-weapon-over-one-handed
      relationship this project uses elsewhere (the Imperium Eviscerator
      over the Chainaxe, or the Thunder Hammer's two-handed grip over a
      one-handed power maul): +1 die over the Choppa anchor's sw+3 cut,
      giving sw+4 cut, two-handed, reach 1,2. At a Nob's own ST 26 (sw
      approx. 4d+1) this averages roughly 4d+5 - a genuinely brutal blow
      against unarmoured or lightly-armoured targets, with no armour
      divisor and (checked by exact dice distribution) 0% against flak (DR
      30) or better, keeping it - like the plain choppa - a horde and
      infantry weapon rather than a threat to real armour, exactly the
      niche a mundane, unpowered Ork blade should occupy relative to the
      power klaw below. Handling: weight 18 lb (heavier than the one-handed
      choppa's 10 lb for the bigger blade and two-handed haft), min ST 15
      (comfortable for a Nob, a real stretch for a Boy, unreachable for an
      unaugmented human), Two-Handed Axe/Mace skill and parry -1U matching
      the same convention as every heavy chopping weapon on this and the
      Imperium melee page.

  - name: Killsaw
    tl: 6
    lc: 0
    cost: 6000
    weight: 42
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Punch/cut
        damage: thr+7d(10) cut
        reach: C
        parry: -2
        st: 22
        skill: Brawling
    notes: >-
      Cannot be used to Feint, as the Imperium Power Fist and Chainfist it's
      built from. Like the power klaw, the ring of chain-teeth carries a
      genuine (if crudely copied and worse-shielded) disruption field behind
      its spinning edge - Ork background is explicit that a killsaw bites
      through vehicle hulls and bulkheads the way a plain chain weapon
      never could, and this project models that with the same Armor Divisor
      every disruption-field weapon in this project shares, not with a
      bigger mundane blade. The teeth can still bind in a very solid hit
      exactly as an Imperium chainaxe's can (GM's discretion: a Ready
      maneuver to wrench it free).
    lore: >-
      A huge, motorised chain-blade mounted on a Meganob's arm alongside (or
      instead of) a power klaw, built for boarding actions and breaching
      where cutting through plate matters; Codex: Orks background places it
      as the Ork parallel to the Imperium chainfist, and is explicit that it
      genuinely cuts into tank hulls and bulkheads in the field - not merely
      a bigger version of a Boy-scale choppa's chain-teeth.
    design: >-
      REVISED (lore fix): the previous build treated the killsaw as a
      mundane grinding-chain mechanism on the Imperium Chainaxe/Chainfist
      model with its own Armor Divisor (3), which left it unable to hurt
      power armour or a vehicle in any reliable way (0.1% vs Astartes plate,
      effectively 0% vs every vehicle AV) - directly contradicted by Ork
      background's own claim that a killsaw cuts through tank hulls and
      bulkheads. Rebuilt instead exactly on the Imperium Power Fist/Chainfist
      chassis the coordinator specified: thr+7d(10) cut, the Chainfist's own
      formula (see data/imperium/weapons/melee.yaml), reasoned here as a
      crude, worse-shielded disruption field a Mek has copied or looted
      into the chain housing rather than a plain mechanical grind - "cruder"
      is carried in cost, upkeep and the entry's own tone, not a weaker
      divisor, exactly the same design choice this file already makes for
      the Power Klaw relative to the Imperium Power Fist. Checked by exact
      dice distribution at the mega-armour-assisted strength a Meganob
      fights at (effective thrust around thr 3d+1, so thr+7d = 10d+1): avg
      36, penetrating every personal armour on the table at or above 99.9%,
      including a Terminator, and clearing AV10-12 essentially always,
      AV13 94.2% of the time and even AV14 53.6% of the time - reaching (and,
      at a Meganob's own greater bulk, slightly exceeding) the Astartes
      Chainfist's own benchmark figures, exactly the "must reach
      chainfist-level armour penetration" the coordinator asked for, and
      finally matching the fiction's own claim that killsaws open up tank
      hulls and bulkheads rather than merely chewing infantry. Handling:
      weight up from 40 lb to 42 lb and cost up sharply (a genuine
      field-bearing weapon, not a plain motorised blade, costs and weighs
      accordingly, in line with the Power Klaw's own price jump over a
      mundane chain weapon); reach C, parry -2 and the no-Feint note are
      taken directly from the Imperium Power Fist/Chainfist, since a
      fist-and-forearm-mounted spinning chain ring fights exactly like a
      servo-driven punching weapon, not a swung two-handed blade - this also
      corrects the skill to Brawling (unarmed-style, arm-mounted) in place
      of the previous Two-Handed Axe/Mace, matching how the Imperium
      Chainfist itself is built despite sharing a name with the swung
      Chainaxe. Min ST 22, reachable by mega armour's own servo assistance
      or an unusually huge Ork, per the notes.

  - name: Power Klaw
    tl: 7
    lc: 0
    cost: 9000
    weight: 45
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Punch/crush
        damage: thr+8d(10) cr
        reach: C
        parry: "-2"
        st: 22
        skill: Brawling
        notes: >-
          Cannot be used to Feint, as the Imperium power fist it's built
          from. The field is a genuine disruption field (built, per Ork
          fashion, by copying or looting the principle rather than
          understanding it) and shares the project's power-field Armor
          Divisor (10).
    lore: >-
      The Ork answer to the power fist and the single most iconic Nob and
      Meganob weapon: a huge armoured gauntlet crackling with an unstable
      energy field, consistently shown across Codex: Orks background and
      Black Library Ork fiction crushing Space Marines, vehicle hulls and
      even Dreadnoughts one-handed - the framework's own anchor table cites
      it by name as "like a power fist but cruder."
    design: >-
      Matches the framework's Ork anchor exactly ("Power klaw | Power-field
      weapon: thr+8d(10) cr, like a power fist but cruder"), built with the
      same first-principles logic as the Imperium Power Fist: the field's
      own servos generate most of the force, so the bonus is a large flat
      die addition to the wielder's own thrust (thr+8d) rather than a
      multiplier, and it shares the project's Armor Divisor (10) power-field
      rule. Checked by exact dice distribution at a mega-armoured Meganob's
      effective thrust (around thr 3d+1, giving thr+8d = 11d+1): avg 39.5,
      penetrating every personal armour on the table essentially always,
      including a Terminator (100%) - matching the anchor's own "like a
      power fist ... kills Terminators" reputation and the fiction's
      constant depiction of power klaws cracking open Dreadnoughts and
      Terminator squads alike. Even at a bare Boy's own strength (thr 2d,
      thr+8d=10d, avg 35) it still clears every personal armour at or above
      99.7%, since the field itself - "cruder" than the Imperium version,
      per the anchor, but not meaningfully weaker in its actual armour-
      divisor effect - is doing almost all of the penetrating work
      regardless of who swings it. "Cruder" is modelled instead in cost,
      reliability and the entry's own tone rather than a lower divisor,
      since dropping the divisor below (10) would break the anchor's own
      explicit "like a power fist" equivalence. Handling: 45 lb, matching
      the Imperium Power Fist's own weight class for a similarly huge
      servo-driven gauntlet; min ST 22 (a Boy's own strength, though in
      practice almost always a Nob or Meganob wears one, per the framework's
      "built for Ork hands" convention). Reach C, parry -2 and the no-Feint
      note directly mirror the Imperium Power Fist's own handling rules,
      since both weapons share the same "huge servo-fist, slow to
      reposition" fighting style.

  - name: Power Stabba
    tl: 7
    lc: 0
    cost: 5000
    weight: 20
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Field on, thrust
        damage: thr+3d+2(10) imp
        reach: 1
        parry: "-1U"
        st: 18
        skill: Spear
      - usage: Field off (as plain iron stake)
        damage: thr+2 imp
        reach: 1
        parry: "-1U"
        st: 18
        skill: Spear
    notes: Field toggle as the Imperium Power Sword family; a depleted or crudely-wired cell disables the field the same way.
    lore: >-
      A rarer, thrusting cousin of the power klaw - a heavy iron stake or
      spike wrapped in the same crude field generator - favoured by Nobz who
      want to punch through a target rather than crush it; less iconic than
      the power klaw but recurring in Ork background as an alternative Nob
      power weapon.
    design: >-
      Applies this project's power-field rule (framework.md: +3d damage,
      Armor Divisor (10), field on vs. off) to a plain heavy iron stake's
      mundane baseline (thr+2 imp, one step above a bare thrusting spike for
      the sheer mass of Ork ironwork) rather than to the power klaw's own
      crushing baseline, since a stabbing spike and a crushing gauntlet are
      not the same mundane weapon with a field bolted on. Checked by exact
      dice distribution at a Nob's own strength (thr approx. 2d+1, so field
      on totals thr+2+3d = 5d+3): avg 20.5, penetrating every personal
      armour at or above 99.7% up to Astartes power armour, and 50.0% of the
      time even against a Terminator - a genuinely dangerous power weapon in
      a Nob's hands, on the same tier as the Imperium's own human-scale
      Power Sword against comparable armour, matching its place as a real
      but secondary alternative to the power klaw. Handling: 20 lb (lighter
      than the Power Klaw's 45 lb - a spike and generator, not a full
      gauntlet), min ST 18 (a Nob manages it readily; a Boy struggles), Spear
      skill and reach 1 for a thrusting weapon, parry -1U matching the
      Imperium Power Lance's own crude, hard-to-recover braced-spear
      convention.

  - name: Grabba Stikk
    tl: 4
    lc: 0
    cost: 40
    weight: 12
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Swing
        damage: sw+1 cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Polearm
        notes: >-
          The hooked head can be used to make a Grapple attempt in place of
          damage (Basic Set grappling/takedown rules, GM's discretion on the
          exact maneuver) - a Grabba Stikk's whole point is dragging a
          target off its feet, out of cover, or off a trukk.
    lore: >-
      A long hooked pole Ork mobs use to drag fleeing enemies back into
      reach, pull a wounded comrade clear, or hook a Grot by the collar; a
      recurring, unglamorous piece of Ork kit in background art rather than
      a named weapon of note, more tool than trophy.
    design: >-
      Not anchored by the framework; built from Basic Set polearm design
      logic as a plain, long-hafted hooked pole (sw+1 cr, reach 1,2, parry
      0, per a standard polearm's Basic Set baseline) with the hook's real
      function - grappling rather than damage - called out as a GM-run
      option rather than a bespoke mechanic, since GURPS already has
      grappling rules this project prefers to reuse over inventing a new
      one. Handling: 12 lb for a long wooden or scrap-metal pole with an iron
      hook, min ST 10 (light work for any Ork, a real if manageable weapon
      for a strong human).

  - name: "'Urty Syringe"
    tl: 5
    lc: 0
    cost: 80
    weight: 2
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Thrust (injection)
        damage: thr-1 imp
        reach: C
        parry: -1
        st: 8
        skill: Knife
      - usage: Injection follow-up (if any wound is inflicted)
        damage: 2d(5) tox
        reach: C
        parry: -1
        st: 8
        skill: Knife
        notes: >-
          Whatever a Painboy has loaded the syringe with this time - crude
          anaesthetic, worse crude "medicine," or nothing helpful at all.
          GM's discretion whether a given dose is actually curative,
          genuinely toxic, or (per Ork medical practice) both at once.
    lore: >-
      A Painboy's oversized hypodermic, as often used to "fix" a patient as
      to threaten one into holding still for surgery; Codex: Orks background
      treats Painboyz' medical practice as simultaneously legitimate
      battlefield surgery (by Ork standards, which include successfully
      reattaching severed limbs and heads) and a source of constant dread
      for anyone made to sit still for it, the 'urty syringe being the
      visual shorthand for both.
    design: >-
      Not anchored; built as a short, thrust-only stabbing weapon on the
      Basic Set Knife profile (thr-1 imp, reach C, parry -1, matching the
      Imperium Munitorum Combat Knife's own corrected parry) with a tox
      follow-up standing in for whatever crude injection the needle
      actually delivers, left deliberately unspecified (per Ork medical
      background's own black humour) rather than statted as a single fixed
      poison. Handling: 2 lb, a hand-held hypodermic tool rather than a
      combat blade; min ST 8, trivial for any Ork, in reach of an
      unaugmented human too, since this is fundamentally a tool that
      sometimes doubles as a weapon rather than the other way around.

  - name: Mek's Kustom Tools
    tl: 6
    lc: 0
    cost: 200
    weight: 15
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Swing (wrench/hammer)
        damage: sw+1 cr
        reach: 1
        parry: "-1U"
        st: 11
        skill: Axe/Mace
    notes: >-
      Represents the whole belt of tools (big wrenches, welding clamps,
      choppy screwdrivers) a Mek carries rather than a single named item; a
      Mek wielding these in combat is understood to be improvising, not
      fighting with purpose-built wargear. When actually used for their
      intended job, this item gives no combat bonus but is required kit for
      any Engineer/Mechanic (Ork Tech) work a Mek attempts in the field.
    lore: >-
      Every Mekboy carries a belt or backpack of oversized, improvised tools
      - the same kit that builds and repairs Ork vehicles and wargear -
      and Ork background consistently shows Meks swinging a big wrench or
      cutting torch on anyone who gets between them and their latest project
      as readily as any Boy swings a choppa.
    design: >-
      Not a weapon anchor; built as a generic heavy improvised tool on the
      same Basic Set logic as the Imperium Entrenching Tool (sw+1 cr, reach
      1, parry -1U, Axe/Mace) rather than inventing a dedicated Mek melee
      weapon, since the fiction treats a Mek's tools as exactly that - tools
      pressed into service, not wargear. Handling: 15 lb for the practical
      weight of "a belt of Mek-scale tools," heavier than the Imperium
      Entrenching Tool (5 lb) for the sheer bulk a Mekboy hauls around; min
      ST 11, trivial for any Ork. The item's real value at the table is as
      the required equipment tag for a Mek's Engineer/Mechanic (Ork Tech)
      work (see framework.md's skills table: "Mekboyz build by instinct... a
      genetic Talent for Engineer/Mechanic/Armoury"), with the melee profile
      included for completeness rather than as the item's main purpose.

  - name: Weirdboy Staff
    tl: 4
    lc: 0
    cost: 100
    weight: 6
    tags: [Melee Weapon, Xenos, Orks]
    weapons:
      - usage: Swing
        damage: sw+1 cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
      - usage: Thrust
        damage: thr+1 cr
        reach: "1,2"
        parry: 0
        st: 10
        skill: Staff
    notes: >-
      Mechanically a plain quarterstaff. Ork lore holds that a Weirdboy's
      staff channels and focuses his psychic power (fed by nearby Orks'
      WAAAGH! energy, per framework.md's Ork psychic note), and background
      art always shows Weirdboyz carrying one crackling with barely
      restrained energy - but any actual psychic power the Weirdboy wields
      belongs to that psyker's own traits and powers (built on this
      project's Thaumatology: Sorcery chassis, see framework.md's Psykers
      and the Warp section), not to the staff itself. A GM wanting a staff
      that visibly arcs or sparks in a Weirdboy's hands is encouraged to
      treat that as pure colour tied to the wielder's own power, exactly as
      the framework already handles the Imperium Power Stave versus a
      psyker's force stave.
    lore: >-
      Every Weirdboy is depicted carrying a tall, gnarled or scrap-metal
      staff, often topped with a skull or crude glyphs, that background
      material (Codex: Orks) treats as a focus for the Weirdboy's own
      barely-controlled psychic power rather than as a weapon in its own
      right - Weirdboyz are dangerous for what they can do with the WAAAGH!,
      not for how hard they can hit with a stick.
    design: >-
      Deliberately statted as a mundane quarterstaff (sw+1 cr/thr+1 cr,
      reach 1,2, parry 0, Staff skill) per the assignment's own instruction,
      the same "mundane object, psychic power belongs elsewhere" logic this
      project already applies to the Imperium Power Stave versus a force
      stave (see the Imperium melee file): nothing in Ork background
      describes the staff itself doing anything a plain stick couldn't, and
      giving it a bespoke mechanical effect would invent a psychic-power
      interaction the framework's own Psykers and the Warp section doesn't
      support for this project's Ork material. Handling: 6 lb and min ST 10
      are ordinary Basic Set quarterstaff figures; Staff's own built-in
      defensive bonus (parry 0, no U) is unchanged from every other
      staff-family entry in this project.
