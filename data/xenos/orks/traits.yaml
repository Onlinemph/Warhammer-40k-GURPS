kind: traits
output: Xenos/Orks/Traits/Ork Physiology.adq
items:
  # ------------------------------------------------------------------ organs
  # Ork biology, greenskin culture and the Weirdboy's psychic gift, each as
  # its own trait so a GM can add or remove a piece the way the Astartes
  # gene-seed file lets a Chapter differ from the baseline. Calibrated to
  # framework.md's "Xenos > Orks" anchor table (ST/DX/IQ/HT/HP/SM) and its
  # Ork gear notes. Sources: Codex: Orks background across editions; Black
  # Library's Ork-focussed fiction, chiefly Nate Crowley's Ghazghkull
  # Thraka: Prophet of the Waaagh! and Mike Brooks' Brutal Kunnin', with
  # Dark Heresy/Rogue Trader/Deathwatch/Only War Ork material used per
  # framework.md's source order for relative calibration (how tough an Ork
  # is next to a human or a Marine), never for absolute numbers.

  - &thick_hide
    name: Thick Hide
    points: 10
    dr: {all: 2}
    ref: B46
    tags: [Advantage, Physical, Xenos, Orks]
    notes: DR 2, all locations. Stacks with worn armour.
    lore: >
      An Ork's skin is thick, rubbery and mottled green, tough enough on its
      own to turn a knife-edge or a glancing shot that would open a human.
      Every depiction of an unarmoured Ork brawling, in Codex background
      and Ork fiction alike, treats a bit of greenskin hide
      as meaningfully tougher than bare human flesh, well before any scrap
      armour goes on top of it.
    design: >
      Damage Resistance 2 (B46, 5/level, all locations, 10 points): modest
      next to the Ossmodula's partial DR 3 or Custodes-tier toughness, but
      applies everywhere and is on top of whatever armour an Ork straps on.

  - &high_pain_threshold
    name: High Pain Threshold
    points: 10
    ref: B59
    tags: [Advantage, Physical, Xenos, Orks]
    lore: >
      Orks shrug off wounds, keep fighting with an arm hanging by a
      tendon, and treat a lost eye as a minor inconvenience worth a good
      story later — a running joke across every Ork-focussed novel and a
      staple of Codex background ("'e's still comin'!").
    design: Basic Set High Pain Threshold (B59), 10 points, unmodified.

  - &hard_to_kill
    name: Hard to Kill
    points: 0
    per_level: 2
    levels: 3
    ref: B58
    tags: [Advantage, Physical, Xenos, Orks]
    notes: "+3 to HT rolls made solely to avoid death."
    lore: >
      An Ork that should be dead — gutshot, missing limbs, skull dented in
      — routinely keeps swinging until the fight is over, and often
      survives afterwards besides. Ghazghkull Thraka: Prophet of the
      Waaagh! plays this for both horror and comedy in the same scene more
      than once.
    design: "Hard to Kill 3 (B58, 2/level, 6 points): +3 to death checks, below a Warboss's own extra levels below."

  - &rapid_healing
    name: Rapid Healing
    points: 5
    ref: B79
    tags: [Advantage, Physical, Xenos, Orks]
    lore: >
      Wounds that would fester or kill close over in days rather than
      weeks — part of the same fungal biology that lets a beaten Ork mob
      be back at strength within a season. Codex background is explicit
      that Ork tissue heals unnaturally fast; Black Library plays it as
      "give it a week and 'e'll be grand."
    design: "Basic Set Rapid Healing (B79, 5 points): doubles effective HT for natural recovery rolls."

  - &injury_tolerance_no_brain
    name: Thick Skull
    points: 20
    ref: B46
    modifiers:
      - {name: "Partial (Skull only)", cost: "-70%", ref: B47}
    dr: {skull: 4}
    tags: [Advantage, Physical, Xenos, Orks]
    notes: >
      DR 4 on the skull only, on top of Thick Hide (skull DR 6 in total).
      Orks have brains and take normal extra injury from skull and eye hits
      once something gets through. House rule, not a priced trait: an Ork
      who loses a limb, or per the fiction even the head, to a crippling
      wound is not necessarily dead from that alone. A Painboy who recovers
      the part and staples or wires it back on within a scene or two
      restores it to function once the patient heals, using Surgery.
    lore: >
      Ork skulls are notoriously thick, and Orks survive head wounds that
      would kill anything else, up to having a head sewn back on by a Dok
      (Codex background and a long tradition of "'e's had
      worse" anecdotes). They do have brains: a bolt through the eye still
      kills an Ork.
    design: >
      Damage Resistance 4 (B46, 5/level, 20) with Partial (skull only):
      the GCS Basic Set data prices Partial at -10% per -1 of the
      location's hit penalty, and the skull is -7, so -70%: 20 x 0.3 = 6
      points. Replaced an earlier Injury Tolerance (No Brain), at the
      user's direction, because it made headshots meaningless against a
      species that does have a brain.

  - &resistant_to_disease_and_toxins
    name: Resistant to Disease and Toxins
    points: 15
    ref: B81
    tags: [Advantage, Physical, Xenos, Orks]
    notes: "Resistant (Common: Disease and Toxins), Immunity."
    lore: >
      An Ork can eat rotten meat, drink promethium-cut moonshine and wade
      through toxic industrial runoff without noticeable harm — Codex
      background treats Ork constitutions as effectively immune to the
      diseases and poisons that trouble other races, part of the same
      fungal-symbiote biology that lets a Squig be dinner, transport or
      weapon depending on how it's grown.
    design: >
      Resistant (B81), Common: Disease and Toxins, Immunity tier — base 15,
      x1 for Immunity = 15 points, the same tier and math this project's
      Oolitic Kidney entry uses for a single unified hazard category,
      pitched below the Custodes' broader Very Common tier (30) since Orks
      are shown getting stinking drunk and mildly green-sick on purpose for
      fun, not as flatly unaffected as a Custodian.

  - &fungal_physiology
    name: Fungal Physiology (Spore-Born)
    points: 0
    tags: [Xenos, Orks]
    lore: >
      Orks are not born but grown: an Ork reproduces by releasing spores
      that seed fresh fungal growth wherever conditions allow (a mechanism
      shared with Gretchin, Squigs and the rest of the Ork ecosystem), has
      no biological sex, and needs neither a mate nor, ordinarily, a
      trained physician who isn't another Ork with a saw and a good
      attitude. This is consistent, well-established Codex background and
      is played straight rather than for shock across Black Library's Ork
      fiction — an Ork simply is an ambulatory fungal colony shaped like a
      green thug.
    design: >
      0-point lore flag. Every mechanical payoff of this biology (thick
      hide, extreme pain tolerance, fast healing, survivability of wounds
      that would kill outright, immunity to disease and poison) is priced
      separately above; this entry exists purely to document why an Ork
      needs no gender, no mate, and no bedside manner from anyone.

  - &bloodlust
    name: Bloodlust
    points: -10
    cr: 12
    ref: B125
    tags: [Disadvantage, Mental, Xenos, Orks]
    lore: >
      Fighting is not a means to an end for an Ork, it is the point of
      being alive: Orks pick fights they don't need to, press an attack
      past the point of sense, and are consistently written (Ghazghkull
      Thraka above all) as unable to simply walk away from a fight worth
      having.
    design: Basic Set Bloodlust (B125), self-control 12, -10 points.

  - &impulsiveness
    name: Impulsiveness
    points: -10
    cr: 12
    ref: B139
    tags: [Disadvantage, Mental, Xenos, Orks]
    lore: >
      Orks act first and, on a good day, think about it afterwards — a
      running theme in how Ork plans in the fiction go from "good idea" to
      "already happening" with nothing in between.
    design: Basic Set Impulsiveness (B139), self-control 12, -10 points.

  - &overconfidence
    name: Overconfidence
    points: -5
    cr: 12
    ref: B148
    tags: [Disadvantage, Mental, Xenos, Orks]
    lore: >
      An Ork mob genuinely believes it can win any fight it's in, right up
      until (and sometimes past) the point it's losing badly — a big part
      of why Ork strategy in the fiction is so often "charge and find out."
    design: Basic Set Overconfidence (B148), self-control 12, -5 points.

  - &ork_kunnin
    name: "Ork Kunnin'"
    points: 0
    per_level: 10
    levels: 1
    ref: B89
    tags: [Advantage, Mental, Talent, Xenos, Orks]
    notes: |
      This project's Talent (B89) for practical battlefield cunning: adds
      its level to Tactics, Traps, Camouflage and Observation, the same way
      the Psyker Talent (Imperium/Traits/Psykers and the Warp.adq) adds to
      its own listed skills, per that file's house extension of Talent's
      normal rules. An Ork Boy is not clever in the abstract (IQ 8 is IQ
      8), but a mob that has survived a hundred scraps has a bone-deep,
      practical instinct for where the enemy is weak, where the cover is,
      and when a trap will work — instinct this Talent represents directly
      rather than through raw IQ.
    lore: >
      Ork tactics look like chaos from outside and are, by any human
      military-doctrine standard, chaos — and yet Ork mobs consistently
      find the gap in a defence, spring an ambush, or route around a
      strongpoint with an efficiency that surprises Imperial commanders who
      underestimate them. Codex background and Ork fiction play this as real, if inarticulate, battlefield cunning rather
      than dumb luck.
    design: >
      Talent affecting four skills sits at the Medium Talent rate (B90,
      10 points/level, 3-5 skill bracket), the same rate this project's
      Psyker Talent uses for the same reason. Base entry costs 0 points at
      level 0; every template above Gretchin buys at least level 1 (10
      points, included in the Ork Physiology package below).

  - &waaagh_gestalt
    name: "WAAAGH! Gestalt"
    points: 5
    tags: [Advantage, Mental, Xenos, Orks]
    conditional:
      - situation: "to resist Fright Checks and Perils of the Warp, while fighting as part of a large mob of fellow Orks (a WAAAGH!)"
        amount: 2
    notes: |
      Roughly ten or more fellow Orks fighting nearby, in earshot of the
      same battle-roar, count as a WAAAGH!. While inside one:
      - Fright Checks and Perils of the Warp rolls get +2 (the conditional
        bonus above).
      - Ork-built weapons and vehicles the character carries or crews have
        their Malf number raised by 1 (fewer jams; e.g. Malf 14 becomes 15,
        the Zzap Gun's 12 becomes 13). A lone Ork, or one with fewer than
        ten fellows in earshot, gets no bonus. This is the mechanical hook
        for "Orks believe it, so it works, and it works better the more of
        them believe it together."
      - A Weirdboy treats his own Warp Empowerment as one level higher (cap
        +10) for the purpose of which known powers he may safely cast.
        The Weirdboy template buys Empowerment 4 (cap 50), so Da Jump (60)
        is castable only inside a WAAAGH!.
    lore: >
      A lone Ork is dangerous; a mob of Orks worked up into a full WAAAGH!
      is a weaponised belief field — braver, louder, and (per Codex
      background's long-running joke about Ork technology) more likely to
      have its crude guns and rickety vehicles actually function, because
      enough Orks are collectively certain that they will. Weirdboyz in
      particular are consistently shown drawing directly on this collective
      psychic roar to power their biggest, most dangerous tricks; a Weirdboy
      isolated from a WAAAGH! is a much smaller threat.
    design: >
      A conditional Fright Check/Perils bonus eyeballed against Basic's
      Fearlessness (2 points per level, so a flat +2 is 4 points, B55),
      restricted to a common-in-play situation (a mob of ten or more), which
      alone would price at about 2-3 points. The 5 points also buy two
      mechanical riders that are the point of the trait: an Ork-tech Malf +1
      inside a WAAAGH!, and the Weirdboy's Empowerment +1. The Empowerment
      rider is not separately priced beyond that since it only changes which
      already-bought powers a Weirdboy may safely reach for.

  # ------------------------------------------------------------ Boyz & Gretchin
  - name: Ork Physiology
    container: ancestry
    tags: [Advantage, Physical, Xenos, Orks]
    children:
      - name: Attribute Modifiers (Boy)
        points: 198
        attributes: {st: 18, dx: 1, iq: -2, ht: 3, hp: 4}
        tags: [Physical]
        design: >
          Framework target: ST 28, DX 11, IQ 8, HT 13, HP 32, SM 0.
          Increased ST +18 (B14, 10/level, 180) for ST 28 — "stooped but
          heavy; brawnier than a man": Basic Lift 157 lb, far past an
          unaugmented human and only a shade under an Astartes' ST 30
          (strength ladder in framework.md). Increased
          DX +1 (B15, 20/level, 20) for DX 11 — "far clumsier than a
          Marine," barely above a Guardsman's own DX 12 despite the far
          greater ST. Decreased IQ -2 (B16, 20/level, -40) for IQ 8, the
          framework's own figure for "not smart, but not helpless either" —
          offset in play by Ork Kunnin' below rather than by raw IQ.
          Increased HT +3 (B15, 10/level, 30) for HT 13. Extra Hit Points
          +4 (B16, 2/level, 8) for HP 32 (28 base from ST, +4): an Ork
          soaks up more damage than its ST alone would suggest, matching
          how much punishment a Boy shrugs off in the fiction. 180+20-40
          +30+8 = 198 points.
      - name: Increased Basic Move (Ork)
        points: 15
        attributes: {basic_move: 3}
        tags: [Advantage, Physical, Xenos, Orks]
        lore: >
          Ork legs are short, but they cover ground at a lumbering,
          relentless gallop: a mob at full charge outruns a marching
          human line and is on top of it before it can reload. Codex
          background and Ork fiction alike treat the onrushing
          Waaagh! as a stampede, not a march.
        design: >
          Increased Basic Move +3 (B17, 5/level, 15 points): Basic Speed
          6.0 gives a Boy Move 6, so +3 brings the Ork baseline to Move 9,
          faster than a human's 6-7 without approaching an Eldar's.
      - *thick_hide
      - *high_pain_threshold
      - *hard_to_kill
      - *rapid_healing
      - *injury_tolerance_no_brain
      - *resistant_to_disease_and_toxins
      - name: "Injury Tolerance (Damage Reduction)"
        points: 0
        per_level: 25
        levels: 2
        ref: P53
        tags: [Advantage, Physical, Xenos, Orks]
        notes: >
          Divisor 2 (level = divisor): after DR and wounding multipliers,
          all injury is divided by 2 (round down, minimum 1 if anything
          penetrated). The Nob and Warboss growth lenses raise the divisor
          through "Injury Tolerance (Damage Reduction) upgrade" levels;
          add the upgrade levels to this trait's 2 for the total divisor.
        lore: >
          Orks survive and fight on through wounds that would kill a man:
          Codex: Orks background is full of Boyz who keep charging with
          holes in them, and the fungal-hardy greenskin body simply does
          not register damage the way a human one does. A big Ork is tougher
          still (see the growth lenses).
        design: >
          Injury Tolerance (Damage Reduction) (GURPS Powers p. 53, 25
          points per level, level = divisor): divisor 2 = 50 points. Bought
          as levels rather than a flat cost so the growth lenses can raise
          the divisor one step at a time. It is what keeps a Boy standing
          after two lasgun hits and makes bolt-pistol rounds a real but not
          instantly fatal threat, on top of Thick Hide's DR and the extra HP.
      - *fungal_physiology
      - *bloodlust
      - *impulsiveness
      - *overconfidence
      - *ork_kunnin
      - *waaagh_gestalt
      - name: Fearlessness
        points: 0
        per_level: 2
        levels: 3
        ref: B55
        tags: [Advantage, Mental, Xenos, Orks]
        lore: >
          An Ork has no fear to speak of: a lone Boy walks at a line of
          Marines because it looks like a good fight. It is the Gretchin who
          run. Below the Warboss's own extra levels, but enough that a Boy
          with Will 8 no longer fails a Fright Check as readily as a
          Guardsman.
        design: Fearlessness 3 (B55, 2/level, 6 points), a flat +3 to Fright Checks and Will rolls to resist fear and intimidation, on top of WAAAGH! Gestalt's conditional bonus.
    lore: >
      An Ork Boy: the baseline greenskin warrior, grown fast, fed on
      violence, and built to get bigger and meaner the longer it survives.
      This trait is the shared baseline every growth lens (Nob, Warboss)
      and every Oddboy specialisation (Mek, Painboy, Weirdboy) builds on
      top of. Primary sources: Codex: Orks background across editions,
      Nate Crowley's Ghazghkull Thraka: Prophet of the Waaagh! and Mike
      Brooks' Brutal Kunnin', calibrated against Dark Heresy/Rogue
      Trader/Deathwatch/Only War Ork material for relative scale.
    design: >
      198 (Attribute Modifiers) + 15 (Basic Move +3) + 10 (Thick Hide) + 10 (High Pain
      Threshold) + 6 (Hard to Kill 3) + 5 (Rapid Healing) + 6 (Thick
      Skull) + 15 (Resistant to Disease and Toxins) + 0
      (Fungal Physiology) - 10 (Bloodlust) - 10 (Impulsiveness) - 5
      (Overconfidence) + 10 (Ork Kunnin' 1) + 5 (WAAAGH! Gestalt) + 6
      (Fearlessness 3) + 50 (Injury Tolerance (Damage Reduction), divisor 2) = 311 points of physiology alone, before skills — see the Ork Boy template
      for a full character, and the growth lenses and Oddboy Talents below
      for Nobs, Warbosses, Meks, Painboyz and Weirdboyz built on top of it.

  - name: Gretchin Physiology
    container: ancestry
    tags: [Advantage, Physical, Xenos, Orks]
    children:
      - name: Attribute Modifiers (Gretchin)
        points: -20
        attributes: {st: -2, dx: 1, iq: -1, sm: -1}
        tags: [Physical]
        design: >
          Framework target: ST 8, DX 11, IQ 9, HT 10, HP 8, SM -1.
          Decreased ST -2 (B14, 10/level, -20) for ST 8; base HP tracks ST,
          so HP 8 needs no separate purchase. Increased DX +1 (B15,
          20/level, 20) for DX 11 — sneaky and quick-fingered despite the
          weak frame. Decreased IQ -1 (B16, 20/level, -20) for IQ 9,
          slightly sharper than a Boy. HT 10 is baseline, no purchase. SM
          -1 is the framework's own figure for a Gretchin's small stature;
          it carries no independent point cost here since no ST is being
          bought above baseline for it to discount. -20+20-20 = -20 points.
      - name: Increased Basic Move (Gretchin)
        points: 10
        attributes: {basic_move: 2}
        tags: [Advantage, Physical, Xenos, Orks]
        lore: >
          Grots are small and scurrying: they bolt between the legs of
          bigger Orks and away from trouble at a surprising pace.
        design: >
          Increased Basic Move +2 (B17, 5/level, 10 points): Basic Speed
          5.25 gives Move 5, so +2 gives Move 7, quick for a small body
          without matching a Boy's Move 9.
      - *fungal_physiology
      - name: Resistant to Disease and Toxins (Minor)
        points: 10
        ref: B81
        tags: [Advantage, Physical, Xenos, Orks]
        notes: "Resistant (Occasional: Disease and Toxins), Immunity."
        lore: >
          Gretchin share the fungal-symbiote biology of full Orks, just a
          weaker dose of it — hardy compared to a human, sickly compared to
          a Boy.
        design: >
          Resistant (B81), Occasional: Disease and Toxins, Immunity tier —
          base 10, x1 for Immunity = 10 points, the same tier and math this
          project's Preomnor entry uses, well below a Boy's Common-tier 15.
      - name: "Grot Sneakiness"
        points: 0
        per_level: 5
        levels: 1
        ref: B89
        tags: [Advantage, Mental, Talent, Xenos, Orks]
        notes: "Adds its level to Stealth and Filch."
        lore: >
          What a Gretchin lacks in strength it makes up in a genuine talent
          for not being noticed — slipping through a mob's legs to loot a
          battlefield, or vanishing the instant a Nob starts looking for
          someone to hit.
        design: >
          Talent affecting two skills sits at the Small Talent rate (B90,
          5 points/level, 1-2 skill bracket). Level 1, 5 points.
      - name: Cowardice
        points: -10
        cr: 12
        ref: B129
        tags: [Disadvantage, Mental, Xenos, Orks]
        lore: >
          Gretchin are expendable and know it; they fight only when a
          bigger Ork is watching and run the instant that stops being true.
          Universally played for both pathos and slapstick across Ork
          fiction and Codex background alike.
        design: Basic Set Cowardice (B129), self-control 12, -10 points.
      - name: Social Stigma (Grot)
        points: -5
        ref: B155
        tags: [Disadvantage, Social, Xenos, Orks]
        notes: "Second-Class Citizen, within Ork society specifically."
        lore: >
          Even by Ork standards a Gretchin is at the bottom of the pile —
          bossed, cuffed and worked by every Boy, Nob and Runtherd above it
          in the pecking order.
        design: Basic Set Social Stigma (Second-Class Citizen) (B155), -5 points, scoped to Ork society.
      - name: Squeals and Bolts
        points: -1
        tags: [Quirk, Xenos, Orks]
        notes: Roleplaying flag only.
        lore: A Gretchin's first instinct under real pressure is noise, then distance.
        design: Quirk (B9), roleplaying flag only.
    lore: >
      Gretchin (Grots): the small, cowardly, expendable underclass of Ork
      society — servants, artillery crew and Runtherd-driven cannon fodder
      who share the same fungal biology as Boyz without the size, toughness
      or nerve. Consistent across Codex background and Black Library's Ork
      fiction, where a Grot's main survival strategy is staying near a
      bigger, meaner Ork and knowing when to vanish.
    design: >
      -20 (Attribute Modifiers) + 10 (Basic Move +2) + 0 (Fungal Physiology) + 10 (Resistant,
      Minor) + 5 (Grot Sneakiness) - 10 (Cowardice) - 5 (Social Stigma) - 1
      (Squeals and Bolts) = -11 points of physiology alone — a genuinely
      weak template before skills, matching Gretchin's place as the
      Imperium's most disposable enemy rather than a threat in its own
      right; see the Gretchin template for the full (still very modest)
      character.

  # ------------------------------------------------------------ growth lenses
  - name: "Growth Lens: Nob"
    container: meta_trait
    tags: [Advantage, Physical, Xenos, Orks]
    children:
      - name: Attribute Modifiers (Nob)
        points: 94
        attributes: {st: 6, iq: 1, ht: 1, hp: 2}
        tags: [Physical]
        design: >
          Framework target over the Boy package: ST 34, DX 11 (unchanged),
          IQ 9, HT 14, HP 40, SM 0. Increased ST +6 (B14, 10/level, 60) for
          ST 34. Increased IQ +1 (B16, 20/level, 20) for IQ 9 — a Nob has
          learned a little sense surviving long enough to grow. Increased
          HT +1 (B15, 10/level, 10) for HT 14. Extra Hit Points
          +2 (B16, 2/level, 4) on top of the Boy package's own +4, for a
          combined extra +6 over the new ST-34 base of 34, giving HP 40.
          60+20+10+4 = 94 points. Basic Move comes from the Ork Physiology
          package (Move 9 with the Nob's Basic Speed 6.25).
      - name: "Big Nob (SM +1)"
        points: 0
        attributes: {sm: 1}
        disabled: true
        tags: [Xenos, Orks]
        notes: >
          Disabled by default; enable for an especially large, old Nob.
          0-point flavour flag: this Nob's ST/HT/HP are already bought
          above, SM +1 just marks that this particular Nob is noticeably
          bigger even by Nob standards (and takes the usual SM combat
          penalties/bonuses that come with it), matching the framework's
          "(+1 for big ones)" note.
        lore: >
          Some Nobs simply keep growing past the usual point, becoming
          hulking, unmistakable brutes even among their already-oversized
          kind.
        design: 0-point size flag; see notes.
      - name: "Injury Tolerance (Damage Reduction) upgrade"
        points: 0
        per_level: 25
        levels: 1
        ref: P53
        tags: [Advantage, Physical, Xenos, Orks]
        notes: >
          Raises the divisor of the Ork Physiology package's Injury
          Tolerance (Damage Reduction) by one
          (divisor 2 becomes 3): total divisor 3. The simulator sums the levels of
          the base trait and this upgrade.
        lore: >
          A Nob is a bigger, older Ork, and the extra bulk soaks up wounds that would drop a Boy: he shrugs off hits that would fell a smaller Ork (Codex: Orks background).
        design: >
          Injury Tolerance (Damage Reduction) (GURPS Powers p. 53, 25
          points per level, level = divisor): 1 further level, 25 points.
    lore: >
      A Nob (short for "Nobz," itself short for "Nobber") is a Boy who has
      survived enough fights, and eaten enough of the mob's best food, to
      keep growing well past where most Boyz stop. Nobs are the Ork mob's
      natural toughs, bodyguards and squad bosses — bigger, tougher and
      meaner, and canny enough to have picked up real tactical sense the
      hard way.
    design: >
      94 (Attribute Modifiers) + 25 (Injury Tolerance upgrade, divisor 3
      total) = 119 points, added to the Ork Physiology package's 311 for 430
      points of physiology before skills. See the Ork Nob template.

  - name: "Growth Lens: Warboss"
    container: meta_trait
    tags: [Advantage, Physical, Xenos, Orks]
    children:
      - name: Attribute Modifiers (Warboss)
        points: 196
        attributes: {st: 16, dx: 1, iq: 2, ht: 2, hp: 4, sm: 1}
        tags: [Physical]
        design: >
          Framework target over the Boy package: ST 42, DX 12, IQ 10, HT
          15, HP 50, SM +1. Increased ST +16 (B14, 10/level, 160) for ST
          42; per B18's Size and Strength Table a creature whose SM matches
          its actual bulk gets a cost break on ST, and SM +1 gives -10% on
          every level of ST bought, including the Boy package's +18: the
          Warboss's whole +32 costs 320 x 0.9 = 288, of which the Boy
          package already charged 180, so this lens adds 108 — the same
          discount this project's Custodian Attribute Modifiers takes for the
          same reason. Increased DX +1
          (B15, 20/level, 20) for DX 12 — a Warboss hits harder and a
          little more precisely than a rank-and-file Boy, "out-muscles a
          Space Marine" more than out-fights one. Increased IQ +2 (B16,
          20/level, 40) for IQ 10 — sharp enough to run a Waaagh's actual
          logistics of loot, grudges and turf, on top of Ork Kunnin's
          practical edge. Increased HT +2 (B15, 10/level, 20) for HT 15.
          Extra Hit Points +4 (B16, 2/level, 8) on top of the Boy package's
          own +4, for combined extra +8 over the new ST-42 base of 42,
          giving HP 50. SM +1 carries no cost beyond the ST discount
          already taken. 108+20+40+20+8 = 196 points.
      - name: "Injury Tolerance (Damage Reduction) upgrade"
        points: 0
        per_level: 25
        levels: 2
        ref: P53
        tags: [Advantage, Physical, Xenos, Orks]
        notes: >
          Raises the divisor of the Ork Physiology package's Injury
          Tolerance (Damage Reduction) by two
          (this lens replaces the Nob lens rather than stacking on it, so it carries both steps: divisor 2 becomes 4): total divisor 4. The simulator sums the levels of
          the base trait and this upgrade.
        lore: >
          A Warboss is tougher than any Nob; wounds that would fell a smaller Ork barely slow the biggest of the breed (Codex: Orks background).
        design: >
          Injury Tolerance (Damage Reduction) (GURPS Powers p. 53, 25
          points per level, level = divisor): 2 further levels, 50 points.
      - name: Combat Reflexes
        points: 15
        ref: B43
        tags: [Advantage, Mental, Xenos, Orks]
        lore: A Warboss has been in more fights than any ten Boyz put together and simply doesn't flinch.
        design: Basic Set Combat Reflexes (B43), 15 points, as the Astartes/Custodes packages.
      - name: Fearlessness
        points: 0
        per_level: 2
        levels: 4
        ref: B55
        tags: [Advantage, Mental, Xenos, Orks]
        lore: A Warboss is what other Orks are afraid of, not the other way around.
        design: Fearlessness 4 (B55, 2/level, 8 points), on top of the Boy package's Fearlessness 3 (7 levels in all) and WAAAGH! Gestalt's conditional bonus.
      - name: Regeneration (Slow)
        points: 10
        ref: B80
        tags: [Advantage, Physical, Xenos, Orks]
        notes: Recovers 1 HP per 12 hours even without rest or first aid, on top of Rapid Healing.
        lore: >
          The oldest, biggest Warbosses just don't stop knitting back
          together, a step beyond even an ordinary Boy's already-fast
          healing.
        design: Regeneration (Slow) (B80, 10 points), stacking with the Boy package's Rapid Healing as a distinct passive-recovery benefit, per this project's Custodian Regeneration entry using the same two advantages together.
      - name: Hard to Kill
        points: 0
        per_level: 2
        levels: 3
        ref: B58
        tags: [Advantage, Physical, Xenos, Orks]
        notes: "A further +3 to HT rolls to avoid death, stacking with the Boy package's Hard to Kill 3 for +6 total."
        lore: A Warboss dying on his feet is a running feature of Ork hero-tales, not an exception.
        design: A further Hard to Kill 3 (B58, 2/level, 6 points), stacking with the base package as GURPS allows multiple purchases of the same leveled advantage.
      - name: "Reputation (The Biggest and Baddest)"
        points: 15
        ref: B26
        tags: [Advantage, Social, Xenos, Orks]
        reactions:
          - situation: from other Orks who recognise a Warboss's markings and retinue, and Fright Check bonus/penalty context for enemies who know his name
            amount: 4
        lore: >
          A Warboss's reputation travels ahead of him — other mobs fall in
          behind him without a fight, and Imperial commanders who've faced
          a named Warboss before know exactly how bad the day is about to
          get.
        design: >
          Reputation (B26), priced in line with this project's other
          eyeballed Reputation entries (Custodes' Shield-Captain
          Reputation, 15 points for +4) rather than a full frequency/scope
          calculation, per Basic's own guidance that Reputation costs are
          meant to be judged against comparable published examples.
      - name: Charisma
        points: 0
        per_level: 5
        levels: 3
        ref: B41
        tags: [Advantage, Mental, Xenos, Orks]
        lore: >
          Ork society has no formal rank structure; a Warboss leads because
          every Ork in earshot wants to follow him, fears him, or both —
          Codex background is explicit that Warboss authority is pure force
          of personality (backed by a fist the size of a Rhino) rather than
          any chain of command.
        design: Charisma 3 (B41, 5/level, 15 points), used in place of a formal Rank trait since Ork command has no such structure.
      - name: Increased Basic Move (Warboss)
        points: 5
        attributes: {basic_move: 1}
        tags: [Advantage, Physical, Xenos, Orks]
        lore: A Warboss leads the charge from the front; nobody outruns the Ork who is chasing them personally.
        design: >
          Increased Basic Move +1 (B17, 5/level, 5 points), on top of the
          Ork Physiology package's +3: Basic Speed 7.25 gives Move 7, so
          +4 in total brings a Warboss to Move 11.
      - name: Increased Basic Speed
        points: 10
        attributes: {basic_speed: 0.5}
        tags: [Advantage, Physical, Xenos, Orks]
        lore: A Warboss's reflexes stay sharp long after his mob-mates' have dulled from age or drink.
        design: Increased Basic Speed +0.50 (B17, 5 points per 0.25 level, 10 points).
      - name: "Wealth (Loot Hoard)"
        points: 20
        ref: B25
        tags: [Advantage, Social, Xenos, Orks]
        notes: Wealthy.
        lore: >
          A successful Warboss accumulates a genuinely enormous pile of
          loot over a career — teef, scavenged tech, trophies — the Ork
          measure of status and the fuel for the next Waaagh's gear.
        design: Basic Set Wealth (Wealthy) (B25), 20 points.
    lore: >
      A Warboss is the biggest, meanest, canniest Ork in charge of a Waaagh
      — a Boy or Nob who kept fighting, kept winning, and kept growing
      until nothing short of a Space Marine or worse could reliably put him
      down. Ghazghkull Thraka: Prophet of the Waaagh! is the definitive
      Black Library portrait; current Codex: Orks background agrees a
      Warboss out-muscles a Space Marine on raw size and power alone.
    design: >
      196 (Attribute Modifiers) + 15 (Combat Reflexes) + 8 (Fearlessness 4)
      + 10 (Regeneration) + 6 (further Hard to Kill 3) + 15 (Reputation) +
      15 (Charisma 3) + 10 (Basic Speed) + 5 (Basic Move +1) + 20 (Wealth)
      + 50 (Injury Tolerance upgrade 2, divisor 4 total; the Warboss lens
      replaces the Nob lens, so it carries both steps)
      = 350 points, added to the Ork Physiology package's 311 for 661 points of physiology and
      command presence before skills. See the Ork Warboss template, which
      lands the full character in the upper part of framework.md's
      Astartes point tier (550-800) — appropriate for a solid, competent Warboss;
      a legendary name like Ghazghkull himself would run well past this,
      into the framework's Heroes and Legends tier, and should be built as
      a bespoke NPC on top of this template rather than read off it
      directly.

  # -------------------------------------------------------------- Oddboyz
  - name: "Mek Instinct"
    points: 0
    per_level: 10
    levels: 1
    ref: B89
    tags: [Advantage, Mental, Talent, Xenos, Orks]
    notes: |
      Adds its level to Engineer (Ork Tech), Mechanic (Ork Tech), Armoury
      (Ork Tech) and Explosives, the same house extension of Talent's rules
      the Psyker Talent uses. A Mek doesn't understand *why* a shoota's
      dakka-generator works any more than a Guardsman understands ballistic
      chemistry, but he has an instinctive, hands-on genius for building
      and fixing Ork machines that no amount of formal Mechanicus training
      would improve on — and that formal training, notably, cannot
      replicate: a captured Tech-Priest given a pile of scrap and a week
      does not produce a working Ork vehicle, but a Mek does.
    lore: >
      Every Ork clan has Meks, and every Waaagh runs on what they weld
      together — walkers, trukks, shootas, and the occasional accidental
      superweapon. Codex background is explicit that Mek genius is
      instinctive rather than learned, and that Ork technology partly works
      because the whole Waaagh collectively believes it will (see WAAAGH!
      Gestalt); Ork fiction features Meks prominently as this exact kind of
      dangerous, half-mad genius (no single canonical figure).
    design: >
      Talent affecting four skills, Medium Talent rate (B90, 10
      points/level), matching Ork Kunnin's own math for the same
      four-skill bracket. Base entry 0 points at level 0; the Mek template
      buys level 2 (20 points).

  - name: "Painboy's Eye"
    points: 0
    per_level: 10
    levels: 1
    ref: B89
    tags: [Advantage, Mental, Talent, Xenos, Orks]
    notes: |
      Adds its level to Surgery (Ork Methods), Physician (Ork Methods) and
      Diagnosis, the same house extension of Talent's rules the Psyker
      Talent uses. Ork medicine is brutal, fast and effective on Ork
      patients specifically — bone saws, magnets, and a total disregard for
      anaesthetic — and this Talent is what makes a Painboy's crude methods
      actually work on greenskin physiology as well as (or better than) a
      careful human surgeon's would.
    lore: >
      Painboyz (Doks) are Ork medics, and Ork medicine is not for the
      squeamish: replacement limbs bolted on with mismatched parts, "brain
      surgery" with a chisel, and patients who by any human medical
      standard should not have survived the treatment, let alone the
      original injury. Codex background and Black Library both play this
      completely straight — it works, on Orks, because a Painboy's tools
      and instincts are matched to Ork biology in a way finesse never
      would be.
    design: >
      Talent affecting three skills sits at the Medium Talent rate (B90,
      10 points/level, 3-5 skill bracket, same bracket as Ork Kunnin' and
      Mek Instinct with one skill to spare). Base entry 0 points at level
      0; the Painboy template buys level 2 (20 points).

  # ---------------------------------------------------- Weirdboy psychic powers
  - name: "'Eadbanger"
    per_level: 5
    levels: 1
    tags: [Advantage, Mental, Xenos, Orks]
    modifiers: ["Warp Sorcery, -20%", "Perils of the Warp, -10%"]
    lore: >
      A short-ranged psychic bludgeon that a Weirdboy throws at a single
      target's skull — described across Ork fiction as looking exactly
      like it sounds, a target's head rocking or worse under an unseen
      blow.
    design: >
      Innate Attack (Crushing, 5/die, B61) with the standard Warp Sorcery/
      Perils pair, net -30% (same derivation as this project's Assail),
      reflavoured for Ork psychic force rather than fine telekinetic
      control. Full modified cost: 5 x 0.7 = 3.5 points/level; needs Warp
      Empowerment level 1 (cap 20).

  - name: "Fists of Gork (an' Mork)"
    per_level: 5
    levels: 1
    tags: [Advantage, Physical, Xenos, Orks]
    modifiers: ["Warp Sorcery, -20%", "Perils of the Warp, -10%"]
    lore: >
      Channels raw WAAAGH! force into a Weirdboy's own fists (or whoever's
      fists he's pointing at), letting even a bare-handed blow crack armour
      plate — the source of the tabletop "Warpath"/"Fists of Gork"
      tradition of a Weirdboy briefly turning his mob into something that
      hits far harder than it should.
    design: >
      Striking ST (5/level, B) with Warp Sorcery/Perils, net -30% (the
      same derivation this project's Sanctic Daemonology uses for
      Hammerhand). Full modified cost: 5 x 0.7 = 3.5 points/level; needs
      Warp Empowerment level 1 (cap 20).

  - name: Warpath
    container: group
    tags: [Advantage, Mental, Xenos, Orks]
    children:
      - name: Heroic Feats of Strength
        points: 10
        tags: [Advantage, Physical, Xenos, Orks]
        modifiers: ["Area Effect, +50%", "Warp Sorcery, -20%", "Perils of the Warp, -10%"]
        lore: >
          A howled WAAAGH! that fills a Weirdboy's whole mob with sudden,
          reckless strength for the charge.
        design: >
          Basic's Heroic Feats of Strength (flat 10) with Area Effect
          (+50%) plus Warp Sorcery/Perils, net +20%. Full modified cost:
          10 x 1.2 = 12 points; needs Warp Empowerment level 2 (cap 30) —
          the same build this project's Librarius: Might of Heroes uses.
      - name: "Warp Speed (Mob)"
        per_level: 5
        levels: 1
        tags: [Advantage, Physical, Xenos, Orks]
        modifiers: ["Area Effect, +50%", "Warp Sorcery, -20%", "Perils of the Warp, -10%"]
        lore: >
          The same burst quickens the whole mob's feet, turning a shambling
          charge into a genuine sprint.
        design: >
          Increased Basic Speed (5 points per +0.25) with Area Effect
          (+50%) plus Warp Sorcery/Perils, net +20%. Full modified cost:
          5 x 1.2 = 6 points/level; needs Warp Empowerment level 2 (cap 30).
    lore: >
      Warpath is the two halves of the same WAAAGH!-fuelled blessing a
      Weirdboy throws over his own mob before a charge: sudden strength and
      sudden speed, together. Tabletop and Codex background both describe
      Weirdboyz using exactly this kind of squad-wide buff in the moments
      before Orks hit a line.
    design: >
      Grouped as GCS sums the children: 12 (Heroic Feats of Strength) + 6
      (Warp Speed, Mob, at level 1) = 18 points at its default starting
      level.

  - name: Da Jump
    points: 100
    modifiers:
      - "Area Effect, +50%"
      - "Preparation Required, -20%"
      - {name: "Uncontrollable (Destructive)", cost: "-30%", ref: B116}
      - "Warp Sorcery, -20%"
      - "Perils of the Warp (Severe), -20%"
    tags: [Advantage, Mental, Xenos, Orks]
    lore: >
      A Weirdboy's signature and most feared trick: he grabs the nearest
      mob of Boyz, screams, and the whole lot vanish and reappear somewhere
      else on the battlefield an instant later — sometimes exactly where
      intended, sometimes scattered, occasionally (per the fiction's
      favourite running joke about Da Jump) several yards in the air.
      Weirdboyz and Da Jump-style warp effects recur in Ork fiction, played
      both as genuine tactical surprise and as slapstick; there is no single
      canonical mechanic.
    design: >
      Built on Basic's own Warp advantage (B99, instant travel to any
      place you have seen/visualised, flat 100), matching this project's
      Gate of Infinity build, with Area Effect (+50%, B102, brings the
      whole mob) added on top, Preparation Required (-20%, a moment's
      howling concentration), Uncontrollable (Destructive, -30%, B116; the -10% Harmless version does
      not fit, since a mis-aimed mob is a real hazard: a Weirdboy can't
      always land the mob exactly where he meant to, the "scatter" of the
      tabletop, modelled honestly rather than smoothed over),
      Warp Sorcery (-20%) and the Severe Perils tier (-20%, a botched Jump
      is exactly the kind of interstellar-workings-adjacent disaster that
      tier exists for). Net: +50-20-30-20-20 = -40%. Full modified cost:
      100 x 0.6 = 60 points — needing Warp Empowerment level 5 (cap 60),
      one more than a lone Weirdboy's Empowerment 4 (cap 50) reaches, so Da Jump
      is castable only inside a WAAAGH!, where WAAAGH! Gestalt raises his
      Empowerment to 5 (cap 60): the biggest trick in a Weirdboy's book needs
      the mob behind him.

  # ---------------------------------------------------- Stormboy lens (a Boy)
  - name: "Lens: Stormboy Rokkit Pack"
    container: group
    disabled: true
    tags: [Xenos, Orks]
    lore: >
      Stormboyz are young, fast, fanatical Boyz who strap a crude, Mek-built
      rokkit pack to their backs and launch themselves at the enemy in short
      bounding flights: a spectacular, popular and genuinely dangerous way to
      get into a fight fast, since the packs are exactly as reliable as the
      rest of Ork technology. They are ordinary Boyz with a pack, not Kommando
      derivatives, so the lens belongs on the Boy template.
    design: >
      Net 17 points (18 for the pack, -1 quirk); disabled by default so the
      base Boy stays a pure ground trooper. Enable it on a Boy (or any Ork
      template) to build a Stormboy.
    children:
      - name: Rokkit Pack (Short-Burst Flight)
        points: 40
        ref: B56
        tags: [Advantage, Physical, Xenos, Orks]
        modifiers:
          - {name: "Cannot Hover", cost: "-15%", ref: B56}
          - {name: "Limited Use, 3-4 bursts per pack", cost: "-20%", ref: B112}
          - {name: "Accessibility, only while wearing a working rokkit pack", cost: "-20%", ref: B110}
        notes: "Flight (B56) for a short bounding flight: Air Move is twice Basic Move, for a few short bursts before the pack is spent, and the wearer cannot hover. A pack that malfunctions (Malf 14, 15 within a WAAAGH!) is spent at once and the landing is the GM's to complicate."
        lore: A single good burst from a rokkit pack throws a Stormboy well over the heads of the enemy line and down into it.
        design: "Flight (B56, 40 points) with Cannot Hover (-15%, B56), Limited Use 3-4 uses (-20%, B112) and Accessibility, working pack only (-20%, B110). Net -55%, 40 x 0.45 = 18 points. Replaces an earlier Super Jump 1, which only doubled a leap and did not model a jump pack."
      - name: Rokkit Malfunctions
        points: -1
        tags: [Quirk, Xenos, Orks]
        notes: Roleplaying/GM-hazard flag only.
        lore: >
          Rokkit packs are built by the same Meks and to the same standards
          as every other piece of Ork tech, which is to say: they work, up
          until the moment they spectacularly don't. A botched Stormboy
          landing is played for comedy about as often as the charge itself is
          played for menace.
        design: "Quirk (B9): a GM is free to call for an occasional bad landing on unlucky rolls, at no further point cost."

  # ---------------------------------------------------- klan lenses (flavour)
  - name: "Klan: Blood Axe"
    container: group
    disabled: true
    tags: [Xenos, Orks]
    lore: >
      Blood Axes study and copy human (and other) military doctrine —
      formations, camouflage, combined arms — and are consequently
      distrusted by every other Klan as not being proper Orks at all.
    design: Net 0 points, per-Klan flavour lens, matching the Guardsman template's regimental-lens pattern.
    children:
      - name: Human Tactics
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Tactics.
        lore: A Blood Axe has actually studied how humans fight, and borrows what works.
        skill_bonuses: {Tactics: 1}
      - name: Hides in Plain Sight
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Camouflage.
        lore: Blood Axes copy human camouflage patterns and fieldcraft.
        skill_bonuses: {Camouflage: 1}
      - name: "Not a Proper Ork"
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: Other Klans consider Blood Axes soft, sneaky, or worse — barely worth calling greenskins.
      - name: Prefers Uniforms
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: A Blood Axe likes his kit matched and his mob in formation, which other Orks find deeply suspicious.

  - name: "Klan: Snakebite"
    container: group
    disabled: true
    tags: [Xenos, Orks]
    lore: >
      Snakebites are the most tribal, least tech-friendly Klan, riding
      Squiggoths and squigs into battle and distrusting a Mek's gadgets on
      principle.
    design: Net 0 points, per-Klan flavour lens.
    children:
      - name: Squig-Rider
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Riding (Squig).
        lore: A Snakebite grows up on squig-back.
        skill_bonuses: {"Riding (Squig)": 1}
      - name: Boar-Rider
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Riding (Boar); Snakebites are as famous for boarboy cavalry as for squigs.
        lore: A Snakebite rides a warboar as naturally as he walks.
        skill_bonuses: {"Riding (Boar)": 1}
      - name: "Zoggin' Tech"
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: A Snakebite trusts a good squig over a Mek's contraption every time.
      - name: Superstitious
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: Snakebites hold to old tribal taboos and lucky charms far more than other Klans.

  - name: "Klan: Evil Sunz"
    container: group
    disabled: true
    tags: [Xenos, Orks]
    lore: >
      "Red ones go fasta": Evil Sunz paint everything red and build for
      speed, fielding the fastest bikes, buggies and trukks of any Klan.
    design: Net 0 points, per-Klan flavour lens.
    children:
      - name: Need for Speed
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Driving (Ork Vehicles).
        lore: An Evil Sunz boy is happiest with an engine roaring under him.
        skill_bonuses: {"Driving (Ork Vehicles)": 1}
      - name: Speed Freak
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Piloting (Ork Aircraft); Evil Sunz build and fly the fastest kites too.
        lore: An Evil Sunz boy handles fast machines of any kind by instinct.
        skill_bonuses: {"Piloting (Ork Aircraft)": 1}
      - name: Reckless
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: An Evil Sunz boy would rather crash going fast than arrive slow.
      - name: Red Ones Go Fasta
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: An Evil Sunz boy paints everything red and swears it makes it faster.

  - name: "Klan: Deathskulls"
    container: group
    disabled: true
    tags: [Xenos, Orks]
    lore: >
      Deathskulls are the Ork underworld's finest looters and the best
      Mekaniaks at making stolen tech work, on the principle that if you
      find it first, it's yours.
    design: Net 0 points, per-Klan flavour lens.
    children:
      - name: Looter's Eye
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Scrounging.
        lore: A Deathskull can spot the one usable part in a scrapheap at a glance.
        skill_bonuses: {Scrounging: 1}
      - name: "Finders Keepers"
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: A Deathskull cannot walk past something shiny and unattended.

  - name: "Klan: Goffs"
    container: group
    disabled: true
    tags: [Xenos, Orks]
    lore: >
      Goffs are the biggest, toughest, most melee-obsessed Klan and, by
      their own account (and most others'), the best fighters of any Ork
      Klan — Ghazghkull Thraka himself is a Goff.
    design: Net 0 points, per-Klan flavour lens.
    children:
      - name: Goff Brawler
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Brawling.
        lore: A Goff has been fighting hand-to-hand since before he could talk properly.
        skill_bonuses: {Brawling: 1}
      - name: Loud and Menacing
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Intimidation.
        lore: Goffs are the biggest, loudest and most feared boyz in any mob.
        skill_bonuses: {Intimidation: 1}
      - name: "Best Fighters, Everyone Knows It"
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: A Goff will not let a claim of toughness from another Klan go unanswered.
      - name: Black Armour Snob
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: Goffs favour black armour and checks, and sneer at gaudy or colourful Klans.

  - name: "Klan: Bad Moons"
    container: group
    disabled: true
    tags: [Xenos, Orks]
    lore: >
      Bad Moons are the richest Klan, trading in teef (Ork currency, quite
      literally teeth) for the best dakka and gear any Ork can buy —
      flashy, gold-painted, and widely resented for it.
    design: Net 0 points, per-Klan flavour lens.
    children:
      - name: Teef Trader
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), +1 to Merchant.
        lore: A Bad Moon knows the going rate for everything, in teef.
        skill_bonuses: {Merchant: 1}
      - name: Teef-Rich
        points: 1
        tags: [Perk, Xenos, Orks]
        design: Perk (B9), a modest extra stake of teef at the start of play (GM's discretion, about one wealth step for kit purposes, not a Wealth level).
        lore: A Bad Moon always has a little more teef, and a little better kit, than any Klan-mate his size.
      - name: Ostentatious
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: A Bad Moon cannot resist showing off just how much richer he is than you.
      - name: Gold-Plated Everything
        points: -1
        tags: [Quirk, Xenos, Orks]
        design: Quirk (B9), roleplaying flag only.
        lore: A Bad Moon cannot leave a weapon or helmet un-gilded.

  - name: "Culture: Freebooterz"
    container: group
    disabled: true
    tags: [Xenos, Orks]
    lore: >
      Freebooterz are Ork pirates and void-raiders, more mercenary and more
      willing to deal (on their own terms) than any Klan — the Orks other
      factions actually negotiate with, occasionally. They are a way of
