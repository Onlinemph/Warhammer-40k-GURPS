kind: traits
output: Xenos/Tyranids/Traits/Tyranid Biology.adq
items:
  # ------------------------------------------------------------------ organs
  # Every Tyranid organism, from a Termagant to a Hive Tyrant, is grown by
  # the Hive Fleet for a purpose and is never truly an individual: it is a
  # bio-weapon on loan from the Hive Mind, wired to obey nearby synapse
  # creatures and to revert to raw feeding/survival instinct the moment
  # that link is cut. Calibrated to framework.md's "Xenos > Tyranids"
  # anchor table (SM/ST/DX/IQ/HT/HP/chitin DR) and its synapse/Shadow in
  # the Warp notes. Primary sources: Codex: Tyranids background across
  # editions (the Hive Mind, synapse creatures, Shadow in the Warp, the
  # Norn Queens and biological wargear), Black Library Tyranid-focussed
  # fiction — chiefly the Deathwatch novels (Steve Parker's Deathwatch,
  # the wider Space Marine Battles line's Leviathan-era material) and
  # Rob Sanders' and others' Hive Fleet material where it appears — with
  # Deathwatch RPG's The Achilus Assault and the Mark of the Xenos Tyranid
  # calibration section used per framework.md's source order for relative
  # scale (how a Termagant compares to a Carnifex) rather than absolute
  # numbers.

  - &hive_mind_link
    name: "Hive Mind Link"
    ref: B70
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Single person (the Hive Mind, treated as one linked entity)", cost: "5", ref: B70}
    notes: >
      A permanent, involuntary telepathic link to the Hive Mind: the
      organism receives strategic direction, feels the Hive Mind's intent
      when synapse creatures are near, and cannot meaningfully act against
      it (see Synapse Dependence and Synapse Discipline below for what
      that link actually does turn to turn). It carries none of the
      individual privacy or two-way nuance Mindlink usually implies
      between two people.
    lore: >
      Every Tyranid bioform, however small, is grown already wired into
      the Hive Mind's collective will — Codex background across editions
      is explicit that a lone Tyranid organism has essentially no
      independent will to speak of, and Black Library's Hive Fleet
      material consistently frames the swarm as a single directed
      organism wearing a billion bodies rather than a species of
      individuals.
    design: >
      Basic Set Mindlink (B70): the published cost table prices the
      advantage by how many separate people share the link (5 points for
      a single person, rising with group size). The Hive Mind functions
      mechanically as one linked entity, not as a separate link to every
      other Tyranid organism in the swarm, so this project takes the
      "single person" tier (5 points) rather than trying to price a link
      to billions of individual minds — the same kind of reasoned
      reinterpretation of a Basic Set category this project's other
      xenos files use rather than inventing a new, uncosted tier.

  - &synapse_dependence
    name: "Synapse Dependence (Instinctive Behaviour)"
    points: -10
    ref: B124
    tags: [Disadvantage, Mental, Xenos, Tyranids]
    notes: >
      Default state: outside synapse range (see Synapse Discipline
      below), a Tyranid organism reverts to pure instinct. It cannot
      follow a complex order, hold a defensive position under real
      pressure, or resist an overwhelming urge to feed on the nearest
      kill or flee an unwinnable fight — GM's call, biased toward
      whichever instinct the immediate situation makes obvious (feeding
      on a fresh kill; fleeing when reduced below 1/3 HP with nowhere to
      push forward; otherwise holding station near its Hive Fleet's last
      clear directive). This is fully suppressed while the organism is
      within the range of a Synapse Creature (see that trait, below) —
      see Synapse Discipline for what replaces it there.
    lore: >
      Codex background is explicit that most Tyranid bioforms have no
      independent tactical judgement at all: cut off from a synapse
      creature, a swarm degenerates within moments into a feeding frenzy
      or a panicked rout, exactly the behaviour Imperial commanders are
      taught to exploit by killing synapse creatures first. Deathwatch
      RPG's Mark of the Xenos Tyranid material calibrates this as the
      single most reliable tactic against a swarm.
    design: >
      Basic Set Bestial (B124, -10 points): "you are driven by animal
      instinct rather than reason," applied here as the organism's
      default, un-linked state rather than an always-on trait, per the
      Accessibility-style reading this project's own conditional traits
      (Ork WAAAGH! Gestalt, Necron Slave Mentality) already use for
      "the disadvantage's effects only apply in this specific, common-in-
      play circumstance." No further limitation percentage is taken
      since being outside synapse range is the swarm's normal condition,
      not a rare edge case — Synapse Discipline below is priced
      separately as the (comparatively rare, situational) benefit that
      suppresses it.

  - &synapse_discipline
    name: "Synapse Discipline"
    points: 20
    ref: B55
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Accessibility (only while linked to a synapse creature)", cost: "-50%"}
    notes: >
      Fearlessness 5 (+5 to Fright Checks and to Will rolls to resist
      fear, intimidation and Bestial) and High Pain Threshold (no shock
      penalty, no stun from injury), both only while within the range of
      a Synapse Creature's link (see that trait). While linked,
      Synapse Dependence's instinctive-behaviour effects are fully
      suppressed: the organism fights with total discipline, no fear, and
      follows the Hive Mind's tactical intent through the nearest synapse
      creature exactly as ordered. The moment the link breaks (the synapse
      creature dies, moves out of range, or is itself cut off from a
      larger synapse creature further up the chain), Synapse Dependence
      resumes immediately and the fearlessness and pain immunity go with
      it.
    lore: >
      A swarm fighting under a synapse creature's watch is unrecognisable
      from the same swarm cut loose: utterly fearless, feeling no pain,
      perfectly coordinated, and willing to press an attack to the last
      organism. This is the other half of the same well-documented Codex
      mechanic that makes synapse creatures the Imperium's priority
      targets, and matches framework.md's "no fear or pain within
      synapse."
    design: >
      Fearlessness 5 (B55, 2 points/level = 10) plus High Pain Threshold
      (B59, 10) = 20 points, with Accessibility (only while linked to a
      synapse creature, -50%): 20 x 0.5 = 10 points. Earlier drafts priced
      a 5-point conditional Will bonus that never delivered the
      fearlessness and pain immunity the framework and the fiction give
      Tyranids in synapse.

  - &cannot_speak
    name: "Cannot Speak"
    points: -15
    ref: B125
    tags: [Disadvantage, Physical, Xenos, Tyranids]
    notes: >
      A Tyranid organism has no language, no vocal apparatus built for
      speech, and nothing resembling individual society to speak with —
      it communicates, if at all, through the Hive Mind Link above, not
      through sound.
    lore: >
      Tyranids are never shown speaking, negotiating, or maintaining any
      culture separable from the Hive Mind's single collective will —
      universal, unremarked-on Codex background and consistent across
      every piece of Tyranid-focussed Black Library fiction.
    design: Basic Set Cannot Speak (B125), -15 points, unmodified.

  - &no_independent_society
    name: "No Independent Society (Hive Fleet Biology)"
    points: 0
    tags: [Xenos, Tyranids]
    notes: >
      0-point lore flag, the same convention this project's Ork Fungal
      Physiology and Necron Machine-Body entries use: a Tyranid organism
      has no name, no kin, no culture, and no concept of self outside the
      Hive Fleet that grew it — grown to purpose in a bio-ship's gestation
      pools and disassembled for raw biomass on death, not born, raised,
      or mourned. Every mechanical payoff of this (no language, no
      independent will outside synapse range, no fear or pain worth the
      name) is priced separately above and in each body-type lens; this
      entry exists purely to document why a Tyranid needs no name, no
      family, and no biography.
    lore: >
      Codex background across editions treats every Tyranid bioform as
      disposable biomass the Hive Fleet will reclaim and regrow into
      something else entirely, and Black Library's Hive Fleet material
      never shows a Tyranid organism with anything resembling individual
      identity — only the Hive Mind's single, continuous intent wearing
      whichever body a given battle calls for.
    design: 0 points, documentation only; see notes for why this needs no separate purchase.

  - &disease_immunity
    name: "Adapted Biology (Resistant to Disease and Toxins)"
    ref: B81
    tags: [Advantage, Physical, Xenos, Tyranids]
    modifiers:
      - {name: "Very Common: Disease, Toxins, Alien Atmospheres and Biochemistries", cost: "30", ref: B81}
      - {name: Immunity, cost: "x1", ref: B81}
    notes: "Resistant (Very Common: Disease, Toxins, Alien Biochemistry), Immunity."
    lore: >
      A Tyranid organism can be grown to digest, and fight through, almost
      any biosphere or biochemical hazard a target world can offer — part
      of the same adaptive, purpose-grown biology that lets the Hive
      Fleet consume entire ecosystems. Consistent Codex background across
      editions; Deathwatch's Mark of the Xenos material treats Tyranid
      immunity to conventional toxins and pathogens as a given for any
      Imperial biologist studying a captured specimen.
    design: >
      Resistant (Very Common), Immunity tier (B81): base value 30 for the
      broadest tabled hazard category, x1 for full Immunity = 30 points,
      the same tier and math this project's Custodes and Necron
      "Resistant to Metabolic Hazards" entries use for an adapted body
      that shrugs off disease, poison, and radiation alike.

  - name: Tyranid Biology
    container: ancestry
    tags: [Advantage, Physical, Mental, Xenos, Tyranids]
    children:
      - *hive_mind_link
      - *synapse_dependence
      - *synapse_discipline
      - *cannot_speak
      - *no_independent_society
      - *disease_immunity
    lore: >
      The Tyranid Biology shared by every bioform in a Hive Fleet: bound
      to the Hive Mind from the moment it is grown, disciplined and
      fearless only so long as a synapse creature's link holds, mute and
      without individual culture, and adapted to digest or shrug off
      almost anything a target world can throw at it. This is the
      baseline every body-type lens below (Termagant through Carnifex)
      builds on top of; the lens supplies the bioform's own attributes,
      chitin DR, and any special biology (leaping legs, rending claws,
      psychic organs, wings) that role calls for.
    design: >
      5 (Hive Mind Link) - 10 (Synapse Dependence) + 10 (Synapse
      Discipline) - 15 (Cannot Speak) + 0 (No Independent Society) + 30
      (Adapted Biology) = 20 points of shared physiology before
      attributes, chitin DR, special biology, or skills. See each
      template for a full stat block built on top of this plus a body-
      type lens.

  # --------------------------------------------------------------- chitin DR
  # Chitin is a Tyranid's body and its armour at once, exactly like
  # Necron necrodermis: natural DR bought directly on the body, per
  # framework.md's explicit instruction. This placeholder sits at level 0;
  # every body-type lens below overrides `levels`/`dr` to its own anchor
  # figure and documents that lens's own Weak Points rating and eye DR in
  # its own copy of these notes, following framework.md's "Weak Points
  # and eye lenses" rule (halve DR on a 3d Weak Points roll against a hit
  # that failed to penetrate; eye DR runs below the body's torso DR).

  - &chitin
    name: Chitin
    per_level: 5
    levels: 0
    ref: B46
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: >
      Placeholder entry at level 0. Every body-type lens below includes
      this trait with `levels` and `dr` overridden to its own anchor
      figure from framework.md's Tyranid table, and documents that
      lens's Weak Points rating and eye DR in its own copy of these
      notes: Tyranid chitin plating is organic and grows in overlapping
      but imperfect segments, with joints, sensory pits and eye clusters
      as the natural gaps a Weak Points roll represents.
    lore: >
      A Tyranid's exoskeleton is grown, not worn: dense bio-ceramic
      chitin fused directly to the flesh beneath it, thickest on the
      largest bioforms and thin enough on a Termagant to be more like a
      swarm-trooper's flak jacket than real armour plate. Universal
      across Codex background and every piece of Black Library Tyranid
      fiction.
    design: >
      Damage Resistance (B46, 5/level, all locations): natural DR bought
      directly on the body, per framework.md's explicit instruction that
      chitin is a character trait, not equipment. Each body-type lens
      overrides `levels`/`dr` to its own figure from framework.md's
      Tyranid anchor table; see that lens's own copy of this trait for
      its point cost.

  # --------------------------------------------------------------- swarm-scale aura traits
  # Both of these are innate biological/psychic broadcasts, not warp
  # sorcery in the Thaumatology: Sorcery sense (they carry no Warp
  # Sorcery or Perils of the Warp modifier, the same treatment this
  # project's Necron "Aura of Dread" gives a Cryptek's technological
  # dread-field): the Hive Mind's presence is warp-adjacent in the fiction
  # but these two specific effects are built as honest Affliction-based
  # auras, priced individually per lens below since their radius differs
  # by bioform.

  - &synapse_creature_warrior
    name: "Synapse Creature (Warrior)"
    points: 10
    ref: B35
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Advantage Delivered (grants Synapse Discipline, 10 pts)", cost: "10%"}
      - "Area Effect, 16 yards, +200%"
      - "Always On, -40%"
      - "Emanation, -20%"
    notes: >
      Every friendly Tyranid organism within 16 yards automatically gains
      Synapse Discipline's benefit and has Synapse Dependence suppressed,
      for as long as this creature is alive, conscious, and itself linked
      (directly or through a closer synapse creature) to the Hive Mind. A
      Tyranid Warrior's own Synapse Dependence is never active while it
      is drawing on the wider Hive Mind this way.
    lore: >
      Tyranid Warriors are the swarm's front-line officers precisely
      because they project this field: Codex background across editions
      names Warriors, alongside larger synapse-capable bioforms, as the
      link that keeps a local swarm fighting with purpose instead of
      degenerating into a feeding frenzy the instant a fight turns bad.
    design: >
      Affliction (B35) base 10; Advantage Delivered (a 10-point granted
      advantage, valued at +10% per this project's own Advantage/
      Disadvantage Delivered convention); Area Effect at the 16-yard tier
      (+200%, B102); Always On (-40%, B113, it cannot be switched off);
      Emanation (-20%, B111, proximity only, no attack roll). Net:
      +10+200-40-20 = +150%. 10 x 2.5 = 25 points.

  - &synapse_creature_zoanthrope
    name: "Synapse Creature (Zoanthrope)"
    points: 10
    ref: B35
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Advantage Delivered (grants Synapse Discipline, 10 pts)", cost: "10%"}
      - "Area Effect, 16 yards, +200%"
      - "Always On, -40%"
      - "Emanation, -20%"
    notes: >
      As the Tyranid Warrior's Synapse Creature trait, above: every
      friendly Tyranid organism within 16 yards gains Synapse Discipline
      and has Synapse Dependence suppressed while this Zoanthrope is
      alive, conscious, and linked to the Hive Mind.
    lore: >
      Zoanthropes double as both psychic artillery and a mobile synapse
      node, a combination Codex background calls out explicitly as part
      of why they are escorted rather than left to operate alone.
    design: >
      Identical build and math to the Tyranid Warrior's Synapse Creature
      trait, above (10 base, net +150%, 25 points) — a Zoanthrope's
      field is no wider than a Warrior's despite the psychic amplification
      that discipline goes into Shadow in the Warp instead.

  - &synapse_creature_tyrant
    name: "Synapse Creature (Hive Tyrant)"
    points: 10
    ref: B35
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Advantage Delivered (grants Synapse Discipline, 10 pts)", cost: "10%"}
      - "Area Effect, 32 yards, +250%"
      - "Always On, -40%"
      - "Emanation, -20%"
    notes: >
      As the Tyranid Warrior's Synapse Creature trait, but out to 32
      yards: every friendly Tyranid organism in range gains Synapse
      Discipline and has Synapse Dependence suppressed while this Hive
      Tyrant is alive, conscious, and linked to the Hive Mind.
    lore: >
      A Hive Tyrant is the Hive Mind's on-the-ground synapse lord: Codex
      background across editions gives it by far the largest synapse
      range of any single bioform, able to hold an entire local swarm
      together where a lone Warrior only holds a squad.
    design: >
      Affliction (B35) base 10; Advantage Delivered (+10%); Area Effect at
      the 32-yard tier (+250%, B102); Always On (-40%); Emanation (-20%).
      Net: +10+250-40-20 = +200%. 10 x 3.0 = 30 points.

  - &shadow_in_the_warp_ravener
    name: "Shadow in the Warp (Ravener)"
    points: 10
    ref: B35
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Disadvantage Delivered (Warp-Deafened: -3 to psychic skill and Warp Empowerment-related rolls, plus an immediate Fright Check on first exposure, -30 pts)", cost: "30%"}
      - "Area Effect, 8 yards, +150%"
      - "Always On, -40%"
      - "Emanation, -20%"
      - {name: "Accessibility (only affects psykers and other warp-sensitive minds)", cost: "-20%"}
    notes: >
      Any psyker (or other warp-sensitive mind) within 8 yards suffers -3
      to Psyniscience, Warp Sorcery-tagged skill rolls, and the Will roll
      to resist Perils of the Warp, and must make an immediate Fright
      Check the first time they come within range of this creature.
      Non-psychic minds are unaffected.
    lore: >
      The Hive Mind's raw psychic mass smothers the immaterium around any
      Tyranid bioform large enough to carry a fraction of it — Codex
      background describes Imperial and Aeldari psykers alike going deaf,
      blind, or outright panicking the moment a large Tyranid force
      (never just the smallest gaunts) comes close enough to sense.
      Deathwatch's Mark of the Xenos material treats Shadow in the Warp
      as a standing hazard for any Librarian escorting a kill-team
      against Tyranids.
    design: >
      Affliction (B35) base 10; Disadvantage Delivered (a compound -30
      point disadvantage — the skill/Empowerment penalty plus the forced
      Fright Check — valued per this project's own eyeballed Disadvantage
      Delivered convention, +30%); Area Effect at the 8-yard tier (+150%,
      B102); Always On (-40%); Emanation (-20%); Accessibility, limited to
      warp-sensitive targets only (-20%, the same kind of narrowing this
      project's Grey Knights Banishment entry uses for a daemon-only
      target restriction). Net: +30+150-40-20-20 = +100%. 10 x 2.0 = 20
      points. Carried by the Ravener and Lictor as this project's own
      house choice (framework.md lists Shadow in the Warp as a Tyranid
      trait without saying which bioforms carry it); the Codex ties it to
      synapse creatures and the Hive Mind's psychic presence, which is why
      the Warrior, Zoanthrope and Hive Tyrant carry it and the mindless
      Carnifex does not.

  - &shadow_in_the_warp_lictor
    name: "Shadow in the Warp (Lictor)"
    points: 10
    ref: B35
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Disadvantage Delivered (Warp-Deafened: -3 to psychic skill and Warp Empowerment-related rolls, plus an immediate Fright Check on first exposure, -30 pts)", cost: "30%"}
      - "Area Effect, 8 yards, +150%"
      - "Always On, -40%"
      - "Emanation, -20%"
      - {name: "Accessibility (only affects psykers and other warp-sensitive minds)", cost: "-20%"}
    notes: "As the Ravener's Shadow in the Warp trait, above: 8-yard radius, -3 to psychic rolls, forced Fright Check on first exposure."
    lore: A Lictor is large enough to carry the same psychic weight as any other mid-tier bioform, on top of everything else that makes it a nightmare to hunt.
    design: Identical build and math to the Ravener's Shadow in the Warp trait, above (20 points).

  - &shadow_in_the_warp_warrior
    name: "Shadow in the Warp (Tyranid Warrior)"
    points: 10
    ref: B35
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Disadvantage Delivered (Warp-Deafened: -3 to psychic skill and Warp Empowerment-related rolls, plus an immediate Fright Check on first exposure, -30 pts)", cost: "30%"}
      - "Area Effect, 16 yards, +200%"
      - "Always On, -40%"
      - "Emanation, -20%"
      - {name: "Accessibility (only affects psykers and other warp-sensitive minds)", cost: "-20%"}
    notes: >
      Any psyker within 16 yards suffers -3 to Psyniscience, Warp
      Sorcery-tagged skill rolls, and the Will roll to resist Perils of
      the Warp, and must make an immediate Fright Check the first time
      they come within range.
    lore: A Warrior's synapse role means it carries a heavier share of the Hive Mind's psychic mass than a lesser predator bioform, widening its Shadow in the Warp to match its synapse range.
    design: >
      Affliction (B35) base 10; Disadvantage Delivered (+30%); Area
      Effect at the 16-yard tier (+200%, B102); Always On (-40%);
      Emanation (-20%); Accessibility (-20%). Net: +30+200-40-20-20 =
      +150%. 10 x 2.5 = 25 points.

  - &shadow_in_the_warp_zoanthrope
    name: "Shadow in the Warp (Zoanthrope)"
    points: 10
    ref: B35
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Disadvantage Delivered (Warp-Deafened: -3 to psychic skill and Warp Empowerment-related rolls, plus an immediate Fright Check on first exposure, -30 pts)", cost: "30%"}
      - "Area Effect, 16 yards, +200%"
      - "Always On, -40%"
      - "Emanation, -20%"
      - {name: "Accessibility (only affects psykers and other warp-sensitive minds)", cost: "-20%"}
    notes: "As the Tyranid Warrior's Shadow in the Warp trait, above: 16-yard radius, -3 to psychic rolls, forced Fright Check on first exposure."
    lore: A Zoanthrope is a dedicated psychic amplifier for the Hive Mind, carrying as heavy a share of its psychic mass as a Warrior despite its small, frail body.
    design: Identical build and math to the Tyranid Warrior's Shadow in the Warp trait, above (25 points).

  - &shadow_in_the_warp_tyrant
    name: "Shadow in the Warp (Hive Tyrant)"
    points: 10
    ref: B35
    tags: [Advantage, Mental, Xenos, Tyranids]
    modifiers:
      - {name: "Disadvantage Delivered (Warp-Deafened: -3 to psychic skill and Warp Empowerment-related rolls, plus an immediate Fright Check on first exposure, -30 pts)", cost: "30%"}
      - "Area Effect, 32 yards, +250%"
      - "Always On, -40%"
      - "Emanation, -20%"
      - {name: "Accessibility (only affects psykers and other warp-sensitive minds)", cost: "-20%"}
    notes: >
