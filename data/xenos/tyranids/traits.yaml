      The Tyranid Warrior: the officer caste of the swarm, big and canny
      enough to hold real tactical initiative and to project the Hive
      Mind's discipline to the lesser bioforms nearby. Consistent Codex
      background across editions and Black Library's Hive Fleet fiction
      (chiefly the Deathwatch novels' portrayal of Warriors as the
      dangerous, thinking edge of an otherwise mindless tide).
    design: >
      303 (Attribute Modifiers) + 300 (Chitin DR 60) + 25 (Synapse
      Creature) + 25 (Shadow in the Warp) + 50 (Injury Tolerance 2) = 703 points, added to Tyranid
      Biology's 20 for 723 points of physiology alone before skills and
      its weapon-symbiotes -- in framework.md's Astartes point tier
      (550-850), matching a Warrior's role as the swarm's single most
