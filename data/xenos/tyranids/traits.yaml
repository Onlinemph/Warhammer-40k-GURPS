      basis for the classic "something was watching, then it wasn't"
      Black Library beat.
    design: >
      352 (Attribute Modifiers) + 300 (Chitin DR 60) + 20 (Chameleonic
      Hide) + 1 (Pheromone Trail) + 20 (Shadow in the Warp) + 50 (Injury Tolerance 2) = 743 points,
      added to Tyranid Biology's 20 for 763 points of physiology alone
      before skills and its weapon-symbiotes, about 40 points above the
      Tyranid Warrior lens (ST 36 against 34). See the Lictor template. NPC creature stat block
      only.

  - name: "Body Lens: Zoanthrope"
    container: meta_trait
    tags: [Advantage, Physical, Xenos, Tyranids]
    children:
      - name: "Attribute Modifiers (Zoanthrope)"
        points: 24
        attributes: {sm: 1, st: -2, ht: 2, hp: 12}
        tags: [Physical]
        design: >
          Framework target: SM +1, ST 8, DX 10, IQ 10, HT 12, HP 20.
          Decreased ST -2 (B14, 10/level, -20) for ST 8 -- a floating,
          near-vestigial body; no SM discount is taken on a decrease, per
          this project's own Termagant/Hormagaunt precedent. DX 10 is
          human baseline (0 points). IQ 10 is human baseline (0 points) --
          smart enough to channel real psychic power but no genius.
          Increased HT +2 (B15, 10/level, 20) for HT 12. Extra Hit Points
          +12 (B16, 2/level, 24) on top of the ST-8 base of 8, for HP 20
          -- a huge Extra HP purchase reflecting a body that is nearly
          all brain and psychic organ, propped up by bulk rather than
          muscle. -20+20+24 = 24.
      - name: "Chitin (Zoanthrope)"
        <<: *chitin
        levels: 40
        dr: {all: 40}
        notes: >
          DR 40, all locations. Weak Points 6 (a soft, floating body with
          only partial plating, gappier than a ground-fighting bioform of
          similar DR): on a hit that fails to penetrate, roll 3d; 6 or
          less halves DR (20). Eye clusters run at DR 20 rather than 40.
          See the Warp Field trait, below, for the psychic shield that
          sits in front of this DR.
      - *zoanthrope_warp_field
      - *synapse_creature_zoanthrope
      - *shadow_in_the_warp_zoanthrope
    lore: >
      The Zoanthrope: a dedicated psychic amplifier for the Hive Mind,
      floating on its own telekinetic field and doubling as a synapse
      node -- consistent Codex background across editions, and Black
      Library's few Zoanthrope-focussed scenes always frame it as
      artillery to be escorted, not a front-line fighter.
    design: >
      24 (Attribute Modifiers) + 200 (Chitin DR 40) + 100 (Warp Field) + 25
      (Synapse Creature) + 25 (Shadow in the Warp) = 374 points, added to
      Tyranid Biology's 20 for 394 points of physiology alone before
      skills and Warp Blast (data/xenos/tyranids/psychic.yaml). See the
      Zoanthrope template. NPC creature stat block only.

  - name: "Body Lens: Hive Tyrant"
    container: meta_trait
    tags: [Advantage, Physical, Xenos, Tyranids]
    children:
      - name: "Attribute Modifiers (Hive Tyrant)"
        points: 943
        attributes: {sm: 2, st: 90, dx: 3, iq: 2, ht: 6, hp: 30, basic_move: 3}
        tags: [Physical]
        design: >
          Framework target: SM +2, ST 100, DX 13, IQ 12, HT 16, HP 130
          (user direction: tougher; it was ST 55, HP 70). Increased ST +90
          (B14, 10/level, 900) for ST 100, with the SM +2 discount (-10%
          per point of positive SM, per B18, the same rate this project's
          Ork Warboss and Custodes entries use, here two steps): 900 x 0.8
          = 720. Increased DX +3 (60) for DX 13.
          Increased IQ +2 (B16, 20/level, 40) for IQ 12 -- a genuine
          synapse lord and psyker, sharper than any lesser bioform.
          Increased HT +6 (B15, 10/level, 60) for HT 16. Extra Hit Points
          +30 (B16, 2/level, with the SM discount: 60 x 0.8 = 48) on top of
          the ST-100 base, for HP 130, inside Pyramid 3/77's "within 30%
          of ST". Increased Basic Move +3 (B17, 5/level, 15): Basic Speed
          7.25 gives Move 7, so +3 lands Basic Move at 10.
          720+60+40+60+48+15 = 943.
      - name: "Chitin (Hive Tyrant)"
        <<: *chitin
        levels: 150
        dr: {all: 150}
        notes: >
          DR 150, all locations (user direction: tougher; was 120), level
          with the Carnifex. Weak Points 4 (a synapse lord's plating is thicker
          and better-grown than a rank-and-file predator's): on a hit
          that fails to penetrate, roll 3d; 4 or less halves DR (75).
      - *hive_tyrant_regen
      - name: High Pain Threshold
        points: 10
        ref: B59
        tags: [Advantage, Physical, Xenos, Tyranids]
        notes: No shock penalties; +3 to HT rolls to avoid knockdown and stunning.
        lore: The synapse lord is the swarm's "no pain"; it feels its wounds no more than its brood does.
        design: Basic Set High Pain Threshold (B59), 10 points (user direction, tougher).
      - *hive_tyrant_wings
      - *synapse_creature_tyrant
      - *shadow_in_the_warp_tyrant
      - name: "Injury Tolerance (Damage Reduction)"
        points: 0
        per_level: 25
        levels: 3
        ref: P53
        tags: [Advantage, Physical, Xenos, Tyranids]
        notes: >
          Divisor 3 (level = divisor): after DR and wounding multipliers,
          all injury is divided by 3 (round down, minimum 1 if anything
          penetrated).
        lore: >
          A Hive Tyrant's vast bulk and redundant organs make a killing wound very hard to land. Large synapse-beasts and monsters shrug off wounds that
          would fell smaller creatures.
        design: >
          Injury Tolerance (Damage Reduction) (GURPS Powers p. 53, 25
          points per level, level = divisor): divisor 3 = 75
          points. Gives the Hive Tyrant the bulk-and-redundant-organs toughness
          the lore describes on top of its chitin DR and extra HP.
    lore: >
      The Hive Tyrant: the Hive Mind's synapse lord and its own psyker,
      the biggest single command bioform normally seen on the ground and
      the anchor of a swarm's local tactical will. Consistent Codex
      background across editions; Black Library's Hive Fleet fiction
      routinely treats a confirmed Hive Tyrant kill as a campaign-level
      victory.
    design: >
      943 (Attribute Modifiers) + 750 (Chitin DR 150) + 25 (Regeneration)
      + 10 (High Pain Threshold) + 30 (Synapse Creature) + 30 (Shadow in the Warp) + 75 (Injury Tolerance 3) = 1863 points
      (Wings disabled by default, +30 more if enabled), added to Tyranid
      Biology's 20 for 1345 points of physiology alone before skills,
      psychic powers (data/xenos/tyranids/psychic.yaml) and weapon-
      symbiotes -- squarely in framework.md's Heroes and Legends tier
      (1,000-3,000), appropriate for the swarm's synapse lord. See the
      Hive Tyrant template. NPC creature stat block only; this total is
      for GM reference, not party balance.

