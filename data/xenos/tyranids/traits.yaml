  # ------------------------------------------------------------- special biology
  - &super_jump_hormagaunt
    name: "Leaping Musculature"
    per_level: 10
    levels: 1
    ref: B89
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: >
      Doubles jumping distance (Basic's Super Jump rule, B89/P79): a
      Hormagaunt can clear a full-grown man in a standing jump and closes
      the last few yards to a target in a single leaping bound rather
      than a run.
    lore: >
      Hormagaunts are built specifically to close distance faster than
      almost anything else in the swarm, covering ground in long,
      bounding leaps rather than a flat sprint — a consistent visual in
      Codex background and Black Library's Hive Fleet material alike.
    design: Basic Set Super Jump (B89/P79, 10 points/level), level 1, 10 points.

  - &hormagaunt_speed
    name: "Enhanced Move (Ground)"
    per_level: 20
    levels: 0.5
    ref: B52
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: "Enhanced Move (Ground) 1/2: top sprinting speed x1.5. Combat Move unchanged."
    lore: >
      Hormagaunts are bred to cover ground faster than almost anything
      else in the swarm, a flat-out bounding charge that reaches the
      line before defenders can reposition -- Codex background's
      consistent framing of the bioform.
    design: >
      Basic Set Enhanced Move (Ground) 1/2 (B52, half level 10 points),
      the same half level this project's Astartes and Aeldari files use.
      With Basic Move 12 (bought in the Attribute Modifiers) a Hormagaunt
      sprints at Move 18, matching a Space Marine's top speed.

  - &genestealer_speed
    name: "Enhanced Move (Ground)"
    per_level: 20
    levels: 1
    ref: B52
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: "Enhanced Move (Ground) 1: doubles ground Move for sprinting (Move 14 becomes 28). Combat Move unchanged."
    lore: >
      A Genestealer is consistently described and depicted as faster than
      almost anything it hunts — closing on a target from cover in a
      fraction of a second, per Codex background's "fastest killer in the
      swarm" framing and every Black Library depiction of a Genestealer
      infiltration going wrong for its prey.
    design: >
      Basic Set Enhanced Move (Ground) 1 (B52, 20 points), the same trait
      and rate this project's Astartes, Custodes and Aeldari files use for
      their own speed anchors, at a full level rather than the half-level
      those files use. Together with Basic Move 14 (bought in the
      Attribute Modifiers) a Genestealer walks at Move 14 and sprints at
      Move 28; a Space Marine has Move 12 with Enhanced Move 1/2 and
      sprints at 18, so a Genestealer outruns even a Space Marine on foot,
      in both Basic Move and top speed.

  - &genestealer_infravision
    name: Infravision
    points: 10
    ref: B60
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: "Sees body heat; ignores darkness and most concealment based on visible light alone."
    lore: >
      Genestealers hunt as often in ductwork, hab-block crawlspaces and
      unlit holds as in daylight, and Codex background is explicit that
      darkness is no protection from one.
    design: Basic Set Infravision (B60/P87, 10 points), unmodified.

  - &genestealer_extra_attack
    name: "Extra Attack (Second Claw)"
    per_level: 25
    levels: 1
    ref: B53
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: "One extra Attack maneuver per turn, using its own rending claws (see the Rending Claws weapon-symbiote for the actual attack line)."
    lore: >
      A Genestealer's four clawed limbs strike in a blur that has no
      real human equivalent — every Codex-era description and the
      classic "it's already inside the room" Black Library beat treats a
      Genestealer as attacking far more than once per second of combat.
    design: Basic Set Extra Attack (B53/P49, 25 points/level), level 1, 25 points.

  - &lictor_extra_attack
    name: "Extra Attack (Scything Talons)"
    per_level: 25
    levels: 1
    ref: B53
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: "One extra attack per turn: the Lictor's two great scything talons strike as its rending claws (see the Rending Claws weapon-symbiote for the attack line)."
    lore: >
      A Lictor kills with a flurry from its long scything talons and
      clawed arms, taking a sentry apart in a second; the Codex and Black
      Library treat a lone Lictor among a squad of Guardsmen as a
      slaughter, not a duel.
    design: Basic Set Extra Attack (B53/P49, 25 points/level), level 1, 25 points (user direction).

  - &ravener_tunnelling
    name: "Tunnelling"
    points: 30
    per_level: 5
    levels: 7
    ref: B94
    tags: [Advantage, Physical, Xenos, Tyranids]
    modifiers:
      - {name: "Accessibility (soft earth, sand and similar loose ground only)", cost: "-40%"}
    notes: >
      Tunnel Move 7 through loose earth,
      sand, or similar soft ground only (never solid rock or a hardened
      floor), submerging and re-surfacing as a single Move action; it may
      not attack while submerged. The moment it erupts from the ground it
      is treated as attacking from ambush for that turn's initial attack.
    lore: >
      Raveners burrow beneath the battlefield and erupt without warning
      beneath their target, the signature ambush Codex background gives
      the bioform and a recurring beat in Black Library's Hive Fleet
      material and Deathwatch's own Mark of the Xenos description of the
      species.
    design: >
      Basic Set Tunneling (B94, 30 base + 5/level of Tunnel Move) at Tunnel
      Move 7 = 65, with an Accessibility limitation restricting it to
      soft earth only (-40%, an eyeballed percentage in line with this
      project's own Accessibility convention): 65 x 0.6 = 39 points. This
      replaces an earlier Enhanced Move build (12 points), which doubled
      an existing Move rather than granting a burrowing mode at all.
      Tunnel Move is a separate figure from Basic Move (12 for a
      Ravener): it is set to 7 as a design choice, burrowing through
      soil being slower than running, and does not track Basic Move.

  - &lictor_chameleon
    name: "Chameleonic Hide"
    per_level: 5
    levels: 4
    ref: B41
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: >
      -4 to others' Vision rolls to spot the Lictor while it is
      motionless, or -2 while moving (per Basic's Chameleon rule, B41);
      does not work against Infravision, scent-based tracking, or other
      non-visual detection.
    lore: >
      A Lictor's hide shifts colour and texture to match its surroundings
      well enough to stand motionless in plain sight and go unnoticed
      until it strikes — the bioform's whole reason for existing in
      Codex background, and the source of its reputation as the swarm's
      perfect assassin in Black Library's Hive Fleet fiction.
    design: Basic Set Chameleon (B41/P43, 5 points/level), level 4, 20 points.

  - &lictor_pheromone_trail
    name: "Pheromone Trail"
    points: 1
    tags: [Perk, Xenos, Tyranids]
    notes: >
      Automatically marks the Lictor's path and kill sites with a
      chemical trail other Tyranid organisms can follow without a roll,
      for as long as roughly a day; the GM may use this to have the
      nearest swarm elements arrive at a Lictor's last known location
      once its scouting or killing is done.
    lore: >
      Lictors scout ahead of a landing and leave a chemical trail for the
      rest of the Hive Fleet to follow to a viable kill zone — standard
      Codex background on the bioform's actual battlefield purpose
      (infiltration and target-marking, not sustained combat).
    design: >
      Perk (B21, 1 point): a narrow, always-on tracking convenience for
      other Tyranids rather than a combat effect, priced the same way
      this project's other Perk-tier flavour traits (Necron's "Beneath a
      Daemon's Notice," this file's own Klan-style flags) are.

  - &hive_tyrant_regen
    name: "Regeneration (Adapted Biomass)"
    points: 25
    ref: B80
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: "Regeneration (Regular): recovers 1 HP per hour even without rest or first aid."
    lore: >
      Larger Tyranid bioforms visibly close wounds and regrow damaged
      tissue over the course of a battle, part of the same adaptive
      biology that lets the Hive Fleet field bioforms built to take
      punishment no unaugmented creature could survive. Codex background
      across editions gives this trait explicitly to Tyranid monstrous
      creatures.
    design: Basic Set Regeneration (Regular) (B80, 25 points).

  - &carnifex_regen
    name: "Regeneration (Adapted Biomass, Fast)"
    points: 50
    ref: B80
    tags: [Advantage, Physical, Xenos, Tyranids]
    notes: "Regeneration (Fast): recovers 1 HP per minute even without rest or first aid."
    lore: >
      A Carnifex is built to absorb an amount of damage that would kill
      any other bioform several times over and keep coming, closing
      wounds visibly fast enough to matter mid-fight — Codex background's
      consistent framing of the Carnifex as the swarm's most durable
      single-target answer to armour.
    design: >
      Basic Set Regeneration (Fast) (B80, 50 points), one tier above the
      Hive Tyrant's Regular rate, matching the Carnifex's specific
      reputation for shrugging off damage that would down a Hive Tyrant.

  - &zoanthrope_warp_field
    name: "Warp Field (Bio-Psychic Ward)"
    points: 100
    tags: [Advantage, Xenos, Tyranids]
    notes: >
      A regenerating psychic buffer, built on the same Shield Points
      mechanic framework.md's "Personal force fields" section uses for
      worn refractor fields and the like: SP 200, 2-second delay,
      recharges 25 SP/second once
      undamaged for that long, covers all locations. Damage comes off
      this pool first (armour divisors do not apply to SP); once it is
      exhausted, excess damage carries on to the Zoanthrope's chitin at
      the attack's full armour divisor, and the field needs a full 4
      seconds undamaged before it starts recharging from empty. Track
      current SP with a Uses counter, as for worn fields.
    lore: >
      A Zoanthrope generates a visible, crackling field of raw psychic
      force around its frail body — its only real protection beyond its
      own thin chitin, and Codex background's explanation for why a
      Zoanthrope can survive fire that would kill it outright without
      one. On the tabletop it has long been one of the best
      invulnerable saves in the game (3+ for most editions), better than
      a Terminator's storm shield, so bolter and lasgun fire
      spatters off it and only massed or heavy weapons break through.
    design: >
      This project has no published point-cost formula for a shield's SP
      pool (framework.md tracks worn fields as equipment with a Uses
      counter, not as a priced character trait); a Zoanthrope's field is
      part of its body rather than worn gear, so it needs an honest point
      price here. Eyeballed at half of Damage Resistance's own rate (B46,
      5 points per point of permanent DR) for a pool that absorbs the
      same amount of damage but is temporary and must recharge, i.e. 0.5
      points per SP: 200 SP x 0.5 = 100 points. Raised from 60 SP (30
      points, the Rosarius anchor) at the user's direction, because 60 SP
      broke to two bolts and the lore field outlasts a storm shield: 200 SP
      sits above framework.md's storm shield (160 SP, 20/s) and recharges
      at 25 SP/second, so a squad's bolters must keep firing to wear it
      down, while a lascannon (8dx8(5), about 224) still breaks it in one
      shot. The 4-second restart after collapse is kept. This is a reasoned
      extrapolation from Basic Set principles, not a catalogue trait
      renamed, and a future framework update that adds a formal shield-
      point pricing formula should supersede it.

  - &hive_tyrant_wings
    name: "Wings (Flight)"
    points: 40
    disabled: true
    ref: B56
    tags: [Advantage, Physical, Xenos, Tyranids]
    modifiers:
      - {name: Winged, cost: "-25%", ref: B56}
    notes: >
      Disabled by default; enable for a winged Hive Tyrant variant. Air
      Move equals twice Basic Speed (dropping fractions), per Basic's
      Flight rule; Winged flight cannot hover and is grounded by high
      winds or a damaged wing, same as any other winged flier.
    lore: >
      Some Hive Tyrants are grown with a huge, membranous wing pair for
      genuine flight rather than the leaping glides other large bioforms
      manage — a well-known wargear/bioform option across Codex editions
      and a striking image in Black Library's Hive Fleet material
      whenever a Winged Hive Tyrant appears.
    design: >
      Basic Set Flight (B56, 40 points) with the Winged limitation (-25%,
      B56, cannot hover, grounded by bad weather or wing damage): 40 x
      0.75 = 30 points.

  # --------------------------------------------------------------- body lenses
  # Each lens sets ST/DX/IQ/HT/HP/SM to framework.md's anchor line for
  # that bioform and includes Chitin at the matching DR, Weak Points
  # rating and eye DR, plus whatever special biology that role calls for.
  # A template includes exactly one body lens on top of Tyranid Biology.

  - name: "Body Lens: Termagant"
    container: meta_trait
    tags: [Advantage, Physical, Xenos, Tyranids]
    children:
      - name: "Attribute Modifiers (Termagant)"
        points: -90
        attributes: {sm: -1, st: -1, dx: 1, iq: -6, ht: 1, basic_move: 2}
        tags: [Physical]
        design: >
          Framework target: SM -1, ST 9, DX 11, IQ 4, HT 11, HP 9.
          Decreased ST -1 (B14, 10/level, -10) for ST 9. Increased DX +1
          (B15, 20/level, 20) for DX 11 -- a gun-beast bred for a steady
          aim despite its small frame. Decreased IQ -6 (B16, 20/level,
          -120) for IQ 4, barely above pure animal cunning, matching a
          creature with essentially no independent judgement outside the
          Hive Mind Link. Increased HT +1 (B15, 10/level, 10) for HT 11.
          Base HP from ST 9 is already 9, the framework target, so no
          separate Extra Hit Points purchase. SM -1 carries no independent
          point cost, per this project's Ork Gretchin precedent (no ST
          premium is applied for a negative Size Modifier). Increased Basic
          Move +2 (B17, 5/level, 10): Basic Speed 5.5 gives Move 5, so +2
          lands the swarm's skirmishing gun-beast at Move 7, a brisk trot
          that keeps a firing line advancing. -10+20-120+10+10 = -90.
      - name: "Chitin (Termagant)"
        <<: *chitin
        levels: 25
        dr: {all: 25}
        notes: >
          DR 25, all locations. Weak Points 7 (thin, gappy plates on a
          swarm-scale gun-beast, per framework.md's own "flak-tier" Weak
          Points figure for the loosest armour in this project): on a hit
          that fails to penetrate, roll 3d; 7 or less halves DR (13,
          rounded down) against that hit. Eye clusters run at DR 12
          (roughly half the body DR) rather than 25.
    lore: >
      The Termagant: the Hive Fleet's basic gun-beast, grown cheaply and
      in huge numbers to advance in a firing line ahead of, or alongside,
      heavier bioforms. Consistent across Codex background and Black
      Library's Hive Fleet fiction as the swarm's most disposable ranged
      infantry.
    design: >
      -90 (Attribute Modifiers) + 125 (Chitin DR 25, 5/level) = 35
      points, added to Tyranid Biology's 20 for 55 points of physiology
      alone before skills and its weapon-symbiote. See the Termagant
      template. NPC creature stat block only, not a player-facing race;
      the point total below is for GM reference, not party balance.

  - name: "Body Lens: Hormagaunt"
    container: meta_trait
    tags: [Advantage, Physical, Xenos, Tyranids]
    children:
      - name: "Attribute Modifiers (Hormagaunt)"
        points: 0
        attributes: {sm: -1, st: 2, dx: 3, iq: -6, ht: 1, basic_move: 6}
        tags: [Physical]
        design: >
          Framework target: SM -1, ST 12, DX 13, IQ 4, HT 11, HP 12.
          Increased ST +2 (B14, 10/level, 20) for ST 12 (strength ladder:
          a Hormagaunt is a lean, wiry killer, a little stronger than a
          human; no discount, per the negative-SM note below). Increased DX +3 (B15, 20/level,
          60) for DX 13 -- a bounding, close-combat killer well past a
          Termagant's steadier aim. Decreased IQ -6 (-120) for IQ 4, as
          debased as a Termagant's. Increased HT +1 (10) for HT 11. Base
          HP from ST 12 is already 12, the framework target, so no
          separate Extra Hit Points purchase. SM -1 carries no
          independent cost, as the Termagant lens above. Increased Basic
          Move +6 (B17, 5/level, 30): Basic Speed 6.0 gives Move 6, so +6
          makes Basic Move 12, the swarm's fastest sprinter short of a
          Genestealer (see also Enhanced Move 1/2 below). 20+60-120+10+30 = 0.
      - name: "Chitin (Hormagaunt)"
        <<: *chitin
        levels: 25
        dr: {all: 25}
        notes: >
          DR 25, all locations. Weak Points 7 (as thin and gappy as a
          Termagant's plating, per framework.md's flak-tier figure): on a
          hit that fails to penetrate, roll 3d; 7 or less halves DR (13,
          rounded down). Eye clusters run at DR 12 rather than 25.
      - *super_jump_hormagaunt
      - *hormagaunt_speed
    lore: >
      The Hormagaunt: a close-combat swarm killer bred for speed over
      firepower, closing on its target in long bounding leaps rather than
      a flat sprint before its scything talons go to work. Codex
      background across editions and Black Library's Hive Fleet fiction
      both treat Hormagaunts as the swarm's fastest melee threat at this
      tier.
    design: >
      0 (Attribute Modifiers) + 125 (Chitin DR 25) + 10 (Leaping
      Musculature) + 10 (Enhanced Move 1/2) = 145 points, added to
      Tyranid Biology's 20 for 145
      points of physiology alone before skills and its weapon-symbiote.
      See the Hormagaunt template. NPC creature stat block only.

  - name: "Body Lens: Genestealer"
    container: meta_trait
    tags: [Advantage, Physical, Xenos, Tyranids]
    children:
      - name: "Attribute Modifiers (Genestealer)"
        points: 289
        attributes: {st: 16, dx: 7, iq: -4, ht: 3, hp: 2, basic_move: 7}
        tags: [Physical]
        design: >
          Framework target: SM 0, ST 26, DX 17, IQ 6, HT 13, HP 28.
          Increased ST +16 (B14, 10/level, 160) for ST 26 (strength
          ladder: a Necron Warrior's strength, short of a Marine's 30). Increased DX +7
          (B15, 20/level, 140) for DX 17 -- past an Astartes Battle-
          Brother's own precision, the fiction's "fastest killer in the
          swarm" made literal. Decreased IQ -4 (B16, 20/level, -80) for IQ
          6 -- animal-cunning-plus, enough for a genuinely dangerous
          infiltration predator without any real reasoning. Increased HT
          +3 (B15, 10/level, 30) for HT 13. Extra Hit Points +2 (B16,
          2/level, 4) on top of the ST-26 base of 26, for HP 28. Increased
          Basic Move +7 (B17, 5/level, 35): Basic Speed is (17+13)/4 =
          7.5, Move 7, so +7 lands Basic Move at exactly 14. 160+140-80+30+4+35
          = 289.
      - name: "Chitin (Genestealer)"
        <<: *chitin
        levels: 50
        dr: {all: 50}
        notes: >
          DR 50, all locations. Weak Points 5 (tighter, more developed
          plating than a swarm gaunt's, on a par with Guard-pattern
          carapace, per framework.md's own figure for that tier): on a
          hit that fails to penetrate, roll 3d; 5 or less halves DR (25).
          Eye clusters run at DR 25 rather than 50.
      - *genestealer_speed
      - *genestealer_infravision
      - *genestealer_extra_attack
    lore: >
      The Genestealer: the fastest, most dangerous close-quarters killer
      the swarm fields at this tier, and the origin point of a broodline
      infestation that can subvert a whole world before the main Hive
      Fleet arrives. Consistent Codex background across editions and a
      recurring Black Library horror-fiction staple (an infiltrating
      Genestealer moving faster than anyone in the room can react).
    design: >
      289 (Attribute Modifiers) + 250 (Chitin DR 50) + 20 (Enhanced Move
      1) + 10 (Infravision) + 25 (Extra Attack) = 594 points, added
      to Tyranid Biology's 20 for 614 points of physiology alone before
      skills and its weapon-symbiote. See the Genestealer template. NPC
      creature stat block only; a Genestealer's broodline-infestation
      role is a GM plot hook, not a point-costed trait.

  - name: "Body Lens: Ravener"
    container: meta_trait
    tags: [Advantage, Physical, Xenos, Tyranids]
    children:
      - name: "Attribute Modifiers (Ravener)"
        points: 251
        attributes: {sm: 1, st: 22, dx: 4, iq: -5, ht: 4, hp: 4, basic_move: 5}
        tags: [Physical]
        design: >
          Framework target: SM +1, ST 32, DX 14, IQ 5, HT 14, HP 36.
          Increased ST +22 (B14, 10/level, 220) for ST 32 (strength
          ladder: a Primaris Marine's strength), with the SM +1
          cost break (-10% per B18's Size and Strength Table for a
          creature whose bulk matches its size, the same discount this
          project's Ork Warboss and Custodes Attribute Modifiers entries
          take): 220 x 0.9 = 198. Increased DX +4 (B15, 20/level, 80) for
          DX 14 -- a serpentine burrowing predator, quick despite its
          bulk. Decreased IQ -5 (B16, 20/level, -100) for IQ 5, barely
          above a Termagant's. Increased HT +4 (B15, 10/level, 40) for HT
          14. Extra Hit Points +4 (B16, 2/level, 8) on top of the ST-32
          base of 32, for HP 36. Increased Basic Move +5 (B17, 5/level, 25):
          Basic Speed 7.0 gives Move 7, so +5 lands Basic Move at 12.
          198+80-100+40+8+25 = 251.
      - name: "Chitin (Ravener)"
        <<: *chitin
        levels: 60
        dr: {all: 60}
        notes: >
          DR 60, all locations. Weak Points 5 (as a Genestealer's,
          matching framework.md's own figure for this tier): on a hit
          that fails to penetrate, roll 3d; 5 or less halves DR (30). Eye
          clusters run at DR 30 rather than 60.
      - *ravener_tunnelling
      - *shadow_in_the_warp_ravener
      - name: "Injury Tolerance (Damage Reduction)"
        points: 0
        per_level: 25
        levels: 2
        ref: P53
        tags: [Advantage, Physical, Xenos, Tyranids]
        notes: >
          Divisor 2 (level = divisor): after DR and wounding multipliers,
          all injury is divided by 2 (round down, minimum 1 if anything
          penetrated).
        lore: >
          The Ravener's segmented, muscled body keeps moving through damage. Large synapse-beasts and monsters shrug off wounds that
          would fell smaller creatures.
        design: >
          Injury Tolerance (Damage Reduction) (GURPS Powers p. 53, 25
          points per level, level = divisor): divisor 2 = 50
          points. Gives the Ravener the bulk-and-redundant-organs toughness
          the lore describes on top of its chitin DR and extra HP.
    lore: >
      The Ravener: a serpentine burrowing predator that erupts from
      beneath a defensive line rather than crossing open ground to reach
      it. Codex background across editions is explicit that this ambush
      capability, not raw combat stats, is the Ravener's whole purpose.
    design: >
      251 (Attribute Modifiers) + 300 (Chitin DR 60) + 39 (Tunnelling) +
      20 (Shadow in the Warp) + 50 (Injury Tolerance 2) = 660 points, added to Tyranid Biology's 20
      for 680 points of physiology alone before skills and its weapon-
      symbiote. See the Ravener template. NPC creature stat block only.

