kind: template
output: Xenos/Tyranids/Templates/Genestealer.gct
notes: >
  NPC creature stat block, not a player-facing race. Point math: Tyranid
  Biology 20 + Body Lens: Genestealer 721 + Rending Claws 38 + skills
  12 + Hunting Senses 30 = 821 points. Stats:
  SM 0, ST 26, DX 17, IQ 6, HT 13, HP 34, Will 6, Per 12, natural chitin
  torso DR 50 (Weak Points 5, eye DR 25), Basic Move 14 (Basic Speed
  7.5) with Enhanced Move (Ground) 1, Infravision, Extra Attack (second
  claw), Clinging, Lightning Reflexes (Combat Reflexes, Enhanced Dodge 2) and Injury Tolerance (Damage Reduction) 2 — framework.md's Genestealer anchor line (ST raised to 26 per the
  strength ladder, HP 34 from Extra HP), with DX raised to 17
  and Basic Move bought up to 14 so it outruns even a Space Marine
  (Move 12, Enhanced Move 1/2). This sits in framework.md's Astartes tier
  (550-850): the fastest and most dangerous single killer the swarm
  fields below a Warrior, though still without any independent
  tactical will outside a broodline's own infiltration plans. The point
  total is for GM reference only; a Genestealer's broodline-infestation
  hook is a GM plot tool, not a purchased trait.

  Weapon-symbiote: carries Rending Claws, built as a natural-attack
  trait in data/xenos/tyranids/bio-weapons.yaml (the Extra Attack trait
  above lets a Genestealer make two such attacks per turn).
traits:
  - name: Hunting Senses
    points: 30
    attributes: {per: 6}
    tags: [Mental]
    notes: Per +6 (Per 12).
    lore: >-
      Every bioform is grown to find prey for the Hive Mind: whatever its wits, its senses are a hunter's, and the swarm notices a man in a hedgerow long before it could understand what he is.
    design: >-
      Per +6 at 5 points a level (B16), from Per 6 to Per 12: user direction that low-IQ creatures should
      still perceive at 10-12, so a swarm can spot an enemy in the simulator instead of walking blind into its fire.
  - include: "xenos/tyranids/traits.yaml#Tyranid Biology"
  - include: "xenos/tyranids/traits.yaml#Body Lens: Genestealer"
  - include: "xenos/tyranids/bio-weapons.yaml#Rending Claws"
skills:
  - name: Brawling
    diff: DX/E
    points: 8
    tags: [Xenos, Tyranids]
    lore: A Genestealer's four clawed limbs strike faster and more precisely than almost anything else the swarm fields.
    design: DX+3 (20) for 8 points, Easy — matching the rending claws' own natural-weapon attack roll, used for both of its Extra Attack strikes.
  - name: Stealth
    diff: DX/A
    points: 4
    tags: [Xenos, Tyranids]
    lore: A Genestealer infiltrates ahead of the Hive Fleet's main force, moving through ducts, crawlspaces and shadow without being seen until it is already in the room.
    design: DX+1 (18) for 4 points, Average.
