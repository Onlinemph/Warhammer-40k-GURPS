kind: template
output: Xenos/Tyranids/Templates/Termagant.gct
notes: >
  NPC creature stat block, not a player-facing race — a Termagant is
  disposable swarm biomass, not an individual worth building as a PC.
  Point math: Tyranid Biology 20 + Body Lens: Termagant 35 + Fleshborer
  54 + skills 6 + Hunting Senses 40 = 155 points. Stats: SM -1, ST 9, DX 11, IQ 4, HT 11,
  HP 9, Will 4, Per 12,
  natural chitin torso DR 25 (Weak Points 7, eye DR 12), Basic Move 7 — framework.md's
  Termagant anchor line exactly. This lands at the bottom of
  framework.md's Trained Soldier tier (100-175), most of it spent on its
  fleshborer symbiote rather than the animal underneath: a cheap,
  mass-produced gun-beast that is only dangerous in numbers and only
  disciplined while a synapse creature holds its leash. The point total
  is for GM reference (how much a Termagant "costs" relative to other
  bioforms), never a measure of individual threat or party balance.

  Weapon-symbiote: carries a Fleshborer, built as a natural-attack trait
  in data/xenos/tyranids/bio-weapons.yaml.
traits:
  - name: Hunting Senses
    points: 40
    attributes: {per: 8}
    tags: [Mental]
    notes: Per +8 (Per 12).
    lore: >-
      Every bioform is grown to find prey for the Hive Mind: whatever its wits, its senses are a hunter's, and the swarm notices a man in a hedgerow long before it could understand what he is.
    design: >-
      Per +8 at 5 points a level (B16), from Per 4 to Per 12: user direction that low-IQ creatures should
      still perceive at 10-12, so a swarm can spot an enemy in the simulator instead of walking blind into its fire.
  - include: "xenos/tyranids/traits.yaml#Tyranid Biology"
  - include: "xenos/tyranids/traits.yaml#Body Lens: Termagant"
  - include: "xenos/tyranids/bio-weapons.yaml#Fleshborer"
skills:
  - name: Innate Attack
    spec: Projectile
    diff: DX/E
    points: 4
    tags: [Xenos, Tyranids]
    lore: >
      A Termagant's fleshborer beetles are loosed with a simple, drilled
      reflex rather than any real marksmanship — the gun-beast points and
      the Hive Mind's instinct does the rest.
    design: >
      Innate Attack (Projectile) (DX/E, B201) at DX+2 (13) for 4 points,
      the skill that governs any Innate Attack-built natural weapon's
      to-hit roll, matching the fleshborer's own build once
      bio-weapons.yaml defines it.
  - name: Brawling
    diff: DX/E
    points: 2
    tags: [Xenos, Tyranids]
    lore: A Termagant falls back on tooth and claw only when its fleshborer is spent or the fight closes past ranged distance.
    design: DX+1 (12) for 2 points, Easy.
