kind: template
output: Xenos/Tyranids/Templates/Carnifex.gct
notes: >
  NPC creature stat block, not a player-facing race. Point math: Tyranid
  Biology 20 + Body Lens: Carnifex 1710 (incl. Injury Tolerance 3) + Monstrous Crushing Claws 79 +
  Venom Cannon 225 + skills 16 = 2050 points. Stats:
  SM +2, ST 120 (user direction: flips tanks with little struggle), DX 10, IQ 4, HT 16, HP 120, Will 4, Per 4, Basic Move 9, natural chitin
  torso DR 150 (Weak Points 3, eye DR 75), Regeneration (Fast) —
  framework.md's Carnifex anchor line exactly. It carries no Shadow in the
  Warp or synapse role: it is a mindless siege beast.
  This lands squarely in framework.md's Heroes and Legends tier
  (1,000-3,000), matching a Hive Tyrant's own physiology cost almost
  exactly despite the very different build (raw ST and DR rather than
  IQ, synapse range and psychic power): a living battering ram bred to
  soak up and deal out damage nothing else on the battlefield can match.
  The point total is for GM reference only, not party balance.

  Weapon-symbiotes: carries Monstrous Crushing Claws and a Venom
  Cannon — a classic Carnifex loadout of one melee and one heavy ranged
  symbiote, both built as natural-attack traits in
  data/xenos/tyranids/bio-weapons.yaml.
traits:
  - include: "xenos/tyranids/traits.yaml#Tyranid Biology"
  - include: "xenos/tyranids/traits.yaml#Body Lens: Carnifex"
  - include: "xenos/tyranids/bio-weapons.yaml#Monstrous Crushing Claws"
  - include: "xenos/tyranids/bio-weapons.yaml#Venom Cannon"
skills:
  - name: Brawling
    diff: DX/E
    points: 12
    tags: [Xenos, Tyranids]
    lore: A Carnifex's monstrous crushing claws can pulp a light vehicle or a squad's cover in a single blow.
    design: DX+4 (14) for 12 points, Easy. Raised from 12 after the combat simulator showed a Carnifex almost never landing a blow on a retreating Marine (Dodge 15); a beast bred for nothing but close assault needs a trained fighter's skill.
  - name: Innate Attack
    spec: Projectile
    diff: DX/E
    points: 4
    tags: [Xenos, Tyranids]
    lore: A Carnifex's venom cannon is aimed with as little finesse as everything else about it, but at its size that scarcely matters.
    design: Innate Attack (Projectile) (DX/E, B201) at DX+2 (12) for 4 points, Easy.
