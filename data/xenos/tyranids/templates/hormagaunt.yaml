kind: template
output: Xenos/Tyranids/Templates/Hormagaunt.gct
notes: >
  NPC creature stat block, not a player-facing race. Point math: Tyranid
  Biology 20 + Body Lens: Hormagaunt 145 + Scything Talons (Hormagaunt)
  45 + skills 4 + Hunting Senses 40 = 254 points. Stats:
  SM -1, ST 12, DX 13, IQ 4, HT 11, HP 12, Will 4, Per 12, natural chitin
  torso DR 25 (Weak Points 7, eye DR 12), Basic Move 12 (Basic Speed
  6.0) with Enhanced Move (Ground) 1/2, Super Jump 1 (leaping
  musculature) — framework.md's Hormagaunt anchor line exactly. This
  lands in the lower half of framework.md's Elite Human tier (200-350):
  a genuinely fast, dangerous close-combat swarm killer, but still
  disposable biomass rather than an individual threat outside a swarm.
  The point total is for GM reference only.

  Weapon-symbiote: carries Scything Talons (Hormagaunt), 5d+2(2) cut at its ST 12 (the
  ST-34 Warrior version would give only 3d+2(2) and could not reliably hurt flak), built
  as a natural-attack trait in data/xenos/tyranids/bio-weapons.yaml.
traits:
  - name: Hunting Senses
    points: 40
    attributes: {per: 8}
    tags: [Mental]
    notes: Per +8 (Per 12).
    lore: >-
      Every bioform is grown to find prey for the Hive Mind: whatever its wits, its senses are a hunter's, and the swarm notices a man in a hedgerow long before it could understand what he is.
    design: >-
      Per +8 at 5 points a level (B16), from Per 4 to Per 12: user direction that low-IQ creatures should
      still perceive at 10-12, so a swarm can spot an enemy in the simulator instead of walking blind into its fire.
  - include: "xenos/tyranids/traits.yaml#Tyranid Biology"
  - include: "xenos/tyranids/traits.yaml#Body Lens: Hormagaunt"
  - include: "xenos/tyranids/bio-weapons.yaml#Scything Talons (Hormagaunt)"
skills:
  - name: Brawling
    diff: DX/E
    points: 4
    tags: [Xenos, Tyranids]
    lore: A Hormagaunt closes the last few yards to a kill in a leaping bound before its scything talons go to work.
    design: DX+2 (15) for 4 points, Easy — matching the talons' own natural-weapon attack roll.
