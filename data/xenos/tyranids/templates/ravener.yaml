kind: template
output: Xenos/Tyranids/Templates/Ravener.gct
notes: >
  NPC creature stat block, not a player-facing race. Point math: Tyranid
  Biology 20 + Body Lens: Ravener 570 (incl. Injury Tolerance 2) + Scything Talons 28 + skills 8 =
  626 points. Stats: SM
  +1, ST 22, DX 14, IQ 5, HT 14, HP 26, Will 5, Per 5, natural chitin
  torso DR 60 (Weak Points 5, eye DR 30), Basic Move 12 (Tunnel Move 7, a separate figure), Tunnelling,
  Shadow in the Warp (8 yards) — framework.md's Ravener anchor line exactly. This sits just
  above framework.md's Senior Agents tier (350-600), in the Astartes tier's
  (550-850) lower end: a burrowing
  ambush predator whose whole value is erupting where it is least
  expected, not standing toe-to-toe once found. The point total is for
  GM reference only.

  Weapon-symbiote: carries Scything Talons, the classic Ravener
  close-combat loadout, built as a natural-attack trait in
  data/xenos/tyranids/bio-weapons.yaml.
traits:
  - include: "xenos/tyranids/traits.yaml#Tyranid Biology"
  - include: "xenos/tyranids/traits.yaml#Body Lens: Ravener"
  - include: "xenos/tyranids/bio-weapons.yaml#Scything Talons"
skills:
  - name: Brawling
    diff: DX/E
    points: 4
    tags: [Xenos, Tyranids]
    lore: A Ravener erupts from the ground already lashing out with its scything talons.
    design: DX+2 (16) for 4 points, Easy.
  - name: Stealth
    diff: DX/A
    points: 4
    tags: [Xenos, Tyranids]
    lore: A Ravener's ambush depends on approaching unseen beneath the ground until the moment it erupts.
    design: DX+1 (15) for 4 points, Average.
