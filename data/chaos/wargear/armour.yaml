kind: equipment
output: Chaos/Equipment/Heretic Armour.eqp
items:

  # Each entry includes the loyalist suit (same DR by location, weight, cost, servo ST and, for
  # the Mark VII, the same subsystem children) and overrides the Weak Points, tags and text.

  - include: "imperium/armour/armour.yaml#Power Armour, Mark II (Crusade Pattern)"
    name: Power Armour, Mark II (Heretic)
    tags: [Body Armor, Chaos, Heretic Astartes]
    weak_points: 7
    notes: >-
      Requires the black carapace interface to move and fight at full efficiency. Early plate with
      poor seals even when new, and no forge-temple has serviced this one in ten thousand years
      (Weak Points 7). Rigid heavy armour DX/Stealth penalties apply.
    lore: >-
      Mark II plate was worn by the Legions of the Great Crusade, so a great deal of it ended up
      on the traitor side of the Horus Heresy. Warbands still wear it, patched with spikes,
      cast-off trophies and whatever their own armourers can bang into shape. Black Library
      Horus Heresy and Chaos Space Marine fiction shows traitor plate as worn, scarred and
      repaired in the field.
    design: >-
      DR, servo ST, weight and cost are those of the loyalist Mark II (Crusade Pattern) entry,
      which this entry includes. Weak Points are one higher, 6 to 7, as the Chaos section of
      framework.md directs: ten thousand years without a forge-temple means worn seals and
      hand-mended joints, though the plate itself is as thick as ever.

  - include: "imperium/armour/armour.yaml#Power Armour, Mark III (Iron Armour)"
    name: Power Armour, Mark III (Heretic)
    tags: [Body Armor, Chaos, Heretic Astartes]
    weak_points: 5
    notes: >-
      Heaviest of the Heresy-era patterns (treat as an extra -1 to Dodge or an extra step of
      encumbrance at the GM's discretion, on top of the usual rigid heavy armour penalties).
      Requires the black carapace interface. Worn seals and joints: Weak Points 5.
    lore: >-
      Iron Armour was the plate of breaching and siege work in the Heresy and is still worn by
      traitor assault troops, its thick frontal plate now dented, rewelded and often marked with
      the sigils of a god. The Chaos forges that keep it running do so by habit and sorcery,
      not by the rites of the Cult Mechanicus.
    design: >-
      DR, servo ST, weight and cost are those of the loyalist Mark III entry, included
      unchanged. Weak Points go from 4 to 5 (framework.md, Chaos: armour keeps the loyalist DR
      of its mark with Weak Points +1).

  - include: "imperium/armour/armour.yaml#Power Armour, Mark IV (Maximus Pattern)"
    name: Power Armour, Mark IV (Heretic)
    tags: [Body Armor, Chaos, Heretic Astartes]
    weak_points: 6
    notes: >-
      Interlocking plate sections reduce the usual bulky-armour penalty by 1 relative to other
      Marks at the GM's discretion (still requires the black carapace interface). Worn seals
      and joints: Weak Points 6.
    lore: >-
      Mark IV Maximus plate is the commonest armour of the Traitor Legions in Black Library
      fiction: it was the mainline suit at the end of the Heresy and nothing has replaced it for
      the Legions that fled into the Eye of Terror. Suits are repaired, never rebuilt, and often
      carry a god's mark in brass, bone or paint.
    design: >-
      DR, servo ST, weight and cost match the loyalist Mark IV (Maximus Pattern) entry, included
      unchanged. Weak Points 5 to 6, per the framework's Chaos armour rule (ten thousand years
      without a forge-temple). This is the reference traitor suit: Rubric and Plague-Fused plate
      below are variants of it.

  - include: "imperium/armour/armour.yaml#Power Armour, Mark VI (Corvus Pattern)"
    name: Power Armour, Mark VI (Heretic)
    tags: [Body Armor, Chaos, Heretic Astartes]
    weak_points: 6
    notes: >-
      Reduced bulk penalty (as Mark IV) reflecting the pattern's emphasis on speed. Requires the
      black carapace interface. Worn seals and joints: Weak Points 6.
    lore: >-
      The light Corvus pattern went to the Legions that favoured speed and ambush, and a share of
      those Legions turned traitor. Their surviving suits keep the beaked helm and the light
      frame, and the long-unserviced joints that go with them.
    design: >-
      DR, servo ST, weight and cost match the loyalist Mark VI entry, included unchanged. Weak
      Points 5 to 6 as for every traitor suit (framework.md, Chaos).

  - include: "imperium/armour/armour.yaml#Power Armour, Mark VII (Aquila Pattern)"
    name: Power Armour, Mark VII (Heretic)
    tags: [Body Armor, Chaos, Heretic Astartes]
    weak_points: 5
    notes: >-
      Same suit as the loyalist Mark VII (Aquila Pattern) with worn seals and joints, Weak
      Points 5 rather than 4. Requires the black carapace interface: without one the wearer
      fights at -4 DX and half Basic Move and cannot use the auto-senses or weapon interlocks.
      Assembled weight 240 lb; the subsystems below are part of the suit, not extras.
    lore: >-
      Mark VII plate is mostly a loyalist pattern, but renegade Chapters and Legionaries who
      looted a loyalist armoury wear it too. In Chaos hands the suit is rarely maintained to
      the standard a Chapter armoury would keep.
    design: >-
      Included from the loyalist Mark VII entry, so the DR, weight (150 lb shell, 240 lb with
      subsystems), cost, and the subsystem children (auto-senses, vox, respirator, recyclers,
      servo actuators with lifting 9 and striking 5 ST on the servo child only) are identical.
      The only change is Weak Points 4 to 5 (framework.md, Chaos).

  - include: "imperium/armour/armour.yaml#Tactical Dreadnought Armour, Tartaros Pattern"
    name: Tactical Dreadnought Armour, Tartaros Pattern (Heretic)
    tags: [Body Armor, Chaos, Heretic Astartes]
    weak_points: 4
    notes: >-
      Effective SM +1 while worn. Basic Move -1, and DX-based fine work at an extra -1. Requires
      the black carapace interface. Worn seals and joints: Weak Points 4.
    lore: >-
      Tartaros was built for boarding actions in the Heresy, and the Traitor Legions kept every
      suit they had. Chaos Terminators are the elite of a warband; their plate is old, stained
      and often fused with sigils, spikes and trophies.
    design: >-
      DR (torso 190, arms and legs 165, neck 128, face 140, eye 142, hand 115, foot 140), servo
      ST (lifting 18, striking 9), SM +1, Basic Move -1, weight 250 lb and cost are those of the
      loyalist Tartaros entry, included unchanged. Weak Points 3 to 4 (framework.md, Chaos:
      Terminator 3 to 4).

  - include: "imperium/armour/armour.yaml#Power Armour, Mark IV (Maximus Pattern)"
    name: Power Armour, Mark IV (Rubric)
    tags: [Body Armor, Chaos, Heretic Astartes, Tzeentch, Thousand Sons]
    weak_points: 5
    notes: >-
      Sealed. The suit's seals are soldered shut and the wearer is dust, so there is no flesh
      behind a gap in the plate. Weak Points are the loyalist figure, 5. Normally worn by a
      Rubric Marine; the servo ST listed still applies.
    lore: >-
      After the Rubric of Ahriman, the Thousand Sons who survived as dust were sealed into their
      armour. The suit is closed with sorcerous seals and kept in repair by the Legion's
      sorcerers, so it is in better condition than most traitor plate (Black Library, the
      Horus Heresy novel A Thousand Sons, and later Thousand Sons fiction).
    design: >-
      Mark IV DR, servo ST, weight and cost as the loyalist entry, included unchanged. Weak
      Points stay at the loyalist 5 rather than the heretic 6: the framework (Chaos, armour)
      says Rubric plate has the seals soldered shut, so the one thing that wears in other
      traitor suits has been fixed. Nothing inside to wound through a gap is covered by the
      Rubric Marine's own traits, not by this entry.

  - include: "imperium/armour/armour.yaml#Power Armour, Mark IV (Maximus Pattern)"
    name: Power Armour, Plague-Fused
    tags: [Body Armor, Chaos, Heretic Astartes, Nurgle, Death Guard]
    weak_points: 6
    notes: >-
      The wearer's Nurgle's Gift natural DR adds on top of the armour DR listed here. Seals are
      rotted and leak: Weak Points 6. The suit cannot be taken off; it has grown into the body.
    lore: >-
      Death Guard plate has rusted, blistered and in places fused with the flesh beneath it,
      weeping fluids and crawling with vermin. The Plague Marines wear it as a gift from
      Nurgle, not as damage (Black Library Death Guard fiction, and the Horus Heresy novel
      Mortis for the Legion's fall).
    design: >-
      Mark IV heretic DR (torso 95, arms and legs 83, neck 58, face 70, eye 71, hand 58, foot
      70), servo ST, weight and cost, included from the loyalist Mark IV entry. Weak Points 6
      as for any traitor Mark IV. The Plague Marine's Nurgle's Gift (fused rotting flesh DR 10,
      Injury Tolerance) is a trait and adds on top of the armour; it is not counted here, so
      nothing is added twice.
