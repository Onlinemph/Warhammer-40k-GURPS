kind: template
output: Chaos/Templates/Chaos Cultist Champion.gct
notes: >-
  The hardened fanatic who leads a cultist mob: a gang boss, a preacher's enforcer, the one who
  survived the last purge. Built from the Chaos Cultist (IQ 9 and Cultist's Devotion carry over) with
  ST 11 (+10), DX 11 (+20), IQ 9 (-20), HT 11 (+10) = 20; Fit 5, Single-Minded 5, Fearlessness 2 4,
  High Pain Threshold 10 = 24; Cultist's Devotion -20; skills 72. About 96 points, above the plain
  cultist and below the trained-soldier tier. Leadership 11, Intimidation 12 and a chainsword or crude
  axe at 12 are what set him apart; wargear is in the wargear files. Add a single god's Mark (Chaos
  Traits) for a champion of one power.
traits:
- name: ST
  points: 10
  tags:
  - Attribute
  lore: A cult's strongest bully, fed first and fighting hardest.
  design: ST 11, +1 over baseline, 10/level (B14).
- name: DX
  points: 20
  tags:
  - Attribute
  lore: A veteran of the cult's brawls and skirmishes.
  design: DX 11, +1 over baseline, 20/level (B15).
- name: IQ
  points: -20
  tags:
  - Attribute
  lore: Cultists are taken from the desperate and the credulous, and the cult does the thinking.
  design: IQ 9, Decreased IQ -1 (B16, 20/level) = -20 points.
- name: HT
  points: 10
  tags:
  - Attribute
  lore: Survivor of a dozen purges and brawls.
  design: HT 11, +1 over baseline, 10/level (B14).
- name: Fit
  points: 5
  ref: B55
  tags:
  - Advantage
  - Physical
  lore: Years of hard labour and cult-cellar brawling keep a cultist wiry.
  design: Basic Set Fit (B55), 5 points.
- name: Single-Minded
  points: 5
  ref: B85
  tags:
  - Advantage
  - Mental
  - Chaos
  lore: >-
    A fanatic's one-track zeal; the Black Library cultist fights through terror and pain towards the altar.
  design: Single-Minded (B85), 5 points.
- name: Fearlessness
  per_level: 2
  levels: 2
  ref: B55
  tags:
  - Advantage
  - Mental
  - Chaos
  lore: Drugs and doctrine have burned out most of a cultist's fear.
  design: Fearlessness 2 (B55, 2/level), 4 points.
- name: High Pain Threshold
  points: 10
  ref: B59
  tags:
  - Advantage
  - Physical
  - Chaos
  lore: >-
    Cult fanatics are shown in Black Library's Inquisition fiction enduring wounds and drugs that would
    put a sane man down, driven by faith and stimulants.
  design: High Pain Threshold (B59), 10 points.
- include: chaos/traits.yaml#Cultist's Devotion
