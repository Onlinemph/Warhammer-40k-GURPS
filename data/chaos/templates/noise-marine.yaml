kind: template
output: Chaos/Templates/Noise Marine.gct
notes: >-
  A Noise Marine: an Emperor's Children Legionary sworn to Slaanesh, deafened by his own sonic weapons
  and chasing the next sensation. Built as the Chaos Space Marine with Mark of Slaanesh in place of Mark
  of Chaos Undivided (Combat Reflexes already comes from the Astartes package, so the Mark's copy is left
  disabled). The Mark's Enhanced Move 1/2 stacks with the package's half level for one full level of Enhanced
  Move, as the Mark's notes say. About 865 points before gear. Equipment: sonic blaster, with a blastmaster
  as the heavy alternative, Mark IV heretic plate, bolt pistol, chainsword, grenades.
