kind: template
output: Chaos/Templates/Chaos Cultist.gct
notes: >-
  An ordinary human drawn into the service of the Ruinous Powers: a hive-gang tough, a fanatic from a
  rotting agri-world, a cult congregant given a gun and a promise. Untrained and unaugmented, at about
  42 points (physiology, traits and skills, no gear) he sits at the bottom of the framework's ladder,
  below the 100-175 trained-soldier tier; the framework's figure is roughly 40-80 and the build lands
  at the low end of it, since Cultist's Devotion's -20 and a slow mind (IQ 9, -20) eat most of what the
  faith's small gifts (High Pain Threshold, Fearlessness, Single-Minded) and a poor spread of skills buy.
  Equipment is in the wargear files, not here: autogun or autopistol, a crude blade, a flak vest or rags.
  Raise skills and add a single god's Mark (Chaos Traits) for a cult champion.
