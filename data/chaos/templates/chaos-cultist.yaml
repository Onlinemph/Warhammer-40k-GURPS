  design: HT 10, baseline.
- name: Fit
  points: 5
  ref: B55
  tags:
  - Advantage
  - Physical
  lore: Years of hard labour and cult-cellar brawling keep a cultist wiry.
  design: Basic Set Fit (B55), 5 points.
- name: Single-Minded
  points: 5
  ref: B85
  tags:
  - Advantage
  - Mental
  - Chaos
  lore: >-
    A fanatic's one-track zeal; the Black Library cultist fights through terror and pain towards the altar.
  design: Single-Minded (B85), 5 points.
- name: Fearlessness
  per_level: 2
  levels: 2
  ref: B55
  tags:
  - Advantage
  - Mental
  - Chaos
  lore: Drugs and doctrine have burned out most of a cultist's fear.
  design: Fearlessness 2 (B55, 2/level), 4 points.
- name: High Pain Threshold
  points: 10
  ref: B59
  tags:
  - Advantage
  - Physical
  - Chaos
  lore: >-
    Cult fanatics are shown in Black Library's Inquisition fiction enduring wounds and drugs that would
    put a sane man down, driven by faith and stimulants.
  design: High Pain Threshold (B59), 10 points.
