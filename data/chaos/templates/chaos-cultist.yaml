  lore: No training beyond a few shots at the range or a few brawls in the cult's cellars.
  design: DX 10, baseline.
- name: IQ
  points: -20
  tags:
  - Attribute
  lore: Cultists are taken from the desperate and the credulous, and the cult does the thinking.
  design: IQ 9, Decreased IQ -1 (B16, 20/level) = -20 points.
- name: HT
  points: 0
  tags:
