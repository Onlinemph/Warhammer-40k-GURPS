kind: template
output: Chaos/Templates/Rubric Marine.gct
notes: >-
  A Rubric Marine: a Thousand Sons Legionary turned to dust by Ahriman's Rubric and sealed in his own
  Mark IV armour, driven by the will of his Aspiring Sorcerer. Built on the raw Astartes package (no Personal
  Advancement, no Heretic Astartes lens: a Rubric has no mind to turn traitor, and no Long War Veteran
  lens) with the Rubric of Ahriman applied: DX 14, IQ 6, Basic Move 8, no blood, brain or vitals, no breath,
  food or sleep, Unfazeable and Slave Mentality (its Sorcerer). HT 15 per the framework is a +1 HT adjustment
  from the Astartes 14. The Mark of Tzeentch is deliberately omitted: its Psyker (Talent) +1 is worthless
  at IQ 6, the Rubric already is a Tzeentchian artifact and the Mark's Paranoia and Compulsive Lying cannot
  apply to a mind that obeys; the Rubric's own warding field comes from the Rubric of Ahriman's "All Is Dust" instead. Weapon skills are low (Guns (Rifle) 17): the Rubric fights by training burned
  in before the ritual. About 596 points before gear. Equipment: Mark IV (Rubric) plate and the Inferno
  boltgun.
