  - name: Hypno-Indoctrination (Broken Oaths)
    container: meta_trait
    tags:
    - Advantage
    - Mental
    - Chaos
    - Heretic Astartes
    children:
    - name: Combat Reflexes
      points: 15
      ref: B43
    - name: Fearlessness
      per_level: 2
      levels: 4
      ref: B55
    - name: High Pain Threshold
      points: 10
      ref: B59
    - name: Single-Minded
      points: 5
      ref: B85
      notes: Relentless focus, now turned to the warband's ends.
    lore: >-
      The psycho-conditioning of the Astartes survives the Fall: a traitor still does not break under
      fire, still fights past the point where a baseline soldier would rout. What goes is the oath. Black
      Library's Horus Heresy and Chaos fiction show Legionaries who kept every reflex and every drilled
      habit and threw away Emperor, Chapter and Codex.
    design: >-
      The Astartes package's own Hypno-Indoctrination / Psycho-Conditioning (data/imperium/astartes/gene-seed.yaml)
      with its three oath disadvantages removed, as the Heretic Astartes lens directs: Combat Reflexes
      15 + Fearlessness 4 (2/level) 8 + High Pain Threshold 10 + Single-Minded 5 = +38 in place of the
      package's net -2 (Duty -20, Sense of Duty -10, Code of Honor -10 left out). Everything else in the
      Astartes entry is included unchanged.
