kind: template
output: Chaos/Templates/Chaos Sorcerer.gct
notes: >-
  A Chaos Sorcerer: a Legionary who has traded some of his body's training for mastery of the warp, most
  famously the Thousand Sons and the sorcerers of every Legion and warband. Built as the Chaos Space Marine
  with IQ 14 and Will 16 (the framework figures: IQ +3 over the Legionary and Will 17 from the package,
  so Will is reduced by one), Psyker (Talent) 3 counting the Mark of Tzeentch's +1, Warp Empowerment 20
  (the Alpha level, power cap 210, as the Librarian) and the Mark of Tzeentch in place of Mark of Chaos
  Undivided. About 1290 points before gear. Powers: Smite 12d(10) burn (162) and Fire Bolt 12d burn (42),
  each within the Empowerment cap of 210; Warp Empowerment 20 leaves room to add Assail, Haemorrhage or
  Witch-sight from the same file. A GM may swap the powers for other disciplines in Imperium/Traits/Psykers
  and the Warp.adq. Equipment: Mark IV heretic plate, force staff, bolt pistol. The Mark's Paranoia and
  Compulsive Lying are in the template.
