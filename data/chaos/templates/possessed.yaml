kind: template
output: Chaos/Templates/Possessed.gct
notes: >-
  A Possessed: a Chaos Space Marine into whom a daemon has been drawn, the body twisted by its host. Built
  as the loyalist Astartes Battle-Brother's physiology (the Astartes package and Personal Advancement,
  but not Long War Veteran: DX 16, not 17), the Heretic Astartes lens and Daemonic Possession (ST 40,
  HT 16, IQ 8, DR 15 warp-flesh, Extra Attack 1, Fearlessness 5, Bad Temper, claws and tentacles at sw+2d(2)
  cut). HP 44, as the framework says. Will is 11 (IQ 8 plus the package's Will +3), not set separately.
  No guns: a Possessed is thrown at the enemy, not directed. About 882 points before gear. Equipment is
  the Mark IV heretic plate; the warp-flesh DR adds on top. There is no Mark of Chaos; the daemon is its
  own patron.
