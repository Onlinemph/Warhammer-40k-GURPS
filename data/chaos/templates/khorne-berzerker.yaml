kind: template
output: Chaos/Templates/Khorne Berzerker.gct
notes: >-
  A Khorne Berzerker: a World Eater or any warrior sworn to the Blood God, whose berserk rage has been
  cut into him with the Butcher's Nails. Built as the Chaos Space Marine with Mark of Khorne in place
  of Mark of Chaos Undivided, Butcher's Nails (Callous taken once: the Heretic Astartes lens already carries
  it, so the nails' own Callous is shown disabled) and IQ 10 (the rage has eaten a point of his mind).
  Chainaxe skill 22 (Axe/Mace, 16 points, DX+5 at DX 17); Guns (Rifle) is 20 (8 points, DX+3), since a
  Berzerker prefers the axe. About 810 points before gear. The Mark's High Pain Threshold is left disabled
  because the Astartes package already has it. Equipment: Mark IV heretic plate, chainaxe, bolt pistol,
  grenades.
