kind: template
output: Chaos/Templates/Traitor Guardsman.gct
notes: >-
  A Guardsman who turned: a regiment lost to the whispers of a Dark God, a platoon that mutinied, a deserter
  who took the Mark. He keeps the Astra Militarum Guardsman's body and training (ST 11, DX 12, IQ 10,
  HT 12, drilled in a lasgun and a trench), so the build is the Guardsman's with the Imperial Duty, Sense
  of Duty and Intolerance (Xenos) dropped, Theology (Imperial Creed) swapped for Theology (Chaos) and
  Mark of Chaos Undivided in place of the Guardsman's piety. About 116 points without gear. A single god's
  Mark can be swapped in for Undivided. Equipment is in the wargear files: lasgun or autogun, flak jacket,
  Munitorum knife, grenades.
