  - name: Hypno-Indoctrination (Broken Oaths)
    container: meta_trait
    tags:
    - Advantage
    - Mental
    - Chaos
    - Heretic Astartes
    children:
    - name: Combat Reflexes
      points: 15
      ref: B43
    - name: Fearlessness
      per_level: 2
      levels: 4
      ref: B55
    - name: High Pain Threshold
      points: 10
      ref: B59
    - name: Single-Minded
      points: 5
      ref: B85
      notes: Relentless focus, now turned to the warband's ends.
    lore: >-
      The psycho-conditioning of the Astartes survives the Fall: a traitor still does not break under
      fire, still fights past the point where a baseline soldier would rout. What goes is the oath. Black
      Library's Horus Heresy and Chaos fiction show Legionaries who kept every reflex and every drilled
      habit and threw away Emperor, Chapter and Codex.
    design: >-
      The Astartes package's own Hypno-Indoctrination / Psycho-Conditioning (data/imperium/astartes/gene-seed.yaml)
      with its three oath disadvantages removed, as the Heretic Astartes lens directs: Combat Reflexes
      15 + Fearlessness 4 (2/level) 8 + High Pain Threshold 10 + Single-Minded 5 = +38 in place of the
      package's net -2 (Duty -20, Sense of Duty -10, Code of Honor -10 left out). Everything else in the
      Astartes entry is included unchanged.
- include: imperium/astartes/battle-brother.yaml#Personal Advancement
- include: chaos/traits.yaml#Heretic Astartes
- include: chaos/traits.yaml#Long War Veteran
- name: ST
  points: 20
  tags:
  - Attribute
  lore: >-
    A Chaos Lord is stronger than any of his warband; Codex background describes champions bigger and
    more brutal than their followers.
  design: ST 32 (+2 from the Astartes 30), 10 pts/level (B14).
- name: DX
  points: 20
  tags:
  - Attribute
  lore: Even sharper than a Legionary.
  design: DX 18 (+1 over the Legionary 17), 20 pts/level (B15).
- name: IQ
  points: 40
  tags:
  - Attribute
  lore: Lords command by cunning as much as by fear.
  design: IQ 13 (+2 over the 11 of a Legionary), 20 pts/level (B15). Will follows, to 16.
- name: HT
  points: 10
  tags:
  - Attribute
  lore: Centuries of war and boons from the gods.
  design: HT 16 (+1), 10 pts/level (B14).
- name: HP
  points: 4
  tags:
  - Attribute
  lore: 'Beyond ST alone: ST 32 gives 32+4 = 36, the framework figure is 38.'
  design: Extra Hit Points +2 (B16, 2/level) = 4 points for HP 38.
- name: Reputation (Warlord)
  points: 10
  ref: B27
  tags:
  - Advantage
  - Social
  - Chaos
  reactions:
  - situation: from Chaos followers who know the warband's name
    amount: 4
  lore: A Chaos Lord's name is known to the warbands and cults around him.
  design: >-
    Reputation (B27), +4 among a large class of people (Chaos followers, x1/2): 10 points, on top of the
    Traitor Legion Reputation.
- name: Rank 8 (Chaos Lord)
  points: 40
  ref: B29
  tags:
  - Advantage
  - Social
  - Chaos
  lore: A Lord is the unquestioned master of his warband, its Legionaries, cultists and slaves.
  design: Rank (B29), 5 points/level, 8 levels = 40 points (Status comes with it).
- name: Charisma
  per_level: 5
  levels: 4
  ref: B41
  tags:
  - Advantage
  - Mental
  - Social
  lore: Chaos Lords command through fear, favour and the weight of their legend.
  design: Charisma 4 (B41, 5/level) = 20 points.
- name: Born War-Leader
  per_level: 5
  levels: 4
  ref: B31
  tags:
  - Advantage
  - Mental
  lore: >-
    The best of the Traitor Legions' captains turn a rabble of cultists and Legionaries into a single
    fist.
  design: Born War-Leader 4 (B31, 5/level) = 20 points.
- name: Weapon Master (Power Sword)
  points: 20
  ref: B99
  tags:
  - Advantage
  - Mental
  lore: A Lord who has fought for centuries has a master's command of the blade.
  design: Weapon Master (B99) for one specific weapon, 20 points. All swords would be a medium class at 35.
- name: Luck
  points: 15
  ref: B66
  tags:
  - Advantage
  - Mental
  - Chaos
  lore: The favour of the gods of Chaos keeps a Lord alive when he should have died.
  design: Luck (B66), 15 points.
- name: Extra Attack (Lord's Fury)
  per_level: 25
  levels: 1
  ref: B53
  tags:
  - Advantage
  - Physical
  lore: >-
    A Chaos Lord's skill with sword and fist, honoured with gifts of the Ruinous Powers, lets him strike
    twice for another's once.
  design: Extra Attack 1 (B53, 25/level) = 25 points.
- include: chaos/traits.yaml#Mark of Chaos Undivided
