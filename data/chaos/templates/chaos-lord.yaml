kind: template
output: Chaos/Templates/Chaos Lord.gct
notes: >-
  A Chaos Lord: the leader of a Traitor warband, a Legionary who has outlived and outfought his peers
  for ten thousand years or a few centuries and holds his followers by strength and will. Built as the
  Chaos Space Marine with ST 32, DX 18, IQ 13, HT 16 and HP 38 (the framework figures), Leadership and
  Tactics raised well above a line Legionary's, and the Mark of Chaos Undivided; the Lord may swap it
  for a single god's Mark. About 1182 points before gear. Equipment: Mark IV heretic plate (Tartaros Terminator
  plate shown unequipped as the alternative), power sword, power fist, bolt pistol, combi-weapon.
