kind: template
output: Chaos/Templates/Plague Marine.gct
notes: >-
  A Plague Marine: a Death Guard or Nurgle-sworn Legionary whose body has rotted and swollen under the
  Plague God. Built as the Chaos Space Marine with Mark of Nurgle and Nurgle's Gift in place of Mark of
  Chaos Undivided, DX 16 (a point of DX lost to the bloat, offsetting the Long War Veteran's +1 and leaving
  his Per bonus) and HT 16 (+1), IQ 10 (-1). Injury Tolerance (Damage Reduction) divisor 2, fused rotting
  flesh DR 10 over the Plague-Fused Mark IV plate, Basic Move -2 (Move 10 for an Astartes with Move 12).
  Weapon skills are the Legionary's points, so one level lower for the lower DX: Guns (Rifle) 21. About
  920 points before gear. Equipment: Plague-Fused plate, boltgun, plague knife, blight grenades, bolt
  pistol.
