<!doctype html>
<!-- A viewer for the local Dawn of War pack: every model with its looks and animations, every voice line, sound and
     scenery object. tools/dow/build_pack.py copies this file to site/models/gallery.html beside the pack it reads
     (index.js, <unit>.js, voices.js, voice_<id>.js, sounds.js, scenery.js). Open it from disk or through any web
     server. It shares no code with the site's page: the painting and the sound decoding below repeat what
     tools/sim/page/31-view3d-models.js and 32-view3d-sound.js do, so a change there may be wanted here too. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn of War pack</title>
<style>
  :root { --bg: #16181c; --panel: #1f2228; --line: #343943; --text: #d8dbe0; --dim: #8d94a0; --hot: #e2b24a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: 260px 1fr 300px; grid-template-rows: auto 1fr; }
  header { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  button, select, input { font: inherit; color: var(--text); background: #2a2e36; border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { background: var(--hot); color: #1b1b1b; border-color: var(--hot); }
  #list { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
  #list input { width: calc(100% - 16px); margin: 8px; }
  #list a { display: block; padding: 4px 12px; color: var(--text); text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list a small { color: var(--dim); }
  #list a:hover { background: #2a2e36; }
  #list a.on { background: #343943; color: var(--hot); }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #note { position: absolute; left: 12px; bottom: 10px; color: var(--dim); pointer-events: none; }
  #side { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 10px 12px; }
  #side h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 14px 0 6px; }
  #side h2:first-child { margin-top: 0; }
  #side .row { display: flex; flex-wrap: wrap; gap: 5px; }
  #side p { margin: 4px 0; color: var(--dim); overflow-wrap: anywhere; }
  #side input[type=color] { padding: 0; width: 34px; height: 26px; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto 30vh 45vh auto; } #list, #side { border: 0; } }
</style>
</head>
<body>
<header>
  <h1>Dawn of War pack</h1>
  <button data-tab="units" class="on">Models</button><button data-tab="voices">Voices</button><button data-tab="sounds">Sounds</button><button data-tab="scenery">Scenery</button>
</header>
<nav id="list"></nav>
<main id="stage"><div id="note"></div></main>
<aside id="side"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// ---- the lists
const TABS = {
  units: { file: "index.js", items: () => (INDEX = window.DOW_INDEX.units).map(u => [u.id, u.veh ? "vehicle" : ""]), open: id => showUnit(id) },
  voices: { file: "voices.js", items: () => window.DOW_VOICES.voices.map(v => [v, ""]), open: showVoice },
  sounds: { file: "sounds.js", items: () => Object.keys(window.DOW_SOUNDS).map(k => [k, String(window.DOW_SOUNDS[k].length)]), open: showSounds },
  scenery: { file: "scenery.js", items: () => Object.entries(window.DOW_SCENERY.props).map(([n, p]) => [n, p.role]), open: showProp },
};
async function openTab(name) {
  document.querySelectorAll("header button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  const T = TABS[name]; list.replaceChildren(el("p", { textContent: "loading…", style: "padding:0 12px" }));
  try { if (!T.loaded) { await loadScript(T.file); T.loaded = true; } } catch (e) { list.replaceChildren(el("p", { textContent: `No ${T.file} here: build it with tools/dow/build_pack.py.`, style: "padding:0 12px" })); return; }
  const items = T.items(), find = el("input", { placeholder: `filter ${items.length}`, type: "search" }), rows = el("div");
  const fill = () => rows.replaceChildren(...items.filter(([n]) => n.includes(find.value.trim().toLowerCase())).map(([n, tag]) => { const a = el("a", {}, n + " ", el("small", { textContent: tag })); a.onclick = () => { rows.querySelectorAll("a").forEach(x => x.classList.remove("on")); a.classList.add("on"); Promise.resolve(T.open(n)).catch(e => { note.textContent = String(e.message || e); }); }; a.dataset.name = n; return a; }));
  find.oninput = fill; fill(); list.replaceChildren(find, rows);
}
document.querySelectorAll("header button").forEach(b => { b.onclick = () => openTab(b.dataset.tab); });
resize(); frame(new THREE.Vector3(0, 1, 0), 2);
openTab("units").then(() => { const first = list.querySelector("a"); if (first) first.click(); });
window.gallery = { showUnit, showVoice, showProp, openTab, playItem, assets, renderer, draw, state: () => current };   // for poking at from the console
</script>
</body>
</html>
