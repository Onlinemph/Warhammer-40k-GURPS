<meta charset="utf-8">
<title>40K GURPS Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a dark cogitator rail of factions on the left, a data-slate reading surface on the right.
   Gilt marks point costs and headings, blood marks damage, steel marks what you can press. */
:root{
  --ground:#e7e9e6; --paper:#fbfbf8; --well:#f1f2ee; --ink:#15161b; --dim:#5a5d66; --rule:#d2d5d1;
  --blood:#9a1c1f; --blood-wash:#9a1c1f12; --gild:#86621a; --gild-wash:#86621a17; --steel:#2c5064; --steel-wash:#2c50641a; --warp:#6b3fa0;
  --rail:#121318; --rail-2:#1b1c23; --rail-ink:#dcd8ce; --rail-dim:#8d8b95; --rail-rule:#2a2b33; --rail-gild:#d2ae5c;
  --display:"Cormorant SC","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --shadow:0 1px 0 #0000000a,0 8px 24px -18px #0000004d;
  color-scheme:light;
  /* aliases the simulator's map styles use */
  --panel:var(--paper); --line:var(--rule); --muted:var(--dim); --accent:var(--blood); --brass:var(--gild); --chip:var(--well);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f1014; --paper:#16171d; --well:#1d1e25; --ink:#e9e5da; --dim:#9d9aa5; --rule:#2b2d35;
  --blood:#e4645a; --blood-wash:#e4645a1c; --gild:#d4b060; --gild-wash:#d4b0601f; --steel:#8ab2c8; --steel-wash:#8ab2c81f; --warp:#b692e6;
  --rail:#0a0b0e; --rail-2:#13141a; --rail-ink:#dcd8ce; --rail-dim:#86848e; --rail-rule:#22232a; --rail-gild:#d4b060;
  --shadow:0 1px 0 #ffffff08,0 10px 30px -20px #000000cc; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0f1014; --paper:#16171d; --well:#1d1e25; --ink:#e9e5da; --dim:#9d9aa5; --rule:#2b2d35;
  --blood:#e4645a; --blood-wash:#e4645a1c; --gild:#d4b060; --gild-wash:#d4b0601f; --steel:#8ab2c8; --steel-wash:#8ab2c81f; --warp:#b692e6;
  --rail:#0a0b0e; --rail-2:#13141a; --rail-ink:#dcd8ce; --rail-dim:#86848e; --rail-rule:#22232a; --rail-gild:#d4b060;
  --shadow:0 1px 0 #ffffff08,0 10px 30px -20px #000000cc; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.55 var(--body);margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--steel)}
:focus-visible{outline:2px solid var(--gild);outline-offset:2px}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}

/* ---- the rail */
aside{background:var(--rail);color:var(--rail-ink);overflow-y:auto;padding:22px 14px 48px;border-right:1px solid var(--rail-rule)}
.brand{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:.04em;line-height:1;margin:0 4px;color:var(--rail-ink)}
.brand em{font-style:normal;color:var(--rail-gild)}
.brand small{display:block;font-family:var(--mono);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:.6rem;line-height:1.5;color:var(--rail-dim);margin-top:10px}
.search{width:100%;margin:18px 0 6px;padding:9px 12px;border:1px solid var(--rail-rule);border-radius:3px;background:var(--rail-2);color:var(--rail-ink);font:inherit;font-size:.9rem}
.search::placeholder{color:var(--rail-dim)}
.search:focus{outline:none;border-color:var(--rail-gild)}
.stats{font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;color:var(--rail-dim);margin:0 4px 16px;font-variant-numeric:tabular-nums}
nav .realm{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rail-dim);margin:22px 4px 6px;display:flex;align-items:center;gap:8px}
nav .realm::after{content:"";flex:1;height:1px;background:var(--rail-rule)}
nav details{border-radius:3px}
nav summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:3px;font-family:var(--display);font-weight:600;font-size:1.08rem;letter-spacing:.03em;color:var(--rail-ink)}
nav summary::-webkit-details-marker{display:none}
nav summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--rail-dim);border-bottom:1.5px solid var(--rail-dim);transform:rotate(-45deg);margin-right:2px;position:relative;top:-2px;transition:transform .15s}
nav details[open]>summary::before{transform:rotate(45deg)}
nav summary:hover{background:var(--rail-2)}
nav summary .n{margin-left:auto;font-family:var(--mono);font-size:.64rem;font-weight:400;color:var(--rail-dim);letter-spacing:.04em}
nav .kind{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rail-gild);opacity:.85;margin:10px 0 2px 26px}
nav button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--rail-ink);font-size:.86rem;padding:4px 8px 4px 26px;border-radius:3px;cursor:pointer;position:relative}
nav button:hover{background:var(--rail-2)}
nav button[aria-current="true"]{background:var(--rail-2);color:#fff}
nav button[aria-current="true"]::before{content:"";position:absolute;left:12px;top:50%;width:6px;height:6px;margin-top:-3px;background:var(--rail-gild);transform:rotate(45deg)}
nav button span{white-space:nowrap;color:var(--rail-dim);font-family:var(--mono);font-size:.66rem;font-variant-numeric:tabular-nums}
nav .navtool{font-family:var(--display);font-weight:700;font-size:1.08rem;letter-spacing:.03em;padding:8px 10px;border:1px solid var(--rail-rule);background:var(--rail-2);margin:18px 0 4px}
nav .navtool span{font-family:var(--mono);color:var(--rail-gild);letter-spacing:.1em;text-transform:uppercase;font-size:.6rem}
nav .navtool[aria-current="true"]{border-color:var(--rail-gild)}
nav .navtool[aria-current="true"]::before{display:none}

/* ---- the reading surface */
main{overflow-y:auto;min-width:0;padding-block:36px 96px;padding-inline:clamp(16px,4vw,56px)}
main>*{max-width:1080px}
.libhead{margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--rule);position:relative}
.libhead::after{content:"";position:absolute;left:0;bottom:-4px;width:100%;height:1px;background:var(--rule)}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gild)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4vw,3.1rem);letter-spacing:.02em;margin:6px 0 0;text-wrap:balance;line-height:1.02}
.libhead p{margin:10px 0 0;color:var(--dim);font-size:.9rem;max-width:72ch}
.libhead code{font-family:var(--mono);font-size:.78rem;color:var(--dim);background:var(--well);padding:1px 5px;border-radius:2px}
h2{font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:.03em;margin:40px 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h2::after{content:"";flex:1;min-width:40px;height:1px;background:var(--rule)}

.entries{display:grid;gap:16px}
.entry{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:18px 22px 16px;box-shadow:var(--shadow);min-width:0}
.entry.child{background:none;border:0;box-shadow:none;border-left:1px solid var(--rule);border-radius:0;padding:4px 0 4px 16px;margin-top:16px}
.ehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.ename{font-family:var(--body);font-weight:600;font-size:1.12rem;letter-spacing:-.005em;margin:0}
.child .ename{font-size:.98rem}
.pts{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--gild);font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.pts.neg{color:var(--warp)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--mono);font-size:.7rem;background:var(--well);color:var(--ink);padding:2px 7px;border-radius:2px;white-space:nowrap;border:1px solid transparent}
.chip.tag{font-family:var(--body);font-size:.72rem;background:none;border-color:var(--rule);color:var(--dim)}
.chip.off{background:var(--blood-wash);color:var(--blood)}
.notes{margin:12px 0 0;white-space:pre-line;max-width:72ch;font-size:.93rem}
.tablewrap{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;font-size:.86rem;width:100%}
th{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:500;padding:6px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:hover td{background:var(--well)}
td.n{font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
td.dmg{font-family:var(--mono);font-size:.84rem;font-weight:600;color:var(--blood);white-space:nowrap}
tr.wnote td{color:var(--dim);font-size:.8rem;padding-top:0}
tr.hasnote td{border-bottom:0}
.dr{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:.88rem}
.dr b{font-family:var(--mono);color:var(--steel);font-weight:600;margin-right:5px}
.feat{margin-top:8px;font-size:.86rem;color:var(--dim)}
.mods{margin:12px 0 0;padding:0;list-style:none;font-size:.86rem;display:grid;gap:3px}
.mods li{padding-left:14px;position:relative}
.mods li::before{content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;background:var(--gild);transform:rotate(45deg)}
.mods .c{font-family:var(--mono);font-size:.76rem;color:var(--gild);margin-left:6px}
.mods .mn{color:var(--dim)}
details.more{margin-top:14px;border-top:1px solid var(--rule);padding-top:8px}
details.more summary{cursor:pointer;font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";color:var(--gild);font-size:.9rem}
details.more[open] summary::before{content:"−"}
details.more summary:hover{color:var(--ink)}
.more h4{font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:.04em;margin:12px 0 2px;color:var(--gild)}
.more p{margin:0;white-space:pre-line;max-width:72ch;font-size:.9rem}

/* ---- templates */
.tsum{display:flex;flex-wrap:wrap;gap:0;margin:0 0 20px;border:1px solid var(--rule);background:var(--paper);width:max-content;max-width:100%;border-radius:2px}
.tsum div{font-family:var(--mono);font-size:.62rem;color:var(--dim);text-transform:uppercase;letter-spacing:.16em;padding:10px 22px 12px;border-right:1px solid var(--rule)}
.tsum div:last-child{border-right:0}
.tsum div:first-child b{color:var(--gild)}
.tsum b{display:block;font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.05;color:var(--ink);letter-spacing:0;text-transform:none;font-variant-numeric:lining-nums tabular-nums}
.tnotes{max-width:72ch;white-space:pre-line;margin:0 0 8px}
.statblock{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:0;margin:0 0 24px;box-shadow:var(--shadow);overflow:hidden}
.attrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.attr{padding:14px 18px 12px;border-right:1px solid var(--rule)}
.attr:last-child{border-right:0}
.attr b{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--dim);font-weight:500}
.attr span{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;color:var(--blood);font-variant-numeric:lining-nums}
.derived{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));margin:0 -1px -1px 0;border-bottom:1px solid var(--rule)}
.derived div{padding:8px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.derived b{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:500}
.derived span{font-family:var(--mono);font-size:.95rem;font-weight:500;font-variant-numeric:tabular-nums}
.statlines{padding:6px 18px 16px}
.statline{margin:10px 0 0;line-height:1.6;font-size:.9rem}
.statline b{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gild);font-weight:600;margin-bottom:1px}
.statline .p{font-family:var(--mono);font-size:.74rem;color:var(--dim)}
.tree{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:4px 0;box-shadow:var(--shadow)}
.tree details>summary,.tree .leaf{display:flex;gap:10px;align-items:baseline;padding:6px 16px;cursor:pointer;list-style:none;font-size:.92rem}
.tree details>summary:hover{background:var(--well)}
.tree .leaf{cursor:default}
.tree summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:"";width:5px;height:5px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:rotate(-45deg);flex:none;position:relative;top:-2px}
.tree details[open]>summary::before{transform:rotate(45deg)}
.tree .leaf::before{content:"";width:5px;flex:none}
.tree .kids{padding-left:14px;border-left:1px solid var(--rule);margin-left:18px}
.tree .tn{flex:1;min-width:0}
.tree .tn small{color:var(--dim);margin-left:8px;font-size:.78rem}
.tree .tp{font-family:var(--mono);font-size:.8rem;color:var(--gild);font-variant-numeric:tabular-nums}
.tree .tp.neg{color:var(--warp)}
.tree .off{opacity:.55}
.tree .detail{padding:0 16px 10px 34px;font-size:.86rem;color:var(--dim)}
.tree .detail .notes{margin-top:0}
.empty{color:var(--dim);font-style:italic}
.hit{background:var(--gild-wash);border-radius:2px}
.menubtn{display:none}

/* ---- combat simulator */
.spresets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.spresets button{cursor:pointer;font-size:.78rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);padding:4px 10px;border-radius:2px;font-family:var(--body)}
.spresets button:hover{border-color:var(--steel);color:var(--steel)}
.sset{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;margin:0 0 22px;background:var(--paper);border:1px solid var(--rule);border-radius:2px;box-shadow:var(--shadow)}
.sset fieldset{border:0;border-right:1px solid var(--rule);margin:0;padding:14px 18px 16px;display:grid;gap:9px;align-content:start;min-width:0}
.sset fieldset:last-of-type{border-right:0}
.sset legend{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gild);padding:0;float:left;margin-bottom:2px}
.sset label{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.86rem;color:var(--dim)}
.sset label>span{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.74rem}
.sset label.chk{display:flex;color:var(--ink)}
.sset input[type=number]{width:5.5em;text-align:right;font-family:var(--mono)}
.sset .go{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--rule);background:var(--well)}
.sset .go p{margin:0;font-size:.82rem;color:var(--dim)}
input[type=number],.sunit select,.addu,.sset select{font:inherit;font-size:.84rem;padding:5px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--ground);color:var(--ink);max-width:100%;min-width:0}
.sset select{width:10.5em}
.run{font-family:var(--mono);font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;background:var(--blood);color:var(--paper);border:0;border-radius:2px;padding:10px 20px;cursor:pointer}
.run:hover{filter:brightness(1.08)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.sside{min-width:0}
.sside h2{margin-top:0}
.sside:nth-child(1) h2{color:var(--blood)}.sside:nth-child(2) h2{color:var(--gild)}
.sunit{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.sside:nth-child(1) .sunit{border-top:2px solid var(--blood)}.sside:nth-child(2) .sunit{border-top:2px solid var(--gild)}
.shead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shead input{width:4.4em}.shead b{flex:1;min-width:8em;font-weight:600}
.x{background:none;border:0;color:var(--dim);font-size:1.3rem;line-height:1;cursor:pointer;padding:0 4px}
.x:hover{color:var(--blood)}
.prof{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.78rem;margin-top:8px;font-family:var(--mono)}
.prof b{font-family:var(--mono);font-weight:500;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-right:5px}
.prof.err{color:var(--blood)}
.lo summary{cursor:pointer;font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:10px}
.lgrid{display:grid;gap:8px;margin-top:8px;font-size:.84rem}
.lgrid label{display:grid;gap:2px}.lgrid select{width:100%}
.lgrid .sh{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.lgrid .sh input[type=number]{width:4.5em}
.lonote{font-size:.8rem;color:var(--dim);margin:6px 0 0}
.addu{width:100%;background:var(--paper)}
#simout .tsum{width:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
#simout .tsum div:nth-child(1) b{color:var(--blood)}#simout .tsum div:nth-child(2) b{color:var(--gild)}#simout .tsum div:first-child b{color:var(--blood)}
.sbar{display:flex;height:10px;border-radius:1px;overflow:hidden;margin:-8px 0 22px;background:var(--well)}
.sbar .a{background:var(--blood)}.sbar .d{background:var(--rule)}.sbar .b{background:var(--gild)}
.replay{min-width:0}
.replay svg{width:100%;height:auto;max-height:560px;background:var(--paper);border:1px solid var(--rule);border-radius:2px;display:block}
.replay .sa circle{fill:var(--blood)}.replay .sb circle{fill:var(--gild)}
.replay circle.stun{stroke:var(--ink);stroke-width:.18;stroke-dasharray:.3 .2}
.replay line{stroke:var(--ink);stroke-width:.16}
.replay svg.fac{background:color-mix(in srgb,var(--ink) 70%,var(--paper))}.replay .floor{fill:var(--paper)}.replay .crate{stroke:var(--dim);stroke-width:.12}.replay .crate.light{fill:var(--rule)}.replay .crate.heavy{fill:var(--dim)}.replay .door{stroke:var(--gild);stroke-width:.2}.replay .door.shut{fill:var(--gild)}.replay .door.open{fill:var(--paper)}.replay .rubble{fill:var(--paper);stroke:var(--dim);stroke-width:.15;stroke-dasharray:.25 .2}
.rctl{display:flex;gap:12px;align-items:center;margin:10px 0}.rctl input{flex:1;accent-color:var(--blood)}
.rctl button{cursor:pointer;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:3px 10px}
.rctl span{font-family:var(--mono);font-size:.74rem;color:var(--dim)}
.rleg{font-size:.78rem;color:var(--dim);margin:0 0 8px}.rleg .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle}
.rleg .dot.a{background:var(--blood)}.rleg .dot.b{background:var(--gild)}
#rlog{max-height:220px}
.slog{font-family:var(--mono);font-size:.74rem;line-height:1.55;white-space:pre-wrap;max-height:480px;overflow:auto;background:var(--paper);border:1px solid var(--rule);padding:12px 14px;border-radius:2px;margin:0}
.chip.tag[data-open]{cursor:pointer;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;height:auto;min-height:100%}
  aside{border-right:0;padding:16px 16px 14px;overflow:visible}
  aside nav{display:none}
  aside.open nav{display:block}
  .menubtn{display:inline-flex;margin-top:6px;background:var(--rail-2);border:1px solid var(--rail-rule);color:var(--rail-ink);font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border-radius:3px;cursor:pointer}
  main{overflow:visible;padding-block:24px 64px}
  .sgrid{grid-template-columns:1fr}
  .attrs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .attr:nth-child(2){border-right:0}.attr:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .sset fieldset{border-right:0;border-bottom:1px solid var(--rule)}
  .tsum b{font-size:1.6rem}.tsum div{padding:8px 14px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside id="side">
    <p class="brand">40K <em>GURPS</em> Codex<small>Warhammer 40,000 · GURPS Fourth Edition</small></p>
    <input id="q" class="search" type="search" placeholder="Search names, tags, lore…" aria-label="Search the codex">
    <div class="stats" id="stats"></div>
    <button class="menubtn" id="menubtn" aria-expanded="false">Libraries</button>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>

<script>
const DATA = /*__DATA__*/null;
const LIBS = DATA.libraries;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KINDNAME = {equipment:"Equipment", traits:"Traits", skills:"Skills", template:"Template"};
let current = null;

function fmtPts(p){ const n = Number(p)||0; return `<span class="pts${n<0?" neg":""}">[${n}]</span>`; }
function money(v){ if(v==null||v==="") return ""; const n=Number(v); return isNaN(n)?v:"$"+n.toLocaleString("en-US"); }

function drBlock(feat){
  if(!feat) return "";
  let h = "";
  for(const row of feat.dr||[]){
    h += `<div class="dr">${row.vs?`<span class="chip">vs ${esc(row.vs)}</span>`:""}` +
      row.groups.map(g=>`<span><b>DR ${g.dr}</b>${esc(g.locs.join(", "))}</span>`).join("") + `</div>`;
  }
  if(feat.other && feat.other.length) h += `<div class="feat">${feat.other.map(esc).join(" · ")}</div>`;
  return h;
}

function weaponTables(ws){
  if(!ws || !ws.length) return "";
  const ranged = ws.filter(w=>!w.melee), melee = ws.filter(w=>w.melee);
  let h = "";
  const row = (w, cols) => {
    const note = w.notes ? `<tr class="wnote"><td colspan="${cols.length+3}">${esc(w.notes)}</td></tr>` : "";
    return `<tr${w.notes?' class="hasnote"':""}><td>${esc(w.usage)}</td><td class="dmg">${esc(w.damage)}</td>` +
      cols.map(c=>`<td class="n">${esc(w[c]??"")}</td>`).join("") + `<td>${esc(w.skill)}</td></tr>` + note;
  };
  if(ranged.length){
    const cols=["accuracy","range","rate_of_fire","shots","strength","bulk","recoil"];
    h += `<div class="tablewrap"><table><thead><tr><th>Mode</th><th>Damage</th><th>Acc</th><th>Range</th><th>RoF</th><th>Shots</th><th>ST</th><th>Bulk</th><th>Rcl</th><th>Skill</th></tr></thead><tbody>` +
      ranged.map(w=>row(w,cols)).join("") + `</tbody></table></div>`;
  }
  if(melee.length){
    const cols=["reach","parry","strength"];
    h += `<div class="tablewrap"><table><thead><tr><th>Mode</th><th>Damage</th><th>Reach</th><th>Parry</th><th>ST</th><th>Skill</th></tr></thead><tbody>` +
      melee.map(w=>row(w,cols)).join("") + `</tbody></table></div>`;
  }
  return h;
}

function mods(ms){
  if(!ms || !ms.length) return "";
  return `<ul class="mods">${ms.map(m=>`<li>${esc(m.name)}<span class="c">${esc(m.cost)}</span>${m.notes?` <span class="mn">— ${esc(m.notes)}</span>`:""}</li>`).join("")}</ul>`;
}

function more(e){
  if(!e.lore && !e.design) return "";
  return `<details class="more"><summary>Lore &amp; design</summary>` +
    (e.lore?`<h4>Lore</h4><p>${esc(e.lore)}</p>`:"") + (e.design?`<h4>Design</h4><p>${esc(e.design)}</p>`:"") + `</details>`;
}

function tagChips(tags){ return (tags||[]).map(t=>`<span class="chip tag">${esc(t)}</span>`).join(""); }

function eqCard(e, child){
  const wpm = /^Weak Points (\d+):/.exec(e.notes||"");
  const chips = [wpm?`Weak Points ${wpm[1]}`:"", e.tl?`TL${e.tl}`:"", e.lc!=null&&e.lc!==undefined?`LC${e.lc}`:"", money(e.cost), e.weight||"",
    e.qty>1?`×${e.qty}`:"", e.uses!=null?`${e.uses} SP / uses`:"", e.ref||""].filter(Boolean);
  return `<article class="entry${child?" child":""}"><div class="ehead"><h3 class="ename">${esc(e.name)}</h3></div>
    <div class="meta">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${child?"":tagChips(e.tags)}</div>
    ${e.notes?`<p class="notes">${esc(e.notes)}</p>`:""}
    ${weaponTables(e.weapons)}${drBlock(e.feat)}${mods(e.mods)}${more(e)}
    ${(e.children||[]).map(c=>eqCard(c,true)).join("")}</article>`;
}

function traitCard(t, child){
  const chips = [t.levels!=null?`Level ${t.levels}`:"", t.cr?`CR ${t.cr}`:"", t.container&&t.container!=="group"?t.container.replace("_"," "):"", t.ref||""].filter(Boolean);
  return `<article class="entry${child?" child":""}"><div class="ehead"><h3 class="ename">${esc(t.name)}</h3>${fmtPts(t.points)}</div>
    <div class="meta">${t.disabled?`<span class="chip off">optional · off by default</span>`:""}${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${child?"":tagChips(t.tags)}</div>
    ${t.notes?`<p class="notes">${esc(t.notes)}</p>`:""}
    ${mods(t.mods)}${weaponTables(t.weapons)}${drBlock(t.feat)}${more(t)}
    ${(t.children||[]).map(c=>traitCard(c,true)).join("")}</article>`;
}

function skillCard(s){
  if(s.children) return `<article class="entry"><div class="ehead"><h3 class="ename">${esc(s.name)}</h3></div>${s.children.map(skillCard).join("")}</article>`;
  const chips=[s.diff, s.tl?`TL${s.tl}`:"", s.ref||""].filter(Boolean);
  return `<article class="entry"><div class="ehead"><h3 class="ename">${esc(s.name)}</h3></div>
    <div class="meta">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${tagChips(s.tags)}</div>
    ${s.defaults&&s.defaults.length?`<div class="feat">Defaults: ${esc(s.defaults.join(", "))}</div>`:`<div class="feat">No default</div>`}
    ${s.notes?`<p class="notes">${esc(s.notes)}</p>`:""}${drBlock(s.feat)}${more(s)}</article>`;
}

function treeNode(t){
  const pts = `<span class="tp${t.points<0?" neg":""}">${t.points}</span>`;
  const label = `<span class="tn">${esc(t.name)}${t.levels!=null?`<small>level ${t.levels}</small>`:""}${t.disabled?"<small>optional, off</small>":""}</span>${pts}`;
  const detail = (t.notes||t.mods||(t.feat&&(t.feat.dr.length||t.feat.other.length))||t.lore||t.design)
    ? `<div class="detail">${t.notes?`<p class="notes">${esc(t.notes)}</p>`:""}${mods(t.mods)}${drBlock(t.feat)}${more(t)}</div>` : "";
  if(t.children){
    return `<details class="${t.disabled?"off":""}"><summary>${label}</summary>${detail}<div class="kids">${t.children.map(treeNode).join("")}</div></details>`;
  }
  return detail
    ? `<details class="${t.disabled?"off":""}"><summary>${label}</summary>${detail}</details>`
    : `<div class="leaf${t.disabled?" off":""}">${label}</div>`;
}

const ATTR_NAMES = new Set(["ST","DX","IQ","HT","Will","Per","Perception","HP","FP","Basic Speed","Basic Move"]);
function statBlock(t){
  const s = t.stats;
  if(t.addon){
    const b = s.bonus||{}, keys = Object.keys(b).filter(k=>b[k]);
    const deltas = keys.map(k=>`${k.replace("_"," ").toUpperCase()} ${b[k]>0?"+":""}${b[k]}`).join(", ") || "no attribute changes";
    return `<section class="statblock"><div class="statlines"><p class="statline"><b>Add-on</b>Apply on top of the Astartes Battle-Brother template. Attribute changes: ${esc(deltas)}.</p>${traitLines(t)}${skillLine(s)}</div></section>`;
  }
  const dr = Object.entries(s.dr||{}).map(([k,v])=>`${v} ${k}`).join(", ");
  const attr=(k,v)=>`<div class="attr"><b>${k}</b><span>${v}</span></div>`;
  const der=(k,v)=>`<div><b>${k}</b><span>${v}</span></div>`;
  return `<section class="statblock" aria-label="Stat block">
    <div class="attrs">${attr("ST",s.st)}${attr("DX",s.dx)}${attr("IQ",s.iq)}${attr("HT",s.ht)}</div>
    <div class="derived">${der("HP",s.hp)}${der("Will",s.will)}${der("Per",s.per)}${der("FP",s.fp)}${der("Basic Speed",s.speed.toFixed(2))}${der("Move",s.move)}${der("Dodge",s.dodge)}${der("SM",(s.sm>0?"+":"")+s.sm)}${der("Thr / Sw",`${s.thr} / ${s.sw}`)}${der("Basic Lift",s.bl+" lb")}${der("Natural DR",dr||"0")}</div>
    <div class="statlines">${traitLines(t)}${skillLine(s)}</div></section>`;
}
function traitLines(t){
  const top = t.traits.filter(x=>!x.disabled && !ATTR_NAMES.has(x.name));
  const fmt = x=>`${esc(x.name)}${x.levels!=null&&!x.children?" "+x.levels:""} <span class="p">[${x.points}]</span>`;
  const adv = top.filter(x=>x.points>0), dis = top.filter(x=>x.points< -1), q = top.filter(x=>x.points===-1||x.points===0&&!x.children);
  const off = t.traits.filter(x=>x.disabled);
  return (adv.length?`<p class="statline"><b>Advantages</b>${adv.map(fmt).join("; ")}.</p>`:"") +
    (dis.length?`<p class="statline"><b>Disadvantages</b>${dis.map(fmt).join("; ")}.</p>`:"") +
    (q.length?`<p class="statline"><b>Quirks and features</b>${q.map(fmt).join("; ")}.</p>`:"") +
    (off.length?`<p class="statline"><b>Optional lenses</b>${off.map(fmt).join("; ")}.</p>`:"");
}
function skillLine(s){
  const sk=(s.skills||[]).filter(x=>x.points>0);
  if(!sk.length) return "";
  return `<p class="statline"><b>Skills</b>${sk.map(x=>`${esc(x.name)}${x.level!=null?"-"+x.level:""} <span class="p">[${x.points}]</span>`).join("; ")}.</p>`;
}
function templateView(t){
  const sk = t.skills.flatMap(s=>s.children?s.children:[s]);
  return `<div class="tsum"><div>Total<b>${t.points}</b></div><div>Traits<b>${t.traitPoints}</b></div><div>Skills<b>${t.skillPoints}</b></div></div>
    ${statBlock(t)}
    ${t.notes?`<p class="tnotes">${esc(t.notes)}</p>`:""}
    <h2>Trait breakdown</h2><div class="tree">${t.traits.map(treeNode).join("")}</div>
    ${sk.length?`<h2>Skills</h2><div class="tablewrap"><table><thead><tr><th>Skill</th><th>Difficulty</th><th>Points</th></tr></thead><tbody>${
      sk.map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${esc(s.diff||"")}</td><td class="n">${s.points}</td></tr>`).join("")}</tbody></table></div>`:""}
    ${t.equipment.length?`<h2>Equipment</h2><div class="entries">${t.equipment.map(e=>eqCard(e)).join("")}</div>`:""}`;
}

function card(lib, e){ return lib.kind==="equipment"?eqCard(e):lib.kind==="traits"?traitCard(e):skillCard(e); }

function showLib(id){
  if(id==="sim"){ current="sim"; markNav("sim");
    window.simView(); $("#main").scrollTop=0; try{ history.replaceState(null,"","#sim"); }catch(_){}
    $("#side").classList.remove("open"); $("#menubtn").setAttribute("aria-expanded","false"); return; }
  const lib = LIBS.find(l=>l.id===id) || LIBS[0];
  current = lib.id;
  markNav(lib.id);
  const head = `<header class="libhead"><div class="eyebrow">${esc(lib.section.replace(/\//g," › "))} · ${KINDNAME[lib.kind]}</div>
    <h1>${esc(lib.title)}</h1><p>${lib.kind==="template"?"Character template":`${lib.count} entries`} · GCS file <code>Library/${esc(lib.path)}</code></p></header>`;
  const body = lib.kind==="template" ? templateView(lib.template) : `<div class="entries">${lib.items.map(e=>card(lib,e)).join("")}</div>`;
  $("#main").innerHTML = head + body;
  $("#main").scrollTop = 0;
  try{ history.replaceState(null,"","#"+lib.id); }catch(_){}
  $("#side").classList.remove("open"); $("#menubtn").setAttribute("aria-expanded","false");
}

function flat(e){ return [e, ...(e.children||[]).flatMap(flat)]; }
function text(e){ return [e.name,(e.tags||[]).join(" "),e.notes,e.lore].join(" ").toLowerCase(); }

function search(q){
  q = q.trim().toLowerCase();
  if(!q){ showLib(current); return; }
  const terms = q.split(/\s+/);
  let out = "", total = 0;
  for(const lib of LIBS){
    const pool = lib.kind==="template" ? [{...lib.template, tags:[]}] : lib.items;
    const hits = pool.filter(e=>{ const t = flat(e).map(text).join(" ") + " " + lib.title.toLowerCase(); return terms.every(x=>t.includes(x)); });
    if(!hits.length) continue;
    total += hits.length;
    out += `<h2>${esc(lib.title)} <button class="chip tag" data-open="${lib.id}">Open library</button></h2>`;
    out += lib.kind==="template"
      ? `<div class="entries"><article class="entry"><div class="ehead"><h3 class="ename">${esc(lib.title)}</h3>${fmtPts(lib.template.points)}</div><p class="notes">${esc((lib.template.notes||"").slice(0,300))}…</p></article></div>`
      : `<div class="entries">${hits.slice(0,40).map(e=>card(lib,e)).join("")}</div>`;
  }
  $("#main").innerHTML = `<header class="libhead"><div class="eyebrow">Search</div><h1>“${esc(q)}”</h1><p>${total} matching entr${total===1?"y":"ies"}</p></header>` + (out || `<p class="empty">Nothing matches. Try a weapon, trait or faction name.</p>`);
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ $("#q").value=""; showLib(b.dataset.open); });
}

// the rail: Imperium and Xenos, each faction collapsible, its libraries listed by kind
const KIND_ORDER = ["Templates","Traits","Skills","Weapons","Armour","Gear"];
const FACTION_NAME = {"Tau":"T'au Empire","Orks":"Orks","Tyranids":"Tyranids","Necrons":"Necrons","Aeldari":"Aeldari","Drukhari":"Drukhari","Imperium":"Imperium of Man","Adeptus Custodes":"Adeptus Custodes","Adeptus Mechanicus":"Adeptus Mechanicus"};
function factionOf(sec){ const p = sec.split("/"); return p[0]==="Xenos" ? {realm:"Xenos", f:p[1], kind:p.slice(2).join(" ")||"Other"} : {realm:"Imperium", f:p[0], kind:p.slice(1).join(" ")||"Other"}; }
function buildNav(){
  const realms = {Imperium:{}, Xenos:{}};
  for(const l of LIBS){ const {realm,f,kind} = factionOf(l.section); ((realms[realm][f] ||= {})[kind] ||= []).push(l); }
  const kindRank = k => { const i = KIND_ORDER.indexOf(k); return i<0 ? 99 : i; };
  const fac = (f, kinds) => {
    const n = Object.values(kinds).reduce((a,ls)=>a+ls.length,0);
    return `<details data-f="${esc(f)}"><summary>${esc(FACTION_NAME[f]||f)}<span class="n">${n}</span></summary>` +
      Object.keys(kinds).sort((a,b)=>kindRank(a)-kindRank(b)||a.localeCompare(b)).map(k =>
        `<div class="kind">${esc(k)}</div>` + kinds[k].map(l=>`<button data-id="${l.id}">${esc(l.title)}<span>${l.kind==="template"?fmtPtsPlain(l.template.points):l.count}</span></button>`).join("")).join("") +
      `</details>`;
  };
  $("#nav").innerHTML = `<button data-id="sim" class="navtool">Combat Simulator<span>tool</span></button>` +
    Object.entries(realms).map(([r,fs]) => `<div class="realm">${r}</div>` + Object.keys(fs).sort((a,b)=>(a==="Imperium"?-1:b==="Imperium"?1:a.localeCompare(b))).map(f=>fac(f, fs[f])).join("")).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ $("#q").value=""; showLib(b.dataset.id); });
  const entries = LIBS.reduce((n,l)=>n+(l.kind==="template"?0:l.count),0);
  const tmpl = LIBS.filter(l=>l.kind==="template").length;
  $("#stats").textContent = `${LIBS.length} libraries · ${entries} entries · ${tmpl} templates`;
}
function markNav(id){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.id===id));
  const cur = document.querySelector(`nav button[data-id="${CSS.escape(id)}"]`);
  const d = cur && cur.closest("details"); if(d) d.open = true;
}
function fmtPtsPlain(p){ return p+" pts"; }

/*__SIM__*/

buildNav();
let tmr; $("#q").addEventListener("input", e=>{ clearTimeout(tmr); tmr=setTimeout(()=>search(e.target.value),150); });
$("#menubtn").onclick = ()=>{ const s=$("#side"); s.classList.toggle("open"); $("#menubtn").setAttribute("aria-expanded", s.classList.contains("open")); };
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(h && h!==current && (h==="sim"||LIBS.some(l=>l.id===h))) showLib(h); });
const start = (location.hash||"").slice(1);
showLib(start==="sim"||LIBS.some(l=>l.id===start) ? start : (LIBS.find(l=>l.id.includes("las-weapons"))||LIBS[0]).id);
</script>
